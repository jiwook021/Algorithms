<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" fill="black">8. Matrix Output Format</text>
  <rect x="50" y="100" width="1100" height="600" fill="lightgray" stroke="black"/>
  <text x="70" y="150" font-size="20" fill="black">Matrix_print Output</text>
  <line x1="70" y1="170" x2="1100" y2="170" stroke="black"/>
  <text x="70" y="200" font-size="16" fill="black">- First line: width height</text>
  <text x="70" y="250" font-size="16" fill="black">- Subsequent lines: matrix rows</text>
  <text x="70" y="300" font-size="16" fill="black">- Each element followed by a space</text>
  <text x="70" y="350" font-size="16" fill="black">- Each row followed by a newline</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">Rotation Algorithms:</text>
  <text x="70" y="180" font-size="16" fill="black">1. Rotate Left (Counterclockwise):</text>
  <text x="90" y="220" font-size="14" fill="black">- Create auxiliary image</text>
  <text x="90" y="260" font-size="14" fill="black">- Map pixels from original to auxiliary</text>
  <text x="90" y="300" font-size="14" fill="black">- Copy back to original image</text>
  <text x="70" y="360" font-size="16" fill="black">2. Rotate Right (Clockwise):</text>
  <text x="90" y="400" font-size="14" fill="black">- Similar process as Rotate Left</text>
  <text x="90" y="440" font-size="14" fill="black">- Different pixel mapping logic</text>
</svg>
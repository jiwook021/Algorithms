<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">4. Image Structure</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">Image Structure Components</text>
  <text x="70" y="180" font-size="16" fill="black">1. Width: Stores the width of the image.</text>
  <text x="70" y="220" font-size="16" fill="black">2. Height: Stores the height of the image.</text>
  <text x="70" y="260" font-size="16" fill="black">3. Red Channel: Matrix for red color data.</text>
  <text x="70" y="300" font-size="16" fill="black">4. Green Channel: Matrix for green color data.</text>
  <text x="70" y="340" font-size="16" fill="black">5. Blue Channel: Matrix for blue color data.</text>
</svg>
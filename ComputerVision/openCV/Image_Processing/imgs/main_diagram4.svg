<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">4. Image Processing Pipeline</text>
  <rect x="50" y="80" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="120" font-size="20" fill="black">1. Load Image</text>
  <text x="70" y="160" font-size="20" fill="black">2. Convert to Grayscale</text>
  <text x="70" y="200" font-size="20" fill="black">3. Resize Image</text>
  <text x="70" y="240" font-size="20" fill="black">4. Apply Gaussian Blur</text>
  <text x="70" y="280" font-size="20" fill="black">5. Apply Thresholding</text>
  <text x="70" y="320" font-size="20" fill="black">6. Detect Edges (Canny)</text>
  <text x="70" y="360" font-size="20" fill="black">7. Rotate Image</text>
  <text x="70" y="400" font-size="20" fill="black">8. Display Results</text>
</svg>
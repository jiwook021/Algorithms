<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="120" font-size="20" fill="black">Main Workflow:</text>
  <text x="70" y="160" font-size="16" fill="black">1. Parse command line arguments</text>
  <text x="70" y="190" font-size="16" fill="black">2. Load input image using stb_image</text>
  <text x="70" y="220" font-size="16" fill="black">3. Apply Gaussian blur (if sigma provided)</text>
  <text x="70" y="250" font-size="16" fill="black">4. Save output image using stb_image_write</text>
  <text x="70" y="280" font-size="16" fill="black">5. Handle errors and exceptions</text>
</svg>
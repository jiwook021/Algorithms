<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">8. Save() Function Workflow</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="20" fill="black">Save() Workflow:</text>
  <text x="70" y="160" font-size="16" fill="black">1. Takes a filename as input</text>
  <text x="70" y="200" font-size="16" fill="black">2. Uses stb_image_write.h to save the image</text>
  <text x="70" y="240" font-size="16" fill="black">3. Returns true on success, false on failure</text>
</svg>
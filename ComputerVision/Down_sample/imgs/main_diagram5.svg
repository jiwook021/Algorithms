<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">5. Error Handling Mechanism</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="20" fill="black">Error Handling:</text>
  <text x="70" y="160" font-size="16" fill="black">1. try-catch block in main()</text>
  <text x="70" y="200" font-size="16" fill="black">2. Catches std::exception</text>
  <text x="70" y="240" font-size="16" fill="black">3. Outputs error message to std::cerr</text>
  <text x="70" y="280" font-size="16" fill="black">4. Returns -1 on error</text>
</svg>
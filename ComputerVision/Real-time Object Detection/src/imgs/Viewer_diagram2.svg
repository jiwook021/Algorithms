<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="18" fill="black">Frame Processing</text>
  <rect x="70" y="160" width="1060" height="520" fill="#e0e0e0" stroke="black" stroke-width="1"/>
  <text x="90" y="200" font-size="16" fill="black">1. Frame Validation: Check if frame is empty</text>
  <text x="90" y="230" font-size="16" fill="black">2. Frame Cloning: Create a copy for drawing</text>
  <text x="90" y="260" font-size="16" fill="black">3. Detection Drawing: Draw bounding boxes</text>
  <text x="90" y="290" font-size="16" fill="black">4. Track Drawing: Draw object paths</text>
  <text x="90" y="320" font-size="16" fill="black">5. FPS Display: Show FPS if enabled</text>
</svg>
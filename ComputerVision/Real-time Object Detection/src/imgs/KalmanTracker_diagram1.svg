<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="110" font-size="18" fill="black">1. Initialize KalmanTracker with parameters</text>
  <text x="70" y="140" font-size="18" fill="black">2. Update tracks with new detections</text>
  <text x="70" y="170" font-size="18" fill="black">3. Predict new locations using Kalman Filter</text>
  <text x="70" y="200" font-size="18" fill="black">4. Compute cost matrix for detection-track assignment</text>
  <text x="70" y="230" font-size="18" fill="black">5. Assign detections to tracks based on IoU</text>
  <text x="70" y="260" font-size="18" fill="black">6. Update track states and return results</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="80" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="120" font-size="18" fill="black">Input Image (BGR) → Grayscale Image</text>
  <text x="70" y="160" font-size="18" fill="black">Grayscale Image → Sobel X & Y</text>
  <text x="70" y="200" font-size="18" fill="black">Sobel X & Y → Absolute Sobel X & Y</text>
  <text x="70" y="240" font-size="18" fill="black">Absolute Sobel X & Y → Combined Sobel</text>
  <text x="70" y="280" font-size="18" fill="black">Combined Sobel → Thresholded Image</text>
  <text x="70" y="320" font-size="18" fill="black">Thresholded Image → Display</text>
  <line x1="70" y1="100" x2="70" y2="360" stroke="black" stroke-width="2"/>
  <line x1="70" y1="100" x2="1100" y2="100" stroke="black" stroke-width="2"/>
  <line x1="1100" y1="100" x2="1100" y2="360" stroke="black" stroke-width="2"/>
  <line x1="70" y1="360" x2="1100" y2="360" stroke="black" stroke-width="2"/>
</svg>
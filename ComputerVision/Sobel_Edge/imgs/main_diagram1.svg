<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="80" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="120" font-size="18" fill="black">1. Read Input Image</text>
  <text x="70" y="160" font-size="18" fill="black">2. Convert to Grayscale</text>
  <text x="70" y="200" font-size="18" fill="black">3. Apply Sobel Filter (X & Y)</text>
  <text x="70" y="240" font-size="18" fill="black">4. Combine Sobel Results</text>
  <text x="70" y="280" font-size="18" fill="black">5. Apply Thresholding</text>
  <text x="70" y="320" font-size="18" fill="black">6. Display Results</text>
  <text x="70" y="360" font-size="18" fill="black">7. Wait for Key Press</text>
  <text x="70" y="400" font-size="18" fill="black">8. Clean Up Windows</text>
  <line x1="70" y1="100" x2="70" y2="420" stroke="black" stroke-width="2"/>
  <line x1="70" y1="100" x2="1100" y2="100" stroke="black" stroke-width="2"/>
  <line x1="1100" y1="100" x2="1100" y2="420" stroke="black" stroke-width="2"/>
  <line x1="70" y1="420" x2="1100" y2="420" stroke="black" stroke-width="2"/>
</svg>
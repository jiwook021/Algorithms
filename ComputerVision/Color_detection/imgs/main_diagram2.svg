<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms or Processes</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="120" font-size="18" fill="black">- cv::imread: Loads image from file</text>
  <text x="70" y="160" font-size="18" fill="black">- cv::cvtColor: Converts image to HSV</text>
  <text x="70" y="200" font-size="18" fill="black">- cv::inRange: Creates color mask</text>
  <text x="70" y="240" font-size="18" fill="black">- cv::morphologyEx: Applies morphological operations</text>
  <text x="70" y="280" font-size="18" fill="black">- cv::findContours: Detects object contours</text>
  <text x="70" y="320" font-size="18" fill="black">- cv::boundingRect: Computes bounding boxes</text>
  <text x="70" y="360" font-size="18" fill="black">- cv::rectangle: Draws bounding boxes</text>
  <text x="70" y="400" font-size="18" fill="black">- cv::putText: Adds text annotations</text>
</svg>
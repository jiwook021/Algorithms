<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" fill="black">4. Function: detectHarrisCorners</text>
  <rect x="50" y="80" width="1100" height="600" fill="lightgray" stroke="black"/>
  <text x="70" y="120" font-size="20" fill="black">Input: Grayscale Image</text>
  <text x="70" y="160" font-size="20" fill="black">Output: Detected Corners (Coordinates)</text>
  <text x="70" y="200" font-size="20" fill="black">Steps:</text>
  <text x="70" y="240" font-size="20" fill="black">1. Compute Gradient (Sobel Operator)</text>
  <text x="70" y="280" font-size="20" fill="black">2. Compute Structure Tensor</text>
  <text x="70" y="320" font-size="20" fill="black">3. Compute Harris Response</text>
  <text x="70" y="360" font-size="20" fill="black">4. Thresholding and Non-Maximum Suppression</text>
</svg>
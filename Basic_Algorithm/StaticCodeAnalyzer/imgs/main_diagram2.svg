<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#f0f0f0"/>
    <text x="50" y="50" font-size="24" font-family="Arial" fill="black">2. Key Algorithms</text>
    <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
    <text x="70" y="110" font-size="18" font-family="Arial" fill="black">- File Parsing: Read and split source files into lines</text>
    <text x="70" y="140" font-size="18" font-family="Arial" fill="black">- Rule Application: Apply analysis rules to each file</text>
    <text x="70" y="170" font-size="18" font-family="Arial" fill="black">- Issue Detection: Regex-based pattern matching for code issues</text>
    <text x="70" y="200" font-size="18" font-family="Arial" fill="black">- Reporting: Aggregate and output detected issues</text>
</svg>
  <line x1="250" y1="200" x2="350" y2="200" stroke="black"/>
  <text x="370" y="205" font-size="16" fill="black">Call</text>
  <ellipse cx="450" cy="200" rx="100" ry="50" fill="#cce5ff" stroke="black"/>
  <text x="420" y="205" font-size="16" fill="black">reversebit(12)</text>
  <line x1="550" y1="200" x2="650" y2="200" stroke="black"/>
  <text x="670" y="205" font-size="16" fill="black">Return</text>
  <ellipse cx="750" cy="200" rx="100" ry="50" fill="#cce5ff" stroke="black"/>

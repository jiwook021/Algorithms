<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="20" fill="black">Data Flow in reversebit()</text>
  <ellipse cx="150" cy="200" rx="100" ry="50" fill="#cce5ff" stroke="black"/>
  <text x="120" y="205" font-size="16" fill="black">Input</text>
  <line x1="250" y1="200" x2="350" y2="200" stroke="black"/>
  <text x="370" y="205" font-size="16" fill="black">Process</text>
  <ellipse cx="450" cy="200" rx="100" ry="50" fill="#cce5ff" stroke="black"/>
  <text x="420" y="205" font-size="16" fill="black">Output</text>
  <text x="70" y="300" font-size="20" fill="black">State Transitions in bitExtracted()</text>
  <ellipse cx="150" cy="400" rx="100" ry="50" fill="#cce5ff" stroke="black"/>

<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="150" font-size="20" fill="black">1. ctof() Function</text>
  <text x="100" y="200" font-size="16" fill="black">- Converts Celsius to Fahrenheit</text>
  <text x="100" y="250" font-size="16" fill="black">- Formula: (9.0 / 5) * x + 32</text>
  <text x="100" y="300" font-size="20" fill="black">2. ftoc() Function</text>
  <text x="100" y="350" font-size="16" fill="black">- Converts Fahrenheit to Celsius</text>
  <text x="100" y="400" font-size="16" fill="black">- Formula: 5.0 / 9 * (x - 32)</text>
</svg>
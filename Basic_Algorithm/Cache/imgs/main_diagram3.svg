<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow in LRUCache</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="100" y="150" font-size="20" fill="black">Data Flow During get(key)</text>
  <rect x="100" y="180" width="1000" height="150" fill="#e0e0e0" stroke="black"/>
  <text x="120" y="230" font-size="16" fill="black">1. Key is looked up in m_cache</text>
  <text x="120" y="260" font-size="16" fill="black">2. Iterator is used to access m_items</text>
  <text x="120" y="290" font-size="16" fill="black">3. Item is moved to front of m_items</text>
  <text x="100" y="350" font-size="20" fill="black">Data Flow During put(key, value)</text>
  <rect x="100" y="380" width="1000" height="200" fill="#e0e0e0" stroke="black"/>
  <text x="120" y="430" font-size="16" fill="black">1. Key is checked in m_cache</text>
  <text x="120" y="460" font-size="16" fill="black">2. If cache is full, last item in m_items is removed</text>
  <text x="120" y="490" font-size="16" fill="black">3. New item is added to front of m_items</text>
  <text x="120" y="520" font-size="16" fill="black">4. m_cache is updated with new iterator</text>
</svg>
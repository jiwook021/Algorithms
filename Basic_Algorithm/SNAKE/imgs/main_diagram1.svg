<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="100" font-size="20" fill="black">1. Initialize variables and data structures</text>
  <text x="70" y="130" font-size="20" fill="black">2. Read input (map, commands)</text>
  <text x="70" y="160" font-size="20" fill="black">3. Execute the main loop (snake movement)</text>
  <text x="70" y="190" font-size="20" fill="black">4. Handle commands and update snake position</text>
  <text x="70" y="220" font-size="20" fill="black">5. Check for collisions and update map</text>
  <text x="70" y="250" font-size="20" fill="black">6. Return the total time elapsed</text>
</svg>
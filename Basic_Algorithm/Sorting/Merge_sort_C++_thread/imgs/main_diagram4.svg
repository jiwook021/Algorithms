<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">4. Parallel Execution</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">Parallel Execution Flow</text>
  <text x="70" y="180" font-size="16" fill="black">1. Thread Creation: Using std::async</text>
  <text x="70" y="220" font-size="16" fill="black">2. Task Distribution: Split work among threads</text>
  <text x="70" y="260" font-size="16" fill="black">3. Synchronization: Wait for all threads</text>
  <text x="70" y="300" font-size="16" fill="black">4. Result Aggregation: Merge results</text>

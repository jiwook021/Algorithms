<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">Parallel Merge Sort</text>
  <text x="70" y="180" font-size="16" fill="black">1. Divide: Split data into halves</text>
  <text x="70" y="220" font-size="16" fill="black">2. Conquer: Sort each half in parallel</text>
  <text x="70" y="260" font-size="16" fill="black">3. Merge: Combine sorted halves</text>
  <text x="70" y="300" font-size="16" fill="black">4. Depth Control: Limit recursion depth</text>
</svg>
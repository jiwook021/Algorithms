<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">Insertionsort()</text>
  <text x="70" y="170" font-size="16" fill="black">- Iterates through the array</text>
  <text x="70" y="200" font-size="16" fill="black">- Compares and shifts elements</text>
  <text x="70" y="230" font-size="16" fill="black">- Inserts the current element in the correct position</text>
  <text x="70" y="260" font-size="16" fill="black">- Time complexity: O(n^2)</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="110" font-size="18" fill="black">1. Array Creation: Empty → Filled with Random Numbers</text>
  <text x="70" y="140" font-size="18" fill="black">2. MergeSort: Unsorted Array → Sorted Array</text>
  <text x="70" y="170" font-size="18" fill="black">3. MergeTwoArea: Two Sorted Subarrays → One Sorted Array</text>
  <text x="70" y="200" font-size="18" fill="black">4. Execution Time: Start Time → End Time → Calculated Duration</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="110" font-size="18" fill="black">1. Start Program</text>
  <text x="70" y="140" font-size="18" fill="black">2. Initialize Random Seed</text>
  <text x="70" y="170" font-size="18" fill="black">3. Create Array of Random Numbers</text>
  <text x="70" y="200" font-size="18" fill="black">4. Print Array Before Sorting</text>
  <text x="70" y="230" font-size="18" fill="black">5. Perform Merge Sort</text>
  <text x="70" y="260" font-size="18" fill="black">6. Print Array After Sorting</text>
  <text x="70" y="290" font-size="18" fill="black">7. Calculate and Print Execution Time</text>
  <text x="70" y="320" font-size="18" fill="black">8. End Program</text>
</svg>
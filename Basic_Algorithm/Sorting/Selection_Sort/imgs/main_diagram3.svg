<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">Initial State: [3, 4, 2, 1]</text>
  <text x="70" y="170" font-size="16" fill="black">After 1st Iteration: [1, 4, 2, 3]</text>
  <text x="70" y="200" font-size="16" fill="black">After 2nd Iteration: [1, 2, 4, 3]</text>
  <text x="70" y="230" font-size="16" fill="black">After 3rd Iteration: [1, 2, 3, 4]</text>
  <text x="70" y="260" font-size="16" fill="black">Final State: [1, 2, 3, 4]</text>

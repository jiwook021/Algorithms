<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">6. Memory Usage (tmp array)</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="18" fill="black">1. tmp array is initialized in Mergesort()</text>
  <text x="70" y="170" font-size="18" fill="black">2. tmp array is used in merge() to store copies of arr</text>
  <text x="70" y="200" font-size="18" fill="black">3. Elements are copied from tmp back to arr in sorted order</text>
</svg>
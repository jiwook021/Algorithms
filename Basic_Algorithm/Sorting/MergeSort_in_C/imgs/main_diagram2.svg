<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms or Processes</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="18" fill="black">Merge Sort Algorithm:</text>
  <text x="90" y="170" font-size="18" fill="black">1. Split array into two halves</text>
  <text x="90" y="200" font-size="18" fill="black">2. Recursively sort each half</text>
  <text x="90" y="230" font-size="18" fill="black">3. Merge the two sorted halves</text>
  <text x="70" y="270" font-size="18" fill="black">Merge Function:</text>
  <text x="90" y="300" font-size="18" fill="black">1. Copy elements to tmp array</text>
  <text x="90" y="330" font-size="18" fill="black">2. Compare and merge elements from tmp to arr</text>
</svg>
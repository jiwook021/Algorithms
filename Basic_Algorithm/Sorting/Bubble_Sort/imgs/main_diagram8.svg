<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">8. Program Termination</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">Program Termination Process</text>
  <rect x="70" y="160" width="200" height="50" fill="#d3f8d3" stroke="black"/>
  <text x="80" y="190" font-size="16" fill="black">Return 0 to Indicate Success</text>
  <rect x="70" y="220" width="200" height="50" fill="#d3f8d3" stroke="black"/>
  <text x="80" y="250" font-size="16" fill="black">Release Allocated Memory</text>
  <rect x="70" y="280" width="200" height="50" fill="#d3f8d3" stroke="black"/>
  <text x="80" y="310" font-size="16" fill="black">Exit Program</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">Main Function</text>
  <rect x="70" y="160" width="200" height="50" fill="#d3f8d3" stroke="black"/>
  <text x="80" y="190" font-size="16" fill="black">Initialize Clock</text>
  <rect x="70" y="220" width="200" height="50" fill="#d3f8d3" stroke="black"/>
  <text x="80" y="250" font-size="16" fill="black">Seed Random Number</text>
  <rect x="70" y="280" width="200" height="50" fill="#d3f8d3" stroke="black"/>
  <text x="80" y="310" font-size="16" fill="black">Create Array</text>
  <rect x="70" y="340" width="200" height="50" fill="#d3f8d3" stroke="black"/>
  <text x="80" y="370" font-size="16" fill="black">Fill Array with Random Numbers</text>
  <rect x="70" y="400" width="200" height="50" fill="#d3f8d3" stroke="black"/>
  <text x="80" y="430" font-size="16" fill="black">Print Array (Before Sort)</text>
  <rect x="70" y="460" width="200" height="50" fill="#d3f8d3" stroke="black"/>
  <text x="80" y="490" font-size="16" fill="black">Sort Array</text>
  <rect x="70" y="520" width="200" height="50" fill="#d3f8d3" stroke="black"/>
  <text x="80" y="550" font-size="16" fill="black">Print Array (After Sort)</text>
  <rect x="70" y="580" width="200" height="50" fill="#d3f8d3" stroke="black"/>
  <text x="80" y="610" font-size="16" fill="black">Calculate & Print Time Taken</text>
</svg>
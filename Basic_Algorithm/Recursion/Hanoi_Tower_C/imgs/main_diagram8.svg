  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">Recursion Depth in Hanoi</text>
  <ellipse cx="200" cy="300" rx="150" ry="80" fill="#ccffff" stroke="black"/>
  <text x="120" y="310" font-size="18" fill="black">Depth = N</text>

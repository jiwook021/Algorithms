<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">4. Memory Management</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">Static Functions</text>
  <text x="70" y="180" font-size="16" fill="black">- All functions are static, limiting scope to this file</text>
  <text x="70" y="220" font-size="20" fill="black">String Buffers</text>
  <text x="70" y="260" font-size="16" fill="black">- str1 and str2 are fixed-size arrays (50 chars)</text>
  <text x="70" y="300" font-size="16" fill="black">- No dynamic memory allocation used</text>
</svg>
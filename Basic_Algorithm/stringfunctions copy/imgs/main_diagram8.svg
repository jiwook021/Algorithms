<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">8. Control Flow</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">main()</text>
  <text x="70" y="180" font-size="16" fill="black">- Calls functions sequentially</text>
  <text x="70" y="220" font-size="16" fill="black">- No conditional logic or loops</text>
  <text x="70" y="260" font-size="20" fill="black">Functions</text>
  <text x="70" y="300" font-size="16" fill="black">- Use loops to process strings</text>
  <text x="70" y="340" font-size="16" fill="black">- No branching or recursion</text>
</svg>
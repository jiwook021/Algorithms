<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="100" font-size="18" fill="black">- str1 and str2 are initialized in main().</text>
  <text x="70" y="130" font-size="18" fill="black">- my_strcpy modifies str1 using str2.</text>
  <text x="70" y="160" font-size="18" fill="black">- my_strrev modifies str1 by reversing it.</text>
  <text x="70" y="190" font-size="18" fill="black">- my_strcmp compares str1 and str2.</text>
  <text x="70" y="220" font-size="18" fill="black">- my_strcat appends str2 to str1.</text>
</svg>
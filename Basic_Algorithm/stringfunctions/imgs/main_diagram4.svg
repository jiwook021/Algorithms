<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">4. my_strlen Function</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="100" font-size="18" fill="black">- Input: String (char*).</text>
  <text x="70" y="130" font-size="18" fill="black">- Output: Length of string (int).</text>
  <text x="70" y="160" font-size="18" fill="black">- Process: Iterates through string until null terminator is found.</text>
</svg>
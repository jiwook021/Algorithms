<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="110" font-size="20" fill="black">Tokenization Process</text>
  <text x="70" y="140" font-size="16" fill="black">- Input: Source Code</text>
  <text x="70" y="170" font-size="16" fill="black">- Output: Tokens</text>
  <text x="70" y="200" font-size="16" fill="black">- Steps: Character Scanning, Lexeme Extraction</text>
  <text x="70" y="230" font-size="20" fill="black">Keyword Detection</text>
  <text x="70" y="260" font-size="16" fill="black">- Input: Lexeme</text>
  <text x="70" y="290" font-size="16" fill="black">- Output: TokenType</text>
  <text x="70" y="320" font-size="16" fill="black">- Steps: String Comparison</text>
</svg>
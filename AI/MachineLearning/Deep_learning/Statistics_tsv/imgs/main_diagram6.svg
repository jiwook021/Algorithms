<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">6. Statistical Calculations</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="18" fill="black">Statistical Calculations:</text>
  <text x="70" y="160" font-size="16" fill="black">1. count: Number of data points</text>
  <text x="70" y="190" font-size="16" fill="black">2. sum: Total sum of data</text>
  <text x="70" y="220" font-size="16" fill="black">3. mean: Average value</text>
  <text x="70" y="250" font-size="16" fill="black">4. stdev: Standard deviation</text>
  <text x="70" y="280" font-size="16" fill="black">5. median: Middle value</text>
  <text x="70" y="310" font-size="16" fill="black">6. mode: Most frequent value</text>
  <text x="70" y="340" font-size="16" fill="black">7. min/max: Minimum and maximum values</text>
  <text x="70" y="370" font-size="16" fill="black">8. percentile: Specific percentiles (0th, 25th, 50th, 75th, 100th)</text>
</svg>
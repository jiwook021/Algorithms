<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="100" y="150" font-size="20" fill="black">Input Vector</text>
  <rect x="100" y="170" width="200" height="50" fill="#d3d3d3" stroke="black"/>
  <text x="120" y="200" font-size="16" fill="black">vector<double> v</text>
  <text x="400" y="150" font-size="20" fill="black">Functions</text>
  <rect x="400" y="170" width="200" height="50" fill="#d3d3d3" stroke="black"/>
  <text x="420" y="200" font-size="16" fill="black">count(v)</text>
  <rect x="400" y="250" width="200" height="50" fill="#d3d3d3" stroke="black"/>
  <text x="420" y="280" font-size="16" fill="black">sum(v)</text>
  <rect x="400" y="330" width="200" height="50" fill="#d3d3d3" stroke="black"/>
  <text x="420" y="360" font-size="16" fill="black">mean(v)</text>
  <text x="700" y="150" font-size="20" fill="black">Output</text>
  <rect x="700" y="170" width="200" height="50" fill="#d3d3d3" stroke="black"/>
  <text x="720" y="200" font-size="16" fill="black">Results</text>
  <line x1="300" y1="195" x2="400" y2="195" stroke="black"/>
  <line x1="600" y1="195" x2="700" y2="195" stroke="black"/>
</svg>
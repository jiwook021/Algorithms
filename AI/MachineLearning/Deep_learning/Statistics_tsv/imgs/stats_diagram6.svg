<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">6. Loop in sum(v)</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="100" y="150" font-size="20" fill="black">Loop through v</text>
  <rect x="100" y="170" width="200" height="50" fill="#d3d3d3" stroke="black"/>
  <text x="120" y="200" font-size="16" fill="black">for (size_t i = 0; i < v.size(); ++i)</text>
  <text x="400" y="150" font-size="20" fill="black">Accumulate Sum</text>
  <rect x="400" y="170" width="200" height="50" fill="#d3d3d3" stroke="black"/>
  <text x="420" y="200" font-size="16" fill="black">sum_number += v.at(i)</text>
</svg>
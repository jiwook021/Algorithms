<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms or Processes</text>
  <rect x="100" y="100" width="1000" height="600" fill="white" stroke="black"/>
  <text x="150" y="150" font-size="20" fill="black">ThreadPool Worker Loop</text>
  <rect x="150" y="200" width="900" height="400" fill="#d3d3d3" stroke="black"/>
  <text x="170" y="250" font-size="16" fill="black">1. Worker waits for a task or stop signal</text>
  <text x="170" y="300" font-size="16" fill="black">2. If stop signal and queue is empty, exit</text>
  <text x="170" y="350" font-size="16" fill="black">3. Otherwise, fetch task from queue</text>
  <text x="170" y="400" font-size="16" fill="black">4. Execute the task</text>
  <text x="170" y="450" font-size="16" fill="black">5. Repeat the loop</text>
</svg>
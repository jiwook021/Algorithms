<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" font-weight="bold">3. Data Flow</text>
  <rect x="50" y="80" width="1100" height="700" stroke="black" fill="none"/>
  <text x="100" y="120" font-size="20">Input Data</text>
  <rect x="100" y="130" width="1000" height="100" stroke="black" fill="none"/>
  <text x="120" y="170" font-size="16">- Batch of Images</text>
  <text x="120" y="200" font-size="16">- Shape: (batch_size, 3, 32, 32)</text>
  <text x="100" y="250" font-size="20">Convolutional Layers</text>
  <rect x="100" y="260" width="1000" height="100" stroke="black" fill="none"/>
  <text x="120" y="300" font-size="16">- Conv1: 3x3, 16 filters</text>
  <text x="120" y="330" font-size="16">- Conv2: 3x3, 32 filters</text>
  <text x="100" y="380" font-size="20">Fully Connected Layers</text>
  <rect x="100" y="390" width="1000" height="100" stroke="black" fill="none"/>
  <text x="120" y="430" font-size="16">- FC1: 128 neurons</text>
  <text x="120" y="460" font-size="16">- FC2: num_classes neurons</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="50" y="50" font-size="24" font-weight="bold">3. Data Flow & State Transitions</text>
    <rect x="50" y="70" width="1100" height="700" fill="#ffffff" stroke="#000000"/>
    <text x="70" y="110" font-size="18">1. Raw Images → Transformed Images (Preprocessing)</text>
    <text x="70" y="140" font-size="18">2. Training Data → Model → Predictions</text>
    <text x="70" y="170" font-size="18">3. Predictions → Loss Calculation → Gradients</text>
    <text x="70" y="200" font-size="18">4. Gradients → Model Updates (Backpropagation)</text>
    <line x1="70" y1="220" x2="1100" y2="220" stroke="#000000"/>
    <text x="70" y="250" font-size="18">State: Model Weights, Optimizer State</text>
    <text x="70" y="280" font-size="18">Flow: Batch-wise Processing</text>
</svg>
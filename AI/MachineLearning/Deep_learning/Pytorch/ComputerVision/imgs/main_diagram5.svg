  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" font-weight="bold">5. Object Detection</text>
  <rect x="50" y="80" width="1100" height="700" fill="#ffffff" stroke="#000000"/>
  <text x="70" y="120" font-size="18">Faster R-CNN Workflow:</text>
  <text x="70" y="150" font-size="16">1. Input image → Feature extraction</text>

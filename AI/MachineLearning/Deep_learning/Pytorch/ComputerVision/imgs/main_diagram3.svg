<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" font-weight="bold">3. Data Flow</text>
  <rect x="50" y="80" width="1100" height="700" fill="#ffffff" stroke="#000000"/>
  <text x="70" y="120" font-size="18">Data Flow:</text>
  <text x="70" y="150" font-size="16">1. Input image → Preprocessing → ResNet18 → Output</text>
  <text x="70" y="180" font-size="16">2. Input image → Faster R-CNN → Bounding boxes + Labels</text>
  <text x="70" y="210" font-size="16">3. Training data → DataLoader → Model → Loss → Backpropagation</text>
</svg>
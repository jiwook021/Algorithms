<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" font-weight="bold">5. Model Layers</text>
  <rect x="50" y="80" width="1100" height="700" fill="#ffffff" stroke="#000000"/>
  <text x="70" y="120" font-size="20">Model Layers in MNIST Classifier</text>
  <rect x="100" y="150" width="200" height="50" fill="#d3f8d3" stroke="#000000"/>
  <text x="110" y="180" font-size="16">Conv1</text>
  <rect x="350" y="150" width="200" height="50" fill="#d3f8d3" stroke="#000000"/>
  <text x="360" y="180" font-size="16">BN1</text>
  <rect x="600" y="150" width="200" height="50" fill="#d3f8d3" stroke="#000000"/>
  <text x="610" y="180" font-size="16">Pool1</text>
  <rect x="850" y="150" width="200" height="50" fill="#d3f8d3" stroke="#000000"/>
  <text x="860" y="180" font-size="16">Conv2</text>
  <rect x="100" y="250" width="200" height="50" fill="#d3f8d3" stroke="#000000"/>

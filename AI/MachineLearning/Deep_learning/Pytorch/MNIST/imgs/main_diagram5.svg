  <rect x="350" y="250" width="200" height="50" fill="#d3f8d3" stroke="#000000"/>
  <text x="360" y="280" font-size="16">Pool2</text>
  <rect x="600" y="250" width="200" height="50" fill="#d3f8d3" stroke="#000000"/>
  <text x="610" y="280" font-size="16">FC1</text>
  <rect x="850" y="250" width="200" height="50" fill="#d3f8d3" stroke="#000000"/>

<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">7. Batch Normalization</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">Before BatchNorm</text>
  <rect x="70" y="160" width="200" height="50" fill="#d3f8d3" stroke="black"/>
  <text x="80" y="190" font-size="16" fill="black">Unnormalized Activations</text>
  <text x="300" y="140" font-size="20" fill="black">BatchNorm Applied</text>
  <rect x="300" y="160" width="200" height="50" fill="#d3f8d3" stroke="black"/>
  <text x="310" y="190" font-size="16" fill="black">Normalized Activations</text>
  <text x="530" y="140" font-size="20" fill="black">After BatchNorm</text>
  <rect x="530" y="160" width="200" height="50" fill="#d3f8d3" stroke="black"/>
  <text x="540" y="190" font-size="16" fill="black">Stable Training</text>
  <line x1="270" y1="185" x2="300" y2="185" stroke="black" stroke-width="2"/>
  <line x1="500" y1="185" x2="530" y2="185" stroke="black" stroke-width="2"/>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">5. Activation Functions</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="100" font-size="20" fill="black">Sigmoid</text>
  <rect x="100" y="120" width="300" height="100" fill="#d3f8d3" stroke="black"/>
  <text x="120" y="150" font-size="16" fill="black">f(x) = 1 / (1 + e^(-x))</text>
  <text x="70" y="250" font-size="20" fill="black">ReLU</text>
  <rect x="100" y="270" width="300" height="100" fill="#d3f8d3" stroke="black"/>
  <text x="120" y="300" font-size="16" fill="black">f(x) = max(0, x)</text>
  <text x="70" y="400" font-size="20" fill="black">Tanh</text>
  <rect x="100" y="420" width="300" height="100" fill="#d3f8d3" stroke="black"/>
  <text x="120" y="450" font-size="16" fill="black">f(x) = tanh(x)</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="100" font-size="20" fill="black">Input Data</text>
  <rect x="100" y="120" width="300" height="100" fill="#d3f8d3" stroke="black"/>
  <text x="120" y="150" font-size="16" fill="black">Input Layer</text>
  <line x1="250" y1="220" x2="250" y2="240" stroke="black"/>
  <rect x="100" y="240" width="300" height="100" fill="#d3f8d3" stroke="black"/>
  <text x="120" y="270" font-size="16" fill="black">Hidden Layer</text>
  <line x1="250" y1="340" x2="250" y2="360" stroke="black"/>
  <rect x="100" y="360" width="300" height="100" fill="#d3f8d3" stroke="black"/>

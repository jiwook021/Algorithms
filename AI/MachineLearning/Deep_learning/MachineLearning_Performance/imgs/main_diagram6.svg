<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">6. Mathematical Operations</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="100" font-size="18" fill="black">Mathematical Functions</text>
  <text x="70" y="130" font-size="14" fill="black">- Addition: a + b</text>
  <text x="70" y="160" font-size="14" fill="black">- Subtraction: a - b</text>
  <text x="70" y="190" font-size="14" fill="black">- Scalar Multiplication: a * k</text>
  <text x="70" y="220" font-size="14" fill="black">- Dot Product: Σ(a_i * b_i)</text>
  <text x="70" y="250" font-size="14" fill="black">- Mean: Σ(a_i) / n</text>
  <text x="70" y="280" font-size="14" fill="black">- Variance: Σ((a_i - mean)^2) / n</text>
  <text x="70" y="310" font-size="14" fill="black">- Standard Deviation: √(variance)</text>
  <text x="70" y="340" font-size="14" fill="black">- Correlation: Σ((a_i - mean_a)(b_i - mean_b)) / (std_a * std_b)</text>
</svg>
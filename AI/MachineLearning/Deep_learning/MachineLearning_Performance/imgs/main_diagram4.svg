<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">4. Vector Class Structure</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="100" font-size="18" fill="black">Class Members</text>
  <text x="70" y="130" font-size="14" fill="black">- data: std::vector<double></text>
  <text x="70" y="160" font-size="14" fill="black">- size(): Returns size of vector</text>
  <text x="70" y="190" font-size="14" fill="black">- operator[]: Access elements</text>
  <text x="70" y="220" font-size="14" fill="black">- operator+: Vector addition</text>
  <text x="70" y="250" font-size="14" fill="black">- operator-: Vector subtraction</text>
  <text x="70" y="280" font-size="14" fill="black">- operator*: Scalar multiplication</text>
  <text x="70" y="310" font-size="14" fill="black">- dot(): Dot product</text>
  <text x="70" y="340" font-size="14" fill="black">- mean(): Mean of elements</text>
  <text x="70" y="370" font-size="14" fill="black">- variance(): Variance of elements</text>
  <text x="70" y="400" font-size="14" fill="black">- std_dev(): Standard deviation</text>
  <text x="70" y="430" font-size="14" fill="black">- correlation(): Pearson correlation</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="100" font-size="18" fill="black">State Transitions</text>
  <text x="70" y="130" font-size="14" fill="black">1. Input data → Vector object</text>
  <text x="70" y="160" font-size="14" fill="black">2. Vector object → Operations (e.g., addition, subtraction)</text>
  <text x="70" y="190" font-size="14" fill="black">3. Operations → Resultant Vector object</text>
  <text x="70" y="220" font-size="14" fill="black">4. Resultant Vector object → Statistics (e.g., mean, variance)</text>
  <text x="70" y="250" font-size="14" fill="black">5. Statistics → Output</text>
</svg>
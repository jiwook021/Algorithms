<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">7. Memory Management</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="100" font-size="18" fill="black">Memory Usage</text>
  <text x="70" y="130" font-size="14" fill="black">- Vector data stored in std::vector<double></text>
  <text x="70" y="160" font-size="14" fill="black">- Automatic memory management by std::vector</text>
  <text x="70" y="190" font-size="14" fill="black">- No manual memory allocation/deallocation</text>
  <text x="70" y="220" font-size="14" fill="black">- Efficient memory usage for large vectors</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="110" font-size="18" fill="black">1. Start</text>
  <text x="70" y="150" font-size="18" fill="black">2. Check if dataset is empty</text>
  <text x="70" y="190" font-size="18" fill="black">3. Reset statistics</text>
  <text x="70" y="230" font-size="18" fill="black">4. Compute min, max, and mean</text>
  <text x="70" y="270" font-size="18" fill="black">5. Compute standard deviation (if ZScore)</text>
  <text x="70" y="310" font-size="18" fill="black">6. Finalize standard deviations</text>
  <text x="70" y="350" font-size="18" fill="black">7. End</text>
</svg>
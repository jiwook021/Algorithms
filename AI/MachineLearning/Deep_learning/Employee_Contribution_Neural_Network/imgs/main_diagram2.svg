<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="110" font-size="18" fill="black">1. Reset statistics: Initialize min, max, mean, stdDev</text>
  <text x="70" y="150" font-size="18" fill="black">2. Compute min, max, mean: Iterate through employees</text>
  <text x="70" y="190" font-size="18" fill="black">3. Compute stdDev: Calculate squared differences</text>
  <text x="70" y="230" font-size="18" fill="black">4. Normalize values: Min-Max or ZScore</text>
</svg>
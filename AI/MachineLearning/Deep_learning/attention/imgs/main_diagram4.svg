<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">4. Matrix Multiplication Process</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="100" font-size="18" fill="black">- Loop over rows of Matrix A</text>
  <text x="70" y="130" font-size="18" fill="black">- Loop over columns of Matrix B</text>
  <text x="70" y="160" font-size="18" fill="black">- Accumulate product in Result Matrix</text>
  <text x="70" y="190" font-size="18" fill="black">- Time Complexity: O(n * m * p)</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" font-weight="bold">7. Data Augmentation</text>
  <rect x="50" y="70" width="1100" height="700" fill="#ffffff" stroke="#000000"/>
  <text x="70" y="110" font-size="18">1. Random Rotation</text>
  <text x="70" y="140" font-size="18">2. Random Translation</text>
  <text x="70" y="170" font-size="18">3. Random Scaling</text>
  <line x1="70" y1="180" x2="1100" y2="180" stroke="#000000"/>
  <text x="70" y="220" font-size="18">Random Rotation: Rotate images by a random angle</text>
  <text x="70" y="250" font-size="18">Random Translation: Shift images randomly</text>
  <text x="70" y="280" font-size="18">Random Scaling: Resize images randomly</text>
</svg>
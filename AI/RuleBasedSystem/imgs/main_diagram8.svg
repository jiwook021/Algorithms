<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">8. Inference Engine Workflow</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="110" font-size="18" fill="black">Inference Engine:</text>
  <text x="70" y="140" font-size="16" fill="black">1. Load Facts and Rules</text>
  <text x="70" y="170" font-size="16" fill="black">2. Evaluate Rules</text>
  <text x="70" y="200" font-size="16" fill="black">3. Derive New Facts</text>
  <text x="70" y="230" font-size="16" fill="black">4. Repeat Until No New Facts</text>
</svg>
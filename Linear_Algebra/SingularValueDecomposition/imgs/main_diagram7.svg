<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">7. Time and Space Complexity</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="110" font-size="20" fill="black">Complexity Analysis</text>
  <rect x="70" y="130" width="1060" height="620" fill="#e0e0e0" stroke="black" stroke-width="1"/>
  <text x="90" y="170" font-size="18" fill="black">- Time Complexity: O(min(mn², m²n))</text>
  <text x="90" y="200" font-size="18" fill="black">- Space Complexity: O(mn + m² + n²)</text>
  <text x="90" y="230" font-size="18" fill="black">- dotProduct: O(n)</text>
  <text x="90" y="260" font-size="18" fill="black">- normalize: O(n)</text>
  <text x="90" y="290" font-size="18" fill="black">- transpose: O(m*n)</text>
</svg>
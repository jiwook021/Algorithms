<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture of SVD Class</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="110" font-size="20" fill="black">SVD Class</text>
  <rect x="70" y="130" width="1060" height="620" fill="#e0e0e0" stroke="black" stroke-width="1"/>
  <text x="90" y="170" font-size="18" fill="black">- U: Left Singular Vectors</text>
  <text x="90" y="200" font-size="18" fill="black">- S: Singular Values</text>
  <text x="90" y="230" font-size="18" fill="black">- V: Right Singular Vectors</text>
  <text x="90" y="260" font-size="18" fill="black">- m, n: Matrix Dimensions</text>
  <text x="90" y="290" font-size="18" fill="black">- epsilon: Numerical Stability Threshold</text>
  <text x="90" y="320" font-size="18" fill="black">- mtx: Mutex for Thread Safety</text>
  <text x="90" y="350" font-size="18" fill="black">- Methods: dotProduct, normalize, transpose, etc.</text>
</svg>
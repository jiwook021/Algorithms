<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">5. Time Complexity</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="100" font-size="18" fill="black">1. dotProduct: O(n)</text>
  <text x="70" y="130" font-size="18" fill="black">2. norm: O(n)</text>
  <text x="70" y="160" font-size="18" fill="black">3. scalarMultiply: O(n)</text>
  <text x="70" y="190" font-size="18" fill="black">4. subtractVectors: O(n)</text>
  <text x="70" y="220" font-size="18" fill="black">5. Gram-Schmidt: O(n^2)</text>
</svg>
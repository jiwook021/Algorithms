<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" font-weight="bold">2. Key Algorithms</text>
  <rect x="50" y="80" width="1100" height="600" fill="#ffffff" stroke="#000000"/>
  <text x="70" y="120" font-size="18">computePNorm Algorithm</text>
  <text x="70" y="150" font-size="14">1. Check if vector is empty</text>
  <text x="70" y="180" font-size="14">2. Handle infinity norm case</text>
  <text x="70" y="210" font-size="14">3. Compute sum of |x_i|^p for finite p</text>
  <text x="70" y="240" font-size="14">4. Return (sum)^(1/p)</text>
</svg>
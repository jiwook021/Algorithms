<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">8. Test Class Interaction</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">Test Class</text>
  <text x="70" y="180" font-size="16" fill="black">- Constructor: Prints construction message</text>
  <text x="70" y="220" font-size="16" fill="black">- Destructor: Prints destruction message</text>
  <text x="70" y="260" font-size="16" fill="black">- hello(): Prints greeting message</text>
  <text x="70" y="300" font-size="20" fill="black">UniquePtr Interaction</text>
  <text x="70" y="340" font-size="16" fill="black">- Manages Test objects</text>
  <text x="70" y="380" font-size="16" fill="black">- Demonstrates RAII with Test objects</text>

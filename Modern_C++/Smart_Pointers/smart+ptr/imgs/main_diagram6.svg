<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">6. Resource Management</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">Destructor</text>
  <text x="70" y="180" font-size="16" fill="black">- Deletes ptr when UniquePtr goes out of scope</text>
  <text x="70" y="220" font-size="20" fill="black">Reset Method</text>
  <text x="70" y="260" font-size="16" fill="black">- Deletes current ptr</text>
  <text x="70" y="300" font-size="16" fill="black">- Takes ownership of new ptr</text>
  <text x="70" y="340" font-size="20" fill="black">Release Method</text>
  <text x="70" y="380" font-size="16" fill="black">- Releases ownership of ptr</text>
  <text x="70" y="420" font-size="16" fill="black">- Returns raw pointer</text>
</svg>
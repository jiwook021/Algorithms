<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">Move Semantics</text>
  <text x="70" y="180" font-size="16" fill="black">- Move Constructor: Transfers ownership</text>
  <text x="70" y="220" font-size="16" fill="black">- Move Assignment: Transfers ownership and deletes old object</text>
  <text x="70" y="260" font-size="20" fill="black">Resource Management</text>
  <text x="70" y="300" font-size="16" fill="black">- Destructor: Deletes owned object</text>
  <text x="70" y="340" font-size="16" fill="black">- Reset: Replaces owned object</text>
  <text x="70" y="380" font-size="16" fill="black">- Release: Releases ownership</text>
</svg>
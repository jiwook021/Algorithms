<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow or State Transitions</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">Initialization</text>
  <rect x="70" y="160" width="1060" height="100" fill="#e0e0e0" stroke="black"/>
  <text x="80" y="200" font-size="16" fill="black">- ptr and ref_count initialized</text>
  <text x="70" y="280" font-size="20" fill="black">Copying</text>
  <rect x="70" y="300" width="1060" height="100" fill="#e0e0e0" stroke="black"/>
  <text x="80" y="340" font-size="16" fill="black">- ref_count incremented</text>
  <text x="70" y="420" font-size="20" fill="black">Destruction</text>
  <rect x="70" y="440" width="1060" height="100" fill="#e0e0e0" stroke="black"/>
  <text x="80" y="480" font-size="16" fill="black">- ref_count decremented, memory deallocated if 0</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms or Processes</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">Reference Counting</text>
  <rect x="70" y="160" width="1060" height="100" fill="#e0e0e0" stroke="black"/>
  <text x="80" y="200" font-size="16" fill="black">- Increment ref_count on copy</text>
  <text x="80" y="230" font-size="16" fill="black">- Decrement ref_count on destruction</text>
  <text x="70" y="280" font-size="20" fill="black">Memory Deallocation</text>
  <rect x="70" y="300" width="1060" height="100" fill="#e0e0e0" stroke="black"/>
  <text x="80" y="340" font-size="16" fill="black">- Delete ptr and ref_count when ref_count reaches 0</text>
  <text x="70" y="420" font-size="20" fill="black">Copy Semantics</text>
  <rect x="70" y="440" width="1060" height="100" fill="#e0e0e0" stroke="black"/>
  <text x="80" y="480" font-size="16" fill="black">- Shared ownership via copy constructor</text>
</svg>
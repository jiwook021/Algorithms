<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture or Main Workflow</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">SharedPtr Class</text>
  <rect x="70" y="160" width="1060" height="100" fill="#e0e0e0" stroke="black"/>
  <text x="80" y="200" font-size="16" fill="black">- Manages raw pointer (ptr)</text>
  <text x="80" y="230" font-size="16" fill="black">- Manages reference count (ref_count)</text>
  <text x="70" y="280" font-size="20" fill="black">Main Function</text>
  <rect x="70" y="300" width="1060" height="100" fill="#e0e0e0" stroke="black"/>
  <text x="80" y="340" font-size="16" fill="black">- Creates SharedPtr instances</text>
  <text x="80" y="370" font-size="16" fill="black">- Demonstrates reference counting</text>
  <text x="70" y="420" font-size="20" fill="black">Memory Management</text>
  <rect x="70" y="440" width="1060" height="100" fill="#e0e0e0" stroke="black"/>
  <text x="80" y="480" font-size="16" fill="black">- Automatically deallocates memory when ref_count reaches 0</text>
</svg>
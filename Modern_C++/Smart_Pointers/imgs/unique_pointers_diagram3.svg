<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">Unique Pointer Lifecycle</text>
  <rect x="70" y="160" width="200" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="80" y="190" font-size="16" fill="black">Create p1, p2</text>
  <rect x="70" y="220" width="200" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="80" y="250" font-size="16" fill="black">Destroy p1, p2</text>
  <rect x="70" y="280" width="200" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="80" y="310" font-size="16" fill="black">Create p1, p2 again</text>
  <rect x="70" y="340" width="200" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="80" y="370" font-size="16" fill="black">Move p1 to process_item</text>
  <rect x="70" y="400" width="200" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="80" y="430" font-size="16" fill="black">Destroy p1 after process</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">5. Class Structure</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">Foo Class</text>
  <rect x="70" y="160" width="200" height="50" fill="#d3d3d3" stroke="black" stroke-width="1"/>
  <text x="80" y="190" font-size="16" fill="black">Foo</text>
  <text x="70" y="240" font-size="20" fill="black">Private Members</text>
  <rect x="70" y="260" width="200" height="50" fill="#d3d3d3" stroke="black" stroke-width="1"/>
  <text x="80" y="290" font-size="16" fill="black">name</text>
  <text x="70" y="340" font-size="20" fill="black">Public Methods</text>
  <rect x="70" y="360" width="200" height="50" fill="#d3d3d3" stroke="black" stroke-width="1"/>
  <text x="80" y="390" font-size="16" fill="black">create_foo()</text>
  <rect x="70" y="410" width="200" height="50" fill="#d3d3d3" stroke="black" stroke-width="1"/>
  <text x="80" y="440" font-size="16" fill="black">destroy_foo()</text>
  <line x1="170" y1="210" x2="170" y2="260" stroke="black" stroke-width="2"/>
  <line x1="170" y1="310" x2="170" y2="360" stroke="black" stroke-width="2"/>
  <line x1="170" y1="410" x2="170" y2="460" stroke="black" stroke-width="2"/>

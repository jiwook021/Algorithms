<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="18" fill="black">1. Object Creation: `Foo` constructor</text>
  <text x="70" y="180" font-size="18" fill="black">2. Reference Counting: `use_count()`</text>
  <text x="70" y="220" font-size="18" fill="black">3. Shared Pointer Assignment: `fa = f1`</text>
  <text x="70" y="260" font-size="18" fill="black">4. Function Call: `f(shared_ptr<Foo>)`</text>
  <text x="70" y="300" font-size="18" fill="black">5. Move Semantics: `f(move(fa))`</text>
  <text x="70" y="340" font-size="18" fill="black">6. Object Destruction: `Foo` destructor</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">4. Function Bindings</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="20" fill="black">1. Partial Application</text>
  <text x="70" y="160" font-size="16" fill="black">- std::bind used to fix certain arguments</text>
  <text x="70" y="200" font-size="20" fill="black">2. Reordering Arguments</text>
  <text x="70" y="240" font-size="16" fill="black">- Arguments can be reordered using placeholders</text>
  <text x="70" y="280" font-size="20" fill="black">3. Fixed Arguments</text>
  <text x="70" y="320" font-size="16" fill="black">- All arguments can be fixed for a function call</text>

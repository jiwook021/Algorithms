<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="20" fill="black">1. Input Data</text>
  <text x="70" y="160" font-size="16" fill="black">- Integers, strings, and booleans passed to functions</text>
  <text x="70" y="200" font-size="20" fill="black">2. Processing</text>
  <text x="70" y="240" font-size="16" fill="black">- Functions process inputs and generate outputs</text>
  <text x="70" y="280" font-size="20" fill="black">3. Output Data</text>
  <text x="70" y="320" font-size="16" fill="black">- Results are printed to the console</text>
  <text x="70" y="360" font-size="20" fill="black">4. Error Handling</text>
  <text x="70" y="400" font-size="16" fill="black">- Division by zero throws an exception</text>
</svg>
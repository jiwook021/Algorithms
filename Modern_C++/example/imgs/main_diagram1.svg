<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture of BinaryHeap</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="20" fill="black">BinaryHeap Class</text>
  <rect x="70" y="140" width="1060" height="100" fill="#e0e0e0" stroke="black"/>
  <text x="80" y="180" font-size="16" fill="black">- Manages a heap using a vector</text>
  <text x="80" y="210" font-size="16" fill="black">- Supports push, pop, and top operations</text>
  <text x="70" y="260" font-size="20" fill="black">Main Workflow</text>
  <rect x="70" y="280" width="1060" height="300" fill="#e0e0e0" stroke="black"/>
  <text x="80" y="320" font-size="16" fill="black">1. Initialize BinaryHeap</text>
  <text x="80" y="350" font-size="16" fill="black">2. Insert elements using push()</text>
  <text x="80" y="380" font-size="16" fill="black">3. Remove elements using pop()</text>
  <text x="80" y="410" font-size="16" fill="black">4. Access top element using top()</text>
  <text x="80" y="440" font-size="16" fill="black">5. Check if heap is empty using empty()</text>
</svg>
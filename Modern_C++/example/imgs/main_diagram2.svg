<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms in BinaryHeap</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="20" fill="black">BubbleUp Algorithm</text>
  <rect x="70" y="140" width="1060" height="150" fill="#e0e0e0" stroke="black"/>
  <text x="80" y="180" font-size="16" fill="black">- Moves an element up the heap to restore heap property</text>
  <text x="80" y="210" font-size="16" fill="black">- Compares with parent and swaps if necessary</text>
  <text x="70" y="310" font-size="20" fill="black">BubbleDown Algorithm</text>
  <rect x="70" y="330" width="1060" height="150" fill="#e0e0e0" stroke="black"/>
  <text x="80" y="370" font-size="16" fill="black">- Moves an element down the heap to restore heap property</text>
  <text x="80" y="400" font-size="16" fill="black">- Compares with children and swaps if necessary</text>
</svg>
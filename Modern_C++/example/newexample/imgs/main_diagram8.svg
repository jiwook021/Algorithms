<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">8. Thread Management</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="150" font-size="20" fill="black">Thread Creation</text>
  <rect x="100" y="170" width="200" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="110" y="200" font-size="16" fill="black">std::thread producers[2], consumers[2]</text>
  <text x="100" y="250" font-size="20" fill="black">Thread Execution</text>
  <rect x="100" y="270" width="200" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="110" y="300" font-size="16" fill="black">producer_task, consumer_task</text>
  <text x="100" y="350" font-size="20" fill="black">Thread Join</text>
  <rect x="100" y="370" width="200" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="110" y="400" font-size="16" fill="black">producers[i].join(), consumers[i].join()</text>
</svg>
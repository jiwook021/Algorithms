<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="150" font-size="20" fill="black">Producer Data Flow</text>
  <rect x="100" y="170" width="200" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="110" y="200" font-size="16" fill="black">value -> queue</text>
  <text x="100" y="250" font-size="20" fill="black">Consumer Data Flow</text>
  <rect x="100" y="270" width="200" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="110" y="300" font-size="16" fill="black">queue -> value</text>
  <text x="100" y="350" font-size="20" fill="black">State Transitions</text>
  <rect x="100" y="370" width="200" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="110" y="400" font-size="16" fill="black">queue.size() changes</text>
  <text x="100" y="450" font-size="20" fill="black">Condition Variables</text>
  <rect x="100" y="470" width="200" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="110" y="500" font-size="16" fill="black">cv_full, cv_empty</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">4. Memory Management</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="120" font-size="20" fill="black">1. Copying:</text>
  <text x="70" y="160" font-size="20" fill="black">- Allocates new memory for the copied string</text>
  <text x="70" y="200" font-size="20" fill="black">2. Moving:</text>
  <text x="70" y="240" font-size="20" fill="black">- Transfers ownership without new allocation</text>
  <text x="70" y="280" font-size="20" fill="black">- Original string becomes empty</text>
</svg>
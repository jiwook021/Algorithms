<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="120" font-size="20" fill="black">1. Initialize string and vector</text>
  <text x="70" y="160" font-size="20" fill="black">2. Copy string into vector</text>
  <text x="70" y="200" font-size="20" fill="black">3. Move string into vector</text>
  <text x="70" y="240" font-size="20" fill="black">4. Print results</text>
  <line x1="70" y1="250" x2="1100" y2="250" stroke="black" stroke-width="2"/>
  <text x="70" y="300" font-size="20" fill="black">Output:</text>
  <text x="70" y="340" font-size="20" fill="black">- After copy, str is "Salut"</text>
  <text x="70" y="380" font-size="20" fill="black">- After move, str is ""</text>
  <text x="70" y="420" font-size="20" fill="black">- Vector contents: {"Salut", "Salut"}</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="110" font-size="20" fill="black">1. Current Time (now)</text>
  <text x="70" y="140" font-size="20" fill="black">2. Future Time (now + 12h)</text>
  <text x="70" y="170" font-size="20" fill="black">3. Past Time (now - 12h - 15min)</text>
  <text x="70" y="200" font-size="20" fill="black">4. Past Time (now - 7_days)</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">8. Member Function Binding</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">Member Function Binding</text>
  <rect x="70" y="160" width="1060" height="500" fill="#e0e0e0" stroke="black" stroke-width="1"/>
  <text x="80" y="200" font-size="16" fill="black">1. Class: MyClass</text>
  <text x="80" y="230" font-size="16" fill="black">2. Member Function: memberFunction()</text>
  <text x="80" y="260" font-size="16" fill="black">3. Binding: std::bind(&MyClass::memberFunction, &obj)</text>
  <text x="80" y="290" font-size="16" fill="black">4. Invocation: task() → "멤버 함수 호출됨"</text>
</svg>
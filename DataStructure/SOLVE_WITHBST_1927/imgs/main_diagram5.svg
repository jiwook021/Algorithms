<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">5. Insertion Process</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">1. Check if parent is NULL</text>
  <text x="70" y="180" font-size="20" fill="black">2. If NULL, create new node</text>
  <text x="70" y="220" font-size="20" fill="black">3. If not NULL, compare data</text>
  <text x="70" y="260" font-size="20" fill="black">4. Insert left if data is smaller</text>
  <text x="70" y="300" font-size="20" fill="black">5. Insert right if data is larger</text>
</svg>
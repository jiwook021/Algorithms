<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">1. Include headers</text>
  <text x="70" y="180" font-size="20" fill="black">2. Define main function</text>
  <text x="70" y="220" font-size="20" fill="black">3. Initialize vector with values {1, 2, 3}</text>
  <text x="70" y="260" font-size="20" fill="black">4. Shrink vector to fit its size</text>
  <text x="70" y="300" font-size="20" fill="black">5. Get iterator to the beginning of the vector</text>
  <text x="70" y="340" font-size="20" fill="black">6. Print the first element twice</text>
  <text x="70" y="380" font-size="20" fill="black">7. Push a new element (123) to the vector</text>
  <text x="70" y="420" font-size="20" fill="black">8. Print the first element again (potential undefined behavior)</text>
</svg>
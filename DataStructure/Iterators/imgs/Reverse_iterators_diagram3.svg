<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="120" font-size="18" fill="black">1. List initialization: {1, 2, 3, 4, 5}</text>
  <text x="70" y="160" font-size="18" fill="black">2. Reverse iteration starts from rbegin() to rend()</text>
  <text x="70" y="200" font-size="18" fill="black">3. Data flows from list to ostream_iterator</text>
  <text x="70" y="240" font-size="18" fill="black">4. Output: 5, 4, 3, 2, 1</text>
  <text x="70" y="280" font-size="18" fill="black">5. Repeat with make_reverse_iterator</text>
  <text x="70" y="320" font-size="18" fill="black">6. Output: 5, 4, 3, 2, 1</text>
</svg>
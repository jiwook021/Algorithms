<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">4. Reverse Iterators: rbegin() and rend()</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="120" font-size="18" fill="black">1. rbegin() points to the last element (5)</text>
  <text x="70" y="160" font-size="18" fill="black">2. rend() points to one before the first element</text>
  <text x="70" y="200" font-size="18" fill="black">3. Iteration moves from rbegin() to rend()</text>
  <text x="70" y="240" font-size="18" fill="black">4. Output: 5, 4, 3, 2, 1</text>
</svg>
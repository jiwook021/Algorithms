<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">4. Iterator Behavior</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">1. Iterator Created: Points to 1</text>
  <text x="70" y="180" font-size="20" fill="black">2. First Dereference: Prints 1</text>
  <text x="70" y="220" font-size="20" fill="black">3. Second Dereference: Prints 1</text>
  <text x="70" y="260" font-size="20" fill="black">4. After push_back(): Iterator May Be Invalidated</text>
  <text x="70" y="300" font-size="20" fill="black">5. Third Dereference: Undefined Behavior</text>
</svg>
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" fill="black">4. Node Structure</text>
  <rect x="50" y="100" width="1100" height="600" fill="lightgray" stroke="black"/>
  <text x="100" y="150" font-size="20" fill="black">Node Structure</text>

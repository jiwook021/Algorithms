<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms</text>
  <rect x="50" y="100" width="1100" height="600" fill="lightgray" stroke="black"/>
  <text x="100" y="150" font-size="20" fill="black">Algorithms and Processes</text>
  <text x="100" y="200" font-size="16" fill="black">1. Move-to-Front (MTF): Move accessed item to the front</text>
  <text x="100" y="250" font-size="16" fill="black">2. Transpose: Swap accessed item with its predecessor</text>
  <text x="100" y="300" font-size="16" fill="black">3. Count: Reorder based on access frequency</text>
</svg>
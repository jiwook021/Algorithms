<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">1. Initial Vector: [1, 2, 3, 2, 5, 2, 6, 2, 4, 8]</text>
  <text x="70" y="180" font-size="20" fill="black">2. After removing '2's: [1, 3, 5, 6, 4, 8]</text>
  <text x="70" y="220" font-size="20" fill="black">3. After removing odd numbers: [6, 4, 8]</text>
  <text x="70" y="260" font-size="20" fill="black">4. Final Vector: [6, 4, 8]</text>
</svg>
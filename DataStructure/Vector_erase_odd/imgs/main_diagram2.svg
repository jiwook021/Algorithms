<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms or Processes</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">1. std::remove: Moves all '2's to the end</text>
  <text x="70" y="180" font-size="20" fill="black">2. std::erase: Removes elements from new_end to end</text>
  <text x="70" y="220" font-size="20" fill="black">3. std::remove_if: Moves all odd numbers to the end</text>
  <text x="70" y="260" font-size="20" fill="black">4. std::erase: Removes odd elements from new_end to end</text>
  <text x="70" y="300" font-size="20" fill="black">5. std::shrink_to_fit: Reduces vector capacity</text>
</svg>
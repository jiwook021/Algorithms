<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">7. Stack Operations</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">Push: Add element to the top</text>
  <text x="70" y="180" font-size="20" fill="black">Pop: Remove element from the top</text>
  <text x="70" y="220" font-size="20" fill="black">Peek: View element at the top</text>
</svg>
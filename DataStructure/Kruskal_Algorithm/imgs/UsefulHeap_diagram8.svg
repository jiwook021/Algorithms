<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">8. Heap Index Calculations</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="20" fill="black">Parent Index: idx/2</text>
  <text x="70" y="160" font-size="20" fill="black">Left Child Index: idx*2</text>
  <text x="70" y="200" font-size="20" fill="black">Right Child Index: idx*2+1</text>
  <line x1="70" y1="120" x2="200" y2="120" stroke="black"/>
  <line x1="70" y1="160" x2="200" y2="160" stroke="black"/>
  <line x1="70" y1="200" x2="200" y2="200" stroke="black"/>
</svg>
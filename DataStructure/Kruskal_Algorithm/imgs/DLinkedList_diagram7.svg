<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">7. Removal Process (LRemove)</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="150" font-size="20" fill="black">Remove current node</text>
  <text x="100" y="200" font-size="20" fill="black">Update before->next</text>
  <text x="100" y="250" font-size="20" fill="black">Free memory of removed node</text>
  <text x="100" y="300" font-size="20" fill="black">Decrement numOfData</text>
  <line x1="100" y1="160" x2="400" y2="160" stroke="black" stroke-width="2"/>
  <line x1="100" y1="210" x2="400" y2="210" stroke="black" stroke-width="2"/>
  <line x1="100" y1="260" x2="400" y2="260" stroke="black" stroke-width="2"/>
  <line x1="100" y1="310" x2="400" y2="310" stroke="black" stroke-width="2"/>
</svg>
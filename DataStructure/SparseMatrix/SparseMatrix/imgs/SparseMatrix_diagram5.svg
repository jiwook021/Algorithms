<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">5. Linked List Structure</text>
  <rect x="50" y="80" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="20" fill="black">Row Lists</text>
  <text x="70" y="160" font-size="16" fill="black">- Each row is a linked list</text>
  <text x="70" y="190" font-size="16" fill="black">- Nodes connected via 'next' pointer</text>
  <text x="70" y="220" font-size="20" fill="black">Column Lists</text>
  <text x="70" y="260" font-size="16" fill="black">- Each column is a linked list</text>
  <text x="70" y="290" font-size="16" fill="black">- Nodes connected via 'below' pointer</text>
</svg>
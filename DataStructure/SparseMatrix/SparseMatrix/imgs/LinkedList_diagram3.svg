<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="120" font-size="20" fill="black">Data Flow</text>
  <text x="70" y="160" font-size="18" fill="black">- Data flows from head to tail via next/below pointers</text>
  <text x="70" y="190" font-size="18" fill="black">- Circular linking ensures continuous traversal</text>
  <text x="70" y="230" font-size="20" fill="black">State Transitions</text>
  <text x="70" y="270" font-size="18" fill="black">- List starts empty (size = 0, head = NULL)</text>
  <text x="70" y="300" font-size="18" fill="black">- Nodes added: size increases, pointers updated</text>
  <text x="70" y="330" font-size="18" fill="black">- Nodes deleted: size decreases, pointers adjusted</text>
</svg>
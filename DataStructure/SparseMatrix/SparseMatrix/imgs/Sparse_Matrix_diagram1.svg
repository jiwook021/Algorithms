<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="100" font-size="20" fill="black">Matrix Initialization</text>
  <text x="70" y="130" font-size="16" fill="black">- Allocates memory for width and height linked lists</text>
  <text x="70" y="160" font-size="16" fill="black">- Initializes each linked list</text>
  <text x="70" y="220" font-size="20" fill="black">Matrix Insertion</text>
  <text x="70" y="250" font-size="16" fill="black">- Creates a new node for the matrix</text>
  <text x="70" y="280" font-size="16" fill="black">- Inserts the node into both row and column linked lists</text>
  <text x="70" y="310" font-size="16" fill="black">- Maintains circular linked list structure</text>
</svg>
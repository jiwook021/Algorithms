<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="120" font-size="20" fill="black">LNInsert Algorithm</text>
  <text x="70" y="160" font-size="18" fill="black">- Insert node at the end of the list</text>
  <text x="70" y="190" font-size="18" fill="black">- Circular linking (next pointer)</text>
  <text x="70" y="220" font-size="20" fill="black">LBInsert Algorithm</text>
  <text x="70" y="260" font-size="18" fill="black">- Insert node below the current node</text>
  <text x="70" y="290" font-size="18" fill="black">- Circular linking (below pointer)</text>
  <text x="70" y="330" font-size="20" fill="black">NodeDelete Algorithm</text>
  <text x="70" y="370" font-size="18" fill="black">- Traverse list to find node</text>
  <text x="70" y="400" font-size="18" fill="black">- Remove node and adjust pointers</text>
</svg>
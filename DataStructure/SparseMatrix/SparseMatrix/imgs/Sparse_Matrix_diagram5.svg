<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">5. Circular Linked List Structure</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="100" font-size="20" fill="black">Circular Linked List in Matrix</text>
  <text x="70" y="130" font-size="16" fill="black">- Each row and column is a circular linked list</text>
  <text x="70" y="160" font-size="16" fill="black">- Nodes point back to the head of the list</text>
  <text x="70" y="190" font-size="16" fill="black">- Ensures circular traversal</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="100" font-size="20" fill="black">Data Flow in Matrix Initialization</text>
  <text x="70" y="130" font-size="16" fill="black">- Input: Matrix pointer, width, height</text>
  <text x="70" y="160" font-size="16" fill="black">- Output: Initialized matrix with linked lists</text>
  <text x="70" y="220" font-size="20" fill="black">Data Flow in Matrix Insertion</text>
  <text x="70" y="250" font-size="16" fill="black">- Input: Row, column, data, matrix pointer</text>
  <text x="70" y="280" font-size="16" fill="black">- Output: Updated matrix with new node inserted</text>
</svg>
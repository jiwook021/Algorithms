<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="20" fill="black">- Listinit: Initializes the linked list</text>
  <text x="70" y="160" font-size="20" fill="black">- vInsertion: Inserts a node at the end</text>
  <text x="70" y="200" font-size="20" fill="black">- vInsertion2: Inserts a node at a specific position</text>
  <text x="70" y="240" font-size="20" fill="black">- vRemove: Removes a node with specific data</text>
  <text x="70" y="280" font-size="20" fill="black">- vSearch: Searches for a node with specific data</text>
  <text x="70" y="320" font-size="20" fill="black">- vPrint: Prints all nodes in the list</text>
</svg>
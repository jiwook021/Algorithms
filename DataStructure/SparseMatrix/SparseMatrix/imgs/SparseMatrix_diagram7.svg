<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">7. Error Handling</text>
  <rect x="50" y="80" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="20" fill="black">No Error Handling</text>
  <text x="70" y="160" font-size="16" fill="black">- No checks for malloc failure</text>
  <text x="70" y="190" font-size="16" fill="black">- No bounds checking for row/column indices</text>
  <text x="70" y="220" font-size="16" fill="black">- No validation for input data</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="80" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="20" fill="black">InitMatrix</text>
  <text x="70" y="160" font-size="16" fill="black">- Allocates memory for width and height linked lists</text>
  <text x="70" y="190" font-size="16" fill="black">- Initializes each list</text>
  <text x="70" y="220" font-size="20" fill="black">MatInsert</text>
  <text x="70" y="260" font-size="16" fill="black">- Creates a new node</text>
  <text x="70" y="290" font-size="16" fill="black">- Inserts node into row and column lists</text>
  <text x="70" y="320" font-size="20" fill="black">MatDelete</text>
  <text x="70" y="360" font-size="16" fill="black">- Deletes nodes with matching data from rows</text>
</svg>
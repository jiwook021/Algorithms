<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">6. Videotape Object Structure</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="100" font-size="20" fill="black">Videotape Object:</text>
  <text x="70" y="130" font-size="16" fill="black">1. Name of Tape</text>
  <text x="70" y="160" font-size="16" fill="black">2. Type of Movie</text>
  <text x="70" y="190" font-size="16" fill="black">3. Released Date</text>
  <text x="70" y="220" font-size="16" fill="black">4. Cost</text>
  <text x="70" y="250" font-size="16" fill="black">5. Availability</text>
  <text x="70" y="280" font-size="16" fill="black">6. Location</text>

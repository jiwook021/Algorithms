<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="20" fill="black">Data Flow in Videotape Class</text>
  <rect x="70" y="140" width="1060" height="520" fill="#e0e0e0" stroke="black"/>
  <text x="90" y="180" font-size="18" fill="black">- Constructor: Input → Attributes</text>
  <text x="90" y="220" font-size="18" fill="black">- Setters: Input → Specific Attribute</text>
  <text x="90" y="260" font-size="18" fill="black">- Getters: Attribute → Output</text>
  <text x="90" y="300" font-size="18" fill="black">- Print: Attributes → Console Output</text>
</svg>
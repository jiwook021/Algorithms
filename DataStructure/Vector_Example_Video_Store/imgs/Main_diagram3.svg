<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow or State Transitions</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="100" font-size="20" fill="black">Data Flow:</text>
  <text x="70" y="130" font-size="16" fill="black">1. User Input → Temporary Variables</text>
  <text x="70" y="160" font-size="16" fill="black">2. Temporary Variables → Videotape Object</text>
  <text x="70" y="190" font-size="16" fill="black">3. Videotape Object → Vector Storage</text>
  <text x="70" y="220" font-size="16" fill="black">4. Vector Storage → Display Output</text>
</svg>
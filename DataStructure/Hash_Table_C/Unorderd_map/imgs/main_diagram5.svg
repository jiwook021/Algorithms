<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" font-weight="bold">5. Capacity Functions</text>
  <rect x="50" y="80" width="1100" height="700" fill="#ffffff" stroke="#000000"/>
  <text x="70" y="120" font-size="18">Size and Empty Checks</text>
  <rect x="70" y="140" width="1060" height="620" fill="#e0e0e0" stroke="#000000"/>
  <text x="90" y="180" font-size="16">- empty(): Check if num_elements == 0</text>
  <text x="90" y="210" font-size="16">- size(): Return num_elements</text>
  <text x="90" y="240" font-size="16">- max_size(): Return std::numeric_limits<size_t>::max()</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="150" font-size="20" fill="black">1. Stack Operations:</text>
  <text x="150" y="200" font-size="18" fill="black">- Push: Add TreeNode to Stack</text>
  <text x="150" y="250" font-size="18" fill="black">- Pop: Remove TreeNode from Stack</text>
  <text x="150" y="300" font-size="18" fill="black">- isEmpty: Check if Stack is Empty</text>
  <text x="100" y="350" font-size="20" fill="black">2. Inorder Traversal:</text>
  <text x="150" y="400" font-size="18" fill="black">- Traverse Left Subtree</text>
  <text x="150" y="450" font-size="18" fill="black">- Process Node</text>
  <text x="150" y="500" font-size="18" fill="black">- Traverse Right Subtree</text>
</svg>
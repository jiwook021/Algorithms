<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="150" font-size="20" fill="black">1. Tree Creation:</text>
  <text x="150" y="200" font-size="18" fill="black">- Root Node (1)</text>
  <text x="150" y="250" font-size="18" fill="black">- Left Child (2)</text>
  <text x="150" y="300" font-size="18" fill="black">- Right Child (3)</text>
  <text x="100" y="350" font-size="20" fill="black">2. Inorder Traversal:</text>
  <text x="150" y="400" font-size="18" fill="black">- Push Nodes to Stack</text>
  <text x="150" y="450" font-size="18" fill="black">- Pop Nodes from Stack</text>
  <text x="150" y="500" font-size="18" fill="black">- Print Node Data</text>
</svg>
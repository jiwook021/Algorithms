<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="150" font-size="20" fill="black">Infix to Postfix Conversion</text>
  <rect x="100" y="170" width="1000" height="100" fill="#d3f8d3" stroke="black" stroke-width="2"/>
  <text x="120" y="220" font-size="16" fill="black">- Iterates through infix expression</text>
  <text x="120" y="250" font-size="16" fill="black">- Uses stack to handle operators</text>
  <text x="120" y="280" font-size="16" fill="black">- Outputs postfix expression</text>
  <text x="100" y="400" font-size="20" fill="black">Stack Operations</text>
  <rect x="100" y="420" width="1000" height="100" fill="#d3f8d3" stroke="black" stroke-width="2"/>
  <text x="120" y="470" font-size="16" fill="black">- push(): Adds element to stack</text>
  <text x="120" y="500" font-size="16" fill="black">- pop(): Removes element from stack</text>
</svg>
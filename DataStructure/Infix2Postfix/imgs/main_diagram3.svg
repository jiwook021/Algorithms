<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="150" font-size="20" fill="black">Data Flow</text>
  <rect x="100" y="170" width="1000" height="100" fill="#d3f8d3" stroke="black" stroke-width="2"/>
  <text x="120" y="220" font-size="16" fill="black">- Infix expression → Infix2Postfix → Postfix expression</text>
  <text x="100" y="350" font-size="20" fill="black">Stack State Transitions</text>
  <rect x="100" y="370" width="1000" height="100" fill="#d3f8d3" stroke="black" stroke-width="2"/>
  <text x="120" y="420" font-size="16" fill="black">- push(): Increases stack top, adds element</text>
  <text x="120" y="450" font-size="16" fill="black">- pop(): Decreases stack top, removes element</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="150" font-size="20" fill="black">Main Function</text>
  <rect x="100" y="170" width="1000" height="100" fill="#d3f8d3" stroke="black" stroke-width="2"/>
  <text x="120" y="220" font-size="16" fill="black">- Initializes infix expressions</text>
  <text x="120" y="250" font-size="16" fill="black">- Calls Infix2Postfix function</text>
  <text x="120" y="280" font-size="16" fill="black">- Prints postfix output</text>
  <text x="100" y="400" font-size="20" fill="black">Infix2Postfix Function</text>
  <rect x="100" y="420" width="1000" height="100" fill="#d3f8d3" stroke="black" stroke-width="2"/>
  <text x="120" y="470" font-size="16" fill="black">- Converts infix to postfix notation</text>
  <text x="120" y="500" font-size="16" fill="black">- Uses stack for operator precedence</text>
  <text x="100" y="620" font-size="20" fill="black">Stack Operations (push/pop)</text>
  <rect x="100" y="640" width="1000" height="100" fill="#d3f8d3" stroke="black" stroke-width="2"/>
  <text x="120" y="690" font-size="16" fill="black">- Manages stack for operator handling</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">7. Sift Up and Sift Down</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">Heap Maintenance Functions</text>
  <text x="70" y="180" font-size="16" fill="black">- Sift Up: Moves element up to restore heap property</text>
  <text x="70" y="220" font-size="16" fill="black">- Sift Down: Moves element down to restore heap property</text>

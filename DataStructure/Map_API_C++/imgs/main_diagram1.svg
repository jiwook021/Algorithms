<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="120" font-size="18" fill="black">1. Initialize map `m`</text>
  <text x="70" y="160" font-size="18" fill="black">2. Insert elements using `try_emplace` and `insert`</text>
  <text x="70" y="200" font-size="18" fill="black">3. Erase element with key "d"</text>
  <text x="70" y="240" font-size="18" fill="black">4. Find and print elements with keys "b" and "f"</text>
  <text x="70" y="280" font-size="18" fill="black">5. Check count of key "a"</text>
  <text x="70" y="320" font-size="18" fill="black">6. Print size of map if not empty</text>
  <text x="70" y="360" font-size="18" fill="black">7. Iterate and print all elements</text>
  <text x="70" y="400" font-size="18" fill="black">8. Clear map and verify it is empty</text>
</svg>
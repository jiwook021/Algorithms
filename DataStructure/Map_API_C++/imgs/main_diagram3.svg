<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="120" font-size="18" fill="black">1. Map `m` starts empty</text>
  <text x="70" y="160" font-size="18" fill="black">2. Elements are added: "a", "b", "c", "d", "e", "f", "g"</text>
  <text x="70" y="200" font-size="18" fill="black">3. Element "d" is removed</text>
  <text x="70" y="240" font-size="18" fill="black">4. Map is iterated and printed</text>
  <text x="70" y="280" font-size="18" fill="black">5. Map is cleared, becoming empty again</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">5. Map Operations</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="120" font-size="18" fill="black">1. `try_emplace("a", "a"s)`: Inserts "a" with value "a"</text>
  <text x="70" y="160" font-size="18" fill="black">2. `try_emplace("c", "Won't be inserted")`: Ignored (key exists)</text>
  <text x="70" y="200" font-size="18" fill="black">3. `insert(std::make_pair("d", "4"))`: Inserts "d" with value "4"</text>
  <text x="70" y="240" font-size="18" fill="black">4. `m["f"] = "6"`: Inserts "f" with value "6"</text>
  <text x="70" y="280" font-size="18" fill="black">5. `erase("d")`: Removes "d"</text>
</svg>
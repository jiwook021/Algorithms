<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">6. Heap Deletion Process</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="110" font-size="18" fill="black">- Removes root element</text>
  <text x="70" y="140" font-size="18" fill="black">- Replaces root with last element</text>
  <text x="70" y="170" font-size="18" fill="black">- Reorders heap to maintain property</text>
</svg>
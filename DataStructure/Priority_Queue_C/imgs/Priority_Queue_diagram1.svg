<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="110" font-size="18" fill="black">- heapInit: Initializes the heap</text>
  <text x="70" y="140" font-size="18" fill="black">- HIsEmpty: Checks if heap is empty</text>
  <text x="70" y="170" font-size="18" fill="black">- HInsert: Inserts data with priority</text>
  <text x="70" y="200" font-size="18" fill="black">- Hdelete: Deletes highest priority data</text>
  <text x="70" y="230" font-size="18" fill="black">- getHiPriChiledIDX: Finds child with higher priority</text>
</svg>
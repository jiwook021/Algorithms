<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="80" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="20" fill="black">- Random numbers generated and pushed into queues</text>
  <text x="70" y="150" font-size="20" fill="black">- Queue contents transferred between queues</text>
  <text x="70" y="180" font-size="20" fill="black">- Priority queues populated with random numbers</text>
  <text x="70" y="210" font-size="20" fill="black">- Priority queue contents printed and modified</text>
  <text x="70" y="240" font-size="20" fill="black">- Priority queues swapped and their sizes printed</text>
  <text x="70" y="270" font-size="20" fill="black">- Strings emplaced into priority queue and printed</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="80" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="20" fill="black">- Random number generation using srand and rand</text>
  <text x="70" y="150" font-size="20" fill="black">- Queue operations: push, pop, front, back</text>
  <text x="70" y="180" font-size="20" fill="black">- Priority queue operations: push, pop, top</text>
  <text x="70" y="210" font-size="20" fill="black">- Array to priority queue initialization</text>
  <text x="70" y="240" font-size="20" fill="black">- Swap operation between priority queues</text>

<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">Stack Initialization Algorithm</text>
  <text x="70" y="180" font-size="20" fill="black">Push Algorithm</text>
  <text x="70" y="220" font-size="20" fill="black">Pop Algorithm</text>
  <line x1="70" y1="240" x2="1080" y2="240" stroke="black" stroke-width="2"/>
  <text x="70" y="280" font-size="20" fill="black">1. Allocate memory for stack</text>
  <text x="70" y="320" font-size="20" fill="black">2. Set top to NULL and size to 0</text>
  <text x="70" y="360" font-size="20" fill="black">3. Return stack pointer</text>
  <text x="70" y="400" font-size="20" fill="black">Push: Allocate node, link to top, update top</text>
  <text x="70" y="440" font-size="20" fill="black">Pop: Check if empty, return data, update top</text>
</svg>
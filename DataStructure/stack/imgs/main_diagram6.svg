<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">6. Error Handling</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">Empty Stack Handling</text>
  <text x="70" y="180" font-size="20" fill="black">Memory Allocation Errors</text>
  <line x1="70" y1="200" x2="1080" y2="200" stroke="black" stroke-width="2"/>
  <text x="70" y="240" font-size="20" fill="black">1. Pop returns -1 if stack is empty</text>
  <text x="70" y="280" font-size="20" fill="black">2. No explicit handling for malloc failures</text>
</svg>
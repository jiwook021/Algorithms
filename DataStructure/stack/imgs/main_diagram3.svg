<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">Stack State Transitions</text>
  <text x="70" y="180" font-size="20" fill="black">Push Operation</text>
  <text x="70" y="220" font-size="20" fill="black">Pop Operation</text>
  <line x1="70" y1="240" x2="1080" y2="240" stroke="black" stroke-width="2"/>
  <text x="70" y="280" font-size="20" fill="black">1. Stack initialized: top = NULL, size = 0</text>
  <text x="70" y="320" font-size="20" fill="black">2. Push: top points to new node, size++</text>
  <text x="70" y="360" font-size="20" fill="black">3. Pop: top points to previous node, size--</text>
  <text x="70" y="400" font-size="20" fill="black">4. Stack empty: top = NULL, size = 0</text>
</svg>
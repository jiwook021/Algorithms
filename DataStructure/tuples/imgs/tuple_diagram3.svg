<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="100" font-size="18" fill="black">- Data flows from tuples to functions like print_args, sum_min_max_avg, and zip</text>
  <text x="70" y="130" font-size="18" fill="black">- State transitions occur when tuples are concatenated or zipped</text>
  <text x="70" y="160" font-size="18" fill="black">- Results are output to the console</text>
</svg>
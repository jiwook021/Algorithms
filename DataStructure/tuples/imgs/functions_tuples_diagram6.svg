<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" font-weight="bold">6. List of Tuples</text>
  <rect x="50" y="80" width="1100" height="600" stroke="black" stroke-width="2" fill="none"/>
  <text x="70" y="120" font-size="20">Initialization</text>
  <rect x="70" y="130" width="200" height="50" fill="lightseagreen"/>
  <text x="80" y="160" font-size="16">auto arguments_for_later = {...};</text>
  <text x="70" y="220" font-size="20">Iteration</text>
  <rect x="70" y="230" width="200" height="50" fill="lightseagreen"/>
  <text x="80" y="260" font-size="16">for (const auto &[id, name, gpa] : arguments_for_later)</text>
</svg>
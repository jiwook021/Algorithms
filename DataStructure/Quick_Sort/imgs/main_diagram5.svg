<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">5. Partition Function</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="130" font-size="18" fill="black">Partition(arr, left, right)</text>
  <text x="70" y="160" font-size="18" fill="black">1. pivot = arr[left]</text>
  <text x="70" y="190" font-size="18" fill="black">2. low = left + 1, high = right</text>
  <text x="70" y="220" font-size="18" fill="black">3. Move low and high pointers</text>
  <text x="70" y="250" font-size="18" fill="black">4. Swap elements if low <= high</text>
  <text x="70" y="280" font-size="18" fill="black">5. Swap pivot with arr[high]</text>
</svg>
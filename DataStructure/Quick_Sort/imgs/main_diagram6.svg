<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">6. QuickSort Function</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="130" font-size="18" fill="black">QuickSort(arr, left, right)</text>
  <text x="70" y="160" font-size="18" fill="black">1. If left <= right</text>
  <text x="70" y="190" font-size="18" fill="black">2. pivot = Partition(arr, left, right)</text>
  <text x="70" y="220" font-size="18" fill="black">3. QuickSort(arr, left, pivot - 1)</text>
  <text x="70" y="250" font-size="18" fill="black">4. QuickSort(arr, pivot + 1, right)</text>
</svg>
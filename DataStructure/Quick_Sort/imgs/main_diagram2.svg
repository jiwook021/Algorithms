<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="130" font-size="18" fill="black">QuickSort Algorithm</text>
  <text x="70" y="160" font-size="18" fill="black">1. Select a pivot element</text>
  <text x="70" y="190" font-size="18" fill="black">2. Partition the array around the pivot</text>
  <text x="70" y="220" font-size="18" fill="black">3. Recursively sort the sub-arrays</text>
  <text x="70" y="250" font-size="18" fill="black">Partition Algorithm</text>
  <text x="70" y="280" font-size="18" fill="black">1. Choose the first element as pivot</text>
  <text x="70" y="310" font-size="18" fill="black">2. Move elements less than pivot to the left</text>
  <text x="70" y="340" font-size="18" fill="black">3. Move elements greater than pivot to the right</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">4. Dijkstra Algorithm Workflow</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="150" font-size="20" fill="black">1. Initialize dist[] with INF, dist[st] = 0</text>
  <text x="100" y="200" font-size="20" fill="black">2. Push {0, st} to priority queue</text>
  <text x="100" y="250" font-size="20" fill="black">3. Pop smallest dist vertex, relax edges</text>
  <text x="100" y="300" font-size="20" fill="black">4. Repeat until queue is empty</text>
</svg>
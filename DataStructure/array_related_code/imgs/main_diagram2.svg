<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">Dutch National Flag Algorithm</text>
  <rect x="70" y="160" width="200" height="50" fill="#d3d3d3" stroke="black" stroke-width="1"/>
  <text x="80" y="190" font-size="16" fill="black">Initialize low, mid, high</text>
  <rect x="70" y="220" width="200" height="50" fill="#d3d3d3" stroke="black" stroke-width="1"/>
  <text x="80" y="250" font-size="16" fill="black">Loop while mid <= high</text>
  <rect x="70" y="280" width="200" height="50" fill="#d3d3d3" stroke="black" stroke-width="1"/>
  <text x="80" y="310" font-size="16" fill="black">Case 0: Swap low and mid</text>
  <rect x="70" y="340" width="200" height="50" fill="#d3d3d3" stroke="black" stroke-width="1"/>
  <text x="80" y="370" font-size="16" fill="black">Case 1: Increment mid</text>
  <rect x="70" y="400" width="200" height="50" fill="#d3d3d3" stroke="black" stroke-width="1"/>
  <text x="80" y="430" font-size="16" fill="black">Case 2: Swap mid and high</text>
</svg>
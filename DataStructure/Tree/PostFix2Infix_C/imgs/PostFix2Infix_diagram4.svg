<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">4. Stack Operations</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">Push Operation</text>
  <rect x="70" y="160" width="200" height="50" fill="#d3d3d3" stroke="black"/>
  <text x="80" y="190" font-size="16" fill="black">Add Element to Stack</text>
  <text x="300" y="140" font-size="20" fill="black">Pop Operation</text>
  <rect x="300" y="160" width="200" height="50" fill="#d3d3d3" stroke="black"/>
  <text x="310" y="190" font-size="16" fill="black">Remove Element from Stack</text>
  <text x="530" y="140" font-size="20" fill="black">Stack State</text>
  <rect x="530" y="160" width="200" height="50" fill="#d3d3d3" stroke="black"/>
  <text x="540" y="190" font-size="16" fill="black">Track Stack Top</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">4. DFS Traversal</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="150" font-size="20" fill="black">DFS Traversal Steps</text>
  <text x="100" y="200" font-size="16" fill="black">- Start at root node (1)</text>
  <text x="100" y="230" font-size="16" fill="black">- Visit unvisited neighbors</text>
  <text x="100" y="260" font-size="16" fill="black">- Record node and depth in path</text>
  <text x="100" y="290" font-size="16" fill="black">- Backtrack to parent node</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="150" font-size="20" fill="black">DFS Algorithm</text>
  <text x="100" y="200" font-size="16" fill="black">- Traverse graph using DFS</text>
  <text x="100" y="230" font-size="16" fill="black">- Record node and depth in path</text>
  <text x="100" y="260" font-size="16" fill="black">- Mark visited nodes</text>
  <text x="100" y="290" font-size="20" fill="black">Segment Tree Algorithm</text>
  <text x="100" y="330" font-size="16" fill="black">- Build segment tree from path</text>
  <text x="100" y="360" font-size="16" fill="black">- Query for minimum depth in range</text>
</svg>
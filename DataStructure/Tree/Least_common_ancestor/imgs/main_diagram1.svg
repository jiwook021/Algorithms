<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="150" font-size="20" fill="black">Main Workflow</text>
  <text x="100" y="200" font-size="16" fill="black">1. Input: Read N and M</text>
  <text x="100" y="230" font-size="16" fill="black">2. Build Adjacency List</text>
  <text x="100" y="260" font-size="16" fill="black">3. Perform DFS to Generate Path</text>
  <text x="100" y="290" font-size="16" fill="black">4. Build Segment Tree</text>
  <text x="100" y="320" font-size="16" fill="black">5. Process M Queries</text>
  <text x="100" y="350" font-size="16" fill="black">6. Output Results</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="150" font-size="20" fill="black">Data Flow Diagram</text>
  <text x="100" y="200" font-size="16" fill="black">1. Input Nodes → Adjacency List</text>
  <text x="100" y="230" font-size="16" fill="black">2. Adjacency List → DFS Path</text>
  <text x="100" y="260" font-size="16" fill="black">3. DFS Path → Segment Tree</text>
  <text x="100" y="290" font-size="16" fill="black">4. Segment Tree → Query Results</text>
</svg>
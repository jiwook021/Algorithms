<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="150" font-size="20" fill="black">- main() initializes the tree and inserts nodes</text>
  <text x="70" y="200" font-size="20" fill="black">- insertBST() handles node insertion</text>
  <text x="70" y="250" font-size="20" fill="black">- bfsprint() performs BFS traversal</text>
  <text x="70" y="300" font-size="20" fill="black">- printTree() performs DFS traversal (in-order)</text>
</svg>
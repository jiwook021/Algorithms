<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">6. BFS Traversal Steps</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="150" font-size="20" fill="black">1. Enqueue root (10)</text>
  <text x="70" y="200" font-size="20" fill="black">2. Dequeue 10, enqueue 9 and 12</text>
  <text x="70" y="250" font-size="20" fill="black">3. Dequeue 9, no children</text>
  <text x="70" y="300" font-size="20" fill="black">4. Dequeue 12, enqueue 13</text>
  <text x="70" y="350" font-size="20" fill="black">5. Dequeue 13, no children</text>
</svg>
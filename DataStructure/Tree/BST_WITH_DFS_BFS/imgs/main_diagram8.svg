<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">8. Queue Usage in BFS</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="150" font-size="20" fill="black">- Queue is implemented as a static array</text>
  <text x="70" y="200" font-size="20" fill="black">- head and tail pointers track queue state</text>
  <text x="70" y="250" font-size="20" fill="black">- Enqueue: Add to tail, increment tail</text>
  <text x="70" y="300" font-size="20" fill="black">- Dequeue: Remove from head, increment head</text>
</svg>
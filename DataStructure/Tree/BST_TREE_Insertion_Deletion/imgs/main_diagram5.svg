<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" fill="black">5. Insertion Process</text>
  <rect x="50" y="70" width="1100" height="700" stroke="black" fill="none"/>
  <text x="100" y="120" font-size="20" fill="black">Step 1: Check if root is NULL</text>
  <text x="100" y="150" font-size="16" fill="black">If true, set root to new node</text>
  <text x="100" y="180" font-size="20" fill="black">Step 2: Traverse tree</text>
  <text x="100" y="210" font-size="16" fill="black">Compare data with current node</text>
  <text x="100" y="240" font-size="16" fill="black">Move left or right accordingly</text>
  <text x="100" y="270" font-size="20" fill="black">Step 3: Insert new node</text>
  <text x="100" y="300" font-size="16" fill="black">Attach new node to parent</text>
</svg>
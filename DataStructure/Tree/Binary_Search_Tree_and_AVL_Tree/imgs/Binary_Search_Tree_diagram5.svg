<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">5. BST Insertion Process</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="110" font-size="20" fill="black">1. Check if root is null</text>
  <text x="70" y="140" font-size="20" fill="black">2. Insert new node if null</text>
  <text x="70" y="170" font-size="20" fill="black">3. Compare data with current node</text>
  <text x="70" y="200" font-size="20" fill="black">4. Recursively insert left or right</text>
  <text x="70" y="230" font-size="20" fill="black">5. Rebalance the tree</text>
</svg>
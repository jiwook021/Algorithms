<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">8. LR and RL Rotations</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="100" font-size="18" fill="black">- LR: Left-Right rotation (combines LL and RR)</text>
  <text x="70" y="130" font-size="18" fill="black">- RL: Right-Left rotation (combines RR and LL)</text>
</svg>
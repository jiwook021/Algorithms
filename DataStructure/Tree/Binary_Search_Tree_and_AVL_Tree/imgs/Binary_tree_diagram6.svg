<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">6. Tree Traversal Visualization</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="100" y="120" font-size="20" fill="black">Tree Traversal Paths</text>
  <text x="100" y="160" font-size="16" fill="black">- Inorder: 1 -> 2 -> 3 -> 4 -> 5 -> 6 -> 7</text>
  <text x="100" y="190" font-size="16" fill="black">- Preorder: 4 -> 2 -> 1 -> 3 -> 6 -> 5 -> 7</text>
  <text x="100" y="220" font-size="16" fill="black">- Postorder: 1 -> 3 -> 2 -> 5 -> 7 -> 6 -> 4</text>
</svg>
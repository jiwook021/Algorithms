<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="100" y="120" font-size="20" fill="black">Tree Traversal Algorithms</text>
  <text x="100" y="160" font-size="16" fill="black">- Inorder: Left -> Root -> Right</text>
  <text x="100" y="190" font-size="16" fill="black">- Preorder: Root -> Left -> Right</text>
  <text x="100" y="220" font-size="16" fill="black">- Postorder: Left -> Right -> Root</text>
</svg>
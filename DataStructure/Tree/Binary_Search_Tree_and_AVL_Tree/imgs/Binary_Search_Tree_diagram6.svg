<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">6. BST Search Process</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="110" font-size="20" fill="black">1. Start at root node</text>
  <text x="70" y="140" font-size="20" fill="black">2. Compare target with current node</text>
  <text x="70" y="170" font-size="20" fill="black">3. Move left if target is smaller</text>
  <text x="70" y="200" font-size="20" fill="black">4. Move right if target is larger</text>
  <text x="70" y="230" font-size="20" fill="black">5. Return node if found, else null</text>
</svg>
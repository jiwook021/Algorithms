<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="110" font-size="20" fill="black">- BSTMakeAndInit: Initializes the BST</text>
  <text x="70" y="140" font-size="20" fill="black">- BSTInsert: Inserts a node into the BST</text>
  <text x="70" y="170" font-size="20" fill="black">- BSTSearch: Searches for a node in the BST</text>
  <text x="70" y="200" font-size="20" fill="black">- BSTRemove: Removes a node from the BST</text>
  <text x="70" y="230" font-size="20" fill="black">- Rebalance: Ensures the BST remains balanced</text>
</svg>
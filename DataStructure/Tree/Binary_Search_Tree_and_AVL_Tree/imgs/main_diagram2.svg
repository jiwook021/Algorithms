<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="20" fill="black">1. BSTMakeAndInit: Initialize BST</text>
  <text x="70" y="160" font-size="20" fill="black">2. BSTInsert: Insert elements into BST</text>
  <text x="70" y="200" font-size="20" fill="black">3. Travelpreorder: Pre-order traversal</text>
  <text x="70" y="240" font-size="20" fill="black">4. Travelinorder: In-order traversal</text>
  <text x="70" y="280" font-size="20" fill="black">5. Travelpostorder: Post-order traversal</text>
  <text x="70" y="320" font-size="20" fill="black">6. BSTSearch: Search for elements in BST</text>
  <text x="70" y="360" font-size="20" fill="black">7. BSTGetNodeData: Retrieve node data</text>
</svg>
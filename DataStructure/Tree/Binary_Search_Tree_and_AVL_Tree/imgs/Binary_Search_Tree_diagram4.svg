<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">4. BST Node Structure</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="110" font-size="20" fill="black">- Each node contains:</text>
  <text x="90" y="140" font-size="20" fill="black">- Data: Integer value</text>
  <text x="90" y="170" font-size="20" fill="black">- Left: Pointer to left child</text>
  <text x="90" y="200" font-size="20" fill="black">- Right: Pointer to right child</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">4. Threaded Binary Tree Structure</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="110" font-size="18" fill="black">- Nodes contain:</text>
  <text x="90" y="140" font-size="16" fill="black">1. Left and right pointers</text>
  <text x="90" y="170" font-size="16" fill="black">2. lthread and rthread flags</text>
  <text x="90" y="200" font-size="16" fill="black">3. Data value</text>
  <text x="70" y="240" font-size="18" fill="black">- Threads:</text>
  <text x="90" y="270" font-size="16" fill="black">1. Left thread points to in-order predecessor</text>
  <text x="90" y="300" font-size="16" fill="black">2. Right thread points to in-order successor</text>
</svg>
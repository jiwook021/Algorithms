<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">7. Memory Management</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="110" font-size="18" fill="black">- Memory Allocation:</text>
  <text x="90" y="140" font-size="16" fill="black">1. malloc() used to allocate memory for new nodes</text>
  <text x="70" y="180" font-size="18" fill="black">- Memory Leak Prevention:</text>
  <text x="90" y="210" font-size="16" fill="black">1. No explicit free() calls in this code</text>
  <text x="90" y="240" font-size="16" fill="black">2. Memory is managed by the OS after program exit</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">8. Error Handling</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="110" font-size="18" fill="black">- Duplicate Key Handling:</text>
  <text x="90" y="140" font-size="16" fill="black">1. Check for duplicate keys during insertion</text>
  <text x="90" y="170" font-size="16" fill="black">2. Print error message if duplicate found</text>
  <text x="70" y="210" font-size="18" fill="black">- Empty Tree Handling:</text>
  <text x="90" y="240" font-size="16" fill="black">1. Check if root is NULL in inprint()</text>
  <text x="90" y="270" font-size="16" fill="black">2. Print "Tree is empty" if true</text>
</svg>
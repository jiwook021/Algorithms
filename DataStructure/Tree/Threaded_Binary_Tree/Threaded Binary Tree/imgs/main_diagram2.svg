<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="110" font-size="18" fill="black">- Insertion Algorithm:</text>
  <text x="90" y="140" font-size="16" fill="black">1. Traverse tree to find insertion point</text>
  <text x="90" y="170" font-size="16" fill="black">2. Handle duplicate keys</text>
  <text x="90" y="200" font-size="16" fill="black">3. Insert new node and adjust threads</text>
  <text x="70" y="240" font-size="18" fill="black">- In-order Successor Algorithm:</text>
  <text x="90" y="270" font-size="16" fill="black">1. If right thread is true, return right child</text>
  <text x="90" y="300" font-size="16" fill="black">2. Else, find leftmost node in right subtree</text>
</svg>
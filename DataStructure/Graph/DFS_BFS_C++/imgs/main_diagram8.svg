<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">8. Input and Output Flow</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">Input:</text>
  <text x="90" y="180" font-size="18" fill="black">- Number of vertices, edges, and start node</text>
  <text x="90" y="220" font-size="18" fill="black">- Edge connections (src, dest)</text>
  <text x="70" y="280" font-size="20" fill="black">Output:</text>
  <text x="90" y="320" font-size="18" fill="black">- Traversal order of nodes</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms: DFS and BFS</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">DFS Algorithm:</text>
  <text x="90" y="180" font-size="18" fill="black">1. Mark current node as visited</text>
  <text x="90" y="220" font-size="18" fill="black">2. Recursively visit unvisited neighbors</text>
  <text x="70" y="280" font-size="20" fill="black">BFS Algorithm:</text>
  <text x="90" y="320" font-size="18" fill="black">1. Use queue to track nodes</text>
  <text x="90" y="360" font-size="18" fill="black">2. Mark and enqueue start node</text>
  <text x="90" y="400" font-size="18" fill="black">3. Dequeue and process nodes level by level</text>
</svg>
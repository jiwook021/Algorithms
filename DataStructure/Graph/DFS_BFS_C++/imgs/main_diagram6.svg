<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">6. DFS Traversal Process</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">1. Start at the given node</text>
  <text x="70" y="180" font-size="20" fill="black">2. Mark node as visited</text>
  <text x="70" y="220" font-size="20" fill="black">3. Recursively visit unvisited neighbors</text>
  <text x="70" y="260" font-size="20" fill="black">4. Output node during traversal</text>
</svg>
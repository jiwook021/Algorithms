<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="100" width="1100" height="600" fill="lightgray" stroke="black"/>
  <text x="100" y="150" font-size="20" fill="black">QueueInit: Initializes front and rear to 0</text>
  <text x="100" y="200" font-size="20" fill="black">QIsEmpty: Checks if front == rear</text>
  <text x="100" y="250" font-size="20" fill="black">NextPosIdx: Calculates next position in circular manner</text>
  <text x="100" y="300" font-size="20" fill="black">Enqueue: Adds data to rear, checks for overflow</text>
  <text x="100" y="350" font-size="20" fill="black">Dequeue: Removes data from front, checks for underflow</text>
  <text x="100" y="400" font-size="20" fill="black">QPeek: Returns data at front without removing it</text>
</svg>
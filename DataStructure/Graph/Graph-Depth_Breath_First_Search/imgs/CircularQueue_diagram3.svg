<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="100" width="1100" height="600" fill="lightgray" stroke="black"/>
  <circle cx="200" cy="200" r="50" fill="lightblue" stroke="black"/>
  <text x="180" y="210" font-size="20" fill="black">Init</text>
  <circle cx="400" cy="200" r="50" fill="lightblue" stroke="black"/>
  <text x="370" y="210" font-size="20" fill="black">Empty</text>
  <circle cx="600" cy="200" r="50" fill="lightblue" stroke="black"/>
  <text x="560" y="210" font-size="20" fill="black">Enqueue</text>
  <circle cx="800" cy="200" r="50" fill="lightblue" stroke="black"/>
  <text x="760" y="210" font-size="20" fill="black">Dequeue</text>
  <line x1="250" y1="200" x2="350" y2="200" stroke="black"/>
  <line x1="450" y1="200" x2="550" y2="200" stroke="black"/>
  <line x1="650" y1="200" x2="750" y2="200" stroke="black"/>

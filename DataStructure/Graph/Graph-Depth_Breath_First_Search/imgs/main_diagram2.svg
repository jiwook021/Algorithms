<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="20" fill="black">BFS Algorithm</text>
  <text x="70" y="160" font-size="20" fill="black">├── Initialize queue</text>
  <text x="70" y="200" font-size="20" fill="black">├── Mark start vertex as visited</text>
  <text x="70" y="240" font-size="20" fill="black">├── Enqueue start vertex</text>
  <text x="70" y="280" font-size="20" fill="black">├── While queue is not empty:</text>
  <text x="70" y="320" font-size="20" fill="black">│   ├── Dequeue vertex</text>
  <text x="70" y="360" font-size="20" fill="black">│   ├── Process vertex</text>
  <text x="70" y="400" font-size="20" fill="black">│   ├── Enqueue adjacent vertices</text>
  <text x="70" y="440" font-size="20" fill="black">│   └── Mark adjacent vertices as visited</text>
  <text x="70" y="480" font-size="20" fill="black">DFS Algorithm</text>
  <text x="70" y="520" font-size="20" fill="black">├── Mark start vertex as visited</text>
  <text x="70" y="560" font-size="20" fill="black">├── Process vertex</text>
  <text x="70" y="600" font-size="20" fill="black">├── Recursively visit adjacent vertices</text>
</svg>
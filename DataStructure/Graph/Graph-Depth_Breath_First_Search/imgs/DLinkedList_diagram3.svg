<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="18" fill="black">ListInit: head -> NULL, numOfData = 0</text>
  <text x="70" y="180" font-size="18" fill="black">FInsert: head -> newNode -> next node</text>
  <text x="70" y="220" font-size="18" fill="black">SInsert: head -> ... -> pred -> newNode -> next node</text>
  <text x="70" y="260" font-size="18" fill="black">LFirst: before = head, cur = head->next</text>
  <text x="70" y="300" font-size="18" fill="black">LNext: before = cur, cur = cur->next</text>
  <text x="70" y="340" font-size="18" fill="black">LRemove: before->next = cur->next, cur = before</text>
  <text x="70" y="380" font-size="18" fill="black">LCount: Returns numOfData</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="18" fill="black">ListInit: Initializes the list with a dummy head node</text>
  <text x="70" y="180" font-size="18" fill="black">FInsert: Inserts data at the front of the list</text>
  <text x="70" y="220" font-size="18" fill="black">SInsert: Inserts data in sorted order</text>
  <text x="70" y="260" font-size="18" fill="black">LFirst / LNext: Traverses the list</text>
  <text x="70" y="300" font-size="18" fill="black">LRemove: Removes the current node</text>
  <text x="70" y="340" font-size="18" fill="black">LCount: Returns the number of nodes</text>
  <text x="70" y="380" font-size="18" fill="black">SetSortRule: Sets the sorting rule for SInsert</text>
</svg>
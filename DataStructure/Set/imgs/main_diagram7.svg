<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">7. Iterator Operations</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="110" font-size="20" fill="black">Iterator Operations</text>
  <text x="70" y="140" font-size="16" fill="black">i1 = st1.begin(), i2 = st1.begin()</text>
  <text x="70" y="170" font-size="16" fill="black">b1 = st1.key_comp()(*i1, *i1) → false</text>
  <text x="70" y="200" font-size="16" fill="black">b2 = st1.key_comp()(*i1, *++i2) → true</text>
</svg>
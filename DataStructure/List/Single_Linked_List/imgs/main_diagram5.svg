<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">5. List Node Structure</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="150" font-size="20" fill="black">- Node: Contains data (int) and a pointer to the next node.</text>
  <text x="70" y="200" font-size="20" fill="black">- List: Contains size (sz), head (pointer to first node), and tail (pointer to last node).</text>
</svg>
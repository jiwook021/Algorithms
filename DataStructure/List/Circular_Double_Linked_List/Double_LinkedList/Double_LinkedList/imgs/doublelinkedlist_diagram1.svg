<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="100" y="150" font-size="20" fill="black">LinkedList Structure</text>
  <rect x="100" y="180" width="1000" height="100" fill="#d3d3d3" stroke="black"/>
  <text x="120" y="230" font-size="16" fill="black">head: Pointer to the first node</text>
  <text x="120" y="260" font-size="16" fill="black">tail: Pointer to the last node</text>
  <text x="120" y="290" font-size="16" fill="black">current: Pointer to the current node</text>
  <text x="120" y="320" font-size="16" fill="black">size: Number of nodes</text>
  <text x="120" y="350" font-size="16" fill="black">init: Initialization flag</text>
  <text x="100" y="400" font-size="20" fill="black">Functions</text>
  <rect x="100" y="430" width="1000" height="100" fill="#d3d3d3" stroke="black"/>
  <text x="120" y="480" font-size="16" fill="black">initLinkedList(): Initializes the linked list</text>
  <text x="120" y="510" font-size="16" fill="black">insert(): Inserts a new node</text>
</svg>
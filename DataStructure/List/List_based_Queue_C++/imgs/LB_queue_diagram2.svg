<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="100" y="100" width="300" height="200" fill="#c0c0c0" stroke="black"/>
  <text x="150" y="150" font-size="18" fill="black">enqueue() Algorithm</text>
  <text x="120" y="200" font-size="14" fill="black">1. Create new node</text>
  <text x="120" y="230" font-size="14" fill="black">2. Set node data</text>
  <text x="120" y="260" font-size="14" fill="black">3. Update front/rear</text>
  <rect x="500" y="100" width="300" height="200" fill="#c0c0c0" stroke="black"/>
  <text x="550" y="150" font-size="18" fill="black">dequeue() Algorithm</text>
  <text x="520" y="200" font-size="14" fill="black">1. Get front node</text>
  <text x="520" y="230" font-size="14" fill="black">2. Update front pointer</text>
  <text x="520" y="260" font-size="14" fill="black">3. Return data</text>
  <rect x="900" y="100" width="300" height="200" fill="#c0c0c0" stroke="black"/>
  <text x="950" y="150" font-size="18" fill="black">peek() Algorithm</text>
  <text x="920" y="200" font-size="14" fill="black">1. Return front data</text>
</svg>
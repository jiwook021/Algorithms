<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">6. Error Handling</text>
  <rect x="100" y="100" width="400" height="200" fill="#c0c0c0" stroke="black"/>
  <text x="150" y="150" font-size="18" fill="black">dequeue() on Empty Queue</text>
  <text x="120" y="200" font-size="14" fill="black">No explicit error handling</text>
  <text x="120" y="230" font-size="14" fill="black">Potential undefined behavior</text>
  <rect x="600" y="100" width="400" height="200" fill="#c0c0c0" stroke="black"/>
  <text x="650" y="150" font-size="18" fill="black">peek() on Empty Queue</text>
  <text x="620" y="200" font-size="14" fill="black">No explicit error handling</text>

<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">Initial State</text>
  <text x="70" y="180" font-size="16" fill="black">Head: 0, Tail: 0, Size: 0</text>
  <line x1="70" y1="200" x2="1080" y2="200" stroke="black"/>
  <text x="70" y="240" font-size="20" fill="black">After Push Operations</text>
  <text x="70" y="280" font-size="16" fill="black">Head: 0, Tail: 10, Size: 10</text>
  <line x1="70" y1="300" x2="1080" y2="300" stroke="black"/>
  <text x="70" y="340" font-size="20" fill="black">After Pop Operations</text>
  <text x="70" y="380" font-size="16" fill="black">Head: 5, Tail: 10, Size: 5</text>
  <line x1="70" y1="400" x2="1080" y2="400" stroke="black"/>
  <text x="70" y="440" font-size="20" fill="black">Final State</text>
  <text x="70" y="480" font-size="16" fill="black">Head: 10, Tail: 10, Size: 0</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">1. Initial State: front = -1, rear = -1</text>
  <text x="70" y="180" font-size="20" fill="black">2. Enqueue: rear moves forward, data inserted</text>
  <text x="70" y="220" font-size="20" fill="black">3. Dequeue: front moves forward, data removed</text>
  <text x="70" y="260" font-size="20" fill="black">4. Empty State: front = rear = -1</text>
  <line x1="70" y1="280" x2="1100" y2="280" stroke="black" stroke-width="2"/>
  <text x="70" y="320" font-size="20" fill="black">Circular Buffer: Wraps around using modulo</text>
  <text x="70" y="360" font-size="20" fill="black">State Transitions: Empty -> Non-Empty -> Full -> Empty</text>
</svg>
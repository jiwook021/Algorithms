<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">7. Peek Operation</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">1. Check if Queue is Empty</text>
  <text x="70" y="180" font-size="20" fill="black">2. Return data at front index</text>
  <line x1="70" y1="200" x2="1100" y2="200" stroke="black" stroke-width="2"/>
  <text x="70" y="240" font-size="20" fill="black">Example:</text>
  <text x="70" y="280" font-size="20" fill="black">Peek(): return items[front]</text>
  <text x="70" y="320" font-size="20" fill="black">No changes to front or rear</text>
</svg>
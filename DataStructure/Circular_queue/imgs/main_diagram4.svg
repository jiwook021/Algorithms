<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">4. Circular Queue Structure</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">1. Array of size QUEUE_SIZE</text>
  <text x="70" y="180" font-size="20" fill="black">2. Front and Rear Pointers</text>
  <text x="70" y="220" font-size="20" fill="black">3. Circular Nature: Modulo Arithmetic</text>
  <line x1="70" y1="240" x2="1100" y2="240" stroke="black" stroke-width="2"/>
  <text x="70" y="280" font-size="20" fill="black">Visualization:</text>
  <rect x="70" y="320" width="1000" height="100" fill="lightblue" stroke="black" stroke-width="2"/>
  <text x="80" y="360" font-size="20" fill="black">[0] [1] [2] ... [QUEUE_SIZE-1]</text>
  <text x="80" y="400" font-size="20" fill="black">Front: Index of first element</text>
  <text x="80" y="440" font-size="20" fill="black">Rear: Index of last element</text>
</svg>
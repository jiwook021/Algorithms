<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" font-weight="bold">2. Key Algorithms</text>
  <rect x="50" y="80" width="1100" height="600" fill="#ffffff" stroke="#000000"/>
  <text x="70" y="120" font-size="18">encodeRemainingLength Algorithm</text>
  <text x="70" y="150" font-size="14">1. Take least significant 7 bits</text>
  <text x="70" y="180" font-size="14">2. Shift right by 7 bits</text>
  <text x="70" y="210" font-size="14">3. Set continuation bit if more bytes follow</text>
  <text x="70" y="240" font-size="14">4. Repeat until length is 0</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">5. Resource Management</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="100" y="150" font-size="20" fill="black">Forks as Shared Resources</text>
  <text x="100" y="200" font-size="16" fill="black">1. Forks are shared between adjacent philosophers</text>
  <text x="100" y="250" font-size="16" fill="black">2. Mutex ensures exclusive access to forks</text>
  <text x="100" y="300" font-size="16" fill="black">3. Condition variables manage waiting states</text>

<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="100" y="150" font-size="20" fill="black">Main Workflow</text>
  <text x="100" y="200" font-size="16" fill="black">1. Initialize philosophers and resources</text>
  <text x="100" y="250" font-size="16" fill="black">2. Create threads for each philosopher</text>
  <text x="100" y="300" font-size="16" fill="black">3. Philosophers alternate between thinking, hungry, and eating states</text>
  <text x="100" y="350" font-size="16" fill="black">4. Threads run indefinitely until manually terminated</text>
</svg>
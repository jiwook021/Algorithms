<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="100" y="150" font-size="20" fill="black">Philosopher Lifecycle</text>
  <text x="100" y="200" font-size="16" fill="black">1. Think for a random duration</text>
  <text x="100" y="250" font-size="16" fill="black">2. Become hungry and attempt to pick up forks</text>
  <text x="100" y="300" font-size="16" fill="black">3. Eat for a random duration if forks are available</text>
  <text x="100" y="350" font-size="16" fill="black">4. Repeat the cycle indefinitely</text>
</svg>
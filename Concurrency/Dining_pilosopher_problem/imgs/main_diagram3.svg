<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="100" y="150" font-size="20" fill="black">State Transitions</text>
  <text x="100" y="200" font-size="16" fill="black">1. THINKING → HUNGRY (when philosopher gets hungry)</text>
  <text x="100" y="250" font-size="16" fill="black">2. HUNGRY → EATING (when forks are available)</text>
  <text x="100" y="300" font-size="16" fill="black">3. EATING → THINKING (after eating)</text>
</svg>
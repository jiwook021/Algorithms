<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="110" font-size="18" fill="black">State Transitions</text>
  <rect x="70" y="130" width="1060" height="620" fill="#e0e0e0" stroke="black"/>
  <text x="90" y="170" font-size="16" fill="black">- Initialization: Empty List</text>
  <text x="90" y="200" font-size="16" fill="black">- Insertion: Node Addition</text>
  <text x="90" y="230" font-size="16" fill="black">- Deletion: Node Removal</text>
  <text x="90" y="260" font-size="16" fill="black">- Traversal: Data Access</text>
  <text x="90" y="290" font-size="16" fill="black">- Size Update: Concurrent Modifications</text>
</svg>
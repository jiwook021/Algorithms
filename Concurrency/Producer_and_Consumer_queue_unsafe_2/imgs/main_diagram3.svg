<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow</text>
  <rect x="50" y="100" width="1100" height="600" stroke="black" fill="none"/>
  <text x="100" y="150" font-size="20" fill="black">Producer to Queue</text>
  <rect x="100" y="200" width="1000" height="100" stroke="black" fill="lightblue"/>
  <text x="120" y="250" font-size="18" fill="black">Item Produced → Enqueue → SafeQueue</text>
  <text x="100" y="350" font-size="20" fill="black">Queue to Consumer</text>
  <rect x="100" y="400" width="1000" height="100" stroke="black" fill="lightgreen"/>
  <text x="120" y="450" font-size="18" fill="black">SafeQueue → Dequeue → Item Consumed</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms</text>
  <rect x="50" y="100" width="1100" height="600" stroke="black" fill="none"/>
  <text x="100" y="150" font-size="20" fill="black">Producer Algorithm</text>
  <rect x="100" y="200" width="1000" height="100" stroke="black" fill="lightblue"/>
  <text x="120" y="250" font-size="18" fill="black">1. Acquire Slot Semaphore</text>
  <text x="120" y="280" font-size="18" fill="black">2. Enqueue Item</text>
  <text x="120" y="310" font-size="18" fill="black">3. Release Item Semaphore</text>
  <text x="100" y="400" font-size="20" fill="black">Consumer Algorithm</text>
  <rect x="100" y="450" width="1000" height="100" stroke="black" fill="lightgreen"/>
  <text x="120" y="500" font-size="18" fill="black">1. Acquire Item Semaphore</text>
  <text x="120" y="530" font-size="18" fill="black">2. Dequeue Item</text>
  <text x="120" y="560" font-size="18" fill="black">3. Release Slot Semaphore</text>
</svg>
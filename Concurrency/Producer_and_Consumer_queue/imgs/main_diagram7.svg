<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">7. Thread Timing</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">Producer Timing</text>
  <rect x="70" y="160" width="500" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="80" y="190" font-size="16" fill="black">Sleeps for 50ms after producing</text>
  <text x="70" y="260" font-size="20" fill="black">Consumer Timing</text>
  <rect x="70" y="280" width="500" height="50" fill="#d3d3f8" stroke="black" stroke-width="1"/>
  <text x="80" y="310" font-size="16" fill="black">Sleeps for 100ms after consuming</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">5. Queue State Management</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">Queue Operations</text>
  <rect x="70" y="160" width="500" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="80" y="190" font-size="16" fill="black">push(): Adds item to queue</text>
  <rect x="70" y="220" width="500" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="80" y="250" font-size="16" fill="black">pop(): Removes item from queue</text>
  <text x="70" y="320" font-size="20" fill="black">Queue State</text>
  <rect x="70" y="340" width="500" height="50" fill="#f0f0f0" stroke="black" stroke-width="1"/>
  <text x="80" y="370" font-size="16" fill="black">Empty: No items to consume</text>
  <rect x="70" y="400" width="500" height="50" fill="#f0f0f0" stroke="black" stroke-width="1"/>
  <text x="80" y="430" font-size="16" fill="black">Full: No slots to produce</text>
</svg>
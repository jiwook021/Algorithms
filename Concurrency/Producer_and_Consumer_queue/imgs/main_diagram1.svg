<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">Main Function</text>
  <rect x="70" y="160" width="200" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="80" y="190" font-size="16" fill="black">Create ProducerConsumerQueue</text>
  <rect x="70" y="220" width="200" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="80" y="250" font-size="16" fill="black">Start Producer Thread</text>
  <rect x="70" y="280" width="200" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="80" y="310" font-size="16" fill="black">Start Consumer Thread</text>
  <rect x="70" y="340" width="200" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="80" y="370" font-size="16" fill="black">Join Threads</text>
  <rect x="300" y="100" width="200" height="600" fill="#f8d3d3" stroke="black" stroke-width="2"/>
  <text x="310" y="140" font-size="20" fill="black">Producer Thread</text>
  <rect x="310" y="160" width="180" height="50" fill="#f8d3d3" stroke="black" stroke-width="1"/>
  <text x="320" y="190" font-size="16" fill="black">Produce Items</text>
  <rect x="310" y="220" width="180" height="50" fill="#f8d3d3" stroke="black" stroke-width="1"/>
  <text x="320" y="250" font-size="16" fill="black">Call produce()</text>
  <rect x="310" y="280" width="180" height="50" fill="#f8d3d3" stroke="black" stroke-width="1"/>
  <text x="320" y="310" font-size="16" fill="black">Sleep</text>
  <rect x="550" y="100" width="200" height="600" fill="#d3d3f8" stroke="black" stroke-width="2"/>
  <text x="560" y="140" font-size="20" fill="black">Consumer Thread</text>
  <rect x="560" y="160" width="180" height="50" fill="#d3d3f8" stroke="black" stroke-width="1"/>
  <text x="570" y="190" font-size="16" fill="black">Consume Items</text>
  <rect x="560" y="220" width="180" height="50" fill="#d3d3f8" stroke="black" stroke-width="1"/>
  <text x="570" y="250" font-size="16" fill="black">Call consume()</text>
  <rect x="560" y="280" width="180" height="50" fill="#d3d3f8" stroke="black" stroke-width="1"/>
  <text x="570" y="310" font-size="16" fill="black">Sleep</text>
  <rect x="800" y="100" width="300" height="600" fill="#f0f0f0" stroke="black" stroke-width="2"/>
  <text x="810" y="140" font-size="20" fill="black">ProducerConsumerQueue</text>
  <rect x="810" y="160" width="280" height="50" fill="#f0f0f0" stroke="black" stroke-width="1"/>
  <text x="820" y="190" font-size="16" fill="black">Queue Operations</text>
  <rect x="810" y="220" width="280" height="50" fill="#f0f0f0" stroke="black" stroke-width="1"/>
  <text x="820" y="250" font-size="16" fill="black">Semaphore Management</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">Producer Data Flow</text>
  <rect x="70" y="160" width="500" height="50" fill="#d3f8d3" stroke="black" stroke-width="1"/>
  <text x="80" y="190" font-size="16" fill="black">Item -> Queue (via produce())</text>
  <text x="70" y="260" font-size="20" fill="black">Consumer Data Flow</text>
  <rect x="70" y="280" width="500" height="50" fill="#d3d3f8" stroke="black" stroke-width="1"/>
  <text x="80" y="310" font-size="16" fill="black">Queue -> Item (via consume())</text>
  <text x="70" y="380" font-size="20" fill="black">Semaphore State Transitions</text>
  <rect x="70" y="400" width="500" height="50" fill="#f0f0f0" stroke="black" stroke-width="1"/>
  <text x="80" y="430" font-size="16" fill="black">m_availableSlots: Decrease on produce, Increase on consume</text>
  <rect x="70" y="460" width="500" height="50" fill="#f0f0f0" stroke="black" stroke-width="1"/>
  <text x="80" y="490" font-size="16" fill="black">m_availableItems: Increase on produce, Decrease on consume</text>
</svg>
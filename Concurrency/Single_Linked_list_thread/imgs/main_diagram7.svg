<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">7. Load Factor and Rehashing Trigger</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="110" font-size="20" fill="black">Load Factor:</text>
  <text x="90" y="140" font-size="16" fill="black">- Ratio of elements to buckets</text>
  <text x="90" y="170" font-size="16" fill="black">- Triggers rehashing when exceeded</text>

<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow and State Transitions</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="110" font-size="20" fill="black">Data Flow:</text>
  <text x="90" y="140" font-size="16" fill="black">- Key-value pairs flow into buckets</text>
  <text x="90" y="170" font-size="16" fill="black">- Buckets are locked during operations</text>
  <text x="90" y="200" font-size="16" fill="black">- Elements are redistributed during rehashing</text>
  <text x="70" y="230" font-size="20" fill="black">State Transitions:</text>
  <text x="90" y="260" font-size="16" fill="black">- Normal State: Operations proceed as usual</text>
  <text x="90" y="290" font-size="16" fill="black">- Rehashing State: All operations are blocked</text>
  <text x="90" y="320" font-size="16" fill="black">- Post-Rehashing State: Operations resume with new buckets</text>
</svg>
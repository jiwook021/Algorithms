<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="120" font-size="20" fill="black">Client Request</text>
  <rect x="70" y="140" width="1060" height="100" fill="#e0e0ff" stroke="black" stroke-width="1"/>
  <text x="80" y="170" font-size="16" fill="black">- Client sends request to server</text>
  <text x="80" y="200" font-size="16" fill="black">- Request includes function name and arguments</text>
  <text x="70" y="250" font-size="20" fill="black">Server Processing</text>
  <rect x="70" y="270" width="1060" height="100" fill="#e0ffe0" stroke="black" stroke-width="1"/>
  <text x="80" y="300" font-size="16" fill="black">- Server parses request</text>
  <text x="80" y="330" font-size="16" fill="black">- Executes registered function</text>
  <text x="70" y="380" font-size="20" fill="black">Response</text>
  <rect x="70" y="400" width="1060" height="100" fill="#ffe0e0" stroke="black" stroke-width="1"/>
  <text x="80" y="430" font-size="16" fill="black">- Server sends result back to client</text>
  <text x="80" y="460" font-size="16" fill="black">- Client receives and processes response</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">6. Shutdown Process</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="150" font-size="20" fill="black">Shutdown Initiation</text>
  <rect x="100" y="170" width="1000" height="100" fill="#d3d3d3" stroke="black" stroke-width="1"/>
  <text x="120" y="220" font-size="16" fill="black">- isRunning_ set to false</text>
  <text x="120" y="250" font-size="16" fill="black">- notify_all() called</text>
  <text x="100" y="300" font-size="20" fill="black">Thread Termination</text>
  <rect x="100" y="320" width="1000" height="100" fill="#d3d3d3" stroke="black" stroke-width="1"/>
  <text x="120" y="370" font-size="16" fill="black">- Threads exit workerThread() loop</text>
  <text x="120" y="400" font-size="16" fill="black">- Threads joined in shutdown()</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">4. Thread Synchronization</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="150" font-size="20" fill="black">Mutex Usage</text>
  <rect x="100" y="170" width="1000" height="100" fill="#d3d3d3" stroke="black" stroke-width="1"/>
  <text x="120" y="220" font-size="16" fill="black">- Protects access to task queue</text>
  <text x="120" y="250" font-size="16" fill="black">- Ensures thread-safe enqueue/dequeue</text>
  <text x="100" y="300" font-size="20" fill="black">Condition Variable</text>
  <rect x="100" y="320" width="1000" height="100" fill="#d3d3d3" stroke="black" stroke-width="1"/>
  <text x="120" y="370" font-size="16" fill="black">- Notifies threads when tasks are available</text>
  <text x="120" y="400" font-size="16" fill="black">- Used to wake up waiting threads</text>
</svg>
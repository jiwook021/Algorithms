<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">8. Main Function Workflow</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">ThreadPool Creation</text>
  <rect x="70" y="160" width="1060" height="100" fill="#e0e0e0" stroke="black" stroke-width="1"/>
  <text x="80" y="200" font-size="16" fill="black">- ThreadPool is created with 4 worker threads</text>
  <text x="80" y="230" font-size="16" fill="black">- Worker threads start waiting for tasks</text>
  <text x="70" y="280" font-size="20" fill="black">Task Submission</text>
  <rect x="70" y="300" width="1060" height="100" fill="#e0e0e0" stroke="black" stroke-width="1"/>
  <text x="80" y="340" font-size="16" fill="black">- 8 tasks are enqueued for execution</text>
  <text x="80" y="370" font-size="16" fill="black">- Each task simulates work with a sleep</text>
  <text x="70" y="420" font-size="20" fill="black">Task Completion</text>
  <rect x="70" y="440" width="1060" height="100" fill="#e0e0e0" stroke="black" stroke-width="1"/>
  <text x="80" y="480" font-size="16" fill="black">- Main thread waits for tasks to complete</text>
  <text x="80" y="510" font-size="16" fill="black">- ThreadPool is destroyed after tasks finish</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" font-weight="bold">2. Key Algorithms</text>
  <rect x="50" y="100" width="1100" height="600" fill="#ffffff" stroke="#000000"/>
  <text x="70" y="140" font-size="20">PID Control Algorithm</text>
  <rect x="70" y="160" width="1060" height="520" fill="#e0e0e0" stroke="#000000"/>
  <text x="90" y="200" font-size="18">1. Calculate error: setpoint - processVariable</text>
  <text x="90" y="230" font-size="18">2. Compute time delta (auto or manual)</text>
  <text x="90" y="260" font-size="18">3. Calculate proportional term: kp * error</text>
  <text x="90" y="290" font-size="18">4. Update integral term: ki * integralSum</text>
  <text x="90" y="320" font-size="18">5. Calculate derivative term: kd * (error - lastError) / dt</text>
  <text x="90" y="350" font-size="18">6. Sum terms and clamp output</text>
</svg>
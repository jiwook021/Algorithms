<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">6. Trapezoidal Rule Application</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="110" font-size="20" fill="black">1. Compute sinsum(0.0, terms) and sinsum(pi, terms)</text>
  <text x="70" y="150" font-size="20" fill="black">2. Subtract 0.5 * (sinsum(0.0, terms) + sinsum(pi, terms)) from cpu_sum</text>
  <text x="70" y="190" font-size="20" fill="black">3. Multiply cpu_sum by step_size</text>
</svg>
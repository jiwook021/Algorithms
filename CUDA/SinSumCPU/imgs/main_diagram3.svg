<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">3. Data Flow / State Transitions</text>
  <rect x="50" y="70" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="110" font-size="20" fill="black">1. Input: steps, terms</text>
  <text x="70" y="150" font-size="20" fill="black">2. Compute step_size = pi / (steps-1)</text>
  <text x="70" y="190" font-size="20" fill="black">3. For each step, compute x = step_size * step</text>
  <text x="70" y="230" font-size="20" fill="black">4. Compute sinsum(x, terms) and accumulate in cpu_sum</text>
  <text x="70" y="270" font-size="20" fill="black">5. Apply Trapezoidal Rule correction</text>
  <text x="70" y="310" font-size="20" fill="black">6. Output: cpu_sum, steps, terms, cpu_time</text>
</svg>
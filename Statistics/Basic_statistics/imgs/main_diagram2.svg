<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" font-weight="bold">2. Key Algorithms / Processes</text>
  <rect x="50" y="80" width="1100" height="700" stroke="black" fill="none"/>
  <text x="100" y="120" font-size="20">1. Mean Calculation: Sum all values and divide by count</text>
  <text x="100" y="160" font-size="20">2. Slope Calculation: Covariance / Variance</text>
  <text x="100" y="200" font-size="20">3. Intercept Calculation: mean_y - m * mean_x</text>
  <text x="100" y="240" font-size="20">4. Prediction: y = m * x + b</text>
  <text x="100" y="280" font-size="20">5. Mean Squared Error: Average of squared errors</text>
</svg>
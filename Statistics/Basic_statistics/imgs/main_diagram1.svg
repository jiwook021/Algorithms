  <text x="100" y="240" font-size="20">4. Predict y for new x</text>
  <text x="100" y="280" font-size="20">5. Calculate Mean Squared Error (MSE)</text>
  <text x="100" y="320" font-size="20">6. Output Results</text>
</svg>
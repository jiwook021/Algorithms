<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" font-weight="bold">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="80" width="1100" height="700" stroke="black" fill="none"/>
  <text x="100" y="120" font-size="20">1. Input Data (x, y)</text>
  <text x="100" y="160" font-size="20">2. Calculate Mean (mean_x, mean_y)</text>

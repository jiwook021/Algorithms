<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" font-weight="bold">8. Mean Squared Error Calculation</text>
  <rect x="50" y="80" width="1100" height="700" stroke="black" fill="none"/>
  <text x="100" y="120" font-size="20">1. Initialize sum_error = 0</text>
  <text x="100" y="160" font-size="20">2. Iterate through x and y vectors</text>
  <text x="100" y="200" font-size="20">3. Calculate predicted y for each x</text>
  <text x="100" y="240" font-size="20">4. Calculate error = y[i] - predicted_y</text>
  <text x="100" y="280" font-size="20">5. Update sum_error with squared error</text>
  <text x="100" y="320" font-size="20">6. Return sum_error / x.size()</text>
</svg>
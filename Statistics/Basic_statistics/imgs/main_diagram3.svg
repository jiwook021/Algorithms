<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" font-weight="bold">3. Data Flow / State Transitions</text>
  <rect x="50" y="80" width="1100" height="700" stroke="black" fill="none"/>
  <text x="100" y="120" font-size="20">1. Input Data → Mean Calculation → mean_x, mean_y</text>
  <text x="100" y="160" font-size="20">2. mean_x, mean_y → Slope Calculation → m</text>
  <text x="100" y="200" font-size="20">3. mean_y, m, mean_x → Intercept Calculation → b</text>
  <text x="100" y="240" font-size="20">4. m, b, x → Prediction → predicted_y</text>
  <text x="100" y="280" font-size="20">5. x, y, m, b → MSE Calculation → mse</text>
</svg>
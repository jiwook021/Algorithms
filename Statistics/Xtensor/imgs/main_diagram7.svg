<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#f0f0f0"/>
    <text x="50" y="50" font-size="24" fill="black">7. Sequence Generation</text>
    <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black"/>
    <text x="70" y="120" font-size="20" fill="black">linspace(), arange()</text>
    <text x="70" y="160" font-size="16" fill="black">- Generate sequences with specific ranges</text>
    <text x="70" y="200" font-size="16" fill="black">- linspace: evenly spaced values</text>
    <text x="70" y="240" font-size="16" fill="black">- arange: values with fixed step</text>

<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">1. Overall Architecture / Main Workflow</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="140" font-size="20" fill="black">1. Load Data Points</text>
  <text x="70" y="180" font-size="20" fill="black">2. Initialize K-Means Clustering</text>
  <text x="70" y="220" font-size="20" fill="black">3. Assign Points to Clusters</text>
  <text x="70" y="260" font-size="20" fill="black">4. Update Centroids</text>
  <text x="70" y="300" font-size="20" fill="black">5. Repeat Until Convergence</text>
  <text x="70" y="340" font-size="20" fill="black">6. Output Results</text>
  <line x1="70" y1="150" x2="70" y2="350" stroke="black" stroke-width="2"/>
  <line x1="70" y1="350" x2="1000" y2="350" stroke="black" stroke-width="2"/>
  <line x1="1000" y1="150" x2="1000" y2="350" stroke="black" stroke-width="2"/>
</svg>
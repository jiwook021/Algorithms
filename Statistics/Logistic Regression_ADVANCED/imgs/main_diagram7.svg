<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">7. Logistic Regression Training Process</text>
  <rect x="50" y="80" width="1100" height="700" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="18" fill="black">1. Initialize Weights and Bias</text>
  <text x="70" y="150" font-size="18" fill="black">2. Forward Pass</text>
  <text x="70" y="180" font-size="18" fill="black">3. Calculate Loss</text>
  <text x="70" y="210" font-size="18" fill="black">4. Backward Pass (Gradient Descent)</text>
  <text x="70" y="240" font-size="18" fill="black">5. Update Weights and Bias</text>
  <text x="70" y="270" font-size="18" fill="black">6. Repeat Until Convergence</text>
</svg>
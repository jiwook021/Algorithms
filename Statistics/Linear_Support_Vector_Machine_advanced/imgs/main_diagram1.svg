<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" font-weight="bold">1. Overall Architecture</text>
  <rect x="50" y="100" width="1100" height="600" stroke="black" stroke-width="2" fill="none"/>
  <text x="100" y="150" font-size="20">DataPoint Structure</text>
  <text x="100" y="200" font-size="16">- Represents a data point with features (x1, x2) and a label</text>
  <text x="100" y="250" font-size="20">DataPreprocessor Class</text>
  <text x="100" y="300" font-size="16">- Fits to training data (calculates mean, std)</text>
  <text x="100" y="350" font-size="16">- Transforms data using Z-score normalization</text>
  <text x="100" y="400" font-size="20">Main Workflow</text>
  <text x="100" y="450" font-size="16">1. Load dataset</text>
  <text x="100" y="500" font-size="16">2. Fit preprocessor</text>
  <text x="100" y="550" font-size="16">3. Transform data</text>
  <text x="100" y="600" font-size="16">4. Use normalized data for further processing</text>
</svg>
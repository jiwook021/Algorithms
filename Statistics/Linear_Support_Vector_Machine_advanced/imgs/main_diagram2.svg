<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" font-weight="bold">2. Key Algorithms</text>
  <rect x="50" y="100" width="1100" height="600" stroke="black" stroke-width="2" fill="none"/>
  <text x="100" y="150" font-size="20">Z-score Normalization</text>
  <text x="100" y="200" font-size="16">- Calculate mean and standard deviation for each feature</text>
  <text x="100" y="250" font-size="16">- Normalize: (x - mean) / std</text>
  <text x="100" y="300" font-size="20">Data Transformation</text>
  <text x="100" y="350" font-size="16">- Apply normalization to each data point</text>
  <text x="100" y="400" font-size="16">- Handle edge cases (e.g., division by zero)</text>
  <text x="100" y="450" font-size="20">Error Handling</text>
  <text x="100" y="500" font-size="16">- Check for empty dataset</text>
  <text x="100" y="550" font-size="16">- Ensure preprocessor is fitted before transformation</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" font-weight="bold">3. Data Flow</text>
  <rect x="50" y="100" width="1100" height="600" stroke="black" stroke-width="2" fill="none"/>
  <text x="100" y="150" font-size="20">Raw Data</text>
  <text x="100" y="200" font-size="16">- Input dataset with features (x1, x2) and labels</text>
  <text x="100" y="250" font-size="20">Preprocessing</text>
  <text x="100" y="300" font-size="16">- Fit preprocessor: calculate mean and std</text>
  <text x="100" y="350" font-size="16">- Transform data: normalize features</text>
  <text x="100" y="400" font-size="20">Normalized Data</text>
  <text x="100" y="450" font-size="16">- Output dataset with scaled features</text>
  <text x="100" y="500" font-size="20">State Transitions</text>
  <text x="100" y="550" font-size="16">- Preprocessor: unfitted → fitted</text>
  <text x="100" y="600" font-size="16">- Data: raw → normalized</text>
</svg>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" font-weight="bold">7. Feature Scaling</text>
  <rect x="50" y="100" width="1100" height="600" stroke="black" stroke-width="2" fill="none"/>
  <text x="100" y="150" font-size="20">Z-score Normalization</text>
  <text x="100" y="200" font-size="16">- Mean = 0, Standard Deviation = 1</text>
  <text x="100" y="250" font-size="16">- Formula: (x - mean) / std</text>
  <text x="100" y="300" font-size="20">Benefits</text>
  <text x="100" y="350" font-size="16">- Standardizes features to similar scales</text>
  <text x="100" y="400" font-size="16">- Improves performance of machine learning models</text>
</svg>
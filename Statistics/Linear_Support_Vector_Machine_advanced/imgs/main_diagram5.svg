<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="50" y="50" font-size="24" font-weight="bold">5. DataPreprocessor Class</text>
  <rect x="50" y="100" width="1100" height="600" stroke="black" stroke-width="2" fill="none"/>
  <text x="100" y="150" font-size="20">Private Members</text>
  <text x="100" y="200" font-size="16">- is_fitted: Tracks if preprocessor is fitted</text>
  <text x="100" y="250" font-size="16">- x1_mean, x2_mean: Mean values for features</text>
  <text x="100" y="300" font-size="16">- x1_std, x2_std: Standard deviations for features</text>
  <text x="100" y="350" font-size="20">Public Methods</text>
  <text x="100" y="400" font-size="16">- fit(): Calculates mean and std</text>
  <text x="100" y="450" font-size="16">- transform(): Normalizes data</text>
  <text x="100" y="500" font-size="16">- transform_point(): Normalizes a single point</text>
  <text x="100" y="550" font-size="16">- print_parameters(): Displays preprocessor stats</text>
</svg>
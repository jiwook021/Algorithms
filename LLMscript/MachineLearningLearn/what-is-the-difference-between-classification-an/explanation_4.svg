<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f2f6"/>
      <stop offset="100%" stop-color="#dfe4ea"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg-gradient3)" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">Loss Functions</text>
  
  <!-- Classification Loss -->
  <rect x="50" y="50" width="230" height="320" fill="#ff9f43" opacity="0.8" rx="10" ry="10"/>
  <text x="165" y="80" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Classification Loss</text>
  
  <!-- Cross-Entropy Loss Graph -->
  <line x1="80" y1="250" x2="250" y2="250" stroke="white" stroke-width="2"/>
  <line x1="80" y1="120" x2="80" y2="250" stroke="white" stroke-width="2"/>
  
  <path d="M80,250 C120,250 120,120 165,120 S210,180 250,250" stroke="#feca57" stroke-width="3" fill="none"/>
  
  <text x="165" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Predicted Probability</text>
  <text x="70" y="185" font-family="Arial" font-size="12" text-anchor="middle" transform="rotate(-90,70,185)" fill="white">Loss Value</text>
  
  <text x="80" y="265" font-family="Arial" font-size="10" text-anchor="middle" fill="white">0</text>
  <text x="250" y="265" font-family="Arial" font-size="10" text-anchor="middle" fill="white">1</text>
  
  <text x="165" y="110" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Cross-Entropy Loss</text>
  
  <!-- Classification Loss Code -->
  <rect x="70" y="290" width="190" height="70" fill="#ff9f43" opacity="0.9" rx="5" ry="5"/>
  <text x="75" y="305" font-family="Courier New" font-size="10" fill="white">// Cross-entropy loss</text>
  <text x="75" y="320" font-family="Courier New" font-size="10" fill="white">double loss = -target * log(pred)</text>
  <text x="75" y="335" font-family="Courier New" font-size="10" fill="white">           - (1-target) *</text>
  <text x="75" y="350" font-family="Courier New" font-size="10" fill="white">             log(1-pred);</text>
  
  <!-- Regression Loss -->
  <rect x="320" y="50" width="230" height="320" fill="#0abde3" opacity="0.8" rx="10" ry="10"/>
  <text x="435" y="80" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Regression Loss</text>
  
  <!-- MSE Loss Graph -->
  <line x1="350" y1="250" x2="520" y2="250" stroke="white" stroke-width="2"/>
  <line x1="435" y1="120" x2="435" y2="250" stroke="white" stroke-width="2"/>
  
  <path d="M350,250 Q380,180 435,120 Q490,180 520,250" stroke="#48dbfb" stroke-width="3" fill="none"/>
  
  <text x="435" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Prediction Error</text>
  <text x="340" y="185" font-family="Arial" font-size="12" text-anchor="middle" transform="rotate(-90,340,185)" fill="white">Loss Value</text>
  
  <text x="435" y="265" font-family="Arial" font-size="10" text-anchor="middle" fill="white">0</text>
  <text x="350" y="265" font-family="Arial" font-size="10" text-anchor="middle" fill="white">-</text>
  <text x="520" y="265" font-family="Arial" font-size="10" text-anchor="middle" fill="white">+</text>
  
  <text x="435" y="110" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Mean Squared Error</text>
  
  <!-- Regression Loss Code -->
  <rect x="340" y="290" width="190" height="70" fill="#0abde3" opacity="0.9" rx="5" ry="5"/>
  <text x="345" y="305" font-family="Courier New" font-size="10" fill="white">// Mean Squared Error</text>
  <text x="345" y="320" font-family="Courier New" font-size="10" fill="white">double error = pred - target;</text>
  <text x="345" y="335" font-family="Courier New" font-size="10" fill="white">double loss = error * error;</text>
  <text x="345" y="350" font-family="Courier New" font-size="10" fill="white">// Or: pow(pred-target, 2);</text>
</svg>
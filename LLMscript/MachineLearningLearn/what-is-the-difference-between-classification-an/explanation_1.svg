<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Classification vs Regression: Basic Concept</text>
  
  <!-- Classification Section -->
  <rect x="50" y="80" width="320" height="380" fill="#e6f7ff" stroke="#1890ff" stroke-width="2" rx="10" ry="10"/>
  <text x="210" y="110" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1890ff">Classification</text>
  <text x="210" y="140" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Predicts discrete categories/classes</text>
  
  <!-- Classification Example -->
  <circle cx="130" cy="200" r="10" fill="#ff4d4f"/>
  <circle cx="150" cy="220" r="10" fill="#ff4d4f"/>
  <circle cx="170" cy="190" r="10" fill="#ff4d4f"/>
  <circle cx="120" cy="240" r="10" fill="#ff4d4f"/>
  
  <circle cx="250" cy="230" r="10" fill="#52c41a"/>
  <circle cx="270" cy="250" r="10" fill="#52c41a"/>
  <circle cx="290" cy="220" r="10" fill="#52c41a"/>
  <circle cx="260" cy="270" r="10" fill="#52c41a"/>
  
  <circle cx="200" cy="320" r="10" fill="#faad14"/>
  <circle cx="220" cy="340" r="10" fill="#faad14"/>
  <circle cx="240" cy="310" r="10" fill="#faad14"/>
  <circle cx="190" cy="350" r="10" fill="#faad14"/>
  
  <!-- Decision Boundary -->
  <path d="M 100 170 Q 210 280 320 170" stroke="#1890ff" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  <path d="M 100 290 Q 210 200 320 290" stroke="#1890ff" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  
  <text x="210" y="390" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Example: Email spam detection,</text>
  <text x="210" y="410" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">disease diagnosis, sentiment analysis</text>
  
  <!-- Regression Section -->
  <rect x="430" y="80" width="320" height="380" fill="#f6ffed" stroke="#52c41a" stroke-width="2" rx="10" ry="10"/>
  <text x="590" y="110" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#52c41a">Regression</text>
  <text x="590" y="140" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Predicts continuous values</text>
  
  <!-- Regression Example -->
  <line x1="470" y1="350" x2="710" y2="350" stroke="#333" stroke-width="2"/>
  <line x1="470" y1="350" x2="470" y2="170" stroke="#333" stroke-width="2"/>
  
  <!-- X-axis labels -->
  <text x="590" y="370" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Feature X</text>
  
  <!-- Y-axis labels -->
  <text x="450" y="260" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" transform="rotate(-90 450 260)">Target Value</text>
  
  <!-- Data points -->
  <circle cx="490" cy="320" r="5" fill="#722ed1"/>
  <circle cx="520" cy="300" r="5" fill="#722ed1"/>
  <circle cx="550" cy="270" r="5" fill="#722ed1"/>
  <circle cx="580" cy="250" r="5" fill="#722ed1"/>
  <circle cx="610" cy="230" r="5" fill="#722ed1"/>
  <circle cx="640" cy="210" r="5" fill="#722ed1"/>
  <circle cx="670" cy="190" r="5" fill="#722ed1"/>
  
  <!-- Regression line -->
  <line x1="480" y1="330" x2="680" y2="180" stroke="#52c41a" stroke-width="3"/>
  
  <text x="590" y="390" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Example: House price prediction,</text>
  <text x="590" y="410" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">temperature forecasting, stock prices</text>
  
  <!-- Code Example -->
  <text x="400" y="460" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Key Difference: Output Type</text>
  <text x="400" y="480" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Classification → Categories/Classes | Regression → Continuous Values</text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Common Activation Functions and Their Properties</text>
  
  <!-- Graph area -->
  <rect x="50" y="60" width="500" height="200" fill="white" stroke="#ddd" stroke-width="1" />
  
  <!-- Axes -->
  <line x1="50" y1="160" x2="550" y2="160" stroke="#333" stroke-width="2" /> <!-- x-axis -->
  <line x1="300" y1="60" x2="300" y2="260" stroke="#333" stroke-width="1" stroke-dasharray="4,4" /> <!-- y=0 line -->
  <text x="310" y="175" font-family="Arial" font-size="12" fill="#333">0</text>
  
  <!-- Axis labels -->
  <text x="300" y="280" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Input (x)</text>
  <text x="30" y="160" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" transform="rotate(-90, 30, 160)">Output</text>
  
  <!-- ReLU function -->
  <polyline points="50,160 300,160 550,60" fill="none" stroke="#ff6b6b" stroke-width="3" />
  <text x="400" y="100" font-family="Arial" font-size="14" fill="#ff6b6b" font-weight="bold">ReLU</text>
  
  <!-- Sigmoid function -->
  <path d="M50,240 Q175,240 300,160 Q425,80 550,80" fill="none" stroke="#4ecdc4" stroke-width="3" />
  <text x="500" y="100" font-family="Arial" font-size="14" fill="#4ecdc4" font-weight="bold">Sigmoid</text>
  
  <!-- Tanh function -->
  <path d="M50,220 Q175,220 300,160 Q425,100 550,100" fill="none" stroke="#ffd166" stroke-width="3" />
  <text x="100" y="230" font-family="Arial" font-size="14" fill="#ffd166" font-weight="bold">Tanh</text>
  
  <!-- Leaky ReLU -->
  <polyline points="50,180 300,160 550,60" fill="none" stroke="#6a0572" stroke-width="3" />
  <text x="150" y="180" font-family="Arial" font-size="14" fill="#6a0572" font-weight="bold">Leaky ReLU</text>
  
  <!-- Function properties table -->
  <rect x="50" y="290" width="500" height="100" fill="#e9ecef" rx="5" ry="5" />
  
  <!-- Table headers -->
  <text x="70" y="310" font-family="Arial" font-size="12" font-weight="bold" fill="#333">Function</text>
  <text x="170" y="310" font-family="Arial" font-size="12" font-weight="bold" fill="#333">Range</text>
  <text x="270" y="310" font-family="Arial" font-size="12" font-weight="bold" fill="#333">Differentiable</text>
  <text x="390" y="310" font-family="Arial" font-size="12" font-weight="bold" fill="#333">Common Use</text>
  
  <!-- Table rows -->
  <line x1="50" y1="315" x2="550" y2="315" stroke="#333" stroke-width="1" />
  
  <!-- ReLU row -->
  <text x="70" y="335" font-family="Arial" font-size="12" fill="#ff6b6b">ReLU</text>
  <text x="170" y="335" font-family="Arial" font-size="12" fill="#333">[0, ∞)</text>
  <text x="270" y="335" font-family="Arial" font-size="12" fill="#333">No (at x=0)</text>
  <text x="390" y="335" font-family="Arial" font-size="12" fill="#333">Hidden layers, CNNs</text>
  
  <!-- Sigmoid row -->
  <text x="70" y="355" font-family="Arial" font-size="12" fill="#4ecdc4">Sigmoid</text>
  <text x="170" y="355" font-family="Arial" font-size="12" fill="#333">(0, 1)</text>
  <text x="270" y="355" font-family="Arial" font-size="12" fill="#333">Yes</text>
  <text x="390" y="355" font-family="Arial" font-size="12" fill="#333">Binary classification, output layer</text>
  
  <!-- Tanh row -->
  <text x="70" y="375" font-family="Arial" font-size="12" fill="#ffd166">Tanh</text>
  <text x="170" y="375" font-family="Arial" font-size="12" fill="#333">(-1, 1)</text>
  <text x="270" y="375" font-family="Arial" font-size="12" fill="#333">Yes</text>
  <text x="390" y="375" font-family="Arial" font-size="12" fill="#333">Hidden layers, RNNs</text>
  
  <!-- Leaky ReLU row -->
  <text x="70" y="395" font-family="Arial" font-size="12" fill="#6a0572">Leaky ReLU</text>
  <text x="170" y="395" font-family="Arial" font-size="12" fill="#333">(-∞, ∞)</text>
  <text x="270" y="395" font-family="Arial" font-size="12" fill="#333">No (at x=0)</text>
  <text x="390" y="395" font-family="Arial" font-size="12" fill="#333">Addressing "dying ReLU" problem</text>
</svg>
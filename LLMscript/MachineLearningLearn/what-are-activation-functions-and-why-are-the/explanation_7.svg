<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="400" fill="#f5f5f5" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Activation Functions: Basic Concept</text>
  
  <!-- Neural network node -->
  <circle cx="150" cy="200" r="50" fill="#6ab7ff" stroke="#3498db" stroke-width="2"/>
  <text x="150" y="200" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Weighted Sum</text>
  <text x="150" y="220" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Σ(w·x + b)</text>
  
  <!-- Activation function box -->
  <rect x="250" y="150" width="100" height="100" fill="#ffcc80" stroke="#e67e22" stroke-width="2" rx="5" ry="5"/>
  <text x="300" y="190" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Activation</text>
  <text x="300" y="210" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Function</text>
  
  <!-- Output node -->
  <circle cx="450" cy="200" r="50" fill="#aed581" stroke="#8bc34a" stroke-width="2"/>
  <text x="450" y="200" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Output</text>
  <text x="450" y="220" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">f(Σ(w·x + b))</text>
  
  <!-- Arrows -->
  <path d="M205 200 L245 200" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M355 200 L395 200" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  
  <!-- Explanation text -->
  <rect x="50" y="300" width="500" height="80" fill="#e8f4f8" stroke="#2980b9" stroke-width="1" rx="5" ry="5"/>
  <text x="60" y="320" font-family="Arial" font-size="14" fill="#333">Activation functions introduce non-linearity into neural networks.</text>
  <text x="60" y="345" font-family="Arial" font-size="14" fill="#333">Without them, neural networks would be limited to learning only linear</text>
  <text x="60" y="370" font-family="Arial" font-size="14" fill="#333">relationships, regardless of their depth or complexity.</text>
  
  <!-- Code example -->
  <rect x="50" y="60" width="500" height="70" fill="#f8f9fa" stroke="#ccc" stroke-width="1" rx="5" ry="5"/>
  <text x="60" y="80" font-family="Courier New" font-size="12" fill="#333">// C++ implementation of a simple activation function</text>
  <text x="60" y="100" font-family="Courier New" font-size="12" fill="#333">double relu(double x) {</text>
  <text x="60" y="120" font-family="Courier New" font-size="12" fill="#333">    return std::max(0.0, x);  // ReLU activation function</text>
  <text x="60" y="140" font-family="Courier New" font-size="12" fill="#333">}</text>
</svg>
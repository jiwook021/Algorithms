<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f5f5f5" />
  
  <!-- Title -->
  <text x="300" y="35" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold">Common Activation Functions and Their Properties</text>
  
  <!-- Graph area -->
  <rect x="50" y="60" width="500" height="220" fill="white" stroke="#ccc" stroke-width="1" />
  
  <!-- Axes -->
  <line x1="50" y1="170" x2="550" y2="170" stroke="black" stroke-width="2" /> <!-- x-axis -->
  <line x1="300" y1="60" x2="300" y2="280" stroke="black" stroke-width="2" /> <!-- y-axis -->
  <text x="310" y="185" font-family="Arial" font-size="12">0</text>
  <text x="540" y="185" font-family="Arial" font-size="12">x</text>
  <text x="290" y="70" font-family="Arial" font-size="12">y</text>
  
  <!-- ReLU function -->
  <polyline points="50,170 300,170 550,60" fill="none" stroke="#FF5733" stroke-width="3" />
  <text x="500" y="80" font-family="Arial" font-size="14" fill="#FF5733" font-weight="bold">ReLU</text>
  
  <!-- Sigmoid function -->
  <path d="M50,260 Q175,260 300,170 Q425,80 550,80" fill="none" stroke="#3498DB" stroke-width="3" />
  <text x="500" y="100" font-family="Arial" font-size="14" fill="#3498DB" font-weight="bold">Sigmoid</text>
  
  <!-- Tanh function -->
  <path d="M50,240 Q175,240 300,170 Q425,100 550,100" fill="none" stroke="#2ECC71" stroke-width="3" />
  <text x="500" y="120" font-family="Arial" font-size="14" fill="#2ECC71" font-weight="bold">Tanh</text>
  
  <!-- Leaky ReLU function -->
  <polyline points="50,190 300,170 550,60" fill="none" stroke="#9B59B6" stroke-width="3" />
  <text x="500" y="140" font-family="Arial" font-size="14" fill="#9B59B6" font-weight="bold">Leaky ReLU</text>
  
  <!-- Function properties table -->
  <rect x="50" y="290" width="500" height="100" fill="#e8e8e8" stroke="#aaa" stroke-width="1" />
  
  <!-- Table headers -->
  <line x1="50" y1="315" x2="550" y2="315" stroke="#aaa" stroke-width="1" />
  <text x="120" y="307" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Function</text>
  <text x="250" y="307" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Range</text>
  <text x="380" y="307" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Gradient</text>
  <text x="500" y="307" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Use Case</text>
  
  <!-- Table rows -->
  <line x1="190" y1="290" x2="190" y2="390" stroke="#aaa" stroke-width="1" />
  <line x1="310" y1="290" x2="310" y2="390" stroke="#aaa" stroke-width="1" />
  <line x1="450" y1="290" x2="450" y2="390" stroke="#aaa" stroke-width="1" />
  
  <!-- ReLU row -->
  <text x="120" y="335" font-family="Arial" font-size="12" text-anchor="middle" fill="#FF5733">ReLU</text>
  <text x="250" y="335" font-family="Arial" font-size="12" text-anchor="middle">[0, ∞)</text>
  <text x="380" y="335" font-family="Arial" font-size="12" text-anchor="middle">0 or 1</text>
  <text x="500" y="335" font-family="Arial" font-size="12" text-anchor="middle">Hidden layers, CNNs</text>
  
  <!-- Sigmoid row -->
  <text x="120" y="360" font-family="Arial" font-size="12" text-anchor="middle" fill="#3498DB">Sigmoid</text>
  <text x="250" y="360" font-family="Arial" font-size="12" text-anchor="middle">(0, 1)</text>
  <text x="380" y="360" font-family="Arial" font-size="12" text-anchor="middle">Vanishing gradient</text>
  <text x="500" y="360" font-family="Arial" font-size="12" text-anchor="middle">Binary classification</text>
  
  <!-- Tanh row -->
  <text x="120" y="385" font-family="Arial" font-size="12" text-anchor="middle" fill="#2ECC71">Tanh</text>
  <text x="250" y="385" font-family="Arial" font-size="12" text-anchor="middle">(-1, 1)</text>
  <text x="380" y="385" font-family="Arial" font-size="12" text-anchor="middle">Stronger gradients</text>
  <text x="500" y="385" font-family="Arial" font-size="12" text-anchor="middle">RNNs, hidden layers</text>
</svg>
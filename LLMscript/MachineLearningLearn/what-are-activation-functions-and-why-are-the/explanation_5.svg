<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Activation Functions: The Non-Linearity Component</text>
  
  <!-- Neuron diagram -->
  <circle cx="150" cy="200" r="60" fill="#6ab7ff" stroke="#005bb5" stroke-width="2" />
  <text x="150" y="200" font-family="Arial" font-size="14" text-anchor="middle">Neuron</text>
  <text x="150" y="220" font-family="Arial" font-size="12" text-anchor="middle">Σw·x + b</text>
  
  <!-- Arrow -->
  <line x1="210" y1="200" x2="290" y2="200" stroke="#333" stroke-width="2" />
  <polygon points="290,200 280,195 280,205" fill="#333" />
  
  <!-- Activation function box -->
  <rect x="290" y="170" width="100" height="60" rx="10" ry="10" fill="#ff9e6a" stroke="#b55a00" stroke-width="2" />
  <text x="340" y="205" font-family="Arial" font-size="14" text-anchor="middle">Activation</text>
  <text x="340" y="225" font-family="Arial" font-size="14" text-anchor="middle">Function</text>
  
  <!-- Output arrow -->
  <line x1="390" y1="200" x2="470" y2="200" stroke="#333" stroke-width="2" />
  <polygon points="470,200 460,195 460,205" fill="#333" />
  
  <!-- Output -->
  <circle cx="500" cy="200" r="30" fill="#7dff6a" stroke="#00b55a" stroke-width="2" />
  <text x="500" y="205" font-family="Arial" font-size="14" text-anchor="middle">Output</text>
  
  <!-- Explanation text -->
  <rect x="50" y="300" width="500" height="80" rx="10" ry="10" fill="#e6e6e6" stroke="#999" stroke-width="1" />
  <text x="60" y="320" font-family="Arial" font-size="14">
    <tspan x="60" y="320">Activation functions introduce non-linearity into neural networks.</tspan>
    <tspan x="60" y="345">Without them, neural networks would only be capable of learning</tspan>
    <tspan x="60" y="370">linear relationships, regardless of network depth.</tspan>
  </text>
  
  <!-- Code example -->
  <rect x="50" y="80" width="500" height="70" rx="5" ry="5" fill="#333" />
  <text x="60" y="100" font-family="Courier New" font-size="12" fill="white">
    <tspan x="60" y="100">// C++ example of applying an activation function</tspan>
    <tspan x="60" y="120">float relu(float x) {</tspan>
    <tspan x="60" y="140">    return std::max(0.0f, x);  // ReLU activation</tspan>
  </text>
</svg>
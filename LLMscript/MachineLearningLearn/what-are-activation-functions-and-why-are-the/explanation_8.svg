<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="400" fill="#f5f5f5" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Common Activation Functions</text>
  
  <!-- Graph coordinate system -->
  <line x1="100" y1="300" x2="500" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="100" x2="300" y2="300" stroke="#333" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="510" y="300" font-family="Arial" font-size="12" fill="#333">x</text>
  <text x="300" y="95" font-family="Arial" font-size="12" fill="#333">f(x)</text>
  <text x="290" y="315" font-family="Arial" font-size="12" fill="#333">0</text>
  
  <!-- ReLU function -->
  <path d="M100 300 L300 300 L500 100" stroke="#e74c3c" stroke-width="3" fill="none"/>
  <text x="460" y="120" font-family="Arial" font-size="14" fill="#e74c3c">ReLU</text>
  
  <!-- Sigmoid function -->
  <path d="M100 290 Q200 280 300 200 Q400 120 500 110" stroke="#3498db" stroke-width="3" fill="none"/>
  <text x="460" y="140" font-family="Arial" font-size="14" fill="#3498db">Sigmoid</text>
  
  <!-- Tanh function -->
  <path d="M100 250 Q200 100 300 200 Q400 300 500 150" stroke="#2ecc71" stroke-width="3" fill="none"/>
  <text x="460" y="160" font-family="Arial" font-size="14" fill="#2ecc71">Tanh</text>
  
  <!-- Leaky ReLU function -->
  <path d="M100 320 L300 300 L500 100" stroke="#9b59b6" stroke-width="3" fill="none"/>
  <text x="460" y="180" font-family="Arial" font-size="14" fill="#9b59b6">Leaky ReLU</text>
  
  <!-- Function explanations -->
  <rect x="50" y="330" width="500" height="60" fill="#e8f4f8" stroke="#2980b9" stroke-width="1" rx="5" ry="5"/>
  <text x="60" y="350" font-family="Arial" font-size="14" fill="#333">Different activation functions have unique properties that make them</text>
  <text x="60" y="370" font-family="Arial" font-size="14" fill="#333">suitable for specific tasks. They affect gradient flow and convergence speed.</text>
  
  <!-- Code example -->
  <rect x="50" y="40" width="500" height="50" fill="#f8f9fa" stroke="#ccc" stroke-width="1" rx="5" ry="5"/>
  <text x="60" y="60" font-family="Courier New" font-size="12" fill="#333">// C++ implementation of common activation functions</text>
  <text x="60" y="80" font-family="Courier New" font-size="12" fill="#333">double sigmoid(double x) { return 1.0 / (1.0 + exp(-x)); }</text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="300" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Precision, Recall, and F1-Score</text>
  
  <!-- Main visualization area -->
  <rect x="50" y="50" width="500" height="200" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  
  <!-- Circles representing data points -->
  <!-- True positives -->
  <circle cx="150" cy="120" r="10" fill="#4CAF50" stroke="#333" stroke-width="1"/>
  <circle cx="170" cy="100" r="10" fill="#4CAF50" stroke="#333" stroke-width="1"/>
  <circle cx="130" cy="110" r="10" fill="#4CAF50" stroke="#333" stroke-width="1"/>
  <circle cx="160" cy="140" r="10" fill="#4CAF50" stroke="#333" stroke-width="1"/>
  <circle cx="140" cy="130" r="10" fill="#4CAF50" stroke="#333" stroke-width="1"/>
  
  <!-- False positives -->
  <circle cx="190" cy="160" r="10" fill="#FF5722" stroke="#333" stroke-width="1"/>
  <circle cx="210" cy="150" r="10" fill="#FF5722" stroke="#333" stroke-width="1"/>
  
  <!-- False negatives -->
  <circle cx="350" cy="90" r="10" fill="#2196F3" stroke="#333" stroke-width="1"/>
  <circle cx="370" cy="100" r="10" fill="#2196F3" stroke="#333" stroke-width="1"/>
  <circle cx="360" cy="110" r="10" fill="#2196F3" stroke="#333" stroke-width="1"/>
  
  <!-- True negatives -->
  <circle cx="390" cy="170" r="10" fill="#9E9E9E" stroke="#333" stroke-width="1"/>
  <circle cx="410" cy="160" r="10" fill="#9E9E9E" stroke="#333" stroke-width="1"/>
  <circle cx="430" cy="180" r="10" fill="#9E9E9E" stroke="#333" stroke-width="1"/>
  <circle cx="400" cy="190" r="10" fill="#9E9E9E" stroke="#333" stroke-width="1"/>
  
  <!-- Decision boundary -->
  <line x1="270" y1="50" x2="270" y2="250" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Labels for regions -->
  <text x="150" y="80" font-size="14" text-anchor="middle" fill="#333">Predicted Positive</text>
  <text x="400" y="80" font-size="14" text-anchor="middle" fill="#333">Predicted Negative</text>
  
  <!-- Legend -->
  <rect x="100" y="270" width="400" height="110" rx="5" ry="5" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="300" y="290" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">Key Metrics</text>
  
  <!-- Precision -->
  <circle cx="120" cy="310" r="8" fill="#4CAF50" stroke="#333" stroke-width="1"/>
  <text x="135" y="315" font-size="14" fill="#333">TP</text>
  <circle cx="160" cy="310" r="8" fill="#FF5722" stroke="#333" stroke-width="1"/>
  <text x="175" y="315" font-size="14" fill="#333">FP</text>
  <text x="220" y="315" font-size="14" fill="#333">Precision = TP / (TP + FP)</text>
  <text x="400" y="315" font-size="12" fill="#555">How many selected items are relevant?</text>
  
  <!-- Recall -->
  <circle cx="120" cy="340" r="8" fill="#4CAF50" stroke="#333" stroke-width="1"/>
  <text x="135" y="345" font-size="14" fill="#333">TP</text>
  <circle cx="160" cy="340" r="8" fill="#2196F3" stroke="#333" stroke-width="1"/>
  <text x="175" y="345" font-size="14" fill="#333">FN</text>
  <text x="220" y="345" font-size="14" fill="#333">Recall = TP / (TP + FN)</text>
  <text x="400" y="345" font-size="12" fill="#555">How many relevant items are selected?</text>
  
  <!-- F1 Score -->
  <text x="220" y="370" font-size="14" fill="#333">F1 Score = 2 * (Precision * Recall) / (Precision + Recall)</text>
  <text x="400" y="370" font-size="12" fill="#555">Harmonic mean of precision and recall</text>
  
  <!-- C++ Code snippet -->
  <rect x="50" y="270" width="40" height="110" fill="#e8f4f8" stroke="#333" stroke-width="1"/>
  <text x="70" y="290" font-size="10" text-anchor="middle" fill="#333">C++</text>
  <text x="70" y="310" font-size="8" text-anchor="middle" fill="#333">double</text>
  <text x="70" y="325" font-size="8" text-anchor="middle" fill="#333">precision =</text>
  <text x="70" y="340" font-size="8" text-anchor="middle" fill="#333">tp /</text>
  <text x="70" y="355" font-size="8" text-anchor="middle" fill="#333">(tp + fp);</text>
</svg>
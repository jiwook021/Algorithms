<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Confusion Matrix for Classification Accuracy</text>
  
  <!-- Matrix background -->
  <rect x="150" y="80" width="300" height="200" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  
  <!-- Matrix dividers -->
  <line x1="150" y1="180" x2="450" y2="180" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="80" x2="300" y2="280" stroke="#333" stroke-width="2"/>
  
  <!-- Matrix labels -->
  <text x="225" y="70" font-family="Arial" font-size="16" text-anchor="middle">Predicted</text>
  <text x="140" y="180" font-family="Arial" font-size="16" text-anchor="end" transform="rotate(-90, 140, 180)">Actual</text>
  
  <!-- Class labels -->
  <text x="225" y="100" font-family="Arial" font-size="14" text-anchor="middle">Positive</text>
  <text x="375" y="100" font-family="Arial" font-size="14" text-anchor="middle">Negative</text>
  <text x="130" y="130" font-family="Arial" font-size="14" text-anchor="end">Positive</text>
  <text x="130" y="230" font-family="Arial" font-size="14" text-anchor="end">Negative</text>
  
  <!-- Cell values -->
  <rect x="151" y="81" width="148" height="98" fill="#a8d08d" fill-opacity="0.7"/>
  <rect x="301" y="81" width="148" height="98" fill="#f4b084" fill-opacity="0.7"/>
  <rect x="151" y="181" width="148" height="98" fill="#f4b084" fill-opacity="0.7"/>
  <rect x="301" y="181" width="148" height="98" fill="#a8d08d" fill-opacity="0.7"/>
  
  <text x="225" y="140" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">True Positive (TP)</text>
  <text x="375" y="140" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">False Negative (FN)</text>
  <text x="225" y="240" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">False Positive (FP)</text>
  <text x="375" y="240" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">True Negative (TN)</text>
  
  <!-- Formula -->
  <text x="300" y="310" font-family="Arial" font-size="16" text-anchor="middle">Accuracy = (TP + TN) / (TP + TN + FP + FN)</text>
  
  <!-- Code example -->
  <rect x="100" y="330" width="400" height="50" fill="#e6e6e6" stroke="#333" stroke-width="1" rx="5"/>
  <text x="110" y="350" font-family="Courier New" font-size="12">
    <tspan x="110" y="350">// C++ code to calculate accuracy</tspan>
    <tspan x="110" y="370">double accuracy = (double)(TP + TN) / (TP + TN + FP + FN);</tspan>
  </text>
</svg>
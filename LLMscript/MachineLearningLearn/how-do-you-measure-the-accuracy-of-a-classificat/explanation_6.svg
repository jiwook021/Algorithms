<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Confusion Matrix for Classification Accuracy</text>
  
  <!-- Confusion Matrix -->
  <rect x="150" y="80" width="300" height="240" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  
  <!-- Matrix Headers -->
  <text x="300" y="70" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Predicted Class</text>
  <text x="140" y="200" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" transform="rotate(-90, 140, 200)">Actual Class</text>
  
  <!-- Matrix Dividers -->
  <line x1="150" y1="140" x2="450" y2="140" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="80" x2="300" y2="320" stroke="#333" stroke-width="2"/>
  
  <!-- Matrix Cell Labels -->
  <text x="225" y="110" font-family="Arial" font-size="14" text-anchor="middle">Positive</text>
  <text x="375" y="110" font-family="Arial" font-size="14" text-anchor="middle">Negative</text>
  <text x="170" y="180" font-family="Arial" font-size="14" text-anchor="middle">Positive</text>
  <text x="170" y="260" font-family="Arial" font-size="14" text-anchor="middle">Negative</text>
  
  <!-- Matrix Cell Values -->
  <rect x="150" y="140" width="150" height="60" fill="#a8e6cf" stroke="#333"/>
  <rect x="300" y="140" width="150" height="60" fill="#ffaaa5" stroke="#333"/>
  <rect x="150" y="200" width="150" height="60" fill="#ffaaa5" stroke="#333"/>
  <rect x="300" y="200" width="150" height="60" fill="#a8e6cf" stroke="#333"/>
  
  <text x="225" y="180" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">TP</text>
  <text x="375" y="180" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">FN</text>
  <text x="225" y="240" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">FP</text>
  <text x="375" y="240" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">TN</text>
  
  <!-- Accuracy Formula -->
  <rect x="120" y="340" width="360" height="40" rx="5" ry="5" fill="#ddf4ff" stroke="#333"/>
  <text x="300" y="365" font-family="Arial" font-size="16" text-anchor="middle">
    Accuracy = (TP + TN) / (TP + TN + FP + FN)
  </text>
  
  <!-- Legend -->
  <rect x="480" y="140" width="20" height="20" fill="#a8e6cf" stroke="#333"/>
  <text x="505" y="155" font-family="Arial" font-size="12" text-anchor="start">Correct Predictions</text>
  
  <rect x="480" y="170" width="20" height="20" fill="#ffaaa5" stroke="#333"/>
  <text x="505" y="185" font-family="Arial" font-size="12" text-anchor="start">Incorrect Predictions</text>
  
  <!-- C++ Code Example -->
  <rect x="440" y="220" width="150" height="100" fill="#f5f5f5" stroke="#333" rx="5" ry="5"/>
  <text x="445" y="235" font-family="monospace" font-size="10">
    <tspan x="445" dy="0">// C++ Accuracy Calculation</tspan>
    <tspan x="445" dy="14">double accuracy =</tspan>
    <tspan x="445" dy="14">  static_cast&lt;double&gt;</tspan>
    <tspan x="445" dy="14">  (TP + TN) /</tspan>
    <tspan x="445" dy="14">  (TP + TN + FP + FN);</tspan>
  </text>
</svg>
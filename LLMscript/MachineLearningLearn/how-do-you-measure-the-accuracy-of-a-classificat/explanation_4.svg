<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="300" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Confusion Matrix for Classification Accuracy</text>
  
  <!-- Matrix Background -->
  <rect x="150" y="70" width="300" height="200" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  
  <!-- Matrix Grid -->
  <line x1="150" y1="170" x2="450" y2="170" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="70" x2="300" y2="270" stroke="#333" stroke-width="2"/>
  
  <!-- Matrix Labels -->
  <text x="225" y="130" font-size="16" text-anchor="middle" fill="#333">True Positive (TP)</text>
  <text x="225" y="150" font-size="12" text-anchor="middle" fill="#555">Correctly predicted</text>
  <text x="225" y="165" font-size="12" text-anchor="middle" fill="#555">as positive</text>
  
  <text x="375" y="130" font-size="16" text-anchor="middle" fill="#333">False Positive (FP)</text>
  <text x="375" y="150" font-size="12" text-anchor="middle" fill="#555">Incorrectly predicted</text>
  <text x="375" y="165" font-size="12" text-anchor="middle" fill="#555">as positive</text>
  
  <text x="225" y="220" font-size="16" text-anchor="middle" fill="#333">False Negative (FN)</text>
  <text x="225" y="240" font-size="12" text-anchor="middle" fill="#555">Incorrectly predicted</text>
  <text x="225" y="255" font-size="12" text-anchor="middle" fill="#555">as negative</text>
  
  <text x="375" y="220" font-size="16" text-anchor="middle" fill="#333">True Negative (TN)</text>
  <text x="375" y="240" font-size="12" text-anchor="middle" fill="#555">Correctly predicted</text>
  <text x="375" y="255" font-size="12" text-anchor="middle" fill="#555">as negative</text>
  
  <!-- Axis Labels -->
  <text x="120" y="170" font-size="14" text-anchor="end" font-weight="bold" fill="#333">Actual</text>
  <text x="300" y="60" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">Predicted</text>
  <text x="225" y="90" font-size="14" text-anchor="middle" fill="#333">Positive</text>
  <text x="375" y="90" font-size="14" text-anchor="middle" fill="#333">Negative</text>
  <text x="170" y="130" font-size="14" text-anchor="middle" fill="#333" transform="rotate(-90, 170, 130)">Positive</text>
  <text x="170" y="220" font-size="14" text-anchor="middle" fill="#333" transform="rotate(-90, 170, 220)">Negative</text>
  
  <!-- Accuracy Formula -->
  <rect x="100" y="300" width="400" height="70" rx="10" ry="10" fill="#e6f7ff" stroke="#0099cc" stroke-width="2"/>
  <text x="300" y="325" font-size="16" text-anchor="middle" fill="#333">Accuracy = (TP + TN) / (TP + TN + FP + FN)</text>
  <text x="300" y="350" font-size="14" text-anchor="middle" fill="#555">Measures the proportion of all correct predictions</text>
  <text x="300" y="370" font-size="14" text-anchor="middle" fill="#555">Range: 0 to 1 (higher is better)</text>
</svg>
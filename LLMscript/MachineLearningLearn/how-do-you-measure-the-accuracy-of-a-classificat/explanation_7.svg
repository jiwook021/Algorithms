<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">ROC Curve and AUC</text>
  
  <!-- Coordinate System -->
  <rect x="100" y="70" width="350" height="250" fill="#f9f9f9" stroke="#333" stroke-width="1"/>
  
  <!-- Axes -->
  <line x1="100" y1="320" x2="450" y2="320" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="320" x2="100" y2="70" stroke="#333" stroke-width="2"/>
  
  <!-- Axis Labels -->
  <text x="275" y="350" font-family="Arial" font-size="14" text-anchor="middle">False Positive Rate (1 - Specificity)</text>
  <text x="60" y="200" font-family="Arial" font-size="14" text-anchor="middle" transform="rotate(-90, 60, 200)">True Positive Rate (Sensitivity)</text>
  
  <!-- Axis Ticks -->
  <line x1="100" y1="320" x2="100" y2="325" stroke="#333" stroke-width="1"/>
  <line x1="187.5" y1="320" x2="187.5" y2="325" stroke="#333" stroke-width="1"/>
  <line x1="275" y1="320" x2="275" y2="325" stroke="#333" stroke-width="1"/>
  <line x1="362.5" y1="320" x2="362.5" y2="325" stroke="#333" stroke-width="1"/>
  <line x1="450" y1="320" x2="450" y2="325" stroke="#333" stroke-width="1"/>
  
  <line x1="95" y1="320" x2="100" y2="320" stroke="#333" stroke-width="1"/>
  <line x1="95" y1="257.5" x2="100" y2="257.5" stroke="#333" stroke-width="1"/>
  <line x1="95" y1="195" x2="100" y2="195" stroke="#333" stroke-width="1"/>
  <line x1="95" y1="132.5" x2="100" y2="132.5" stroke="#333" stroke-width="1"/>
  <line x1="95" y1="70" x2="100" y2="70" stroke="#333" stroke-width="1"/>
  
  <!-- Axis Values -->
  <text x="100" y="335" font-family="Arial" font-size="10" text-anchor="middle">0.0</text>
  <text x="187.5" y="335" font-family="Arial" font-size="10" text-anchor="middle">0.25</text>
  <text x="275" y="335" font-family="Arial" font-size="10" text-anchor="middle">0.5</text>
  <text x="362.5" y="335" font-family="Arial" font-size="10" text-anchor="middle">0.75</text>
  <text x="450" y="335" font-family="Arial" font-size="10" text-anchor="middle">1.0</text>
  
  <text x="90" y="323" font-family="Arial" font-size="10" text-anchor="end">0.0</text>
  <text x="90" y="260.5" font-family="Arial" font-size="10" text-anchor="end">0.25</text>
  <text x="90" y="198" font-family="Arial" font-size="10" text-anchor="end">0.5</text>
  <text x="90" y="135.5" font-family="Arial" font-size="10" text-anchor="end">0.75</text>
  <text x="90" y="73" font-family="Arial" font-size="10" text-anchor="end">1.0</text>
  
  <!-- Random Classifier Line -->
  <line x1="100" y1="320" x2="450" y2="70" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="260" y="200" font-family="Arial" font-size="10" text-anchor="middle" fill="#999">Random Classifier</text>
  
  <!-- ROC Curve -->
  <path d="M100,320 Q130,250 170,200 Q200,160 250,130 Q300,110 350,90 Q400,80 450,70" 
        fill="none" stroke="#4285f4" stroke-width="3"/>
  
  <!-- AUC Area -->
  <path d="M100,320 Q130,250 170,200 Q200,160 250,130 Q300,110 350,90 Q400,80 450,70 L450,320 Z" 
        fill="#4285f4" fill-opacity="0.2" stroke="none"/>
  
  <!-- Labels for the Curve -->
  <text x="300" y="100" font-family="Arial" font-size="14" text-anchor="middle" fill="#4285f4">ROC Curve</text>
  <text x="275" y="230" font-family="Arial" font-size="14" text-anchor="middle" fill="#4285f4" fill-opacity="0.7">AUC = 0.85</text>
  
  <!-- AUC Explanation -->
  <rect x="470" y="120" width="120" height="160" rx="5" ry="5" fill="#f5f5f5" stroke="#333"/>
  <text x="480" y="140" font-family="Arial" font-size="12">
    <tspan x="480" dy="0" font-weight="bold">AUC</tspan>
    <tspan x="480" dy="20">Area Under the ROC</tspan>
    <tspan x="480" dy="15">Curve measures the</tspan>
    <tspan x="480" dy="15">model's ability to</tspan>
    <tspan x="480" dy="15">discriminate between</tspan>
    <tspan x="480" dy="15">classes.</tspan>
    <tspan x="480" dy="20">AUC = 1.0: Perfect</tspan>
    <tspan x="480" dy="15">AUC = 0.5: Random</tspan>
  </text>
  
  <!-- C++ Code -->
  <rect x="470" y="290" width="120" height="80" rx="5" ry="5" fill="#e9f5ff" stroke="#333"/>
  <text x="480" y="305" font-family="monospace" font-size="8">
    <tspan x="480" dy="0">// C++ with sklearn-like API</tspan>
    <tspan x="480" dy="12">vector&lt;double&gt; y_true;</tspan>
    <tspan x="480" dy="12">vector&lt;double&gt; y_scores;</tspan>
    <tspan x="480" dy="12">// populate vectors</tspan>
    <tspan x="480" dy="12">double auc = calculate_auc</tspan>
    <tspan x="480" dy="12">(y_true, y_scores);</tspan>
  </text>
</svg>
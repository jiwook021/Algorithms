<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">ROC Curve and AUC</text>
  
  <!-- Coordinate system -->
  <rect x="100" y="70" width="350" height="250" fill="#f9f9f9" stroke="#333" stroke-width="1"/>
  
  <!-- Axes -->
  <line x1="100" y1="320" x2="450" y2="320" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="320" x2="100" y2="70" stroke="#333" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="275" y="350" font-family="Arial" font-size="14" text-anchor="middle">False Positive Rate (1 - Specificity)</text>
  <text x="60" y="195" font-family="Arial" font-size="14" text-anchor="middle" transform="rotate(-90, 60, 195)">True Positive Rate (Sensitivity)</text>
  
  <!-- Axis ticks -->
  <line x1="100" y1="320" x2="100" y2="325" stroke="#333" stroke-width="1"/>
  <line x1="275" y1="320" x2="275" y2="325" stroke="#333" stroke-width="1"/>
  <line x1="450" y1="320" x2="450" y2="325" stroke="#333" stroke-width="1"/>
  <line x1="95" y1="320" x2="100" y2="320" stroke="#333" stroke-width="1"/>
  <line x1="95" y1="195" x2="100" y2="195" stroke="#333" stroke-width="1"/>
  <line x1="95" y1="70" x2="100" y2="70" stroke="#333" stroke-width="1"/>
  
  <!-- Axis values -->
  <text x="100" y="335" font-family="Arial" font-size="12" text-anchor="middle">0.0</text>
  <text x="275" y="335" font-family="Arial" font-size="12" text-anchor="middle">0.5</text>
  <text x="450" y="335" font-family="Arial" font-size="12" text-anchor="middle">1.0</text>
  <text x="85" y="320" font-family="Arial" font-size="12" text-anchor="end">0.0</text>
  <text x="85" y="195" font-family="Arial" font-size="12" text-anchor="end">0.5</text>
  <text x="85" y="70" font-family="Arial" font-size="12" text-anchor="end">1.0</text>
  
  <!-- Random classifier line -->
  <line x1="100" y1="320" x2="450" y2="70" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="275" y="200" font-family="Arial" font-size="12" text-anchor="middle" fill="#999">Random Classifier</text>
  
  <!-- ROC curve -->
  <path d="M100,320 Q150,300 200,200 T300,120 T450,70" fill="none" stroke="#3366cc" stroke-width="3"/>
  <text x="350" y="110" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#3366cc">ROC Curve</text>
  
  <!-- AUC area -->
  <path d="M100,320 Q150,300 200,200 T300,120 T450,70 L450,320 Z" fill="#3366cc" fill-opacity="0.2"/>
  <text x="275" y="250" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#3366cc">AUC = 0.85</text>
  
  <!-- Explanation -->
  <rect x="470" y="100" width="120" height="200" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="5"/>
  <text x="480" y="120" font-family="Arial" font-size="12" font-weight="bold">AUC Interpretation:</text>
  <text x="480" y="145" font-family="Arial" font-size="11">
    <tspan x="480" y="145">0.9 - 1.0: Excellent</tspan>
    <tspan x="480" y="165">0.8 - 0.9: Good</tspan>
    <tspan x="480" y="185">0.7 - 0.8: Fair</tspan>
    <tspan x="480" y="205">0.6 - 0.7: Poor</tspan>
    <tspan x="480" y="225">0.5 - 0.6: Fail</tspan>
    <tspan x="480" y="245">0.5: Random</tspan>
  </text>
  
  <!-- Code example -->
  <rect x="100" y="360" width="400" height="30" fill="#e6e6e6" stroke="#333" stroke-width="1" rx="5"/>
  <text x="110" y="380" font-family="Courier New" font-size="12">
    <tspan x="110" y="380">// C++: Calculate AUC using sklearn-like library</tspan>
  </text>
</svg>
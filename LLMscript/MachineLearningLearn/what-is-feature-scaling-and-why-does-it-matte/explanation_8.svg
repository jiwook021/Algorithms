<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa" />
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Impact of Feature Scaling on ML Algorithms</text>
  
  <!-- Gradient Descent Convergence -->
  <rect x="50" y="60" width="500" height="120" fill="#fff0f6" rx="5" ry="5" stroke="#eb2f96" stroke-width="1" />
  <text x="300" y="80" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Gradient Descent Convergence</text>
  
  <!-- Unscaled Contour -->
  <ellipse cx="150" cy="120" rx="80" ry="30" fill="none" stroke="#eb2f96" stroke-width="1" />
  <ellipse cx="150" cy="120" rx="60" ry="22" fill="none" stroke="#eb2f96" stroke-width="1" />
  <ellipse cx="150" cy="120" rx="40" ry="15" fill="none" stroke="#eb2f96" stroke-width="1" />
  <ellipse cx="150" cy="120" rx="20" ry="7" fill="none" stroke="#eb2f96" stroke-width="1" />
  
  <!-- Unscaled Path -->
  <polyline points="230,120 200,125 170,128 150,120" fill="none" stroke="#ff4d4f" stroke-width="2" />
  <circle cx="230" cy="120" r="4" fill="#ff4d4f" />
  <circle cx="200" cy="125" r="4" fill="#ff4d4f" />
  <circle cx="170" cy="128" r="4" fill="#ff4d4f" />
  <circle cx="150" cy="120" r="4" fill="#ff4d4f" />
  
  <!-- Scaled Contour -->
  <circle cx="400" cy="120" r="80" fill="none" stroke="#1890ff" stroke-width="1" />
  <circle cx="400" cy="120" r="60" fill="none" stroke="#1890ff" stroke-width="1" />
  <circle cx="400" cy="120" r="40" fill="none" stroke="#1890ff" stroke-width="1" />
  <circle cx="400" cy="120" r="20" fill="none" stroke="#1890ff" stroke-width="1" />
  
  <!-- Scaled Path -->
  <polyline points="480,120 450,120 420,120 400,120" fill="none" stroke="#1890ff" stroke-width="2" />
  <circle cx="480" cy="120" r="4" fill="#1890ff" />
  <circle cx="450" cy="120" r="4" fill="#1890ff" />
  <circle cx="420" cy="120" r="4" fill="#1890ff" />
  <circle cx="400" cy="120" r="4" fill="#1890ff" />
  
  <text x="150" y="160" font-family="Arial" font-size="12" text-anchor="middle">Unscaled: Zigzag path</text>
  <text x="400" y="160" font-family="Arial" font-size="12" text-anchor="middle">Scaled: Direct path</text>
  
  <!-- Algorithm Sensitivity -->
  <rect x="50" y="200" width="500" height="180" fill="#f0f5ff" rx="5" ry="5" stroke="#2f54eb" stroke-width="1" />
  <text x="300" y="220" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Algorithm Sensitivity to Feature Scaling</text>
  
  <!-- Algorithm list -->
  <text x="100" y="250" font-family="Arial" font-size="14" font-weight="bold">High Sensitivity:</text>
  <text x="120" y="270" font-family="Arial" font-size="12">• K-Nearest Neighbors (KNN)</text>
  <text x="120" y="290" font-family="Arial" font-size="12">• Support Vector Machines (SVM)</text>
  <text x="120" y="310" font-family="Arial" font-size="12">• Principal Component Analysis (PCA)</text>
  <text x="120" y="330" font-family="Arial" font-size="12">• Neural Networks</text>
  <text x="120" y="350" font-family="Arial" font-size="12">• Gradient Descent based algorithms</text>
  
  <text x="350" y="250" font-family="Arial" font-size="14" font-weight="bold">Low/No Sensitivity:</text>
  <text x="370" y="270" font-family="Arial" font-size="12">• Decision Trees</text>
  <text x="370" y="290" font-family="Arial" font-size="12">• Random Forests</text>
  <text x="370" y="310" font-family="Arial" font-size="12">• Gradient Boosted Trees</text>
  <text x="370" y="330" font-family="Arial" font-size="12">• Naive Bayes</text>
  
  <!-- Code example -->
  <rect x="350" y="340" width="180" height="30" fill="#ffffff" rx="3" ry="3" stroke="#cccccc" stroke-width="1" />
  <text x="360" y="360" font-family="Consolas, monospace" font-size="10">
    model.fit(scaler.fit_transform(X), y);
  </text>
</svg>
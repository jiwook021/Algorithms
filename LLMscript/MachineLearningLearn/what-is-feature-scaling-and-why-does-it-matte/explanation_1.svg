<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f9f9f9" />
  <text x="300" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Feature Scaling: Unscaled vs. Scaled Data</text>
  
  <!-- Coordinate system -->
  <line x1="100" y1="300" x2="500" y2="300" stroke="black" stroke-width="2" />
  <line x1="100" y1="300" x2="100" y2="100" stroke="black" stroke-width="2" />
  
  <text x="300" y="330" font-family="Arial" font-size="14" text-anchor="middle">Feature 1 (Age)</text>
  <text x="60" y="200" font-family="Arial" font-size="14" text-anchor="middle" transform="rotate(-90,60,200)">Feature 2 (Income)</text>
  
  <!-- Unscaled data points -->
  <circle cx="120" cy="280" r="5" fill="#ff6347" />
  <circle cx="150" cy="250" r="5" fill="#ff6347" />
  <circle cx="200" cy="220" r="5" fill="#ff6347" />
  <circle cx="350" cy="150" r="5" fill="#ff6347" />
  <circle cx="450" cy="120" r="5" fill="#ff6347" />
  
  <!-- Scaled data points -->
  <circle cx="150" cy="250" r="5" fill="#4682b4" />
  <circle cx="200" cy="230" r="5" fill="#4682b4" />
  <circle cx="250" cy="210" r="5" fill="#4682b4" />
  <circle cx="300" cy="190" r="5" fill="#4682b4" />
  <circle cx="350" cy="170" r="5" fill="#4682b4" />
  
  <!-- Legend -->
  <rect x="380" y="350" width="15" height="15" fill="#ff6347" />
  <text x="405" y="363" font-family="Arial" font-size="12">Unscaled Data (Age: 18-80, Income: $0-$200K)</text>
  
  <rect x="380" y="370" width="15" height="15" fill="#4682b4" />
  <text x="405" y="383" font-family="Arial" font-size="12">Scaled Data (All features in range [0,1])</text>
  
  <!-- Explanation -->
  <rect x="100" y="50" width="400" height="60" fill="#ffffcc" rx="10" ry="10" stroke="#ddddaa" />
  <text x="110" y="70" font-family="Arial" font-size="12">
    <tspan x="110" y="70">Feature scaling transforms features to a similar range, preventing</tspan>
    <tspan x="110" y="90">features with larger magnitudes (like income) from dominating</tspan>
    <tspan x="110" y="110">features with smaller ranges (like age) in distance-based algorithms.</tspan>
  </text>
  
  <!-- Code example -->
  <rect x="100" y="330" width="250" height="60" fill="#e6f3ff" rx="5" ry="5" stroke="#aaccee" />
  <text x="110" y="345" font-family="Courier New" font-size="10">
    <tspan x="110" y="345">// C++ Min-Max Scaling</tspan>
    <tspan x="110" y="360">double scaled = (x - min_val) /</tspan>
    <tspan x="110" y="375">            (max_val - min_val);</tspan>
  </text>
</svg>
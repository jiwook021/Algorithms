<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Feature Scaling: Before vs After</text>
  
  <!-- Original data points -->
  <g transform="translate(100, 100)">
    <text x="100" y="-20" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">Before Scaling</text>
    
    <!-- Axes -->
    <line x1="0" y1="200" x2="200" y2="200" stroke="#333" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="200" stroke="#333" stroke-width="2" />
    
    <!-- Axis labels -->
    <text x="100" y="220" font-family="Arial" font-size="12" text-anchor="middle">Feature 1 (Income: $10k-$200k)</text>
    <text x="-10" y="100" font-family="Arial" font-size="12" text-anchor="middle" transform="rotate(-90, -10, 100)">Feature 2 (Age: 18-80)</text>
    
    <!-- Data points -->
    <circle cx="10" cy="180" r="5" fill="#e74c3c" />
    <circle cx="20" cy="160" r="5" fill="#e74c3c" />
    <circle cx="150" cy="120" r="5" fill="#3498db" />
    <circle cx="180" cy="40" r="5" fill="#3498db" />
    <circle cx="190" cy="30" r="5" fill="#3498db" />
    
    <!-- Highlight problem -->
    <path d="M 0,0 L 200,200" stroke="#e67e22" stroke-width="2" stroke-dasharray="5,5" />
    <text x="120" y="80" font-family="Arial" font-size="12" fill="#e67e22" transform="rotate(-45, 120, 80)">Dominated by income!</text>
  </g>
  
  <!-- Scaled data -->
  <g transform="translate(350, 100)">
    <text x="100" y="-20" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">After Scaling</text>
    
    <!-- Axes -->
    <line x1="0" y1="200" x2="200" y2="200" stroke="#333" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="200" stroke="#333" stroke-width="2" />
    
    <!-- Axis labels -->
    <text x="100" y="220" font-family="Arial" font-size="12" text-anchor="middle">Feature 1 (Income: 0-1)</text>
    <text x="-10" y="100" font-family="Arial" font-size="12" text-anchor="middle" transform="rotate(-90, -10, 100)">Feature 2 (Age: 0-1)</text>
    
    <!-- Data points -->
    <circle cx="10" cy="140" r="5" fill="#e74c3c" />
    <circle cx="20" cy="100" r="5" fill="#e74c3c" />
    <circle cx="150" cy="60" r="5" fill="#3498db" />
    <circle cx="180" cy="20" r="5" fill="#3498db" />
    <circle cx="190" cy="10" r="5" fill="#3498db" />
    
    <!-- Highlight improvement -->
    <path d="M 0,0 L 200,200" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,5" />
    <text x="120" y="80" font-family="Arial" font-size="12" fill="#27ae60" transform="rotate(-45, 120, 80)">Equal influence!</text>
  </g>
  
  <!-- Code example -->
  <rect x="100" y="330" width="400" height="60" fill="#f0f0f0" stroke="#ccc" />
  <text x="110" y="350" font-family="Courier New" font-size="12" fill="#333">
    <tspan x="110" y="350">// C++ feature scaling (Min-Max Normalization)</tspan>
    <tspan x="110" y="370">double scaled = (value - min_value) / (max_value - min_value);</tspan>
  </text>
</svg>
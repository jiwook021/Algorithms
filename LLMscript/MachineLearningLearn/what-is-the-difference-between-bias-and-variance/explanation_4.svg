<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Bias-Variance Tradeoff in ML Models</text>
  
  <!-- Coordinate system -->
  <line x1="100" y1="300" x2="500" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="300" x2="100" y2="100" stroke="#333" stroke-width="2"/>
  
  <!-- X-axis label -->
  <text x="300" y="330" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Model Complexity</text>
  <text x="100" y="320" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">Low</text>
  <text x="500" y="320" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">High</text>
  
  <!-- Y-axis label -->
  <text x="70" y="200" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" transform="rotate(-90, 70, 200)">Error</text>
  <text x="100" y="100" font-family="Arial" font-size="12" text-anchor="end" fill="#555">High</text>
  <text x="100" y="300" font-family="Arial" font-size="12" text-anchor="end" fill="#555">Low</text>
  
  <!-- Bias curve -->
  <path d="M100,120 Q300,250 500,280" fill="none" stroke="#e74c3c" stroke-width="3"/>
  <text x="480" y="270" font-family="Arial" font-size="12" fill="#e74c3c" font-weight="bold">Bias</text>
  
  <!-- Variance curve -->
  <path d="M100,280 Q300,250 500,120" fill="none" stroke="#3498db" stroke-width="3"/>
  <text x="480" y="130" font-family="Arial" font-size="12" fill="#3498db" font-weight="bold">Variance</text>
  
  <!-- Total error curve -->
  <path d="M100,200 Q200,180 300,170 Q400,180 500,200" fill="none" stroke="#2ecc71" stroke-width="3"/>
  <text x="480" y="200" font-family="Arial" font-size="12" fill="#2ecc71" font-weight="bold">Total Error</text>
  
  <!-- Optimal point -->
  <circle cx="300" cy="170" r="6" fill="#9b59b6" stroke="#333" stroke-width="1"/>
  <text x="300" y="155" font-family="Arial" font-size="12" fill="#9b59b6" font-weight="bold" text-anchor="middle">Optimal Balance</text>
  
  <!-- Regions -->
  <text x="150" y="200" font-family="Arial" font-size="14" fill="#e74c3c" text-anchor="middle">High Bias Region</text>
  <text x="150" y="220" font-family="Arial" font-size="14" fill="#555" text-anchor="middle">(Underfitting)</text>
  
  <text x="450" y="230" font-family="Arial" font-size="14" fill="#3498db" text-anchor="middle">High Variance Region</text>
  <text x="450" y="250" font-family="Arial" font-size="14" fill="#555" text-anchor="middle">(Overfitting)</text>
  
  <!-- Code example -->
  <rect x="100" y="340" width="400" height="50" fill="#eee" stroke="#ccc" stroke-width="1" rx="5" ry="5"/>
  <text x="110" y="360" font-family="Courier New" font-size="11" fill="#333">// C++ regularization to control bias-variance tradeoff</text>
  <text x="110" y="380" font-family="Courier New" font-size="11" fill="#333">double cost = loss(y, y_pred) + lambda * regularization_term;</text>
</svg>
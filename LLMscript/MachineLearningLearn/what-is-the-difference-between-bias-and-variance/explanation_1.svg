<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Bias vs. Variance: Target Analogy</text>
  
  <!-- Target board for high bias -->
  <circle cx="150" cy="200" r="100" fill="#e6e6e6" stroke="#333" stroke-width="2" />
  <circle cx="150" cy="200" r="75" fill="#b3b3b3" stroke="#333" stroke-width="1" />
  <circle cx="150" cy="200" r="50" fill="#808080" stroke="#333" stroke-width="1" />
  <circle cx="150" cy="200" r="25" fill="#4d4d4d" stroke="#333" stroke-width="1" />
  <circle cx="150" cy="200" r="5" fill="#ff3333" stroke="#333" stroke-width="1" />
  
  <!-- High bias shots -->
  <circle cx="110" cy="160" r="5" fill="#3366cc" stroke="#333" stroke-width="1" />
  <circle cx="105" cy="170" r="5" fill="#3366cc" stroke="#333" stroke-width="1" />
  <circle cx="115" cy="165" r="5" fill="#3366cc" stroke="#333" stroke-width="1" />
  <circle cx="100" cy="155" r="5" fill="#3366cc" stroke="#333" stroke-width="1" />
  <circle cx="120" cy="160" r="5" fill="#3366cc" stroke="#333" stroke-width="1" />
  
  <!-- Target board for high variance -->
  <circle cx="450" cy="200" r="100" fill="#e6e6e6" stroke="#333" stroke-width="2" />
  <circle cx="450" cy="200" r="75" fill="#b3b3b3" stroke="#333" stroke-width="1" />
  <circle cx="450" cy="200" r="50" fill="#808080" stroke="#333" stroke-width="1" />
  <circle cx="450" cy="200" r="25" fill="#4d4d4d" stroke="#333" stroke-width="1" />
  <circle cx="450" cy="200" r="5" fill="#ff3333" stroke="#333" stroke-width="1" />
  
  <!-- High variance shots -->
  <circle cx="400" cy="150" r="5" fill="#ff9900" stroke="#333" stroke-width="1" />
  <circle cx="480" cy="250" r="5" fill="#ff9900" stroke="#333" stroke-width="1" />
  <circle cx="500" cy="180" r="5" fill="#ff9900" stroke="#333" stroke-width="1" />
  <circle cx="440" cy="120" r="5" fill="#ff9900" stroke="#333" stroke-width="1" />
  <circle cx="420" cy="260" r="5" fill="#ff9900" stroke="#333" stroke-width="1" />
  
  <!-- Labels -->
  <text x="150" y="320" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#3366cc">High Bias, Low Variance</text>
  <text x="150" y="345" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Consistently wrong in the same area</text>
  <text x="150" y="365" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">(Underfitting)</text>
  
  <text x="450" y="320" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#ff9900">Low Bias, High Variance</text>
  <text x="450" y="345" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Scattered predictions all over the target</text>
  <text x="450" y="365" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">(Overfitting)</text>
  
  <!-- Code example -->
  <rect x="200" y="80" width="200" height="60" rx="5" fill="#f0f0f0" stroke="#333" stroke-width="1" />
  <text x="210" y="100" font-family="Courier New" font-size="12" fill="#333">// High bias model (too simple)</text>
  <text x="210" y="120" font-family="Courier New" font-size="12" fill="#333">LinearRegression model;</text>
  <text x="210" y="140" font-family="Courier New" font-size="12" fill="#333">// vs. complex neural network</text>
</svg>
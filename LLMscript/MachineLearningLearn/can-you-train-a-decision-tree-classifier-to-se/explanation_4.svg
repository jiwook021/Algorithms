<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f0f7ff"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Feature Space Visualization for Apple vs Orange Classification</text>
  
  <!-- Coordinate System -->
  <line x1="100" y1="300" x2="500" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="300" x2="100" y2="100" stroke="#333" stroke-width="2"/>
  
  <!-- Axis Labels -->
  <text x="300" y="330" font-family="Arial" font-size="14" text-anchor="middle">Weight (grams)</text>
  <text x="60" y="200" font-family="Arial" font-size="14" text-anchor="middle" transform="rotate(-90, 60, 200)">Color (Redness)</text>
  
  <!-- Decision Boundary -->
  <path d="M 100 200 L 300 200 L 300 100" stroke="#333" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  
  <!-- Region Labels -->
  <text x="200" y="250" font-family="Arial" font-size="16" fill="#F44336" text-anchor="middle">Apple Region</text>
  <text x="400" y="150" font-family="Arial" font-size="16" fill="#FF9800" text-anchor="middle">Orange Region</text>
  
  <!-- Data Points - Apples -->
  <circle cx="150" cy="230" r="8" fill="#F44336"/>
  <circle cx="180" cy="250" r="8" fill="#F44336"/>
  <circle cx="210" cy="220" r="8" fill="#F44336"/>
  <circle cx="240" cy="240" r="8" fill="#F44336"/>
  <circle cx="200" cy="180" r="8" fill="#F44336"/>
  <circle cx="170" cy="190" r="8" fill="#F44336"/>
  <circle cx="230" cy="170" r="8" fill="#F44336"/>
  
  <!-- Data Points - Oranges -->
  <circle cx="350" cy="150" r="8" fill="#FF9800"/>
  <circle cx="380" cy="170" r="8" fill="#FF9800"/>
  <circle cx="410" cy="140" r="8" fill="#FF9800"/>
  <circle cx="440" cy="160" r="8" fill="#FF9800"/>
  <circle cx="400" cy="120" r="8" fill="#FF9800"/>
  <circle cx="370" cy="130" r="8" fill="#FF9800"/>
  <circle cx="430" cy="110" r="8" fill="#FF9800"/>
  
  <!-- Legend -->
  <rect x="450" y="250" width="120" height="70" rx="5" fill="white" stroke="#333"/>
  <circle cx="470" cy="270" r="8" fill="#F44336"/>
  <text x="490" y="275" font-family="Arial" font-size="14">Apple</text>
  <circle cx="470" cy="300" r="8" fill="#FF9800"/>
  <text x="490" y="305" font-family="Arial" font-size="14">Orange</text>
  
  <!-- Example Code -->
  <rect x="100" y="340" width="400" height="50" rx="5" fill="#333" stroke="#000" stroke-width="1"/>
  <text x="110" y="360" font-family="Courier New" font-size="10" fill="#E0E0E0">// C++ code to visualize decision boundaries</text>
  <text x="110" y="380" font-family="Courier New" font-size="10" fill="#E0E0E0">tree.visualize_boundaries(features, "weight", "color");</text>
  
  <!-- Annotations -->
  <path d="M 300 200 L 350 220" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="360" y="225" font-family="Arial" font-size="12">Decision Boundary</text>
  
  <!-- Arrow Marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Decision Tree for Apple vs Orange Classification</text>
  
  <!-- Decision Tree -->
  <g transform="translate(300, 80)">
    <!-- Root Node -->
    <rect x="-80" y="0" width="160" height="50" rx="5" fill="#4285f4" stroke="#2a56c6" stroke-width="2" />
    <text x="0" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Weight > 150g?</text>
    
    <!-- Branches -->
    <line x1="-40" y1="50" x2="-120" y2="90" stroke="#333" stroke-width="2" />
    <line x1="40" y1="50" x2="120" y2="90" stroke="#333" stroke-width="2" />
    
    <!-- Left Node -->
    <rect x="-170" y="90" width="100" height="50" rx="5" fill="#fbbc05" stroke="#e3a600" stroke-width="2" />
    <text x="-120" y="120" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Color Red?</text>
    
    <!-- Right Node -->
    <rect x="70" y="90" width="100" height="50" rx="5" fill="#fbbc05" stroke="#e3a600" stroke-width="2" />
    <text x="120" y="120" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Texture?</text>
    
    <!-- Left Branches -->
    <line x1="-150" y1="140" x2="-180" y2="180" stroke="#333" stroke-width="2" />
    <line x1="-90" y1="140" x2="-60" y2="180" stroke="#333" stroke-width="2" />
    
    <!-- Right Branches -->
    <line x1="90" y1="140" x2="60" y2="180" stroke="#333" stroke-width="2" />
    <line x1="150" y1="140" x2="180" y2="180" stroke="#333" stroke-width="2" />
    
    <!-- Leaf Nodes -->
    <rect x="-220" y="180" width="80" height="40" rx="5" fill="#34a853" stroke="#1e8e3e" stroke-width="2" />
    <text x="-180" y="205" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Apple</text>
    
    <rect x="-100" y="180" width="80" height="40" rx="5" fill="#ea4335" stroke="#c5221f" stroke-width="2" />
    <text x="-60" y="205" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Orange</text>
    
    <rect x="20" y="180" width="80" height="40" rx="5" fill="#34a853" stroke="#1e8e3e" stroke-width="2" />
    <text x="60" y="205" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Apple</text>
    
    <rect x="140" y="180" width="80" height="40" rx="5" fill="#ea4335" stroke="#c5221f" stroke-width="2" />
    <text x="180" y="205" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Orange</text>
  </g>
  
  <!-- Feature Explanation -->
  <g transform="translate(50, 300)">
    <text x="0" y="0" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Features Used:</text>
    <text x="0" y="25" font-family="Arial" font-size="14" fill="#333">• Weight: Oranges typically heavier than apples</text>
    <text x="0" y="50" font-family="Arial" font-size="14" fill="#333">• Color: Apples can be red, green, yellow; oranges are orange</text>
    <text x="0" y="75" font-family="Arial" font-size="14" fill="#333">• Texture: Apples smooth, oranges bumpy</text>
  </g>
  
  <!-- Code Example -->
  <g transform="translate(400, 300)">
    <rect x="0" y="-15" width="180" height="90" fill="#f1f3f4" stroke="#dadce0" stroke-width="1" rx="5" />
    <text x="5" y="0" font-family="Consolas, monospace" font-size="12" fill="#0d47a1">
      <tspan x="5" y="0">// C++ Decision</tspan>
      <tspan x="5" y="15">if (weight > 150) {</tspan>
      <tspan x="5" y="30">  if (texture == "bumpy")</tspan>
      <tspan x="5" y="45">    return "Orange";</tspan>
      <tspan x="5" y="60">  else</tspan>
      <tspan x="5" y="75">    return "Apple";</tspan>
    </text>
  </g>
</svg>
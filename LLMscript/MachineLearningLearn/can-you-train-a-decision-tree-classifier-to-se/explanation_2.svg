<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Feature Space Visualization for Apple vs Orange Classification</text>
  
  <!-- Coordinate System -->
  <line x1="100" y1="300" x2="500" y2="300" stroke="#333" stroke-width="2" />
  <line x1="100" y1="300" x2="100" y2="100" stroke="#333" stroke-width="2" />
  
  <!-- Axis Labels -->
  <text x="300" y="330" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Weight (grams)</text>
  <text x="60" y="200" font-family="Arial" font-size="16" text-anchor="middle" fill="#333" transform="rotate(-90,60,200)">Color (RGB value)</text>
  
  <!-- Axis Ticks -->
  <line x1="100" y1="300" x2="100" y2="305" stroke="#333" stroke-width="2" />
  <text x="100" y="320" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">0</text>
  
  <line x1="200" y1="300" x2="200" y2="305" stroke="#333" stroke-width="2" />
  <text x="200" y="320" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">100</text>
  
  <line x1="300" y1="300" x2="300" y2="305" stroke="#333" stroke-width="2" />
  <text x="300" y="320" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">150</text>
  
  <line x1="400" y1="300" x2="400" y2="305" stroke="#333" stroke-width="2" />
  <text x="400" y="320" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">200</text>
  
  <line x1="500" y1="300" x2="500" y2="305" stroke="#333" stroke-width="2" />
  <text x="500" y="320" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">250</text>
  
  <!-- Decision Boundary -->
  <line x1="300" y1="100" x2="300" y2="300" stroke="#4285f4" stroke-width="3" stroke-dasharray="5,5" />
  <text x="310" y="200" font-family="Arial" font-size="14" fill="#4285f4">Decision Boundary</text>
  
  <!-- Data Points - Apples -->
  <circle cx="180" cy="150" r="8" fill="#34a853" />
  <circle cx="200" cy="180" r="8" fill="#34a853" />
  <circle cx="220" cy="160" r="8" fill="#34a853" />
  <circle cx="240" cy="200" r="8" fill="#34a853" />
  <circle cx="260" cy="170" r="8" fill="#34a853" />
  <circle cx="210" cy="190" r="8" fill="#34a853" />
  <circle cx="190" cy="210" r="8" fill="#34a853" />
  <circle cx="230" cy="140" r="8" fill="#34a853" />
  <circle cx="250" cy="220" r="8" fill="#34a853" />
  <circle cx="270" cy="180" r="8" fill="#34a853" />
  
  <!-- Data Points - Oranges -->
  <circle cx="330" cy="220" r="8" fill="#ea4335" />
  <circle cx="350" cy="200" r="8" fill="#ea4335" />
  <circle cx="370" cy="230" r="8" fill="#ea4335" />
  <circle cx="390" cy="210" r="8" fill="#ea4335" />
  <circle cx="410" cy="240" r="8" fill="#ea4335" />
  <circle cx="430" cy="190" r="8" fill="#ea4335" />
  <circle cx="450" cy="220" r="8" fill="#ea4335" />
  <circle cx="380" cy="250" r="8" fill="#ea4335" />
  <circle cx="400" cy="180" r="8" fill="#ea4335" />
  <circle cx="420" cy="230" r="8" fill="#ea4335" />
  
  <!-- Legend -->
  <rect x="400" y="100" width="150" height="70" rx="5" fill="white" stroke="#dadce0" stroke-width="1" />
  <circle cx="420" cy="120" r="8" fill="#34a853" />
  <text x="440" y="125" font-family="Arial" font-size="14" fill="#333">Apples</text>
  <circle cx="420" cy="150" r="8" fill="#ea4335" />
  <text x="440" y="155" font-family="Arial" font-size="14" fill="#333">Oranges</text>
  
  <!-- Explanation -->
  <rect x="100" y="340" width="400" height="50" rx="5" fill="#f1f3f4" stroke="#dadce0" stroke-width="1" />
  <text x="110" y="360" font-family="Arial" font-size="14" fill="#333">Decision trees find optimal splits in feature space to separate classes.</text>
  <text x="110" y="380" font-family="Arial" font-size="14" fill="#333">Here, weight > 150g creates a clear boundary between apples and oranges.</text>
  
  <!-- C++ Code Snippet -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="180" height="60" rx="5" fill="white" stroke="#dadce0" stroke-width="1" />
    <text x="10" y="20" font-family="Consolas, monospace" font-size="12" fill="#0d47a1">
      <tspan x="10" y="20">// C++ Feature Check</tspan>
      <tspan x="10" y="40">if (weight > 150.0f) {</tspan>
      <tspan x="10" y="60">  return "Orange";</tspan>
    </text>
  </g>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f9f9f9" />
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Statistical Methods for Outlier Detection</text>
  
  <!-- Box plot visualization -->
  <rect x="50" y="60" width="500" height="180" fill="#e6f7ff" stroke="#0099cc" stroke-width="2" rx="5" />
  <text x="300" y="80" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Box Plot Method (IQR)</text>
  
  <!-- Box plot elements -->
  <line x1="100" y1="150" x2="500" y2="150" stroke="#333" stroke-width="2" />
  <rect x="200" y="120" width="200" height="60" fill="white" stroke="#333" stroke-width="2" />
  <line x1="300" y1="120" x2="300" y2="180" stroke="#333" stroke-width="2" />
  <line x1="200" y1="150" x2="100" y2="150" stroke="#333" stroke-width="2" />
  <line x1="400" y1="150" x2="500" y2="150" stroke="#333" stroke-width="2" />
  <line x1="100" y1="140" x2="100" y2="160" stroke="#333" stroke-width="2" />
  <line x1="500" y1="140" x2="500" y2="160" stroke="#333" stroke-width="2" />
  
  <!-- Outliers -->
  <circle cx="80" cy="150" r="5" fill="#ff5252" />
  <circle cx="530" cy="150" r="5" fill="#ff5252" />
  
  <!-- Labels -->
  <text x="80" y="170" font-family="Arial" font-size="12" text-anchor="middle">Outlier</text>
  <text x="530" y="170" font-family="Arial" font-size="12" text-anchor="middle">Outlier</text>
  <text x="100" y="130" font-family="Arial" font-size="12" text-anchor="middle">Q1-1.5*IQR</text>
  <text x="200" y="110" font-family="Arial" font-size="12" text-anchor="middle">Q1</text>
  <text x="300" y="110" font-family="Arial" font-size="12" text-anchor="middle">Median</text>
  <text x="400" y="110" font-family="Arial" font-size="12" text-anchor="middle">Q3</text>
  <text x="500" y="130" font-family="Arial" font-size="12" text-anchor="middle">Q3+1.5*IQR</text>
  
  <!-- Code example -->
  <rect x="100" y="200" width="400" height="120" fill="#f0f0f0" stroke="#666" stroke-width="1" rx="5" />
  <text x="110" y="220" font-family="Consolas, monospace" font-size="12" fill="#333">
    <tspan x="110" dy="0">// C++ code for IQR-based outlier detection</tspan>
    <tspan x="110" dy="16">std::vector&lt;double&gt; detectOutliers(std::vector&lt;double&gt; data) {</tspan>
    <tspan x="110" dy="16">  std::sort(data.begin(), data.end());</tspan>
    <tspan x="110" dy="16">  double q1 = data[data.size() * 0.25];</tspan>
    <tspan x="110" dy="16">  double q3 = data[data.size() * 0.75];</tspan>
    <tspan x="110" dy="16">  double iqr = q3 - q1;</tspan>
    <tspan x="110" dy="16">  double lowerBound = q1 - 1.5 * iqr;</tspan>
    <tspan x="110" dy="16">  double upperBound = q3 + 1.5 * iqr;</tspan>
    <tspan x="110" dy="16">  // Return points outside bounds as outliers</tspan>
    <tspan x="110" dy="16">}</tspan>
  </text>
  
  <!-- Footer -->
  <text x="300" y="340" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">
    IQR (Interquartile Range) is a common statistical method to identify outliers
  </text>
  <text x="300" y="360" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">
    Values below Q1-1.5*IQR or above Q3+1.5*IQR are considered outliers
  </text>
</svg>
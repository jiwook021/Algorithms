<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Density-Based Outlier Detection</text>
  
  <!-- Main visualization area -->
  <rect x="50" y="50" width="500" height="300" fill="#fff" stroke="#ddd" stroke-width="1" />
  
  <!-- Coordinate axes -->
  <line x1="50" y1="350" x2="550" y2="350" stroke="#333" stroke-width="2" />
  <line x1="50" y1="350" x2="50" y2="50" stroke="#333" stroke-width="2" />
  
  <!-- Axis labels -->
  <text x="300" y="380" font-family="Arial" font-size="14" text-anchor="middle">Feature 1</text>
  <text x="20" y="200" font-family="Arial" font-size="14" text-anchor="middle" transform="rotate(-90,20,200)">Feature 2</text>
  
  <!-- Clusters -->
  <circle cx="150" cy="150" r="80" fill="#91caff" fill-opacity="0.3" stroke="#1677ff" stroke-width="1" />
  <circle cx="400" cy="250" r="70" fill="#91caff" fill-opacity="0.3" stroke="#1677ff" stroke-width="1" />
  
  <!-- Regular data points in clusters -->
  <circle cx="130" cy="130" r="5" fill="#1677ff" />
  <circle cx="160" cy="140" r="5" fill="#1677ff" />
  <circle cx="170" cy="170" r="5" fill="#1677ff" />
  <circle cx="140" cy="160" r="5" fill="#1677ff" />
  <circle cx="120" cy="150" r="5" fill="#1677ff" />
  <circle cx="150" cy="120" r="5" fill="#1677ff" />
  <circle cx="180" cy="150" r="5" fill="#1677ff" />
  <circle cx="135" cy="180" r="5" fill="#1677ff" />
  <circle cx="165" cy="165" r="5" fill="#1677ff" />
  
  <circle cx="380" cy="240" r="5" fill="#1677ff" />
  <circle cx="410" cy="250" r="5" fill="#1677ff" />
  <circle cx="420" cy="270" r="5" fill="#1677ff" />
  <circle cx="390" cy="260" r="5" fill="#1677ff" />
  <circle cx="370" cy="250" r="5" fill="#1677ff" />
  <circle cx="400" cy="230" r="5" fill="#1677ff" />
  <circle cx="430" cy="250" r="5" fill="#1677ff" />
  <circle cx="385" cy="280" r="5" fill="#1677ff" />
  <circle cx="415" cy="265" r="5" fill="#1677ff" />
  
  <!-- Outliers -->
  <circle cx="280" cy="200" r="6" fill="#f5222d" stroke="#000" stroke-width="1" />
  <circle cx="500" cy="100" r="6" fill="#f5222d" stroke="#000" stroke-width="1" />
  <circle cx="100" cy="300" r="6" fill="#f5222d" stroke="#000" stroke-width="1" />
  
  <!-- DBSCAN radius visualization -->
  <circle cx="280" cy="200" r="30" fill="none" stroke="#f5222d" stroke-width="1" stroke-dasharray="5,5" />
  <text x="290" cy="190" font-family="Arial" font-size="10">Sparse region</text>
  <text x="290" cy="205" font-family="Arial" font-size="10">ε-neighborhood</text>
  
  <!-- LOF explanation -->
  <rect x="450" y="60" width="90" height="60" fill="#fff" stroke="#333" stroke-width="1" rx="5" />
  <text x="495" y="80" font-family="Arial" font-size="10" text-anchor="middle">Local Outlier</text>
  <text x="495" y="95" font-family="Arial" font-size="10" text-anchor="middle">Factor (LOF)</text>
  <text x="495" y="110" font-family="Arial" font-size="10" text-anchor="middle">LOF > 1</text>
  
  <!-- Legend -->
  <rect x="430" y="320" width="120" height="60" fill="#fff" stroke="#333" stroke-width="1" rx="5" />
  <circle cx="445" cy="335" r="5" fill="#1677ff" />
  <text x="460" y="340" font-family="Arial" font-size="12">Normal points</text>
  <circle cx="445" cy="355" r="6" fill="#f5222d" stroke="#000" stroke-width="1" />
  <text x="460" y="360" font-family="Arial" font-size="12">Outliers</text>
  <circle cx="445" cy="375" r="0" fill="none" stroke="#1677ff" stroke-width="1" />
  <circle cx="445" cy="375" r="10" fill="#91caff" fill-opacity="0.3" stroke="#1677ff" stroke-width="1" />
  <text x="460" y="380" font-family="Arial" font-size="12">Dense regions</text>
  
  <!-- Code snippet -->
  <rect x="50" y="50" width="250" height="80" fill="#fff" stroke="#ddd" stroke-width="1" rx="5" fill-opacity="0.9" />
  <text x="60" y="70" font-family="Courier New" font-size="10" fill="#333">
    <tspan x="60" dy="0">// C++ DBSCAN outlier detection</tspan>
    <tspan x="60" dy="12">std::vector&lt;int&gt; outliers;</tspan>
    <tspan x="60" dy="12">DBSCAN dbscan(epsilon, minPts);</tspan>
    <tspan x="60" dy="12">std::vector&lt;int&gt; clusters = </tspan>
    <tspan x="60" dy="12">  dbscan.fit(data);</tspan>
    <tspan x="60" dy="12">// Points with cluster ID -1 are outliers</tspan>
  </text>
</svg>
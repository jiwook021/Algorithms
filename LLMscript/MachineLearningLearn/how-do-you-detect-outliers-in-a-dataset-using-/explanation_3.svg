<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Statistical Methods for Outlier Detection</text>
  
  <!-- Box Plot -->
  <rect x="50" y="60" width="500" height="150" fill="#e6f7ff" stroke="#1890ff" stroke-width="2" rx="5" />
  <text x="300" y="80" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Box Plot Method (IQR)</text>
  
  <!-- Box Plot Visualization -->
  <line x1="100" y1="130" x2="500" y2="130" stroke="#333" stroke-width="2" />
  <rect x="200" y="110" width="200" height="40" fill="#91d5ff" stroke="#333" stroke-width="2" />
  <line x1="300" y1="110" x2="300" y2="150" stroke="#333" stroke-width="2" />
  <line x1="200" y1="110" x2="200" y2="150" stroke="#333" stroke-width="2" />
  <line x1="400" y1="110" x2="400" y2="150" stroke="#333" stroke-width="2" />
  <line x1="150" y1="130" x2="200" y2="130" stroke="#333" stroke-width="2" />
  <line x1="400" y1="130" x2="450" y2="130" stroke="#333" stroke-width="2" />
  <line x1="150" y1="120" x2="150" y2="140" stroke="#333" stroke-width="2" />
  <line x1="450" y1="120" x2="450" y2="140" stroke="#333" stroke-width="2" />
  
  <!-- Outliers -->
  <circle cx="100" cy="130" r="5" fill="#f5222d" />
  <circle cx="500" cy="130" r="5" fill="#f5222d" />
  
  <!-- Labels -->
  <text x="100" y="150" font-family="Arial" font-size="12" text-anchor="middle">Outlier</text>
  <text x="150" y="160" font-family="Arial" font-size="12" text-anchor="middle">Q1-1.5*IQR</text>
  <text x="200" y="170" font-family="Arial" font-size="12" text-anchor="middle">Q1</text>
  <text x="300" y="170" font-family="Arial" font-size="12" text-anchor="middle">Median</text>
  <text x="400" y="170" font-family="Arial" font-size="12" text-anchor="middle">Q3</text>
  <text x="450" y="160" font-family="Arial" font-size="12" text-anchor="middle">Q3+1.5*IQR</text>
  <text x="500" y="150" font-family="Arial" font-size="12" text-anchor="middle">Outlier</text>
  
  <!-- Z-Score Method -->
  <rect x="50" y="230" width="500" height="150" fill="#f6ffed" stroke="#52c41a" stroke-width="2" rx="5" />
  <text x="300" y="250" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Z-Score Method</text>
  
  <!-- Normal Distribution -->
  <path d="M 100 330 Q 300 230 500 330" fill="none" stroke="#52c41a" stroke-width="2" />
  
  <!-- Standard Deviations -->
  <line x1="300" y1="230" x2="300" y2="350" stroke="#333" stroke-dasharray="5,5" />
  <line x1="200" y1="290" x2="200" y2="350" stroke="#333" stroke-dasharray="5,5" />
  <line x1="400" y1="290" x2="400" y2="350" stroke="#333" stroke-dasharray="5,5" />
  <line x1="150" y1="320" x2="150" y2="350" stroke="#333" stroke-dasharray="5,5" />
  <line x1="450" y1="320" x2="450" y2="350" stroke="#333" stroke-dasharray="5,5" />
  
  <!-- Outlier Points -->
  <circle cx="100" cy="330" r="5" fill="#f5222d" />
  <circle cx="500" cy="330" r="5" fill="#f5222d" />
  
  <!-- Labels -->
  <text x="300" y="365" font-family="Arial" font-size="12" text-anchor="middle">Mean (μ)</text>
  <text x="200" y="365" font-family="Arial" font-size="12" text-anchor="middle">μ-σ</text>
  <text x="400" y="365" font-family="Arial" font-size="12" text-anchor="middle">μ+σ</text>
  <text x="150" y="365" font-family="Arial" font-size="12" text-anchor="middle">μ-2σ</text>
  <text x="450" y="365" font-family="Arial" font-size="12" text-anchor="middle">μ+2σ</text>
  <text x="100" y="365" font-family="Arial" font-size="12" text-anchor="middle">Outlier</text>
  <text x="500" y="365" font-family="Arial" font-size="12" text-anchor="middle">Outlier</text>
  
  <!-- Code Snippet -->
  <text x="75" y="200" font-family="Courier New" font-size="10" fill="#333">
    <tspan x="75" dy="0">// C++ code for IQR-based outlier detection</tspan>
    <tspan x="75" dy="12">std::vector&lt;double&gt; detectOutliers(const std::vector&lt;double&gt;&amp; data) {</tspan>
    <tspan x="75" dy="12">  std::vector&lt;double&gt; sortedData = data;</tspan>
    <tspan x="75" dy="12">  std::sort(sortedData.begin(), sortedData.end());</tspan>
    <tspan x="75" dy="12">  double q1 = sortedData[sortedData.size() * 0.25];</tspan>
    <tspan x="75" dy="12">  double q3 = sortedData[sortedData.size() * 0.75];</tspan>
    <tspan x="75" dy="12">  double iqr = q3 - q1;</tspan>
    <tspan x="75" dy="12">  double lowerBound = q1 - 1.5 * iqr;</tspan>
    <tspan x="75" dy="12">  double upperBound = q3 + 1.5 * iqr;</tspan>
    <tspan x="75" dy="12">  // Filter outliers...</tspan>
    <tspan x="75" dy="12">}</tspan>
  </text>
</svg>
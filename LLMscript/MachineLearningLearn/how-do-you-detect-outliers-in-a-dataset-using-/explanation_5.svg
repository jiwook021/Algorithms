<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Statistical Methods for Outlier Detection</text>
  
  <!-- Coordinate system -->
  <line x1="100" y1="300" x2="500" y2="300" stroke="black" stroke-width="2" />
  <line x1="100" y1="300" x2="100" y2="100" stroke="black" stroke-width="2" />
  
  <!-- Axis labels -->
  <text x="300" y="330" font-family="Arial" font-size="14" text-anchor="middle">Data Points</text>
  <text x="60" y="200" font-family="Arial" font-size="14" text-anchor="middle" transform="rotate(-90,60,200)">Value</text>
  
  <!-- Box plot -->
  <rect x="150" y="170" width="300" height="80" fill="#a8d1ff" stroke="black" stroke-width="1" />
  <line x1="300" y1="170" x2="300" y2="250" stroke="black" stroke-width="2" />
  <line x1="150" y1="210" x2="450" y2="210" stroke="black" stroke-width="2" />
  
  <!-- Whiskers -->
  <line x1="150" y1="210" x2="120" y2="210" stroke="black" stroke-width="1" />
  <line x1="450" y1="210" x2="480" y2="210" stroke="black" stroke-width="1" />
  <line x1="120" y1="190" x2="120" y2="230" stroke="black" stroke-width="1" />
  <line x1="480" y1="190" x2="480" y2="230" stroke="black" stroke-width="1" />
  
  <!-- Data points -->
  <circle cx="200" cy="210" r="4" fill="#3366cc" />
  <circle cx="250" cy="220" r="4" fill="#3366cc" />
  <circle cx="270" cy="190" r="4" fill="#3366cc" />
  <circle cx="320" cy="230" r="4" fill="#3366cc" />
  <circle cx="350" cy="200" r="4" fill="#3366cc" />
  <circle cx="380" cy="180" r="4" fill="#3366cc" />
  <circle cx="400" cy="225" r="4" fill="#3366cc" />
  
  <!-- Outliers -->
  <circle cx="520" cy="120" r="6" fill="#ff5555" stroke="black" stroke-width="1" />
  <circle cx="80" cy="260" r="6" fill="#ff5555" stroke="black" stroke-width="1" />
  
  <!-- Outlier boundaries -->
  <line x1="120" y1="120" x2="480" y2="120" stroke="#ff5555" stroke-width="1" stroke-dasharray="5,5" />
  <line x1="120" y1="300" x2="480" y2="300" stroke="#ff5555" stroke-width="1" stroke-dasharray="5,5" />
  
  <!-- Labels -->
  <text x="520" y="110" font-family="Arial" font-size="12" text-anchor="middle" fill="#ff5555" font-weight="bold">Outlier</text>
  <text x="80" y="280" font-family="Arial" font-size="12" text-anchor="middle" fill="#ff5555" font-weight="bold">Outlier</text>
  <text x="300" y="160" font-family="Arial" font-size="12" text-anchor="middle">Box Plot (IQR Method)</text>
  
  <!-- Formula and explanation -->
  <rect x="100" y="340" width="400" height="50" fill="#e6f2ff" stroke="#3366cc" stroke-width="1" rx="5" />
  <text x="300" y="360" font-family="Consolas, monospace" font-size="12" text-anchor="middle">
    Outlier if: x &lt; Q1 - 1.5*IQR or x > Q3 + 1.5*IQR
  </text>
  <text x="300" y="380" font-family="Arial" font-size="12" text-anchor="middle">
    Where IQR = Q3 - Q1 (Interquartile Range)
  </text>
  
  <!-- C++ code snippet -->
  <rect x="500" y="340" width="90" height="50" fill="#ffe6e6" stroke="#ff5555" stroke-width="1" rx="5" />
  <text x="545" y="365" font-family="Consolas, monospace" font-size="10" text-anchor="middle">
    C++ Example
  </text>
  <text x="545" y="380" font-family="Consolas, monospace" font-size="8" text-anchor="middle">
    std::vector&lt;double&gt;
  </text>
</svg>
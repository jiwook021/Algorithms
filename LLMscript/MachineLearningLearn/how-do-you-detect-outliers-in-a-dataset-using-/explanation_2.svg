<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f9f9f9" />
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Clustering-Based Outlier Detection</text>
  
  <!-- Main visualization area -->
  <rect x="50" y="50" width="500" height="260" fill="#f0f8ff" stroke="#0066cc" stroke-width="2" rx="5" />
  
  <!-- Scatter plot with clusters -->
  <circle cx="150" cy="150" r="60" fill="#99ccff" fill-opacity="0.5" stroke="#0066cc" stroke-width="1" />
  <circle cx="350" cy="180" r="70" fill="#99ccff" fill-opacity="0.5" stroke="#0066cc" stroke-width="1" />
  
  <!-- Cluster points -->
  <circle cx="130" cy="140" r="4" fill="#0066cc" />
  <circle cx="145" cy="155" r="4" fill="#0066cc" />
  <circle cx="160" cy="145" r="4" fill="#0066cc" />
  <circle cx="170" cy="160" r="4" fill="#0066cc" />
  <circle cx="140" cy="170" r="4" fill="#0066cc" />
  <circle cx="155" cy="130" r="4" fill="#0066cc" />
  <circle cx="125" cy="160" r="4" fill="#0066cc" />
  
  <circle cx="330" cy="170" r="4" fill="#0066cc" />
  <circle cx="345" cy="185" r="4" fill="#0066cc" />
  <circle cx="360" cy="175" r="4" fill="#0066cc" />
  <circle cx="370" cy="190" r="4" fill="#0066cc" />
  <circle cx="340" cy="200" r="4" fill="#0066cc" />
  <circle cx="355" cy="160" r="4" fill="#0066cc" />
  <circle cx="325" cy="190" r="4" fill="#0066cc" />
  <circle cx="380" cy="175" r="4" fill="#0066cc" />
  
  <!-- Outliers -->
  <circle cx="250" cy="100" r="6" fill="#ff5252" stroke="#cc0000" stroke-width="1" />
  <circle cx="450" cy="250" r="6" fill="#ff5252" stroke="#cc0000" stroke-width="1" />
  <circle cx="100" cy="250" r="6" fill="#ff5252" stroke="#cc0000" stroke-width="1" />
  
  <!-- Centroids -->
  <circle cx="150" cy="150" r="6" fill="#ffcc00" stroke="#996600" stroke-width="1" />
  <circle cx="350" cy="180" r="6" fill="#ffcc00" stroke="#996600" stroke-width="1" />
  
  <!-- Labels -->
  <text x="150" y="100" font-family="Arial" font-size="14" text-anchor="middle">Cluster 1</text>
  <text x="350" y="130" font-family="Arial" font-size="14" text-anchor="middle">Cluster 2</text>
  <text x="150" cy="150" font-family="Arial" font-size="10" text-anchor="middle" fill="#996600">Centroid</text>
  <text x="350" cy="180" font-family="Arial" font-size="10" text-anchor="middle" fill="#996600">Centroid</text>
  <text x="250" y="85" font-family="Arial" font-size="12" text-anchor="middle">Outlier</text>
  <text x="450" y="235" font-family="Arial" font-size="12" text-anchor="middle">Outlier</text>
  <text x="100" y="235" font-family="Arial" font-size="12" text-anchor="middle">Outlier</text>
  
  <!-- Code example -->
  <rect x="100" y="320" width="400" height="60" fill="#f0f0f0" stroke="#666" stroke-width="1" rx="5" />
  <text x="110" y="340" font-family="Consolas, monospace" font-size="12" fill="#333">
    <tspan x="110" dy="0">// C++ pseudocode for K-means outlier detection</tspan>
    <tspan x="110" dy="16">// After clustering with K-means:</tspan>
    <tspan x="110" dy="16">double threshold = calculateDistanceThreshold();</tspan>
    <tspan x="110" dy="16">// Points with distance > threshold from nearest centroid</tspan>
    <tspan x="110" dy="16">// are considered outliers</tspan>
  </text>
  
  <!-- Explanation -->
  <text x="300" y="290" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">
    Clustering algorithms (like K-means, DBSCAN) group similar data points
  </text>
  <text x="300" y="310" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">
    Points far from any cluster center are identified as outliers
  </text>
</svg>
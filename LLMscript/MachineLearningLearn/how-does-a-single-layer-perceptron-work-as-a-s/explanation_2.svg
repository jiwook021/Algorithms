<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Single-Layer Perceptron: Activation Functions</text>
  
  <!-- Coordinate System for Step Function -->
  <line x1="100" y1="200" x2="250" y2="200" stroke="#333" stroke-width="1.5" />
  <line x1="100" y1="120" x2="100" y2="200" stroke="#333" stroke-width="1.5" />
  
  <!-- Step Function -->
  <polyline points="100,200 175,200 175,140 250,140" fill="none" stroke="#e91e63" stroke-width="2.5" />
  <text x="175" y="110" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#e91e63">Step Function</text>
  <text x="175" y="230" font-family="Arial" font-size="12" text-anchor="middle">f(x) = {0 if x&lt;0, 1 if x≥0}</text>
  
  <!-- Coordinate System for Sigmoid Function -->
  <line x1="350" y1="200" x2="500" y2="200" stroke="#333" stroke-width="1.5" />
  <line x1="350" y1="120" x2="350" y2="200" stroke="#333" stroke-width="1.5" />
  
  <!-- Sigmoid Function -->
  <path d="M350,170 C370,170 375,140 425,140 C475,140 480,170 500,170" fill="none" stroke="#2196f3" stroke-width="2.5" />
  <text x="425" y="110" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#2196f3">Sigmoid Function</text>
  <text x="425" y="230" font-family="Arial" font-size="12" text-anchor="middle">f(x) = 1/(1+e^(-x))</text>
  
  <!-- Decision Boundary Visualization -->
  <rect x="100" y="260" width="400" height="120" rx="10" ry="10" fill="#f5f5f5" stroke="#333" stroke-width="1" />
  
  <!-- 2D Input Space -->
  <line x1="150" y1="350" x2="250" y2="350" stroke="#333" stroke-width="1.5" />
  <line x1="150" y1="350" x2="150" y2="280" stroke="#333" stroke-width="1.5" />
  <text x="145" y="275" font-family="Arial" font-size="10" text-anchor="end">x₂</text>
  <text x="255" y="355" font-family="Arial" font-size="10" text-anchor="middle">x₁</text>
  
  <!-- Decision Boundary Line -->
  <line x1="150" y1="330" x2="230" y2="290" stroke="#673ab7" stroke-width="2" stroke-dasharray="4" />
  <text x="190" y="300" font-family="Arial" font-size="10" fill="#673ab7" transform="rotate(-25, 190, 300)">Decision Boundary</text>
  
  <!-- Points -->
  <circle cx="170" cy="310" r="5" fill="#4caf50" />
  <circle cx="180" cy="320" r="5" fill="#4caf50" />
  <circle cx="190" cy="300" r="5" fill="#4caf50" />
  <circle cx="200" cy="340" r="5" fill="#f44336" />
  <circle cx="210" cy="330" r="5" fill="#f44336" />
  <circle cx="220" cy="320" r="5" fill="#f44336" />
  
  <!-- Explanation -->
  <text x="300" y="300" font-family="Arial" font-size="12" text-anchor="start">
    <tspan x="300" dy="0">The perceptron creates a linear</tspan>
    <tspan x="300" dy="16">decision boundary in the input space.</tspan>
    <tspan x="300" dy="16">Points on one side are classified as 0,</tspan>
    <tspan x="300" dy="16">points on the other side as 1.</tspan>
  </text>
  
  <!-- C++ Code Example -->
  <rect x="450" y="50" width="140" height="100" rx="5" ry="5" fill="#e0e0e0" stroke="#333" stroke-width="1" />
  <text x="455" y="70" font-family="monospace" font-size="10">// C++ Activation Functions
float step(float x) {
  return x >= 0 ? 1.0f : 0.0f;
}

float sigmoid(float x) {
  return 1.0f/(1.0f+exp(-x));
}</text>
  
  <!-- Activation Function Formula -->
  <rect x="100" y="60" width="330" height="40" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="1" />
  <text x="265" y="85" font-family="Arial" font-size="14" text-anchor="middle">Output = f(w₀ + w₁x₁ + w₂x₂ + ... + wₙxₙ)</text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa" />
  <text x="300" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Dropout: Preventing Overfitting in Neural Networks</text>
  
  <!-- Network without dropout -->
  <g transform="translate(100, 100)">
    <text x="0" y="-20" font-family="Arial" font-size="16" font-weight="bold">Without Dropout</text>
    
    <!-- Input layer -->
    <circle cx="0" cy="0" r="15" fill="#6ab7ff" />
    <circle cx="0" cy="50" r="15" fill="#6ab7ff" />
    <circle cx="0" cy="100" r="15" fill="#6ab7ff" />
    <circle cx="0" cy="150" r="15" fill="#6ab7ff" />
    
    <!-- Hidden layer -->
    <circle cx="100" cy="0" r="15" fill="#ff9e6a" />
    <circle cx="100" cy="50" r="15" fill="#ff9e6a" />
    <circle cx="100" cy="100" r="15" fill="#ff9e6a" />
    <circle cx="100" cy="150" r="15" fill="#ff9e6a" />
    
    <!-- Output layer -->
    <circle cx="200" cy="50" r="15" fill="#6aff9e" />
    <circle cx="200" cy="100" r="15" fill="#6aff9e" />
    
    <!-- Connections -->
    <line x1="15" y1="0" x2="85" y2="0" stroke="#333" stroke-width="1" />
    <line x1="15" y1="0" x2="85" y2="50" stroke="#333" stroke-width="1" />
    <line x1="15" y1="0" x2="85" y2="100" stroke="#333" stroke-width="1" />
    <line x1="15" y1="0" x2="85" y2="150" stroke="#333" stroke-width="1" />
    
    <line x1="15" y1="50" x2="85" y2="0" stroke="#333" stroke-width="1" />
    <line x1="15" y1="50" x2="85" y2="50" stroke="#333" stroke-width="1" />
    <line x1="15" y1="50" x2="85" y2="100" stroke="#333" stroke-width="1" />
    <line x1="15" y1="50" x2="85" y2="150" stroke="#333" stroke-width="1" />
    
    <line x1="15" y1="100" x2="85" y2="0" stroke="#333" stroke-width="1" />
    <line x1="15" y1="100" x2="85" y2="50" stroke="#333" stroke-width="1" />
    <line x1="15" y1="100" x2="85" y2="100" stroke="#333" stroke-width="1" />
    <line x1="15" y1="100" x2="85" y2="150" stroke="#333" stroke-width="1" />
    
    <line x1="15" y1="150" x2="85" y2="0" stroke="#333" stroke-width="1" />
    <line x1="15" y1="150" x2="85" y2="50" stroke="#333" stroke-width="1" />
    <line x1="15" y1="150" x2="85" y2="100" stroke="#333" stroke-width="1" />
    <line x1="15" y1="150" x2="85" y2="150" stroke="#333" stroke-width="1" />
    
    <!-- Hidden to output connections -->
    <line x1="115" y1="0" x2="185" y2="50" stroke="#333" stroke-width="1" />
    <line x1="115" y1="0" x2="185" y2="100" stroke="#333" stroke-width="1" />
    <line x1="115" y1="50" x2="185" y2="50" stroke="#333" stroke-width="1" />
    <line x1="115" y1="50" x2="185" y2="100" stroke="#333" stroke-width="1" />
    <line x1="115" y1="100" x2="185" y2="50" stroke="#333" stroke-width="1" />
    <line x1="115" y1="100" x2="185" y2="100" stroke="#333" stroke-width="1" />
    <line x1="115" y1="150" x2="185" y2="50" stroke="#333" stroke-width="1" />
    <line x1="115" y1="150" x2="185" y2="100" stroke="#333" stroke-width="1" />
  </g>
  
  <!-- Network with dropout -->
  <g transform="translate(400, 100)">
    <text x="0" y="-20" font-family="Arial" font-size="16" font-weight="bold">With Dropout (p=0.5)</text>
    
    <!-- Input layer -->
    <circle cx="0" cy="0" r="15" fill="#6ab7ff" />
    <circle cx="0" cy="50" r="15" fill="#6ab7ff" opacity="0.3" />
    <line x1="-10" y1="40" x2="10" y2="60" stroke="red" stroke-width="2" />
    <line x1="-10" y1="60" x2="10" y2="40" stroke="red" stroke-width="2" />
    <circle cx="0" cy="100" r="15" fill="#6ab7ff" />
    <circle cx="0" cy="150" r="15" fill="#6ab7ff" opacity="0.3" />
    <line x1="-10" y1="140" x2="10" y2="160" stroke="red" stroke-width="2" />
    <line x1="-10" y1="160" x2="10" y2="140" stroke="red" stroke-width="2" />
    
    <!-- Hidden layer -->
    <circle cx="100" cy="0" r="15" fill="#ff9e6a" opacity="0.3" />
    <line x1="90" y1="-10" x2="110" y2="10" stroke="red" stroke-width="2" />
    <line x1="90" y1="10" x2="110" y2="-10" stroke="red" stroke-width="2" />
    <circle cx="100" cy="50" r="15" fill="#ff9e6a" />
    <circle cx="100" cy="100" r="15" fill="#ff9e6a" opacity="0.3" />
    <line x1="90" y1="90" x2="110" y2="110" stroke="red" stroke-width="2" />
    <line x1="90" y1="110" x2="110" y2="90" stroke="red" stroke-width="2" />
    <circle cx="100" cy="150" r="15" fill="#ff9e6a" />
    
    <!-- Output layer -->
    <circle cx="200" cy="50" r="15" fill="#6aff9e" />
    <circle cx="200" cy="100" r="15" fill="#6aff9e" />
    
    <!-- Connections (only for active neurons) -->
    <line x1="15" y1="0" x2="85" y2="50" stroke="#333" stroke-width="1" />
    <line x1="15" y1="0" x2="85" y2="150" stroke="#333" stroke-width="1" />
    <line x1="15" y1="100" x2="85" y2="50" stroke="#333" stroke-width="1" />
    <line x1="15" y1="100" x2="85" y2="150" stroke="#333" stroke-width="1" />
    
    <!-- Hidden to output connections -->
    <line x1="115" y1="50" x2="185" y2="50" stroke="#333" stroke-width="1" />
    <line x1="115" y1="50" x2="185" y2="100" stroke="#333" stroke-width="1" />
    <line x1="115" y1="150" x2="185" y2="50" stroke="#333" stroke-width="1" />
    <line x1="115" y1="150" x2="185" y2="100" stroke="#333" stroke-width="1" />
  </g>
  
  <!-- Explanation -->
  <text x="300" y="300" font-family="Arial" font-size="14" text-anchor="middle">Dropout randomly deactivates neurons during training (typically with probability p=0.5)</text>
  <text x="300" y="320" font-family="Arial" font-size="14" text-anchor="middle">This forces the network to learn redundant representations and prevents co-adaptation</text>
  <text x="300" y="340" font-family="Arial" font-size="14" text-anchor="middle">During inference/testing, all neurons are active but outputs are scaled by the dropout rate</text>
  
  <!-- Legend -->
  <circle cx="150" cy="370" r="8" fill="#6ab7ff" />
  <text x="165" y="375" font-family="Arial" font-size="12">Input neurons</text>
  
  <circle cx="250" cy="370" r="8" fill="#ff9e6a" />
  <text x="265" y="375" font-family="Arial" font-size="12">Hidden neurons</text>
  
  <circle cx="350" cy="370" r="8" fill="#6aff9e" />
  <text x="365" y="375" font-family="Arial" font-size="12">Output neurons</text>
  
  <circle cx="450" cy="370" r="8" fill="#ff9e6a" opacity="0.3" />
  <line x1="445" y1="365" x2="455" y2="375" stroke="red" stroke-width="2" />
  <line x1="445" y1="375" x2="455" y2="365" stroke="red" stroke-width="2" />
  <text x="465" y="375" font-family="Arial" font-size="12">Dropped out neurons</text>
</svg>
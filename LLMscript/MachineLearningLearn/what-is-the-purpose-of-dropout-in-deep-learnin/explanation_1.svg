<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa" />
  <text x="300" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Dropout: Preventing Overfitting in Neural Networks</text>
  
  <!-- Network without dropout -->
  <g transform="translate(100, 100)">
    <text x="0" y="-20" font-family="Arial" font-size="16" font-weight="bold">Without Dropout</text>
    
    <!-- Input layer -->
    <circle cx="0" cy="0" r="15" fill="#6ab7ff" />
    <circle cx="0" cy="50" r="15" fill="#6ab7ff" />
    <circle cx="0" cy="100" r="15" fill="#6ab7ff" />
    <circle cx="0" cy="150" r="15" fill="#6ab7ff" />
    
    <!-- Hidden layer -->
    <circle cx="100" cy="0" r="15" fill="#ff9e6a" />
    <circle cx="100" cy="50" r="15" fill="#ff9e6a" />
    <circle cx="100" cy="100" r="15" fill="#ff9e6a" />
    <circle cx="100" cy="150" r="15" fill="#ff9e6a" />
    
    <!-- Output layer -->
    <circle cx="200" cy="50" r="15" fill="#6aff9e" />
    <circle cx="200" cy="100" r="15" fill="#6aff9e" />
    
    <!-- Connections -->
    <g stroke="#aaaaaa" stroke-width="1">
      <!-- Input to hidden -->
      <line x1="15" y1="0" x2="85" y2="0" />
      <line x1="15" y1="0" x2="85" y2="50" />
      <line x1="15" y1="0" x2="85" y2="100" />
      <line x1="15" y1="0" x2="85" y2="150" />
      
      <line x1="15" y1="50" x2="85" y2="0" />
      <line x1="15" y1="50" x2="85" y2="50" />
      <line x1="15" y1="50" x2="85" y2="100" />
      <line x1="15" y1="50" x2="85" y2="150" />
      
      <line x1="15" y1="100" x2="85" y2="0" />
      <line x1="15" y1="100" x2="85" y2="50" />
      <line x1="15" y1="100" x2="85" y2="100" />
      <line x1="15" y1="100" x2="85" y2="150" />
      
      <line x1="15" y1="150" x2="85" y2="0" />
      <line x1="15" y1="150" x2="85" y2="50" />
      <line x1="15" y1="150" x2="85" y2="100" />
      <line x1="15" y1="150" x2="85" y2="150" />
      
      <!-- Hidden to output -->
      <line x1="115" y1="0" x2="185" y2="50" />
      <line x1="115" y1="0" x2="185" y2="100" />
      
      <line x1="115" y1="50" x2="185" y2="50" />
      <line x1="115" y1="50" x2="185" y2="100" />
      
      <line x1="115" y1="100" x2="185" y2="50" />
      <line x1="115" y1="100" x2="185" y2="100" />
      
      <line x1="115" y1="150" x2="185" y2="50" />
      <line x1="115" y1="150" x2="185" y2="100" />
    </g>
    
    <text x="0" y="180" font-family="Arial" font-size="12" text-anchor="middle">Input</text>
    <text x="100" y="180" font-family="Arial" font-size="12" text-anchor="middle">Hidden</text>
    <text x="200" y="180" font-family="Arial" font-size="12" text-anchor="middle">Output</text>
  </g>
  
  <!-- Network with dropout -->
  <g transform="translate(400, 100)">
    <text x="0" y="-20" font-family="Arial" font-size="16" font-weight="bold">With Dropout (p=0.5)</text>
    
    <!-- Input layer -->
    <circle cx="0" cy="0" r="15" fill="#6ab7ff" />
    <circle cx="0" cy="50" r="15" fill="#6ab7ff" />
    <circle cx="0" cy="100" r="15" fill="#6ab7ff" />
    <circle cx="0" cy="150" r="15" fill="#6ab7ff" />
    
    <!-- Hidden layer -->
    <circle cx="100" cy="0" r="15" fill="#ff9e6a" />
    <circle cx="100" cy="50" r="15" fill="#ff9e6a" opacity="0.3" />
    <line x1="85" y1="35" x2="115" y2="65" stroke="red" stroke-width="2" />
    <line x1="85" y1="65" x2="115" y2="35" stroke="red" stroke-width="2" />
    <circle cx="100" cy="100" r="15" fill="#ff9e6a" />
    <circle cx="100" cy="150" r="15" fill="#ff9e6a" opacity="0.3" />
    <line x1="85" y1="135" x2="115" y2="165" stroke="red" stroke-width="2" />
    <line x1="85" y1="165" x2="115" y2="135" stroke="red" stroke-width="2" />
    
    <!-- Output layer -->
    <circle cx="200" cy="50" r="15" fill="#6aff9e" />
    <circle cx="200" cy="100" r="15" fill="#6aff9e" />
    
    <!-- Connections -->
    <g stroke="#aaaaaa" stroke-width="1">
      <!-- Input to hidden -->
      <line x1="15" y1="0" x2="85" y2="0" />
      <line x1="15" y1="100" x2="85" y2="0" />
      
      <line x1="15" y1="0" x2="85" y2="100" />
      <line x1="15" y1="50" x2="85" y2="100" />
      <line x1="15" y1="100" x2="85" y2="100" />
      <line x1="15" y1="150" x2="85" y2="100" />
      
      <!-- Hidden to output -->
      <line x1="115" y1="0" x2="185" y2="50" />
      <line x1="115" y1="0" x2="185" y2="100" />
      
      <line x1="115" y1="100" x2="185" y2="50" />
      <line x1="115" y1="100" x2="185" y2="100" />
    </g>
    
    <text x="0" y="180" font-family="Arial" font-size="12" text-anchor="middle">Input</text>
    <text x="100" y="180" font-family="Arial" font-size="12" text-anchor="middle">Hidden</text>
    <text x="200" y="180" font-family="Arial" font-size="12" text-anchor="middle">Output</text>
  </g>
  
  <!-- Explanation -->
  <g transform="translate(300, 320)">
    <text x="0" y="0" font-family="Arial" font-size="14" text-anchor="middle">
      <tspan x="0" dy="0">Dropout randomly deactivates neurons during training with probability p.</tspan>
      <tspan x="0" dy="20">This prevents co-adaptation of neurons and reduces overfitting.</tspan>
      <tspan x="0" dy="20">At test time, all neurons are active but outputs are scaled by (1-p).</tspan>
    </text>
  </g>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Hierarchical Clustering: Bottom-up Approach</text>
  
  <!-- Data points -->
  <g id="data-points">
    <!-- Group 1 -->
    <circle cx="100" cy="100" r="6" fill="#3498db"/>
    <circle cx="120" cy="110" r="6" fill="#3498db"/>
    <circle cx="90" cy="120" r="6" fill="#3498db"/>
    
    <!-- Group 2 -->
    <circle cx="200" cy="150" r="6" fill="#e74c3c"/>
    <circle cx="220" cy="140" r="6" fill="#e74c3c"/>
    <circle cx="210" cy="170" r="6" fill="#e74c3c"/>
    
    <!-- Group 3 -->
    <circle cx="150" cy="250" r="6" fill="#2ecc71"/>
    <circle cx="170" cy="260" r="6" fill="#2ecc71"/>
    <circle cx="140" cy="270" r="6" fill="#2ecc71"/>
  </g>
  
  <!-- Dendrogram -->
  <g id="dendrogram" transform="translate(350, 80)">
    <!-- Vertical lines -->
    <line x1="0" y1="20" x2="0" y2="80" stroke="#3498db" stroke-width="2"/>
    <line x1="50" y1="20" x2="50" y2="80" stroke="#e74c3c" stroke-width="2"/>
    <line x1="100" y1="20" x2="100" y2="80" stroke="#2ecc71" stroke-width="2"/>
    
    <!-- First merge -->
    <line x1="0" y1="80" x2="50" y2="80" stroke="#9b59b6" stroke-width="2"/>
    <line x1="25" y1="80" x2="25" y2="140" stroke="#9b59b6" stroke-width="2"/>
    
    <!-- Second merge -->
    <line x1="25" y1="140" x2="100" y2="140" stroke="#f39c12" stroke-width="2"/>
    <line x1="62.5" y1="140" x2="62.5" y2="200" stroke="#f39c12" stroke-width="2"/>
    
    <!-- Labels -->
    <text x="0" y="15" font-family="Arial" font-size="12" text-anchor="middle">Cluster 1</text>
    <text x="50" y="15" font-family="Arial" font-size="12" text-anchor="middle">Cluster 2</text>
    <text x="100" y="15" font-family="Arial" font-size="12" text-anchor="middle">Cluster 3</text>
    <text x="25" y="100" font-family="Arial" font-size="12" text-anchor="middle">Merge 1</text>
    <text x="62.5" y="160" font-family="Arial" font-size="12" text-anchor="middle">Merge 2</text>
    <text x="62.5" y="210" font-family="Arial" font-size="12" text-anchor="middle">Final Cluster</text>
  </g>
  
  <!-- Steps explanation -->
  <g id="steps" transform="translate(30, 320)">
    <text font-family="Arial" font-size="14" font-weight="bold">Hierarchical Clustering Process:</text>
    <text y="25" font-family="Arial" font-size="12">1. Start with each data point as its own cluster</text>
    <text y="45" font-family="Arial" font-size="12">2. Iteratively merge the two closest clusters</text>
    <text y="65" font-family="Arial" font-size="12">3. Continue until all points are in one cluster</text>
    <text y="85" font-family="Arial" font-size="12">4. Result: A dendrogram showing merge history</text>
  </g>
  
  <!-- Code example -->
  <g id="code" transform="translate(350, 320)">
    <rect width="220" height="70" fill="#f0f0f0" stroke="#ccc"/>
    <text x="5" y="15" font-family="Courier New" font-size="10">
      <tspan x="5" y="15">// C++ pseudocode</tspan>
      <tspan x="5" y="30">vector&lt;Cluster&gt; clusters = points;</tspan>
      <tspan x="5" y="45">while(clusters.size() > 1) {</tspan>
      <tspan x="5" y="60">  mergeTwoClosestClusters(clusters);</tspan>
      <tspan x="5" y="75">}</tspan>
    </text>
  </g>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Hierarchical Clustering: Bottom-up Approach</text>
  
  <!-- Initial points -->
  <g transform="translate(50, 80)">
    <text x="250" y="0" font-family="Arial" font-size="16" text-anchor="middle">Step 1: Start with individual data points</text>
    
    <!-- Data points -->
    <circle cx="100" cy="50" r="8" fill="#ff6b6b" />
    <circle cx="120" cy="40" r="8" fill="#ff6b6b" />
    <circle cx="350" cy="60" r="8" fill="#48dbfb" />
    <circle cx="370" cy="70" r="8" fill="#48dbfb" />
    <circle cx="200" cy="150" r="8" fill="#1dd1a1" />
    <circle cx="220" cy="160" r="8" fill="#1dd1a1" />
    <circle cx="230" cy="140" r="8" fill="#1dd1a1" />
    
    <!-- Step 2 -->
    <text x="250" y="100" font-family="Arial" font-size="16" text-anchor="middle">Step 2: Merge closest pairs into clusters</text>
    
    <!-- Merged clusters -->
    <circle cx="100" cy="170" r="8" fill="#ff6b6b" />
    <circle cx="120" cy="160" r="8" fill="#ff6b6b" />
    <ellipse cx="110" cy="165" rx="25" ry="20" stroke="#ff6b6b" stroke-width="2" fill="none" stroke-dasharray="5,3" />
    
    <circle cx="350" cy="180" r="8" fill="#48dbfb" />
    <circle cx="370" cy="190" r="8" fill="#48dbfb" />
    <ellipse cx="360" cy="185" rx="25" ry="20" stroke="#48dbfb" stroke-width="2" fill="none" stroke-dasharray="5,3" />
    
    <circle cx="200" cy="270" r="8" fill="#1dd1a1" />
    <circle cx="220" cy="280" r="8" fill="#1dd1a1" />
    <circle cx="230" cy="260" r="8" fill="#1dd1a1" />
    <ellipse cx="215" cy="270" rx="35" ry="25" stroke="#1dd1a1" stroke-width="2" fill="none" stroke-dasharray="5,3" />
    
    <!-- Step 3 -->
    <text x="250" y="220" font-family="Arial" font-size="16" text-anchor="middle">Step 3: Continue merging until single cluster</text>
    
    <!-- Final dendrogram representation -->
    <line x1="110" y1="300" x2="110" y2="320" stroke="#666" stroke-width="2" />
    <line x1="215" y1="300" x2="215" y2="330" stroke="#666" stroke-width="2" />
    <line x1="360" y1="300" x2="360" y2="320" stroke="#666" stroke-width="2" />
    
    <line x1="110" y1="320" x2="215" y2="320" stroke="#666" stroke-width="2" />
    <line x1="162.5" y1="320" x2="162.5" y2="340" stroke="#666" stroke-width="2" />
    
    <line x1="162.5" y1="340" x2="360" y2="340" stroke="#666" stroke-width="2" />
    <line x1="261.25" y1="340" x2="261.25" y2="350" stroke="#666" stroke-width="2" />
  </g>
  
  <!-- Code example -->
  <rect x="420" y="280" width="160" height="100" fill="#f1f2f6" stroke="#dfe4ea" stroke-width="1" />
  <text x="430" y="300" font-family="Courier New" font-size="10">
    <tspan x="430" dy="0">// C++ Hierarchical Clustering</tspan>
    <tspan x="430" dy="14">void agglomerativeClustering(</tspan>
    <tspan x="430" dy="14">  vector&lt;Point&gt; points) {</tspan>
    <tspan x="430" dy="14">  // Start with N clusters</tspan>
    <tspan x="430" dy="14">  // Merge closest pairs</tspan>
    <tspan x="430" dy="14">  // Until one cluster remains</tspan>
    <tspan x="430" dy="14">}</tspan>
  </text>
  
  <!-- Key characteristics -->
  <rect x="50" y="350" width="340" height="40" rx="5" fill="#ffeaa7" />
  <text x="60" y="375" font-family="Arial" font-size="14">
    Key: Builds a hierarchy of clusters from bottom up
  </text>
</svg>
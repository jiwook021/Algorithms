<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="300" y="30" font-size="20" font-weight="bold" text-anchor="middle">Hierarchical Clustering vs K-means: Approach</text>
  
  <!-- Hierarchical Clustering Side -->
  <rect x="50" y="60" width="220" height="300" rx="10" ry="10" fill="#f0f8ff" stroke="#333" stroke-width="2"/>
  <text x="160" y="85" font-size="16" font-weight="bold" text-anchor="middle">Hierarchical Clustering</text>
  
  <!-- Dendrogram -->
  <path d="M160 110 v40 M110 150 h100 M110 150 v30 M210 150 v30 M90 180 h40 M190 180 h40 M90 180 v20 M130 180 v20 M190 180 v20 M230 180 v20" 
        stroke="#4682b4" stroke-width="2" fill="none"/>
  <text x="160" y="220" font-size="12" text-anchor="middle">Bottom-up (Agglomerative)</text>
  
  <!-- Step visualization -->
  <circle cx="90" cy="250" r="10" fill="#ff7f50"/>
  <circle cx="130" cy="250" r="10" fill="#ff7f50"/>
  <circle cx="110" cy="270" r="15" fill="#ff7f50" fill-opacity="0.5" stroke="#ff7f50"/>
  <path d="M90 250 L110 270 L130 250" stroke="#ff7f50" stroke-width="1" stroke-dasharray="3,3"/>
  
  <circle cx="190" cy="250" r="10" fill="#6a5acd"/>
  <circle cx="230" cy="250" r="10" fill="#6a5acd"/>
  <circle cx="210" cy="270" r="15" fill="#6a5acd" fill-opacity="0.5" stroke="#6a5acd"/>
  <path d="M190 250 L210 270 L230 250" stroke="#6a5acd" stroke-width="1" stroke-dasharray="3,3"/>
  
  <circle cx="160" cy="310" r="20" fill="#4682b4" fill-opacity="0.5" stroke="#4682b4"/>
  <path d="M110 270 L160 310 L210 270" stroke="#4682b4" stroke-width="1" stroke-dasharray="3,3"/>
  
  <text x="160" y="340" font-size="12" text-anchor="middle">Builds hierarchy of clusters</text>
  <text x="160" y="355" font-size="12" text-anchor="middle">No predefined number of clusters</text>
  
  <!-- K-means Clustering Side -->
  <rect x="330" y="60" width="220" height="300" rx="10" ry="10" fill="#fff0f5" stroke="#333" stroke-width="2"/>
  <text x="440" y="85" font-size="16" font-weight="bold" text-anchor="middle">K-means Clustering</text>
  
  <!-- K-means visualization -->
  <circle cx="380" cy="150" r="8" fill="#ff7f50"/>
  <circle cx="410" cy="130" r="8" fill="#ff7f50"/>
  <circle cx="370" cy="180" r="8" fill="#ff7f50"/>
  <circle cx="400" cy="170" r="8" fill="#ff7f50"/>
  <circle cx="390" cy="150" r="30" fill="#ff7f50" fill-opacity="0.2" stroke="#ff7f50" stroke-dasharray="3,3"/>
  <circle cx="390" cy="150" r="5" fill="#ff7f50" stroke="#000"/>
  
  <circle cx="480" cy="150" r="8" fill="#6a5acd"/>
  <circle cx="510" cy="130" r="8" fill="#6a5acd"/>
  <circle cx="470" cy="180" r="8" fill="#6a5acd"/>
  <circle cx="500" cy="170" r="8" fill="#6a5acd"/>
  <circle cx="490" cy="150" r="30" fill="#6a5acd" fill-opacity="0.2" stroke="#6a5acd" stroke-dasharray="3,3"/>
  <circle cx="490" cy="150" r="5" fill="#6a5acd" stroke="#000"/>
  
  <!-- Iteration arrows -->
  <path d="M440 220 A20 20 0 1 1 460 220" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="440" y="250" font-size="12" text-anchor="middle">Iteratively updates</text>
  <text x="440" y="265" font-size="12" text-anchor="middle">centroids until convergence</text>
  
  <text x="440" y="310" font-size="12" text-anchor="middle">Requires predefined K value</text>
  <text x="440" y="325" font-size="12" text-anchor="middle">(number of clusters)</text>
  <text x="440" y="340" font-size="12" text-anchor="middle">Flat clustering (no hierarchy)</text>
  
  <!-- Code snippets -->
  <text x="160" y="380" font-size="10" text-anchor="middle" font-family="monospace">// Merge closest clusters</text>
  <text x="440" y="380" font-size="10" text-anchor="middle" font-family="monospace">// Assign to nearest centroid</text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f9f9f9"/>
  <text x="300" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Hierarchical Clustering: Bottom-up (Agglomerative) Approach</text>
  
  <!-- Initial points -->
  <g transform="translate(50, 100)">
    <text x="0" y="-20" font-family="Arial" font-size="16" font-weight="bold">Step 1: Start with individual points</text>
    <circle cx="20" cy="30" r="5" fill="#3498db"/>
    <circle cx="40" cy="20" r="5" fill="#3498db"/>
    <circle cx="80" cy="40" r="5" fill="#e74c3c"/>
    <circle cx="100" cy="30" r="5" fill="#e74c3c"/>
    <circle cx="150" cy="60" r="5" fill="#2ecc71"/>
    <circle cx="180" cy="70" r="5" fill="#2ecc71"/>
    <circle cx="170" cy="40" r="5" fill="#2ecc71"/>
  </g>
  
  <!-- First merge -->
  <g transform="translate(50, 200)">
    <text x="0" y="-20" font-family="Arial" font-size="16" font-weight="bold">Step 2: Merge closest points</text>
    <circle cx="20" cy="30" r="5" fill="#3498db"/>
    <circle cx="40" cy="20" r="5" fill="#3498db"/>
    <path d="M20,30 Q30,15 40,20" stroke="#3498db" fill="none" stroke-width="1.5"/>
    
    <circle cx="80" cy="40" r="5" fill="#e74c3c"/>
    <circle cx="100" cy="30" r="5" fill="#e74c3c"/>
    <path d="M80,40 Q90,25 100,30" stroke="#e74c3c" fill="none" stroke-width="1.5"/>
    
    <circle cx="150" cy="60" r="5" fill="#2ecc71"/>
    <circle cx="180" cy="70" r="5" fill="#2ecc71"/>
    <circle cx="170" cy="40" r="5" fill="#2ecc71"/>
    <path d="M150,60 Q160,50 170,40" stroke="#2ecc71" fill="none" stroke-width="1.5"/>
    <path d="M170,40 Q175,55 180,70" stroke="#2ecc71" fill="none" stroke-width="1.5"/>
  </g>
  
  <!-- Final merge -->
  <g transform="translate(50, 300)">
    <text x="0" y="-20" font-family="Arial" font-size="16" font-weight="bold">Step 3: Continue merging until desired clusters formed</text>
    <circle cx="20" cy="30" r="5" fill="#3498db"/>
    <circle cx="40" cy="20" r="5" fill="#3498db"/>
    <path d="M20,30 Q30,15 40,20" stroke="#3498db" fill="none" stroke-width="1.5"/>
    
    <circle cx="80" cy="40" r="5" fill="#e74c3c"/>
    <circle cx="100" cy="30" r="5" fill="#e74c3c"/>
    <path d="M80,40 Q90,25 100,30" stroke="#e74c3c" fill="none" stroke-width="1.5"/>
    
    <circle cx="150" cy="60" r="5" fill="#2ecc71"/>
    <circle cx="180" cy="70" r="5" fill="#2ecc71"/>
    <circle cx="170" cy="40" r="5" fill="#2ecc71"/>
    <path d="M150,60 Q160,50 170,40" stroke="#2ecc71" fill="none" stroke-width="1.5"/>
    <path d="M170,40 Q175,55 180,70" stroke="#2ecc71" fill="none" stroke-width="1.5"/>
    
    <!-- Dendrogram lines -->
    <path d="M30,10 L30,-10 L90,-10 L90,10" stroke="#888" fill="none" stroke-width="1.5"/>
    <path d="M165,30 L165,-30 L270,-30" stroke="#888" fill="none" stroke-width="1.5"/>
    <path d="M60,-10 L60,-50 L165,-50 L165,-30" stroke="#888" fill="none" stroke-width="1.5"/>
  </g>
  
  <!-- Code example -->
  <g transform="translate(300, 150)">
    <rect x="0" y="0" width="280" height="180" rx="5" fill="#f0f0f0" stroke="#ccc"/>
    <text x="10" y="20" font-family="Consolas, monospace" font-size="12">
      <tspan x="10" y="20">// C++ Hierarchical Clustering</tspan>
      <tspan x="10" y="40">std::vector&lt;Cluster&gt; clusters;</tspan>
      <tspan x="10" y="60">// Initialize each point as a cluster</tspan>
      <tspan x="10" y="80">for(auto&amp; point : points) {</tspan>
      <tspan x="10" y="100">  clusters.push_back({point});</tspan>
      <tspan x="10" y="120">}</tspan>
      <tspan x="10" y="140">// Merge until desired number reached</tspan>
      <tspan x="10" y="160">while(clusters.size() > k) {</tspan>
      <tspan x="10" y="180">  mergeTwoClosestClusters(clusters);</tspan>
      <tspan x="10" y="200">}</tspan>
    </text>
  </g>
  
  <!-- Key points -->
  <g transform="translate(300, 350)">
    <rect x="0" y="0" width="280" height="40" rx="5" fill="#e8f4f8" stroke="#3498db"/>
    <text x="140" y="25" font-family="Arial" font-size="14" text-anchor="middle">
      No need to specify number of clusters in advance
    </text>
  </g>
</svg>
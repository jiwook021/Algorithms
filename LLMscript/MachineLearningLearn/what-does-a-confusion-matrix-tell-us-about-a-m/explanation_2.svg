<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Performance Metrics from Confusion Matrix</text>
  
  <!-- Confusion Matrix (small reference) -->
  <rect x="50" y="80" width="160" height="160" fill="#ffffff" stroke="#333333" stroke-width="2" />
  <line x1="50" y1="160" x2="210" y2="160" stroke="#333333" stroke-width="2" />
  <line x1="130" y1="80" x2="130" y2="240" stroke="#333333" stroke-width="2" />
  
  <text x="90" y="130" font-family="Arial" font-size="14" text-anchor="middle">TP</text>
  <text x="170" y="130" font-family="Arial" font-size="14" text-anchor="middle">FP</text>
  <text x="90" y="200" font-family="Arial" font-size="14" text-anchor="middle">FN</text>
  <text x="170" y="200" font-family="Arial" font-size="14" text-anchor="middle">TN</text>
  
  <!-- Metrics -->
  <rect x="250" y="80" width="300" height="60" fill="#a8e6cf" rx="5" ry="5" />
  <text x="260" y="110" font-family="Arial" font-size="16">Accuracy = (TP + TN) / (TP + FP + FN + TN)</text>
  <text x="260" y="130" font-family="Arial" font-size="14" fill="#555555">Proportion of all correct predictions</text>
  
  <rect x="250" y="150" width="300" height="60" fill="#ffd3b6" rx="5" ry="5" />
  <text x="260" y="180" font-family="Arial" font-size="16">Precision = TP / (TP + FP)</text>
  <text x="260" y="200" font-family="Arial" font-size="14" fill="#555555">Proportion of positive predictions that are correct</text>
  
  <rect x="250" y="220" width="300" height="60" fill="#ffaaa5" rx="5" ry="5" />
  <text x="260" y="250" font-family="Arial" font-size="16">Recall = TP / (TP + FN)</text>
  <text x="260" y="270" font-family="Arial" font-size="14" fill="#555555">Proportion of actual positives that are predicted</text>
  
  <rect x="250" y="290" width="300" height="60" fill="#dcedc1" rx="5" ry="5" />
  <text x="260" y="320" font-family="Arial" font-size="16">F1 Score = 2 * (Precision * Recall) / (Precision + Recall)</text>
  <text x="260" y="340" font-family="Arial" font-size="14" fill="#555555">Harmonic mean of precision and recall</text>
  
  <!-- Code Example -->
  <text x="130" y="270" font-family="Consolas, monospace" font-size="12" text-anchor="middle" fill="#333333">
    // C++ example
    double accuracy = 
      (TP + TN) / 
      (double)(TP + FP + FN + TN);
  </text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa" rx="10" ry="10" />
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Performance Metrics from Confusion Matrix</text>
  
  <!-- Metrics Boxes -->
  <rect x="50" y="80" width="240" height="70" fill="#d4e6f1" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <rect x="50" y="160" width="240" height="70" fill="#d4e6f1" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <rect x="50" y="240" width="240" height="70" fill="#d4e6f1" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <rect x="300" y="80" width="240" height="70" fill="#d4e6f1" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <rect x="300" y="160" width="240" height="70" fill="#d4e6f1" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <rect x="300" y="240" width="240" height="70" fill="#d4e6f1" stroke="#333" stroke-width="1" rx="5" ry="5" />
  
  <!-- Metric Names and Formulas -->
  <text x="60" y="105" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Accuracy</text>
  <text x="60" y="130" font-family="Arial" font-size="16" fill="#333">(TP + TN) / (TP + TN + FP + FN)</text>
  
  <text x="60" y="185" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Precision</text>
  <text x="60" y="210" font-family="Arial" font-size="16" fill="#333">TP / (TP + FP)</text>
  
  <text x="60" y="265" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Recall (Sensitivity)</text>
  <text x="60" y="290" font-family="Arial" font-size="16" fill="#333">TP / (TP + FN)</text>
  
  <text x="310" y="105" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Specificity</text>
  <text x="310" y="130" font-family="Arial" font-size="16" fill="#333">TN / (TN + FP)</text>
  
  <text x="310" y="185" font-family="Arial" font-size="18" font-weight="bold" fill="#333">F1 Score</text>
  <text x="310" y="210" font-family="Arial" font-size="16" fill="#333">2 * (Precision * Recall) / (Precision + Recall)</text>
  
  <text x="310" y="265" font-family="Arial" font-size="18" font-weight="bold" fill="#333">False Positive Rate</text>
  <text x="310" y="290" font-family="Arial" font-size="16" fill="#333">FP / (FP + TN)</text>
  
  <!-- C++ Code Example -->
  <rect x="50" y="330" width="500" height="50" fill="#e6e6e6" rx="5" ry="5" />
  <text x="60" y="355" font-family="Courier New" font-size="12" fill="#333">
    <tspan x="60" dy="0">// C++ code to calculate accuracy from confusion matrix</tspan>
    <tspan x="60" dy="16">double accuracy = (double)(TP + TN) / (TP + TN + FP + FN);</tspan>
  </text>
  
  <!-- Legend -->
  <rect x="50" y="50" width="500" height="20" fill="#d4e6f1" stroke="#333" stroke-width="1" rx="5" ry="5" />
  <text x="300" y="65" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">
    TP = True Positive, TN = True Negative, FP = False Positive, FN = False Negative
  </text>
</svg>
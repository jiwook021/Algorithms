<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Confusion Matrix Structure</text>
  
  <!-- Matrix -->
  <rect x="150" y="80" width="300" height="240" fill="#ffffff" stroke="#333333" stroke-width="2" />
  
  <!-- Matrix Dividers -->
  <line x1="150" y1="200" x2="450" y2="200" stroke="#333333" stroke-width="2" />
  <line x1="300" y1="80" x2="300" y2="320" stroke="#333333" stroke-width="2" />
  
  <!-- Cell Labels -->
  <rect x="150" y="80" width="150" height="120" fill="#a8e6cf" opacity="0.8" />
  <text x="225" y="150" font-family="Arial" font-size="18" text-anchor="middle">True Positive (TP)</text>
  
  <rect x="300" y="80" width="150" height="120" fill="#ffd3b6" opacity="0.8" />
  <text x="375" y="150" font-family="Arial" font-size="18" text-anchor="middle">False Positive (FP)</text>
  
  <rect x="150" y="200" width="150" height="120" fill="#ffaaa5" opacity="0.8" />
  <text x="225" y="270" font-family="Arial" font-size="18" text-anchor="middle">False Negative (FN)</text>
  
  <rect x="300" y="200" width="150" height="120" fill="#a8e6cf" opacity="0.8" />
  <text x="375" y="270" font-family="Arial" font-size="18" text-anchor="middle">True Negative (TN)</text>
  
  <!-- Axis Labels -->
  <text x="225" y="350" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Actual Positive</text>
  <text x="375" y="350" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Actual Negative</text>
  
  <text x="100" y="150" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" transform="rotate(-90, 100, 150)">Predicted Negative</text>
  <text x="100" y="270" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" transform="rotate(-90, 100, 270)">Predicted Positive</text>
  
  <!-- Explanation -->
  <text x="300" y="380" font-family="Arial" font-size="14" text-anchor="middle" fill="#555555">
    A confusion matrix shows how many samples were correctly and incorrectly classified for each class
  </text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold" fill="#333">Performance Metrics Derived from Confusion Matrix</text>
  
  <!-- Metrics Formulas and Explanations -->
  <rect x="50" y="70" width="240" height="80" fill="#e1f5fe" rx="5" ry="5" stroke="#81d4fa" stroke-width="1"/>
  <text x="170" y="95" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#0277bd">Accuracy</text>
  <text x="170" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Accuracy = (TP + TN) / (TP + TN + FP + FN)</text>
  <text x="170" y="140" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">Overall correctness of the model</text>
  
  <rect x="310" y="70" width="240" height="80" fill="#e8f5e9" rx="5" ry="5" stroke="#a5d6a7" stroke-width="1"/>
  <text x="430" y="95" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#2e7d32">Precision</text>
  <text x="430" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Precision = TP / (TP + FP)</text>
  <text x="430" y="140" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">How many selected items are relevant</text>
  
  <rect x="50" y="160" width="240" height="80" fill="#fff3e0" rx="5" ry="5" stroke="#ffe0b2" stroke-width="1"/>
  <text x="170" y="185" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#e65100">Recall (Sensitivity)</text>
  <text x="170" y="210" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Recall = TP / (TP + FN)</text>
  <text x="170" y="230" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">How many relevant items are selected</text>
  
  <rect x="310" y="160" width="240" height="80" fill="#f3e5f5" rx="5" ry="5" stroke="#e1bee7" stroke-width="1"/>
  <text x="430" y="185" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#6a1b9a">Specificity</text>
  <text x="430" y="210" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Specificity = TN / (TN + FP)</text>
  <text x="430" y="230" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">True negative rate</text>
  
  <rect x="50" y="250" width="240" height="80" fill="#ffebee" rx="5" ry="5" stroke="#ffcdd2" stroke-width="1"/>
  <text x="170" y="275" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#c62828">F1 Score</text>
  <text x="170" y="300" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">F1 = 2 * (Precision * Recall) / (Precision + Recall)</text>
  <text x="170" y="320" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">Harmonic mean of precision and recall</text>
  
  <rect x="310" y="250" width="240" height="80" fill="#e0f2f1" rx="5" ry="5" stroke="#b2dfdb" stroke-width="1"/>
  <text x="430" y="275" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#00695c">MCC</text>
  <text x="430" y="300" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">MCC = (TP*TN - FP*FN) / √((TP+FP)(TP+FN)(TN+FP)(TN+FN))</text>
  <text x="430" y="320" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">Matthews Correlation Coefficient</text>
  
  <!-- C++ Code Example -->
  <rect x="50" y="340" width="500" height="50" fill="#f5f5f5" rx="5" ry="5" stroke="#ddd" stroke-width="1"/>
  <text x="55" y="360" font-family="Consolas, monospace" font-size="12" fill="#333">
    <tspan x="55" dy="0">// C++ code to calculate accuracy from confusion matrix</tspan>
    <tspan x="55" dy="16">double accuracy = static_cast&lt;double&gt;(TP + TN) / (TP + TN + FP + FN);</tspan>
  </text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Performance Metrics from Confusion Matrix</text>
  
  <!-- Metrics Box -->
  <rect x="50" y="80" width="500" height="260" fill="#ffffff" stroke="#333333" stroke-width="1" rx="5" />
  
  <!-- Metrics -->
  <text x="70" y="110" font-family="Arial" font-size="18" font-weight="bold">Key Performance Metrics:</text>
  
  <!-- Accuracy -->
  <rect x="70" y="125" width="460" height="40" fill="#e6f2ff" stroke="#333333" stroke-width="1" rx="3" />
  <text x="80" y="150" font-family="Arial" font-size="16" font-weight="bold">Accuracy:</text>
  <text x="180" y="150" font-family="Arial" font-size="16">(TP + TN) / (TP + TN + FP + FN)</text>
  <text x="480" y="150" font-family="Arial" font-size="14" fill="#555555">Overall correctness</text>
  
  <!-- Precision -->
  <rect x="70" y="175" width="460" height="40" fill="#e6ffe6" stroke="#333333" stroke-width="1" rx="3" />
  <text x="80" y="200" font-family="Arial" font-size="16" font-weight="bold">Precision:</text>
  <text x="180" y="200" font-family="Arial" font-size="16">TP / (TP + FP)</text>
  <text x="480" y="200" font-family="Arial" font-size="14" fill="#555555">Positive predictive value</text>
  
  <!-- Recall -->
  <rect x="70" y="225" width="460" height="40" fill="#fff2e6" stroke="#333333" stroke-width="1" rx="3" />
  <text x="80" y="250" font-family="Arial" font-size="16" font-weight="bold">Recall:</text>
  <text x="180" y="250" font-family="Arial" font-size="16">TP / (TP + FN)</text>
  <text x="480" y="250" font-family="Arial" font-size="14" fill="#555555">Sensitivity</text>
  
  <!-- F1 Score -->
  <rect x="70" y="275" width="460" height="40" fill="#f9e6ff" stroke="#333333" stroke-width="1" rx="3" />
  <text x="80" y="300" font-family="Arial" font-size="16" font-weight="bold">F1 Score:</text>
  <text x="180" y="300" font-family="Arial" font-size="16">2 * (Precision * Recall) / (Precision + Recall)</text>
  <text x="480" y="300" font-family="Arial" font-size="14" fill="#555555">Harmonic mean</text>
  
  <!-- Code Example -->
  <rect x="100" y="330" width="400" height="50" fill="#f0f0f0" stroke="#333333" stroke-width="1" rx="3" />
  <text x="110" y="350" font-family="Courier New" font-size="12">
    <tspan>// C++ calculation example</tspan>
    <tspan x="110" dy="16">double accuracy = (TP + TN) / (double)(TP + TN + FP + FN);</tspan>
  </text>
</svg>
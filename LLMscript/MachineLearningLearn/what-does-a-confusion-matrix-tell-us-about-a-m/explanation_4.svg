<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Confusion Matrix Structure</text>
  
  <!-- Matrix -->
  <rect x="150" y="90" width="300" height="220" fill="#ffffff" stroke="#333333" stroke-width="2" />
  
  <!-- Matrix Cells -->
  <rect x="150" y="90" width="150" height="110" fill="#a8d08d" stroke="#333333" stroke-width="1" />
  <rect x="300" y="90" width="150" height="110" fill="#f4b084" stroke="#333333" stroke-width="1" />
  <rect x="150" y="200" width="150" height="110" fill="#f4b084" stroke="#333333" stroke-width="1" />
  <rect x="300" y="200" width="150" height="110" fill="#a8d08d" stroke="#333333" stroke-width="1" />
  
  <!-- Cell Labels -->
  <text x="225" y="145" font-family="Arial" font-size="20" text-anchor="middle">True Positive (TP)</text>
  <text x="375" y="145" font-family="Arial" font-size="20" text-anchor="middle">False Positive (FP)</text>
  <text x="225" y="255" font-family="Arial" font-size="20" text-anchor="middle">False Negative (FN)</text>
  <text x="375" y="255" font-family="Arial" font-size="20" text-anchor="middle">True Negative (TN)</text>
  
  <!-- Row Labels -->
  <text x="100" y="145" font-family="Arial" font-size="16" text-anchor="end" font-weight="bold">Actual Positive</text>
  <text x="100" y="255" font-family="Arial" font-size="16" text-anchor="end" font-weight="bold">Actual Negative</text>
  
  <!-- Column Labels -->
  <text x="225" y="80" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Predicted Positive</text>
  <text x="375" y="80" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Predicted Negative</text>
  
  <!-- Explanation -->
  <text x="300" y="340" font-family="Arial" font-size="14" text-anchor="middle">
    A confusion matrix shows the counts of true/false positives/negatives,
  </text>
  <text x="300" y="360" font-family="Arial" font-size="14" text-anchor="middle">
    allowing us to see where our model makes correct predictions and where it makes mistakes.
  </text>
  <text x="300" y="380" font-family="Arial" font-size="14" text-anchor="middle">
    Green cells represent correct predictions, orange cells represent errors.
  </text>
</svg>
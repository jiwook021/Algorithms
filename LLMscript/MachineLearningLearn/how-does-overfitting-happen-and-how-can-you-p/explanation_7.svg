<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f5f5f5" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Overfitting: The Problem</text>
  
  <!-- Graph container -->
  <rect x="50" y="70" width="500" height="280" fill="white" stroke="#ddd" stroke-width="1" rx="5" ry="5"/>
  
  <!-- Axes -->
  <line x1="100" y1="300" x2="500" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="300" x2="100" y2="100" stroke="#333" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="300" y="330" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Model Complexity</text>
  <text x="70" y="200" font-family="Arial" font-size="16" text-anchor="middle" fill="#333" transform="rotate(-90, 70, 200)">Error</text>
  
  <!-- Data points -->
  <circle cx="150" cy="240" r="4" fill="#3366cc"/>
  <circle cx="180" cy="220" r="4" fill="#3366cc"/>
  <circle cx="200" cy="250" r="4" fill="#3366cc"/>
  <circle cx="230" cy="200" r="4" fill="#3366cc"/>
  <circle cx="260" cy="230" r="4" fill="#3366cc"/>
  <circle cx="290" cy="190" r="4" fill="#3366cc"/>
  <circle cx="320" cy="220" r="4" fill="#3366cc"/>
  <circle cx="350" cy="180" r="4" fill="#3366cc"/>
  <circle cx="380" cy="210" r="4" fill="#3366cc"/>
  <circle cx="410" cy="170" r="4" fill="#3366cc"/>
  <circle cx="440" cy="200" r="4" fill="#3366cc"/>
  
  <!-- Training error curve -->
  <path d="M100,250 Q300,180 500,120" stroke="#ff6600" stroke-width="3" fill="none"/>
  <text x="480" y="110" font-family="Arial" font-size="14" fill="#ff6600" font-weight="bold">Training Error</text>
  
  <!-- Testing error curve -->
  <path d="M100,250 Q220,180 300,150 Q380,120 500,200" stroke="#009900" stroke-width="3" fill="none"/>
  <text x="480" y="210" font-family="Arial" font-size="14" fill="#009900" font-weight="bold">Testing Error</text>
  
  <!-- Optimal point -->
  <circle cx="300" cy="150" r="8" fill="#9900cc" stroke="black" stroke-width="2"/>
  <text x="300" y="130" font-family="Arial" font-size="14" text-anchor="middle" fill="#9900cc" font-weight="bold">Optimal Complexity</text>
  
  <!-- Overfitting region -->
  <rect x="350" y="150" width="150" height="50" fill="#ff000033" rx="5" ry="5"/>
  <text x="425" y="180" font-family="Arial" font-size="16" text-anchor="middle" fill="#cc0000" font-weight="bold">Overfitting Region</text>
  
  <!-- Underfitting region -->
  <rect x="100" y="200" width="150" height="50" fill="#0000ff33" rx="5" ry="5"/>
  <text x="175" y="230" font-family="Arial" font-size="16" text-anchor="middle" fill="#0000cc" font-weight="bold">Underfitting Region</text>
  
  <!-- Explanation -->
  <text x="300" y="370" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">
    Overfitting occurs when a model learns the training data too well,
  </text>
  <text x="300" y="390" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">
    capturing noise rather than the underlying pattern, leading to poor generalization.
  </text>
</svg>
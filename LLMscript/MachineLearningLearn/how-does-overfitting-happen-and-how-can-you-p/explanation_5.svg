<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Preventing Overfitting: Regularization Techniques</text>
  
  <!-- Code Box -->
  <rect x="50" y="70" width="500" height="200" fill="white" stroke="#333" stroke-width="1" rx="5" />
  
  <!-- Code Content -->
  <text font-family="Consolas, monospace" font-size="14" x="60" y="95">
    <tspan x="60" y="95" fill="#0000AA">// L1 Regularization (Lasso)</tspan>
    <tspan x="60" y="115" fill="#000000">cost = loss(predictions, actual) + lambda * sum(|weights|);</tspan>
    
    <tspan x="60" y="145" fill="#0000AA">// L2 Regularization (Ridge)</tspan>
    <tspan x="60" y="165" fill="#000000">cost = loss(predictions, actual) + lambda * sum(weights²);</tspan>
    
    <tspan x="60" y="195" fill="#0000AA">// Dropout in Neural Networks</tspan>
    <tspan x="60" y="215" fill="#880000">for</tspan>
    <tspan fill="#000000"> (</tspan>
    <tspan fill="#880000">auto</tspan>
    <tspan fill="#000000">&amp; neuron : layer) {</tspan>
    <tspan x="60" y="235" fill="#000000">    neuron.active = (rand() &lt; keep_prob); </tspan>
    <tspan x="60" y="255" fill="#000000">}</tspan>
  </text>
  
  <!-- Regularization Illustrations -->
  <!-- L1 Regularization -->
  <rect x="50" y="290" width="160" height="90" fill="#E8F5E9" stroke="#81C784" stroke-width="1" rx="5" />
  <text x="130" y="310" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">L1 Regularization</text>
  <text x="130" y="330" font-family="Arial" font-size="12" text-anchor="middle">Encourages sparsity</text>
  <text x="130" y="350" font-family="Arial" font-size="12" text-anchor="middle">Sets some weights to 0</text>
  <text x="130" y="370" font-family="Arial" font-size="12" text-anchor="middle">Feature selection</text>
  
  <!-- L2 Regularization -->
  <rect x="220" y="290" width="160" height="90" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1" rx="5" />
  <text x="300" y="310" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">L2 Regularization</text>
  <text x="300" y="330" font-family="Arial" font-size="12" text-anchor="middle">Penalizes large weights</text>
  <text x="300" y="350" font-family="Arial" font-size="12" text-anchor="middle">Shrinks weights toward 0</text>
  <text x="300" y="370" font-family="Arial" font-size="12" text-anchor="middle">Prevents extreme values</text>
  
  <!-- Dropout -->
  <rect x="390" y="290" width="160" height="90" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1" rx="5" />
  <text x="470" y="310" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Dropout</text>
  <text x="470" y="330" font-family="Arial" font-size="12" text-anchor="middle">Randomly deactivates</text>
  <text x="470" y="350" font-family="Arial" font-size="12" text-anchor="middle">neurons during training</text>
  <text x="470" y="370" font-family="Arial" font-size="12" text-anchor="middle">Prevents co-adaptation</text>
</svg>
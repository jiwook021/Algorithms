<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Cross-Validation to Detect and Prevent Overfitting</text>
  
  <!-- Dataset visualization -->
  <rect x="50" y="70" width="500" height="60" fill="#fbbc05" fill-opacity="0.2" stroke="#fbbc05" stroke-width="2" rx="5" />
  <text x="300" y="105" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">Complete Dataset</text>
  
  <!-- K-fold cross validation illustration -->
  <rect x="50" y="160" width="100" height="40" fill="#4285f4" fill-opacity="0.7" stroke="#333" stroke-width="1" />
  <rect x="150" y="160" width="100" height="40" fill="#ea4335" fill-opacity="0.7" stroke="#333" stroke-width="1" />
  <rect x="250" y="160" width="100" height="40" fill="#4285f4" fill-opacity="0.7" stroke="#333" stroke-width="1" />
  <rect x="350" y="160" width="100" height="40" fill="#4285f4" fill-opacity="0.7" stroke="#333" stroke-width="1" />
  <rect x="450" y="160" width="100" height="40" fill="#4285f4" fill-opacity="0.7" stroke="#333" stroke-width="1" />
  <text x="200" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Fold 1</text>
  
  <rect x="50" y="210" width="100" height="40" fill="#4285f4" fill-opacity="0.7" stroke="#333" stroke-width="1" />
  <rect x="150" y="210" width="100" height="40" fill="#4285f4" fill-opacity="0.7" stroke="#333" stroke-width="1" />
  <rect x="250" y="210" width="100" height="40" fill="#ea4335" fill-opacity="0.7" stroke="#333" stroke-width="1" />
  <rect x="350" y="210" width="100" height="40" fill="#4285f4" fill-opacity="0.7" stroke="#333" stroke-width="1" />
  <rect x="450" y="210" width="100" height="40" fill="#4285f4" fill-opacity="0.7" stroke="#333" stroke-width="1" />
  <text x="300" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Fold 2</text>
  
  <rect x="50" y="260" width="100" height="40" fill="#4285f4" fill-opacity="0.7" stroke="#333" stroke-width="1" />
  <rect x="150" y="260" width="100" height="40" fill="#4285f4" fill-opacity="0.7" stroke="#333" stroke-width="1" />
  <rect x="250" y="260" width="100" height="40" fill="#4285f4" fill-opacity="0.7" stroke="#333" stroke-width="1" />
  <rect x="350" y="260" width="100" height="40" fill="#ea4335" fill-opacity="0.7" stroke="#333" stroke-width="1" />
  <rect x="450" y="260" width="100" height="40" fill="#4285f4" fill-opacity="0.7" stroke="#333" stroke-width="1" />
  <text x="400" y="280" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Fold 3</text>
  
  <!-- Legend -->
  <rect x="150" y="320" width="20" height="20" fill="#4285f4" fill-opacity="0.7" stroke="#333" stroke-width="1" />
  <text x="180" y="335" font-family="Arial" font-size="14" fill="#333">Training Data</text>
  
  <rect x="300" y="320" width="20" height="20" fill="#ea4335" fill-opacity="0.7" stroke="#333" stroke-width="1" />
  <text x="330" y="335" font-family="Arial" font-size="14" fill="#333">Validation Data</text>
  
  <!-- Code snippet -->
  <text x="300" y="370" font-family="Consolas, monospace" font-size="12" text-anchor="middle" fill="#333">
    <tspan x="300" dy="0">// 5-fold cross-validation in C++</tspan>
    <tspan x="300" dy="15">std::vector&lt;double&gt; scores = crossValidate(model, data, 5);</tspan>
  </text>
  
  <!-- Arrows -->
  <line x1="300" y1="130" x2="300" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>
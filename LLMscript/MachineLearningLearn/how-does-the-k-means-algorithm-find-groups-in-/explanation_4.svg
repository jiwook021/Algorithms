<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">K-Means: Assignment Step</text>
  
  <!-- Data points group 1 -->
  <circle cx="120" cy="150" r="6" fill="#4285f4"/>
  <circle cx="150" cy="130" r="6" fill="#4285f4"/>
  <circle cx="180" cy="160" r="6" fill="#4285f4"/>
  <circle cx="140" cy="170" r="6" fill="#4285f4"/>
  <circle cx="160" cy="140" r="6" fill="#4285f4"/>
  
  <!-- Data points group 2 -->
  <circle cx="420" cy="150" r="6" fill="#ea4335"/>
  <circle cx="450" cy="130" r="6" fill="#ea4335"/>
  <circle cx="480" cy="160" r="6" fill="#ea4335"/>
  <circle cx="440" cy="170" r="6" fill="#ea4335"/>
  <circle cx="460" cy="140" r="6" fill="#ea4335"/>
  
  <!-- Data points group 3 -->
  <circle cx="150" cy="280" r="6" fill="#fbbc05"/>
  <circle cx="180" cy="260" r="6" fill="#fbbc05"/>
  <circle cx="210" cy="290" r="6" fill="#fbbc05"/>
  <circle cx="170" cy="300" r="6" fill="#fbbc05"/>
  <circle cx="190" cy="270" r="6" fill="#fbbc05"/>
  
  <!-- Centroids -->
  <circle cx="150" cy="150" r="10" fill="#4285f4" stroke="black" stroke-width="2"/>
  <circle cx="450" cy="150" r="10" fill="#ea4335" stroke="black" stroke-width="2"/>
  <circle cx="180" cy="280" r="10" fill="#fbbc05" stroke="black" stroke-width="2"/>
  
  <!-- Cluster boundaries (simplified) -->
  <path d="M300,100 L300,350" stroke="#cccccc" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M300,350 C250,350 250,200 300,200" stroke="#cccccc" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M300,100 C250,100 250,200 300,200" stroke="#cccccc" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Distance lines -->
  <line x1="180" y1="160" x2="150" y2="150" stroke="#4285f4" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="480" y1="160" x2="450" y2="150" stroke="#ea4335" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="210" y1="290" x2="180" y2="280" stroke="#fbbc05" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Labels -->
  <text x="150" y="130" font-family="Arial" font-size="14" text-anchor="middle">Centroid 1</text>
  <text x="450" y="130" font-family="Arial" font-size="14" text-anchor="middle">Centroid 2</text>
  <text x="180" y="260" font-family="Arial" font-size="14" text-anchor="middle">Centroid 3</text>
  
  <!-- Code example -->
  <rect x="40" y="320" width="520" height="60" fill="#e8eaed" rx="5"/>
  <text x="50" y="340" font-family="Consolas, monospace" font-size="12">
    <tspan x="50" dy="0">// C++ code for assigning points to nearest centroid</tspan>
    <tspan x="50" dy="16">vector&lt;int&gt; assignPointsToClusters(const vector&lt;Point&gt;&amp; data, </tspan>
    <tspan x="50" dy="16">                              const vector&lt;Point&gt;&amp; centroids) {</tspan>
    <tspan x="50" dy="16">    return findNearestCentroid(data, centroids); // Returns cluster indices</tspan>
  </text>
  
  <!-- Explanation -->
  <text x="300" y="80" font-family="Arial" font-size="14" text-anchor="middle">
    <tspan x="300" dy="0">Step 2: Assign each data point to the nearest centroid</tspan>
    <tspan x="300" dy="20">based on Euclidean distance</tspan>
  </text>
</svg>
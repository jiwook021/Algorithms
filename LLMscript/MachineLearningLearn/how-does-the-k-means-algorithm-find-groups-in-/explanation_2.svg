<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">K-Means Algorithm: Assignment and Update Steps</text>
  
  <!-- Left side: Assignment Step -->
  <g transform="translate(0, 0)">
    <text x="150" y="60" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Step 2: Assignment</text>
    
    <!-- Data points with assignment lines -->
    <circle cx="100" cy="120" r="5" fill="#3498db"/>
    <line x1="100" y1="120" x2="150" y2="150" stroke="#3498db" stroke-width="1" stroke-dasharray="3,3"/>
    
    <circle cx="120" cy="100" r="5" fill="#3498db"/>
    <line x1="120" y1="100" x2="150" y2="150" stroke="#3498db" stroke-width="1" stroke-dasharray="3,3"/>
    
    <circle cx="90" cy="140" r="5" fill="#3498db"/>
    <line x1="90" y1="140" x2="150" y2="150" stroke="#3498db" stroke-width="1" stroke-dasharray="3,3"/>
    
    <circle cx="200" cy="120" r="5" fill="#e74c3c"/>
    <line x1="200" y1="120" x2="250" y2="150" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,3"/>
    
    <circle cx="220" cy="100" r="5" fill="#e74c3c"/>
    <line x1="220" y1="100" x2="250" y2="150" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,3"/>
    
    <circle cx="240" cy="140" r="5" fill="#e74c3c"/>
    <line x1="240" y1="140" x2="250" y2="150" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Centroids -->
    <circle cx="150" cy="150" r="8" fill="yellow" stroke="black" stroke-width="2"/>
    <text x="150" y="175" font-family="Arial" font-size="12" text-anchor="middle">Centroid 1</text>
    
    <circle cx="250" cy="150" r="8" fill="yellow" stroke="black" stroke-width="2"/>
    <text x="250" y="175" font-family="Arial" font-size="12" text-anchor="middle">Centroid 2</text>
    
    <!-- Description -->
    <rect x="70" y="190" width="230" height="60" fill="white" stroke="#333" stroke-width="1" rx="5"/>
    <text x="185" y="210" font-family="Arial" font-size="12" text-anchor="middle">
      <tspan x="185" dy="0">Assign each data point to the</tspan>
      <tspan x="185" dy="16">nearest centroid based on</tspan>
      <tspan x="185" dy="16">Euclidean distance</tspan>
    </text>
  </g>
  
  <!-- Right side: Update Step -->
  <g transform="translate(300, 0)">
    <text x="150" y="60" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Step 3: Update</text>
    
    <!-- Data points -->
    <circle cx="100" cy="120" r="5" fill="#3498db"/>
    <circle cx="120" cy="100" r="5" fill="#3498db"/>
    <circle cx="90" cy="140" r="5" fill="#3498db"/>
    
    <circle cx="200" cy="120" r="5" fill="#e74c3c"/>
    <circle cx="220" cy="100" r="5" fill="#e74c3c"/>
    <circle cx="240" cy="140" r="5" fill="#e74c3c"/>
    
    <!-- Old centroids (faded) -->
    <circle cx="150" cy="150" r="8" fill="#ffffaa" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="150" y="170" font-family="Arial" font-size="10" text-anchor="middle" fill="#888888">Old Centroid 1</text>
    
    <circle cx="250" cy="150" r="8" fill="#ffffaa" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="250" y="170" font-family="Arial" font-size="10" text-anchor="middle" fill="#888888">Old Centroid 2</text>
    
    <!-- New centroids -->
    <circle cx="103" cy="120" r="8" fill="yellow" stroke="black" stroke-width="2"/>
    <text x="103" y="100" font-family="Arial" font-size="12" text-anchor="middle">New Centroid 1</text>
    
    <circle cx="220" cy="120" r="8" fill="yellow" stroke="black" stroke-width="2"/>
    <text x="220" y="100" font-family="Arial" font-size="12" text-anchor="middle">New Centroid 2</text>
    
    <!-- Movement arrows -->
    <line x1="150" y1="150" x2="103" y2="120" stroke="black" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="250" y1="150" x2="220" y2="120" stroke="black" stroke-width="1" marker-end="url(#arrowhead)"/>
    
    <!-- Description -->
    <rect x="70" y="190" width="230" height="60" fill="white" stroke="#333" stroke-width="1" rx="5"/>
    <text x="185" y="210" font-family="Arial" font-size="12" text-anchor="middle">
      <tspan x="185" dy="0">Recalculate each centroid as the</tspan>
      <tspan x="185" dy="16">mean of all points assigned to it</tspan>
      <tspan x="185" dy="16">(centroids move to new positions)</tspan>
    </text>
  </g>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
  
  <!-- Bottom section: Code and Iteration -->
  <rect x="100" y="280" width="400" height="100" fill="white" stroke="#333" stroke-width="1" rx="5"/>
  
  <!-- Code snippet -->
  <text x="120" y="300" font-family="Consolas, monospace" font-size="12">
    <tspan x="120" dy="0">// C++ implementation of assignment and update steps</tspan>
    <tspan x="120" dy="16">do {</tspan>
    <tspan x="120" dy="16">  // Assignment step</tspan>
    <tspan x="120" dy="16">  assignPointsToClusters(data, centroids, clusters);</tspan>
    <tspan x="120" dy="16">  // Update step</tspan>
    <tspan x="120" dy="16">  double change = updateCentroids(clusters, centroids);</tspan>
    <tspan x="120" dy="16">} while (change > threshold);</tspan>
  </text>
  
  <!-- Iteration note -->
  <text x="300" y="390" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">
    Repeat steps 2 and 3 until convergence (centroids no longer move significantly)
  </text>
</svg>
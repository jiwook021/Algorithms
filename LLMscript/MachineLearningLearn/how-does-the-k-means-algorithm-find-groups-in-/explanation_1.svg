<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">K-Means Algorithm: Initial Centroid Placement</text>
  
  <!-- Data points -->
  <circle cx="120" cy="150" r="6" fill="#3498db"/>
  <circle cx="150" cy="130" r="6" fill="#3498db"/>
  <circle cx="180" cy="160" r="6" fill="#3498db"/>
  <circle cx="130" cy="180" r="6" fill="#3498db"/>
  <circle cx="160" cy="170" r="6" fill="#3498db"/>
  
  <circle cx="450" cy="150" r="6" fill="#e74c3c"/>
  <circle cx="480" cy="130" r="6" fill="#e74c3c"/>
  <circle cx="420" cy="160" r="6" fill="#e74c3c"/>
  <circle cx="460" cy="180" r="6" fill="#e74c3c"/>
  <circle cx="440" cy="140" r="6" fill="#e74c3c"/>
  
  <circle cx="150" cy="280" r="6" fill="#2ecc71"/>
  <circle cx="180" cy="300" r="6" fill="#2ecc71"/>
  <circle cx="210" cy="270" r="6" fill="#2ecc71"/>
  <circle cx="170" cy="310" r="6" fill="#2ecc71"/>
  <circle cx="200" cy="290" r="6" fill="#2ecc71"/>
  
  <circle cx="450" cy="280" r="6" fill="#9b59b6"/>
  <circle cx="420" cy="300" r="6" fill="#9b59b6"/>
  <circle cx="470" cy="270" r="6" fill="#9b59b6"/>
  <circle cx="430" cy="310" r="6" fill="#9b59b6"/>
  <circle cx="460" cy="290" r="6" fill="#9b59b6"/>
  
  <!-- Initial centroids -->
  <circle cx="200" cy="200" r="10" fill="yellow" stroke="black" stroke-width="2"/>
  <circle cx="400" cy="200" r="10" fill="yellow" stroke="black" stroke-width="2"/>
  
  <!-- Labels -->
  <text x="200" y="230" font-family="Arial" font-size="14" text-anchor="middle">Centroid 1</text>
  <text x="400" y="230" font-family="Arial" font-size="14" text-anchor="middle">Centroid 2</text>
  <text x="150" cy="100" font-family="Arial" font-size="14" text-anchor="middle">Data Points</text>
  
  <!-- Step description -->
  <rect x="50" y="330" width="500" height="60" fill="white" stroke="#333" stroke-width="1" rx="5"/>
  <text x="300" y="350" font-family="Arial" font-size="14" text-anchor="middle">
    Step 1: Initialize K centroids randomly or using a specific method
  </text>
  <text x="300" y="375" font-family="Arial" font-size="14" text-anchor="middle">
    (K=2 in this example)
  </text>
  
  <!-- Code snippet -->
  <rect x="30" y="40" width="250" height="70" fill="white" stroke="#333" stroke-width="1" rx="5"/>
  <text x="40" y="60" font-family="Consolas, monospace" font-size="12">
    <tspan x="40" dy="0">// C++ initialization example</tspan>
    <tspan x="40" dy="16">vector&lt;Point&gt; centroids;</tspan>
    <tspan x="40" dy="16">initializeCentroids(data, K, centroids);</tspan>
  </text>
</svg>
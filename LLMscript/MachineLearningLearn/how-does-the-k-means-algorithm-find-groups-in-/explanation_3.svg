<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">K-Means: Initial Centroid Placement</text>
  
  <!-- Data points -->
  <circle cx="120" cy="150" r="6" fill="#4285f4"/>
  <circle cx="150" cy="130" r="6" fill="#4285f4"/>
  <circle cx="180" cy="160" r="6" fill="#4285f4"/>
  <circle cx="140" cy="170" r="6" fill="#4285f4"/>
  <circle cx="160" cy="140" r="6" fill="#4285f4"/>
  
  <circle cx="420" cy="150" r="6" fill="#ea4335"/>
  <circle cx="450" cy="130" r="6" fill="#ea4335"/>
  <circle cx="480" cy="160" r="6" fill="#ea4335"/>
  <circle cx="440" cy="170" r="6" fill="#ea4335"/>
  <circle cx="460" cy="140" r="6" fill="#ea4335"/>
  
  <circle cx="150" cy="280" r="6" fill="#fbbc05"/>
  <circle cx="180" cy="260" r="6" fill="#fbbc05"/>
  <circle cx="210" cy="290" r="6" fill="#fbbc05"/>
  <circle cx="170" cy="300" r="6" fill="#fbbc05"/>
  <circle cx="190" cy="270" r="6" fill="#fbbc05"/>
  
  <!-- Centroids -->
  <circle cx="250" cy="200" r="10" fill="#34a853" stroke="black" stroke-width="2"/>
  <circle cx="350" cy="200" r="10" fill="#34a853" stroke="black" stroke-width="2"/>
  <circle cx="300" cy="300" r="10" fill="#34a853" stroke="black" stroke-width="2"/>
  
  <!-- Labels -->
  <text x="250" y="180" font-family="Arial" font-size="14" text-anchor="middle">Centroid 1</text>
  <text x="350" y="180" font-family="Arial" font-size="14" text-anchor="middle">Centroid 2</text>
  <text x="300" y="280" font-family="Arial" font-size="14" text-anchor="middle">Centroid 3</text>
  
  <!-- Code example -->
  <rect x="40" y="320" width="520" height="60" fill="#e8eaed" rx="5"/>
  <text x="50" y="340" font-family="Consolas, monospace" font-size="12">
    <tspan x="50" dy="0">// C++ code for initializing k random centroids</tspan>
    <tspan x="50" dy="16">vector&lt;Point&gt; initializeCentroids(const vector&lt;Point&gt;&amp; data, int k) {</tspan>
    <tspan x="50" dy="16">    return randomSample(data, k); // Randomly select k points as initial centroids</tspan>
    <tspan x="50" dy="16">}</tspan>
  </text>
  
  <!-- Explanation -->
  <text x="300" y="80" font-family="Arial" font-size="14" text-anchor="middle">
    <tspan x="300" dy="0">Step 1: Initialize k centroids randomly from the dataset</tspan>
    <tspan x="300" dy="20">(k=3 in this example)</tspan>
  </text>
</svg>
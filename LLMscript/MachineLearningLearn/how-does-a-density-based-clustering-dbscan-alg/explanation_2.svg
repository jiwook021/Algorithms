<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">DBSCAN: Cluster Formation Process</text>
  
  <!-- Step 1: Initial Data -->
  <text x="150" y="70" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Step 1: Unprocessed Data</text>
  <circle cx="100" cy="100" r="5" fill="#aaa"/>
  <circle cx="120" cy="110" r="5" fill="#aaa"/>
  <circle cx="90" cy="120" r="5" fill="#aaa"/>
  <circle cx="110" cy="130" r="5" fill="#aaa"/>
  <circle cx="130" cy="100" r="5" fill="#aaa"/>
  <circle cx="150" cy="120" r="5" fill="#aaa"/>
  <circle cx="200" cy="100" r="5" fill="#aaa"/>
  <circle cx="180" cy="130" r="5" fill="#aaa"/>
  <circle cx="210" cy="120" r="5" fill="#aaa"/>
  <circle cx="170" cy="90" r="5" fill="#aaa"/>
  
  <!-- Step 2: Select First Point -->
  <text x="150" y="170" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Step 2: Select First Point</text>
  <circle cx="100" cy="200" r="5" fill="#e74c3c"/>
  <circle cx="120" cy="210" r="5" fill="#aaa"/>
  <circle cx="90" cy="220" r="5" fill="#aaa"/>
  <circle cx="110" cy="230" r="5" fill="#aaa"/>
  <circle cx="130" cy="200" r="5" fill="#aaa"/>
  <circle cx="150" cy="220" r="5" fill="#aaa"/>
  <circle cx="200" cy="200" r="5" fill="#aaa"/>
  <circle cx="180" cy="230" r="5" fill="#aaa"/>
  <circle cx="210" cy="220" r="5" fill="#aaa"/>
  <circle cx="170" cy="190" r="5" fill="#aaa"/>
  <circle cx="100" cy="200" r="20" fill="none" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="100" cy="200" font-family="Arial" font-size="10" text-anchor="middle" dy="-25" fill="#e74c3c">Current point</text>
  
  <!-- Step 3: Find Neighbors -->
  <text x="450" y="70" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Step 3: Find Neighbors</text>
  <circle cx="400" cy="100" r="5" fill="#e74c3c"/>
  <circle cx="420" cy="110" r="5" fill="#3498db"/>
  <circle cx="390" cy="120" r="5" fill="#3498db"/>
  <circle cx="410" cy="130" r="5" fill="#3498db"/>
  <circle cx="430" cy="100" r="5" fill="#aaa"/>
  <circle cx="450" cy="120" r="5" fill="#aaa"/>
  <circle cx="500" cy="100" r="5" fill="#aaa"/>
  <circle cx="480" cy="130" r="5" fill="#aaa"/>
  <circle cx="510" cy="120" r="5" fill="#aaa"/>
  <circle cx="470" cy="90" r="5" fill="#aaa"/>
  <circle cx="400" cy="100" r="20" fill="none" stroke="#e74c3c" stroke-width="1"/>
  <text x="400" cy="100" font-family="Arial" font-size="10" text-anchor="middle" dy="-25" fill="#e74c3c">Current point</text>
  <text x="420" y="110" font-family="Arial" font-size="10" text-anchor="middle" dy="20" fill="#3498db">Neighbors</text>
  
  <!-- Step 4: Expand Cluster -->
  <text x="450" y="170" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Step 4: Expand Cluster</text>
  <circle cx="400" cy="200" r="5" fill="#3498db"/>
  <circle cx="420" cy="210" r="5" fill="#3498db"/>
  <circle cx="390" cy="220" r="5" fill="#3498db"/>
  <circle cx="410" cy="230" r="5" fill="#3498db"/>
  <circle cx="430" cy="200" r="5" fill="#e74c3c"/>
  <circle cx="450" cy="220" r="5" fill="#aaa"/>
  <circle cx="500" cy="200" r="5" fill="#aaa"/>
  <circle cx="480" cy="230" r="5" fill="#aaa"/>
  <circle cx="510" cy="220" r="5" fill="#aaa"/>
  <circle cx="470" cy="190" r="5" fill="#aaa"/>
  <circle cx="430" cy="200" r="20" fill="none" stroke="#e74c3c" stroke-width="1"/>
  <text x="430" cy="200" font-family="Arial" font-size="10" text-anchor="middle" dy="-25" fill="#e74c3c">Current point</text>
  <path d="M 400,200 L 420,210 L 390,220 L 410,230 L 400,200" fill="none" stroke="#3498db" stroke-width="1"/>
  
  <!-- Step 5: Final Clusters -->
  <text x="300" y="280" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Step 5: Final Clusters</text>
  
  <!-- Cluster 1 -->
  <circle cx="200" cy="320" r="5" fill="#3498db"/>
  <circle cx="210" cy="330" r="5" fill="#3498db"/>
  <circle cx="190" cy="340" r="5" fill="#3498db"/>
  <circle cx="205" cy="310" r="5" fill="#3498db"/>
  <circle cx="220" cy="325" r="5" fill="#3498db"/>
  <path d="M 200,320 L 210,330 L 190,340 L 205,310 L 220,325 L 200,320" fill="none" stroke="#3498db" stroke-width="1"/>
  <text x="200" y="350" font-family="Arial" font-size="12" text-anchor="middle" dy="15">Cluster 1</text>
  
  <!-- Cluster 2 -->
  <circle cx="400" cy="320" r="5" fill="#9b59b6"/>
  <circle cx="410" cy="330" r="5" fill="#9b59b6"/>
  <circle cx="390" cy="340" r="5" fill="#9b59b6"/>
  <circle cx="405" cy="310" r="5" fill="#9b59b6"/>
  <circle cx="420" cy="325" r="5" fill="#9b59b6"/>
  <path d="M 400,320 L 410,330 L 390,340 L 405,310 L 420,325 L 400,320" fill="none" stroke="#9b59b6" stroke-width="1"/>
  <text x="400" y="350" font-family="Arial" font-size="12" text-anchor="middle" dy="15">Cluster 2</text>
  
  <!-- Noise -->
  <circle cx="300" cy="320" r="5" fill="#e74c3c"/>
  <text x="300" y="320" font-family="Arial" font-size="12" text-anchor="middle" dy="15">Noise</text>
  
  <!-- Code Example -->
  <rect x="30" y="280" width="140" height="110" fill="white" stroke="#ccc" rx="5"/>
  <text x="35" y="295" font-family="Courier New" font-size="10">
    <tspan x="35" y="295">// C++ DBSCAN core</tspan>
    <tspan x="35" y="310">void expandCluster(</tspan>
    <tspan x="35" y="325">  Point p,</tspan>
    <tspan x="35" y="340">  vector&lt;Point&gt; neighbors,</tspan>
    <tspan x="35" y="355">  int clusterId,</tspan>
    <tspan x="35" y="370">  double eps,</tspan>
    <tspan x="35" y="385">  int minPts)</tspan>
  </text>
</svg>
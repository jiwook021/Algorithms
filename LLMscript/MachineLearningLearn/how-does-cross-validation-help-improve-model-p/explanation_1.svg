<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">K-Fold Cross-Validation Process</text>
  
  <!-- Dataset representation -->
  <rect x="50" y="80" width="500" height="60" fill="#b3d9ff" stroke="#0066cc" stroke-width="2"/>
  <text x="300" y="115" font-family="Arial" font-size="16" text-anchor="middle">Complete Dataset</text>
  
  <!-- K-fold divisions -->
  <rect x="50" y="160" width="100" height="40" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
  <rect x="150" y="160" width="100" height="40" fill="#99ff99" stroke="#00cc00" stroke-width="2"/>
  <rect x="250" y="160" width="100" height="40" fill="#9999ff" stroke="#0000cc" stroke-width="2"/>
  <rect x="350" y="160" width="100" height="40" fill="#ffff99" stroke="#cccc00" stroke-width="2"/>
  <rect x="450" y="160" width="100" height="40" fill="#ff99ff" stroke="#cc00cc" stroke-width="2"/>
  
  <text x="100" y="180" font-family="Arial" font-size="12" text-anchor="middle">Fold 1</text>
  <text x="200" y="180" font-family="Arial" font-size="12" text-anchor="middle">Fold 2</text>
  <text x="300" y="180" font-family="Arial" font-size="12" text-anchor="middle">Fold 3</text>
  <text x="400" y="180" font-family="Arial" font-size="12" text-anchor="middle">Fold 4</text>
  <text x="500" y="180" font-family="Arial" font-size="12" text-anchor="middle">Fold 5</text>
  
  <!-- Iterations -->
  <!-- Iteration 1 -->
  <rect x="50" y="220" width="100" height="30" fill="#ff9999" stroke="#cc0000" stroke-width="2"/>
  <rect x="150" y="220" width="400" height="30" fill="#dddddd" stroke="#555555" stroke-width="2"/>
  <text x="30" y="235" font-family="Arial" font-size="12" text-anchor="end">Iteration 1</text>
  <text x="100" y="235" font-family="Arial" font-size="10" text-anchor="middle">Test</text>
  <text x="350" y="235" font-family="Arial" font-size="10" text-anchor="middle">Training Data</text>
  
  <!-- Iteration 2 -->
  <rect x="50" y="255" width="100" height="30" fill="#dddddd" stroke="#555555" stroke-width="2"/>
  <rect x="150" y="255" width="100" height="30" fill="#99ff99" stroke="#00cc00" stroke-width="2"/>
  <rect x="250" y="255" width="300" height="30" fill="#dddddd" stroke="#555555" stroke-width="2"/>
  <text x="30" y="270" font-family="Arial" font-size="12" text-anchor="end">Iteration 2</text>
  <text x="200" y="270" font-family="Arial" font-size="10" text-anchor="middle">Test</text>
  <text x="350" y="270" font-family="Arial" font-size="10" text-anchor="middle">Training Data</text>
  
  <!-- Iteration 3 -->
  <rect x="50" y="290" width="200" height="30" fill="#dddddd" stroke="#555555" stroke-width="2"/>
  <rect x="250" y="290" width="100" height="30" fill="#9999ff" stroke="#0000cc" stroke-width="2"/>
  <rect x="350" y="290" width="200" height="30" fill="#dddddd" stroke="#555555" stroke-width="2"/>
  <text x="30" y="305" font-family="Arial" font-size="12" text-anchor="end">Iteration 3</text>
  <text x="300" y="305" font-family="Arial" font-size="10" text-anchor="middle">Test</text>
  <text x="200" y="305" font-family="Arial" font-size="10" text-anchor="middle">Training Data</text>
  
  <!-- Final aggregation -->
  <path d="M 300 330 L 300 350 L 200 370 L 300 390 L 400 370 L 300 350" fill="#ffd699" stroke="#996600" stroke-width="2"/>
  <text x="300" y="380" font-family="Arial" font-size="14" text-anchor="middle">Aggregate Results</text>
  
  <!-- Explanation -->
  <text x="580" y="120" font-family="Arial" font-size="12" text-anchor="end" font-style="italic">1. Split data into k folds</text>
  <text x="580" y="230" font-family="Arial" font-size="12" text-anchor="end" font-style="italic">2. Train model k times, each time</text>
  <text x="580" y="245" font-family="Arial" font-size="12" text-anchor="end" font-style="italic">   using a different fold as test set</text>
  <text x="580" y="380" font-family="Arial" font-size="12" text-anchor="end" font-style="italic">3. Average performance metrics</text>
  <text x="580" y="395" font-family="Arial" font-size="12" text-anchor="end" font-style="italic">   for final evaluation</text>
</svg>
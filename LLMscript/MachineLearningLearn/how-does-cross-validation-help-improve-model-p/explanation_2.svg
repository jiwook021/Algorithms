<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Cross-Validation Prevents Overfitting</text>
  
  <!-- Model complexity axis -->
  <line x1="100" y1="300" x2="500" y2="300" stroke="#333" stroke-width="2"/>
  <text x="300" y="330" font-family="Arial" font-size="14" text-anchor="middle">Model Complexity</text>
  <text x="100" y="330" font-family="Arial" font-size="12" text-anchor="middle">Simple</text>
  <text x="500" y="330" font-family="Arial" font-size="12" text-anchor="middle">Complex</text>
  
  <!-- Error axis -->
  <line x1="100" y1="300" x2="100" y2="100" stroke="#333" stroke-width="2"/>
  <text x="60" y="200" font-family="Arial" font-size="14" text-anchor="middle" transform="rotate(-90,60,200)">Error Rate</text>
  <text x="85" y="100" font-family="Arial" font-size="12" text-anchor="end">High</text>
  <text x="85" y="300" font-family="Arial" font-size="12" text-anchor="end">Low</text>
  
  <!-- Training error curve -->
  <path d="M 100 250 Q 150 200 200 170 T 300 130 T 400 100 T 500 80" fill="none" stroke="#3366cc" stroke-width="3"/>
  <text x="450" y="70" font-family="Arial" font-size="12" fill="#3366cc" font-weight="bold">Training Error</text>
  
  <!-- Test error curve -->
  <path d="M 100 280 Q 150 230 200 200 T 300 180 T 400 200 T 500 250" fill="none" stroke="#cc3366" stroke-width="3"/>
  <text x="450" y="260" font-family="Arial" font-size="12" fill="#cc3366" font-weight="bold">Test Error</text>
  
  <!-- Cross-validation error curve -->
  <path d="M 100 270 Q 150 220 200 190 T 300 175 T 400 190 T 500 240" fill="none" stroke="#33cc66" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="450" y="230" font-family="Arial" font-size="12" fill="#33cc66" font-weight="bold">Cross-Validation Error</text>
  
  <!-- Optimal point -->
  <circle cx="300" cy="175" r="8" fill="#ffcc00" stroke="#996600" stroke-width="2"/>
  <line x1="300" y1="175" x2="300" y2="300" stroke="#996600" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="300" y="350" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Optimal Complexity</text>
  
  <!-- Underfitting and Overfitting regions -->
  <rect x="100" y="80" width="150" height="220" fill="rgba(255,0,0,0.1)" stroke="none"/>
  <text x="175" y="90" font-family="Arial" font-size="14" text-anchor="middle" fill="#cc0000">Underfitting</text>
  
  <rect x="350" y="80" width="150" height="220" fill="rgba(0,0,255,0.1)" stroke="none"/>
  <text x="425" y="90" font-family="Arial" font-size="14" text-anchor="middle" fill="#0000cc">Overfitting</text>
  
  <!-- Code example -->
  <rect x="100" y="360" width="400" height="30" fill="#eeeeee" stroke="#333333" stroke-width="1"/>
  <text x="110" y="380" font-family="Courier New" font-size="12" fill="#333333">
    <tspan>// C++ cross-validation helps find optimal hyperparameters</tspan>
  </text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f9f9f9" />
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Train-Test Split: Basic Concept</text>
  
  <!-- Dataset representation -->
  <rect x="100" y="80" width="400" height="80" fill="#6baed6" rx="5" ry="5" />
  <text x="300" y="125" font-family="Arial" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Complete Dataset</text>
  
  <!-- Split arrow -->
  <path d="M300,160 L300,200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Train and test sets -->
  <rect x="100" y="200" width="280" height="80" fill="#3182bd" rx="5" ry="5" />
  <text x="240" y="245" font-family="Arial" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Training Set (70-80%)</text>
  
  <rect x="400" y="200" width="100" height="80" fill="#e6550d" rx="5" ry="5" />
  <text x="450" y="245" font-family="Arial" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Test Set</text>
  <text x="450" y="265" font-family="Arial" font-size="14" fill="white" text-anchor="middle">(20-30%)</text>
  
  <!-- Arrows to model and evaluation -->
  <path d="M240,280 L240,320" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M450,280 L450,320" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Model training and testing -->
  <rect x="160" y="320" width="160" height="50" fill="#31a354" rx="5" ry="5" />
  <text x="240" y="350" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Train Model</text>
  
  <rect x="370" y="320" width="160" height="50" fill="#756bb1" rx="5" ry="5" />
  <text x="450" y="350" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Evaluate Performance</text>
  
  <!-- Code example -->
  <rect x="20" y="280" width="180" height="100" fill="#f0f0f0" rx="5" ry="5" stroke="#ccc" />
  <text x="30" y="300" font-family="Courier New" font-size="10" fill="#333">
    <tspan x="30" dy="0">// C++ example with sklearn-like API</tspan>
    <tspan x="30" dy="14">double train_ratio = 0.8;</tspan>
    <tspan x="30" dy="14">int split_idx = data.size() * train_ratio;</tspan>
    <tspan x="30" dy="14">auto train = data.slice(0, split_idx);</tspan>
    <tspan x="30" dy="14">auto test = data.slice(split_idx);</tspan>
  </text>
  
  <!-- Explanatory notes -->
  <text x="300" y="390" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">
    Train-test split divides data into separate sets to build and evaluate models without bias
  </text>
</svg>
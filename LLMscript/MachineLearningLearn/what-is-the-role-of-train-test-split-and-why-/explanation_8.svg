<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f5f5f5" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold" fill="#333">Train-Test Split: Basic Concept</text>
  
  <!-- Dataset -->
  <rect x="100" y="80" width="400" height="80" fill="#64b5f6" rx="5" ry="5" stroke="#2286c3" stroke-width="2"/>
  <text x="300" y="125" font-family="Arial" font-size="18" text-anchor="middle" fill="white" font-weight="bold">Complete Dataset</text>
  
  <!-- Arrow down -->
  <path d="M300,170 L300,200" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Train and Test sets -->
  <rect x="100" y="210" width="280" height="80" fill="#81c784" rx="5" ry="5" stroke="#519657" stroke-width="2"/>
  <text x="240" y="255" font-family="Arial" font-size="18" text-anchor="middle" fill="white" font-weight="bold">Training Set (70-80%)</text>
  
  <rect x="400" y="210" width="100" height="80" fill="#e57373" rx="5" ry="5" stroke="#af4448" stroke-width="2"/>
  <text x="450" y="255" font-family="Arial" font-size="18" text-anchor="middle" fill="white" font-weight="bold">Test Set (20-30%)</text>
  
  <!-- Model flow -->
  <path d="M240,300 L240,330" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <rect x="180" y="340" width="120" height="40" fill="#9575cd" rx="5" ry="5" stroke="#65499c" stroke-width="2"/>
  <text x="240" y="365" font-family="Arial" font-size="16" text-anchor="middle" fill="white" font-weight="bold">Train Model</text>
  
  <!-- Evaluation flow -->
  <path d="M450,300 L450,330" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <rect x="390" y="340" width="120" height="40" fill="#ffb74d" rx="5" ry="5" stroke="#c88719" stroke-width="2"/>
  <text x="450" y="365" font-family="Arial" font-size="16" text-anchor="middle" fill="white" font-weight="bold">Evaluate Model</text>
  
  <!-- Code example -->
  <rect x="20" y="280" width="160" height="100" fill="#f0f0f0" rx="5" ry="5" stroke="#ccc" stroke-width="1"/>
  <text x="25" y="295" font-family="Courier New" font-size="10" fill="#333">
    <tspan x="25" dy="0">// C++ pseudo-code</tspan>
    <tspan x="25" dy="14">vector&lt;Data&gt; dataset;</tspan>
    <tspan x="25" dy="14">// Split 80/20</tspan>
    <tspan x="25" dy="14">auto train = dataset.first(</tspan>
    <tspan x="25" dy="14">  dataset.size() * 0.8);</tspan>
    <tspan x="25" dy="14">auto test = dataset.last(</tspan>
    <tspan x="25" dy="14">  dataset.size() * 0.2);</tspan>
  </text>
  
  <!-- Explanation text -->
  <rect x="310" y="110" width="280" height="80" fill="white" rx="5" ry="5" opacity="0.8"/>
  <text x="320" y="130" font-family="Arial" font-size="12" fill="#333">
    <tspan x="320" dy="0">Train-test split divides your dataset into</tspan>
    <tspan x="320" dy="16">two parts: one for training your model and</tspan>
    <tspan x="320" dy="16">another for evaluating its performance on</tspan>
    <tspan x="320" dy="16">unseen data.</tspan>
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa" rx="10" ry="10" />
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Train-Test Split: Basic Concept</text>
  
  <!-- Dataset representation -->
  <rect x="100" y="80" width="400" height="80" fill="#6c757d" rx="5" ry="5" />
  <text x="300" y="125" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Complete Dataset</text>
  
  <!-- Split arrow -->
  <path d="M300,160 L300,200" stroke="#333" stroke-width="3" stroke-dasharray="5,5" />
  <polygon points="290,200 300,220 310,200" fill="#333" />
  
  <!-- Train and test sets -->
  <rect x="100" y="220" width="240" height="80" fill="#007bff" rx="5" ry="5" />
  <text x="220" y="265" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Training Set (70-80%)</text>
  
  <rect x="360" y="220" width="140" height="80" fill="#dc3545" rx="5" ry="5" />
  <text x="430" y="265" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Test Set (20-30%)</text>
  
  <!-- Explanation -->
  <rect x="100" y="320" width="400" height="60" fill="#e9ecef" rx="5" ry="5" stroke="#adb5bd" stroke-width="1" />
  <text x="300" y="345" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">
    <tspan x="300" dy="0">Train-test split divides your dataset into two parts:</tspan>
    <tspan x="300" dy="20">one for training your model and one for evaluating its performance.</tspan>
  </text>
  
  <!-- Code example -->
  <rect x="450" y="100" width="140" height="60" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1" rx="5" ry="5" />
  <text x="455" y="120" font-family="Courier New" font-size="10" fill="#333">
    <tspan x="455" dy="0">// C++ with scikit API</tspan>
    <tspan x="455" dy="15">train_test_split(</tspan>
    <tspan x="455" dy="15">  data, labels,</tspan>
    <tspan x="455" dy="15">  test_size=0.2);</tspan>
  </text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa" rx="10" ry="10" />
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Preventing Overfitting with Train-Test Split</text>
  
  <!-- Model performance graphs -->
  <!-- Coordinate system -->
  <line x1="100" y1="300" x2="500" y2="300" stroke="#333" stroke-width="2" />
  <line x1="100" y1="300" x2="100" y2="100" stroke="#333" stroke-width="2" />
  
  <!-- Axis labels -->
  <text x="300" y="330" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Model Complexity</text>
  <text x="70" y="200" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" transform="rotate(-90,70,200)">Error</text>
  
  <!-- Training error curve -->
  <path d="M100,280 Q150,200 200,150 T300,120 T400,110 T500,105" stroke="#007bff" stroke-width="3" fill="none" />
  <text x="150" y="170" font-family="Arial" font-size="12" fill="#007bff" font-weight="bold">Training Error</text>
  
  <!-- Test error curve -->
  <path d="M100,280 Q150,220 200,180 T300,170 T400,210 T500,280" stroke="#dc3545" stroke-width="3" fill="none" />
  <text x="400" y="230" font-family="Arial" font-size="12" fill="#dc3545" font-weight="bold">Test Error</text>
  
  <!-- Optimal point -->
  <circle cx="300" cy="170" r="8" fill="#28a745" />
  <text x="300" y="155" font-family="Arial" font-size="12" fill="#28a745" font-weight="bold">Optimal Model</text>
  
  <!-- Overfitting region -->
  <rect x="350" y="100" width="150" height="200" fill="rgba(255,0,0,0.1)" />
  <text x="425" y="115" font-family="Arial" font-size="14" fill="#dc3545" font-weight="bold">Overfitting Region</text>
  
  <!-- Explanation -->
  <rect x="100" y="340" width="400" height="50" fill="#e9ecef" rx="5" ry="5" stroke="#adb5bd" stroke-width="1" />
  <text x="300" y="360" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">
    <tspan x="300" dy="0">Train-test split helps detect overfitting: when a model performs well</tspan>
    <tspan x="300" dy="20">on training data but poorly on unseen test data.</tspan>
  </text>
  
  <!-- Code example -->
  <rect x="100" y="80" width="180" height="70" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1" rx="5" ry="5" />
  <text x="110" y="100" font-family="Courier New" font-size="10" fill="#333">
    <tspan x="110" dy="0">// C++ example</tspan>
    <tspan x="110" dy="15">double train_error = </tspan>
    <tspan x="110" dy="15">  model.evaluate(X_train);</tspan>
    <tspan x="110" dy="15">double test_error = </tspan>
    <tspan x="110" dy="15">  model.evaluate(X_test);</tspan>
  </text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f5f5f5" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Train-Test Split: Basic Concept</text>
  
  <!-- Dataset representation -->
  <rect x="100" y="80" width="400" height="80" fill="#64b5f6" rx="5" ry="5" stroke="#2196f3" stroke-width="2"/>
  <text x="300" y="125" font-family="Arial" font-size="18" text-anchor="middle" fill="white">Complete Dataset</text>
  
  <!-- Arrow down -->
  <path d="M300,170 L300,200" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Split datasets -->
  <rect x="100" y="210" width="240" height="70" fill="#81c784" rx="5" ry="5" stroke="#4caf50" stroke-width="2"/>
  <text x="220" y="250" font-family="Arial" font-size="16" text-anchor="middle" fill="white">Training Set (70-80%)</text>
  
  <rect x="360" y="210" width="140" height="70" fill="#e57373" rx="5" ry="5" stroke="#f44336" stroke-width="2"/>
  <text x="430" y="250" font-family="Arial" font-size="16" text-anchor="middle" fill="white">Test Set (20-30%)</text>
  
  <!-- Arrows down -->
  <path d="M220,290 L220,320" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M430,290 L430,320" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Model training and evaluation -->
  <rect x="120" y="330" width="200" height="50" fill="#9575cd" rx="5" ry="5" stroke="#673ab7" stroke-width="2"/>
  <text x="220" y="360" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Build and Train Model</text>
  
  <rect x="360" y="330" width="140" height="50" fill="#ffb74d" rx="5" ry="5" stroke="#ff9800" stroke-width="2"/>
  <text x="430" y="360" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Evaluate Model</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Annotations -->
  <text x="50" y="125" font-family="Arial" font-size="12" text-anchor="end" fill="#333">Original data</text>
  <text x="50" y="245" font-family="Arial" font-size="12" text-anchor="end" fill="#333">Used to fit model</text>
  <text x="550" y="245" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Unseen data</text>
  <text x="50" y="355" font-family="Arial" font-size="12" text-anchor="end" fill="#333">Learning phase</text>
  <text x="550" y="355" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Testing phase</text>
</svg>
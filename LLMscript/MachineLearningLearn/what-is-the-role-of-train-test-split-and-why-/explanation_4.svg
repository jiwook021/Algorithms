<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f9f9f9" />
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Preventing Overfitting with Train-Test Split</text>
  
  <!-- Main diagram area -->
  <rect x="50" y="50" width="500" height="300" fill="#ffffff" stroke="#cccccc" stroke-width="1" />
  
  <!-- X and Y axes -->
  <line x1="100" y1="300" x2="500" y2="300" stroke="#333" stroke-width="2" />
  <line x1="100" y1="300" x2="100" y2="100" stroke="#333" stroke-width="2" />
  
  <!-- Axis labels -->
  <text x="300" y="330" font-family="Arial" font-size="14" text-anchor="middle">Model Complexity</text>
  <text x="60" y="200" font-family="Arial" font-size="14" text-anchor="middle" transform="rotate(-90,60,200)">Error</text>
  
  <!-- Training error curve -->
  <path d="M100,250 Q150,180 200,150 T300,120 T400,110 T500,105" fill="none" stroke="#3182bd" stroke-width="3" />
  <text x="150" y="160" font-family="Arial" font-size="12" fill="#3182bd" font-weight="bold">Training Error</text>
  
  <!-- Test error curve -->
  <path d="M100,250 Q150,180 200,150 T300,140 T400,170 T500,220" fill="none" stroke="#e6550d" stroke-width="3" />
  <text x="450" y="190" font-family="Arial" font-size="12" fill="#e6550d" font-weight="bold">Test Error</text>
  
  <!-- Optimal model complexity marker -->
  <line x1="300" y1="100" x2="300" y2="300" stroke="#31a354" stroke-width="2" stroke-dasharray="5,5" />
  <circle cx="300" cy="140" r="6" fill="#31a354" />
  <text x="310" y="90" font-family="Arial" font-size="12" fill="#31a354" font-weight="bold">Optimal Model Complexity</text>
  
  <!-- Regions -->
  <text x="200" y="270" font-family="Arial" font-size="14" fill="#666666">Underfitting</text>
  <text x="400" y="270" font-family="Arial" font-size="14" fill="#666666">Overfitting</text>
  
  <!-- Explanation box -->
  <rect x="100" y="340" width="400" height="50" fill="#f0f0f0" rx="5" ry="5" />
  <text x="300" y="360" font-family="Arial" font-size="12" text-anchor="middle">
    <tspan x="300" dy="0">Without train-test split, we can't detect overfitting.</tspan>
    <tspan x="300" dy="16">The test set reveals when the model memorizes training data rather than generalizing.</tspan>
  </text>
  
  <!-- Code example -->
  <rect x="420" y="70" width="120" height="90" fill="#ffffff" stroke="#cccccc" rx="5" ry="5" />
  <text x="430" y="85" font-family="Courier New" font-size="9" fill="#333">
    <tspan x="430" dy="0">// C++ pseudocode</tspan>
    <tspan x="430" dy="12">double train_error =</tspan>
    <tspan x="430" dy="12">  model.error(train);</tspan>
    <tspan x="430" dy="12">double test_error =</tspan>
    <tspan x="430" dy="12">  model.error(test);</tspan>
    <tspan x="430" dy="12">// If test_error >> </tspan>
    <tspan x="430" dy="12">// train_error: overfitting</tspan>
  </text>
</svg>
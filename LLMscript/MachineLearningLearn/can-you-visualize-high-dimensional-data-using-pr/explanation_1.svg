<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8f8f8" />
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">PCA: Dimensionality Reduction</text>
  
  <!-- Original 3D data visualization -->
  <g transform="translate(150, 180)">
    <!-- 3D Axes -->
    <line x1="0" y1="0" x2="100" y2="-50" stroke="#444" stroke-width="2" />
    <line x1="0" y1="0" x2="100" y2="50" stroke="#444" stroke-width="2" />
    <line x1="0" y1="0" x2="-50" y2="-80" stroke="#444" stroke-width="2" />
    
    <!-- Axis labels -->
    <text x="110" y="-55" font-family="Arial" font-size="12">X</text>
    <text x="110" y="55" font-family="Arial" font-size="12">Y</text>
    <text x="-60" y="-85" font-family="Arial" font-size="12">Z</text>
    
    <!-- Data points in 3D -->
    <circle cx="60" cy="-30" r="5" fill="#3498db" />
    <circle cx="70" cy="-20" r="5" fill="#3498db" />
    <circle cx="50" cy="-40" r="5" fill="#3498db" />
    <circle cx="80" cy="-15" r="5" fill="#3498db" />
    <circle cx="65" cy="-25" r="5" fill="#3498db" />
    <circle cx="75" cy="-10" r="5" fill="#3498db" />
    <circle cx="55" cy="-35" r="5" fill="#3498db" />
    <circle cx="45" cy="-45" r="5" fill="#3498db" />
    
    <!-- Principal components -->
    <line x1="-80" y1="40" x2="80" y2="-40" stroke="#e74c3c" stroke-width="3" stroke-dasharray="5,3" />
    <text x="85" y="-45" font-family="Arial" font-size="12" fill="#e74c3c" font-weight="bold">PC1</text>
    
    <line x1="-40" y1="-20" x2="40" y2="20" stroke="#2ecc71" stroke-width="3" stroke-dasharray="5,3" />
    <text x="45" y="25" font-family="Arial" font-size="12" fill="#2ecc71" font-weight="bold">PC2</text>
  </g>
  
  <!-- Arrow -->
  <g>
    <line x1="300" y1="200" x2="350" y2="200" stroke="#333" stroke-width="3" />
    <polygon points="350,200 340,195 340,205" fill="#333" />
  </g>
  
  <!-- Reduced 2D data visualization -->
  <g transform="translate(450, 180)">
    <!-- 2D Axes -->
    <line x1="0" y1="0" x2="100" y2="0" stroke="#444" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#444" stroke-width="2" />
    
    <!-- Axis labels -->
    <text x="110" y="5" font-family="Arial" font-size="12">PC1</text>
    <text x="5" y="-110" font-family="Arial" font-size="12">PC2</text>
    
    <!-- Data points in 2D -->
    <circle cx="70" cy="-30" r="5" fill="#3498db" />
    <circle cx="80" cy="-20" r="5" fill="#3498db" />
    <circle cx="60" cy="-40" r="5" fill="#3498db" />
    <circle cx="90" cy="-15" r="5" fill="#3498db" />
    <circle cx="75" cy="-25" r="5" fill="#3498db" />
    <circle cx="85" cy="-10" r="5" fill="#3498db" />
    <circle cx="65" cy="-35" r="5" fill="#3498db" />
    <circle cx="55" cy="-45" r="5" fill="#3498db" />
  </g>
  
  <!-- Explanation text -->
  <g transform="translate(300, 300)">
    <text x="0" y="0" font-family="Arial" font-size="14" text-anchor="middle">
      <tspan x="0" dy="0">PCA finds directions (principal components) with maximum variance</tspan>
      <tspan x="0" dy="20">and projects high-dimensional data onto these components.</tspan>
      <tspan x="0" dy="20">This reduces dimensions while preserving most of the information.</tspan>
    </text>
  </g>
  
  <!-- Code snippet -->
  <g transform="translate(300, 90)">
    <rect x="-250" y="0" width="500" height="60" rx="5" fill="#f0f0f0" stroke="#ccc" />
    <text x="-240" y="20" font-family="Consolas, monospace" font-size="12" fill="#333">
      <tspan x="-240" dy="0">// C++ with Eigen library</tspan>
      <tspan x="-240" dy="16">Eigen::MatrixXd centered = data.rowwise() - data.colwise().mean();</tspan>
      <tspan x="-240" dy="16">Eigen::JacobiSVD&lt;Eigen::MatrixXd> svd(centered, Eigen::ComputeThinU | Eigen::ComputeThinV);</tspan>
    </text>
  </g>
</svg>
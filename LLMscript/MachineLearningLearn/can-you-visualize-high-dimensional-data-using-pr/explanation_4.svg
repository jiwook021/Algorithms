<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">PCA: Dimensionality Reduction Concept</text>
  
  <!-- Original 3D Data -->
  <g transform="translate(150, 180)">
    <!-- 3D Axes -->
    <line x1="0" y1="0" x2="100" y2="-30" stroke="#555" stroke-width="2" />
    <line x1="0" y1="0" x2="30" y2="80" stroke="#555" stroke-width="2" />
    <line x1="0" y1="0" x2="-70" y2="-40" stroke="#555" stroke-width="2" />
    
    <!-- Axis Labels -->
    <text x="105" y="-30" font-family="Arial" font-size="12">X</text>
    <text x="35" y="85" font-family="Arial" font-size="12">Y</text>
    <text x="-80" y="-40" font-family="Arial" font-size="12">Z</text>
    
    <!-- 3D Data Points -->
    <circle cx="60" cy="-20" r="5" fill="#4285f4" />
    <circle cx="70" cy="-15" r="5" fill="#4285f4" />
    <circle cx="55" cy="-25" r="5" fill="#4285f4" />
    <circle cx="65" cy="-10" r="5" fill="#4285f4" />
    <circle cx="75" cy="-5" r="5" fill="#4285f4" />
    <circle cx="20" cy="60" r="5" fill="#4285f4" />
    <circle cx="15" cy="50" r="5" fill="#4285f4" />
    <circle cx="25" cy="65" r="5" fill="#4285f4" />
    <circle cx="10" cy="55" r="5" fill="#4285f4" />
    <circle cx="18" cy="58" r="5" fill="#4285f4" />
    <circle cx="-40" cy="-25" r="5" fill="#4285f4" />
    <circle cx="-50" cy="-30" r="5" fill="#4285f4" />
    <circle cx="-45" cy="-20" r="5" fill="#4285f4" />
    <circle cx="-55" cy="-28" r="5" fill="#4285f4" />
    <circle cx="-42" cy="-22" r="5" fill="#4285f4" />
    
    <!-- Principal Component Direction -->
    <line x1="-70" y1="-25" x2="80" y2="65" stroke="#ea4335" stroke-width="3" stroke-dasharray="5,3" />
    <text x="85" y="70" font-family="Arial" font-size="12" fill="#ea4335" font-weight="bold">PC1</text>
  </g>
  
  <!-- Arrow -->
  <g>
    <line x1="300" y1="200" x2="350" y2="200" stroke="#000" stroke-width="2" />
    <polygon points="350,200 340,195 340,205" fill="#000" />
  </g>
  
  <!-- Reduced 2D Data -->
  <g transform="translate(450, 180)">
    <!-- 2D Axes -->
    <line x1="0" y1="0" x2="100" y2="0" stroke="#555" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="80" stroke="#555" stroke-width="2" />
    
    <!-- Axis Labels -->
    <text x="105" y="5" font-family="Arial" font-size="12">PC1</text>
    <text x="5" y="90" font-family="Arial" font-size="12">PC2</text>
    
    <!-- 2D Projected Data Points -->
    <circle cx="80" cy="15" r="5" fill="#4285f4" />
    <circle cx="85" cy="20" r="5" fill="#4285f4" />
    <circle cx="75" cy="10" r="5" fill="#4285f4" />
    <circle cx="82" cy="22" r="5" fill="#4285f4" />
    <circle cx="88" cy="18" r="5" fill="#4285f4" />
    <circle cx="30" cy="40" r="5" fill="#4285f4" />
    <circle cx="25" cy="35" r="5" fill="#4285f4" />
    <circle cx="35" cy="45" r="5" fill="#4285f4" />
    <circle cx="20" cy="38" r="5" fill="#4285f4" />
    <circle cx="28" cy="42" r="5" fill="#4285f4" />
    <circle cx="10" cy="60" r="5" fill="#4285f4" />
    <circle cx="5" cy="65" r="5" fill="#4285f4" />
    <circle cx="15" cy="55" r="5" fill="#4285f4" />
    <circle cx="8" cy="62" r="5" fill="#4285f4" />
    <circle cx="12" cy="58" r="5" fill="#4285f4" />
  </g>
  
  <!-- Explanatory Text -->
  <g>
    <rect x="50" y="300" width="500" height="80" rx="10" fill="#e8f0fe" stroke="#4285f4" />
    <text x="60" y="320" font-family="Arial" font-size="14">
      <tspan x="60" y="320">PCA transforms high-dimensional data to a lower-dimensional space by:</tspan>
      <tspan x="60" y="345">1. Finding directions (principal components) with maximum variance</tspan>
      <tspan x="60" y="370">2. Projecting data onto these components to reduce dimensions while</tspan>
      <tspan x="75" y="390">preserving as much information as possible</tspan>
    </text>
  </g>
</svg>
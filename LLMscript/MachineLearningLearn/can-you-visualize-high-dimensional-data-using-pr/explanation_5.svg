<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">PCA: Mathematical Process</text>
  
  <!-- Step 1: Data Matrix -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="120" height="140" fill="#e8f0fe" stroke="#4285f4" stroke-width="2" />
    <text x="60" y="-10" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Step 1: Data Matrix X</text>
    
    <!-- Matrix elements -->
    <text x="60" y="25" font-family="Courier New" font-size="12" text-anchor="middle">⎡ x₁₁ x₁₂ ... x₁ₙ ⎤</text>
    <text x="60" y="45" font-family="Courier New" font-size="12" text-anchor="middle">⎢ x₂₁ x₂₂ ... x₂ₙ ⎥</text>
    <text x="60" y="65" font-family="Courier New" font-size="12" text-anchor="middle">⎢ ...        ⎥</text>
    <text x="60" y="85" font-family="Courier New" font-size="12" text-anchor="middle">⎣ xₘ₁ xₘ₂ ... xₘₙ ⎦</text>
    
    <text x="60" y="115" font-family="Arial" font-size="12" text-anchor="middle">m samples</text>
    <text x="60" y="130" font-family="Arial" font-size="12" text-anchor="middle">n features</text>
  </g>
  
  <!-- Arrow -->
  <g>
    <line x1="180" y1="140" x2="210" y2="140" stroke="#000" stroke-width="2" />
    <polygon points="210,140 200,135 200,145" fill="#000" />
  </g>
  
  <!-- Step 2: Standardization -->
  <g transform="translate(220, 80)">
    <rect x="0" y="0" width="120" height="120" fill="#fce8e6" stroke="#ea4335" stroke-width="2" />
    <text x="60" y="-10" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Step 2: Standardize</text>
    
    <text x="60" y="30" font-family="Arial" font-size="12" text-anchor="middle">Z-score each feature:</text>
    <text x="60" y="60" font-family="Courier New" font-size="12" text-anchor="middle">x' = (x - μ) / σ</text>
    <text x="60" y="90" font-family="Arial" font-size="12" text-anchor="middle">μ = mean</text>
    <text x="60" y="110" font-family="Arial" font-size="12" text-anchor="middle">σ = std deviation</text>
  </g>
  
  <!-- Arrow -->
  <g>
    <line x1="350" y1="140" x2="380" y2="140" stroke="#000" stroke-width="2" />
    <polygon points="380,140 370,135 370,145" fill="#000" />
  </g>
  
  <!-- Step 3: Covariance Matrix -->
  <g transform="translate(390, 80)">
    <rect x="0" y="0" width="160" height="120" fill="#e6f4ea" stroke="#34a853" stroke-width="2" />
    <text x="80" y="-10" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Step 3: Covariance Matrix</text>
    
    <text x="80" y="30" font-family="Courier New" font-size="12" text-anchor="middle">C = (1/(m-1)) * X'ᵀX'</text>
    <text x="80" y="60" font-family="Arial" font-size="12" text-anchor="middle">Symmetric n×n matrix</text>
    <text x="80" y="80" font-family="Arial" font-size="12" text-anchor="middle">showing relationships</text>
    <text x="80" y="100" font-family="Arial" font-size="12" text-anchor="middle">between features</text>
  </g>
  
  <!-- Arrow -->
  <g>
    <line x1="280" y1="210" x2="280" y2="240" stroke="#000" stroke-width="2" />
    <polygon points="280,240 275,230 285,230" fill="#000" />
  </g>
  
  <!-- Step 4: Eigendecomposition -->
  <g transform="translate(200, 250)">
    <rect x="0" y="0" width="160" height="110" fill="#fef6e0" stroke="#fbbc04" stroke-width="2" />
    <text x="80" y="-10" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Step 4: Eigendecomposition</text>
    
    <text x="80" y="25" font-family="Arial" font-size="12" text-anchor="middle">Find eigenvectors (V)</text>
    <text x="80" y="45" font-family="Arial" font-size="12" text-anchor="middle">and eigenvalues (λ)</text>
    <text x="80" y="65" font-family="Courier New" font-size="12" text-anchor="middle">CV = λV</text>
    <text x="80" y="90" font-family="Arial" font-size="12" text-anchor="middle">Sort by λ (descending)</text>
  </g>
  
  <!-- Arrow -->
  <g>
    <line x1="370" y1="300" x2="400" y2="300" stroke="#000" stroke-width="2" />
    <polygon points="400,300 390,295 390,305" fill="#000" />
  </g>
  
  <!-- Step 5: Projection -->
  <g transform="translate(410, 250)">
    <rect x="0" y="0" width="160" height="110" fill="#e3f2fd" stroke="#4285f4" stroke-width="2" />
    <text x="80" y="-10" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Step 5: Projection</text>
    
    <text x="80" y="25" font-family="Arial" font-size="12" text-anchor="middle">Select top k eigenvectors</text>
    <text x="80" y="45" font-family="Arial" font-size="12" text-anchor="middle">to form projection matrix</text>
    <text x="80" y="70" font-family="Courier New" font-size="12" text-anchor="middle">Z = X' * W</text>
    <text x="80" y="95" font-family="Arial" font-size="12" text-anchor="middle">Z: reduced data (m×k)</text>
  </g>
  
  <!-- C++ Code Example -->
  <rect x="50" y="380" width="500" height="15" fill="#f1f3f4" stroke="#5f6368" stroke-width="1" />
  <text x="55" y="391" font-family="Courier New" font-size="10" fill="#5f6368">// PCA using Eigen library: Eigen::MatrixXd X_centered = X.rowwise() - X.colwise().mean();</text>
</svg>
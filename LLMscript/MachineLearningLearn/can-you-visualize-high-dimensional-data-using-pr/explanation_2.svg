<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Principal Component Analysis (PCA): Concept</text>
  
  <!-- Original 3D data points -->
  <g transform="translate(150, 200)">
    <!-- 3D Coordinate system -->
    <line x1="0" y1="0" x2="100" y2="-50" stroke="#555" stroke-width="2" />
    <line x1="0" y1="0" x2="50" y2="80" stroke="#555" stroke-width="2" />
    <line x1="0" y1="0" x2="-70" y2="-30" stroke="#555" stroke-width="2" />
    
    <text x="105" y="-50" font-family="Arial" font-size="12">X</text>
    <text x="55" y="85" font-family="Arial" font-size="12">Y</text>
    <text x="-80" y="-30" font-family="Arial" font-size="12">Z</text>
    
    <!-- Data points in 3D -->
    <circle cx="60" cy="-30" r="5" fill="#4285f4" />
    <circle cx="40" cy="-15" r="5" fill="#4285f4" />
    <circle cx="70" cy="-25" r="5" fill="#4285f4" />
    <circle cx="55" cy="-40" r="5" fill="#4285f4" />
    <circle cx="30" cy="-10" r="5" fill="#4285f4" />
    <circle cx="65" cy="-35" r="5" fill="#4285f4" />
    <circle cx="45" cy="-20" r="5" fill="#4285f4" />
    <circle cx="75" cy="-30" r="5" fill="#4285f4" />
    
    <!-- Principal components -->
    <line x1="-80" y1="-40" x2="80" y2="40" stroke="#ea4335" stroke-width="3" stroke-dasharray="5,3" />
    <text x="85" y="45" font-family="Arial" font-size="12" fill="#ea4335" font-weight="bold">PC1</text>
    
    <line x1="-40" y1="60" x2="40" y2="-60" stroke="#fbbc05" stroke-width="3" stroke-dasharray="5,3" />
    <text x="45" y="-65" font-family="Arial" font-size="12" fill="#fbbc05" font-weight="bold">PC2</text>
    
    <text x="-80" y="-80" font-family="Arial" font-size="16" font-weight="bold">High-dimensional Space</text>
  </g>
  
  <!-- Arrow indicating transformation -->
  <path d="M300,200 L340,200 L330,190 L350,200 L330,210 L340,200" fill="#34a853" />
  
  <!-- 2D projection -->
  <g transform="translate(450, 200)">
    <!-- 2D Coordinate system -->
    <line x1="0" y1="0" x2="100" y2="0" stroke="#555" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#555" stroke-width="2" />
    
    <text x="105" y="5" font-family="Arial" font-size="12">PC1</text>
    <text x="5" y="-105" font-family="Arial" font-size="12">PC2</text>
    
    <!-- Projected data points in 2D -->
    <circle cx="70" cy="-30" r="5" fill="#4285f4" />
    <circle cx="50" cy="-15" r="5" fill="#4285f4" />
    <circle cx="80" cy="-25" r="5" fill="#4285f4" />
    <circle cx="65" cy="-40" r="5" fill="#4285f4" />
    <circle cx="40" cy="-10" r="5" fill="#4285f4" />
    <circle cx="75" cy="-35" r="5" fill="#4285f4" />
    <circle cx="55" cy="-20" r="5" fill="#4285f4" />
    <circle cx="85" cy="-30" r="5" fill="#4285f4" />
    
    <text x="-30" y="-80" font-family="Arial" font-size="16" font-weight="bold">Reduced Dimensions</text>
  </g>
  
  <!-- Explanation -->
  <g transform="translate(300, 320)">
    <text x="0" y="0" font-family="Arial" font-size="14" text-anchor="middle">
      PCA identifies directions (principal components) with maximum variance
    </text>
    <text x="0" y="20" font-family="Arial" font-size="14" text-anchor="middle">
      and projects high-dimensional data onto these components to reduce dimensions
    </text>
    <text x="0" y="40" font-family="Arial" font-size="14" text-anchor="middle">
      while preserving as much information as possible.
    </text>
  </g>
</svg>
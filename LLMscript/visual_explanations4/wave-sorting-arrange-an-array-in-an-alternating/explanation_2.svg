<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="30" font-size="18" font-weight="bold">2. Initial Unsorted Array</text>
  <text x="20" y="60">Example: [5, 2, 8, 1, 9, 4, 7]</text>

  <g transform="translate(30, 100)">
    <rect x="0" y="0" width="40" height="40" fill="lightgray" stroke="black"/>
    <text x="15" y="25" font-size="16">5</text>
    
    <rect x="50" y="0" width="40" height="40" fill="lightgray" stroke="black"/>
    <text x="65" y="25" font-size="16">2</text>

    <rect x="100" y="0" width="40" height="40" fill="lightgray" stroke="black"/>
    <text x="115" y="25" font-size="16">8</text>

    <rect x="150" y="0" width="40" height="40" fill="lightgray" stroke="black"/>
    <text x="165" y="25" font-size="16">1</text>

    <rect x="200" y="0" width="40" height="40" fill="lightgray" stroke="black"/>
    <text x="215" y="25" font-size="16">9</text>
    
      <rect x="250" y="0" width="40" height="40" fill="lightgray" stroke="black"/>
    <text x="265" y="25" font-size="16">4</text>
    
      <rect x="300" y="0" width="40" height="40" fill="lightgray" stroke="black"/>
    <text x="315" y="25" font-size="16">7</text>
  </g>
</svg>
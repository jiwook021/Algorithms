<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f0f0f0" />
  <text x="20" y="30" font-size="20" font-weight="bold">2. Breadth-First Search (BFS)</text>

  <!-- Maze Grid (Simplified) -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="50" height="50" fill="white" stroke="black"/>
    <rect x="50" y="0" width="50" height="50" fill="white" stroke="black"/>
    <rect x="100" y="0" width="50" height="50" fill="white" stroke="black"/>

    <rect x="0" y="50" width="50" height="50" fill="white" stroke="black"/>
    <rect x="50" y="50" width="50" height="50" fill="white" stroke="black"/>
    <rect x="100" y="50" width="50" height="50" fill="white" stroke="black"/>

     <rect x="0" y="100" width="50" height="50" fill="white" stroke="black"/>
    <rect x="50" y="100" width="50" height="50" fill="white" stroke="black"/>
    <rect x="100" y="100" width="50" height="50" fill="white" stroke="black"/>

    <!-- Start and Exploration -->
    <circle cx="25" cy="25" r="15" fill="green"/>
    <text x="15" y="30" font-size="12">Start</text>

    <rect x="50" y="0" width="50" height="50" fill="lightblue" stroke="black" opacity="0.5"/>
    <rect x="0" y="50" width="50" height="50" fill="lightblue" stroke="black" opacity="0.5"/>
     <text x="65" y="30" font-size="12">1</text>
      <text x="15" y="80" font-size="12">1</text>

  </g>
    <text x="20" y="220" font-size="14" >BFS explores layer by layer.</text>
     <text x="20" y="240" font-size="14" >It guarantees the shortest path.</text>
  <text x="20" y="260" font-size="14">Numbers indicate distance from start.</text>

</svg>
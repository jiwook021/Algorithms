<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f0f0f0" />
  <text x="20" y="30" font-size="20" font-weight="bold">7. Teleporter as a Neighbor</text>

    <!-- Maze Grid with Teleporters -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="50" height="50" fill="white" stroke="black"/>
    <rect x="50" y="0" width="50" height="50" fill="white" stroke="black"/>
    <rect x="100" y="0" width="50" height="50" fill="white" stroke="black"/>
    <rect x="150" y="0" width="50" height="50" fill="white" stroke="black"/>

    <rect x="0" y="50" width="50" height="50" fill="white" stroke="black"/>
    <rect x="50" y="50" width="50" height="50" fill="lightblue" stroke="black"/>
    <rect x="100" y="50" width="50" height="50" fill="white" stroke="black"/>
    <rect x="150" y="50" width="50" height="50" fill="white" stroke="black"/>

     <rect x="0" y="100" width="50" height="50" fill="white" stroke="black"/>
    <rect x="50" y="100" width="50" height="50" fill="white" stroke="black"/>
    <rect x="100" y="100" width="50" height="50" fill="white" stroke="black"/>
        <rect x="150" y="100" width="50" height="50" fill="white" stroke="black"/>


    <!-- Teleporters -->
    <circle cx="75" cy="75" r="15" fill="purple"/>
    <circle cx="175" cy="25" r="15" fill="purple"/>
    <text x="60" y="80" font-size="12">T1</text>
    <text x="160" y="30" font-size="12">T1</text>

      <!-- Current Cell and Neighbors -->
    <circle cx="75" cy="75" r="15" fill="yellow"/>
     <text x="65" y="80" font-size="12">Current</text>

       <polygon points="75,55 85,75 65,75" fill="orange" />
     <polygon points="75,95 85,75 65,75" fill="orange" />
     <polygon points="55,75 75,85 75,65" fill="orange" />
     <polygon points="95,75 75,85 75,65" fill="orange" />
     <polygon points="175,25 85,75 65,75" fill="orange" />

        <line x1="90" y1="60" x2="160" y2="10" stroke="purple" stroke-width="3" stroke-dasharray="5,5"/>


      <text x="160" y="50" font-size="14" >Teleporter</text>
      <text x="160" y="70" font-size="14" >Neighbor</text>
  </g>

  <text x="20" y="220" font-size="14">The paired teleporter is treated as a neighbor.</text>
    <text x="20" y="240" font-size="14"> Distance increases by 1 after teleporting.</text>
</svg>
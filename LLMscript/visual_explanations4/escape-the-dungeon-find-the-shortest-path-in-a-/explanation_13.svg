<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
    <rect width="200" height="200" fill="lightgray"/>
    <text x="10" y="30" font-size="16">4. Movement</text>
    <rect x="50" y="50" width="100" height="100" fill="white" stroke="black"/>
    <rect x="80" y="80" width="20" height="20" fill="lightgreen"/>
    <path d="M 90 70 L 90 80" stroke="red" stroke-width="2"/>
     <path d="M 90 100 L 90 110" stroke="red" stroke-width="2"/>
      <path d="M 80 90 L 70 90" stroke="red" stroke-width="2"/>
    <path d="M 100 90 L 110 90" stroke="red" stroke-width="2"/>

    <text x="10" y="180" font-size="10">Up, Down, Left, Right.</text>
</svg>
<svg width="400" height="150" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="150" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">4. Generating the Next Term</text>
  <text x="20" y="60" font-size="14">"One 1" becomes the next term: 11</text>
    <circle cx="100" cy="100" r="20" fill="#4CAF50" stroke="black" stroke-width="2"/>
  <text x="95" y="105" font-size="18" fill="white">1</text>
  <text x="180" y="105" font-size="18" fill="red">One 1</text>
   <path d="M250 100 L 300 100" stroke="green" stroke-width="4"/>
   <polygon points="300,100 290,95 290,105" fill="green"/>
   <rect x="320" y="80" width="40" height="40" fill="#FFC107" stroke="black" stroke-width="2"/>
  <text x="330" y="105" font-size="18" fill="black">11</text>

</svg>
  <text x="20" y="30" font-size="16" font-weight="bold">7. Grouping Identical Digits</text>
  <text x="20" y="60" font-size="14">When describing, group consecutive identical digits.</text>
  <rect x="50" y="90" width="120" height="40" fill="#FFEB3B" stroke="black" stroke-width="2"/>
  <text x="60" y="115" font-size="18" fill="black">1211</text>

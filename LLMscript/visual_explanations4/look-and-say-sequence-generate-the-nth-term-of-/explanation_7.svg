   <path d="M90 130 L 90 160" stroke="purple" stroke-width="2"/>
   <path d="M110 130 L 110 160" stroke="purple" stroke-width="2"/>
    <path d="M150 130 L 150 160" stroke="purple" stroke-width="2"/>
  <text x="60" y="175" font-size="16">One 1</text>
  <text x="95" y="175" font-size="16">One 2</text>
   <text x="120" y="175" font-size="16">Two 1s</text>
</svg>
<svg width="400" height="150" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="150" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">9.  The nth Term</text>
  <text x="20" y="60" font-size="14">To find the nth term, repeat the process n-1 times.</text>
  <text x="50" y="100" font-size="14">n = 1: 1</text>
  <text x="50" y="120" font-size="14">n = 2: 11</text>
  <text x="150" y="100" font-size="14">n = 3: 21</text>
  <text x="150" y="120" font-size="14">n = 4: 1211</text>
  <text x="250" y="100" font-size="16" fill="blue">...</text>
  <text x="250" y="120" font-size="14" fill="darkred">n = ?</text>

</svg>
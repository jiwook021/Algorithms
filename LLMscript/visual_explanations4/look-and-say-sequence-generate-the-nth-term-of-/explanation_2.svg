<svg width="400" height="150" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="150" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">2. "Looking" at the Previous Term</text>
  <text x="20" y="60" font-size="14">We examine the previous term (initially '1') to describe it.</text>
   <circle cx="100" cy="100" r="20" fill="#4CAF50" stroke="black" stroke-width="2"/>
  <text x="95" y="105" font-size="18" fill="white">1</text>
  <path d="M125 100 C 175 50, 225 50, 275 100" stroke="blue" stroke-width="3" fill="none"/>
   <polygon points="275,100 265,90 265,110" fill="blue"/>
  <text x="180" y="80" font-size="14" fill="blue">"Look"</text>
</svg>
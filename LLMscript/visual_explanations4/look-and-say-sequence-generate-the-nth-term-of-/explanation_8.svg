<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">8. Example: Generating Several Terms</text>
  <text x="20" y="60" font-size="14">Here's how the first few terms are generated:</text>
    <rect x="50" y="90"  width="30" height="30" fill="#4CAF50" stroke="black" stroke-width="1"/>
   <text x="60" y="110" font-size="14">1</text>
   <text x="90" y="110" font-size="14">-&gt;</text>
  <rect x="120" y="90" width="30" height="30" fill="#FFC107" stroke="black" stroke-width="1"/>
  <text x="125" y="110" font-size="14" >11</text>
 <text x="160" y="110" font-size="14">-&gt;</text>

    <rect x="190" y="90"  width="30" height="30" fill="#9CCC65" stroke="black" stroke-width="1"/>
   <text x="195" y="110" font-size="14">21</text>
   <text x="230" y="110" font-size="14">-&gt;</text>
  <rect x="260" y="90" width="60" height="30" fill="#FFEB3B" stroke="black" stroke-width="1"/>
  <text x="265" y="110" font-size="14" >1211</text>
<text x="330" y="110" font-size="14">-&gt;</text>
  <rect x="50" y="140" width="80" height="30" fill="#CDDC39" stroke="black" stroke-width="1"/>
  <text x="55" y="160" font-size="14" >111221</text>

   <text x="20" y="200" font-size="16" font-weight="bold">Descriptions:</text>
     <text x="50" y="230" font-size="14">One 1</text>
      <text x="50" y="250" font-size="14">Two 1s</text>
      <text x="50" y="270" font-size="14">One 2, One 1</text>
</svg>
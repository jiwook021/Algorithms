<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">Concept 8: Cuts Array</text>
  <text x="20" y="60">String: "aaba"</text>

    <rect x="20" y="90" width="30" height="30" fill="lightgray" stroke="black" />
   <text x="30" y="110" font-size="16">a</text>
     <rect x="55" y="90" width="30" height="30" fill="lightgray" stroke="black" />
       <text x="65" y="110" font-size="16">a</text>
    <rect x="90" y="90" width="30" height="30" fill="lightgray" stroke="black" />
  <text x="100" y="110" font-size="16">b</text>
    <rect x="125" y="90" width="30" height="30" fill="lightgray" stroke="black" />
  <text x="135" y="110" font-size="16">a</text>

  <rect x="20" y="140" width="30" height="30" fill="lightblue" stroke="black" />
  <text x="30" y="160" font-size="16">0</text>
    <rect x="55" y="140" width="30" height="30" fill="lightblue" stroke="black" />
    <text x="65" y="160" font-size="16">1</text>

    <rect x="90" y="140" width="30" height="30" fill="lightblue" stroke="black" />
  <text x="100" y="160" font-size="16">2</text>

    <rect x="125" y="140" width="30" height="30" fill="lightblue" stroke="black" />
 <text x="135" y="160" font-size="16">1</text>

    <text x="200" y="110">Cuts array stores minimum</text>
   <text x="200" y="130">cuts needed for substring</text>
  <text x="200" y="150">ending at that index.</text>
 <text x="200" y="180">cuts[3] = 1 means "aaba"</text>
  <text x="200" y="200">needs 1 cut (e.g., "aa", "ba").</text>
</svg>
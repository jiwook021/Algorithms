<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">Concept 6: Dynamic Programming Idea</text>
  <text x="20" y="60">String: "aab"</text>
  <text x="20" y="90">Build up solutions from smaller subproblems.</text>
    <text x="20" y="120">1. Is "a" a palindrome? Yes.</text>
    <text x="20" y="140">2. Is "aa" a palindrome? Yes.</text>
      <text x="20" y="160">3. Is "aab" a palindrome? No.</text>
    <text x="20" y="190" fill="blue">If "aa" is a palindrome, and we add "b",</text>
    <text x="20" y="210" fill="blue"> we only need to check if "aab" is, or consider</text>
  <text x="20" y="230" fill="blue">"aa" + "b" as two palindromes.</text>

</svg>
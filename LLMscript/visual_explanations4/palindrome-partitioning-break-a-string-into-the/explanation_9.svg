<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">Concept 9: Iterating and Updating Cuts</text>
  <text x="20" y="60">String: "aaba"</text>

  <rect x="20" y="90" width="30" height="30" fill="lightgray" stroke="black" />
    <text x="30" y="110">a</text>
   <rect x="55" y="90" width="30" height="30" fill="lightgray" stroke="black" />
     <text x="65" y="110">a</text>
    <rect x="90" y="90" width="30" height="30" fill="lightgray" stroke="black" />
    <text x="100" y="110">b</text>
    <rect x="125" y="90" width="30" height="30" fill="lightgray" stroke="black" />
  <text x="135" y="110">a</text>

      <rect x="20" y="130" width="30" height="30" fill="lightblue" stroke="black" />
       <text x="30" y="150">0</text>
    <rect x="55" y="130" width="30" height="30" fill="lightblue" stroke="black" />
      <text x="65" y="150">?</text>
  <rect x="90" y="130" width="30" height="30" fill="lightblue" stroke="black" />
      <text x="100" y="150">?</text>
  <rect x="125" y="130" width="30" height="30" fill="lightblue" stroke="black" />
      <text x="135" y="150">?</text>

    <text x="20" y="180" fill="blue">For cuts[1] (substring "aa"):</text>
  <text x="20" y="200" fill="blue"> - "aa" is a palindrome. cuts[1] = 0</text>
  <text x="20" y="230" fill="green">For cuts[2] (substring "aab"):</text>
 <text x="20" y="250" fill="green">  - "aab" is NOT a palindrome.</text>
   <text x="20" y="270" fill="green">  - Check "aa" (cuts[1] + 1) = 0+1 = 1</text>
</svg>
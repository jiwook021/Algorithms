<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">Concept 2: Non-Palindrome Example</text>
  <text x="20" y="60">"apple" -> Does NOT read the same forwards and backwards.</text>
  
  <text x="20" y="100" font-size="16">apple</text>
    <line x1="20" y1="120" x2="60" y2="120" stroke="green" stroke-width="2"/>
    <line x1="60" y1="120" x2="80" y2="120" stroke="green" stroke-width="2" />
    <line x1="20" y1="140" x2="100" y2="140" stroke="red" stroke-width="4" />
    
    <line x1="80" y1="120" x2="90" y2="140" stroke="red" stroke-width="2" />
    <line x1="80" y1="120" x2="90" y2="100" stroke="red" stroke-width="2" />
    
      <line x1="90" y1="120" x2="100" y2="140" stroke="red" stroke-width="2" />
    <line x1="90" y1="120" x2="100" y2="100" stroke="red" stroke-width="2" />
</svg>
<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="400" height="250" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">3. Brute Force - Prefix Checking</text>
  <text x="20" y="60">Input: "applepenapple"</text>
    <text x="20" y="80">Dictionary: {"apple", "pen"}</text>
  <text x="20" y="110">Try all possible prefixes:</text>

    <rect x="30" y="130" width="40" height="25"  stroke="black" fill="white"/>
  <text x="40" y="150">"a"</text>
    <rect x="80" y="130" width="60" height="25" stroke="black" fill="white"/>
  <text x="90" y="150">"ap"</text>
    <rect x="150" y="130" width="80" height="25" stroke="black" fill="white"/>
  <text x="160" y="150">"app"</text>
    <rect x="240" y="130" width="100" height="25" stroke="black" fill="#90ee90"/>
  <text x="250" y="150">"apple"</text>

     <text x="20" y="185">Check if prefix is in dictionary.  If yes, recurse on the remaining string.</text>
   <text x="20" y="210" font-size="12">This can be very inefficient (exponential time complexity).</text>
</svg>
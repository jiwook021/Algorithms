<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
    <rect width="400" height="250" fill="#f0f0f0" />
    <text x="20" y="30" font-size="18" font-weight="bold">Step 4: Pop and Reverse</text>
    <text x="20" y="60" font-size="14">Pop characters from the stack until you reach '('.</text>
    <text x="20" y="80" font-size="14">Reverse the popped characters.</text>

    <rect x="150" y="110" width="50" height="20" fill="#aaf" />
    <text x="165" y="125" font-size="12">c</text>
    <rect x="150" y="130" width="50" height="20" fill="#aaf" />
    <text x="165" y="145" font-size="12">b</text>
    <rect x="150" y="150" width="50" height="20" fill="#aaf" />
    <text x="165" y="165" font-size="12">a</text>
    <text x="150" y="180" font-size="14">Stack</text>

    <path d="M200 120 L250 120" stroke="black" marker-end="url(#arrowhead)" />
    <text x="260" y="125" font-size="14">c</text>

    <path d="M200 140 L250 140" stroke="black" marker-end="url(#arrowhead)" />
    <text x="260" y="145" font-size="14">b</text>

    <path d="M200 160 L250 160" stroke="black" marker-end="url(#arrowhead)"/>
    <text x="260" y="165" font-size="14">a</text>

    <text x="260" y="190" font-size="16" font-weight="bold">Reversed: cba</text>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
</svg>
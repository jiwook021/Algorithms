<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">Problem: Reverse Parentheses</text>
  <text x="20" y="60" font-size="14">Given a string with nested parentheses,</text>
  <text x="20" y="80" font-size="14">reverse the characters inside them.</text>
  <text x="20" y="110" font-size="16" font-weight="bold">Example:</text>
  <text x="20" y="140" font-size="14">Input:  "(abc(def)gh)"</text>
  <text x="20" y="170" font-size="14">Output: "hgfedcba"</text>
</svg>
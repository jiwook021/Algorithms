<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">Nested Parentheses</text>
  <text x="20" y="60" font-size="14">The stack handles nesting automatically.</text>
    <text x="20" y="80" font-size="14">Inner parentheses are processed first (LIFO).</text>

  <text x="50" y="120" font-size="16" >( a b ( c d ) e )</text>

  <rect x="250" y="130" width="50" height="20" fill="#aaf" />
  <text x="265" y="145" font-size="12">e</text>
  <rect x="250" y="150" width="50" height="20" fill="#aaf" />
  <text x="265" y="165" font-size="12">d</text>
    <rect x="250" y="170" width="50" height="20" fill="#aaf" />
    <text x="265" y="185" font-size="12">c</text>
    <rect x="250" y="190" width="50" height="20" fill="#aaf" />
    <text x="265" y="205" font-size="12">b</text>
    <rect x="250" y="210" width="50" height="20" fill="#aaf" />
      <text x="265" y="225" font-size="12">a</text>
  <text x="250" y="235" font-size="14">Stack</text>
</svg>
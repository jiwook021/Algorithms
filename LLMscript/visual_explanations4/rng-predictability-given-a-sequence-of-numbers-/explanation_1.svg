<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">1. What is a Seed?</text>
  <rect x="50" y="60" width="80" height="80" fill="#4CAF50" />
  <text x="75" y="100" font-size="14">Seed</text>
  <path d="M130 100 L180 100" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="180" y="60" width="150" height="80" fill="#FFEB3B" />
  <text x="200" y="100" font-size="14">RNG Algorithm</text>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
   <text x="20" y="170" font-size="12" fill="darkblue">The seed is the initial value that starts the RNG process.</text>
</svg>
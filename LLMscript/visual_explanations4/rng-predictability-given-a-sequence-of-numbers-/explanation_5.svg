<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
    <rect width="400" height="250" fill="#f0f0f0" />
    <text x="20" y="30" font-size="16" font-weight="bold">5.  Brute-Force Approach</text>
    <text x="20" y="60" font-size="14">Known Sequence: 7, 15, 3, ...</text>

     <rect x="20" y="80" width="40" height="20" fill="#4CAF50" />
     <text x="25" y="95" font-size="10">Seed 0</text>
     <path d="M60 90 L100 90" stroke="grey" stroke-width="1"  />
       <rect x="100" y="80" width="30" height="20" fill="#2196F3" />
      <text x="105" y="95" font-size="10">1</text>

        <rect x="20" y="110" width="40" height="20" fill="#4CAF50" />
     <text x="25" y="125" font-size="10">Seed 1</text>
     <path d="M60 120 L100 120" stroke="grey" stroke-width="1"  />
       <rect x="100" y="110" width="30" height="20" fill="#2196F3" />
      <text x="105" y="125" font-size="10">5</text>

    <rect x="20" y="140" width="40" height="20" fill="#4CAF50" />
    <text x="25" y="155" font-size="10">Seed 2</text>
    <path d="M60 150 L100 150" stroke="grey" stroke-width="1"  />
    <rect x="100" y="140" width="30" height="20" fill="#2196F3" />
    <text x="105" y="155" font-size="10">7</text>
     <path d="M130 150 L160 150" stroke="grey" stroke-width="1"  />
    <rect x="160" y="140" width="30" height="20" fill="#2196F3" />
    <text x="165" y="155" font-size="10">15</text>
     <path d="M190 150 L220 150" stroke="grey" stroke-width="1"  />
       <rect x="220" y="140" width="30" height="20" fill="#2196F3" />
      <text x="225" y="155" font-size="10">3</text>

    <text x="20" y="200" font-size="12" fill="darkblue">Try every possible seed until the generated sequence matches.</text>
    <text x="20" y="220" font-size="12" fill="darkblue">Computationally expensive for large seed spaces!</text>
</svg>
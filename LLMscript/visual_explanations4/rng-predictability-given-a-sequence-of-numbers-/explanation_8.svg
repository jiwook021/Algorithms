<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">8.  Cracking LCG:  Small Example</text>
  <text x="20" y="60" font-size="14">Observed sequence: 3, 2, 13, ... (m=16, a=5, c=3)</text>
  <text x="20" y="90" font-size="12">We have X_1 = 3, X_2 = 2</text>
  <text x="20" y="110" font-size="12">3 = (5 * X_0 + 3) mod 16</text>
  <text x="20" y="130" font-size="12">We can test values of X_0 from 0 to 15.</text>

    <rect x="20" y="150" width="40" height="20" fill="#4CAF50" />
     <text x="25" y="165" font-size="10">Try X_0 = 0</text>
      <text x="70" y="165" font-size="12" >(5 * 0 + 3) mod 16 = 3  (Matches!)</text>

        <rect x="20" y="180" width="40" height="20" fill="#4CAF50" />
     <text x="25" y="195" font-size="10">Try X_0 = 1</text>
    <text x="70" y="195" font-size="12" >(5 * 1 + 3) mod 16 = 8  (No Match)</text>
      <text x="20" y="220" font-size="12" fill="darkblue">Continue until all parameters are identified.</text>

</svg>
  <text x="20" y="30" font-size="16" font-weight="bold">Step 3: Check for Single Digit</text>
  <text x="20" y="60" font-size="14">Is the result a single digit (0-9)?</text>
  <rect x="50" y="90" width="50" height="40" fill="#90EE90" />
  <text x="65" y="115" font-size="18">29</text>
  <path d="M110 110 L150 110" stroke="black" stroke-width="2" />
    <polygon points="150,105 160,110 150,115" fill="black"/>

   <text x="170" y="105" font-size="14" fill="red">No, it's two digits.</text>
  <text x="170" y="135" font-size="14" fill="blue">Repeat the process.</text>


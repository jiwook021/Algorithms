<svg width="400" height="150" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="150" fill="#f0f8ff" />
  <text x="20" y="30" font-size="16" font-weight="bold">Concept: Super Digit</text>
  <text x="20" y="60" font-size="14">Repeatedly sum the digits of a number</text>
  <text x="20" y="80" font-size="14">until a single-digit result is obtained.</text>
  <text x="20" y="110" font-size="14" fill="blue">Example: 9875  ->  29  ->  11  ->  2</text>

</svg>
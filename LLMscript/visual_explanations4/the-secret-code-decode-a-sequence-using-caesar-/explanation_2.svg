<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="300" fill="#f0f0f0" />
    <text x="20" y="30" font-size="16" font-weight="bold">Caesar Cipher: Alphabet Wheel</text>

  <circle cx="150" cy="150" r="100" fill="none" stroke="black" stroke-width="2"/>
  <circle cx="150" cy="150" r="80" fill="none" stroke="black" stroke-width="2"/>

  <!-- Outer Wheel (Plaintext) -->
  <text x="142" y="55" font-size="12">A</text>
    <text transform="rotate(13.846 150 150)" x="154" y="52" font-size="12">B</text>
    <text transform="rotate(27.692 150 150)" x="166" y="55" font-size="12">C</text>
  <text transform="rotate(41.538 150 150)" x="178" y="62" font-size="12">D</text>
    <text transform="rotate(55.385 150 150)" x="185" y="75" font-size="12">E</text>
    <text transform="rotate(69.231 150 150)" x="190" y="86" font-size="12">F</text>
    <text transform="rotate(83.077 150 150)" x="194" y="97" font-size="12">G</text>
    <text transform="rotate(96.923 150 150)" x="195" y="112" font-size="12">H</text>
    <text transform="rotate(110.769 150 150)" x="194" y="127" font-size="12">I</text>
   <text transform="rotate(124.615 150 150)" x="189" y="141" font-size="12">J</text>
    <text transform="rotate(138.462 150 150)" x="185" y="155" font-size="12">K</text>
    <text transform="rotate(152.308 150 150)" x="175" y="166" font-size="12">L</text>
    <text transform="rotate(166.154 150 150)" x="168" y="177" font-size="12">M</text>
    <text transform="rotate(180 150 150)" x="142" y="190" font-size="12">N</text>
    <text transform="rotate(193.846 150 150)" x="125" y="180" font-size="12">O</text>
    <text transform="rotate(207.692 150 150)" x="115" y="172" font-size="12">P</text>
    <text transform="rotate(221.538 150 150)" x="105" y="162" font-size="12">Q</text>
    <text transform="rotate(235.385 150 150)" x="95" y="145" font-size="12">R</text>
    <text transform="rotate(249.231 150 150)" x="90" y="130" font-size="12">S</text>
    <text transform="rotate(263.077 150 150)" x="90" y="110" font-size="12">T</text>
    <text transform="rotate(276.923 150 150)" x="92" y="98" font-size="12">U</text>
    <text transform="rotate(290.769 150 150)" x="98" y="85" font-size="12">V</text>
    <text transform="rotate(304.615 150 150)" x="105" y="74" font-size="12">W</text>
    <text transform="rotate(318.462 150 150)" x="114" y="64" font-size="12">X</text>
     <text transform="rotate(332.308 150 150)" x="125" y="58" font-size="12">Y</text>
    <text transform="rotate(346.154 150 150)" x="135" y="52" font-size="12">Z</text>



  <!-- Inner Wheel (Ciphertext, Shift +3) -->
    <text x="142" y="75" font-size="12" fill="red">D</text>
    <text transform="rotate(13.846 150 150)" x="154" y="72" font-size="12" fill="red">E</text>
    <text transform="rotate(27.692 150 150)" x="166" y="75" font-size="12" fill="red">F</text>
  <text transform="rotate(41.538 150 150)" x="178" y="82" font-size="12" fill="red">G</text>
    <text transform="rotate(55.385 150 150)" x="185" y="95" font-size="12" fill="red">H</text>
    <text transform="rotate(69.231 150 150)" x="190" y="106" font-size="12" fill="red">I</text>
    <text transform="rotate(83.077 150 150)" x="194" y="117" font-size="12" fill="red">J</text>
    <text transform="rotate(96.923 150 150)" x="195" y="132" font-size="12" fill="red">K</text>
   <text transform="rotate(110.769 150 150)" x="189" y="141" font-size="12" fill="red">L</text>
   <text transform="rotate(124.615 150 150)" x="185" y="155" font-size="12" fill="red">M</text>
    <text transform="rotate(138.462 150 150)" x="175" y="166" font-size="12" fill="red">N</text>
    <text transform="rotate(152.308 150 150)" x="168" y="177" font-size="12" fill="red">O</text>
    <text transform="rotate(166.154 150 150)" x="142" y="190" font-size="12" fill="red">P</text>
    <text transform="rotate(180 150 150)" x="125" y="180" font-size="12" fill="red">Q</text>
   <text transform="rotate(193.846 150 150)" x="115" y="172" font-size="12" fill="red">R</text>
    <text transform="rotate(207.692 150 150)" x="105" y="162" font-size="12" fill="red">S</text>
    <text transform="rotate(221.538 150 150)" x="95" y="145" font-size="12" fill="red">T</text>
    <text transform="rotate(235.385 150 150)" x="90" y="130" font-size="12" fill="red">U</text>
    <text transform="rotate(249.231 150 150)" x="90" y="110" font-size="12" fill="red">V</text>
    <text transform="rotate(263.077 150 150)" x="92" y="98" font-size="12" fill="red">W</text>
    <text transform="rotate(276.923 150 150)" x="98" y="85" font-size="12" fill="red">X</text>
    <text transform="rotate(290.769 150 150)" x="105" y="74" font-size="12" fill="red">Y</text>
     <text transform="rotate(304.615 150 150)" x="114" y="64" font-size="12" fill="red">Z</text>
    <text transform="rotate(318.462 150 150)" x="125" y="58" font-size="12" fill="red">A</text>
     <text transform="rotate(332.308 150 150)" x="135" y="52" font-size="12" fill="red">B</text>
    <text transform="rotate(346.154 150 150)" x="135" y="52" font-size="12" fill="red">C</text>

  <!-- Arrow showing shift -->
  <line x1="145" y1="50" x2="145" y2="70" stroke="blue" stroke-width="3" marker-end="url(#arrowhead)"/>
     <text x="160" y="65" font-size="14" fill="blue">+3</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="blue" />
    </marker>
  </defs>
</svg>
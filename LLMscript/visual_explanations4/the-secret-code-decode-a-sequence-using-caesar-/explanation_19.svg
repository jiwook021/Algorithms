<svg width="400" height="220" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#eee" />
  <text x="20" y="30" font-size="16" font-weight="bold">10. Combined Encoding (Example)</text>
  <text x="20" y="60">Original: Hello</text>
  <text x="20" y="80">1. Caesar (key=2): Jgnnq</text>
  <text x="20" y="100">2. XOR (key='K'):  (binary XOR)</text>
   <text x="20" y="120">Result (binary) will vary depending on 'K'.</text>
  <text x="20" y="140">3. Base64: (Encode XOR result)</text>
    <text x="20" y="170">Final Encoded Output:  (Base64 string)</text>
      <text x="20" y="190">Decoding requires reversing *all* steps.</text>
</svg>
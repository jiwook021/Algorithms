<svg width="300" height="250" viewBox="0 0 300 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="250" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">XOR: Truth Table</text>

  <rect x="50" y="50" width="200" height="150" fill="white" stroke="black" />

  <text x="70" y="80">Input A</text>
  <text x="140" y="80">Input B</text>
  <text x="210" y="80">Output</text>

  <line x1="50" y1="90" x2="250" y2="90" stroke="black" />

  <text x="80" y="110">0</text>
  <text x="150" y="110">0</text>
  <text x="220" y="110">0</text>

  <text x="80" y="140">0</text>
  <text x="150" y="140">1</text>
  <text x="220" y="140">1</text>

  <text x="80" y="170">1</text>
  <text x="150" y="170">0</text>
  <text x="220" y="170">1</text>

  <text x="80" y="200">1</text>
  <text x="150" y="200">1</text>
  <text x="220" y="200">0</text>
</svg>
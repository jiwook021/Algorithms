<svg width="500" height="250" viewBox="0 0 500 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="250" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">Base64: Encoding Overview</text>

    <text x="20" y="60">1. Input String (ASCII)</text>
    <rect x="20" y="70" width="150" height="30" fill="lightgreen" stroke="black"/>
    <text x="80" y="90">"Man"</text>

    <text x="200" y="60">2. Convert to Binary</text>
    <rect x="200" y="70" width="250" height="30" fill="lightblue" stroke="black"/>
  <text x="220" y="90">01001101 01100001 01101110</text>

    <text x="20" y="130">3. Group into 6-bit chunks</text>
     <rect x="20" y="140" width="430" height="30" fill="lightyellow" stroke="black"/>
    <text x="30" y="160">010011 010110 000101 101110</text>


  <text x="20" y="195">4. Convert to Base64 Characters</text>
  <rect x="20" y="205" width="150" height="30" fill="lightcoral" stroke="black"/>
 <text x="80" y="225">"TWFu"</text>

    <line x1="100" y1="100" x2="100" y2="140" stroke="blue" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="320" y1="100" x2="320" y2="140" stroke="blue" stroke-width="2" marker-end="url(#arrowhead)"/>
     <line x1="220" y1="170" x2="220" y2="205" stroke="blue" stroke-width="2" marker-end="url(#arrowhead)"/>


  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="blue" />
    </marker>
  </defs>
</svg>
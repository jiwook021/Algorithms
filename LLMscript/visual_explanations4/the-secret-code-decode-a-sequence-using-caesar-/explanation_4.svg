<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">XOR: Bitwise Operation</text>

  <text x="20" y="60">Plaintext:   1 0 1 1 0 0 1 0</text>
  <text x="20" y="90">Key:         0 1 1 0 1 0 0 1</text>
  <text x="20" y="110"  >--------------------------</text>
  <text x="20" y="140">Ciphertext:  1 1 0 1 1 0 1 1</text>

  <line x1="40" y1="70" x2="40" y2="130" stroke="blue" stroke-width="1"  />
    <line x1="70" y1="70" x2="70" y2="130" stroke="blue" stroke-width="1"  />
    <line x1="100" y1="70" x2="100" y2="130" stroke="blue" stroke-width="1"  />
    <line x1="130" y1="70" x2="130" y2="130" stroke="blue" stroke-width="1"  />
    <line x1="160" y1="70" x2="160" y2="130" stroke="blue" stroke-width="1"  />
    <line x1="190" y1="70" x2="190" y2="130" stroke="blue" stroke-width="1" />
    <line x1="220" y1="70" x2="220" y2="130" stroke="blue" stroke-width="1"  />
    <line x1="250" y1="70" x2="250" y2="130" stroke="blue" stroke-width="1"  />

     <text x="280" y="100" font-size="14">XOR is applied bit by bit.</text>

</svg>
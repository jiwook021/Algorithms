<svg width="300" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#eee" />
  <text x="20" y="30" font-size="16" font-weight="bold">4. XOR Encoding: Bitwise</text>
  <text x="20" y="60">Original (A): 01000001</text>
  <text x="20" y="80">Key (K):      01001011</text>
  <text x="20" y="100">Encoded:     00001010 (XOR)</text>
    <text x="20" y="130">C++: char encoded = original ^ key;</text>
</svg>
<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#eee" />
  <text x="20" y="30" font-size="16" font-weight="bold">3. Caesar Cipher: Decoding</text>
  <text x="20" y="60">Encoded: D E F G H</text>
  <text x="20" y="80">Shift (key = 3):</text>
    <line x1="20" y1="90" x2="280" y2="90" stroke="black"/>
  <text x="20" y="110">Decoded: A B C D E</text>
      <text x="20" y="140">C++: char decoded = (encoded - key + 26) % 26 + 'A';</text>
  <text x="20" y="170">(For uppercase, add 26 before modulo for negative shifts)</text>
</svg>
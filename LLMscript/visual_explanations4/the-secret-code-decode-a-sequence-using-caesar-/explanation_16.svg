<svg width="400" height="250" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#eee"/>
    <text x="20" y="30" font-size="16" font-weight="bold">7. Base64 Encoding Example</text>
    <text x="20" y="60">Input: "Man"</text>
    <text x="20" y="80">ASCII: 77 (M), 97 (a), 110 (n)</text>
    <text x="20" y="100">Binary: 01001101 01100001 01101110</text>
    <text x="20" y="120">6-bit groups: 010011 010110 000101 101110</text>
    <text x="20" y="140">Decimal: 19, 22, 5, 46</text>
  <text x="20" y="160">Base64 Table Lookup:</text>
    <text x="20" y="180">19 -> T, 22 -> W, 5 -> F, 46 -> u</text>
    <text x="20" y="210">Encoded: TWFu</text>
</svg>
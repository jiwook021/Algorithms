<svg width="450" height="300" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#eee"/>
    <text x="20" y="30" font-size="16" font-weight="bold">8. Base64 Decoding Example</text>
    <text x="20" y="60">Encoded: TWFu</text>
    <text x="20" y="80">Base64 Table Lookup (Reverse):</text>
    <text x="20" y="100">T -> 19, W -> 22, F -> 5, u -> 46</text>
    <text x="20" y="120">Binary: 010011 010110 000101 101110</text>
    <text x="20" y="140">Combine: 010011010110000101101110</text>
      <text x="20" y="160">8-bit groups: 01001101 01100001 01101110</text>
      <text x="20" y="180">ASCII: 77 (M), 97 (a), 110 (n)</text>
    <text x="20" y="210">Decoded: Man</text>
    <text x="20" y="240" font-size="12">C++ decoding involves reversing the table lookup and bit manipulation.</text>
</svg>
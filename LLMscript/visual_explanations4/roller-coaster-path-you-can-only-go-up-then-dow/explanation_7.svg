<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">Concept 7: Finding the Down-Part</text>
  <text x="20" y="50" font-size="14">From the peak, find the longest descending path.</text>

    <g transform="translate(20, 80)">
        <rect x="0" y="0" width="40" height="40" fill="#ccddff" stroke="black"/>
        <text x="20" y="25" text-anchor="middle" dominant-baseline="middle" font-size="16">9</text>
        <rect x="40" y="0" width="40" height="40" fill="#ccddff" stroke="black"/>
        <text x="60" y="25" text-anchor="middle" dominant-baseline="middle" font-size="16">5</text>
        <rect x="80" y="0" width="40" height="40" fill="#ccddff" stroke="black"/>
        <text x="100" y="25" text-anchor="middle" dominant-baseline="middle" font-size="16">2</text>
        <rect x="120" y="0" width="40" height="40" fill="#ccddff" stroke="black"/>
        <text x="140" y="25" text-anchor="middle" dominant-baseline="middle" font-size="16">4</text>
        <rect x="0" y="40" width="40" height="40" fill="#ccddff" stroke="black"/>
        <text x="20" y="65" text-anchor="middle" dominant-baseline="middle" font-size="16">7</text>
        <rect x="40" y="40" width="40" height="40" fill="#ccddff" stroke="black"/>
        <text x="60" y="65" text-anchor="middle" dominant-baseline="middle" font-size="16">3</text>
        <rect x="80" y="40" width="40" height="40" fill="#ccddff" stroke="black"/>
        <text x="100" y="65" text-anchor="middle" dominant-baseline="middle" font-size="16">1</text>

        <circle cx="20" cy="25" r="10" fill="red"/>
        <text x="20" y="25" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="white">Peak</text>
        <path d="M 20 25 L 60 25 L 100 25" stroke="green" stroke-width="4" fill="none"/>
        <text x="70" y="-5" font-size="14" fill="green">Longest Down Path</text>

        <path d="M 20 25 L 60 65 L 100 65" stroke="orange" stroke-width="2" fill="none" stroke-dasharray="3,3"/>
          <text x="70" y="90" font-size="12" fill="orange">Shorter Down Path</text>
    </g>
</svg>
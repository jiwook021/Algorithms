<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">Concept 2: Valid Moves</text>
  <text x="20" y="50" font-size="14">Only up or down moves are allowed (no diagonal).</text>

  <g transform="translate(50, 80)">
    <rect x="40" y="40" width="40" height="40" fill="#ccddff" stroke="black"/>
    <text x="60" y="65" text-anchor="middle" dominant-baseline="middle" font-size="16">5</text>
    <path d="M 60 65 L 60 25" stroke="green" stroke-width="3" marker-end="url(#arrowhead)"/>
      <text x="75" y="35" font-size="12" fill="green">Up</text>
    <path d="M 60 65 L 60 105" stroke="red" stroke-width="3"  marker-end="url(#arrowhead)"/>
      <text x="75" y="105" font-size="12" fill="red">Down</text>
    <path d="M 60 65 L 20 65" stroke="gray" stroke-width="2"  marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
      <text x="20" y="80" font-size="12" fill="gray">Left (Not Allowed)</text>
     <path d="M 60 65 L 100 65" stroke="gray" stroke-width="2"  marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
      <text x="105" y="80" font-size="12" fill="gray">Right (Not Allowed)</text>

  </g>
     <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
    refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="currentColor" />
    </marker>
  </defs>
</svg>
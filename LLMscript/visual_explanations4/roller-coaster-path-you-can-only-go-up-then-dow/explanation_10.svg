<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">Concept 10: Final Result</text>
  <text x="20" y="50" font-size="14">The maximum value of (up[i][j] + down[i][j] - 1) across all cells is the answer.</text>

  <g transform="translate(50, 80)">
        <rect x="0" y="0" width="40" height="40" fill="#ccddff" stroke="black"/>
        <text x="20" y="25" text-anchor="middle" dominant-baseline="middle" font-size="16">2</text>
        <rect x="40" y="0" width="40" height="40" fill="#ccddff" stroke="black"/>
        <text x="60" y="25" text-anchor="middle" dominant-baseline="middle" font-size="16">5</text>
        <rect x="80" y="0" width="40" height="40" fill="#ccddff" stroke="black"/>
        <text x="100" y="25" text-anchor="middle" dominant-baseline="middle" font-size="16">7</text>
        <rect x="120" y="0" width="40" height="40" fill="#ccddff" stroke="black"/>
        <text x="140" y="25" text-anchor="middle" dominant-baseline="middle" font-size="16">4</text>
        <rect x="160" y="0" width="40" height="40" fill="#ccddff" stroke="black"/>
        <text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-size="16">1</text>

      <text x="20" y="55"  font-size="10">1+1-1=1</text>
      <text x="60" y="55"  font-size="10">2+1-1=2</text>
      <text x="100" y="55"  font-size="10">3+3-1=5</text>
     <text x="140" y="55" font-size="10">1+2-1=2</text>
     <text x="180" y="55" font-size="10">1+1-1=1</text>

  </g>

 <text x="50" y="160" font-size="16" fill="green" font-weight="bold">Longest Path Length: 5</text>
</svg>
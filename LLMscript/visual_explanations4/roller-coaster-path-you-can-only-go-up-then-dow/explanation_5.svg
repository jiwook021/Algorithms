    <rect x="40" y="0" width="40" height="40" fill="#ccddff" stroke="black"/>
    <text x="60" y="25" text-anchor="middle" dominant-baseline="middle" font-size="16">7</text>
    <rect x="80" y="0" width="40" height="40" fill="#ccddff" stroke="black"/>
    <text x="100" y="25" text-anchor="middle" dominant-baseline="middle" font-size="16">3</text>
    <rect x="0" y="40" width="40" height="40" fill="#ccddff" stroke="black"/>

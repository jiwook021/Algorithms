  <rect width="100%" height="100%" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">Concept 5: Starting Point</text>
  <text x="20" y="50" font-size="14">The path can start from any cell in the grid.</text>


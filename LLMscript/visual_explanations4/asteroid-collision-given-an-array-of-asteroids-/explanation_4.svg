<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">4. Collision Outcome: Larger Survives</text>

  <circle cx="80" cy="80" r="20" fill="blue" />
  <text x="70" y="85" font-size="12" fill="white">5</text>
  <path d="M105 80 L135 80" stroke="black" stroke-width="2" marker-end="url(#arrowhead)" />

  <circle cx="200" cy="80" r="10" fill="red" />
  <text x="195" y="85" font-size="12" fill="white">-2</text>
  <path d="M175 80 L145 80" stroke="black" stroke-width="2" marker-end="url(#arrowhead)" />

    <text x="140" y="120" font-size="20">=</text>

   <circle cx="280" cy="120" r="20" fill="blue" />
    <text x="270" y="125" font-size="12" fill="white">5</text>
 <path d="M305 120 L335 120" stroke="black" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="20" y="170" font-size="12" fill="gray">The larger asteroid (5) destroys the smaller one (-2).</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
    refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
</svg>
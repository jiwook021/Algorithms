<svg width="400" height="180" viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg">
    <rect width="400" height="180" fill="#f0f0f0" />
    <text x="20" y="20" font-size="16" font-weight="bold">7. Using a Stack</text>

    <rect x="50" y="50" width="60" height="20" fill="lightblue" stroke="black"/>
    <text x="80" y="65" text-anchor="middle" font-size="12">5</text>
    <rect x="50" y="70" width="60" height="20" fill="lightblue" stroke="black"/>
    <text x="80" y="85" text-anchor="middle" font-size="12">10</text>
    <rect x="50" y="90" width="60" height="20" fill="lightblue" stroke="black"/>
    <text x="80" y="105" text-anchor="middle" font-size="12">-5</text>

     <text x="20" y="140" font-size="12" fill="gray">Push to stack if right-moving or stack is empty.</text>
      <text x="20" y="160" font-size="12" fill="gray">Compare with top if left-moving.</text>

    <text x="180" y="80" font-size="20" >Stack</text>


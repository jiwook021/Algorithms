<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">8. Example: [5, 10, -5]</text>
  <text x="20" y="50" font-size="14">Initial: [5, 10, -5]</text>

  <text x="20" y="70" font-size="14">Stack: [5]</text>
    <text x="20" y="90" font-size="14">Stack: [5, 10]</text>
    <text x="20" y="110" font-size="14">10 > abs(-5), so -5 is destroyed.</text>
    <text x="20" y="130" font-size="14">Stack: [5, 10]</text>

  <text x="20" y="170" font-size="14" fill="green">Result: [5, 10]</text>
</svg>
<svg width="400" height="150" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="150" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">2. Movement Direction</text>
  <circle cx="80" cy="80" r="15" fill="blue" />
  <text x="75" y="85" font-size="12" fill="white">5</text>
  <path d="M100 80 L130 80" stroke="black" stroke-width="2" marker-end="url(#arrowhead)" />

  <circle cx="250" cy="80" r="10" fill="red" />
  <text x="245" y="85" font-size="12" fill="white">-2</text>
    <path d="M230 80 L200 80" stroke="black" stroke-width="2" marker-end="url(#arrowhead)" />

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
    refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>

  <text x="80" y="120" font-size="14" text-anchor="middle" >Rightward</text>
   <text x="250" y="120" font-size="14" text-anchor="middle" >Leftward</text>
</svg>
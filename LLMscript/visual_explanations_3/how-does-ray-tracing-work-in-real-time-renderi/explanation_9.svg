<svg width="400" height="300" viewport="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f0f0f0" />

  <circle cx="50" cy="150" r="10" fill="blue" />
  <text x="40" y="180" font-size="10">Eye</text>

  <circle cx="250" cy="150" r="40" fill="green" />
    <text x="240" y="140" font-size="12">Object</text>

   <circle cx="350" cy="50" r="10" fill="yellow" />
  <text x="340" y="40" font-size="10">Light</text>

    <line x1="60" y1="150" x2="215" y2="135" stroke="red" stroke-width="2" />
    <polygon points="205,130 215,135 205,140" fill="red"/>
  <circle cx="215" cy="135" r="5" fill="purple" />
    <text x="185" y="105" font-size="10">Hit Point</text>

    <line x1="215" y1="135" x2="350" y2="50" stroke="orange" stroke-width="2" />
    <polygon points="340,45 350,50 340,55" fill="orange"/>

  <text x="100" y="50" font-size="14">Shading (Color Calculation)</text>
  <text x="215" y="120" font-size="8">Normal</text>
   <line x1="215" y1="135" x2="215" y2="100" stroke="black" stroke-width="1"/>

</svg>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">10. Homography Estimation (with RANSAC)</text>

   <polygon points="50,60 150,70 130,150 60,140" fill="none" stroke="blue" stroke-width="2"/>
    <text x="80" y="170" font-size="14">Object 1</text>

  <polygon points="250,80 350,60 370,140 270,160" fill="none" stroke="green" stroke-width="2"/>
   <text x="280" y="180" font-size="14">Object 2</text>

   <line x1="50" y1="60" x2="250" y2="80" stroke="red" />
    <line x1="150" y1="70" x2="350" y2="60" stroke="red" />
     <line x1="130" y1="150" x2="370" y2="140" stroke="red" />
      <line x1="60" y1="140" x2="270" y2="160" stroke="red" />

  <text x="20" y="220" font-size="14">Finds the geometric transformation (homography).</text>
  <text x="20" y="240" font-size="14">Relates corresponding points between images.</text>
    <text x="20" y="260" font-size="14">Allows for image stitching, object recognition, etc.</text>
</svg>
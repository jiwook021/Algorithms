  <line x1="100" y1="85" x2="250" y2="85" stroke="red" />
  <line x1="100" y1="85" x2="250" y2="145" stroke="grey" stroke-dasharray="4" />
    <line x1="100" y1="85" x2="250" y2="205" stroke="grey" stroke-dasharray="4" />


    <text x="100" y1="230" font-size="14">Compares each descriptor in set 1</text>

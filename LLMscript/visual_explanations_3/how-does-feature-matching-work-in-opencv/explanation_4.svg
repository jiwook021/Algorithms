<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">4. Brute-Force Matching</text>

  <g transform="translate(50,60)">
    <rect width="50" height="50" fill="none" stroke="blue" stroke-width="2" />
    <text x="10" y="30" font-size="12">D1</text>
    <rect y="60" width="50" height="50" fill="none" stroke="blue" stroke-width="2" />
    <text x="10" y="90" font-size="12">D2</text>
    <rect y="120" width="50" height="50" fill="none" stroke="blue" stroke-width="2" />
     <text x="10" y="150" font-size="12">D3</text>
  </g>

  <g transform="translate(250,60)">
    <rect width="50" height="50" fill="none" stroke="green" stroke-width="2" />
    <text x="10" y="30" font-size="12">D4</text>
    <rect y="60" width="50" height="50" fill="none" stroke="green" stroke-width="2" />
      <text x="10" y="90" font-size="12">D5</text>

<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">9. RANSAC (RANdom SAmple Consensus)</text>

  <g transform="translate(50,60)">
        <circle cx="10" cy="20" r="3" fill="blue" />
        <circle cx="25" cy="50" r="3" fill="blue" />
        <circle cx="40" cy="10" r="3" fill="blue" />
          <circle cx="5" cy="70" r="3" fill="blue" />
    </g>
     <g transform="translate(250,60)">
        <circle cx="10" cy="22" r="3" fill="green" />
        <circle cx="25" cy="52" r="3" fill="green" />
        <circle cx="40" cy="12" r="3" fill="green" />
           <circle cx="5" cy="90" r="3" fill="green" />
    </g>

     <line x1="60" y1="80" x2="260" y2="82" stroke="red" />
      <line x1="75" y1="110" x2="275" y2="112" stroke="red" />
       <line x1="90" y1="70" x2="290" y2="72" stroke="red" />
        <line x1="55" y1="130" x2="255" y2="150" stroke="grey" stroke-dasharray="3"/>

  <text x="20" y="200" font-size="14">Robustly estimates a model (e.g., homography).</text>
  <text x="20" y="220" font-size="14">Handles outliers (incorrect matches).</text>
  <text x="20" y="240" font-size="14">Iteratively selects random subsets of matches.</text>
</svg>
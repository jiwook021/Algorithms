<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">3. Descriptor Matching</text>

  <rect x="50" y="60" width="80" height="60" fill="none" stroke="blue" stroke-width="2" />
  <text x="70" y="140" font-size="14">Descriptor 1</text>

  <rect x="250" y="60" width="80" height="60" fill="none" stroke="green" stroke-width="2" />
  <text x="270" y="140" font-size="14">Descriptor 2</text>
    <line x1="130" y1="90" x2="250" y2="90" stroke="red" stroke-width="2"/>
    <text x="170" y="70" font-size="16" fill="red">Match</text>

  <text x="20" y="200" font-size="14">Compares descriptors from the two images.</text>
  <text x="20" y="220" font-size="14">Uses a distance metric (e.g., Euclidean distance).</text>
  <text x="20" y="240" font-size="14">Finds the closest match for each descriptor.</text>
</svg>
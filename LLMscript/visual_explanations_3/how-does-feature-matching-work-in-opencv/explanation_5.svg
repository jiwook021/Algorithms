<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">5. FLANN Matching</text>

  <circle cx="80" cy="100" r="5" fill="blue" />
    <circle cx="100" cy="80" r="5" fill="blue" />
  <circle cx="120" cy="120" r="5" fill="blue" />

  <circle cx="280" cy="100" r="5" fill="green" />
  <circle cx="300" cy="80" r="5" fill="green" />
   <circle cx="320" cy="120" r="5" fill="green" />

  <line x1="80" y1="100" x2="280" y2="100" stroke="red" />
    <line x1="100" y1="80" x2="300" y2="80" stroke="red" />
      <line x1="120" y1="120" x2="320" y2="120" stroke="red" />

  <text x="20" y="200" font-size="14">Uses approximate nearest neighbors.</text>
  <text x="20" y="220" font-size="14">Faster than brute-force for large datasets.</text>
    <text x="20" y="240" font-size="14">FLANN: Fast Library for Approximate Nearest Neighbors</text>
</svg>
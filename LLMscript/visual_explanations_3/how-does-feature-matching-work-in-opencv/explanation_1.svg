    <rect x="50" y="60" width="100" height="100" style="fill:none;stroke:blue;stroke-width:2"/>
  <text x="70" y="180" font-size="14">Image 1</text>
   <circle cx="80" cy="90" r="5" fill="red" />
    <circle cx="120" cy="130" r="5" fill="red" />
      <circle cx="100" cy="70" r="5" fill="red" />

  <image x="250" y="60" width="100" height="100" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" /> <!-- Placeholder for image 2 -->

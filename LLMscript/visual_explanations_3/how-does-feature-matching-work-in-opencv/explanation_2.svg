<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">2. Feature Description</text>

  <circle cx="80" cy="100" r="10" fill="blue" />
  <text x="60" y="130" font-size="14">Keypoint</text>

  <rect x="120" y="80" width="100" height="80" fill="none" stroke="green" stroke-width="2" />
  <text x="130" y="180" font-size="14">Descriptor</text>
  <text x="130" y="200" font-size="12">(e.g., SIFT descriptor -</text>
   <text x="130" y="215" font-size="12"> 128-dimensional vector)</text>
  <text x="20" y="250" font-size="14">Each keypoint is described by a feature vector.</text>
  <text x="20" y="270" font-size="14">This vector encodes the local image appearance.</text>
</svg>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="400" height="300" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">2. Flash Memory Layout</text>

  <rect x="50" y="60" width="300" height="40" fill="#add8e6" />
  <text x="60" y="85" font-size="12">Bootloader (e.g., 0x08000000)</text>

  <rect x="50" y="110" width="300" height="100" fill="#90ee90" />
  <text x="60" y="160" font-size="12">Application (e.g., 0x08004000)</text>

  <rect x="50" y="220" width="300" height="30" fill="#ffb6c1" />
   <text x="60" y="240" font-size="12">Reserved/Other</text>
   <text x="300" y="270" font-size="10" text-anchor="end">Flash Memory</text>

  <line x1="350" y1="60" x2="350" y2="250" stroke="black" stroke-width="2" />
</svg>
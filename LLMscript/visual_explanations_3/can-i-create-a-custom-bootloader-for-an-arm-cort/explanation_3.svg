<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="400" height="300" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">3. Vector Table</text>

  <rect x="50" y="60" width="150" height="180" fill="#add8e6" />
  <text x="60" y="80" font-size="12">0x08000000: Stack Pointer</text>
  <text x="60" y="100" font-size="12">0x08000004: Reset Handler</text>
  <text x="60" y="120" font-size="12">0x08000008: NMI Handler</text>
  <text x="60" y="140" font-size="12">...</text>
  <text x="60" y="160" font-size="12">0x080000XX: IRQ Handlers</text>
 <text x="100" y="220" font-size="10" text-anchor="middle">Bootloader Vector Table</text>

  <rect x="220" y="60" width="150" height="180" fill="#90ee90" />
    <text x="230" y="80" font-size="12">0x08004000: Stack Pointer</text>
  <text x="230" y="100" font-size="12">0x08004004: Reset Handler</text>
  <text x="230" y="120" font-size="12">0x08004008: NMI Handler</text>
   <text x="230" y="140" font-size="12">...</text>
   <text x="230" y="160" font-size="12">0x080040XX: IRQ Handlers</text>
   <text x="290" y="220" font-size="10" text-anchor="middle">Application Vector Table</text>
</svg>
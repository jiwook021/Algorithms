<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="400" height="300" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">1. Why a Custom Bootloader?</text>

  <rect x="20" y="50" width="100" height="80" fill="#add8e6" />
  <text x="30" y="90" font-size="12">Application</text>

  <rect x="150" y="50" width="100" height="80" fill="#90ee90" />
  <text x="160" y="90" font-size="12">Default</text>
  <text x="160" y="110" font-size="12">Bootloader</text>

  <rect x="280" y="50" width="100" height="80" fill="#ffb6c1" />
  <text x="290" y="90" font-size="12">Custom</text>
  <text x="290" y="110" font-size="12">Bootloader</text>

  <text x="20" y="160" font-size="14">Benefits:</text>
  <text x="20" y="180" font-size="12">- Firmware updates (OTA)</text>
  <text x="20" y="200" font-size="12">- Secure boot</text>
  <text x="20" y="220" font-size="12">- Custom initialization</text>
  <text x="20" y="240" font-size="12">- Multiple applications</text>
</svg>
  <text x="70" y="80" text-anchor="middle" font-size="12">Compiler</text>
 <text x="70" y="95" text-anchor="middle" font-size="10">(GCC, Keil, IAR)</text>

  <rect x="150" y="60" width="80" height="40" fill="#90ee90" />
  <text x="190" y="80" text-anchor="middle" font-size="12">Linker</text>
  <text x="190" y="95" text-anchor="middle" font-size="10">Script</text>

  <rect x="270" y="60" width="80" height="40" fill="#ffb6c1" />
  <text x="310" y="80" text-anchor="middle" font-size="12">Debugger</text>

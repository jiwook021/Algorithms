<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="400" height="300" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">4. Reset Handler Flow</text>

  <circle cx="70" cy="70" r="20" fill="#add8e6" />
  <text x="70" y="75" text-anchor="middle" font-size="12">Reset</text>

  <line x1="70" y1="90" x2="70" y2="120" stroke="black" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="40" y="120" width="60" height="40" fill="#90ee90" />
  <text x="70" y="145" text-anchor="middle" font-size="12">Initialize</text>
  <text x="70" y="160" text-anchor="middle" font-size="10">Hardware</text>
    

  <line x1="70" y1="160" x2="70" y2="190" stroke="black" stroke-width="2" marker-end="url(#arrowhead)" />

 <rect x="20" y="190" width="100" height="40" fill="#ffb6c1" />
  <text x="70" y="215" text-anchor="middle" font-size="12">Check for</text>
    <text x="70" y="230" text-anchor="middle" font-size="12">Update Flag</text>

  <line x1="70" y1="230" x2="70" y2="260" stroke="black" stroke-width="2" marker-end="url(#arrowhead)" />
 <rect x="20" y="260" width="100" height="30" fill="#ffff99" />
  <text x="70" y="278" text-anchor="middle" font-size="12">Jump to App</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
  </defs>
</svg>
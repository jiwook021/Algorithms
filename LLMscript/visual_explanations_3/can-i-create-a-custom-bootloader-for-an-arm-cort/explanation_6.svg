  <line x1="150" y1="100" x2="250" y2="100" stroke="black" stroke-width="2" />
  <text x="200" y="90" text-anchor="middle" font-size="14">UART</text>
    <line x1="150" y1="140" x2="250" y2="140" stroke="black" stroke-width="2" />

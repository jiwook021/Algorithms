<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Timeline -->
    <rect x="20" y="150" width="360" height="10" fill="gray"/>

    <!-- Register -->
      <rect x="50" y="80" width="60" height="30" fill="#ADD8E6" />
  <text x="55" y="100">Register</text>
    <rect x="50" y="145" width="60" height="20" fill="blue" />

    <!-- Shared Memory -->
  <rect x="150" y="80" width="100" height="30" fill="#90EE90" />
    <text x="160" y="100">Shared Memory</text>
    <rect x="150" y="145" width="100" height="20" fill="blue" />

    <!-- Global Memory -->
      <rect x="280" y="80" width="80" height="30" fill="#FFB6C1" />
    <text x="285" y="100">Global Memory</text>
    <rect x="20" y="145" width="360" height="20" fill="blue" />

    <!-- Labels -->
    <text x="50" y="60" font-size="12">Thread Execution</text>
    <text x="170" y="60" font-size="12">Block Execution</text>
    <text x="280" y="60" font-size="12">Kernel Execution</text>
      <text x="20" y="280" font-size="14" fill="black">Lifetime: Registers (thread), Shared (block), Global (kernel).</text>
</svg>
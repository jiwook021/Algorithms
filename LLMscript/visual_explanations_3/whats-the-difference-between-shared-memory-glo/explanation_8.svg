<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="50" y="50" width="100" height="200" fill="none" stroke="black" />
    <text x="75" y="40">Thread</text>

    <!-- Register representation -->
    <rect x="70" y="70" width="60" height="30" fill="#ADD8E6" />
    <text x="80" y="90">int x = 5;</text>

    <rect x="70" y="120" width="60" height="30" fill="#ADD8E6" />
     <text x="80" y="140">float y = 3.14;</text>

    <rect x="70" y="170" width="60" height="30" fill="#ADD8E6" />
    <text x="80" y="190">char z = 'A';</text>

    <text x="180" y="140" font-size="14">Registers store local variables</text>
      <text x="180" y="160" font-size="14">within a thread's execution.</text>

         <text x="20" y="280" font-size="14" fill="black">Variables declared within a kernel are typically stored in registers.</text>

</svg>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="50" y="50" width="100" height="50" fill="#ADD8E6" stroke="black" />  <!-- Registers -->
  <text x="75" y="80" font-size="14" fill="black">Registers</text>
  <text x="55" y="100" font-size="12" fill="black">(Per-Thread)</text>

  <rect x="200" y="50" width="150" height="75" fill="#90EE90" stroke="black" />  <!-- Shared Memory -->
  <text x="230" y="90" font-size="14" fill="black">Shared Memory</text>
  <text x="220" y="110" font-size="12" fill="black">(Per-Thread Block)</text>
  
    <rect x="125" y="175" width="200" height="100" fill="#FFB6C1" stroke="black" />  <!-- Global memory -->
  <text x="185" y="225" font-size="14" fill="black">Global Memory</text>
    <text x="195" y="245" font-size="12" fill="black">(All Blocks)</text>


  <text x="100" y="20" font-size="16" fill="black">CUDA Memory Hierarchy</text>
</svg>
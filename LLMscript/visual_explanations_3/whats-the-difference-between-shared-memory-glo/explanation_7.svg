<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- CPU Memory -->
  <rect x="50" y="50" width="100" height="200" fill="#D3D3D3" stroke="black"/>
  <text x="70" y="150" font-size="14">CPU Memory</text>
 <line x1="150" y1="100" x2="200" y2="100" stroke="green" stroke-width="3" marker-end="url(#arrowhead)" />
 <line x1="150" y1="200" x2="200" y2="200" stroke="purple" stroke-width="3" marker-end="url(#arrowhead)" />
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="0" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" />
        </marker>
    </defs>
  <!-- GPU and Global Memory -->
  <rect x="200" y="50" width="150" height="200" fill="none" stroke="black"/>
    <text x="250" y="40">GPU</text>
  <rect x="220" y="80" width="110" height="60" fill="#FFB6C1"/>
      <text x="230" y="110" font-size="14">Global Memory</text>
  <rect x="220" y="160" width="110" height="60" fill="#FFB6C1"/>
  <text x="230" y="190" font-size="14">Global Memory</text>

  <text x="160" y="90" font-size="12" fill="green">Input Data</text>
   <text x="155" y="190" font-size="12" fill="purple">Output Data</text>

     <text x="20" y="280" font-size="14" fill="black">Data transfer between CPU and GPU via global memory.</text>
</svg>
<svg width="400" height="200" viewport="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="400" height="200" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">I2C Basics: Master and Slave</text>

  <!-- Master -->
  <rect x="50" y="70" width="80" height="60" fill="#a0c4ff" stroke="black" />
  <text x="65" y="100" font-size="12">Master</text>

  <!-- Slave 1 -->
  <rect x="200" y="70" width="80" height="60" fill="#ffdac1" stroke="black" />
  <text x="215" y="100" font-size="12">Slave 1</text>

    <!-- Slave 2 -->
  <rect x="300" y="70" width="80" height="60" fill="#ffdac1" stroke="black" />
  <text x="315" y="100" font-size="12">Slave 2</text>

  <!-- SDA Line -->
  <line x1="50" y1="150" x2="380" y2="150" stroke="blue" stroke-width="2" />
  <text x="180" y="165" font-size="10">SDA</text>

  <!-- SCL Line -->
  <line x1="50" y1="170" x2="380" y2="170" stroke="green" stroke-width="2" />
  <text x="180" y="185" font-size="10">SCL</text>

    <text x="20" y="50" font-size="12">Multiple devices share the same bus (SDA and SCL).</text>
</svg>
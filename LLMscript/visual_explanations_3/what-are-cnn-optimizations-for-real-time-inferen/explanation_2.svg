<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">2. Pruning</text>

  <rect x="50" y="70" width="200" height="100" fill="#FFC107" stroke="black" stroke-width="1"/>
    <line x1="70" y1="90" x2="230" y2="150" stroke="grey" stroke-width="0.5"/>
    <line x1="70" y1="110" x2="180" y2="80" stroke="grey" stroke-width="0.5"/>
    <line x1="100" y1="150" x2="190" y2="90" stroke="grey" stroke-width="0.5"/>
        <line x1="100" y1="150" x2="190" y2="90" stroke="#e53935" stroke-width="3"/>
   <line x1="70" y1="110" x2="180" y2="80" stroke="#e53935" stroke-width="3"/>

  <text x="70" y="190" font-size="12">Removes less important connections (weights)</text>
   <text x="70" y="210" font-size="12">Reduces model size and computation.</text>


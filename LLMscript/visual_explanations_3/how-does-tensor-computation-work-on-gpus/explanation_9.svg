<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="400" fill="#f0f0f0" />
  <text x="20" y="30" font-size="24" font-weight="bold">9. GPU Libraries (cuBLAS, cuDNN)</text>

  <!-- Library Box (cuBLAS) -->
  <g transform="translate(50,80)">
      <rect width="150" height="100" fill="#add8e6" stroke="black" />
      <text x="40" y="50" font-size="18">cuBLAS</text>
       <text x="10" y="80" font-size="14">(Basic Linear Algebra)</text>
       <text x="10" y="100" font-size="12">- Matrix Multiplication</text>
       <text x="10" y="120" font-size="12">- Vector Operations</text>
  </g>
  <!-- Library Box (cuDNN) -->
  <g transform="translate(250,80)">
      <rect width="150" height="100" fill="#90ee90" stroke="black" />
        <text x="40" y="50" font-size="18">cuDNN</text>
        <text x="10" y="80" font-size="14">(Deep Neural Networks)</text>
        <text x="10" y="100" font-size="12">- Convolutions</text>
       <text x="10" y="120" font-size="12">- Pooling</text>
  </g>

  <!-- GPU -->
 <rect x="450" y="80" width="100" height="100" fill="#baffc9" stroke="black" />
   <text x="480" y="130" font-size="18">GPU</text>

<!-- Arrows -->
   <polygon points="205,130 240,130" fill="black" />
   <polygon points="235,125 245,130 235,135" fill="black" />

    <polygon points="405,130 440,130" fill="black" />
   <polygon points="435,125 445,130 435,135" fill="black" />

  <text x="20" y="250" font-size="14">Optimized libraries provide pre-built functions.</text>
  <text x="20" y="270" font-size="14">Leverage highly tuned implementations for common operations.</text>
    <text x="20" y="290" font-size="14">Avoid writing low-level CUDA code when possible.</text>
</svg>
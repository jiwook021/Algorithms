<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="10" width="80" height="80" fill="lightblue" stroke="black"/>
  <text x="20" y="50" font-size="14">CPU</text>
  <rect x="150" y="10" width="80" height="80" fill="lightgreen" stroke="black"/>
  <text x="160" y="50" font-size="14">GPU</text>
  <text x="20" y="120" font-size="16">Tensor Computation:</text>
  <text x="20" y="150" font-size="14">CPU: Sequential</text>
    <text x="20" y="170" font-size="14">GPU: Massively Parallel</text>
  <line x1="100" y1="50" x2="140" y2="50" stroke="black" marker-end="url(#arrowhead)"/>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
    refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="400" fill="#f0f0f0" />
  <text x="20" y="30" font-size="24" font-weight="bold">4. CUDA Cores and Threads</text>

  <!-- GPU Grid -->
  <rect x="50" y="80" width="250" height="200" fill="#90ee90" stroke="black" />
    <text x="150" y="70" font-size="18">GPU</text>

  <!-- CUDA Cores (Represented as small squares) -->
  <g transform="translate(60,90)">
     <g>
        <rect width="15" height="15" fill="#32cd32" stroke="black" />
        <text x="2" y="12" font-size="8">Core</text>
    </g>
    <g transform="translate(20,0)">
        <rect width="15" height="15" fill="#32cd32" stroke="black" />
          <text x="2" y="12" font-size="8">Core</text>
    </g>
       <g transform="translate(40,0)">
        <rect width="15" height="15" fill="#32cd32" stroke="black" />
          <text x="2" y="12" font-size="8">Core</text>
    </g>

    <g transform="translate(0,20)">
        <rect width="15" height="15" fill="#32cd32" stroke="black" />
          <text x="2" y="12" font-size="8">Core</text>
    </g>
    <g transform="translate(20,20)">
        <rect width="15" height="15" fill="#32cd32" stroke="black" />
          <text x="2" y="12" font-size="8">Core</text>
    </g>
       <g transform="translate(40,20)">
        <rect width="15" height="15" fill="#32cd32" stroke="black" />
          <text x="2" y="12" font-size="8">Core</text>
    </g>
    <!-- Add more cores as needed -->
  </g>

  <!-- Threads (Illustrative) -->
  <g transform="translate(350, 80)">
    <rect width="40" height="40" fill="#baffc9" stroke="black" />
    <text x="5" y="25" font-size="12">Thread Block</text>
      <line x1="10" y1="30" x2="30" y2="30" stroke="red" />
    <line x1="10" y1="30" x2="10" y2="10" stroke="red" />
    <text x="12" y="25" font-size="8" fill="red">Thread</text>
  </g>
    <g transform="translate(350, 130)">
    <rect width="40" height="40" fill="#baffc9" stroke="black" />
    <text x="5" y="25" font-size="12">Thread Block</text>
      <line x1="10" y1="30" x2="30" y2="30" stroke="red" />
    <line x1="10" y1="30" x2="10" y2="10" stroke="red" />
    <text x="12" y="25" font-size="8" fill="red">Thread</text>
  </g>

  <text x="20" y="320" font-size="14">CUDA cores execute many threads concurrently.</text>
  <text x="20" y="340" font-size="14">Threads are grouped into blocks.</text>
  <text x="20" y="360" font-size="14">Each thread executes the same instruction (SIMT).</text>
</svg>
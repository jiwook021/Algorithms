<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
    <text x="20" y="30" font-size="16">3. Parallel Matrix Multiplication</text>
    <text x="20" y="60" font-size="14">Matrix A (2x3)</text>
    <g transform="translate(20, 80)">
        <rect width="20" height="20" fill="lightcoral" stroke="black"/>
        <text x="8" y="15">a11</text>
        <rect x="20" width="20" height="20" fill="lightcoral" stroke="black"/>
        <text x="28" y="15">a12</text>
        <rect x="40" width="20" height="20" fill="lightcoral" stroke="black"/>
         <text x="48" y="15">a13</text>
        <rect y="20" width="20" height="20" fill="lightcoral" stroke="black"/>
        <text x="8" y="35">a21</text>
         <rect x="20" y="20" width="20" height="20" fill="lightcoral" stroke="black"/>
        <text x="28" y="35">a22</text>
        <rect x="40" y="20" width="20" height="20" fill="lightcoral" stroke="black"/>
        <text x="48" y="35">a23</text>
    </g>

    <text x="120" y="100" font-size="18">x</text>

     <text x="150" y="60" font-size="14">Matrix B (3x2)</text>
     <g transform="translate(150, 80)">
       <rect width="20" height="20" fill="lightblue" stroke="black"/>
       <text x="8" y="15">b11</text>
       <rect x="20" width="20" height="20" fill="lightblue" stroke="black"/>
       <text x="28" y="15">b12</text>

       <rect y="20" width="20" height="20" fill="lightblue" stroke="black"/>
       <text x="8" y="35">b21</text>
       <rect x="20" y="20" width="20" height="20" fill="lightblue" stroke="black"/>
       <text x="28" y="35">b22</text>

       <rect y="40" width="20" height="20" fill="lightblue" stroke="black"/>
       <text x="8" y="55">b31</text>
       <rect x="20" y="40" width="20" height="20" fill="lightblue" stroke="black"/>
        <text x="28" y="55">b32</text>
    </g>
      <text x="230" y="100" font-size="18">=</text>

    <text x="270" y="60" font-size="14">Matrix C (2x2) - GPU</text>
    <g transform="translate(270, 80)">
        <rect width="20" height="20" fill="lightgreen" stroke="black"/>
           <rect x="20" width="20" height="20" fill="lightgreen" stroke="black"/>
        <rect y="20" width="20" height="20" fill="lightgreen" stroke="black"/>
        <rect x="20" y="20" width="20" height="20" fill="lightgreen" stroke="black"/>
    </g>
     <text x="270" y="140" font-size="12">Each element computed</text>
      <text x="270" y="160" font-size="12">in parallel by a core.</text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="400" fill="#f0f0f0" />
  <text x="20" y="30" font-size="24" font-weight="bold">3. Matrix Multiplication</text>

  <!-- Matrix A -->
  <g transform="translate(50,80)">
    <rect width="30" height="30" fill="#add8e6" stroke="black" />
    <rect x="30" width="30" height="30" fill="#add8e6" stroke="black" />
    <rect y="30" width="30" height="30" fill="#add8e6" stroke="black" />
    <rect x="30" y="30" width="30" height="30" fill="#add8e6" stroke="black" />
    <text x="15" y="-10" font-size="16">Matrix A</text>
  </g>

  <!-- Matrix B -->
  <g transform="translate(150,80)">
    <rect width="30" height="30" fill="#90ee90" stroke="black" />
    <rect x="30" width="30" height="30" fill="#90ee90" stroke="black" />
    <rect y="30" width="30" height="30" fill="#90ee90" stroke="black" />
    <rect x="30" y="30" width="30" height="30" fill="#90ee90" stroke="black" />
    <text x="15" y="-10" font-size="16">Matrix B</text>
  </g>

  <!-- Multiplication Symbol -->
  <text x="120" y="120" font-size="30">×</text>

  <!-- Result Matrix C (Illustrative - Showing Parallel Computation) -->
 <g transform="translate(250,80)">
    <rect width="30" height="30" fill="#baffc9" stroke="black" />
     <text x="5" y="20" font-size="10">GPU Core 1</text>
    <rect x="30" width="30" height="30" fill="#baffc9" stroke="black" />
     <text x="35" y="20" font-size="10">GPU Core 2</text>
    <rect y="30" width="30" height="30" fill="#baffc9" stroke="black" />
     <text x="5" y="50" font-size="10">GPU Core 3</text>
    <rect x="30" y="30" width="30" height="30" fill="#baffc9" stroke="black" />
     <text x="35" y="50" font-size="10">GPU Core 4</text>
    <text x="15" y="-10" font-size="16">Matrix C</text>
  </g>

  <text x="20" y="200" font-size="14">Each element of C is computed independently.</text>
   <text x="20" y="220" font-size="14">GPU cores calculate different elements concurrently.</text>
  <text x="20" y="240" font-size="14">C[i,j] = Σ (A[i,k] * B[k,j]) for all k.</text>
</svg>
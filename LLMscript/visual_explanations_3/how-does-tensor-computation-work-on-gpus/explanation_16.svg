<svg width="400" height="230" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="30" font-size="16">6. Kernel Execution</text>
  <rect x="20" y="50" width="100" height="80" fill="lightblue" stroke="black"/>
  <text x="30" y="90" font-size="14">CPU</text>

  <rect x="200" y="50" width="160" height="120" fill="lightgreen" stroke="black"/>
  <text x="210" y="70" font-size="14">GPU</text>
    <text x="220" y="100" font-size="14">Kernel Function</text>
    <text x="220" y="120" font-size="12">(e.g., matrix multiplication)</text>

  <line x1="120" y1="90" x2="200" y2="90" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="130" y="85" font-size="12">Launch Kernel</text>
     <text x="220" y="150" font-size="12">Executed by many</text>
    <text x="220" y="170" font-size="12">threads in parallel.</text>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
    refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
</svg>
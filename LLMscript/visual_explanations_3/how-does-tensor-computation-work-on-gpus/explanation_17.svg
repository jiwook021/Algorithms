<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="30" font-size="16">7. Element-wise Operations</text>
  <text x="20" y="60" font-size="14">Tensor A</text>
  <g transform="translate(20, 80)">
    <rect width="20" height="20" fill="lightcoral" stroke="black"/>
    <text x="8" y="15">1</text>
    <rect x="20" width="20" height="20" fill="lightcoral" stroke="black"/>
    <text x="28" y="15">2</text>
    <rect y="20" width="20" height="20" fill="lightcoral" stroke="black"/>
    <text x="8" y="35">3</text>
    <rect x="20" y="20" width="20" height="20" fill="lightcoral" stroke="black"/>
    <text x="28" y="35">4</text>
  </g>
    <text x="80" y="100" font-size="18">+</text>
  <text x="100" y="60" font-size="14">Tensor B</text>
  <g transform="translate(100, 80)">
      <rect width="20" height="20" fill="lightblue" stroke="black"/>
      <text x="8" y="15">5</text>
      <rect x="20" width="20" height="20" fill="lightblue" stroke="black"/>
      <text x="28" y="15">6</text>
      <rect y="20" width="20" height="20" fill="lightblue" stroke="black"/>
      <text x="8" y="35">7</text>
      <rect x="20" y="20" width="20" height="20" fill="lightblue" stroke="black"/>
      <text x="28" y="35">8</text>
  </g>
    <text x="160" y="100" font-size="18">=</text>

    <text x="190" y="60" font-size="14">Tensor C (GPU)</text>
    <g transform="translate(190,80)">
     <rect width="20" height="20" fill="lightgreen" stroke="black"/>
     <text x="6" y="15">6</text>
     <rect x="20" width="20" height="20" fill="lightgreen" stroke="black"/>
      <text x="26" y="15">8</text>
     <rect y="20" width="20" height="20" fill="lightgreen" stroke="black"/>
      <text x="6" y="35">10</text>
     <rect x="20" y="20" width="20" height="20" fill="lightgreen" stroke="black"/>
      <text x="24" y="35">12</text>

    </g>
      <text x="250" y="100" font-size="12">Each element</text>
      <text x="250" y="120" font-size="12">added in parallel.</text>

</svg>
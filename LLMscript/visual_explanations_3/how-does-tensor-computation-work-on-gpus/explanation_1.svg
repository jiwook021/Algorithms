<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="400" fill="#f0f0f0" />
  <text x="20" y="30" font-size="24" font-weight="bold">1. CPU vs. GPU Structure</text>

  <!-- CPU -->
  <rect x="50" y="80" width="150" height="250" fill="#add8e6" stroke="black" />
  <text x="100" y="110" font-size="18">CPU</text>
  <text x="60" y="140" font-size="14">Few, powerful cores</text>
  <rect x="70" y="160" width="30" height="30" fill="#87ceeb" stroke="black" />
  <rect x="110" y="160" width="30" height="30" fill="#87ceeb" stroke="black" />
  <rect x="70" y="200" width="30" height="30" fill="#87ceeb" stroke="black" />
  <rect x="110" y="200" width="30" height="30" fill="#87ceeb" stroke="black" />


  <!-- GPU -->
  <rect x="350" y="80" width="200" height="250" fill="#90ee90" stroke="black" />
  <text x="420" y="110" font-size="18">GPU</text>
  <text x="360" y="140" font-size="14">Many, smaller cores</text>
  <g transform="translate(370,160)">
    <rect width="20" height="20" fill="#32cd32" stroke="black" />
    <rect x="25" width="20" height="20" fill="#32cd32" stroke="black" />
    <rect x="50" width="20" height="20" fill="#32cd32" stroke="black" />
    <rect x="75" width="20" height="20" fill="#32cd32" stroke="black" />
    <rect x="100" width="20" height="20" fill="#32cd32" stroke="black" />
    <rect y="25" width="20" height="20" fill="#32cd32" stroke="black" />
    <rect x="25" y="25" width="20" height="20" fill="#32cd32" stroke="black" />
    <rect x="50" y="25" width="20" height="20" fill="#32cd32" stroke="black" />
    <rect x="75" y="25" width="20" height="20" fill="#32cd32" stroke="black" />
    <rect x="100" y="25" width="20" height="20" fill="#32cd32" stroke="black" />
    <!-- More cores can be added here to visually represent the large number -->
 </g>

  <text x="20" y="380" font-size="14">GPUs excel at parallel processing, ideal for tensor operations.</text>
</svg>
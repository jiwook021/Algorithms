<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="400" fill="#f0f0f0" />
  <text x="20" y="30" font-size="24" font-weight="bold">5. Memory Hierarchy</text>

  <!-- Global Memory -->
  <rect x="50" y="80" width="150" height="100" fill="#add8e6" stroke="black" />
  <text x="70" y="130" font-size="16">Global Memory</text>
    <text x="70" y="150" font-size="12">(Large, Slow)</text>

  <!-- Shared Memory -->
  <rect x="250" y="80" width="100" height="50" fill="#90ee90" stroke="black" />
  <text x="260" y="110" font-size="14">Shared Memory</text>
  <text x="260" y="130" font-size="10">(Per Thread Block, Fast)</text>

  <!-- Registers -->
  <g transform="translate(400,80)">
     <rect width="30" height="30" fill="#baffc9" stroke="black"/>
     <text x="0" y="50" font-size="12">Registers</text>
     <text x="0" y="65" font-size="8">(Per Thread, Fastest)</text>
  </g>

    <g transform="translate(400,120)">
     <rect width="30" height="30" fill="#baffc9" stroke="black"/>
  </g>

    <g transform="translate(400,160)">
     <rect width="30" height="30" fill="#baffc9" stroke="black"/>
  </g>

 <!-- Arrows showing data movement -->
  <polygon points="205,130 240,115" fill="black" />
  <polygon points="235,120 245,115 235,110" fill="black" />

  <polygon points="355,100 390,95" fill="black" />
 <polygon points="385,100 395,95 385,90" fill="black" />

  <text x="20" y="250" font-size="14">Data is moved between memory levels.</text>
  <text x="20" y="270" font-size="14">Efficient memory usage is crucial for performance.</text>
   <text x="20" y="290" font-size="14">Minimize global memory access, maximize shared memory and registers.</text>
</svg>
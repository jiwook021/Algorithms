<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="30" font-size="16">5. Memory Hierarchy</text>
  <rect x="20" y="50" width="60" height="20" fill="red" stroke="black"/>
  <text x="25" y="65" font-size="10">Registers</text>
  <rect x="20" y="80" width="80" height="30" fill="orange" stroke="black"/>
  <text x="25" y="98" font-size="10">Shared Memory</text>
  <rect x="20" y="120" width="120" height="40" fill="yellow" stroke="black"/>
  <text x="25" y="145" font-size="10">Global Memory</text>

  <text x="160" y="80" font-size="14">Fast, per-thread</text>
  <text x="160" y="100" font-size="14">Fast, per-block</text>
  <text x="160" y="140" font-size="14">Slower, all threads</text>
    <text x="160" y="160" font-size="14">(Main GPU Memory)</text>
</svg>
<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="30" font-size="16">4. Thread, Block, and Grid</text>
  <rect x="20" y="50" width="80" height="80" fill="orange" stroke="black"/>
  <text x="35" y="90">Grid</text>

  <rect x="40" y="70" width="40" height="40" fill="yellow" stroke="black"/>
  <text x="45" y="90" font-size="12">Block</text>

  <circle cx="60" cy="90" r="5" fill="red"/>
  <text x="68" y="95" font-size="12">Thread</text>

    <text x="130" y="80" font-size="14">Hierarchy:</text>
    <text x="130" y="100" font-size="14">Grid > Block > Thread</text>
      <text x="130" y="130" font-size="12">Threads execute</text>
     <text x="130" y="150" font-size="12"> instructions in parallel.</text>

</svg>
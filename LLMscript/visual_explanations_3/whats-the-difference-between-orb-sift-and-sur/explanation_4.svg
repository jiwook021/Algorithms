<svg width="400" height="300" viewBox="0 0 400 300">
   <rect x="0" y="0" width="400" height="300" fill="#f0f0f0" />
  <rect x="50" y="180" width="60" height="40" fill="gray" />
    <rect x="50" y="120" width="60" height="40" fill="#A9A9A9"/>
  <rect x="150" y="150" width="80" height="70" fill="gray" />
    <rect x="150" y="90" width="80" height="70" fill="#A9A9A9"/>
  <rect x="250" y="100" width="120" height="120" fill="gray" />
    <rect x="250" y="40" width="120" height="120" fill="#A9A9A9"/>

     <line x1="80" y1="160" x2="80" y2="180" stroke="green" stroke-width="2"/>
     <line x1="190" y1="125" x2="190" y2="150" stroke="green" stroke-width="2"/>
     <line x1="310" y1="70" x2="310" y2="100" stroke="green" stroke-width="2"/>
  <text x="80" y="240" text-anchor="middle" fill="black">Level 1</text>

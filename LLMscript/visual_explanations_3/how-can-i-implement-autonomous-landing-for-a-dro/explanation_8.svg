<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f0f0f0"/>
  <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold">8. Failsafe Mechanisms</text>

    <!-- Drone -->
    <polygon points="250,100 270,110 290,100 270,90" fill="#4CAF50" stroke="black" stroke-width="2"/>
    <circle cx="270" cy="100" r="10" fill="#4CAF50"/>
     <line x1="270" y1="110" x2="270" y2="140" stroke="#4CAF50" stroke-width="4"/>

    <!-- Landing Pad -->
    <rect x="220" y="350" width="100" height="20" fill="grey" />
     <circle cx="270" cy="360" r="8" fill="red"/>
    <text x="270" y="360" text-anchor="middle" font-size="18" font-weight="bold" fill="white">H</text>

      <!-- Warning Symbol -->
    <circle cx="100" cy="200" r="30" fill="yellow"/>
    <text x="100" y="210" text-anchor="middle" font-size="30" font-weight="bold" fill="black">!</text>
     <text x="100" y="250" text-anchor="middle" font-size="14" fill="black">Low Battery</text>
    <line x1="100" y1="200" x2="250" y2="120" stroke="red" stroke-width="2"/>

      <!-- Warning Symbol -->
    <polygon points="430,185 450,200 470,185 450,215" fill="yellow" stroke="black" />
     <text x="450" y="200" text-anchor="middle" font-size="16" fill="black">GPS Loss</text>
     <line x1="450" y1="200" x2="290" y2="120" stroke="red" stroke-width="2"/>

      <!-- Return to Home -->
    <path d="M270 140 C 150 250, 450 250, 270 140" stroke="purple" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
      <text x="400" y="160" font-size="14" fill="purple">RTH</text>
      <text x="100" y="300" text-anchor="middle" font-size="14" >Emergency</text>
       <text x="100" y="320" text-anchor="middle" font-size="14" >Landing</text>
    <text x="300" y="390" text-anchor="middle" font-size="14">Procedures for handling unexpected events or system failures.</text>

</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
 <rect width="600" height="400" fill="#f0f0f0" />
  <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold">5. Control Algorithm (PID)</text>

  <!-- Drone -->
  <polygon points="250,100 270,110 290,100 270,90" fill="#4CAF50" stroke="black" stroke-width="2"/>
  <circle cx="270" cy="100" r="10" fill="#4CAF50" />
    <line x1="270" y1="110" x2="270" y2="140" stroke="#4CAF50" stroke-width="4"/>
      <!-- Landing Pad -->
  <rect x="220" y="350" width="100" height="20" fill="grey" />
   <circle cx="270" cy="360" r="8" fill="red"/>
  <text x="270" y="360" text-anchor="middle" font-size="18" font-weight="bold" fill="white">H</text>

  <!-- Desired Position -->
    <circle cx="270" cy="360" r="5" fill="blue"/>
    <text x="310" y="360" font-size="14" fill="blue">Desired</text>

  <!-- Actual Position -->
  <circle cx="250" cy="300" r="5" fill="orange"/>
   <text x="180" y="300" font-size="14" fill="orange">Actual</text>
    <line x1="250" y1="300" x2="270" y2="360" stroke="red" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="200" y="330" font-size="14" fill="red">Error</text>

  <!-- PID Controller -->
    <rect x="50" y="180" width="100" height="80" fill="#FFC107" stroke="black"/>
  <text x="100" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="black">PID</text>
    <text x="100" y="225" text-anchor="middle" font-size="14" fill="black">Proportional</text>
    <text x="100" y="240" text-anchor="middle" font-size="14" fill="black">Integral</text>
    <text x="100" y="255" text-anchor="middle" font-size="14" fill="black">Derivative</text>
    <line x1="150" y1="220" x2="230" y2="120" stroke="black" stroke-width="2"/>
   <text x="400" y="300" text-anchor="middle" font-size="14" fill="black">Motor Control Signals</text>
  <text x="300" y="390" text-anchor="middle" font-size="14">Using a control loop to minimize the error between desired and actual position.</text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f0f0f0"/>
  <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold">6. Obstacle Avoidance</text>

    <!-- Drone -->
    <polygon points="250,100 270,110 290,100 270,90" fill="#4CAF50" stroke="black" stroke-width="2"/>
    <circle cx="270" cy="100" r="10" fill="#4CAF50"/>
    <line x1="270" y1="110" x2="270" y2="140" stroke="#4CAF50" stroke-width="4"/>

     <!-- Rangefinders/LIDAR -->
      <circle cx="270" cy="140" r="6" fill="#9C27B0"/>
    <line x1="270" y1="140" x2="150" y2="250" stroke="#9C27B0" stroke-width="2" stroke-dasharray="5,5"/>
      <line x1="270" y1="140" x2="400" y2="200" stroke="#9C27B0" stroke-width="2" stroke-dasharray="5,5"/>
        <text x="200" y="170" font-size="14" fill="#9C27B0">LIDAR/Sonar</text>

    <!-- Obstacle -->
    <rect x="350" y="250" width="50" height="80" fill="brown" stroke="black"/>

     <!-- Safe Zone -->
    <circle cx="270" cy="300" r="80" stroke="red" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
    <text x="180" y="300" font-size="14" fill="red">Safe Zone</text>

    <!-- Landing Pad -->
      <rect x="220" y="350" width="100" height="20" fill="grey" />
     <circle cx="270" cy="360" r="8" fill="red"/>
     <text x="270" y="360" text-anchor="middle" font-size="18" font-weight="bold" fill="white">H</text>
  <text x="300" y="390" text-anchor="middle" font-size="14">Detecting and avoiding obstacles during descent.</text>
</svg>
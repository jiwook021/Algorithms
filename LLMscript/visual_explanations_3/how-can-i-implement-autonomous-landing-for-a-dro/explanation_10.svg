<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f0f0f0"/>
  <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold">10. Iterative Refinement</text>

   <!-- Drone (1) -->
  <polygon points="100,100 120,110 140,100 120,90" fill="grey" stroke="black" stroke-width="1"/>
  <circle cx="120" cy="100" r="8" fill="grey"/>
    <text x="120" y="130" font-size="14">v1</text>

   <!-- Drone (2) -->
 <polygon points="250,100 270,110 290,100 270,90" fill="lightgrey" stroke="black" stroke-width="1"/>
  <circle cx="270" cy="100" r="8" fill="lightgrey"/>
    <text x="270" y="130" font-size="14">v2</text>

   <!-- Drone (3) -->
  <polygon points="400,100 420,110 440,100 420,90" fill="#4CAF50" stroke="black" stroke-width="2"/>
  <circle cx="420" cy="100" r="10" fill="#4CAF50"/>
    <text x="420" y="130" font-size="14">v3</text>

    <!-- Arrow - Iteration -->
     <path d="M150 100 C 180 50, 220 50, 250 100" stroke="blue" stroke-width="3" fill="none" arrow-end="url(#arrowhead)"/>
    <path d="M300 100 C 330 50, 370 50, 400 100" stroke="blue" stroke-width="3" fill="none" arrow-end="url(#arrowhead)"/>

     <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="0" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" />
        </marker>
      </defs>

     <!-- Data Analysis -->
    <rect x="150" y="200" width="300" height="100" fill="lightgrey" stroke="black" />
   <text x="300" y="220" text-anchor="middle" font-size="14" fill="black">Data Analysis and Improvement</text>
      <line x1="170" y1="240" x2="430" y2="240" stroke="green" stroke-width="3" />
    <line x1="170" y1="240" x2="170" y2="280" stroke="green" stroke-width="3" />
   <line x1="170" y1="240" x2="250" y2="260" stroke="green" stroke-width="3"/>
   <line x1="250" y1="260" x2="350" y2="250" stroke="green" stroke-width="3"/>
    <line x1="350" y1="250" x2="430" y2="270" stroke="green" stroke-width="3"/>
     <text x="300" y="290" text-anchor="middle" font-size="12" fill="black">Performance Metrics</text>

   <!-- Landing Pad -->
    <rect x="250" y="350" width="100" height="20" fill="grey" />
    <text x="300" y="365" text-anchor="middle" font-size="18" font-weight="bold" fill="red">H</text>

  <text x="300" y="330" text-anchor="middle" font-size="14">Continuously improving the landing system based on test results and data.</text>

</svg>
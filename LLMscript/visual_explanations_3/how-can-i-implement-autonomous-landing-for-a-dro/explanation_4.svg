<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f0f0f0" />
  <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold">4. Descent Trajectory Planning</text>

  <!-- Drone -->
  <polygon points="100,50 120,60 140,50 120,40" fill="#4CAF50" stroke="black" stroke-width="2"/>
  <circle cx="120" cy="50" r="10" fill="#4CAF50" />
  <line x1="120" y1="60" x2="120" y2="80" stroke="#4CAF50" stroke-width="4"/>

  <!-- Landing Pad -->
  <rect x="450" y="350" width="100" height="20" fill="grey" />
    <circle cx="500" cy="360" r="8" fill="red"/>

  <!-- Trajectory Path -->
  <path d="M120 80 C 200 150, 350 250, 500 360" stroke="blue" stroke-width="3" fill="none"/>
  <text x="300" y="200" text-anchor="middle" font-size="14" fill="blue">Planned Path</text>

  <text x="300" y="390" text-anchor="middle" font-size="14">Generating a smooth and safe path to the landing target.</text>
</svg>
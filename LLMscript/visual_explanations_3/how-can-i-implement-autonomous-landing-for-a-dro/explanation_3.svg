<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold">3. Precision Positioning with Computer Vision</text>

    <!-- Drone -->
    <polygon points="250,100 270,110 290,100 270,90" fill="#4CAF50" stroke="black" stroke-width="2"/>
    <circle cx="270" cy="100" r="10" fill="#4CAF50"/>
    <line x1="270" y1="110" x2="270" y2="140" stroke="#4CAF50" stroke-width="4"/>
    <line x1="270" y1="140" x2="270" y2="280" stroke="red" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="280" y="200" font-size="14" fill="red">Visual Feedback</text>

    <!-- Camera -->
    <circle cx="270" cy="140" r="8" fill="black"/>
      <!-- Landing Pad -->
    <rect x="220" y="300" width="100" height="60" fill="grey" stroke="black" stroke-width="2"/>
    <circle cx="270" cy="330" r="15" fill="red"/>
    <text x="270" y="335" text-anchor="middle" font-size="18" font-weight="bold" fill="white">H</text>

     <!-- Center Lines -->
    <line x1="270" y1="140" x2="270" y2="360" stroke="blue" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="0" y1="330" x2="600" y2="330" stroke="blue" stroke-width="1" stroke-dasharray="3,3"/>
     <text x="400" y="200" font-size="14" fill="blue">Calculating Offset</text>

     <!-- Offset Arrows -->
    <line x1="270" y1="280" x2="270" y2="320" stroke="purple" stroke-width="3" arrow-end="url(#arrowhead)"/>
     <line x1="250" y1="330" x2="270" y2="330" stroke="purple" stroke-width="3" arrow-end="url(#arrowhead)"/>

      <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="0" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" />
        </marker>
      </defs>

    <text x="300" y="380" text-anchor="middle" font-size="14">Calculating the drone's position relative to the target's center.</text>
</svg>
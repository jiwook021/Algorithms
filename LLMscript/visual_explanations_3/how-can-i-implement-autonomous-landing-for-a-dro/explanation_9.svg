<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f0f0f0" />
  <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold">9. System Integration and Testing</text>

  <!-- Drone (Schematic) -->
  <rect x="250" y="100" width="40" height="30" fill="#4CAF50" stroke="black"/>
    <text x="270" y="115" text-anchor="middle" font-size="12" fill="white">Drone</text>

  <!-- Sensors (GPS) -->
  <circle cx="100" cy="200" r="15" fill="#2196F3" stroke="black"/>
  <text x="100" y="200" text-anchor="middle" font-size="10" fill="white">GPS</text>
    <line x1="100" y1="200" x2="250" y2="120" stroke="grey" stroke-dasharray="5,5"/>

  <!-- Sensors (IMU) -->
  <rect x="180" y="200" width="30" height="20" fill="#FF9800" stroke="black"/>
  <text x="195" y="210" text-anchor="middle" font-size="10" fill="white">IMU</text>
   <line x1="195" y1="200" x2="250" y2="120" stroke="grey" stroke-dasharray="5,5"/>

  <!-- Sensors (Camera) -->
  <circle cx="260" y="200" r="10" fill="black"/>
 <line x1="260" y1="200" x2="270" y2="130" stroke="grey" stroke-dasharray="5,5"/>
   <!-- Sensors (Altimeter)-->
   <polygon points="330,185 340,200 350,185 340,215" fill="#9C27B0" stroke="black" />
  <text x="340" y="200" text-anchor="middle" font-size="10" fill="white">Altimeter</text>
 <line x1="340" y1="200" x2="280" y2="130" stroke="grey" stroke-dasharray="5,5"/>

    <!-- Computer -->
 <rect x="450" y="180" width="60" height="40" fill="grey" stroke="black"/>
   <text x="480" y="200" text-anchor="middle" font-size="12" fill="white">Flight Controller</text>
 <line x1="450" y1="200" x2="290" y2="115" stroke="grey" />

<!-- Test Environment -->
    <rect x="50" y="300" width="500" height="80" fill="lightgrey" stroke="black"/>
    <text x="300" y="340" text-anchor="middle" font-size="14" fill="black">Testing Environment</text>
    <line x1="50" y1="340" x2="550" y2="340" stroke="black" stroke-width="2" />

    <!-- Landing pad inside Test Env -->
     <rect x="270" y="350" width="60" height="15" fill="grey" />
    <circle cx="300" cy="360" r="6" fill="red"/>

  <text x="300" y="50" text-anchor="middle" font-size="14">Thorough testing in a controlled environment before real-world deployment.</text>

</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f0f0f0" />
  <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold">1. Sensor Fusion</text>

  <!-- Drone -->
  <polygon points="250,100 270,110 290,100 270,90" fill="#4CAF50" stroke="black" stroke-width="2"/>
  <circle cx="270" cy="100" r="10" fill="#4CAF50" />
  <line x1="270" y1="110" x2="270" y2="140" stroke="#4CAF50" stroke-width="4"/>

  <!-- GPS -->
  <circle cx="100" cy="200" r="20" fill="#2196F3" stroke="black"/>
  <text x="100" y="200" text-anchor="middle" font-size="12" fill="white">GPS</text>
  <line x1="100" y1="200" x2="270" y2="140" stroke="#2196F3" stroke-dasharray="5,5"/>
   <text x="185" y="170"  font-size="12" fill="#2196F3">Lat, Long, Alt</text>

  <!-- IMU -->
  <rect x="250" y="200" width="40" height="30" fill="#FF9800" stroke="black"/>
    <text x="270" y="215" text-anchor="middle" font-size="12" fill="white">IMU</text>
  <line x1="270" y1="200" x2="270" y2="140" stroke="#FF9800" stroke-dasharray="5,5"/>
  <text x="210" y="170"  font-size="12" fill="#FF9800">Accel, Gyro, Mag</text>

  <!-- Altimeter -->
   <polygon points="430,185 450,200 470,185 450,215" fill="#9C27B0" stroke="black" />
  <text x="450" y="200" text-anchor="middle" font-size="12" fill="white">Altimeter</text>
  <line x1="450" y1="200" x2="270" y2="140" stroke="#9C27B0" stroke-dasharray="5,5"/>
    <text x="370" y="170"  font-size="12" fill="#9C27B0">Altitude</text>

   <!-- Landing Pad -->
    <rect x="150" y="350" width="300" height="20" fill="grey" />
    <text x="300" y="365" text-anchor="middle" font-size="14" fill="white">Landing Pad</text>

  <text x="300" y="300" text-anchor="middle" font-size="14">Combining data from multiple sensors</text>
  <text x="300" y="320" text-anchor="middle" font-size="14">for accurate position and orientation.</text>
</svg>
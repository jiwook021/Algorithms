<svg width="600" height="400" viewport="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
 <rect x="50" y="50" width="500" height="300" fill="#98FB98" stroke="black"/>
  <text x="300" y="70" text-anchor="middle" font-weight="bold">GPU Memory</text>

    <rect x="100" y="100" width="40" height="40" fill="red" stroke="black"/>
  <text x="120" y="120" text-anchor="middle">T1</text>

    <rect x="160" y="100" width="40" height="40" fill="orange" stroke="black"/>
  <text x="180" y="120" text-anchor="middle">T2</text>

      <rect x="220" y="100" width="40" height="40" fill="red" stroke="black"/>
  <text x="240" y="120" text-anchor="middle">T3</text>

    <rect x="280" y="100" width="40" height="40" fill="red" stroke="black"/>
  <text x="300" y="120" text-anchor="middle">T4</text>

    <rect x="340" y="100" width="40" height="40" fill="red" stroke="black"/>
  <text x="360" y="120" text-anchor="middle">T5</text>

    <rect x="400" y="100" width="40" height="40" fill="red" stroke="black"/>
  <text x="420" y="120" text-anchor="middle">T6</text>

     <rect x="460" y="100" width="40" height="40" fill="red" stroke="black"/>
  <text x="480" y="120" text-anchor="middle">T7</text>

    <rect x="100" y="180" width="400" height="80" fill="#228B22" stroke="black"/>
    <text x="300" y="220" text-anchor="middle">Global Memory</text>

    <line x1="120" y1="140" x2="120" y2="180" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="180" y1="140" x2="180" y2="180" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black" />
    </marker>
  </defs>
    <text x="300" y="380" text-anchor="middle" font-weight="bold">Latency hiding: While T2 waits, other threads (T1, T3-T7) continue.</text>

</svg>
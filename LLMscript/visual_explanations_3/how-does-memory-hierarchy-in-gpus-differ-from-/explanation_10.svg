<svg width="600" height="400" viewport="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="50" y="50" width="500" height="300" fill="#98FB98" stroke="black"/>
  <text x="300" y="70" text-anchor="middle" font-weight="bold">GPU Memory Access</text>

  <rect x="100" y="100" width="80" height="20" fill="red" stroke="black"/>
  <text x="140" y="110" text-anchor="middle" font-size="12">Thread 1</text>
  <rect x="100" y="130" width="80" height="20" fill="red" stroke="black"/>
  <text x="140" y="140" text-anchor="middle" font-size="12">Thread 2</text>
   <rect x="100" y="160" width="80" height="20" fill="red" stroke="black"/>
  <text x="140" y="170" text-anchor="middle" font-size="12">Thread 3</text>

  <rect x="300" y="100" width="20" height="20" fill="green" stroke="black"/>
  <rect x="320" y="100" width="20" height="20" fill="green" stroke="black"/>
  <rect x="340" y="100" width="20" height="20" fill="green" stroke="black"/>
    <text x="400" y="110" text-anchor="middle" font-size="12">Global Memory</text>
<text x="400" y="140" text-anchor="middle" font-size="12">(Coalesced Access)</text>
  <line x1="140" y1="120" x2="310" y2="110" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="140" y1="150" x2="330" y2="110" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="140" y1="180" x2="350" y2="110" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
    <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black" />
    </marker>
  </defs>

   <text x="300" y="380" text-anchor="middle" font-weight="bold">Coalesced memory access is crucial for GPU performance.</text>
</svg>
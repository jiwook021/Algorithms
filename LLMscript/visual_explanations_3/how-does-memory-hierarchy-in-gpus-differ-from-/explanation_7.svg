<svg width="600" height="400" viewport="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="50" y="100" width="200" height="200" fill="#ADD8E6" stroke="black"/>
  <text x="150" y="120" text-anchor="middle" font-weight="bold">CPU Memory</text>
  <rect x="350" y="100" width="200" height="200" fill="#98FB98" stroke="black"/>
  <text x="450" y="120" text-anchor="middle" font-weight="bold">GPU Memory</text>

  <rect x="70" y="180" width="20" height="80" fill="blue" stroke="black"/>
    <rect x="370" y="140" width="160" height="20" fill="green" stroke="black"/>

  <text x="150" y="320" text-anchor="middle">Lower Bandwidth</text>

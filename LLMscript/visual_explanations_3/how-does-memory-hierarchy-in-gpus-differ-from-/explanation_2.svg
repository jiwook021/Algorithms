<svg width="600" height="400" viewport="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="50" y="50" width="200" height="300" fill="#ADD8E6" stroke="black"/>
  <text x="150" y="70" text-anchor="middle" font-weight="bold">CPU Memory</text>
    <rect x="70" y="100" width="160" height="50" fill="#87CEEB" stroke="black"/>
  <text x="150" y="125" text-anchor="middle">L1 Cache (Larger)</text>
  <rect x="70" y="160" width="160" height="50" fill="#87CEEB" stroke="black"/>
  <text x="150" y="185" text-anchor="middle">L2 Cache (Larger)</text>
  <rect x="70" y="220" width="160" height="50" fill="#87CEEB" stroke="black"/>
  <text x="150" y="245" text-anchor="middle">L3 Cache (Largest)</text>
  <rect x="300" y="150" width="80" height="100" fill="red" stroke="black"/>
  <text x="340" y="200" text-anchor="middle" font-weight="bold">CPU Core</text>

  <line x1="250" y1="200" x2="300" y2="200" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black" />
    </marker>
  </defs>
  <text x="300" y="380" text-anchor="middle" font-weight="bold">CPU prioritizes larger, lower-latency caches.</text>
</svg>
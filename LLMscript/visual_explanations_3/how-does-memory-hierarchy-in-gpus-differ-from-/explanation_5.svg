<svg width="600" height="400" viewport="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
 <rect x="50" y="50" width="500" height="300" fill="#98FB98" stroke="black"/>
  <text x="300" y="70" text-anchor="middle" font-weight="bold">GPU Memory</text>
    <rect x="100" y="100" width="80" height="80" fill="red" stroke="black"/>
  <text x="140" y="140" text-anchor="middle">Thread</text>
    <rect x="200" y="100" width="80" height="80" fill="red" stroke="black"/>
  <text x="240" y="140" text-anchor="middle">Thread</text>
  <rect x="300" y="100" width="80" height="80" fill="red" stroke="black"/>
  <text x="340" y="140" text-anchor="middle">Thread</text>
    <rect x="400" y="100" width="80" height="80" fill="red" stroke="black"/>
  <text x="440" y="140" text-anchor="middle">Thread</text>
    <rect x="100" y="200" width="380" height="80" fill="#556B2F" stroke="black"/>
   <text x="290" y="240" text-anchor="middle" font-weight="bold">Constant Memory (Read-Only, Cached)</text>
    
      <line x1="140" y1="180" x2="140" y2="200" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
          <line x1="240" y1="180" x2="240" y2="200" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="340" y1="180" x2="340" y2="200" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
        <line x1="440" y1="180" x2="440" y2="200" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black" />
    </marker>
  </defs>
   <text x="300" y="380" text-anchor="middle" font-weight="bold">Constant memory is cached and used for read-only data.</text>
</svg>
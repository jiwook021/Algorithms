<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0,0 8,3 0,6" fill="red"/>
        </marker>
    </defs>
    <rect x="50" y="50" width="300" height="150" stroke="black" fill="none"/>

    <circle cx="100" cy="100" r="5" fill="blue" />
      <circle cx="150" cy="100" r="5" fill="blue" />
      <circle cx="100" cy="150" r="5" fill="blue" />
      <circle cx="150" cy="150" r="5" fill="blue" />

        <circle cx="200" cy="90" r="5" fill="blue" />
        <circle cx="250" cy="90" r="5" fill="blue" />
        <circle cx="200" cy="140" r="5" fill="blue" />
        <circle cx="250" cy="140" r="5" fill="blue" />

        <line x1="100" y1="100" x2="200" y2="90" stroke="red" stroke-width="2" marker-end="url(#arrow)" />
          <line x1="150" y1="100" x2="250" y2="90" stroke="red" stroke-width="2" marker-end="url(#arrow)" />
          <line x1="100" y1="150" x2="200" y2="140" stroke="red" stroke-width="2" marker-end="url(#arrow)" />
          <line x1="150" y1="150" x2="250" y2="140" stroke="red" stroke-width="2" marker-end="url(#arrow)" />

    <text x="60" y="40">Dense Optical Flow</text>
     <text x='120' y='220' font-size='10'>Multiple feature points</text>
</svg>
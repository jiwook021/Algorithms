<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
        <marker id="arrow-head" markerWidth="8" markerHeight="8" refX="8" refY="4"
            orient="auto">
      <polygon points="0,0 8,4 0,8" fill="purple" />
    </marker>
  </defs>
  <rect x="50" y="50" width="100" height="100" fill="lightgray" />
  <circle cx="100" cy="100" r="5" fill="green"/>
    <text x='90' y='130' font-size='8'>Car</text>

  <rect x="200" y="50" width="100" height="100" fill="lightgray" />
 <circle cx="280" cy="70" r="5" fill="green"/>
  <line x1="100" y1="100" x2="280" y2="70" stroke="purple" stroke-width="3" marker-end="url(#arrow-head)"/>
  <text x='50' y='30' font-size='12' font-weight='bold'>Object Tracking Example</text>
   <text x='250' y='100' font-size='8'>Car</text>

</svg>
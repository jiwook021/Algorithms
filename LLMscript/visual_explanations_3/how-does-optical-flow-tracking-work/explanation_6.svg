    <rect x="200" y="50" width="100" height="100" fill="lightgray" stroke="black"/>
    <circle cx="260" cy="90" r="5" fill="blue" />
    <line x1="100" y1="100" x2="260" y2="90" stroke="red" stroke-width="3" marker-end="url(#arrow-red)"/>
      <text x='150' y='120' font-size='10' fill='blue'>Feature Point</text>

     <text x="180" y="25">Frame 2: Spatial Gradient Constraint</text>

</svg>
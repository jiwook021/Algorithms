<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
    <text x="20" y="25" fill="black" font-size="14" font-weight="bold">5. Tensor Core</text>
    <rect x="50" y="50" width="100" height="100" fill="lightgreen" stroke="black" />
    <text x="100" y="170" text-anchor="middle" fill="black">4x4 FP16 x 4x4 FP16 = 4x4 FP32</text>

    <rect x="70" y="70" width="20" height="20" fill="orange"></rect>
    <rect x="90" y="70" width="20" height="20" fill="orange"></rect>
      <rect x="70" y="90" width="20" height="20" fill="orange"></rect>
    <rect x="90" y="90" width="20" height="20" fill="orange"></rect>

    <text x="125" y="95" font-size="25"> x </text>

    <rect x="150" y="70" width="20" height="20" fill="yellow"></rect>
    <rect x="170" y="70" width="20" height="20" fill="yellow"></rect>
      <rect x="150" y="90" width="20" height="20" fill="yellow"></rect>
    <rect x="170" y="90" width="20" height="20" fill="yellow"></rect>

     <text x="205" y="95" font-size="20">=</text>

    <rect x="230" y="70" width="20" height="20" fill="lightblue"></rect>
    <rect x="250" y="70" width="20" height="20" fill="lightblue"></rect>
      <rect x="230" y="90" width="20" height="20" fill="lightblue"></rect>
    <rect x="250" y="90" width="20" height="20" fill="lightblue"></rect>

    <text x="280" y="100">Single, large calculation</text>

</svg>
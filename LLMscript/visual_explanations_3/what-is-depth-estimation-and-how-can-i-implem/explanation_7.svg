  <text x="20" y="30" font-size="20" font-weight="bold">7. Disparity Map: Visualizing Disparity</text>

  <rect x="150" y="100" width="300" height="200" fill="lightgray" />
  <rect x="180" y="130" width="20" height="40" fill="red" />
    <rect x="250" y="160" width="30" height="60" fill="darkred" />
      <rect x="350" y="110" width="40" height="80" fill="black" />

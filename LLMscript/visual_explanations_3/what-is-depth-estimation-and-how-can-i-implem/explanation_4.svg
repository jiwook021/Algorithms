<svg width="600" height="400" viewport="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0" />
  <text x="20" y="30" font-size="20" font-weight="bold">4. Disparity: The Key to Depth</text>

  <rect x="50" y="100" width="200" height="150" fill="lightgray" />
  <rect x="70" y="120" width="30" height="50" fill="red" />
   <text x="40" y="270" font-size="14" fill="black">Left Image</text>

  <rect x="350" y="100" width="200" height="150" fill="lightgray" />
  <rect x="450" y="120" width="30" height="50" fill="red" />
  <text x="340" y="270" font-size="14" fill="black">Right Image</text>

  <line x1="70" y1="145" x2="450" y2="145" stroke="blue" stroke-width="3" stroke-dasharray="5,5" />
  <text x="230" y="140" fill="blue" font-size="16">Disparity</text>

  <text x="80" y="350" font-size="16">Disparity is the horizontal difference in the position of a feature between the two images.</text>
</svg>
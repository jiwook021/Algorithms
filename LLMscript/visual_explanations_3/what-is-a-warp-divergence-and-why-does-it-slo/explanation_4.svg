<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="400" height="300" fill="#f0f0f0"/>
    <text x="20" y="30" font-size="16" font-weight="bold">4. Warp Divergence Example (If/Else)</text>

    <g transform="translate(50, 60)">
        <rect x="0" y="0" width="30" height="80" fill="lightgreen" stroke="black"/>
        <rect x="35" y="0" width="30" height="80" fill="lightcoral" stroke="black"/>
        <rect x="70" y="0" width="30" height="80" fill="lightgreen" stroke="black"/>
        <rect x="105" y="0" width="30" height="80" fill="lightcoral" stroke="black"/>

        <text x="0" y="95" font-size="12">Thread 0</text>
        <text x="35" y="95" font-size="12">Thread 1</text>
        <text x="70" y="95" font-size="12">Thread 2</text>
        <text x="105" y="95" font-size="12">Thread 3</text>
         <text x="15" y="-10" font-size="14">Warp</text>
        <rect x="-5" y="-20" width="145" height="120" fill="none" stroke="red" stroke-width="2"/>

      <text x="150" y="30">If (condition) {</text>
        <text x="170" y="50" fill="green">  // Code Block A</text>
        <text x="150" y="70">} else {</text>
        <text x="170" y="90" fill="red"> // Code Block B </text>
         <text x="150" y="110">}</text>

       <text x="0" y="120">Condition: True</text>
        <text x="35" y="120">Condition: False</text>
         <text x="70" y="120">Condition: True</text>
        <text x="105" y="120">Condition: False</text>

    </g>

    <text x="20" y="210" font-size="14">Threads 0 and 2 execute 'Code Block A'.</text>
      <text x="20" y="230" font-size="14">Threads 1 and 3 execute 'Code Block B'.</text>
    <text x="20" y="250" font-size="14">The warp cannot execute both simultaneously.</text>
     <text x="20" y="270" font-size="14">This is warp divergence!</text>
</svg>
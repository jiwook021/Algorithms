<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="400" height="200" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">6. Performance Impact: Reduced Throughput</text>
    <text x="20" y="60" font-size="14">Without Divergence:</text>
  <g transform="translate(50, 90)">
   <rect x="0" y="0" width="30" height="40" fill="lightgreen" />
    <rect x="35" y="0" width="30" height="40" fill="lightgreen" />
    <rect x="70" y="0" width="30" height="40" fill="lightgreen" />
      <text x="110" y="25">=</text>
    <rect x="130" y="0" width="120" height="40" fill="lightgreen" />
     <text x="0" y="55">1 Cycle</text>
  </g>

  <text x="20" y="140" font-size="14">With Divergence (2 paths):</text>
   <g transform="translate(50, 165)">
     <rect x="0" y="0" width="60" height="20" fill="lightgreen" />
     <rect x="0" y="25" width="60" height="20" fill="lightcoral" />
       <text x="70" y="25">=</text>
       <rect x="90" y="0" width="120" height="40" fill="lightgray" />
       <text x="0" y="55">2 Cycles</text>
   </g>
</svg>
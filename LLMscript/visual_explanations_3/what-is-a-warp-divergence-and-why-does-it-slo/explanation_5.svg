<svg width="400" height="280" viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="400" height="280" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">5. Serialization of Divergent Paths</text>

  <g transform="translate(20, 60)">
    <rect x="0" y="0" width="30" height="60" fill="lightgreen" stroke="black" />
    <rect x="35" y="0" width="30" height="60" fill="#cccccc" stroke="black" />
    <rect x="70" y="0" width="30" height="60" fill="lightgreen" stroke="black" />
    <rect x="105" y="0" width="30" height="60" fill="#cccccc" stroke="black" />
    <text x="0" y="75" font-size="12">T0</text>
    <text x="35" y="75" font-size="12">T1</text>
    <text x="70" y="75" font-size="12">T2</text>
    <text x="105" y="75" font-size="12">T3</text>
     <text x="15" y="-10" font-size="14">Warp</text>
     <rect x="-5" y="-20" width="145" height="105" fill="none" stroke="red" stroke-width="2"/>
     <text x="150" y="30">Step 1: Execute 'If'</text>

     <rect x="0" y="100" width="30" height="60" fill="#cccccc" stroke="black" />
    <rect x="35" y="100" width="30" height="60" fill="lightcoral" stroke="black" />
    <rect x="70" y="100" width="30" height="60" fill="#cccccc" stroke="black" />
    <rect x="105" y="100" width="30" height="60" fill="lightcoral" stroke="black" />
     <text x="150" y="130">Step 2: Execute 'Else'</text>
  </g>

  <text x="20" y="230" font-size="14">Divergent paths are executed *serially*.</text>
   <text x="20" y="250" font-size="14">First 'If' path (T0, T2), then 'Else' path (T1, T3).</text>

</svg>
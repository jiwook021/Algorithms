<svg width="400" height="280" viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="400" height="280" fill="#f0f0f0" />
  <text x="20" y="30" font-size="16" font-weight="bold">8. Coalesced Memory Access (Ideal)</text>

  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="20" height="60" fill="lightblue" stroke="black" />
    <text x="5" y="30" font-size="10">T0</text>
    <rect x="25" y="0" width="20" height="60" fill="lightblue" stroke="black" />
    <text x="30" y="30" font-size="10">T1</text>
    <rect x="50" y="0" width="20" height="60" fill="lightblue" stroke="black" />
    <text x="55" y="30" font-size="10">T2</text>
    <rect x="75" y="0" width="20" height="60" fill="lightblue" stroke="black" />
    <text x="80" y="30" font-size="10">T3</text>
    <text x="15" y="-10" font-size="14">Warp</text>
    <rect x="-5" y="-20" width="110" height="90" fill="none" stroke="red" stroke-width="2"/>

    <rect x="120" y="0" width="120" height="10" fill="brown" stroke="black" />
      <text x="150" y="20" >Contiguous Memory</text>
    <rect x="120" y="10" width="120" height="10" fill="brown" stroke="black" />
    <rect x="120" y="20" width="120" height="10" fill="brown" stroke="black" />

   <path d="M 10 30 L 115 5" stroke="green" stroke-width="2" marker-end="url(#arrowhead3)" />
   <path d="M 35 30 L 115 5" stroke="green" stroke-width="2" marker-end="url(#arrowhead3)" />
   <path d="M 60 30 L 115 5" stroke="green" stroke-width="2" marker-end="url(#arrowhead3)" />
   <path d="M 85 30 L 115 5" stroke="green" stroke-width="2" marker-end="url(#arrowhead3)" />


    <marker id="arrowhead3" markerWidth="8" markerHeight="5"
        refX="0" refY="2.5" orient="auto">
        <polygon points="0 0, 8 2.5, 0 5" fill="currentColor" />
    </marker>

  </g>

  <text x="20" y="160" font-size="14">Coalesced access: Threads access consecutive</text>
  <text x="20" y="180" font-size="14">memory locations. This is efficient, requiring only</text>
   <text x="20" y="200" font-size="14">a single memory transaction for the entire warp.</text>
  <text x="20" y="230" font-size="14">Non-coalesced access (divergent memory access)</text>
    <text x="20" y="250" font-size="14">is a common cause of performance bottlenecks.</text>
</svg>
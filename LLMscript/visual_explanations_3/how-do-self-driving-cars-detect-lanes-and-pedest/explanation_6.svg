<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f0f0f0" />
  <text x="300" y="30" text-anchor="middle" font-size="24" font-weight="bold">6. Lane Detection - Hough Transform</text>
 <rect x="50" y="80" width="200" height="150" fill="#ADD8E6" />
    <line x1="70" y1="100" x2="70" y2="210" stroke="white" stroke-dasharray="5,5"/>
    <line x1="230" y1="100" x2="230" y2="210" stroke="white" stroke-dasharray="5,5"/>
  <text x="150" y="95" text-anchor="middle" font-size="14">Input with Edges</text>

  <g transform="translate(350, 80)">
    <rect width="200" height="150" fill="#f8f8f8"/>
      <line x1="0" y1="150" x2="200" y2="0" stroke="gray"/>
     <circle cx="20" cy="130" r="3" fill="black"/>
     <circle cx="50" cy="100" r="3" fill="black"/>
     <circle cx="80" cy="70" r="3" fill="black"/>
     <circle cx="110" cy="40" r="3" fill="black"/>
     <circle cx="140" cy="10" r="3" fill="black"/>
    <line x1="0" y1="150" x2="200" y2="0" stroke="blue" stroke-width="2"/>
        <text x="100" y="75" text-anchor="middle" font-size="14" >Hough Space</text>
  </g>


  <text x="300" y="350" text-anchor="middle" font-size="14">The Hough Transform identifies lines by converting edge points to a parameter space.</text>
</svg>
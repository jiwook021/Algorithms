<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="24" font-weight="bold">7. Object Classification</text>

    <rect x="50" y="100" width="200" height="150" fill="#eee"/>
    <rect x="70" y="120" width="40" height="60" stroke="black" fill="red"/>
        <rect x="180" y="120" width="40" height="30" stroke="black" fill="blue"/>
            <circle cx="150" cy="190" r="20" stroke="black" fill="orange"/>
    <text x="150" y="90" text-anchor="middle" font-size="14">Detected Objects</text>


    <g transform="translate(350,100)">
       <rect width="150" height="40" fill="#4CAF50"/>
       <text x="75" y="25" text-anchor="middle" fill="white" font-size="16">Pedestrian</text>
           <rect y ="60" width="150" height="40" fill="#03A9F4"/>
       <text x="75" y="85" text-anchor="middle" fill="white" font-size="16">Car</text>
           <rect y ="120" width="150" height="40" fill="#FFC107"/>
       <text x="75" y="145" text-anchor="middle" fill="white" font-size="16">Traffic Light</text>
    </g>

    <text x="300" y="350" text-anchor="middle" font-size="14">Machine learning models classify detected objects (pedestrians, cars, etc.).</text>
</svg>
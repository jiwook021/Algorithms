<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f0f0f0" />
  <text x="300" y="30" text-anchor="middle" font-size="24" font-weight="bold">2. LiDAR Point Cloud</text>

  <rect x="50" y="100" width="100" height="60" fill="#2196F3" />
  <text x="100" y="135" text-anchor="middle" font-size="16">LiDAR</text>

 <g transform="translate(250,130)">
        <circle cx="0" cy="0" r="3" fill="blue"/>
    <circle cx="20" cy="-10" r="3" fill="blue"/>
        <circle cx="15" cy="15" r="3" fill="blue"/>
        <circle cx="40" cy="5" r="3" fill="blue"/>
        <circle cx="60" cy="-15" r="3" fill="blue"/>
        <circle cx="80" cy="0" r="3" fill="blue"/>
        <circle cx="100" cy="20" r="3" fill="blue"/>
    <circle cx="150" cy="5" r="3" fill="red"/>
        <circle cx="140" cy="15" r="3" fill="red"/>
            <circle cx="155" cy="-5" r="3" fill="red"/>
    </g>

  <text x="450" y="150" text-anchor="middle" font-size="16">3D Point Cloud</text>
    <text x="480" y="100" text-anchor="middle" font-size="14" fill="red">Pedestrian</text>

  <text x="300" y="350" text-anchor="middle" font-size="14">LiDAR emits laser beams and measures reflections to create a 3D point cloud.</text>
</svg>
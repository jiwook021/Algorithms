<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f0f0f0" />
  <text x="300" y="30" text-anchor="middle" font-size="24" font-weight="bold">3. Radar for Distance and Speed</text>

  <rect x="50" y="100" width="100" height="60" fill="#FFC107" />
  <text x="100" y="135" text-anchor="middle" font-size="16">Radar</text>

  <path d="M150,130 C200,80 250,80 300,130 C250,180 200,180 150,130" fill="none" stroke="#FF9800" stroke-width="3" />

  <rect x="350" y="110" width="80" height="40" fill="#9E9E9E" />
    <path d="M 430 130 l -20 -10 l 0 20 Z" fill="#9E9E9E" />
  <text x="470" y="130" text-anchor="middle" font-size="16">Object</text>

  <text x="250" y="220" text-anchor="middle" font-size="14">Distance: 5m</text>
  <text x="250" y="240" text-anchor="middle" font-size="14">Speed: 10 m/s</text>

  <text x="300" y="350" text-anchor="middle" font-size="14">Radar uses radio waves to determine the distance, speed, and angle of objects.</text>
</svg>
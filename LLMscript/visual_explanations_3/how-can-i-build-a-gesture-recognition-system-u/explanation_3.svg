<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f0f0f0" />
    <rect x="50" y="80" width="120" height="140" fill="lightgray" stroke="black" stroke-width="2"/>
    <circle cx="80" cy="110" r="5" fill="darkgray" />
    <circle cx="120" cy="150" r="3" fill="darkgray" />
     <circle cx="100" cy="180" r="7" fill="darkgray" />
    <text x="60" y="160" font-size="16" fill="black">Noisy Image</text>

  <polygon points="170,150 210,150" fill="black" />
  <polygon points="200,140 210,150 200,160" fill="black" />

    <rect x="230" y="80" width="120" height="140" fill="lightgray" stroke="black" stroke-width="2" style="filter: blur(2px);"/>

    <text x="240" y="160" font-size="16" fill="black">Blurred Image</text>
  <text x="100" y="250" font-size="16" fill="black">3. Noise Reduction: Gaussian Blur</text>
   <text x="100" y="270" font-size="12" fill="black">Apply Gaussian Blur to reduce noise.</text>
</svg>
<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="50" y="50" width="100" height="100" fill="#F0F8FF" stroke="black"/>
  <text x="60" y="70" font-size="14">MCU</text>
  <text x="60" y="90" font-size="10">(Active Mode)</text>
  <line x1="150" y1="100" x2="250" y2="100" stroke="red" stroke-width="4"/>
    <polygon points="245,95 250,100 245,105" fill="red" />
  <text x="260" y="105" font-size="12">High Power</text>
  <text x="260" y="120" font-size="12">Consumption</text>

    <rect x="50" y="160" width="100" height="30" fill="lightgray" stroke="black" visibility="hidden"/>
    <text x="60" y="180" font-size="10" fill="gray" visibility="hidden">Low-Power Mode</text>
  <text x="150" y="20" font-size="16" fill="blue">3. Clock Gating</text>
     <line x1="180" y1="50" x2="180" y2="150" stroke="black" stroke-dasharray="4"/>
     <text x="200" y="75" font-size="14" >Clock Signal</text>
    <text x="200" y="95" font-size="10" >(To MCU modules)</text>
</svg>
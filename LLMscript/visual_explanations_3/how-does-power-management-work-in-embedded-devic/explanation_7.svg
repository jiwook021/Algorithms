<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="50" y="50" width="100" height="100" fill="#F0F8FF" stroke="black"/>
  <text x="60" y="70" font-size="14">Sensor</text>
   <text x="60" y="90" font-size="10">(Always ON)</text>
   <line x1="150" y1="100" x2="200" y2="100" stroke="red" stroke-width="4"/>
    <polygon points="195,95 200,100 195,105" fill="red" />
  <text x="210" y="90" font-size="12">High Power</text>
   <text x="210" y="105" font-size="12">Consumption</text>

    <rect x="50" y="160" width="100" height="30" fill="#FAF9F6" stroke="black" />
        <text x="60" y="180" font-size="10" >Sensor (Duty Cycling)</text>

   <line x1="150" y1="175" x2="200" y2="175" stroke="green" stroke-width="2" stroke-dasharray="5,5"/>
     <polygon points="195,170 200,175 195,180" fill="green" />
   <text x="210" y="180" font-size="12">Low Power</text>

  <text x="150" y="20" font-size="16" fill="blue">7. Duty Cycling</text>
</svg>
<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="50" width="100" height="80" fill="#f8d7da" stroke="black" stroke-width="2"/>
  <text x="40" y="90" font-size="16">Main System</text>
 <text x="45" y="115" font-size="14" fill="red">Hanged</text>

  <rect x="280" y="50" width="100" height="80" fill="#d4edda" stroke="black" stroke-width="2"/>
  <text x="290" y="90" font-size="16">Watchdog Timer</text>
    <text x="300" y="115" font-size="12">Timeout = 5s</text>

  <path d="M120 90 L280 90" stroke="grey" stroke-width="4" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="180" y="80" fill="grey" font-size="14">No Signal</text>
 <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
    refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="grey" />
    </marker>
  </defs>
  <text x="20" y="20" font-size="18" font-weight="bold">4. System Hangs (No Reset)</text>
</svg>
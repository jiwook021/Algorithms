<svg width="400" height="350" viewBox="0 0 400 350" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="10" width="380" height="330" fill="none" stroke="black" stroke-width="2"/>
  <text x="20" y="30" font-size="16" font-weight="bold">4.  Example: Overlapping Kernel Execution</text>
  <text x="20" y="60">Different kernels launched in different streams</text>
  <text x="20" y="80">can execute concurrently if resources are available.</text>

  <rect x="50" y="110" width="100" height="30" fill="lightgreen"/>
  <text x="60" y="130">Kernel A</text>
   <rect x="50" y="140" width="200" height="15" fill="lightblue"/>
    <text x="55" y="150" font-size="10">Stream 1</text>


  <rect x="180" y="180" width="100" height="30" fill="orange"/>
  <text x="190" y="200">Kernel B</text>
  <rect x="180" y="210" width="200" height="15" fill="lightcoral"/>
      <text x="185" y="220" font-size="10">Stream 2</text>

  <text x="50" y="250">Kernel A and Kernel B might overlap in execution.</text>
</svg>
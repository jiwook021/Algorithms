<svg width="400" height="350" viewBox="0 0 400 350" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="10" width="380" height="330" fill="none" stroke="black" stroke-width="2"/>
  <text x="20" y="30" font-size="16" font-weight="bold">10. Benefit: Increased GPU Utilization</text>
  <text x="20" y="60">Streams allow you to utilize the GPU more efficiently</text>
  <text x="20" y="80"> by overlapping computations and data transfers.</text>

  <rect x="50" y="110" width="100" height="80" fill="lightgreen"/>
    <text x="60" y="150">GPU</text>

  <rect x="180" y="110" width="60" height="20" fill="lightblue"/>
   <text x="190" y="125">Task 1</text>

  <rect x="180" y="140" width="40" height="20" fill="lightcoral"/>
  <text x="190" y="155">Task 2</text>

  <rect x="230" y="170" width="80" height="20" fill="yellow"/>
  <text x="240" y="185">Task 3</text>

  <text x="50" y="220">Without streams: Tasks run sequentially, GPU idle.</text>
    <text x="50" y="240">With streams: Tasks run concurrently, GPU utilized.</text>
</svg>
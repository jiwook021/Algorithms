<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="50" y="50" width="200" height="250" fill="#ADD8E6" stroke="black" stroke-width="2"/>
  <text x="100" y="80" font-size="20" font-weight="bold">CPU</text>

  <rect x="350" y="50" width="200" height="250" fill="#90EE90" stroke="black" stroke-width="2"/>
  <text x="380" y="80" font-size="20" font-weight="bold">Peripheral</text>
     <text x="380" y="110" font-size="14" >(LED)</text>

  <rect x="380" y="140" width="140" height="60" fill="white" stroke="black"/>
  <text x="390" y="160" font-size="14">Control Register</text>
    <text x="390" y="180" font-size="14">Address: 0x40000000</text>

  <line x1="350" y1="170" x2="250" y2="170" stroke="black" stroke-width="3" marker-end="url(#arrowhead)"/>
 <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
    refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  <text x="265" y="155" font-size="14">Read 0x80</text>
    <text x="80" y="170" font-size="16" >mov eax, [0x40000000]</text>
      <circle cx="450" cy="250" r="25" fill="yellow" stroke="black"/>
    <text x="440" y="255" font-size="18">LED</text>
  <text x="170" y="350" font-size="24" font-weight="bold">7. Reading from a Register</text>
  <text x="50" y="380" font-size="16">CPU reads data from the register's address, LED is now ON.</text>
</svg>
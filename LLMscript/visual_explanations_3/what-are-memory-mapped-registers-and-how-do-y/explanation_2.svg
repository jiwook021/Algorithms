<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="50" y="50" width="500" height="250" fill="#F0F8FF" stroke="black" stroke-width="2"/>
  <text x="250" y="80" font-size="20" font-weight="bold">Memory Map</text>

  <rect x="80" y="120" width="440" height="20" fill="#D3D3D3"/>
  <text x="80" y="110" font-size="14">0x00000000 (RAM Start)</text>

  <rect x="80" y="180" width="440" height="20" fill="#ADD8E6"/>
  <text x="80" y="170" font-size="14">0x40000000 (Peripheral 1)</text>
 <rect x="80" y="210" width="440" height="20" fill="#90EE90"/>
  <text x="80" y="240" font-size="14">0x40001000 (Peripheral 2)</text>
   <text x="80" y="270" font-size="14">0xFFFFFFFF (End of Memory)</text>

  <text x="150" y="350" font-size="24" font-weight="bold">2. Memory Map</text>
  <text x="50" y="380" font-size="16">Specific memory addresses are assigned to control peripherals.</text>
</svg>
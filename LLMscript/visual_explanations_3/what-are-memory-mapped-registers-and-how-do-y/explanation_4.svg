<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
 <text x="50" y="40" font-size="20" >Memory-Mapped Registers</text>
  <rect x="50" y="80" width="100" height="20" fill="#ADD8E6"/>
  <text x="160" y="95" font-size="14">Control Register</text>
   <text x="350" y="95" font-size="14">Address: 0x40000000</text>

  <rect x="50" y="120" width="100" height="20" fill="#90EE90"/>
  <text x="160" y="135" font-size="14">Status Register</text>
    <text x="350" y="135" font-size="14">Address: 0x40000004</text>

  <rect x="50" y="160" width="100" height="20" fill="#FFA07A"/>
  <text x="160" y="175" font-size="14">Data Register</text>
    <text x="350" y="175" font-size="14">Address: 0x40000008</text>

  <text x="80" y="300" font-size="14" fill="blue">Each register has a unique memory address.</text>
    <text x="80" y="330" font-size="14" fill="blue">CPU interacts with registers as if they were memory locations.</text>
  <text x="150" y="370" font-size="24" font-weight="bold">4. Register Addresses</text>
</svg>
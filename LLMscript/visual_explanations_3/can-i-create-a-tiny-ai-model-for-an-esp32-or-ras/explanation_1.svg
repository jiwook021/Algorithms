<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="20" width="150" height="100" rx="10" fill="#ADD8E6" stroke="black" stroke-width="2"/>
  <text x="55" y="70" font-family="Arial" font-size="16" fill="black">ESP32/RPi</text>
    <text x="55" y="90" font-family="Arial" font-size="12" fill="black">Limited Resources</text>


  <rect x="220" y="20" width="150" height="100" rx="10" fill="#90EE90" stroke="black" stroke-width="2"/>
  <text x="250" y="70" font-family="Arial" font-size="16" fill="black">Full Computer</text>
      <text x="250" y="90" font-family="Arial" font-size="12" fill="black">Abundant Resources</text>


  <line x1="170" y1="70" x2="220" y2="70" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5"
        markerWidth="6" markerHeight="6"
        orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>
    <text x="130" y="150" font-family="Arial" font-size="14" fill="black">Resource Constraint</text>

</svg>
<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Neural Network (Before Pruning) -->
  <circle cx="50" cy="50" r="10" fill="#90EE90"/>
  <circle cx="50" cy="100" r="10" fill="#90EE90"/>
  <circle cx="100" cy="30" r="10" fill="#90EE90"/>
  <circle cx="100" cy="75" r="10" fill="#90EE90"/>
  <circle cx="100" cy="120" r="10" fill="#90EE90"/>
  <circle cx="150" cy="50" r="10" fill="#90EE90"/>
  <circle cx="150" cy="100" r="10" fill="#90EE90"/>

  <line x1="50" y1="50" x2="100" y2="30" stroke="#888" stroke-width="1"/>
  <line x1="50" y1="50" x2="100" y2="75" stroke="#888" stroke-width="1"/>
  <line x1="50" y1="50" x2="100" y2="120" stroke="#888" stroke-width="1"/>
  <line x1="50" y1="100" x2="100" y2="30" stroke="#888" stroke-width="1"/>
  <line x1="50" y1="100" x2="100" y2="75" stroke="#888" stroke-width="1"/>
    <line x1="50" y1="100" x2="100" y2="120" stroke="#888" stroke-width="1"/>

  <line x1="100" y1="30" x2="150" y2="50" stroke="#888" stroke-width="1"/>
  <line x1="100" y1="75" x2="150" y2="50" stroke="#888" stroke-width="1"/>
    <line x1="100" y1="75" x2="150" y2="100" stroke="#888" stroke-width="1"/>
  <line x1="100" y1="120" x2="150" y2="100" stroke="#888" stroke-width="1"/>
<text x="70" y="150" font-size="12">Before</text>
  <line x1="170" y1="75" x2="210" y2="75" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="180" font-size="14" font-family="Arial">Pruning</text>


  <!-- Neural Network (After Pruning) -->
    <circle cx="230" cy="50" r="10" fill="#90EE90"/>
  <circle cx="230" cy="100" r="10" fill="#90EE90"/>
  <circle cx="280" cy="30" r="10" fill="#90EE90"/>
  <circle cx="280" cy="75" r="10" fill="#90EE90"/>
  <circle cx="280" cy="120" r="10" fill="#90EE90"/>
  <circle cx="330" cy="50" r="10" fill="#90EE90"/>
  <circle cx="330" cy="100" r="10" fill="#90EE90"/>

    <line x1="230" y1="50" x2="280" y2="75" stroke="#888" stroke-width="1" stroke-dasharray="4"/>
  <line x1="230" y1="100" x2="280" y2="75" stroke="#888" stroke-width="1"/>

      <line x1="280" y1="75" x2="330" y2="50" stroke="#888" stroke-width="1"/>
    <line x1="280" y1="75" x2="330" y2="100" stroke="#888" stroke-width="1"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>
    <text x="260" y="150" font-size="12">After</text>
</svg>
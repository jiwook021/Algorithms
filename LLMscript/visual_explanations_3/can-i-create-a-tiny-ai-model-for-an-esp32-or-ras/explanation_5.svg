<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="60" width="120" height="80" rx="10" fill="#ADD8E6" stroke="black" stroke-width="2"/>
    <text x="35" y="95" font-family="Arial" font-size="16" fill="black">TensorFlow</text>
  <text x="70" y="115" font-family="Arial" font-size="16" fill="black">Lite</text>


  <line x1="140" y1="100" x2="180" y2="100" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="145" y="80" font-family="Arial" font-size="14" fill="black">Convert</text>


    <rect x="180" y="40" width="180" height="120" rx="10" fill="#90EE90" stroke="black" stroke-width="2"/>
    <text x="195" y="85" font-family="Arial" font-size="14" fill="black">TensorFlow Lite</text>
  <text x="230" y="105" font-family="Arial" font-size="14" fill="black">for</text>
  <text x="210" y="125" font-family="Arial" font-size="14" fill="black">Microcontrollers</text>
      <text x="190" y="145" font-family="Arial" font-size="10" fill="black">(Optimized for low-power)</text>


  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5"
        markerWidth="6" markerHeight="6"
        orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>
</svg>
<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="20" width="100" height="60" rx="5" fill="#ADD8E6" stroke="black" stroke-width="1"/>
    <text x="40" y="50" font-size="12">Sensor Data</text>

  <line x1="120" y1="50" x2="180" y2="50" stroke="black" marker-end="url(#arrow)" stroke-width="2"/>

  <rect x="180" y="20" width="100" height="60" rx="5" fill="#FFD700" stroke="black" stroke-width="1"/>
    <text x="190" y="45" font-size="12" font-family="Arial">TinyML Model</text>
      <text x="210" y="60" font-size="10" font-family="Arial">(ESP32)</text>

  <line x1="280" y1="50" x2="340" y2="50" stroke="black" marker-end="url(#arrow)" stroke-width="2"/>

  <rect x="340" y="20" width="50" height="60" rx="5" fill="#90EE90" stroke="black" stroke-width="1"/>
  <text x="345" y="50" font-size="12">Output</text>

  <text x="150" y="120" font-size="16">On-Device Inference</text>
      <text x="80" y="140" font-size="12" >(No Cloud Connection Needed)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5"
        markerWidth="6" markerHeight="6"
        orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>
</svg>
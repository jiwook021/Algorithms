<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">

  <rect x="20" y="20" width="100" height="60" rx="5" fill="#90EE90" stroke="black" stroke-width="1"/>
    <text x="40" y="55" font-size="12" font-family="Arial">FP32 Weights</text>
  <text x="20" y="95" font-size="10" font-family="Arial">Large Model Size</text>
  <line x1="120" y1="50" x2="180" y2="50" stroke="black" marker-end="url(#arrow)" stroke-width="2"/>

  <rect x="180" y="20" width="80" height="40" rx="5" fill="#FFD700" stroke="black" stroke-width="1"/>
    <text x="190" y="45" font-size="12" font-family="Arial">INT8 Weights</text>

  <text x="180" y="75" font-size="10" font-family="Arial">Smaller Model Size</text>

    <text x="140" y="120" font-size="14" font-family="Arial">Quantization</text>
      <text x="110" y="140" font-size="12" font-family="Arial">(Reduce Precision)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5"
        markerWidth="6" markerHeight="6"
        orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>
    <text x="20" y="200" font-size="10" font-family="Arial">FP32: Floating-Point 32-bit</text>
        <text x="20" y="220" font-size="10" font-family="Arial">INT8: Integer 8-bit</text>

</svg>
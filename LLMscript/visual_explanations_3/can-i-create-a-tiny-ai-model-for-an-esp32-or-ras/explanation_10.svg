<svg width="400" height="280" viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">

    <rect x="20" y="20" width="100" height="40" rx="5" fill="#90EE90" stroke="black"/>
  <text x="35" y="45" font-size="12">1. Train Model</text>

  <line x1="120" y1="40" x2="160" y2="40" stroke="black" marker-end="url(#arrow)"/>

  <rect x="160" y="20" width="100" height="40" rx="5" fill="#FFD700" stroke="black"/>
    <text x="170" y="45" font-size="12">2. Quantize/Prune</text>

  <line x1="260" y1="40" x2="300" y2="40" stroke="black" marker-end="url(#arrow)"/>

  <rect x="300" y="20" width="80" height="40" rx="5" fill="#ADD8E6" stroke="black"/>
    <text x="310" y="45" font-size="12">3. Convert</text>
    <text x="310" y="60" font-size="10">(TFLite Micro)</text>


    <line x1="200" y1="60" x2="200" y2="100" stroke="black" marker-end="url(#arrow)"/>

    <rect x="150" y="100" width="100" height="60" rx="5" fill="#ADD8E6" stroke="black"/>
        <text x="160" y="125" font-size="12">4. Deploy to</text>
    <text x="160" y="145" font-size="12">ESP32/RPi</text>


    <line x1="200" y1="160" x2="200" y2="200" stroke="black" marker-end="url(#arrow)"/>

      <rect x="150" y="200" width="100" height="40" rx="5" fill="#90EE90" stroke="black"/>
        <text x="180" y="225" font-size="12">5. Test</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5"
        markerWidth="6" markerHeight="6"
        orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>
      <text x="120" y="270" font-size="16">Development Workflow</text>

</svg>
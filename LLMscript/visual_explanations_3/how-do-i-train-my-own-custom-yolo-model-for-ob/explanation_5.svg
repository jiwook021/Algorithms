<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f0f0f0" />
  <text x="300" y="40" text-anchor="middle" font-size="24" font-weight="bold">5. Configure Training Parameters</text>

    <rect x="50" y="90" width="250" height="250" fill="#baffc9" stroke="black"/>
      <text x="70" y="120" text-anchor="start" font-size="16">Configuration File (YAML):</text>
        <text x="80" y="150" text-anchor="start" font-size="14">-  `nc`: Number of classes</text>
       <text x="80" y="180" text-anchor="start" font-size="14">- `train`: Path to training data</text>
      <text x="80" y="210" text-anchor="start" font-size="14">- `val`: Path to validation data</text>
      <text x="80" y="240" text-anchor="start" font-size="14">- `names`: List of class names</text>
        <text x="80" y="270" text-anchor="start" font-size="14">- Model Architecture (e.g. yolov8n.yaml)</text>
        <text x="80" y="300" text-anchor="start" font-size="14">- Hyperparameters</text>

    <rect x="330" y="90" width="220" height="150" fill="lightyellow" stroke="black"/>
      <text x="350" y="120" text-anchor="start" font-size="14">Hyperparameters:</text>
       <text x="360" y="150" text-anchor="start" font-size="12">- `epochs`</text>
    <text x="360" y="170" text-anchor="start" font-size="12">- `batch-size`</text>
     <text x="360" y="190" text-anchor="start" font-size="12">- `imgsz` (image size)</text>
        <text x="360" y="210" text-anchor="start" font-size="12">-  Learning Rate</text>

</svg>
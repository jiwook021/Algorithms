<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="400" height="300" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">1. Minimize Global Variables</text>

  <rect x="50" y="60" width="100" height="80" fill="#e67e22" />
  <text x="60" y="100" fill="white">Global Var</text>
    <line x1="150" y1="100" x2="200" y2="100" stroke="black" stroke-width="2"/>
    <polygon points="200,95 210,100 200,105" fill="black"/>
  <rect x="220" y="60" width="60" height="40" fill="#2ecc71" />
  <text x="230" y="85" fill="white">Func1</text>
    <line x1="150" y1="100" x2="200" y2="200" stroke="black" stroke-width="2"/>
      <polygon points="200,195 210,200 200,205" fill="black"/>
  <rect x="220" y="180" width="60" height="40" fill="#3498db" />
  <text x="230" y="205" fill="white">Func2</text>

  <text x="20" y="270" font-size="12">Use local variables within functions to avoid unintended side effects.</text>
</svg>
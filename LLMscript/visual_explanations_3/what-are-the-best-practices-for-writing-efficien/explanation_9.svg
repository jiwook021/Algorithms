<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
 <rect x="0" y="0" width="400" height="300" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">9. Use Compiler Optimizations</text>

  <rect x="50" y="80" width="100" height="80" fill="#e74c3c" />
  <text x="60" y="120" fill="white">Source Code</text>
  <line x1="150" y1="120" x2="190" y2="120" stroke="black" stroke-width="2" />
  <text x="160" y="95" >Compiler</text>
  <polygon points="190,115 200,120 190,125" fill="black" />
  <rect x="210" y="80" width="120" height="80" fill="#2ecc71" />
  <text x="220" y="120" fill="white">Optimized Code</text>
  <text x="20" y="200" font-size="14">Compiler Flags:</text>
  <text x="20" y="225" font-size="12">-O1, -O2, -O3 (optimization levels).</text>
  <text x="20" y="245" font-size="12">-Os (optimize for size).</text>
   <text x="20" y="270" font-size="12">Enable compiler optimizations for better performance and code size.</text>
</svg>
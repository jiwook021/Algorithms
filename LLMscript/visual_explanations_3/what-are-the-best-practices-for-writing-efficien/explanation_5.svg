<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="400" height="300" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">5. Use Bitwise Operations</text>

  <rect x="50" y="70" width="100" height="50" fill="#f1c40f" />
  <text x="60" y="100" fill="white">x = y | 0x02;</text>

  <rect x="180" y="70" width="180" height="50" fill="#3498db" />
  <text x="190" y="100" fill="white">x = set_bit(y, 1);</text>

    <text x="20" y="150" font-size="12">Bitwise operators (&amp;, |, ^, ~, &lt;&lt;, &gt;&gt;) are faster than</text>
    <text x="20" y="170" font-size="12">arithmetic operations for manipulating individual bits.</text>
     <text x="20" y="200" font-size="14">Example:</text>
      <text x="20" y="225" font-size="12">Setting bit 1:  y | 0x02  (OR)</text>
        <text x="20" y="245" font-size="12">Clearing bit 3: y &amp; ~0x08 (AND NOT)</text>
         <text x="20" y="265" font-size="12">Toggling bit 0:  y ^ 0x01 (XOR)</text>
</svg>
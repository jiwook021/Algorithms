<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="400" height="300" fill="#f0f0f0"/>
    <text x="20" y="30" font-size="18" font-weight="bold">7. Use Look-Up Tables (LUTs)</text>

      <rect x="50" y="70" width="100" height="150" fill="#2ecc71"/>
    <text x="75" y="90" fill="white">LUT</text>
        <text x="60" y="120" fill="black">Index | Value</text>
        <text x="60" y="140" fill="black">  0   |   10</text>
          <text x="60" y="160" fill="black">  1   |   25</text>
            <text x="60" y="180" fill="black">  2   |   42</text>
                <text x="60" y="200" fill="black"> ...  |  ...</text>


    <rect x="180" y="110" width="150" height="60" fill="#e74c3c"/>
        <text x="195" y="140" fill="white">Complex Calculation</text>

     <text x="20" y="245" font-size="14">Replace complex calculations with pre-calculated values in a table.</text>
     <text x="20" y="270" font-size="12">Faster access, but uses more memory.</text>
</svg>
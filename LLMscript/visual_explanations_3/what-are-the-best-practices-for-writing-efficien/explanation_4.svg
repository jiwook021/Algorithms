<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="400" height="300" fill="#f0f0f0" />
  <text x="20" y="30" font-size="18" font-weight="bold">4. Avoid Dynamic Memory Allocation</text>

  <rect x="50" y="80" width="100" height="80" fill="#e74c3c" />
  <text x="60" y="120" fill="white">malloc()</text>
    <line x1="150" y1="120" x2="200" y2="120" stroke="black" stroke-width="2"/>
     <polygon points="200,115 210,120 200,125" fill="black"/>

  <rect x="220" y="80" width="100" height="80" fill="#2ecc71" />
  <text x="230" y="120" fill="white">Static Allocation</text>

  <text x="20" y="200" font-size="14">Dynamic allocation can lead to:</text>
  <text x="20" y="225" font-size="12">- Fragmentation.</text>
  <text x="20" y="245" font-size="12">- Memory leaks.</text>
  <text x="20" y="265" font-size="12">- Unpredictable behavior.</text>
</svg>
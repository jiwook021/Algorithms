<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
    <text x="20" y="30" font-size="20" font-weight="bold">6.  Create Sensor-Specific Functions</text>

    <rect x="50" y="80" width="500" height="280" fill="#ffffff" stroke="black"/>
    <text x="70" y="110" font-size="18">Code Snippets (Conceptual)</text>

    <text x="80" y="140" font-size="14" fill="blue">uint16_t Read_Temperature() {</text>
    <text x="100" y="165" font-size="14" fill="green">  // 1. Send command to read temperature register (e.g., 0x02)</text>
    <text x="100" y="185" font-size="14" fill="green">  uint8_t command = 0x02;</text>
        <text x="100" y="205" font-size="14" fill="green">  SPI_TransmitReceive(command); </text>
    <text x="100" y="225" font-size="14" fill="green">  // 2. Read two bytes of temperature data</text>
        <text x="100" y="245" font-size="14" fill="green"> uint8_t highByte = SPI_TransmitReceive(0x00);</text>
     <text x="100" y="265" font-size="14" fill="green"> uint8_t lowByte =  SPI_TransmitReceive(0x00);</text>
    <text x="100" y="285" font-size="14" fill="green">  // 3. Combine bytes and return temperature value</text>
     <text x="100" y="305" font-size="14" fill="green"> return (highByte &lt;&lt; 8) | lowByte;</text>

    <text x="80" y="330" font-size="14" fill="blue">}</text>
</svg>
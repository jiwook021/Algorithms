<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
    <text x="20" y="30" font-size="20" font-weight="bold">7.  Testing and Debugging</text>

  <rect x="50" y="80" width="150" height="100" fill="#add8e6" stroke="black"/>
  <text x="70" y="130" font-size="16">Logic Analyzer</text>

  <rect x="250" y="80" width="150" height="100" fill="#90ee90" stroke="black"/>
    <text x="275" y="110" font-size="16">Oscilloscope</text>


    <rect x="450" y="80" width="100" height="100" fill="#ffffcc" stroke="black"/>
  <text x="465" y="130" font-size="16">Debugger</text>


    <text x="50" y="220" font-size="14">1. Verify SPI signals (MOSI, MISO, SCLK, CS) with a logic analyzer.</text>
        <text x="50" y="260" font-size="14">2. Check clock frequency and timing with an oscilloscope.</text>
    <text x="50" y="300" font-size="14">3. Use a debugger to step through code, set breakpoints, and inspect variables.</text>
    <text x="50" y="340" font-size="14">4. Print debug messages (e.g., using UART) to monitor program flow.</text>

</svg>
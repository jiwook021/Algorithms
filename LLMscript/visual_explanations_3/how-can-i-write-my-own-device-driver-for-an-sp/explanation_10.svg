<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
    <text x="20" y="30" font-size="20" font-weight="bold">10. Optimization and Best Practices</text>

    <rect x="30" y="70" width="540" height="300" fill="white" stroke="black"/>

    <text x="50" y="100" font-size="16" fill="blue">Techniques:</text>

    <text x="50" y="140" font-size="14">1. Minimize SPI transactions:</text>
     <text x="70" y="160" font-size="12">- Batch register reads/writes if possible.</text>
        <text x="70" y="175" font-size="12">- Avoid unnecessary communication.</text>

    <text x="50" y="205" font-size="14">2. Use DMA (Direct Memory Access):</text>
     <text x="70" y="225" font-size="12">- Offload SPI data transfer from the CPU.</text>
    <text x="70" y="240" font-size="12">-  Improve efficiency for large data transfers.</text>
    <text x="50" y="270" font-size="14">3.  Efficient Code:</text>
     <text x="70" y="290" font-size="12">- Use bitwise operations instead of division/multiplication where possible.</text>
        <text x="70" y="305" font-size="12">- Optimize loop structures.</text>

        <text x="50" y="335" font-size="14">4. Power Management:</text>
        <text x="70" y="355" font-size="12">- Put the sensor into low-power mode when not in use.</text>
</svg>
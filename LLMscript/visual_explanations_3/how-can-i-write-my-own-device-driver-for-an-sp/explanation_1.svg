<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="400" fill="#f0f0f0" />
  <text x="20" y="30" font-size="20" font-weight="bold">1. Understand the SPI Protocol</text>

  <rect x="50" y="80" width="100" height="50" fill="#add8e6" stroke="black" />
  <text x="70" y="110" font-size="16">CPU/MCU</text>

  <rect x="250" y="80" width="100" height="50" fill="#90ee90" stroke="black" />
  <text x="270" y="110" font-size="16">SPI Sensor</text>

  <line x1="150" y1="105" x2="250" y2="105" stroke="blue" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="180" y="95" font-size="14" fill="blue">MOSI</text>

  <line x1="250" y1="135" x2="150" y2="135" stroke="green" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="180" y="150" font-size="14" fill="green">MISO</text>

  <line x1="100" y1="70" x2="100" y2="80" stroke="red" stroke-width="3" />
    <line x1="300" y1="70" x2="300" y2="80" stroke="red" stroke-width="3" />
  <text x="90" y="60" font-size="14" fill="red">SCLK</text>

  <line x1="80" y1="150" x2="80" y2="160" stroke="purple" stroke-width="3" />
    <line x1="280" y1="150" x2="280" y2="160" stroke="purple" stroke-width="3" />
  <text x="70" y="175" font-size="14" fill="purple">CS/SS</text>

    <text x="50" y="220" font-size="14" fill="black">MOSI: Master Out Slave In (Data from CPU to Sensor)</text>
    <text x="50" y="240" font-size="14" fill="black">MISO: Master In Slave Out (Data from Sensor to CPU)</text>
      <text x="50" y="260" font-size="14" fill="black">SCLK: Serial Clock (Synchronization signal)</text>
    <text x="50" y="280" font-size="14" fill="black">CS/SS: Chip Select / Slave Select (Activates the sensor)</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="currentColor" />
    </marker>
  </defs>
</svg>
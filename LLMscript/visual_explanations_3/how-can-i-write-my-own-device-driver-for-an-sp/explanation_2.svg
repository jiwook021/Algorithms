<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
    <text x="20" y="30" font-size="20" font-weight="bold">2.  Sensor Datasheet Analysis</text>

    <rect x="50" y="80" width="200" height="250" fill="#ffffff" stroke="black"/>
    <text x="70" y="110" font-size="18" font-weight="bold">Datasheet</text>

    <text x="80" y="140" font-size="14">Register Map</text>
      <line x1="70" y1="145" x2="230" y2="145" stroke="black"/>
    <text x="80" y="160" font-size="12"> - Register Address 0x01: Device ID</text>
    <text x="80" y="180" font-size="12"> - Register Address 0x02: Temperature</text>
    <text x="80" y="200" font-size="12"> - Register Address 0x03: Configuration</text>

    <text x="80" y="240" font-size="14">SPI Timing</text>
    <line x1="70" y1="245" x2="230" y2="245" stroke="black"/>
    <text x="80" y="260" font-size="12"> - Clock Polarity (CPOL)</text>
    <text x="80" y="280" font-size="12"> - Clock Phase (CPHA)</text>
    <text x="80" y="300" font-size="12"> - Max Clock Frequency</text>

    <text x="300" y="100" font-size="16" fill="blue">Key Information:</text>
    <text x="300" y="130" font-size="14" fill="blue">- Register Addresses</text>
    <text x="300" y="150" font-size="14" fill="blue">- Data format</text>
    <text x="300" y="170" font-size="14" fill="blue">- SPI Mode (CPOL/CPHA)</text>
    <text x="300" y="190" font-size="14" fill="blue">- Timing constraints</text>
    <text x="300" y="210" font-size="14" fill="blue">- Initialization sequence</text>
</svg>
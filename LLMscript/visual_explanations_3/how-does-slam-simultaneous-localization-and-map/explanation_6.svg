<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f0f0f0" />
  <circle cx="50" cy="150" r="20" fill="blue" />
  <text x="40" y="190" font-size="16">Robot</text>
  <rect x="200" y="100" width="40" height="60" fill="green" />
  <text x="200" y="90" font-size="14">Landmark</text>

  <circle cx="50" cy="150" r="40" fill="none" stroke="red" stroke-dasharray="4"/>
  <text x="90" y="150" font-size="14" fill="red">Uncertainty</text>

  <text x="20" y="30" font-size="20" font-weight="bold">6. Uncertainty</text>
  <text x="20" y="60" font-size="14">Both robot position and landmark locations have uncertainty.</text>
   <text x="20" y="80" font-size="14">SLAM algorithms estimate and manage this uncertainty.</text>
</svg>
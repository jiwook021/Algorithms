<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="50" y="50" width="150" height="150" fill="#ADD8E6" stroke="black" stroke-width="2"/>
  <text x="125" y="130" text-anchor="middle" font-size="16">Main System</text>

  <rect x="400" y="50" width="150" height="150" fill="#FFD700" stroke="black" stroke-width="2"/>
  <text x="475" y="130" text-anchor="middle" font-size="16">Watchdog Timer</text>
  <text x="475" y="150" text-anchor="middle" font-size="14">(Counting Down)</text>

  <line x1="200" y1="125" x2="400" y2="125" stroke="green" stroke-width="3" marker-end="url(#arrowhead)"/>
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="0" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="green" />
        </marker>
    </defs>
  <text x="300" y="100" text-anchor="middle" font-size="14">"Pet the Dog"</text>
    <text x="300" y="180" text-anchor="middle" font-size="14">(Reset Signal)</text>


  <text x="300" y="250" text-anchor="middle" font-size="20" font-weight="bold">Watchdog Reset</text>
  <text x="300" y="280" text-anchor="middle" font-size="14">The system regularly resets the watchdog timer.</text>
</svg>
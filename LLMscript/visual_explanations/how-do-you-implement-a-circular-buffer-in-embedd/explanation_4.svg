<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <title>Circular Buffer - Wrap Around</title>
  <rect x="0" y="0" width="600" height="400" fill="#f0f0f0" />

  <!-- Buffer representation -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="500" height="50" fill="#ffffff" stroke="black" />
    <text x="250" y="-20" text-anchor="middle" font-size="18" font-weight="bold">Wrap Around (Writing 'F')</text>

    <!-- Individual cells -->
    <line x1="50" y1="0" x2="50" y2="50" stroke="black" />
    <line x1="100" y1="0" x2="100" y2="50" stroke="black" />
    <line x1="150" y1="0" x2="150" y2="50" stroke="black" />
    <line x1="200" y1="0" x2="200" y2="50" stroke="black" />
    <line x1="250" y1="0" x2="250" y2="50" stroke="black" />
    <line x1="300" y1="0" x2="300" y2="50" stroke="black" />
    <line x1="350" y1="0" x2="350" y2="50" stroke="black" />
    <line x1="400" y1="0" x2="400" y2="50" stroke="black" />
    <line x1="450" y1="0" x2="450" y2="50" stroke="black" />
    <!-- Data (before) -->
    <text x="75" y="30" text-anchor="middle" font-size="14">B</text>
    <text x="125" y="30" text-anchor="middle" font-size="14">C</text>
    <text x="175" y="30" text-anchor="middle" font-size="14">D</text>
    <text x="225" y="30" text-anchor="middle" font-size="14">E</text>
    <text x="275" y="30" text-anchor="middle" font-size="14">J</text>
    <text x="325" y="30" text-anchor="middle" font-size="14">K</text>
    <text x="375" y="30" text-anchor="middle" font-size="14">L</text>
    <text x="425" y="30" text-anchor="middle" font-size="14">M</text>
    <text x="475" y="30" text-anchor="middle" font-size="14">N</text>

    <!-- Head pointer (before) -->
    <polygon points="475,60 465,75 485,75" fill="blue" />
    <text x="475" y="90" text-anchor="middle" font-size="14" fill="blue">Head</text>

    <!-- Tail pointer (before) -->
    <polygon points="75,60 65,75 85,75" fill="green" />
    <text x="75" y="90" text-anchor="middle" font-size="14" fill="green">Tail</text>
  </g>

  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="500" height="50" fill="#ffffff" stroke="black" />
    <text x="250" y="-20" text-anchor="middle" font-size="18" font-weight="bold">After Wrap Around</text>

    <!-- Individual cells -->
        <line x1="50" y1="0" x2="50" y2="50" stroke="black" />
        <line x1="100" y1="0" x2="100" y2="50" stroke="black" />
        <line x1="150" y1="0" x2="150" y2="50" stroke="black" />
        <line x1="200" y1="0" x2="200" y2="50" stroke="black" />
        <line x1="250" y1="0" x2="250" y2="50" stroke="black" />
        <line x1="300" y1="0" x2="300" y2="50" stroke="black" />
        <line x1="350" y1="0" x2="350" y2="50" stroke="black" />
        <line x1="400" y1="0" x2="400" y2="50" stroke="black" />
        <line x1="450" y1="0" x2="450" y2="50" stroke="black" />
    <!-- Data (after) -->
    <text x="25" y="30" text-anchor="middle" font-size="14">F</text>
    <text x="75" y="30" text-anchor="middle" font-size="14">B</text>
    <text x="125" y="30" text-anchor="middle" font-size="14">C</text>
    <text x="175" y="30" text-anchor="middle" font-size="14">D</text>
    <text x="225" y="30" text-anchor="middle" font-size="14">E</text>
      <text x="275" y="30" text-anchor="middle" font-size="14">J</text>
    <text x="325" y="30" text-anchor="middle" font-size="14">K</text>
    <text x="375" y="30" text-anchor="middle" font-size="14">L</text>
    <text x="425" y="30" text-anchor="middle" font-size="14">M</text>
    <text x="475" y="30" text-anchor="middle" font-size="14">N</text>

    <!-- Head pointer (after) -->
    <polygon points="25,60 15,75 35,75" fill="blue" />
    <text x="25" y="90" text-anchor="middle" font-size="14" fill="blue">Head</text>

    <!-- Tail pointer (after) -->
    <polygon points="75,60 65,75 85,75" fill="green" />
    <text x="75" y="90" text-anchor="middle" font-size="14" fill="green">Tail</text>
  </g>

   <text x="50" y="350" font-size="14">
    When Head or Tail reaches the end of the array, it wraps around to the beginning.
  </text>
</svg>
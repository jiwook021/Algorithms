<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="300" fill="#f0f0f0" />
  <text x="20" y="30" font-size="20" font-weight="bold">I2C Arbitration - Concept 1: Open-Drain Logic</text>

  <!-- Bus Lines -->
  <line x1="50" y1="100" x2="550" y2="100" stroke="black" stroke-width="3" />
  <text x="50" y="90" font-size="16">SDA (Data)</text>
  <line x1="50" y1="150" x2="550" y2="150" stroke="black" stroke-width="3" />
  <text x="50" y="140" font-size="16">SCL (Clock)</text>

  <!-- Device 1 -->
  <rect x="100" y="180" width="80" height="60" fill="lightblue" stroke="black" />
  <text x="120" y="210" font-size="14">Device 1</text>
  <line x1="140" y1="180" x2="140" y2="100" stroke="black" stroke-width="2" />
    <polygon points="135,110 140,100 145,110" fill="black" />


  <!-- Device 2 -->
  <rect x="400" y="180" width="80" height="60" fill="lightgreen" stroke="black" />
  <text x="420" y="210" font-size="14">Device 2</text>
  <line x1="440" y1="180" x2="440" y2="100" stroke="black" stroke-width="2" />
    <polygon points="435,110 440,100 445,110" fill="black" />

  <!-- Pull-up Resistor -->
  <line x1="280" y1="50" x2="280" y2="100" stroke="black" stroke-width="2" />
    <polygon points="275,50 280,60 285,50" fill="black" />
  <rect x="265" y1="65" width="30" height="10" stroke="black" fill="white"/>
    <text x="295" y="80">Rp</text>

  <text x="50" y="270" font-size="14">Devices pull lines LOW, but can only release them HIGH (pulled up by Rp).</text>
</svg>
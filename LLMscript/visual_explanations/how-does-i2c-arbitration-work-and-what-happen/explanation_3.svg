<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="400" fill="#f0f0f0" />
  <text x="20" y="30" font-size="20" font-weight="bold">I2C Arbitration - Concept 3: Address Transmission</text>

  <!-- Bus Lines -->
  <line x1="50" y1="100" x2="550" y2="100" stroke="black" stroke-width="3" />
  <text x="50" y="90" font-size="16">SDA (Data)</text>
  <line x1="50" y1="150" x2="550" y2="150" stroke="black" stroke-width="3" />
  <text x="50" y="140" font-size="16">SCL (Clock)</text>

  <!-- Device 1 Address -->
  <text x="100" y="200" font-size="14">Device 1 Address: 1011001</text>
  <rect x="98" y="210" width="14" height="14" fill="blue"/>
  <rect x="112" y="210" width="14" height="14" fill="white"/>
  <rect x="126" y="210" width="14" height="14" fill="blue"/>
  <rect x="140" y="210" width="14" height="14" fill="blue"/>
  <rect x="154" y="210" width="14" height="14" fill="white"/>
  <rect x="168" y="210" width="14" height="14" fill="white"/>
  <rect x="182" y="210" width="14" height="14" fill="blue"/>

  <!-- Device 2 Address -->
  <text x="350" y="200" font-size="14">Device 2 Address: 1010110</text>
   <rect x="348" y="210" width="14" height="14" fill="blue"/>
  <rect x="362" y="210" width="14" height="14" fill="white"/>
  <rect x="376" y="210" width="14" height="14" fill="blue"/>
  <rect x="390" y="210" width="14" height="14" fill="white"/>
  <rect x="404" y="210" width="14" height="14" fill="blue"/>
  <rect x="418" y="210" width="14" height="14" fill="blue"/>
  <rect x="432" y="210" width="14" height="14" fill="white"/>

  <!-- SDA Line during Address Transmission -->
  <text x="180" y="265" font-size="18">SDA during Transmission</text>

   <line x1="50" y1="300" x2="500" y2="300" stroke="orange" stroke-width="5" />
      <line x1="50" y1="300" x2="50" y2="280" stroke="orange" stroke-width="5" />
      <line x1="50" y1="280" x2="100" y2="280" stroke="orange" stroke-width="5" />

      <line x1="100" y1="280" x2="100" y2="300" stroke="orange" stroke-width="5" />
      <line x1="100" y1="300" x2="150" y2="300" stroke="orange" stroke-width="5" />

       <line x1="150" y1="300" x2="150" y2="280" stroke="orange" stroke-width="5" />
      <line x1="150" y1="280" x2="200" y2="280" stroke="orange" stroke-width="5" />

       <line x1="200" y1="280" x2="200" y2="300" stroke="orange" stroke-width="5" />
      <line x1="200" y1="300" x2="250" y2="300" stroke="orange" stroke-width="5" />
      
      <line x1="250" y1="300" x2="250" y2="280" stroke="orange" stroke-width="5" />
      <line x1="250" y1="280" x2="300" y2="280" stroke="orange" stroke-width="5" />

      <line x1="300" y1="280" x2="300" y2="280" stroke="orange" stroke-width="5" />
      <line x1="300" y1="280" x2="350" y2="280" stroke="orange" stroke-width="5" />

       <line x1="350" y1="280" x2="350" y2="280" stroke="orange" stroke-width="5" />
      <line x1="350" y1="280" x2="400" y2="280" stroke="orange" stroke-width="5" />

  <text x="50" y="350" font-size="14">Each device transmits its address bit by bit, MSB first.</text>
  <text x="50" y="370" font-size="14">Devices monitor SDA *after* releasing it HIGH.  If it's LOW, another device is transmitting.</text>
</svg>
<svg width="600" height="350" viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="350" fill="#f0f0f0" />
  <text x="20" y="30" font-size="20" font-weight="bold">I2C Arbitration - Concept 5: Arbitration Complete</text>

  <!-- Bus Lines -->
  <line x1="50" y1="100" x2="550" y2="100" stroke="black" stroke-width="3" />
  <text x="50" y="90" font-size="16">SDA (Data)</text>
  <line x1="50" y1="150" x2="550" y2="150" stroke="black" stroke-width="3" />
  <text x="50" y="140" font-size="16">SCL (Clock)</text>

  <!-- Device 2 (Winning Device) -->
   <rect x="300" y="180" width="80" height="60" fill="lightgreen" stroke="black" />
  <text x="320" y="210" font-size="14">Device 2</text>
  <line x1="340" y1="180" x2="340" y2="100" stroke="black" stroke-width="2" />
  <polygon points="335,110 340,100 345,110" fill="black" />

  <!-- Device 1 (Losing Device - in Receive Mode) -->
  <rect x="100" y="180" width="80" height="60" fill="lightgray" stroke="black" />
    <text x="120" y="210" font-size="14">Device 1</text>
     <line x1="140" y1="180" x2="140" y2="100" stroke="gray" stroke-width="2"  stroke-dasharray="4"/>

  <!-- Data Transfer Visualization (Simplified) -->
    <line x1="100" y1="280" x2="500" y2="280" stroke="orange" stroke-width="5" />

      <line x1="100" y1="280" x2="100" y2="260" stroke="orange" stroke-width="5" />
      <line x1="100" y1="260" x2="150" y2="260" stroke="orange" stroke-width="5" />

      <line x1="150" y1="260" x2="150" y2="280" stroke="orange" stroke-width="5" />
      <line x1="150" y1="280" x2="200" y2="280" stroke="orange" stroke-width="5" />

       <line x1="200" y1="280" x2="200" y2="260" stroke="orange" stroke-width="5" />
      <line x1="200" y1="260" x2="250" y2="260" stroke="orange" stroke-width="5" />

       <line x1="250" y1="260" x2="250" y2="280" stroke="orange" stroke-width="5" />
      <line x1="250" y1="280" x2="300" y2="280" stroke="orange" stroke-width="5" />

        <text x="200" y="310" font-size="14">Data Transfer</text>

  <text x="50" y="330" font-size="14">Device 2 continues transmitting. Device 1 may become a receiver.</text>
</svg>
<svg width="600" height="350" viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="350" fill="#f0f0f0" />
  <text x="20" y="30" font-size="20" font-weight="bold">I2C Arbitration - Concept 2: START Condition</text>

  <!-- Bus Lines -->
  <line x1="50" y1="100" x2="550" y2="100" stroke="black" stroke-width="3" />
  <text x="50" y="90" font-size="16">SDA (Data)</text>
  <line x1="50" y1="150" x2="550" y2="150" stroke="black" stroke-width="3" />
  <text x="50" y="140" font-size="16">SCL (Clock)</text>

  <!-- START Condition Visualization -->
    <line x1="100" y1="100" x2="150" y2="100" stroke="blue" stroke-width="5" />
    <line x1="150" y1="100" x2="150" y2="150" stroke="blue" stroke-width="5" />
    <line x1="150" y1="150" x2="200" y2="150" stroke="blue" stroke-width="5"/>

    <line x1="100" y1="150" x2="150" y2="150" stroke="green" stroke-width="5" />

    <text x="130" y="200" font-size="18">START</text>
    <text x="50" y="240" font-size="14">SDA goes LOW while SCL is HIGH.</text>
     <text x="50" y="270" font-size="14">Both Devices may try starting at (nearly) the same moment.</text>
  <!-- Device 1 -->
  <rect x="300" y="80" width="80" height="60" fill="lightblue" stroke="black" />
  <text x="320" y="110" font-size="14">Device 1</text>

  <!-- Device 2 -->
  <rect x="450" y="80" width="80" height="60" fill="lightgreen" stroke="black" />
  <text x="470" y="110" font-size="14">Device 2</text>

</svg>
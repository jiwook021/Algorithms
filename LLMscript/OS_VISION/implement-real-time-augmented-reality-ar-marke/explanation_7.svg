<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#F0F0F0"/>
    <!-- ArUco Marker Structure -->
    <rect x="200" y="100" width="200" height="200" fill="black"/>
    <rect x="210" y="110" width="180" height="180" fill="white"/>
    <rect x="220" y="120" width="160" height="160" fill="black"/>
    
    <!-- Inner Grid -->
    <rect x="240" y="140" width="30" height="30" fill="white"/>
    <rect x="240" y="180" width="30" height="30" fill="black"/>
    <rect x="280" y="140" width="30" height="30" fill="black"/>
    <rect x="320" y="180" width="30" height="30" fill="white"/>
    
    <!-- Labels -->
    <text x="300" y="80" font-size="18" text-anchor="middle" fill="darkred">ArUco Marker Structure</text>
    <text x="160" y="140" font-size="14" text-anchor="end" fill="black">Black border</text>
    <text x="160" y="180" font-size="14" text-anchor="end" fill="black">White margin</text>
    <text x="160" y="220" font-size="14" text-anchor="end" fill="black">Encoded grid</text>
    <text x="360" y="250" font-size="14" fill="black">ID: 1001</text>
    
    <!-- Code Example -->
    <rect x="50" y="300" width="500" height="80" fill="#2B2B2B" rx="5"/>
    <text x="60" y="325" font-size="14" fill="#CCCCCC" font-family="monospace">cv::aruco::Dictionary dict = cv::aruco::getPredefinedDictionary(</text>
    <text x="60" y="350" font-size="14" fill="#CCCCCC" font-family="monospace">    cv::aruco::DICT_4X4_1000);</text>
</svg>
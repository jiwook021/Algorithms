<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Camera Input -->
    <rect x="50" y="100" width="200" height="200" fill="#ddd" stroke="#333"/>
    <path d="M75 120 L225 120 L200 100 L100 100 Z" fill="#ccc"/>
    <circle cx="150" cy="150" r="40" fill="#fff" stroke="#333"/>
    
    <!-- ArUco Marker -->
    <g transform="translate(350 150)">
        <rect x="-40" y="-40" width="80" height="80" fill="#fff" stroke="#333"/>
        <rect x="-30" y="-30" width="20" height="20" fill="#000"/>
        <rect x="10" y="10" width="20" height="20" fill="#000"/>
        <path d="M-20-20L20 20M-20 20L20-20" stroke="#f00" stroke-width="3"/>
    </g>
    
    <!-- Detection Process -->
    <path d="M250 150 L330 150" stroke="#06f" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="280" y="140" font-size="12" text-anchor="middle">detectMarkers()</text>
    
    <!-- Code Example -->
    <g transform="translate(50 320)">
        <rect width="500" height="70" fill="#e0e0e0" rx="5"/>
        <text x="10" y="20" font-family="monospace" font-size="12" fill="#333">
            <tspan x="10" dy="1.2em">cv::aruco::Dictionary dict = cv::aruco::getPredefinedDictionary(DICT_6X6_250);</tspan>
            <tspan x="10" dy="1.2em">std::vector&lt;int&gt; ids; std::vector&lt;std::vector&lt;cv::Point2f&gt;&gt; corners;</tspan>
            <tspan x="10" dy="1.2em">cv::aruco::detectMarkers(frame, dict, corners, ids);</tspan>
        </text>
    </g>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#06f"/>
    </marker>
</svg>
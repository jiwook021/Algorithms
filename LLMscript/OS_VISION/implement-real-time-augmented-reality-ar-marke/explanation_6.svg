<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <g transform="translate(50,50)">
    <!-- Processing Pipeline -->
    <rect x="0" y="0" width="150" height="60" fill="#3498db" rx="5"/>
    <text x="75" y="35" font-family="monospace" font-size="14" fill="white" text-anchor="middle">1. Capture Frame</text>

    <rect x="200" y="0" width="150" height="60" fill="#e74c3c" rx="5"/>
    <text x="275" y="35" font-family="monospace" font-size="14" fill="white" text-anchor="middle">2. Detect Markers</text>

    <rect x="400" y="0" width="150" height="60" fill="#2ecc71" rx="5"/>
    <text x="475" y="35" font-family="monospace" font-size="14" fill="white" text-anchor="middle">3. Estimate Pose</text>

    <rect x="200" y="150" width="150" height="60" fill="#9b59b6" rx="5"/>
    <text x="275" y="185" font-family="monospace" font-size="14" fill="white" text-anchor="middle">4. Render AR</text>

    <!-- Arrows -->
    <path d="M150,30 L200,30" stroke="#2c3e50" stroke-width="2"/>
    <path d="M350,30 L400,30" stroke="#2c3e50" stroke-width="2"/>
    <path d="M475,90 L475,150" stroke="#2c3e50" stroke-width="2"/>
    <path d="M275,210 L275,280" stroke="#2c3e50" stroke-width="2"/>
    <path d="M275,280 L150,280 L150,30" stroke="#2c3e50" stroke-width="2" fill="none" stroke-dasharray="4"/>

    <!-- Code Example -->
    <g transform="translate(50,250)">
      <rect x="0" y="0" width="500" height="100" fill="#2c3e50" rx="5"/>
      <text x="10" y="20" font-family="monospace" font-size="12" fill="#ecf0f1">
        <tspan x="10" dy="1.2em">cv::VideoCapture cap(0);</tspan>
        <tspan x="10" dy="1.2em">while (true) {</tspan>
        <tspan x="20" dy="1.2em">cv::Mat frame;</tspan>
        <tspan x="20" dy="1.2em">cap >> frame; // Step 1</tspan>
        <tspan x="20" dy="1.2em">std::vector&lt;int&gt; ids; // Step 2</tspan>
        <tspan x="20" dy="1.2em">cv::aruco::detectMarkers(frame, dict, corners, ids);</tspan>
        <tspan x="10" dy="1.2em">}</tspan>
      </text>
    </g>
  </g>
</svg>
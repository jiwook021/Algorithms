<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#F0F0F0"/>
    <!-- Pose Estimation -->
    <path d="M300 100 L250 200 L350 200 Z" fill="#666" opacity="0.8"/>
    <rect x="250" y="200" width="100" height="50" fill="#444" opacity="0.8"/>
    
    <!-- Marker in 3D Space -->
    <rect x="400" y="200" width="80" height="80" transform="rotate(-30 400 200)" fill="none" stroke="green" stroke-width="3"/>
    <path d="M400 200 l-50 20" stroke="purple" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M400 200 l-30 -40" stroke="orange" stroke-width="3" marker-end="url(#arrow)"/>
    
    <!-- Coordinate Systems -->
    <path d="M300 250 l50 0" stroke="red" stroke-width="2"/>
    <path d="M300 250 l0 -50" stroke="green" stroke-width="2"/>
    <path d="M300 250 l-30 30" stroke="blue" stroke-width="2"/>
    
    <path d="M400 200 l40 0" stroke="red" stroke-width="2"/>
    <path d="M400 200 l0 -40" stroke="green" stroke-width="2"/>
    <path d="M400 200 l-28 28" stroke="blue" stroke-width="2"/>
    
    <!-- Labels -->
    <text x="300" y="80" font-size="18" text-anchor="middle" fill="darkgreen">Pose Estimation</text>
    <text x="320" y="280" font-size="14" fill="purple">Translation (tvec)</text>
    <text x="320" y="300" font-size="14" fill="orange">Rotation (rvec)</text>
    
    <!-- Code Example -->
    <rect x="50" y="300" width="500" height="80" fill="#2B2B2B" rx="5"/>
    <text x="60" y="325" font-size="14" fill="#CCCCCC" font-family="monospace">cv::Mat rvec, tvec;</text>
    <text x="60" y="350" font-size="14" fill="#CCCCCC" font-family="monospace">cv::solvePnP(markerCorners, objectPoints, cameraMatrix, distCoeffs, rvec, tvec);</text>
    
    <!-- Arrow marker definition -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/>
        </marker>
    </defs>
</svg>
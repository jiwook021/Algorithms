<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <g transform="translate(50,50)">
    <!-- ArUco Marker Structure -->
    <rect x="0" y="0" width="200" height="200" fill="#2c3e50"/>
    <rect x="20" y="20" width="160" height="160" fill="#ecf0f1"/>
    
    <!-- Data Bits -->
    <rect x="40" y="40" width="30" height="30" fill="#2c3e50"/>
    <rect x="110" y="40" width="30" height="30" fill="#2ecc71"/>
    <rect x="40" y="110" width="30" height="30" fill="#e74c3c"/>
    <rect x="110" y="110" width="30" height="30" fill="#3498db"/>
    
    <!-- Labels -->
    <text x="100" y="240" font-family="monospace" font-size="14" fill="#2c3e50" text-anchor="middle">ArUco Marker Structure</text>
    <text x="100" y="270" font-family="monospace" font-size="12" fill="#7f8c8d" text-anchor="middle">5x5 grid with border</text>
    <text x="100" y="290" font-family="monospace" font-size="12" fill="#7f8c8d" text-anchor="middle">Black border (quiet zone)</text>
    <text x="100" y="310" font-family="monospace" font-size="12" fill="#7f8c8d" text-anchor="middle">Data bits encode ID</text>
    
    <!-- Code Example -->
    <g transform="translate(300,20)">
      <rect x="0" y="0" width="260" height="160" fill="#2c3e50" rx="5"/>
      <text x="10" y="30" font-family="monospace" font-size="12" fill="#ecf0f1">
        <tspan x="10" dy="1.2em">// Generate ArUco marker</tspan>
        <tspan x="10" dy="1.2em">cv::aruco::Dictionary dict = </tspan>
        <tspan x="10" dy="1.2em">  cv::aruco::getPredefinedDictionary(</tspan>
        <tspan x="10" dy="1.2em">  cv::aruco::DICT_4X4_100);</tspan>
        <tspan x="10" dy="1.2em">cv::Mat marker;</tspan>
        <tspan x="10" dy="1.2em">cv::aruco::drawMarker(dict, 23, 200, marker);</tspan>
      </text>
    </g>
  </g>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <style>
        .text { font: 14px sans-serif; }
        .title { font: bold 20px sans-serif; fill: #2c3e50; }
        .camera { fill: #3498db; }
        .marker { fill: none; stroke: #2c3e50; stroke-width: 2; }
        .code-bg { fill: #ecf0f1; stroke: #bdc3c7; }
        .axis { stroke-width: 2; }
    </style>

    <!-- Title -->
    <text class="title" x="300" y="30" text-anchor="middle">AR Marker Detection &amp; Pose Estimation</text>

    <!-- Camera Visualization -->
    <rect x="50" y="100" width="80" height="60" class="camera"/>
    <circle cx="90" cy="130" r="15" fill="#2c3e50"/>
    <text class="text" x="40" y="180">Camera</text>

    <!-- Image Processing Flow -->
    <path d="M150 130h50" fill="none" stroke="#2c3e50" stroke-width="2"/>
    <polygon points="200 130, 190 125, 190 135" fill="#2c3e50"/>

    <!-- ArUco Marker -->
    <g transform="translate(260 80)">
        <rect x="0" y="0" width="120" height="120" class="marker"/>
        <path d="M30 30v60h60v-60z M30 30h60M30 90h60" stroke="#2c3e50" stroke-width="4"/>
        <text class="text" x="60" y="140" text-anchor="middle">ArUco Marker (ID: 42)</text>
    </g>

    <!-- Coordinate Systems -->
    <g transform="translate(420 100)">
        <!-- Camera Coordinates -->
        <g transform="translate(0 0)">
            <line x1="0" y1="0" x2="40" y2="0" class="axis" stroke="#e74c3c"/>
            <line x1="0" y1="0" x2="0" y2="-40" class="axis" stroke="#27ae60"/>
            <line x1="0" y1="0" x2="0" y2="30" class="axis" stroke="#2980b9"/>
            <text class="text" x="45" y="5">X</text>
            <text class="text" x="-5" y="-45">Y</text>
            <text class="text" x="5" y="40">Z</text>
        </g>

        <!-- Marker Coordinates -->
        <g transform="translate(100 70)">
            <line x1="0" y1="0" x2="30" y2="15" class="axis" stroke="#c0392b"/>
            <line x1="0" y1="0" x2="-15" y2="-25" class="axis" stroke="#239b56"/>
            <line x1="0" y1="0" x2="10" y2="30" class="axis" stroke="#2471a3"/>
            <text class="text" x="35" y="20">X'</text>
            <text class="text" x="-20" y="-30">Y'</text>
            <text class="text" x="15" y="35">Z'</text>
        </g>
    </g>

    <!-- Code Example -->
    <rect x="30" y="240" width="540" height="140" class="code-bg" rx="5"/>
    <text class="text" font-family="monospace" font-size="12" x="40" y="260">
        <tspan x="40" dy="20">// Detect ArUco markers</tspan>
        <tspan x="40" dy="20">vector&lt;int&gt; markerIds;</tspan>
        <tspan x="40" dy="20">vector&lt;vector&lt;Point2f&gt;&gt; corners;</tspan>
        <tspan x="40" dy="20">aruco::detectMarkers(frame, dictionary, </tspan>
        <tspan x="40" dy="20">               corners, markerIds);</tspan>
        <tspan x="40" dy="20">// Estimate pose</tspan>
        <tspan x="40" dy="20">vector&lt;Vec3d&gt; rvecs, tvecs;</tspan>
        <tspan x="40" dy="20">aruco::estimatePoseSingleMarkers(</tspan>
        <tspan x="40" dy="20">       corners, 0.05, cameraMatrix, </tspan>
        <tspan x="40" dy="20">       distCoeffs, rvecs, tvecs);</tspan>
    </text>
</svg>
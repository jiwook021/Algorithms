<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Coordinate Systems -->
    <g transform="translate(100 100)">
        <line x1="0" y1="0" x2="100" y2="0" stroke="#f00" stroke-width="2"/>
        <line x1="0" y1="0" x2="0" y2="-100" stroke="#0f0" stroke-width="2"/>
        <line x1="0" y1="0" x2="-30" y2="50" stroke="#00f" stroke-width="2"/>
        <text x="110" y="0" fill="#f00" font-size="12">X (Right)</text>
        <text x="0" y="-110" fill="#0f0" font-size="12">Y (Up)</text>
        <text x="-40" y="60" fill="#00f" font-size="12">Z (Back)</text>
    </g>
    
    <!-- Camera Representation -->
    <g transform="translate(400 200)">
        <path d="M-50-30 L50-30 L30 30 L-30 30 Z" fill="#ddd" stroke="#333"/>
        <circle cx="0" cy="0" r="20" fill="#fff" stroke="#333"/>
    </g>
    
    <!-- Pose Estimation -->
    <path d="M300 150 Q400 100 500 200" stroke="#06f" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
    <text x="400" y="80" font-size="12" text-anchor="middle">estimatePoseSingleMarkers()</text>
    
    <!-- Rotation/Translation Vectors -->
    <g transform="translate(100 300)">
        <rect width="200" height="60" fill="#e0e0e0" rx="5"/>
        <text x="10" y="20" font-family="monospace" font-size="12" fill="#333">
            <tspan x="10" dy="1.2em">std::vector&lt;cv::Vec3d&gt; rvecs, tvecs;</tspan>
            <tspan x="10" dy="1.2em">cv::aruco::estimatePoseSingleMarkers(</tspan>
            <tspan x="20" dy="1.2em">corners, 0.05, cameraMatrix, distCoeffs, rvecs, tvecs);</tspan>
        </text>
    </g>
    
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#06f"/>
    </marker>
</svg>
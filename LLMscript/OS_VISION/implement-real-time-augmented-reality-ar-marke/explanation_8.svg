<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#F0F0F0"/>
    <!-- Camera Visualization -->
    <path d="M300 100 L250 200 L350 200 Z" fill="#666"/>
    <rect x="250" y="200" width="100" height="50" fill="#444"/>
    
    <!-- Marker Detection -->
    <rect x="100" y="250" width="100" height="100" fill="none" stroke="green" stroke-width="3"/>
    <path d="M100 250 L50 200 L150 150 L200 200 Z" fill="none" stroke="green" stroke-width="2"/>
    
    <!-- Corner Points -->
    <circle cx="100" cy="250" r="5" fill="red"/>
    <circle cx="200" cy="250" r="5" fill="red"/>
    <circle cx="200" cy="350" r="5" fill="red"/>
    <circle cx="100" cy="350" r="5" fill="red"/>
    
    <!-- Coordinate System -->
    <path d="M400 250 l50 0" stroke="red" stroke-width="3"/>
    <path d="M400 250 l0 -50" stroke="green" stroke-width="3"/>
    <path d="M400 250 l-30 30" stroke="blue" stroke-width="3"/>
    
    <!-- Labels -->
    <text x="300" y="80" font-size="18" text-anchor="middle" fill="darkblue">Marker Detection Process</text>
    <text x="100" cy="380" font-size="14" fill="black">Detected corners</text>
    <text x="420" y="220" font-size="14" fill="red">Camera coordinate system</text>
    
    <!-- Code Example -->
    <rect x="50" y="300" width="500" height="80" fill="#2B2B2B" rx="5"/>
    <text x="60" y="325" font-size="14" fill="#CCCCCC" font-family="monospace">std::vector&lt;int&gt; ids;</text>
    <text x="60" y="350" font-size="14" fill="#CCCCCC" font-family="monospace">cv::aruco::detectMarkers(frame, dict, corners, ids);</text>
</svg>
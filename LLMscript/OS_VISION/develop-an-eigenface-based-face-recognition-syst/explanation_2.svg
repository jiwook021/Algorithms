<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" text-anchor="middle" font-size="18">2. Mean Face Calculation</text>
  
  <!-- Input faces -->
  <rect x="50" y="60" width="80" height="80" fill="#c0c0ff"/>
  <rect x="150" y="60" width="80" height="80" fill="#c0c0ff"/>
  <rect x="250" y="60" width="80" height="80" fill="#c0c0ff"/>
  <text x="180" y="160" text-anchor="middle">Training Faces</text>
  
  <!-- Plus signs -->
  <text x="340" y="100" font-size="40">+</text>
  <text x="390" y="100" font-size="40">+</text>
  
  <!-- Mean face -->
  <rect x="450" y="60" width="80" height="80" fill="#ff8080"/>
  <text x="490" y="160" text-anchor="middle">Mean Face</text>
  
  <!-- Equation -->
  <text x="300" y="220" font-size="20" text-anchor="middle">Ψ = (1/M) Σ Γₙ</text>
  
  <!-- Code sample -->
  <g transform="translate(50 250)">
    <rect x="0" y="0" width="500" height="100" fill="#e0e0e0" rx="5"/>
    <text x="10" y="20" font-family="monospace" font-size="12" fill="#000">
      <tspan x="10" y="20">// C++ mean calculation:</tspan>
      <tspan x="10" y="40">cv::Mat meanFace;</tspan>
      <tspan x="10" y="60">cv::reduce(facesMatrix, meanFace, 1, cv::REDUCE_AVG);</tspan>
    </text>
  </g>
</svg>
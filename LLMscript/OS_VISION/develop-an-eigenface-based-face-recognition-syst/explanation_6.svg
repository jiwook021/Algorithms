<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="18">1. PCA Dimensionality Reduction</text>
    
    <!-- Original dataset -->
    <rect x="50" y="60" width="200" height="200" fill="#fff" stroke="#666"/>
    <text x="150" y="280" text-anchor="middle" fill="#333">Original Faces (N dimensions)</text>
    
    <!-- Eigenvectors -->
    <path d="M300 150 l150 -50 l-150 50 l150 50" stroke="#ff4444" stroke-width="2" fill="none"/>
    <text x="450" y="110" text-anchor="middle" fill="#ff4444">Eigenvectors</text>
    
    <!-- Reduced space -->
    <rect x="350" y="100" width="200" height="100" fill="#e3f2fd" stroke="#2196f3"/>
    <text x="450" y="220" text-anchor="middle" fill="#2196f3">Reduced Space (k dimensions)</text>
    
    <!-- Scatter points -->
    <circle cx="300" cy="150" r="3" fill="#333"/>
    <circle cx="320" cy="140" r="3" fill="#333"/>
    <circle cx="310" cy="160" r="3" fill="#333"/>
    <circle cx="400" cy="130" r="3" fill="#2196f3"/>
    <circle cx="390" cy="150" r="3" fill="#2196f3"/>
    
    <!-- Code snippet -->
    <rect x="50" y="320" width="500" height="60" fill="#263238" rx="3"/>
    <text x="60" y="345" fill="#fff" font-family="monospace" font-size="12">cv::PCA pca(data, cv::Mat(), cv::PCA::DATA_AS_ROW, 100);</text>
    <text x="60" y="365" fill="#fff" font-family="monospace" font-size="12">cv::Mat reduced = pca.project(sample);</text>
</svg>
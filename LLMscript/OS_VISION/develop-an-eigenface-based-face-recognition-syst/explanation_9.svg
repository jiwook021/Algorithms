<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#F0F0F0"/>
    
    <!-- Title -->
    <text x="300" y="30" font-size="18" text-anchor="middle" fill="#333">Face Image Vectorization and Mean Face Calculation</text>
    
    <!-- Original Faces Grid -->
    <rect x="50" y="60" width="120" height="150" fill="#E1F5FE" stroke="#039BE5"/>
    <rect x="180" y="60" width="120" height="150" fill="#E1F5FE" stroke="#039BE5"/>
    <rect x="310" y="60" width="120" height="150" fill="#E1F5FE" stroke="#039BE5"/>
    <rect x="440" y="60" width="120" height="150" fill="#E1F5FE" stroke="#039BE5"/>
    <text x="300" y="240" text-anchor="middle" fill="#039BE5">Training Images → Column Vectors</text>

    <!-- Mean Face -->
    <rect x="235" y="260" width="130" height="160" fill="#FFCDD2" stroke="#E53935"/>
    <text x="300" y="430" text-anchor="middle" fill="#E53935">Mean Face</text>
    
    <!-- Arrow -->
    <path d="M300 210 L300 250" stroke="#333" fill="none" stroke-width="2"/>
    <polygon points="300 250 295 240 305 240" fill="#333"/>

    <!-- Code Example -->
    <g transform="translate(20 300)">
        <rect x="10" y="10" width="560" height="80" fill="#263238" rx="5"/>
        <text x="20" y="35" font-family="monospace" font-size="12" fill="#fff">
            <tspan fill="#89DDFF">cv::Mat</tspan> <tspan fill="#fff">computeMeanFace(const std::vector&lt;cv::Mat&gt;&amp; faces) {</tspan>
            <tspan x="20" y="55" fill="#fff">cv::Mat mean = cv::Mat::zeros(faces[0].rows, faces[0].cols, CV_32F);</tspan>
            <tspan x="20" y="75" fill="#fff">for (const auto&amp; face : faces) mean += face; return mean / faces.size;</tspan>
            <tspan x="20" y="95" fill="#fff">}</tspan>
        </text>
    </g>
</svg>
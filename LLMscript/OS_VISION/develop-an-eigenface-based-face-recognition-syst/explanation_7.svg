<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="18">2. Eigenfaces Visualization</text>
    
    <!-- Mean face -->
    <rect x="50" y="60" width="100" height="100" fill="#666"/>
    <text x="100" y="180" text-anchor="middle" fill="#333">Mean Face</text>
    
    <!-- Eigenfaces grid -->
    <rect x="200" y="60" width="80" height="80" fill="#4caf50"/>
    <rect x="290" y="60" width="80" height="80" fill="#4caf50"/>
    <rect x="380" y="60" width="80" height="80" fill="#4caf50"/>
    <rect x="470" y="60" width="80" height="80" fill="#4caf50"/>
    <text x="350" y="180" text-anchor="middle" fill="#333">Top Eigenvectors</text>
    
    <!-- Intensity scale -->
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#000"/>
        <stop offset="100%" stop-color="#fff"/>
    </linearGradient>
    <rect x="200" y="220" width="200" height="20" fill="url(#gradient)"/>
    <text x="300" y="260" text-anchor="middle" fill="#333">Feature Importance</text>
    
    <!-- Code snippet -->
    <rect x="50" y="300" width="500" height="60" fill="#263238" rx="3"/>
    <text x="60" y="325" fill="#fff" font-family="monospace" font-size="12">std::vector&lt;cv::Mat&gt; eigenfaces;</text>
    <text x="60" y="345" fill="#fff" font-family="monospace" font-size="12">for(int i = 0; i &lt; num_components; i++) {</text>
    <text x="80" y="365" fill="#fff" font-family="monospace" font-size="12">eigenfaces.push_back(pca.eigenvectors.row(i).reshape(0, height));</text>
</svg>
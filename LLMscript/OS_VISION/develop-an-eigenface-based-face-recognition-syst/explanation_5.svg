<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" text-anchor="middle" font-size="18">5. Face Recognition</text>
  
  <!-- Feature space -->
  <circle cx="200" cy="150" r="40" fill="#ff6b6b"/>
  <circle cx="300" cy="100" r="40" fill="#6b6bff"/>
  <circle cx="400" cy="150" r="40" fill="#6bff6b"/>
  <text x="200" y="210" text-anchor="middle">Person A</text>
  <text x="300" y="60" text-anchor="middle">Person B</text>
  <text x="400" y="210" text-anchor="middle">Person C</text>
  
  <!-- New face -->
  <circle cx="350" cy="200" r="15" fill="#000"/>
  <text x="350" y="230" text-anchor="middle">Input</text>
  
  <!-- Distance lines -->
  <path d="M350 200 L200 150" stroke="#000" stroke-dasharray="4"/>
  <path d="M350 200 L300 100" stroke="#000" stroke-dasharray="4"/>
  <path d="M350 200 L400 150" stroke="#000" stroke-dasharray="4"/>
  
  <!-- Code sample -->
  <g transform="translate(50 250)">
    <rect x="0" y="0" width="500" height="100" fill="#e0e0e0" rx="5"/>
    <text x="10" y="20" font-family="monospace" font-size="12" fill="#000">
      <tspan x="10" y="20">// Recognition in C++:</tspan>
      <tspan x="10" y="40">double minDist = DBL_MAX;</tspan>
      <tspan x="10" y="60">for(auto&amp; entry : database) {</tspan>
      <tspan x="20" y="80">double dist = norm(projection, entry.weights);</tspan>
      <tspan x="20" y="100">if(dist &lt; minDist) {/*...*/}</tspan>
    </text>
  </g>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="18">3. Face Reconstruction Process</text>
    
    <!-- Reconstruction steps -->
    <rect x="50" y="60" width="100" height="100" fill="#666"/>
    <text x="100" y="170" text-anchor="middle" fill="#333">Mean Face</text>
    
    <path d="M170 110 h30 m-10 -5 l10 5 -10 5" stroke="#333"/>
    
    <rect x="210" y="60" width="100" height="100" fill="#2196f3" opacity="0.5"/>
    <text x="260" y="170" text-anchor="middle" fill="#2196f3">+</text>
    
    <path d="M320 110 h30 m-10 -5 l10 5 -10 5" stroke="#333"/>
    
    <rect x="360" y="60" width="100" height="100" fill="#4caf50" opacity="0.5"/>
    <text x="410" y="170" text-anchor="middle" fill="#4caf50">+</text>
    
    <path d="M470 110 h30 m-10 -5 l10 5 -10 5" stroke="#333"/>
    
    <rect x="50" y="200" width="100" height="100" fill="#ff4444"/>
    <text x="100" y="310" text-anchor="middle" fill="#333">Reconstructed</text>
    <text x="100" y="330" text-anchor="middle" fill="#333">Face</text>
    
    <!-- Weights formula -->
    <text x="400" y="250" text-anchor="middle" fill="#333" font-size="14">
        Reconstructed = Mean
        <tspan x="400" dy="20">+ Σ(weights × eigenfaces)</tspan>
    </text>
    
    <!-- Code snippet -->
    <rect x="50" y="320" width="500" height="60" fill="#263238" rx="3"/>
    <text x="60" y="345" fill="#fff" font-family="monospace" font-size="12">cv::Mat reconstruction = pca.mean;</text>
    <text x="60" y="365" fill="#fff" font-family="monospace" font-size="12">for(int i = 0; i &lt; k; i++) reconstruction += weights[i] * pca.eigenvectors.row(i);</text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" text-anchor="middle" font-size="18">3. Eigenfaces Computation</text>
  
  <!-- Covariance matrix -->
  <rect x="50" y="60" width="150" height="150" fill="#ffd700"/>
  <text x="125" y="230" text-anchor="middle">Covariance Matrix</text>
  
  <!-- Arrow -->
  <path d="M220 135 L270 135" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Eigenfaces -->
  <rect x="290" y="60" width="80" height="80" fill="#98fb98"/>
  <rect x="390" y="60" width="80" height="80" fill="#98fb98"/>
  <rect x="490" y="60" width="80" height="80" fill="#98fb98"/>
  <text x="430" y="160" text-anchor="middle">Eigenfaces</text>
  
  <!-- Eigenvalue spectrum -->
  <polyline points="50 280, 550 280" stroke="#000"/>
  <rect x="50" y="260" width="30" height="40" fill="#ff6b6b"/>
  <rect x="100" y="240" width="30" height="60" fill="#ff6b6b"/>
  <rect x="150" y="220" width="30" height="80" fill="#ff6b6b"/>
  <text x="300" y="320" text-anchor="middle">Eigenvalue Spectrum</text>
  
  <!-- Code sample -->
  <g transform="translate(50 340)">
    <rect x="0" y="0" width="500" height="50" fill="#e0e0e0" rx="5"/>
    <text x="10" y="20" font-family="monospace" font-size="12" fill="#000">
      <tspan x="10" y="20">cv::PCA pca(facesMatrix, cv::Mat(), cv::PCA::DATA_AS_ROW);</tspan>
    </text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
</svg>
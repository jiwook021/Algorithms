<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" text-anchor="middle" font-size="18">1. Face Vectorization</text>
  
  <!-- Original faces -->
  <rect x="50" y="60" width="80" height="80" fill="#c0c0ff"/>
  <rect x="140" y="60" width="80" height="80" fill="#c0c0ff"/>
  <rect x="230" y="60" width="80" height="80" fill="#c0c0ff"/>
  <text x="100" y="160" text-anchor="middle">Original Faces</text>
  
  <!-- Arrow -->
  <path d="M320 100 L400 100" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Vectorized matrix -->
  <rect x="420" y="50" width="150" height="100" fill="#a0ffa0"/>
  <text x="495" y="40" text-anchor="middle">Vector Matrix</text>
  <path d="M420 50 L570 50 L570 150 L420 150 Z" stroke="#000"/>
  <line x1="420" y1="75" x2="570" y2="75" stroke="#000"/>
  <line x1="420" y1="100" x2="570" y2="100" stroke="#000"/>
  <line x1="420" y1="125" x2="570" y2="125" stroke="#000"/>
  
  <!-- Code sample -->
  <g transform="translate(50 200)">
    <rect x="0" y="0" width="500" height="150" fill="#e0e0e0" rx="5"/>
    <text x="10" y="20" font-family="monospace" font-size="12" fill="#000">
      <tspan x="10" y="20">// C++ vectorization example:</tspan>
      <tspan x="10" y="40">cv::Mat facesMatrix(height*width, numFaces, CV_32F);</tspan>
      <tspan x="10" y="60">for(int i=0; i&lt;numFaces; i++) {</tspan>
      <tspan x="20" y="80">cv::Mat faceVector = faces[i].reshape(1, 1);</tspan>
      <tspan x="20" y="100">faceVector.copyTo(facesMatrix.col(i));</tspan>
      <tspan x="10" y="120">}</tspan>
    </text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
</svg>
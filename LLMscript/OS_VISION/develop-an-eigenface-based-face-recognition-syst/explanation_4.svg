<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" text-anchor="middle" font-size="18">4. Face Projection</text>
  
  <!-- Input face -->
  <rect x="50" y="60" width="100" height="100" fill="#c0c0ff"/>
  <text x="100" y="180" text-anchor="middle">Input Face</text>
  
  <!-- Eigenfaces -->
  <rect x="200" y="60" width="60" height="60" fill="#98fb98"/>
  <rect x="270" y="60" width="60" height="60" fill="#98fb98"/>
  <rect x="340" y="60" width="60" height="60" fill="#98fb98"/>
  <text x="300" y="140" text-anchor="middle">Eigenfaces</text>
  
  <!-- Projection arrows -->
  <path d="M170 90 L200 90" stroke="#000" marker-end="url(#arrow)"/>
  <path d="M410 90 L450 90" stroke="#000" marker-end="url(#arrow)"/>
  
  <!-- Coefficients -->
  <rect x="450" y="70" width="100" height="40" fill="#ffd700"/>
  <text x="500" y="120" text-anchor="middle">Weights</text>
  
  <!-- Equation -->
  <text x="300" y="200" font-size="16" text-anchor="middle">ωₖ = uₖᵀ(Γ - Ψ)</text>
  
  <!-- Code sample -->
  <g transform="translate(50 220)">
    <rect x="0" y="0" width="500" height="100" fill="#e0e0e0" rx="5"/>
    <text x="10" y="20" font-family="monospace" font-size="12" fill="#000">
      <tspan x="10" y="20">// Projection in C++:</tspan>
      <tspan x="10" y="40">cv::Mat normalizedFace = inputFace - meanFace;</tspan>
      <tspan x="10" y="60">cv::Mat projection = pca.project(normalizedFace);</tspan>
    </text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
</svg>
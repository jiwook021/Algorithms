<svg viewBox="0 0 600 400" width="600" height="400" xmlns="http://www.w3.org/2000/svg">
    <style>
        .header { font: bold 20px sans-serif; }
        .label { font: 14px sans-serif; }
        .code { font: 12px monospace; fill: #333; }
        .fp32 { fill: #FF4444; }
        .int8 { fill: #44CC44; }
        .arrow { stroke: #666; stroke-width: 2; }
    </style>
    
    <rect x="0" y="0" width="600" height="400" fill="#FAFAFA" />
    
    <!-- Title -->
    <text x="300" y="40" class="header" text-anchor="middle">Model Quantization Optimization</text>
    
    <!-- FP32 Section -->
    <rect x="50" y="100" width="200" height="180" fill="#FFE4E4" rx="5" />
    <text x="150" y="130" class="label" text-anchor="middle">Original Model (FP32)</text>
    <text x="150" y="170" class="fp32 code" text-anchor="middle">float conv_weights[32][3][3]</text>
    <text x="150" y="200" class="fp32 code" text-anchor="middle">0.752, -1.236, 0.441...</text>
    <text x="150" y="230" class="label">32-bit floating point</text>
    
    <!-- Arrow -->
    <path d="M300 200 L400 200" class="arrow" marker-end="url(#arrowhead)"/>
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
        </marker>
    </defs>
    
    <!-- INT8 Section -->
    <rect x="350" y="100" width="200" height="180" fill="#E4F5E4" rx="5" />
    <text x="450" y="130" class="label" text-anchor="middle">Quantized Model (INT8)</text>
    <text x="450" y="170" class="int8 code" text-anchor="middle">int8_t conv_weights[32][3][3]</text>
    <text x="450" y="200" class="int8 code" text-anchor="middle">112, -95, 67...</text>
    <text x="450" y="230" class="label">8-bit integer</text>
    
    <!-- Code Example -->
    <rect x="100" y="300" width="400" height="80" fill="#EEE" rx="5" />
    <text x="110" y="325" class="code">
        <tspan x="110" dy="1.2em">// Quantize tensor using TensorFlow Lite</tspan>
        <tspan x="110" dy="1.2em">std::unique_ptr&lt;tflite::FlatBufferModel&gt; model = </tspan>
        <tspan x="110" dy="1.2em">tflite::FlatBufferModel::BuildFromFile("mobilenet_v2.tflite");</tspan>
    </text>
</svg>
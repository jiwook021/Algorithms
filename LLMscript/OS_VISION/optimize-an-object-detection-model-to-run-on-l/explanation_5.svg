<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="20">Network Pruning</text>
    
    <!-- Neural Network Visualization -->
    <circle cx="100" cy="100" r="15" fill="#4a90e2"/>
    <circle cx="100" cy="200" r="15" fill="#4a90e2"/>
    <circle cx="100" cy="300" r="15" fill="#4a90e2"/>
    
    <circle cx="300" cy="150" r="15" fill="#4a90e2"/>
    <circle cx="300" cy="250" r="15" fill="#4a90e2"/>
    
    <circle cx="500" cy="200" r="15" fill="#4a90e2"/>
    
    <!-- Connections with pruning -->
    <path d="M100 100 L300 150" stroke="#4a90e2" stroke-width="2" opacity="0.3"/>
    <path d="M100 200 L300 150" stroke="#4a90e2" stroke-width="2"/>
    <path d="M100 300 L300 150" stroke="#4a90e2" stroke-width="2" opacity="0.3"/>
    <path d="M100 100 L300 250" stroke="#4a90e2" stroke-width="2" opacity="0.3"/>
    <path d="M100 200 L300 250" stroke="#4a90e2" stroke-width="2"/>
    <path d="M100 300 L300 250" stroke="#4a90e2" stroke-width="2"/>
    
    <path d="M300 150 L500 200" stroke="#4a90e2" stroke-width="2"/>
    <path d="M300 250 L500 200" stroke="#4a90e2" stroke-width="2" opacity="0.3"/>
    
    <!-- Pruning Marks -->
    <path d="M80 80 L120 120" stroke="#ff3b30" stroke-width="3"/>
    <path d="M80 280 L120 320" stroke="#ff3b30" stroke-width="3"/>
    <path d="M480 180 L520 220" stroke="#ff3b30" stroke-width="3"/>
    
    <!-- Code Example -->
    <rect x="100" y="340" width="400" height="40" fill="#1e1e1e" rx="5"/>
    <text x="110" y="370" fill="#d4d4d4" font-family="monospace" font-size="14">model.prune(parameters, sparsity=0.5);  // Remove 50% connections</text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="20">Model Quantization (FP32 to INT8)</text>
    
    <!-- Original Model -->
    <rect x="50" y="60" width="200" height="80" fill="#4a90e2" rx="5"/>
    <text x="150" y="100" text-anchor="middle" fill="white">FP32 Weights</text>
    <text x="150" y="130" text-anchor="middle" fill="white" font-size="12">(4 bytes/weight)</text>
    
    <!-- Quantized Model -->
    <rect x="350" y="60" width="200" height="80" fill="#50e3c2" rx="5"/>
    <text x="450" y="100" text-anchor="middle" fill="black">INT8 Weights</text>
    <text x="450" y="130" text-anchor="middle" fill="black" font-size="12">(1 byte/weight)</text>
    
    <!-- Arrow -->
    <path d="M250 100 L350 100" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Code Example -->
    <rect x="100" y="180" width="400" height="120" fill="#1e1e1e" rx="5"/>
    <text x="110" y="210" fill="#d4d4d4" font-family="monospace" font-size="14">// Quantized inference step</text>
    <text x="110" y="240" fill="#d4d4d4" font-family="monospace" font-size="14">auto input = tensor_cast&lt;uint8_t&gt;(raw_input);</text>
    <text x="110" y="270" fill="#d4d4d4" font-family="monospace" font-size="14">auto output = quantized_model->forward(input);</text>
    <text x="110" y="300" fill="#d4d4d4" font-family="monospace" font-size="14">float result = dequantize(output);</text>

    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
        </marker>
    </defs>
</svg>
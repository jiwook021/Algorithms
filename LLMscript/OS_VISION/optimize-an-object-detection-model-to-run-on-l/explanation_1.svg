<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Title -->
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Model Quantization (FP32 → INT8)</text>
    
    <!-- Original Model -->
    <g transform="translate(50, 80)">
        <rect x="0" y="0" width="150" height="100" fill="#c7d9ed" rx="5"/>
        <text x="75" y="30" text-anchor="middle" fill="#333">FP32 Model</text>
        <text x="75" y="60" text-anchor="middle" font-size="14">(4 bytes/weight)</text>
        <text x="75" y="80" text-anchor="middle" font-size="14">100MB Memory</text>
    </g>
    
    <!-- Quantization Process -->
    <path d="M230 130 L370 130" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="300" y="120" text-anchor="middle" fill="#666">Quantization</text>
    
    <!-- Quantized Model -->
    <g transform="translate(400, 80)">
        <rect x="0" y="0" width="150" height="100" fill="#a3d6b4" rx="5"/>
        <text x="75" y="30" text-anchor="middle" fill="#333">INT8 Model</text>
        <text x="75" y="60" text-anchor="middle" font-size="14">(1 byte/weight)</text>
        <text x="75" y="80" text-anchor="middle" font-size="14">25MB Memory</text>
    </g>
    
    <!-- Code Example -->
    <g transform="translate(50, 200)">
        <rect x="0" y="0" width="500" height="150" fill="#2d2d2d" rx="5"/>
        <text x="10" y="30" fill="#fff" font-family="monospace" font-size="14">// C++ Quantization Example</text>
        <text x="10" y="60" fill="#7ec699" font-family="monospace" font-size="14">float fp_weights[] = {0.78, -1.23, 2.45};</text>
        <text x="10" y="90" fill="#7ec699" font-family="monospace" font-size="14">int8_t int_weights[3];</text>
        <text x="10" y="120" fill="#7ec699" font-family="monospace" font-size="14">for(int i=0; i&lt;3; i++) {</text>
        <text x="20" y="140" fill="#7ec699" font-family="monospace" font-size="14">int_weights[i] = (int8_t)(fp_weights[i] * 127);</text>
        <text x="10" y="160" fill="#7ec699" font-family="monospace" font-size="14">}</text>
    </g>
    
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
        </marker>
    </defs>
</svg>
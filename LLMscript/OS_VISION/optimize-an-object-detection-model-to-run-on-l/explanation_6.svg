<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="20">Efficient Architecture (MobileNet)</text>
    
    <!-- Standard Convolution -->
    <rect x="50" y="80" width="220" height="120" fill="#ff9500" rx="5"/>
    <text x="160" y="140" text-anchor="middle" fill="white">Standard Conv</text>
    <text x="160" y="165" text-anchor="middle" fill="white" font-size="12">(256x256x3 → 256x256x32)</text>
    
    <!-- Depthwise Separable Conv -->
    <rect x="50" y="220" width="220" height="120" fill="#34c759" rx="5"/>
    <text x="160" y="280" text-anchor="middle" fill="white">Depthwise Conv</text>
    <text x="160" y="305" text-anchor="middle" fill="white" font-size="12">(256x256x3 → 256x256x3)</text>
    
    <rect x="330" y="220" width="220" height="120" fill="#34c759" rx="5"/>
    <text x="440" y="280" text-anchor="middle" fill="white">Pointwise Conv</text>
    <text x="440" y="305" text-anchor="middle" fill="white" font-size="12">(256x256x3 → 256x256x32)</text>
    
    <!-- Arrows -->
    <path d="M270 140 L330 240" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M270 140 L330 280" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Code Example -->
    <rect x="100" y="350" width="400" height="40" fill="#1e1e1e" rx="5"/>
    <text x="110" y="380" fill="#d4d4d4" font-family="monospace" font-size="14">// Depthwise separable conv in C++</text>

    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
        </marker>
    </defs>
</svg>
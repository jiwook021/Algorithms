<svg viewBox="0 0 600 400" width="600" height="400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="20" fill="#333">Model Quantization</text>
    
    <!-- Original Model -->
    <rect x="50" y="80" width="200" height="100" fill="#ff9999" rx="10"/>
    <text x="150" y="110" text-anchor="middle" fill="#333">FP32 Weights</text>
    <text x="150" y="140" text-anchor="middle" font-size="12" fill="#666">(32-bit floating point)</text>
    
    <!-- Quantized Model -->
    <rect x="350" y="80" width="200" height="100" fill="#99ff99" rx="10"/>
    <text x="450" y="110" text-anchor="middle" fill="#333">INT8 Weights</text>
    <text x="450" y="140" text-anchor="middle" font-size="12" fill="#666">(8-bit integer)</text>
    
    <!-- Arrow -->
    <path d="M270 130 L330 130" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Code Example -->
    <rect x="100" y="200" width="400" height="150" fill="#2d2d2d" rx="5"/>
    <text x="110" y="225" fill="#fff" font-family="monospace" font-size="14">// C++ Quantization Example</text>
    <text x="110" y="255" fill="#7ec699" font-family="monospace" font-size="14">float original = 2.56f;</text>
    <text x="110" y="285" fill="#7ec699" font-family="monospace" font-size="14">int8_t quantized = static_cast&lt;int8_t&gt;(</text>
    <text x="110" y="315" fill="#7ec699" font-family="monospace" font-size="14">    original * 127.0f / max_range);</text>
    
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
        </marker>
    </defs>
</svg>
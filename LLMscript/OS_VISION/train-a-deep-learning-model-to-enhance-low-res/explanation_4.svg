<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle">Training Process Flow</text>
    
    <!-- Training Data -->
    <image x="50" y="80" width="100" height="100" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAFCAYAAACNbyblAAAAHElEQVQI12P4//8/w38GIAXDIBKE0DHxgljNBAAO9TXL0Y4OHwAAAABJRU5ErkJggg=="/>
    <text x="100" y="200" text-anchor="middle">Low-res</text>
    
    <image x="450" y="80" width="100" height="100" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAFCAYAAACNbyblAAAAHElEQVQI12P4//8/w38GIAXDIBKE0DHxgljNBAAO9TXL0Y4OHwAAAABJRU5ErkJggg=="/>
    <text x="500" y="200" text-anchor="middle">High-res</text>
    
    <!-- Model -->
    <rect x="250" y="100" width="100" height="80" fill="#ffd92f" stroke="#e5c494"/>
    <text x="300" y="140" text-anchor="middle">SRCNN</text>
    
    <!-- Arrows -->
    <path d="M150 140 L250 140" stroke="black" fill="none"/>
    <path d="M350 140 L450 140" stroke="black" fill="none"/>
    
    <!-- Code Example -->
    <rect x="50" y="250" width="500" height="120" fill="#2d2d2d"/>
    <text x="60" y="270" fill="white" font-family="monospace" font-size="12">
        <tspan x="60" y="270">// C++ Training loop</tspan>
        <tspan x="60" y="290">for (auto&amp; batch : dataset) {</tspan>
        <tspan x="60" y="310">    auto output = model.forward(batch.lr);</tspan>
        <tspan x="60" y="330">    auto loss = criterion(output, batch.hr);</tspan>
        <tspan x="60" y="350">    loss.backward(); optimizer.step();</tspan>
        <tspan x="60" y="370">}</tspan>
    </text>
</svg>
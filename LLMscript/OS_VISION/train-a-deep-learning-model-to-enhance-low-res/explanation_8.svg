<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Training Data Preparation</text>
    
    <!-- HR Image -->
    <rect x="50" y="100" width="200" height="200" fill="#b3e5fc"/>
    <text x="150" y="320" text-anchor="middle" fill="#01579b">Original HR Image</text>
    
    <!-- Downsampling Arrow -->
    <path d="M275 200 L325 200" stroke="#666" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="300" y="190" text-anchor="middle" fill="#666">Downsample</text>
    
    <!-- LR Image -->
    <rect x="350" y="130" width="100" height="140" fill="#d1c4e9"/>
    <text x="400" y="290" text-anchor="middle" fill="#4527a0">Low-Res Input</text>
    
    <!-- Code Example -->
    <rect x="100" y="250" width="400" height="100" fill="#263238" rx="5"/>
    <text x="110" y="280" font-size="14" fill="#fff" font-family="monospace">// C++ Data Preprocessing</text>
    <text x="110" y="310" font-size="14" fill="#fff" font-family="monospace">Mat lr_image = resize(hr_image, Size(), 0.5, 0.5, INTER_CUBIC);</text>
    
    <defs>
        <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
        </marker>
    </defs>
</svg>
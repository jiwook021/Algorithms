<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle">Upsampling Techniques</text>
    
    <!-- Transposed Convolution -->
    <rect x="50" y="100" width="200" height="80" fill="#e78ac3" stroke="#8da0cb"/>
    <text x="150" y="140" text-anchor="middle">Transposed Conv</text>
    <text x="150" y="160" text-anchor="middle">(Deconvolution)</text>
    
    <!-- Sub-pixel Conv -->
    <rect x="350" y="100" width="200" height="80" fill="#66c2a5" stroke="#fc8d62"/>
    <text x="450" y="140" text-anchor="middle">Sub-pixel</text>
    <text x="450" y="160" text-anchor="middle">Shuffle</text>
    
    <!-- Kernel Visualization -->
    <rect x="100" y="200" width="40" height="40" fill="#984ea3"/>
    <text x="120" y="245" text-anchor="middle">3x3</text>
    <rect x="400" y="200" width="40" height="40" fill="#4daf4a"/>
    <text x="420" y="245" text-anchor="middle">1x1</text>
    
    <!-- Code Example -->
    <rect x="50" y="280" width="500" height="100" fill="#2d2d2d"/>
    <text x="60" y="300" fill="white" font-family="monospace" font-size="12">
        <tspan x="60" y="300">// C++ Sub-pixel shuffle</tspan>
        <tspan x="60" y="320">Tensor upscale(const Tensor&amp; x) {</tspan>
        <tspan x="60" y="340">    return x.reshape({h*2, w*2, c/4});</tspan>
        <tspan x="60" y="360">}</tspan>
    </text>
</svg>
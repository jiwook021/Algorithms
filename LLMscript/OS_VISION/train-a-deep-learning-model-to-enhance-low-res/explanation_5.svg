<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle">Inference Pipeline</text>
    
    <!-- Input -->
    <image x="50" y="100" width="100" height="100" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAFCAYAAACNbyblAAAAHElEQVQI12P4//8/w38GIAXDIBKE0DHxgljNBAAO9TXL0Y4OHwAAAABJRU5ErkJggg=="/>
    <text x="100" y="220" text-anchor="middle">Input</text>
    
    <!-- Model -->
    <rect x="200" y="120" width="200" height="60" fill="#8dd3c7" stroke="#80b1d3"/>
    <text x="300" y="155" text-anchor="middle">Pre-trained SR Model</text>
    
    <!-- Output -->
    <image x="450" y="100" width="100" height="100" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAFCAYAAACNbyblAAAAHElEQVQI12P4//8/w38GIAXDIBKE0DHxgljNBAAO9TXL0Y4OHwAAAABJRU5ErkJggg=="/>
    <text x="500" y="220" text-anchor="middle">Output</text>
    
    <!-- Arrows -->
    <path d="M150 150 L200 150" stroke="black" fill="none"/>
    <path d="M400 150 L450 150" stroke="black" fill="none"/>
    
    <!-- Code Example -->
    <rect x="50" y="250" width="500" height="120" fill="#2d2d2d"/>
    <text x="60" y="270" fill="white" font-family="monospace" font-size="12">
        <tspan x="60" y="270">// C++ Inference</tspan>
        <tspan x="60" y="290">SRModel model("srcnn.weights");</tspan>
        <tspan x="60" y="310">Tensor output = model.process(input_image);</tspan>
        <tspan x="60" y="330">save_image(output, "enhanced.png");</tspan>
    </text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- CNN Architecture Diagram -->
    <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Title -->
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">CNN Architecture for Super-Resolution</text>
    
    <!-- Network Layers -->
    <rect x="50" y="80" width="100" height="50" fill="#a6cee3" rx="5"/>
    <text x="100" y="110" text-anchor="middle" fill="#000">Input LR</text>
    
    <rect x="200" y="80" width="100" height="50" fill="#1f78b4" rx="5"/>
    <text x="250" y="110" text-anchor="middle" fill="#fff">Conv2D</text>
    
    <rect x="350" y="80" width="100" height="50" fill="#b2df8a" rx="5"/>
    <text x="400" y="110" text-anchor="middle" fill="#000">ReLU</text>
    
    <rect x="450" y="80" width="100" height="50" fill="#33a02c" rx="5"/>
    <text x="500" y="110" text-anchor="middle" fill="#fff">Upsample</text>
    
    <!-- Arrows -->
    <path d="M150 105 L200 105" stroke="#666" fill="none" stroke-width="2"/>
    <path d="M300 105 L350 105" stroke="#666" fill="none" stroke-width="2"/>
    <path d="M450 105 L500 105" stroke="#666" fill="none" stroke-width="2"/>
    
    <!-- Code Example -->
    <rect x="100" y="180" width="400" height="150" fill="#fff" rx="5"/>
    <text x="120" y="210" font-family="monospace" font-size="12" fill="#333">
        <tspan x="120" y="210">// C++ CNN layer example using Eigen</tspan>
        <tspan x="120" y="230">Eigen::Tensor3f forward_pass(Eigen::Tensor3f input) {</tspan>
        <tspan x="140" y="250">// Conv2D operation</tspan>
        <tspan x="140" y="270">auto conv = input.convolve(kernel);</tspan>
        <tspan x="140" y="290">// ReLU activation</tspan>
        <tspan x="140" y="310">auto relu = conv.max(0.0f);</tspan>
        <tspan x="120" y="330">}</tspan>
    </text>
</svg>
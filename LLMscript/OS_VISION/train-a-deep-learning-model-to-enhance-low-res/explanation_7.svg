<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Loss Function (MSE)</text>
    
    <!-- Generated Image -->
    <rect x="50" y="100" width="200" height="200" fill="#c8e6c9"/>
    <text x="150" y="320" text-anchor="middle" fill="#2e7d32">Generated HR</text>
    
    <!-- Ground Truth -->
    <rect x="350" y="100" width="200" height="200" fill="#ffcdd2"/>
    <text x="450" y="320" text-anchor="middle" fill="#c62828">Ground Truth HR</text>
    
    <!-- Difference Calculation -->
    <path d="M250 200 L350 200" stroke="#6a1b9a" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="300" cy="200" r="40" fill="#7e57c2"/>
    <text x="300" y="200" text-anchor="middle" fill="white" font-size="18">MSE</text>
    
    <!-- Formula -->
    <text x="300" y="80" text-anchor="middle" font-size="16" fill="#333">
        L = 1/n Σ(y - ŷ)²
    </text>
    
    <!-- Code Example -->
    <rect x="150" y="250" width="300" height="100" fill="#263238" rx="5"/>
    <text x="160" y="280" font-size="14" fill="#fff" font-family="monospace">// C++ MSE calculation</text>
    <text x="160" y="310" font-size="14" fill="#fff" font-family="monospace">double loss = (ground_truth - predicted).square().mean();</text>
    
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#6a1b9a"/>
        </marker>
    </defs>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">CNN Architecture for Super-Resolution</text>
    
    <!-- Input -->
    <rect x="50" y="100" width="100" height="100" fill="#9fa8da"/>
    <text x="100" y="220" text-anchor="middle" fill="#1a237e">Low-Res Input</text>
    
    <!-- Convolution Layers -->
    <rect x="200" y="120" width="80" height="80" fill="#64b5f6"/>
    <rect x="300" y="120" width="80" height="80" fill="#4db6ac"/>
    <rect x="400" y="120" width="80" height="80" fill="#81c784"/>
    <text x="300" y="210" text-anchor="middle" fill="#004d40">Feature Extraction</text>
    
    <!-- Output -->
    <rect x="500" y="100" width="100" height="100" fill="#f48fb1"/>
    <text x="550" y="220" text-anchor="middle" fill="#880e4f">High-Res Output</text>
    
    <!-- Arrows -->
    <path d="M150 150 L200 160" stroke="#666" fill="none" stroke-width="2"/>
    <path d="M280 160 L300 160" stroke="#666" fill="none" stroke-width="2"/>
    <path d="M380 160 L400 160" stroke="#666" fill="none" stroke-width="2"/>
    <path d="M480 160 L500 150" stroke="#666" fill="none" stroke-width="2"/>
    
    <!-- Code Example -->
    <rect x="50" y="250" width="500" height="120" fill="#263238" rx="5"/>
    <text x="60" y="280" font-size="14" fill="#fff" font-family="monospace">// C++ CNN inference example</text>
    <text x="60" y="310" font-size="14" fill="#fff" font-family="monospace">Tensor output = model.forward(input);</text>
    <text x="60" y="340" font-size="14" fill="#fff" font-family="monospace">apply_nonlinear_activation(output);</text>
</svg>
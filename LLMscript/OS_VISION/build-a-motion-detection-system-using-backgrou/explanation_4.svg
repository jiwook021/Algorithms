<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Background Subtraction Concept -->
    <rect x="50" y="100" width="150" height="150" fill="#4a90e2"/>
    <text x="125" y="90" font-family="monospace" font-size="12">Background Model</text>
    
    <rect x="225" y="100" width="150" height="150" fill="#e74c3c"/>
    <text x="280" y="90" font-family="monospace" font-size="12">Current Frame</text>
    
    <path d="M200,175 L250,175" stroke="#2c3e50" stroke-width="2"/>
    <polygon points="250,175 242,170 242,180" fill="#2c3e50"/>
    
    <rect x="275" y="100" width="150" height="150" fill="#27ae60"/>
    <text x="330" y="90" font-family="monospace" font-size="12">Difference</text>
    
    <!-- Code Example -->
    <rect x="50" y="280" width="500" height="100" fill="#2c3e50" rx="5"/>
    <text x="60" y="300" font-family="monospace" font-size="12" fill="#fff">
        <tspan x="60" dy="1.2em">cv::Mat background, currentFrame, diff;</tspan>
        <tspan x="60" dy="1.2em">cv::absdiff(background, currentFrame, diff);</tspan>
        <tspan x="60" dy="1.2em">cv::threshold(diff, diff, 25, 255, cv::THRESH_BINARY);</tspan>
    </text>
</svg>
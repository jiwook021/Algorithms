<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <style>
        .frame { stroke: #333; stroke-width: 2; fill: none }
        .current { fill: #1e88e5 }
        .background { fill: #43a047 }
        .difference { fill: #e53935 }
        .arrow { stroke: #6d4c41; stroke-width: 3; marker-end: url(#arrowhead) }
        text { font-family: monospace; font-size: 14px }
    </style>
    
    <!-- Arrow marker definition -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#6d4c41"/>
        </marker>
    </defs>

    <!-- Frame sequence -->
    <rect x="50" y="80" width="150" height="100" class="frame"/>
    <rect x="50" y="80" width="150" height="100" class="current"/>
    <text x="125" y="70" text-anchor="middle">Current Frame</text>

    <rect x="400" y="80" width="150" height="100" class="frame"/>
    <rect x="400" y="80" width="150" height="100" class="background"/>
    <text x="475" y="70" text-anchor="middle">Background Model</text>

    <!-- Subtraction operator -->
    <path d="M230 130 L370 130" class="arrow"/>
    <text x="300" y="125" text-anchor="middle" font-size="20">−</text>

    <!-- Difference result -->
    <rect x="225" y="240" width="150" height="100" class="frame"/>
    <rect x="225" y="240" width="150" height="100" class="difference"/>
    <text x="300" y="230" text-anchor="middle">Foreground Mask</text>

    <!-- Update arrow -->
    <path d="M475 130 Q550 130 550 200 T475 270" class="arrow" stroke-dasharray="4"/>
    <text x="550" y="190" text-anchor="middle">Update Model</text>

    <!-- Code example -->
    <text x="50" y="360" fill="#333">
        <tspan x="50" dy="0">// C++ Background Update (OpenCV)</tspan>
        <tspan x="50" dy="24">Mat updated_bg;</tspan>
        <tspan x="50" dy="20">addWeighted(current_frame, 0.1,</tspan>
        <tspan x="50" dy="20" dx="25">background_model, 0.9, 0, updated_bg);</tspan>
    </text>
</svg>
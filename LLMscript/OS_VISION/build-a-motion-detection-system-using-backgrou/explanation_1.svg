<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#F0F0F0"/>
    
    <!-- Title -->
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Background Subtraction Process</text>
    
    <!-- Frame Sequence -->
    <rect x="50" y="60" width="150" height="150" fill="#FFF" stroke="#4A90E2" stroke-width="2"/>
    <text x="125" y="80" fill="#4A90E2">Frame N</text>
    
    <rect x="220" y="60" width="150" height="150" fill="#FFF" stroke="#4CAF50" stroke-width="2"/>
    <text x="295" y="80" fill="#4CAF50">Background Model</text>
    
    <rect x="390" y="60" width="150" height="150" fill="#FFF" stroke="#FF5722" stroke-width="2"/>
    <text x="465" y="80" fill="#FF5722">Difference</text>
    
    <!-- Arrows -->
    <path d="M200 135 L230 135" stroke="#333" fill="none" stroke-width="2"/>
    <path d="M370 135 L400 135" stroke="#333" fill="none" stroke-width="2"/>
    
    <!-- Code Example -->
    <rect x="50" y="250" width="500" height="120" fill="#263238" rx="5"/>
    <text x="60" y="270" fill="#FFF" font-family="monospace" font-size="12">
        <tspan x="60" dy="1.2em">cv::Mat currentFrame, backgroundModel, difference;</tspan>
        <tspan x="60" dy="1.2em">cv::cvtColor(frame, currentFrame, cv::COLOR_BGR2GRAY);</tspan>
        <tspan x="60" dy="1.2em">cv::absdiff(currentFrame, backgroundModel, difference);</tspan>
        <tspan x="60" dy="1.2em">cv::threshold(difference, difference, 25, 255, cv::THRESH_BINARY);</tspan>
    </text>
</svg>
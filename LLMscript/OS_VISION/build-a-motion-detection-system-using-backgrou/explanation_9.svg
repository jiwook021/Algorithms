<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Thresholding & Detection -->
    <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Input/Output Visualization -->
    <rect x="50" y="80" width="200" height="200" fill="#616161"/>
    <text x="120" y="70" font-size="14">Foreground Mask</text>
    
    <rect x="350" y="80" width="200" height="200" fill="#fff"/>
    <rect x="370" y="100" width="160" height="160" fill="#4CAF50" opacity="0.3"/>
    <rect x="400" y="130" width="100" height="100" fill="#E53935" opacity="0.5"/>
    <text x="430" y="70" font-size="14">Detected Motion</text>
    
    <!-- Threshold Graphic -->
    <path d="M275 180 L325 180" stroke="#E53935" stroke-width="3"/>
    <text x="300" y="170" font-size="14" text-anchor="middle" fill="#E53935">Threshold</text>
    
    <!-- Code Example -->
    <g transform="translate(50 300)">
        <rect x="0" y="0" width="500" height="80" fill="#263238" rx="3"/>
        <text x="10" y="20" font-family="monospace" font-size="12" fill="#4CAF50">
            <tspan x="10" dy="1.2em">// Threshold and find contours</tspan>
            <tspan x="10" dy="1.2em">threshold(foregroundMask, binaryMask, 25, 255, THRESH_BINARY);</tspan>
            <tspan x="10" dy="1.2em">findContours(binaryMask, contours, RETR_EXTERNAL, CHAIN_APPROX_SIMPLE);</tspan>
        </text>
    </g>
</svg>
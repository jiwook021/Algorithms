<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#F0F0F0"/>
    
    <!-- Title -->
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Motion Detection Pipeline</text>
    
    <!-- Pipeline Steps -->
    <rect x="50" y="60" width="100" height="100" fill="#FFF" stroke="#9C27B0" stroke-width="2"/>
    <text x="100" y="110" text-anchor="middle" fill="#9C27B0">Input</text>
    
    <rect x="200" y="60" width="100" height="100" fill="#FFF" stroke="#E91E63" stroke-width="2"/>
    <text x="250" y="110" text-anchor="middle" fill="#E91E63">Threshold</text>
    
    <rect x="350" y="60" width="100" height="100" fill="#FFF" stroke="#FF9800" stroke-width="2"/>
    <text x="400" y="110" text-anchor="middle" fill="#FF9800">Contours</text>
    
    <rect x="500" y="60" width="100" height="100" fill="#FFF" stroke="#009688" stroke-width="2"/>
    <text x="550" y="110" text-anchor="middle" fill="#009688">Output</text>
    
    <!-- Arrows -->
    <path d="M150 110 L200 110" stroke="#333" fill="none"/>
    <path d="M300 110 L350 110" stroke="#333" fill="none"/>
    <path d="M450 110 L500 110" stroke="#333" fill="none"/>
    
    <!-- Code Example -->
    <rect x="50" y="200" width="500" height="150" fill="#263238" rx="5"/>
    <text x="60" y="220" fill="#FFF" font-family="monospace" font-size="12">
        <tspan x="60" dy="1.2em">std::vector&lt;std::vector&lt;cv::Point&gt;&gt; contours;</tspan>
        <tspan x="60" dy="1.2em">cv::Mat thresholdOutput;</tspan>
        <tspan x="60" dy="1.2em">cv::threshold(diffFrame, thresholdOutput, 25, 255, cv::THRESH_BINARY);</tspan>
        <tspan x="60" dy="1.2em">cv::findContours(thresholdOutput, contours, cv::RETR_EXTERNAL,</tspan>
        <tspan x="60" dy="1.2em">                   cv::CHAIN_APPROX_SIMPLE);</tspan>
        <tspan x="60" dy="1.2em">for (auto&amp; contour : contours) {</tspan>
        <tspan x="70" dy="1.2em">    cv::rectangle(frame, cv::boundingRect(contour), cv::Scalar(0,255,0), 2);</tspan>
        <tspan x="60" dy="1.2em">}</tspan>
    </text>
</svg>
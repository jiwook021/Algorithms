<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Frame Processing Pipeline -->
    <rect x="50" y="100" width="100" height="75" fill="#3498db"/>
    <text x="65" y="90" font-family="monospace" font-size="10">Frame Capture</text>
    
    <path d="M150,137 L200,137" stroke="#2c3e50" stroke-width="2"/>
    <polygon points="200,137 192,132 192,142" fill="#2c3e50"/>
    
    <rect x="200" y="100" width="100" height="75" fill="#e67e22"/>
    <text x="215" y="90" font-family="monospace" font-size="10">Grayscale Conversion</text>
    
    <path d="M300,137 L350,137" stroke="#2c3e50" stroke-width="2"/>
    <polygon points="350,137 342,132 342,142" fill="#2c3e50"/>
    
    <rect x="350" y="100" width="100" height="75" fill="#2ecc71"/>
    <text x="365" y="90" font-family="monospace" font-size="10">Gaussian Blur</text>
    
    <!-- Code Example -->
    <rect x="50" y="220" width="500" height="120" fill="#2c3e50" rx="5"/>
    <text x="60" y="240" font-family="monospace" font-size="12" fill="#fff">
        <tspan x="60" dy="1.2em">cv::VideoCapture cap(0);</tspan>
        <tspan x="60" dy="1.2em">cv::Mat frame, gray, blurred;</tspan>
        <tspan x="60" dy="1.2em">cap >> frame;</tspan>
        <tspan x="60" dy="1.2em">cv::cvtColor(frame, gray, cv::COLOR_BGR2GRAY);</tspan>
        <tspan x="60" dy="1.2em">cv::GaussianBlur(gray, blurred, {5,5}, 0);</tspan>
    </text>
</svg>
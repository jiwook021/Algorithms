<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Motion Highlighting -->
    <rect x="50" y="50" width="240" height="180" fill="#bdc3c7"/>
    <text x="150" y="40" font-family="monospace" font-size="12">Original Video</text>
    
    <rect x="310" y="50" width="240" height="180" fill="#2c3e50"/>
    <text x="385" y="40" font-family="monospace" font-size="12">Motion Mask</text>
    
    <path d="M170,230 Q300,280 430,230" stroke="#e74c3c" stroke-width="2" fill="none"/>
    <circle cx="170" cy="230" r="5" fill="#e74c3c"/>
    <circle cx="430" cy="230" r="5" fill="#e74c3c"/>
    
    <!-- Code Example -->
    <rect x="50" y="260" width="500" height="120" fill="#2c3e50" rx="5"/>
    <text x="60" y="280" font-family="monospace" font-size="12" fill="#fff">
        <tspan x="60" dy="1.2em">// Detect contours of motion areas</tspan>
        <tspan x="60" dy="1.2em">std::vector&lt;std::vector&lt;cv::Point&gt;&gt; contours;</tspan>
        <tspan x="60" dy="1.2em">cv::findContours(mask, contours, cv::RETR_EXTERNAL, </tspan>
        <tspan x="60" dy="1.2em">                 cv::CHAIN_APPROX_SIMPLE);</tspan>
        <tspan x="60" dy="1.2em">cv::drawContours(frame, contours, -1, cv::Scalar(0,255,0), 2);</tspan>
    </text>
</svg>
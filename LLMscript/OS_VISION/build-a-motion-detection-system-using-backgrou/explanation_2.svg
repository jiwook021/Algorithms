<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#F0F0F0"/>
    
    <!-- Title -->
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Background Modeling Techniques</text>
    
    <!-- Timeline -->
    <line x1="50" y1="100" x2="550" y2="100" stroke="#333" stroke-width="2"/>
    
    <!-- Frames -->
    <rect x="60" y="80" width="80" height="40" fill="#2196F3" rx="3"/>
    <rect x="160" y="80" width="80" height="40" fill="#2196F3" rx="3"/>
    <rect x="260" y="80" width="80" height="40" fill="#2196F3" rx="3"/>
    <rect x="460" y="80" width="80" height="40" fill="#4CAF50" rx="3"/>
    
    <!-- Arrows -->
    <path d="M145 100 L155 100 L150 95" fill="#333"/>
    <path d="M245 100 L255 100 L250 95" fill="#333"/>
    <path d="M345 100 L455 100" stroke="#333" fill="none"/>
    
    <!-- Labels -->
    <text x="100" y="140" text-anchor="middle">Frame 1</text>
    <text x="200" y="140" text-anchor="middle">Frame 2</text>
    <text x="300" y="140" text-anchor="middle">Frame 3</text>
    <text x="500" y="140" text-anchor="middle">Background Model</text>
    
    <!-- Code Example -->
    <rect x="50" y="200" width="500" height="150" fill="#263238" rx="5"/>
    <text x="60" y="220" fill="#FFF" font-family="monospace" font-size="12">
        <tspan x="60" dy="1.2em">// Running average background model</tspan>
        <tspan x="60" dy="1.2em">cv::Mat grayFrame, accumulated;</tspan>
        <tspan x="60" dy="1.2em">cv::cvtColor(frame, grayFrame, cv::COLOR_BGR2GRAY);</tspan>
        <tspan x="60" dy="1.2em">if(accumulated.empty()) grayFrame.convertTo(accumulated, CV_32F);</tspan>
        <tspan x="60" dy="1.2em">cv::accumulateWeighted(grayFrame, accumulated, 0.05);</tspan>
        <tspan x="60" dy="1.2em">cv::convertScaleAbs(accumulated, backgroundModel);</tspan>
    </text>
</svg>
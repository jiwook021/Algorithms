<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Frame Difference Process -->
    <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Current Frame -->
    <rect x="50" y="100" width="200" height="200" fill="#4CAF50" opacity="0.8"/>
    <text x="120" y="80" font-size="16" fill="#2E7D32">Current Frame</text>
    
    <!-- Background Model -->
    <rect x="350" y="100" width="200" height="200" fill="#2196F3" opacity="0.8"/>
    <text x="400" y="80" font-size="16" fill="#1565C0">Background Model</text>
    
    <!-- Subtraction Symbol -->
    <path d="M275 200 L325 200 M300 175 L300 225" stroke="#E53935" stroke-width="4"/>
    
    <!-- Resulting Mask -->
    <rect x="200" y="250" width="200" height="80" fill="#616161"/>
    <text x="250" y="270" font-size="14" fill="white">Foreground Mask</text>
    <text x="270" y="300" font-size="12" fill="white">(Binary Image)</text>
    
    <!-- Code Example -->
    <g transform="translate(50 330)">
        <rect x="0" y="0" width="500" height="60" fill="#263238" rx="3"/>
        <text x="10" y="20" font-family="monospace" font-size="12" fill="#4CAF50">
            <tspan x="10" dy="1.2em">// Frame subtraction</tspan>
            <tspan x="10" dy="1.2em">absdiff(backgroundModel, currentFrame, foregroundMask);</tspan>
        </text>
    </g>
</svg>
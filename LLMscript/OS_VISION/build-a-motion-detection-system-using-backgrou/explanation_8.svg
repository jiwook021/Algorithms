<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Background Model Update -->
    <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Timeline -->
    <path d="M50 200 H550" stroke="#666" stroke-width="2"/>
    
    <!-- Frames -->
    <g transform="translate(100 180)">
        <circle cx="0" cy="0" r="15" fill="#2196F3"/>
        <circle cx="100" cy="0" r="15" fill="#2196F3"/>
        <circle cx="200" cy="0" r="15" fill="#2196F3"/>
        <circle cx="300" cy="0" r="15" fill="#2196F3"/>
        <text x="-15" y="50" font-size="12">Frame t-3</text>
        <text x="85" y="50" font-size="12">Frame t-2</text>
        <text x="185" y="50" font-size="12">Frame t-1</text>
        <text x="285" y="50" font-size="12">Frame t</text>
    </g>
    
    <!-- Update Process -->
    <path d="M50 100 Q275 150 500 100" stroke="#E53935" stroke-width="2" fill="none"/>
    <text x="275" y="60" font-size="14" text-anchor="middle" fill="#E53935">Running Average Update</text>
    
    <!-- Code Example -->
    <g transform="translate(50 300)">
        <rect x="0" y="0" width="500" height="60" fill="#263238" rx="3"/>
        <text x="10" y="20" font-family="monospace" font-size="12" fill="#4CAF50">
            <tspan x="10" dy="1.2em">// Update background model</tspan>
            <tspan x="10" dy="1.2em">accumulateWeighted(currentFrame, backgroundModel, 0.05);</tspan>
        </text>
    </g>
</svg>
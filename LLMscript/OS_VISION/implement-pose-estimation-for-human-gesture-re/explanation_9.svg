<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Coordinate Transformation -->
    <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Camera View -->
    <rect x="50" y="50" width="250" height="300" fill="#d0d0d0" rx="5"/>
    <circle cx="175" cy="200" r="80" fill="#ffffff"/>
    <path d="M175 120 L160 180 L190 180" fill="#00ff00"/>
    
    <!-- Screen Coordinates -->
    <rect x="350" y="50" width="200" height="300" fill="#d0d0d0" rx="5"/>
    <rect x="375" y="100" width="150" height="200" fill="#ffffff"/>
    <circle cx="450" cy="200" r="3" fill="#ff0000"/>
    <text x="440" y="220" font-size="10">(x,y)</text>
    
    <!-- Transformation Arrows -->
    <path d="M300 200 L350 200" stroke="#000" marker-end="url(#arrow)"/>
    
    <!-- Code Example -->
    <rect x="100" y="320" width="400" height="60" fill="#e0e0e0" rx="5"/>
    <text x="120" y="345" font-size="12" font-family="monospace" fill="#0000ff">// Convert camera to screen coordinates</text>
    <text x="120" y="365" font-size="12" font-family="monospace" fill="#0000ff">cv::Point2f transformCoords(cv::Point camPoint) { ... }</text>
    
    <!-- Axis Labels -->
    <text x="530" y="150" font-size="12">X</text>
    <text x="510" y="170" font-size="12">Y</text>
</svg>
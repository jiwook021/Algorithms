<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Processing Pipeline -->
    <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Pipeline Stages -->
    <rect x="50" y="150" width="100" height="60" fill="#ff9999" rx="5"/>
    <rect x="200" y="150" width="100" height="60" fill="#99ff99" rx="5"/>
    <rect x="350" y="150" width="100" height="60" fill="#9999ff" rx="5"/>
    <rect x="500" y="150" width="100" height="60" fill="#ffcc66" rx="5"/>
    
    <!-- Arrows -->
    <path d="M155 180 L195 180" stroke="#000" fill="none"/>
    <path d="M305 180 L345 180" stroke="#000" fill="none"/>
    <path d="M455 180 L495 180" stroke="#000" fill="none"/>
    
    <!-- Labels -->
    <text x="65" y="140" font-size="14">Input</text>
    <text x="215" y="140" font-size="14">Preprocess</text>
    <text x="365" y="140" font-size="14">Inference</text>
    <text x="525" y="140" font-size="14">Output</text>
    
    <!-- Code Example -->
    <rect x="100" y="280" width="400" height="60" fill="#e0e0e0" rx="5"/>
    <text x="120" y="305" font-size="12" font-family="monospace" fill="#0000ff">while(true) {</text>
    <text x="140" y="325" font-size="12" font-family="monospace" fill="#0000ff">    cv::Mat frame = captureFrame();</text>
    <text x="140" y="345" font-size="12" font-family="monospace" fill="#0000ff">    processFrame(frame);</text>
</svg>
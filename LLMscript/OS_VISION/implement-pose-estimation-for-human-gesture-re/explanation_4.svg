<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Human Keypoints Detection</text>
    
    <!-- Human figure -->
    <circle cx="300" cy="100" r="10" fill="#ff4444"/>
    <circle cx="250" cy="150" r="10" fill="#44ff44"/>
    <circle cx="350" cy="150" r="10" fill="#44ff44"/>
    <circle cx="250" cy="220" r="10" fill="#4444ff"/>
    <circle cx="350" cy="220" r="10" fill="#4444ff"/>
    
    <!-- Skeleton connections -->
    <path d="M300 100 L250 150 L250 220" stroke="#333" fill="none" stroke-width="2"/>
    <path d="M300 100 L350 150 L350 220" stroke="#333" fill="none" stroke-width="2"/>
    <line x1="250" y1="150" x2="350" y2="150" stroke="#333" stroke-width="2"/>
    
    <!-- Labels -->
    <text x="300" y="90" text-anchor="middle" fill="#ff4444">Head</text>
    <text x="220" y="160" fill="#44ff44">Shoulder</text>
    <text x="370" y="160" fill="#44ff44">Shoulder</text>
    <text x="220" y="240" fill="#4444ff">Hand</text>
    
    <!-- Code example -->
    <g transform="translate(50 280)">
        <rect x="0" y="0" width="500" height="90" fill="#fff" rx="5"/>
        <text x="10" y="20" font-family="monospace" font-size="14" fill="#333">
            <tspan x="10" dy="1.2em">// Define body keypoints structure</tspan>
            <tspan x="10" dy="1.2em">struct KeyPoints { cv::Point head, lShoulder, rShoulder; };</tspan>
        </text>
    </g>
</svg>
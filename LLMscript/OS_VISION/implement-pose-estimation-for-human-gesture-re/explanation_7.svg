<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Keypoint Detection Visualization -->
    <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
    <circle cx="300" cy="100" r="5" fill="#ff0000"/>
    <circle cx="250" cy="150" r="5" fill="#ff0000"/>
    <circle cx="350" cy="150" r="5" fill="#ff0000"/>
    <circle cx="250" cy="200" r="5" fill="#ff0000"/>
    <circle cx="350" cy="200" r="5" fill="#ff0000"/>
    <circle cx="300" cy="250" r="5" fill="#ff0000"/>
    
    <path d="M300 100 L250 150 L250 200 L300 250 L350 200 L350 150 L300 100" stroke="#00ff00" fill="none"/>
    <text x="280" y="90" font-size="12">Head</text>
    <text x="220" y="160" font-size="12">Left Shoulder</text>
    <text x="360" y="160" font-size="12">Right Shoulder</text>
    
    <!-- Code Example -->
    <rect x="50" y="300" width="500" height="80" fill="#e0e0e0" rx="5"/>
    <text x="70" y="325" font-size="12" font-family="monospace" fill="#0000ff">// Define keypoints array</text>
    <text x="70" y="345" font-size="12" font-family="monospace" fill="#0000ff">std::vector&lt;cv::Point&gt; keypoints = {</text>
    <text x="70" y="365" font-size="12" font-family="monospace" fill="#0000ff">    {300,100}, {250,150}, {350,150}, ... };</text>
</svg>
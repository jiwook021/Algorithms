<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <style>
        .text { font: 12px sans-serif; }
        .code { font: 14px monospace; fill: #333; }
        .keypoint { stroke: black; stroke-width: 0.5; }
        .connection { stroke-width: 2; }
    </style>
    
    <!-- Background -->
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Pose Skeleton -->
    <g transform="translate(30,20)">
        <!-- Body Connections -->
        <path class="connection" d="M100 150 L100 200 L80 250 M100 200 L120 250 M100 150 L150 120 M100 150 L50 120" stroke="#ff5722"/>
        <path class="connection" d="M150 120 L180 130 M50 120 L20 130 M80 250 L80 320 M120 250 L120 320" stroke="#2196f3"/>
        
        <!-- Keypoints -->
        <circle class="keypoint" cx="100" cy="150" r="5" fill="#ff0000"/>
        <circle class="keypoint" cx="100" cy="200" r="5" fill="#00ff00"/>
        <circle class="keypoint" cx="80" cy="250" r="5" fill="#0000ff"/>
        <circle class="keypoint" cx="120" cy="250" r="5" fill="#0000ff"/>
        <circle class="keypoint" cx="150" cy="120" r="5" fill="#ff00ff"/>
        <circle class="keypoint" cx="50" cy="120" r="5" fill="#ff00ff"/>
        <circle class="keypoint" cx="80" cy="320" r="5" fill="#ff9900"/>
        <circle class="keypoint" cx="120" cy="320" r="5" fill="#ff9900"/>
        
        <!-- Labels -->
        <text x="110" y="140" class="text">Torso (0)</text>
        <text x="110" y="220" class="text">Hip (1)</text>
        <text x="60" y="260" class="text">Left Knee (2)</text>
        <text x="130" y="260" class="text">Right Knee (3)</text>
    </g>

    <!-- Code Example -->
    <g transform="translate(300,20)">
        <rect x="0" y="0" width="280" height="360" fill="#fff" rx="5"/>
        <text x="15" y="30" class="code">// C++ Keypoint Processing</text>
        <text x="15" y="60" class="code">struct KeyPoint {</text>
        <text x="25" y="80" class="code">float x, y;</text>
        <text x="25" y="100" class="code">int id; // Body part ID</text>
        <text x="15" y="120" class="code">};</text>
        <text x="15" y="160" class="code">void draw_skeleton(</text>
        <text x="25" y="180" class="code">vector&lt;KeyPoint&gt;&amp; points) {</text>
        <text x="35" y="200" class="code">for (auto&amp; conn : BODY_CONNECTIONS) {</text>
        <text x="45" y="220" class="code">line(points[conn.a].x, </text>
        <text x="45" y="240" class="code">     points[conn.a].y,</text>
        <text x="45" y="260" class="code">     points[conn.b].x,</text>
        <text x="45" y="280" class="code">     points[conn.b].y);</text>
        <text x="25" y="310" class="code">}</text>
        <text x="15" y="330" class="code">}</text>
    </g>
</svg>
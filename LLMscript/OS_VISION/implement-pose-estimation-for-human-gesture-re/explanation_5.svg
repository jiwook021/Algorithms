<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Real-Time Video Processing Pipeline</text>
    
    <!-- Webcam -->
    <rect x="50" y="100" width="120" height="90" fill="#666" rx="10"/>
    <circle cx="110" cy="145" r="40" fill="#333"/>
    <text x="110" y="210" text-anchor="middle">Camera Input</text>
    
    <!-- Processing arrows -->
    <path d="M200 145 L300 145 L300 80 L500 80" stroke="#333" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M500 120 L300 120 L300 200 L200 200" stroke="#333" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Processing block -->
    <rect x="300" y="60" width="200" height="120" fill="#4CAF50" rx="10"/>
    <text x="400" y="120" text-anchor="middle" fill="white">Pose</text>
    <text x="400" y="140" text-anchor="middle" fill="white">Estimation</text>
    
    <!-- Code example -->
    <g transform="translate(50 280)">
        <rect x="0" y="0" width="500" height="90" fill="#fff" rx="5"/>
        <text x="10" y="20" font-family="monospace" font-size="14" fill="#333">
            <tspan x="10" dy="1.2em">cv::VideoCapture cap(0);</tspan>
            <tspan x="10" dy="1.2em">while (cap.isOpened()) {</tspan>
            <tspan x="20" dy="1.2em">processFrame(frame); // Real-time processing</tspan>
        </text>
    </g>
    
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
        </marker>
    </defs>
</svg>
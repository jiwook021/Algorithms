<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Processing Pipeline -->
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold">Real-Time Processing Pipeline</text>
    
    <!-- Pipeline Stages -->
    <rect x="50" y="100" width="100" height="60" fill="#00BCD4" rx="5"/>
    <rect x="200" y="100" width="100" height="60" fill="#FFC107" rx="5"/>
    <rect x="350" y="100" width="100" height="60" fill="#8BC34A" rx="5"/>
    <rect x="500" y="100" width="100" height="60" fill="#E91E63" rx="5"/>
    
    <!-- Stage Labels -->
    <text x="100" y="135" text-anchor="middle" fill="white">Camera Input</text>
    <text x="250" y="135" text-anchor="middle" fill="black">Preprocessing</text>
    <text x="400" y="135" text-anchor="middle" fill="white">Pose Estimation</text>
    <text x="550" y="135" text-anchor="middle" fill="white">Gesture Classifier</text>
    
    <!-- Arrows -->
    <path d="M150 130 L200 130" stroke="#333" fill="none" stroke-width="2"/>
    <path d="M300 130 L350 130" stroke="#333" fill="none" stroke-width="2"/>
    <path d="M450 130 L500 130" stroke="#333" fill="none" stroke-width="2"/>
    
    <!-- Timing Info -->
    <text x="300" y="200" text-anchor="middle" font-size="14">Frame Time Budget: 33ms @ 30FPS</text>
    <rect x="100" y="220" width="400" height="20" fill="#ddd"/>
    <rect x="100" y="220" width="250" height="20" fill="#4CAF50"/>
    <text x="300" y="235" text-anchor="middle" font-size="12">Processing Time: 25ms (75% of budget)</text>
    
    <!-- Code Example -->
    <rect x="50" y="280" width="500" height="100" fill="#263238" rx="5"/>
    <text x="300" y="300" text-anchor="middle" fill="#fff" font-family="monospace">C++ Main Loop:</text>
    <text x="60" y="330" fill="#7FDA7D" font-family="monospace" font-size="14">while(cap.read(frame)) {</text>
    <text x="80" y="355" fill="#7FDA7D" font-family="monospace" font-size="14">preprocess(frame);</text>
    <text x="80" y="380" fill="#7FDA7D" font-family="monospace" font-size="14">std::vector&lt;KeyPoint> poses = estimatePose(blob);</text>
</svg>
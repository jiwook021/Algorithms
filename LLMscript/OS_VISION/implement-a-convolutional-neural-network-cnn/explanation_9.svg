<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Convolution Operation Explanation -->
    <rect width="100%" height="100%" fill="#FAFAFA"/>
    
    <!-- Input Matrix -->
    <rect x="50" y="50" width="110" height="110" fill="none" stroke="#4A90E2" stroke-width="2"/>
    <text x="60" y="40" font-size="14" fill="#4A90E2">Input (5x5)</text>
    <g transform="translate(50,50)">
        <rect x="0" y="0" width="20" height="20" fill="#E0F0FF"/>
        <rect x="22" y="0" width="20" height="20" fill="#E0F0FF"/>
        <rect x="44" y="0" width="20" height="20" fill="#E0F0FF"/>
        <rect x="66" y="0" width="20" height="20" fill="#E0F0FF"/>
        <rect x="88" y="0" width="20" height="20" fill="#E0F0FF"/>
        <!-- Repeat for 5 rows -->
    </g>
    
    <!-- Kernel -->
    <rect x="300" y="50" width="66" height="66" fill="none" stroke="#F5A623" stroke-width="2"/>
    <text x="310" y="40" font-size="14" fill="#F5A623">Kernel (3x3)</text>
    <g transform="translate(300,50)">
        <rect x="0" y="0" width="20" height="20" fill="#FFE4B2"/>
        <rect x="22" y="0" width="20" height="20" fill="#FFE4B2"/>
        <rect x="44" y="0" width="20" height="20" fill="#FFE4B2"/>
        <!-- Repeat for 3 rows -->
    </g>
    
    <!-- Convolution Animation Path -->
    <path d="M180,110 L300,110" stroke="#7ED321" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Output Feature Map -->
    <rect x="400" y="80" width="88" height="88" fill="none" stroke="#50E3C2" stroke-width="2"/>
    <text x="410" y="70" font-size="14" fill="#50E3C2">Output (3x3)</text>
    
    <!-- Code Example -->
    <g transform="translate(50,200)">
        <rect x="0" y="0" width="500" height="150" fill="#333" rx="5"/>
        <text x="20" y="30" font-family="monospace" font-size="12" fill="#FFF">
            <tspan x="20" dy="1.2em">void conv2d(float input[5][5], float kernel[3][3],</tspan>
            <tspan x="20" dy="1.2em">           float output[3][3], int stride=1) {</tspan>
            <tspan x="40" dy="1.2em" fill="#7ED321">for (int i=0; i&lt;3; i++) { // Output rows</tspan>
            <tspan x="40" dy="1.2em" fill="#7ED321">    for (int j=0; j&lt;3; j++) { // Output cols</tspan>
            <tspan x="60" dy="1.2em" fill="#F5A623">        float sum = 0;</tspan>
            <tspan x="60" dy="1.2em" fill="#4A90E2">        for (int m=0; m&lt;3; m++) {</tspan>
            <tspan x="60" dy="1.2em" fill="#4A90E2">            for (int n=0; n&lt;3; n++) {</tspan>
            <tspan x="80" dy="1.2em">                sum += input[i*stride+m][j*stride+n] </tspan>
            <tspan x="80" dy="1.2em">                     * kernel[m][n];</tspan>
            <tspan x="60" dy="1.2em">            }}</tspan>
            <tspan x="40" dy="1.2em">        output[i][j] = sum;</tspan>
            <tspan x="20" dy="1.2em">    }}</tspan>
        </text>
    </g>
</svg>
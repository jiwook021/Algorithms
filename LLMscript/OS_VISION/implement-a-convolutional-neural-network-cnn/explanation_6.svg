<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Convolution Operation -->
    <rect x="50" y="50" width="150" height="150" fill="#a6cee3" stroke="#1f78b4"/>
    <text x="125" y="40" font-size="14" text-anchor="middle">Input (5x5)</text>
    
    <rect x="300" y="100" width="80" height="80" fill="#b2df8a" stroke="#33a02c"/>
    <text x="340" y="95" font-size="14" text-anchor="middle">Kernel (3x3)</text>
    
    <rect x="450" y="150" width="100" height="100" fill="#fb9a99" stroke="#e31a1c"/>
    <text x="500" y="140" font-size="14" text-anchor="middle">Output Feature Map</text>

    <path d="M210 125 L290 125" stroke="#666" marker-end="url(#arrow)"/>
    <text x="250" y="120" font-size="12" text-anchor="middle">Convolution</text>

    <!-- Code Example -->
    <foreignObject x="50" y="250" width="500" height="140">
        <pre xmlns="http://www.w3.org/1999/xhtml" style="font-family: monospace; background: #f0f0f0; padding: 10px;">
void convolve(float input[5][5], float kernel[3][3], float output[3][3]) {
    for(int i=0; i&lt;3; i++) {
        for(int j=0; j&lt;3; j++) {
            float sum = 0;
            for(int m=0; m&lt;3; m++) {
                for(int n=0; n&lt;3; n++) {
                    sum += input[i+m][j+n] * kernel[m][n];
                }
            }
            output[i][j] = sum;
        }
    }
}</pre>
    </foreignObject>

    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
        </marker>
    </defs>
</svg>
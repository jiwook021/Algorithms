<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- ReLU Activation -->
  <path d="M100,100 L300,100 L500,300" stroke="#F44336" stroke-width="3" fill="none"/>
  <text x="300" y="80" text-anchor="middle" fill="#F44336">ReLU Function</text>
  
  <!-- Input/Output Visualization -->
  <rect x="100" y="200" width="80" height="80" fill="#BBDEFB" stroke="#2196F3"/>
  <text x="110" y="190" font-size="12" fill="#2196F3">Pre-activation</text>
  
  <rect x="300" y="200" width="80" height="80" fill="#C8E6C9" stroke="#4CAF50"/>
  <text x="310" y="190" font-size="12" fill="#4CAF50">Post-ReLU</text>
  
  <path d="M200,240 L280,240" stroke="#607D8B" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- C++ Code Example -->
  <text x="100" y="320" font-size="12" fill="#37474F" font-family="monospace">
    <tspan x="100" y="320">// ReLU implementation</tspan>
    <tspan x="100" y="340">float relu(float x) {</tspan>
    <tspan x="120" y="360">return (x &gt; 0) ? x : 0;</tspan>
    <tspan x="100" y="380">}</tspan>
  </text>
</svg>
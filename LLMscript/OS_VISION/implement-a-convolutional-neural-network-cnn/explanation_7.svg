<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- ReLU Activation -->
    <rect x="100" y="80" width="120" height="120" fill="#fdbf6f" stroke="#ff7f00"/>
    <text x="160" y="70" font-size="14" text-anchor="middle">Pre-Activation</text>
    
    <rect x="380" y="80" width="120" height="120" fill="#cab2d6" stroke="#6a3d9a"/>
    <text x="440" y="70" font-size="14" text-anchor="middle">Post-ReLU</text>

    <!-- Sample Values -->
    <text x="110" y="100" font-size="12" fill="black">2.1  -1.3  0.5</text>
    <text x="110" y="120" font-size="12" fill="black">-0.2  3.1   1.7</text>
    <text x="110" y="140" font-size="12" fill="black">0.9  -0.4  2.0</text>

    <text x="390" y="100" font-size="12" fill="black">2.1   0.0  0.5</text>
    <text x="390" y="120" font-size="12" fill="black">0.0   3.1  1.7</text>
    <text x="390" y="140" font-size="12" fill="black">0.9   0.0  2.0</text>

    <path d="M240 140 L360 140" stroke="#666" marker-end="url(#arrow)"/>
    <text x="300" y="135" font-size="12" text-anchor="middle">ReLU Function</text>

    <!-- Code Example -->
    <foreignObject x="150" y="240" width="300" height="100">
        <pre xmlns="http://www.w3.org/1999/xhtml" style="font-family: monospace; background: #f0f0f0; padding: 10px;">
void relu(float* arr, int size) {
    for(int i=0; i&lt;size; i++) {
        arr[i] = (arr[i] > 0) ? arr[i] : 0;
    }
}</pre>
    </foreignObject>

    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
        </marker>
    </defs>
</svg>
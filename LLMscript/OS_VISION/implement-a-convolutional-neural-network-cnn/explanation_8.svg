<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Max Pooling -->
    <rect x="50" y="50" width="200" height="200" fill="#ffff99" stroke="#b15928"/>
    <text x="150" y="40" font-size="14" text-anchor="middle">Input (4x4)</text>
    
    <rect x="350" y="100" width="100" height="100" fill="#bebada" stroke="#8dd3c7"/>
    <text x="400" y="95" font-size="14" text-anchor="middle">Pooled (2x2)</text>

    <!-- Pooling Windows -->
    <rect x="50" y="50" width="100" height="100" stroke="#666" fill="none"/>
    <rect x="150" y="50" width="100" height="100" stroke="#666" fill="none"/>
    <rect x="50" y="150" width="100" height="100" stroke="#666" fill="none"/>
    <rect x="150" y="150" width="100" height="100" stroke="#666" fill="none"/>

    <!-- Sample Values -->
    <text x="70" y="80" font-size="12">2.1 1.3</text>
    <text x="70" y="100" font-size="12">0.9 3.2</text>
    <text x="170" y="80" font-size="12">1.5 2.8</text>
    <text x="170" y="100" font-size="12">0.4 2.1</text>
    <text x="70" y="180" font-size="12">2.5 1.9</text>
    <text x="70" y="200" font-size="12">0.3 2.7</text>
    <text x="170" y="180" font-size="12">1.2 3.0</text>
    <text x="170" y="200" font-size="12">2.8 0.9</text>

    <!-- Pooled Values -->
    <text x="360" y="130" font-size="14">3.2</text>
    <text x="440" y="130" font-size="14">2.8</text>
    <text x="360" y="180" font-size="14">2.7</text>
    <text x="440" y="180" font-size="14">3.0</text>

    <!-- Code Example -->
    <foreignObject x="150" y="280" width="300" height="100">
        <pre xmlns="http://www.w3.org/1999/xhtml" style="font-family: monospace; background: #f0f0f0; padding: 10px;">
float max_pool(float input[2][2]) {
    float max = input[0][0];
    for(int i=0; i&lt;2; i++) {
        for(int j=0; j&lt;2; j++) {
            if(input[i][j] > max) max = input[i][j];
        }
    }
    return max;
}</pre>
    </foreignObject>
</svg>
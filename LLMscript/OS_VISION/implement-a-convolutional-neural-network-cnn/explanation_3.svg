<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Max Pooling -->
  <rect x="100" y="100" width="160" height="160" fill="#FFF9C4" stroke="#FBC02D"/>
  <text x="120" y="90" font-size="12" fill="#FBC02D">Input (4x4)</text>
  
  <!-- Pooling Windows -->
  <rect x="110" y="110" width="70" height="70" stroke="#E64A19" fill="none"/>
  <rect x="110" y="190" width="70" height="70" stroke="#E64A19" fill="none"/>
  <rect x="190" y="110" width="70" height="70" stroke="#E64A19" fill="none"/>
  <rect x="190" y="190" width="70" height="70" stroke="#E64A19" fill="none"/>
  
  <!-- Output -->
  <rect x="400" y="130" width="80" height="80" fill="#C5CAE9" stroke="#5C6BC0"/>
  <text x="410" y="120" font-size="12" fill="#5C6BC0">Output (2x2)</text>
  
  <!-- C++ Code Example -->
  <text x="100" y="300" font-size="12" fill="#37474F" font-family="monospace">
    <tspan x="100" y="300">// Max pooling (2x2)</tspan>
    <tspan x="100" y="320">for(int i=0; i&lt;2; i++){</tspan>
    <tspan x="120" y="340">for(int j=0; j&lt;2; j++){</tspan>
    <tspan x="140" y="360">output[i][j] = max(</tspan>
    <tspan x="160" y="380">window_values);</tspan>
  </text>
</svg>
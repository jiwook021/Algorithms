<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Flattening Layer -->
  <rect x="50" y="100" width="150" height="150" fill="#B3E5FC" stroke="#0288D1">
    <animate attributeName="opacity" from="1" to="0.5" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="80" y="90" fill="#0288D1">3D Feature Maps</text>
  
  <path d="M230,175 L330,175" stroke="#F57C00" stroke-width="3"/>
  
  <rect x="350" y="125" width="200" height="50" fill="#FFE0B2" stroke="#EF6C00"/>
  <text x="400" y="160" fill="#EF6C00">Flattened Vector</text>
  
  <!-- C++ Code Example -->
  <text x="50" y="280" font-size="12" fill="#37474F" font-family="monospace">
    <tspan x="50" y="280">// Flatten 3D to 1D</tspan>
    <tspan x="50" y="300">vector&lt;float&gt; flatten(</tspan>
    <tspan x="50" y="320">vector&lt;vector&lt;vector&lt;float&gt;&gt;&gt; input) {</tspan>
    <tspan x="70" y="340">vector&lt;float&gt; output;</tspan>
    <tspan x="70" y="360">// ... nested loops ...</tspan>
  </text>
</svg>
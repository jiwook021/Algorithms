<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" font-family="Arial">MLFQ Queue Structure</text>
    
    <!-- Queues -->
    <rect x="50" y="60" width="500" height="60" fill="#ffdddd" rx="5"/>
    <text x="300" y="100" text-anchor="middle" font-family="Arial">High Priority Queue (Time Quantum: 5ms)</text>
    
    <rect x="50" y="140" width="500" height="60" fill="#ddffdd" rx="5"/>
    <text x="300" y="180" text-anchor="middle" font-family="Arial">Medium Priority Queue (Time Quantum: 10ms)</text>
    
    <rect x="50" y="220" width="500" height="60" fill="#ddddff" rx="5"/>
    <text x="300" y="260" text-anchor="middle" font-family="Arial">Low Priority Queue (Time Quantum: 20ms)</text>
    
    <!-- Arrows -->
    <path d="M300 120 L300 140" stroke="#666" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M300 200 L300 220" stroke="#666" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
        </marker>
    </defs>
    
    <text x="300" y="320" text-anchor="middle" font-family="Arial" font-size="14">Priority decreases downward, time quantum increases</text>
</svg>
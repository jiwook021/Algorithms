<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Title -->
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Scheduling Algorithm Flow</text>
    
    <!-- Flowchart -->
    <path d="M300 70 V100 M300 100 Q300 120 280 140 M300 100 Q300 120 320 140" stroke="#333" fill="none"/>
    
    <!-- Boxes -->
    <rect x="250" y="70" width="100" height="30" fill="#ffcc66"/>
    <text x="300" y="88" text-anchor="middle" font-size="12">Start in Q0</text>
    
    <!-- Decision Diamond -->
    <path d="M300 140 L340 160 L300 180 L260 160 Z" fill="#ccffcc"/>
    <text x="300" y="160" text-anchor="middle" font-size="10">Completed\nin time slice?</text>
    
    <!-- Arrows -->
    <path d="M300 180 V210 M300 210 Q300 230 280 250 M300 210 Q300 230 320 250" stroke="#333" fill="none"/>
    
    <!-- Outcomes -->
    <rect x="220" y="250" width="60" height="30" fill="#99ccff"/>
    <text x="250" y="268" text-anchor="middle" font-size="10">Demote to\nQ1</text>
    
    <rect x="320" y="250" width="60" height="30" fill="#99ff99"/>
    <text x="350" y="268" text-anchor="middle" font-size="10">Return to\nQueue</text>
    
    <!-- Code Example -->
    <text x="300" y="350" text-anchor="middle" font-family="monospace" font-size="12">
        <tspan x="300" dy="0">void schedule() {</tspan>
        <tspan x="300" dy="1.2em">  if (process.completed) {</tspan>
        <tspan x="300" dy="1.2em">    promote(process);</tspan>
        <tspan x="300" dy="1.2em">  } else {</tspan>
        <tspan x="300" dy="1.2em">    demote(process);</tspan>
        <tspan x="300" dy="1.2em">  }</tspan>
        <tspan x="300" dy="1.2em">}</tspan>
    </text>
</svg>
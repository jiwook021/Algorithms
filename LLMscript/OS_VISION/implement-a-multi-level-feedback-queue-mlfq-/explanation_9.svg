<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" font-size="18" text-anchor="middle" fill="#2c3e50">Aging Prevention Mechanism</text>
  
  <!-- Timeline -->
  <path d="M50 350 h500" stroke="#34495e" stroke-width="3"/>
  <g transform="translate(100 200)">
    <rect width="400" height="100" fill="#f39c12" rx="5"/>
    <text x="200" y="40" text-anchor="middle" fill="white">Low Priority Queue</text>
    <circle cx="100" cy="70" r="20" fill="#2ecc71"/>
    <text x="100" y="70" text-anchor="middle" dy=".3em" fill="white">P1</text>
    
    <!-- Aging arrows -->
    <path d="M100 90 v40 M100 130 l-10-10 M100 130 l10-10" stroke="#e74c3c"/>
    <path d="M100 170 q0 30 60 30" stroke="#e74c3c" fill="none" stroke-dasharray="4 4"/>
    <rect x="160" y="180" width="80" height="40" fill="#3498db" rx="5"/>
    <text x="200" y="200" text-anchor="middle" fill="white">Medium</text>
    <text x="200" y="220" text-anchor="middle" fill="white">Queue</text>
  </g>
  
  <!-- Code Example -->
  <g transform="translate(50 300)">
    <rect x="0" y="0" width="500" height="80" fill="#34495e" rx="5"/>
    <text x="20" y="25" fill="#ecf0f1" font-family="monospace" font-size="14">
      <tspan x="10" dy="1.2em">// Aging implementation</tspan>
      <tspan x="10" dy="1.2em">void checkAging() {</tspan>
      <tspan x="20" dy="1.2em" fill="#f39c12">for (auto&amp; p : lowQueue) {</tspan>
      <tspan x="30" dy="1.2em">if (p.waitTime > </tspan><tspan fill="#e74c3c">AGE_THRESHOLD</tspan><tspan>) {</tspan>
      <tspan x="40" dy="1.2em" fill="#2ecc71">promoteToMedium(p);</tspan>
    </text>
  </g>
</svg>
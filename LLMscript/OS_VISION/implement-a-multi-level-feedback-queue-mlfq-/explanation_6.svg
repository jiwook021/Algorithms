<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Title -->
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Aging Prevention Mechanism</text>
    
    <!-- Timeline -->
    <path d="M50 350 L550 350" stroke="#666" stroke-width="2"/>
    
    <!-- Process -->
    <rect x="100" y="200" width="60" height="40" fill="#ff9999" id="proc"/>
    <text x="130" y="220" text-anchor="middle">P1</text>
    
    <!-- Aging Arrow -->
    <path d="M100 240 Q100 270 100 300 L100 340" stroke="#ff4444" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M500 240 Q500 270 500 300 L500 340" stroke="#44ff44" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    
    <!-- Time Labels -->
    <text x="100" y="370" text-anchor="middle">t=0</text>
    <text x="300" y="370" text-anchor="middle">t=50</text>
    <text x="500" y="370" text-anchor="middle">t=100</text>
    
    <!-- Boosted Process -->
    <use href="#proc" x="400" y="0" fill="#99ff99"/>
    <text x="430" y="220" text-anchor="middle">P1</text>
    
    <!-- Code Example -->
    <text x="300" y="100" text-anchor="middle" font-family="monospace" font-size="12">
        <tspan x="300" dy="0">void checkAging() {</tspan>
        <tspan x="300" dy="1.2em">  if (process.waitTime > 100) {</tspan>
        <tspan x="300" dy="1.2em">    boostPriority(process);</tspan>
        <tspan x="300" dy="1.2em">  }</tspan>
        <tspan x="300" dy="1.2em">}</tspan>
    </text>
    
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#333"/>
        </marker>
    </defs>
</svg>
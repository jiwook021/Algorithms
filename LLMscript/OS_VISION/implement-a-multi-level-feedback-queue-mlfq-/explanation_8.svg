<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" font-size="18" text-anchor="middle" fill="#2c3e50">Priority Adjustment Logic</text>
  
  <!-- Flowchart -->
  <path d="M300 60 v40 M300 100 a20 20 0 1 0 40 0" fill="none" stroke="#34495e" stroke-width="2"/>
  <rect x="250" y="100" width="100" height="60" fill="#3498db" rx="5"/>
  <text x="300" y="135" text-anchor="middle" fill="white">Run Process</text>
  
  <!-- Decision Branch -->
  <path d="M300 160 v40 M300 200 l-100 40 M300 200 l100 40" stroke="#34495e" stroke-width="2"/>
  <text x="190" y="250" text-anchor="middle" fill="#e74c3c">Used full quantum?</text>
  <text x="410" y="250" text-anchor="middle" fill="#2ecc71">Yielded early?</text>
  
  <!-- Arrows -->
  <path d="M200 240 l-20-10 M200 240 l20-10" stroke="#e74c3c"/>
  <path d="M400 240 l-20-10 M400 240 l20-10" stroke="#2ecc71"/>
  
  <!-- Code Example -->
  <g transform="translate(50 280)">
    <rect width="500" height="100" fill="#34495e" rx="5"/>
    <text x="20" y="30" fill="#ecf0f1" font-family="monospace" font-size="12">
      <tspan x="10" dy="1.2em">void adjustPriority(Process&amp; p, bool usedFullQuantum) {</tspan>
      <tspan x="20" dy="1.2em" fill="#e74c3c">if (usedFullQuantum) </tspan>
      <tspan x="30" dy="1.2em" fill="#ecf0f1">demote(p);</tspan>
      <tspan x="20" dy="1.2em" fill="#2ecc71">else </tspan>
      <tspan x="30" dy="1.2em" fill="#ecf0f1">promoteIfPossible(p);</tspan>
      <tspan x="10" dy="1.2em">}</tspan>
    </text>
  </g>
</svg>
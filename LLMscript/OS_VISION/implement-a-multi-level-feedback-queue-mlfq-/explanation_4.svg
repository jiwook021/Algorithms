<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Title -->
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">MLFQ Queue Structure</text>
    
    <!-- Queues -->
    <rect x="50" y="60" width="500" height="60" rx="5" fill="#ff9999"/>
    <rect x="50" y="150" width="500" height="60" rx="5" fill="#99ff99"/>
    <rect x="50" y="240" width="500" height="60" rx="5" fill="#9999ff"/>
    
    <!-- Queue Labels -->
    <text x="300" y="100" text-anchor="middle" fill="#000">High Priority (Queue 0) - Time Quantum: 10ms</text>
    <text x="300" y="190" text-anchor="middle" fill="#000">Medium Priority (Queue 1) - Time Quantum: 20ms</text>
    <text x="300" y="280" text-anchor="middle" fill="#000">Low Priority (Queue 2) - Round Robin</text>
    
    <!-- Process Boxes -->
    <rect x="70" y="70" width="40" height="40" fill="#ff5555"/>
    <rect x="150" y="160" width="40" height="40" fill="#55ff55"/>
    <rect x="230" y="250" width="40" height="40" fill="#5555ff"/>
    
    <!-- Code Example -->
    <g transform="translate(300 320)">
        <text x="-140" y="20" font-family="monospace" font-size="12" fill="#333">
            <tspan x="-140" dy="1.2em">struct Process {</tspan>
            <tspan x="-120" dy="1.2em">  int pid;</tspan>
            <tspan x="-120" dy="1.2em">  int priority;</tspan>
            <tspan x="-140" dy="1.2em">};</tspan>
            <tspan x="-140" dy="1.2em">vector&lt;queue&lt;Process>> mlfq(3);</tspan>
        </text>
    </g>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" font-family="Arial">Process Execution Flow</text>
    
    <!-- Process lifecycle -->
    <circle cx="100" cy="100" r="40" fill="#aaffaa"/>
    <text x="100" y="100" text-anchor="middle" dy=".3em" font-family="Arial">P1</text>
    <path d="M140,100 L200,100" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    
    <rect x="200" y="60" width="120" height="80" fill="#ffaa00" rx="10"/>
    <text x="260" y="100" text-anchor="middle" font-family="Arial">Run for 5ms</text>
    
    <path d="M320,100 L380,100" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="380" y="60" width="120" height="80" fill="#aaaaff" rx="10"/>
    <text x="440" y="100" text-anchor="middle" font-family="Arial">Demote to</text>
    <text x="440" y="120" text-anchor="middle" font-family="Arial">next queue</text>
    
    <!-- I/O Path -->
    <path d="M260,140 L260,220 L140,220" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="200" y="190" text-anchor="middle" font-family="Arial" fill="red">I/O Request</text>
    <circle cx="100" cy="220" r="40" fill="#ffaaaa"/>
    <text x="100" y="220" text-anchor="middle" dy=".3em" font-family="Arial">I/O</text>
    
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
        </marker>
    </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" font-size="18" text-anchor="middle" fill="#2c3e50">MLFQ Queue Structure</text>
  
  <!-- High Priority Queue -->
  <rect x="50" y="60" width="500" height="60" rx="5" fill="#e74c3c"/>
  <text x="300" y="100" fill="white" text-anchor="middle">High Priority (Quantum: 8ms)</text>
  
  <!-- Medium Priority Queue -->
  <rect x="50" y="140" width="500" height="60" rx="5" fill="#3498db"/>
  <text x="300" y="180" fill="white" text-anchor="middle">Medium Priority (Quantum: 16ms)</text>
  
  <!-- Low Priority Queue -->
  <rect x="50" y="220" width="500" height="60" rx="5" fill="#2ecc71"/>
  <text x="300" y="260" fill="white" text-anchor="middle">Low Priority (Quantum: 32ms)</text>
  
  <!-- Code Example -->
  <g transform="translate(50 300)">
    <rect width="500" height="80" fill="#34495e" rx="5"/>
    <text x="20" y="25" fill="#ecf0f1" font-family="monospace" font-size="14">
      <tspan x="10" dy="1.2em">// C++ Queue structure example</tspan>
      <tspan x="10" dy="1.2em" fill="#3498db">vector</tspan><tspan fill="#ecf0f1">&lt;Process&gt; queues[3] = {</tspan>
      <tspan x="20" dy="1.2em" fill="#e74c3c">/* High */</tspan><tspan fill="#ecf0f1">{}, </tspan><tspan fill="#3498db">/* Medium */</tspan><tspan fill="#ecf0f1">{}, </tspan><tspan fill="#2ecc71">/* Low */</tspan><tspan fill="#ecf0f1">{}</tspan>
    </text>
  </g>
</svg>
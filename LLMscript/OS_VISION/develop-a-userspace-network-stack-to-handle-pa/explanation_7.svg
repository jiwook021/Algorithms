<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Zero-Copy Packet Flow -->
    <rect x="100" y="100" width="120" height="60" fill="#cce5ff" rx="5"/>
    <text x="110" y="130" font-family="monospace" font-size="12">NIC Hardware</text>
    
    <rect x="300" y="80" width="180" height="160" fill="#e5ffe5" rx="10"/>
    <text x="320" y="110" font-family="monospace" font-size="14">User Space Memory</text>
    
    <!-- Memory Buffers -->
    <rect x="320" y="130" width="140" height="20" fill="#ffd700"/>
    <rect x="320" y="155" width="140" height="20" fill="#98fb98"/>
    <rect x="320" y="180" width="140" height="20" fill="#ffb6c1"/>
    
    <!-- Data Path -->
    <path d="M220 130 L300 130" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M220 155 L300 155" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M220 180 L300 180" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Code Sample -->
    <text x="120" y="250" font-family="monospace" font-size="12">// DPDK packet reception</text>
    <text x="120" y="270" font-family="monospace" font-size="12">uint16_t nb_rx = rte_eth_rx_burst(</text>
    <text x="120" y="290" font-family="monospace" font-size="12">    port_id, queue_id,</text>
    <text x="120" y="310" font-family="monospace" font-size="12">    mbufs, BURST_SIZE);</text>
    
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
        </marker>
    </defs>
</svg>
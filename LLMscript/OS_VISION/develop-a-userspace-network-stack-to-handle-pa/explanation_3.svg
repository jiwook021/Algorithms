<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" text-anchor="middle" font-size="20" fill="#333">Zero-Copy Packet Handling</text>
  
  <!-- Memory Pools -->
  <rect x="100" y="80" width="150" height="200" fill="#ffcc99" rx="5"/>
  <text x="175" y="100" text-anchor="middle" fill="#333">NIC Buffer</text>
  
  <rect x="350" y="80" width="150" height="200" fill="#cceecc" rx="5"/>
  <text x="425" y="100" text-anchor="middle" fill="#333">App Memory</text>
  
  <!-- Direct Access -->
  <path d="M250 180 L350 180" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="170" text-anchor="middle" fill="#333">Direct Access</text>
  
  <!-- Code Example -->
  <foreignObject x="150" y="290" width="300" height="80">
    <pre xmlns="http://www.w3.org/1999/xhtml" style="font-family: monospace; color: #333;">
// Map NIC memory to userspace
void *nic_mem = mmap(NULL, SIZE, PROT_READ, MAP_SHARED, nic_fd, 0);
process_packet(nic_mem + offset);</pre>
  </foreignObject>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Zero-Copy Mechanism -->
    <rect x="50" y="100" width="500" height="60" fill="#cce6ff" rx="5"/>
    <rect x="50" y="200" width="500" height="60" fill="#ffe6cc" rx="5"/>
    
    <!-- Memory Regions -->
    <rect x="70" y="110" width="120" height="40" fill="#99ccff"/>
    <rect x="70" y="210" width="120" height="40" fill="#ffcc99"/>
    
    <!-- Pointers -->
    <path d="M 190 130 L 350 240" stroke="#ff6666" stroke-width="2"/>
    <path d="M 350 240 L 510 250" stroke="#ff6666" stroke-width="2"/>
    <circle cx="350" cy="240" r="5" fill="#ff6666"/>
    
    <!-- Labels -->
    <text x="100" y="95" font-size="12" fill="#333">Application Memory</text>
    <text x="100" y="195" font-size="12" fill="#333">NIC Buffer</text>
    <text x="300" y="280" font-size="14" fill="#ff6666">Zero-Copy Pointer</text>
    
    <!-- Code Example -->
    <rect x="100" y="300" width="400" height="80" fill="white" rx="5"/>
    <text x="120" y="325" font-size="12" font-family="monospace" fill="#333">// Ring buffer setup</text>
    <text x="120" y="345" font-size="12" font-family="monospace" fill="#333">struct rx_ring *ring = mmap(NULL, RING_SIZE,</text>
    <text x="120" y="365" font-size="12" font-family="monospace" fill="#333">    PROT_READ|PROT_WRITE, MAP_SHARED, nic_fd, 0);</text>
    
    <!-- Arrows -->
    <path d="M 70 170 Q 200 180 350 170" stroke="#666" fill="none" stroke-dasharray="4"/>
    <text x="200" y="165" font-size="12" fill="#666">Traditional Copy</text>
</svg>
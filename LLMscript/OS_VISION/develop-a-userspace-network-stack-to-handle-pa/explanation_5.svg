<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" text-anchor="middle" font-size="20" fill="#333">Performance Comparison</text>
  
  <!-- Traditional Stack -->
  <rect x="100" y="100" width="80" height="200" fill="#ff9999"/>
  <text x="140" y="320" text-anchor="middle" fill="#333">Kernel</text>
  
  <!-- Userspace Stack -->
  <rect x="400" y="60" width="80" height="240" fill="#99ccff"/>
  <text x="440" y="320" text-anchor="middle" fill="#333">Userspace</text>
  
  <!-- Metrics -->
  <text x="140" y="280" text-anchor="middle" fill="#333">Latency: 15μs</text>
  <text x="140" y="300" text-anchor="middle" fill="#333">Throughput: 1M pps</text>
  
  <text x="440" y="280" text-anchor="middle" fill="#333">Latency: 2μs</text>
  <text x="440" y="300" text-anchor="middle" fill="#333">Throughput: 10M pps</text>
  
  <!-- Code Example -->
  <foreignObject x="200" y="150" width="200" height="100">
    <pre xmlns="http://www.w3.org/1999/xhtml" style="font-family: monospace; color: #333;">
// Benchmark results
void run_test() {
    auto start = high_resolution_clock::now();
    // Process packets
    auto delta = duration_cast&lt;microseconds&gt;(end - start);
}</pre>
  </foreignObject>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" text-anchor="middle" font-size="20" fill="#333">Userspace Stack Architecture</text>
  
  <!-- Kernel Space -->
  <rect x="50" y="80" width="200" height="240" fill="#ff9999" rx="5"/>

  <path d="M150 130 l0 160" stroke="#666" stroke-width="2" stroke-dasharray="4"/>
  <text x="150" y="220" text-anchor="middle" fill="#333">Network Stack</text>
  
  <!-- Userspace -->
  <rect x="350" y="80" width="200" height="240" fill="#99ccff" rx="5"/>
  <text x="450" y="110" text-anchor="middle" fill="#333">Userspace</text>
  
  <!-- Components -->
  <rect x="370" y="130" width="160" height="40" fill="#fff"/>
  <text x="450" y="155" text-anchor="middle" fill="#333">Application</text>
  
  <rect x="370" y="190" width="160" height="40" fill="#cceecc"/>
  <text x="450" y="215" text-anchor="middle" fill="#333">Network Stack</text>
  
  <rect x="370" y="250" width="160" height="40" fill="#ffcc99"/>
  <text x="450" y="275" text-anchor="middle" fill="#333">Driver (DPDK)</text>
  

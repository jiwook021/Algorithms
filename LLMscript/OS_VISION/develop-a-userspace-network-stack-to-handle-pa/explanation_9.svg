<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Traditional Kernel Path -->
    <path d="M 50 80 L 50 320" stroke="#666" stroke-width="2" stroke-dasharray="4"/>
    <rect x="20" y="60" width="60" height="280" fill="#ffcccc" rx="3"/>
    <text x="40" y="40" font-size="14" fill="#333">Kernel Space</text>
    
    <!-- Userspace Bypass -->
    <rect x="200" y="100" width="400" height="200" fill="#ccffcc" rx="5"/>
    <text x="350" y="80" font-size="16" fill="#2c5f2d">Userspace Network Stack</text>
    
    <!-- Data Flow -->
    <path d="M 120 200 L 180 200" stroke="#2c5f2d" stroke-width="3"/>
    <polygon points="190 200 180 195 180 205" fill="#2c5f2d"/>
    
    <!-- Code Example -->
    <rect x="220" y="120" width="360" height="160" fill="white" rx="5"/>
    <text x="240" y="150" font-size="12" font-family="monospace" fill="#333">// DPDK initialization</text>
    <text x="240" y="170" font-size="12" font-family="monospace" fill="#333">int ret = rte_eal_init(argc, argv);</text>
    <text x="240" y="190" font-size="12" font-family="monospace" fill="#333">struct rte_eth_conf port_conf = {0};</text>
    <text x="240" y="210" font-size="12" font-family="monospace" fill="#333">rte_eth_rx_burst(port, queue, bufs, BURST_SIZE);</text>
    
    <!-- Labels -->
    <text x="30" y="200" transform="rotate(-90 30 200)" font-size="12" fill="#cc0000">System Calls</text>
    <text x="140" y="190" font-size="12" fill="#2c5f2d">Bypass</text>
</svg>
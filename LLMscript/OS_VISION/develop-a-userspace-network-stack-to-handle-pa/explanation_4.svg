<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" text-anchor="middle" font-size="20" fill="#333">Batch Packet Processing</text>
  
  <!-- Packet Queue -->
  <rect x="100" y="80" width="400" height="60" fill="#99ccff" rx="5"/>
  <text x="300" y="115" text-anchor="middle" fill="#333">RX Queue (32 packets)</text>
  
  <!-- Processing Steps -->
  <rect x="150" y="160" width="300" height="40" fill="#cceecc"/>
  <text x="300" y="185" text-anchor="middle" fill="#333">Parse Headers</text>
  
  <rect x="150" y="220" width="300" height="40" fill="#ffcc99"/>
  <text x="300" y="245" text-anchor="middle" fill="#333">Process TCP/IP</text>
  
  <rect x="150" y="280" width="300" height="40" fill="#eecccc"/>
  <text x="300" y="305" text-anchor="middle" fill="#333">Dispatch to App</text>
  
  <!-- Code Example -->
  <foreignObject x="50" y="330" width="500" height="60">
    <pre xmlns="http://www.w3.org/1999/xhtml" style="font-family: monospace; color: #333;">
void process_batch(struct rte_mbuf **mbufs, int count) {
    for (int i = 0; i &lt; count; i++) {
        parse_packet(mbufs[i]);
    }
}</pre>
  </foreignObject>
</svg>
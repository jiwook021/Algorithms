  <!-- Code Snippet -->
  <rect x="150" y="340" width="300" height="50" fill="#e0e0e0" rx="5"/>
  <text x="160" y="360" font-family="monospace" font-size="12">void put(int key, int value) {</text>
  <text x="180" y="380" font-family="monospace" font-size="12">if (cacheList.size() == capacity) {</text>
  <text x="200" y="400" font-family="monospace" font-size="12" fill="#FF5722">evictLRU();</text>
</svg>
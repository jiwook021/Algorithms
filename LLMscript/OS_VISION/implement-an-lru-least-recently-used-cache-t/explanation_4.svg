<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" text-anchor="middle" font-size="18">Page Insertion Process</text>
  
  <!-- Hash Map Update -->
  <g transform="translate(50 100)">
    <rect width="200" height="200" fill="#e0ffff" stroke="#000"/>
    <text x="100" y="20" text-anchor="middle">HashMap Update</text>
    <path d="M0 40 h200 M0 80 h200 M0 120 h200 M0 160 h200" stroke="#666"/>
    <text x="10" y="60">Page4 → Node4</text>
    <rect x="5" y="45" width="190" height="30" fill="yellow" opacity="0.3"/>
  </g>
  
  <!-- Linked List Update -->
  <g transform="translate(350 100)">
    <rect width="200" height="200" fill="#ffe0e0" stroke="#000"/>
    <text x="100" y="20" text-anchor="middle">Linked List Update</text>
    <g transform="translate(100 50)">
      <rect x="-30" y="-20" width="60" height="40" fill="#fff" stroke="#000"/>
      <text x="0" y="0" dominant-baseline="middle" text-anchor="middle">Node4</text>
      <path d="M-60 0 L-30 0 M-45 -5 L-30 0 L-45 5" fill="none" stroke="#000"/>
      <path d="M30 0 L60 0 M45 -5 L60 0 L45 5" fill="none" stroke="#000"/>
    </g>
    <path d="M150 70 L150 130 M140 120 L150 130 L160 120" stroke="#000"/>
  </g>
  
  <!-- Code Example -->
  <g transform="translate(50 300)">
    <rect x="0" y="0" width="500" height="70" fill="#fff" stroke="#000"/>
    <text x="10" y="15" font-family="monospace" font-size="12">void addToHead(Node* node) {</text>
    <text x="20" y="30" font-family="monospace" font-size="12">node->next = head->next;</text>
    <text x="20" y="45" font-family="monospace" font-size="12">head->next->prev = node;</text>
    <text x="20" y="60" font-family="monospace" font-size="12">head->next = node;</text>
    <text x="10" y="75" font-family="monospace" font-size="12">}</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" text-anchor="middle" font-size="18">LRU Cache Data Structure</text>
  
  <!-- Hash Map Visualization -->
  <rect x="50" y="60" width="200" height="240" fill="#e0ffff" stroke="#000"/>
  <text x="150" y="90" text-anchor="middle">HashMap</text>
  <path d="M60 100 h180 M60 140 h180 M60 180 h180 M60 220 h180 M60 260 h180" stroke="#666"/>
  <text x="70" y="120">Page1 → Node1</text>
  <text x="70" y="160">Page2 → Node2</text>
  <text x="70" y="200">Page3 → Node3</text>
  
  <!-- Doubly Linked List Visualization -->
  <rect x="350" y="60" width="200" height="240" fill="#ffe0e0" stroke="#000"/>
  <text x="450" y="90" text-anchor="middle">Linked List</text>
  <g transform="translate(400 120)">
    <rect x="-30" y="-20" width="60" height="40" fill="#fff" stroke="#000"/>
    <text x="0" y="0" dominant-baseline="middle" text-anchor="middle">Head</text>
    <path d="M30 0 L60 0 M45 -5 L60 0 L45 5" fill="none" stroke="#000"/>
  </g>
  <g transform="translate(500 200)">
    <rect x="-30" y="-20" width="60" height="40" fill="#fff" stroke="#000"/>
    <text x="0" y="0" dominant-baseline="middle" text-anchor="middle">Node2</text>
    <path d="M-60 0 L-30 0 M-45 -5 L-30 0 L-45 5" fill="none" stroke="#000"/>
    <path d="M30 0 L60 0 M45 -5 L60 0 L45 5" fill="none" stroke="#000"/>
  </g>
  <g transform="translate(400 280)">
    <rect x="-30" y="-20" width="60" height="40" fill="#fff" stroke="#000"/>
    <text x="0" y="0" dominant-baseline="middle" text-anchor="middle">Tail</text>
    <path d="M-60 0 L-30 0 M-45 -5 L-30 0 L-45 5" fill="none" stroke="#000"/>
  </g>
  
  <!-- Code Example -->
  <g transform="translate(20 320)">
    <rect x="0" y="0" width="560" height="70" fill="#fff" stroke="#000"/>
    <text x="10" y="15" font-family="monospace" font-size="12">struct Node {</text>
    <text x="20" y="30" font-family="monospace" font-size="12">int key, value;</text>
    <text x="20" y="45" font-family="monospace" font-size="12">Node *prev, *next;</text>
    <text x="10" y="60" font-family="monospace" font-size="12">};</text>
  </g>
</svg>
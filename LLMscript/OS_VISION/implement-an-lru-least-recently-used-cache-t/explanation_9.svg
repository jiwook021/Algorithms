  <!-- Animation Arrow -->
  <path d="M250 160 L350 160" stroke="#FF4081" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="140" text-anchor="middle" fill="#FF4081">Access Key 2</text>
  
  <!-- Code Snippet -->
  <rect x="150" y="300" width="300" height="70" fill="#e0e0e0" rx="5"/>
  <text x="160" y="320" font-family="monospace" font-size="12">int get(int key) {</text>
  <text x="180" y="340" font-family="monospace" font-size="12" fill="#FF4081">// Move accessed page to front</text>
  <text x="180" y="360" font-family="monospace" font-size="12">cacheList.splice(cacheList.begin(), cacheList, it);</text>

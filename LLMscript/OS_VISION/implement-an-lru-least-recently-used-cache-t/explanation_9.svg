<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" text-anchor="middle" font-size="20">Cache Hit Operation</text>
  
  <!-- Before State -->
  <text x="150" y="70" text-anchor="middle" font-size="16">Before Access</text>
  <rect x="50" y="80" width="200" height="200" rx="10" fill="#fff"/>

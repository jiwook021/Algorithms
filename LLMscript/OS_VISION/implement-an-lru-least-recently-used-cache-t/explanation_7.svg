<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <style>
        .node { fill: #c8e6c9; stroke: #2e7d32; }
        .evicted { fill: #ffcdd2; stroke: #c62828; }
        .arrow { stroke: #6d4c41; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font: 14px sans-serif; }
        .code { fill: #f5f5f5; stroke: #616161; }
    </style>
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#6d4c41"/>
        </marker>
    </defs>
    
    <!-- Full cache state -->
    <rect x="100" y="100" width="80" height="40" class="node" rx="3"/>
    <rect x="200" y="100" width="80" height="40" class="node" rx="3"/>
    <rect x="300" y="100" width="80" height="40" class="node" rx="3"/>
    <rect x="400" y="100" width="80" height="40" class="evicted" rx="3"/>
    <text x="140" y="90" class="text">Page 1</text>
    <text x="240" y="90" class="text">Page 2</text>
    <text x="340" y="90" class="text">Page 3</text>
    <text x="440" y="90" class="text">Page 4 (LRU)</text>
    
    <!-- Eviction process -->
    <path d="M440 140 L440 180 Q440 200 100 200 L100 240" stroke="#d32f2f" stroke-width="2" fill="none"/>
    <text x="270" y="220" class="text" text-anchor="middle">Evict LRU</text>
    
    <!-- New page added -->
    <rect x="100" y="260" width="80" height="40" class="node" rx="3"/>
    <rect x="200" y="260" width="80" height="40" class="node" rx="3"/>
    <rect x="300" y="260" width="80" height="40" class="node" rx="3"/>
    <rect x="400" y="260" width="80" height="40" class="node" rx="3"/>
    <text x="440" y="250" class="text">Page 5</text>
    
    <!-- Code example -->
    <rect x="50" y="340" width="500" height="40" class="code" rx="5"/>
    <text x="60" y="360" class="text">
        <tspan x="60" dy="1.2em">if (cache.size() > capacity) { removeTail(); }</tspan>
    </text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Title -->
    <text x="300" y="30" font-size="18" text-anchor="middle" font-family="Arial">Multi-Level TLB Hierarchy</text>
    
    <!-- CPU -->
    <circle cx="300" cy="100" r="30" fill="#6666ff"/>
    <text x="300" y="100" text-anchor="middle" fill="white" font-family="Arial">CPU</text>
    
    <!-- L1 TLB -->
    <rect x="200" y="150" width="200" height="60" fill="#ff9966"/>
    <text x="300" y="180" text-anchor="middle" font-family="Arial">L1 TLB (64 entries)</text>
    <text x="300" y="200" text-anchor="middle" font-family="Arial" font-size="12">1-cycle latency</text>
    
    <!-- L2 TLB -->
    <rect x="150" y="230" width="300" height="60" fill="#99ff99"/>
    <text x="300" y="260" text-anchor="middle" font-family="Arial">L2 TLB (512 entries)</text>
    <text x="300" y="280" text-anchor="middle" font-family="Arial" font-size="12">5-cycle latency</text>
    
    <!-- Arrows -->
    <path d="M300,130 L300,150" stroke="black" fill="none"/>
    <path d="M300,210 L300,230" stroke="black" fill="none"/>
    <path d="M300,290 L300,320" stroke="black" fill="none"/>
    
    <!-- Page Table -->
    <rect x="250" y="320" width="100" height="40" fill="#d0d0d0"/>
    <text x="300" y="340" text-anchor="middle" font-family="Arial">Page Table</text>
    
    <!-- Code Example -->
    <g transform="translate(20,350)">
        <rect width="560" height="40" fill="#2b2b2b" rx="5"/>
        <text x="10" y="25" fill="white" font-family="monospace" font-size="12">// C++: Optimize for L1 TLB locality</text>
        <text x="10" y="40" fill="white" font-family="monospace" font-size="12">for(int i=0; i&lt;64; i++) process(data_block[i]); // Fits L1 TLB</text>
    </g>
</svg>
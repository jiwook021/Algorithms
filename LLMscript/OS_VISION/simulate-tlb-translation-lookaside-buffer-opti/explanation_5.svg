<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="18" text-anchor="middle" fill="#333">Huge Pages Reduce TLB Pressure</text>
    
    <!-- Standard 4KB Pages -->
    <rect x="50" y="80" width="500" height="30" fill="#fff" stroke="#333"/>
    <text x="60" y="100" font-size="12" fill="#333">4KB Pages (1000 entries):</text>
    <g transform="translate(50 110)">
        <rect x="0" y="0" width="500" height="100" fill="#e6e6e6"/>
        <rect x="2" y="2" width="49" height="96" fill="#ff9999"/>
        <rect x="52" y="2" width="49" height="96" fill="#99ccff"/>
        <rect x="102" y="2" width="49" height="96" fill="#ff9999"/>
        <text x="250" y="50" text-anchor="middle" fill="#333">... 1000 small pages ...</text>
    </g>
    
    <!-- 2MB Huge Pages -->
    <rect x="50" y="250" width="500" height="30" fill="#fff" stroke="#333"/>
    <text x="60" y="270" font-size="12" fill="#333">2MB Huge Pages (2 entries):</text>
    <g transform="translate(50 280)">
        <rect x="0" y="0" width="500" height="100" fill="#e6e6e6"/>
        <rect x="2" y="2" width="248" height="96" fill="#99ccff"/>
        <rect x="252" y="2" width="246" height="96" fill="#99ccff"/>
    </g>
    
    <!-- Code Example -->
    <g transform="translate(400 180)">
        <rect width="180" height="80" fill="#fff" stroke="#333"/>
        <text x="10" y="20" font-size="12" fill="#333">// C++ huge page allocation</text>
        <text x="10" y="40" font-size="12" fill="#333">void* buf = mmap(nullptr, 2*1024*1024,</text>
        <text x="10" y="60" font-size="12" fill="#333">    PROT_READ|PROT_WRITE,</text>
        <text x="10" y="80" font-size="12" fill="#333">    MAP_PRIVATE|MAP_HUGETLB);</text>
    </g>
</svg>
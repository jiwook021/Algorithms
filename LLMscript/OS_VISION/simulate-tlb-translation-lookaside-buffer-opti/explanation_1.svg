<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Title -->
    <text x="300" y="30" font-size="18" text-anchor="middle" font-family="Arial">TLB Coverage Optimization with Larger Pages</text>
    
    <!-- Virtual Memory -->
    <rect x="50" y="80" width="200" height="240" fill="#e0e0ff"/>
    <text x="150" y="70" text-anchor="middle" font-family="Arial">Virtual Memory</text>
    
    <!-- Physical Memory -->
    <rect x="350" y="80" width="200" height="240" fill="#ffe0e0"/>
    <text x="450" y="70" text-anchor="middle" font-family="Arial">Physical Memory</text>
    
    <!-- Small Pages -->
    <g transform="translate(50,100)">
        <rect width="200" height="30" fill="#ff6666"/>
        <text x="100" y="20" fill="white" text-anchor="middle" font-family="Arial">4KB Pages (8 entries)</text>
    </g>
    
    <!-- Large Pages -->
    <g transform="translate(50,250)">
        <rect width="200" height="60" fill="#66ff66"/>
        <text x="100" y="35" text-anchor="middle" font-family="Arial">2MB Huge Page (1 entry)</text>
    </g>
    
    <!-- TLB -->
    <rect x="250" y="150" width="100" height="100" fill="#d0d0d0"/>
    <text x="300" y="140" text-anchor="middle" font-family="Arial">TLB</text>
    <text x="300" y="170" text-anchor="middle" font-family="Arial" font-size="14">Reduced</text>
    <text x="300" y="190" text-anchor="middle" font-family="Arial" font-size="14">Entries</text>
    
    <!-- Code Example -->
    <g transform="translate(20,350)">
        <rect width="560" height="40" fill="#2b2b2b" rx="5"/>
        <text x="10" y="25" fill="white" font-family="monospace" font-size="12">// C++: Using huge pages</text>
        <text x="10" y="40" fill="white" font-family="monospace" font-size="12">void* addr = mmap(NULL, 2*1024*1024, PROT_READ|PROT_WRITE,</text>
        <text x="10" y="55" fill="white" font-family="monospace" font-size="12">                  MAP_PRIVATE|MAP_ANONYMOUS|MAP_HUGETLB);</text>
    </g>
</svg>
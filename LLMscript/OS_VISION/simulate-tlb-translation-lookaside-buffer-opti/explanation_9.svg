<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Huge Pages Diagram -->
    <rect x="50" y="50" width="500" height="150" fill="#e1bee7" stroke="#6a1b9a"/>
    <text x="60" y="70" font-family="sans-serif">4KB Pages (Standard):</text>
    <rect x="60" y="90" width="480" height="30" fill="#f3e5f5"/>
    <rect x="60" y="90" width="40" height="30" fill="#ce93d8" stroke="#6a1b9a"/>
    <rect x="100" y="90" width="40" height="30" fill="#ce93d8" stroke="#6a1b9a"/>
    <rect x="140" y="90" width="40" height="30" fill="#ce93d8" stroke="#6a1b9a"/>
    <text x="70" y="110" font-size="10">Page 0</text>
    <text x="110" y="110" font-size="10">Page 1</text>
    <text x="150" y="110" font-size="10">Page 2</text>
    <text x="300" y="130" font-size="12">... 1024 entries needed for 4MB</text>

    <rect x="50" y="220" width="500" height="150" fill="#c8e6c9" stroke="#2e7d32"/>
    <text x="60" y="240" font-family="sans-serif">2MB Huge Pages:</text>
    <rect x="60" y="260" width="480" height="30" fill="#e8f5e9"/>
    <rect x="60" y="260" width="480" height="30" fill="#a5d6a7" stroke="#2e7d32"/>
    <text x="200" y="280" font-size="12">Single Entry Covers 2MB</text>

    <!-- Code Example -->
    <rect x="100" y="330" width="400" height="50" fill="#fff" stroke="#607d8b"/>
    <text x="110" y="350" font-family="monospace" font-size="12">// C++ huge page allocation</text>
    <text x="110" y="370" font-family="monospace" font-size="12">madvise(ptr, size, MADV_HUGEPAGE);</text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    
    <!-- TLB Structure -->
    <rect x="50" y="50" width="200" height="300" fill="#e0f7fa" stroke="#00796b" stroke-width="2"/>
    <text x="60" y="80" font-family="monospace" font-size="12">TLB Entries:</text>
    <g transform="translate(60 100)">
        <rect width="180" height="30" fill="#b2ebf2" stroke="#00796b"/>
        <text x="10" y="20">VPN 0x1a -> PFN 0x3f (Valid)</text>
        <rect y="40" width="180" height="30" fill="#b2ebf2" stroke="#00796b"/>
        <text x="10" y="60">VPN 0x7c -> PFN 0x14 (Valid)</text>
        <rect y="80" width="180" height="30" fill="#ffcdd2" stroke="#00796b"/>
        <text x="10" y="100">VPN 0x3d -> PFN -- (Invalid)</text>
    </g>

    <!-- CPU Access -->
    <path d="M300 200 L350 200 L350 100 L450 100" stroke="#37474f" fill="none" stroke-width="2"/>
    <rect x="450" y="50" width="100" height="100" fill="#c8e6c9" stroke="#2e7d32"/>
    <text x="460" y="70" font-family="monospace" font-size="12">Page Table</text>
    <text x="460" y="90" font-family="monospace" font-size="10">(Slower access)</text>

    <!-- Code Example -->
    <rect x="300" y="250" width="250" height="120" fill="#fff" stroke="#607d8b"/>
    <text x="310" y="270" font-family="monospace" font-size="12">// C++ memory access pattern</text>
    <text x="310" y="290" font-family="monospace" font-size="12">for (int i = 0; i &lt; 1000; i++) {</text>
    <text x="330" y="310" font-family="monospace" font-size="12">data[calculateIndex(i)] += 1;</text>
    <text x="310" y="330" font-family="monospace" font-size="12">}</text>
    <text x="310" y="360" font-family="sans-serif" font-size="10" fill="#d32f2f">Non-sequential access</text>
    <text x="310" y="375" font-family="sans-serif" font-size="10" fill="#d32f2f">causes TLB thrashing</text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="18" text-anchor="middle" fill="#333">TLB Hit vs Miss Comparison</text>
    
    <!-- CPU -->
    <rect x="50" y="80" width="100" height="60" fill="#cce5ff" stroke="#333"/>
    <text x="100" y="115" text-anchor="middle" fill="#333">CPU</text>
    
    <!-- TLB -->
    <rect x="200" y="60" width="150" height="100" fill="#ffd699" stroke="#333"/>
    <text x="275" y="90" text-anchor="middle" fill="#333">TLB</text>
    <path d="M275 100 L275 140" stroke="#333" fill="none"/>
    <text x="275" y="155" text-anchor="middle" fill="green">Hit (80ns)</text>
    <text x="275" y="175" text-anchor="middle" fill="red">Miss (200ns)</text>
    
    <!-- Page Table Walk -->
    <path d="M350 110 L450 110 L450 160 L350 160 Z" fill="#ff9999" stroke="#333"/>
    <text x="400" y="135" text-anchor="middle" fill="#333">Page Table</text>
    <text x="400" y="155" text-anchor="middle" fill="red">Walk</text>
    
    <!-- Arrows -->
    <path d="M150 110 L200 110" stroke="#333" fill="none"/>
    <path d="M350 110 L300 110" stroke="#333" fill="none" marker-end="url(#arrow)"/>
    <path d="M275 140 L275 200 L150 200 L150 240" stroke="red" fill="none" marker-end="url(#arrow)"/>
    <path d="M275 110 L275 80 L500 80 L500 240 L150 240" stroke="green" fill="none" marker-end="url(#arrow)"/>
    
    <!-- Code Example -->
    <g transform="translate(400 200)">
        <rect width="180" height="120" fill="#fff" stroke="#333"/>
        <text x="10" y="20" font-size="12" fill="#333">// C++ memory access pattern</text>
        <text x="10" y="40" font-size="12" fill="#333">int data[1000];</text>
        <text x="10" y="60" font-size="12" fill="#333">for (int i = 0; i </text>
        <text x="10" y="80" font-size="12" fill="#333">    data[i] = process(); // Sequential</text>
        <text x="10" y="100" font-size="12" fill="#333">                      // access improves TLB hit</text>
    </g>
    
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
        </marker>
    </defs>
</svg>
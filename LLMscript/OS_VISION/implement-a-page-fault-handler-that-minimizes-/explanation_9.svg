<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <!-- Memory Frames -->
    <g transform="translate(100,50)">
        <rect x="0" y="0" width="400" height="30" fill="#7ed321"/>
        <text x="10" y="20" fill="black">Frame 0 (LRU: 15:30)</text>
        <rect x="0" y="40" width="400" height="30" fill="#7ed321"/>
        <text x="10" y="60" fill="black">Frame 1 (LRU: 15:25)</text>
        <rect x="0" y="80" width="400" height="30" fill="#7ed321"/>
        <text x="10" y="100" fill="black">Frame 2 (LRU: 15:35)</text>
    </g>
    
    <!-- Replacement Process -->
    <path d="M250 200 L250 250 L150 250 L150 115" stroke="#d0021b" fill="none" stroke-width="2" marker-end="url(#arrow3)"/>
    <text x="200" y="240" fill="#d0021b" text-anchor="middle">Evict LRU Frame</text>
    
    <!-- New Page -->
    <rect x="100" y="280" width="400" height="30" fill="#4a90e2"/>
    <text x="110" y="300" fill="white">New Page (LRU: 15:40)</text>
    
    <!-- Code Example -->
    <rect x="50" y="150" width="300" height="120" fill="#333"/>
    <text x="60" y="170" fill="white" font-family="monospace" font-size="12">
        <tspan x="60" y="170">Frame* find_victim_frame() {</tspan>
        <tspan x="70" y="190">    Frame* oldest = &amp;frames[0];</tspan>
        <tspan x="70" y="210">    for (auto&amp; frame : frames) {</tspan>
        <tspan x="80" y="230">        if (frame.last_used </tspan>
        <tspan x="80" y="250">            oldest = &amp;frame;</tspan>
        <tspan x="70" y="270">    return oldest;</tspan>
        <tspan x="60" y="290">}</tspan>
    </text>
    
    <!-- LRU Legend -->
    <rect x="450" y="50" width="130" height="80" fill="#fff"/>
    <text x="460" y="70" font-size="14">LRU Key:</text>
    <rect x="460" y="80" width="20" height="20" fill="#d0021b"/>
    <text x="485" y="95" font-size="12">Evicted</text>
    <rect x="460" y="105" width="20" height="20" fill="#4a90e2"/>
    <text x="485" y="120" font-size="12">New</text>
    
    <defs>
        <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
        </marker>
    </defs>
</svg>
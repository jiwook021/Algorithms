<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Page Replacement (LRU)</text>
    
    <!-- Memory Frames -->
    <rect x="100" y="60" width="400" height="200" fill="#fff" stroke="#666" rx="5"/>
    
    <!-- Page Frames -->
    <rect x="120" y="80" width="80" height="160" fill="#d4edda" stroke="#155724"/>
    <text x="160" y="110" text-anchor="middle" fill="#155724">Page 5</text>
    <text x="160" y="130" text-anchor="middle" font-size="12">Last used: 420</text>
    
    <rect x="220" y="80" width="80" height="160" fill="#fff3cd" stroke="#856404"/>
    <text x="260" y="110" text-anchor="middle" fill="#856404">Page 2</text>
    <text x="260" y="130" text-anchor="middle" font-size="12">Last used: 580</text>
    
    <rect x="320" y="80" width="80" height="160" fill="#cce5ff" stroke="#004085"/>
    <text x="360" y="110" text-anchor="middle" fill="#004085">Page 7</text>
    <text x="360" y="130" text-anchor="middle" font-size="12">Last used: 400</text>
    
    <rect x="420" y="80" width="80" height="160" fill="#f8d7da" stroke="#721c24"/>
    <text x="460" y="110" text-anchor="middle" fill="#721c24">Page 1</text>
    <text x="460" y="130" text-anchor="middle" font-size="12">Last used: 390</text>
    
    <!-- Replacement Arrow -->
    <path d="M 460 250 L 460 280 L 160 280 L 160 250" stroke="#dc3545" stroke-width="2" fill="none"/>
    <text x="300" y="270" text-anchor="middle" fill="#dc3545">Evict Least Recently Used</text>
    
    <!-- Code Example -->
    <rect x="50" y="300" width="500" height="80" fill="#1e1e1e" rx="5"/>
    <text x="60" y="320" font-size="14" fill="#9cdcfe">// LRU tracking in C++</text>
    <text x="60" y="340" font-size="14" fill="#fff">
        <tspan x="60" dy="18">void access_page(Page* p) {</tspan>
        <tspan x="80" dy="18">p->last_used = get_current_timestamp();</tspan>
        <tspan x="60" dy="18">}</tspan>
    </text>
</svg>
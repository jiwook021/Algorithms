<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <!-- CPU Access -->
    <rect x="50" y="50" width="100" height="60" rx="10" fill="#4a90e2"/>
    <text x="100" y="85" fill="white" text-anchor="middle" font-size="14">CPU</text>
    
    <!-- Memory Access -->
    <rect x="200" y="30" width="300" height="200" fill="#50e3c2" opacity="0.8"/>
    <text x="350" y="60" fill="black" text-anchor="middle" font-size="16">Physical Memory</text>
    
    <!-- Page Fault -->
    <path d="M150 110 L200 110 L200 160 L250 160" stroke="#d0021b" fill="none" stroke-width="2"/>
    <text x="200" y="130" fill="#d0021b" text-anchor="middle" font-size="12">Page Fault</text>
    
    <!-- Disk Access -->
    <circle cx="450" cy="300" r="40" fill="#f5a623"/>
    <text x="450" y="300" fill="white" text-anchor="middle" font-size="14">Disk</text>
    
    <!-- Code Example -->
    <rect x="50" y="150" width="300" height="140" fill="#333"/>
    <text x="60" y="170" fill="white" font-family="monospace" font-size="12">
        <tspan x="60" y="170">void handle_page_fault(uint64_t address) {</tspan>
        <tspan x="70" y="190">    PageTableEntry &amp;entry = </tspan>
        <tspan x="70" y="210">        get_page_table_entry(address);</tspan>
        <tspan x="70" y="230">    if (!entry.present) {</tspan>
        <tspan x="80" y="250">        load_page_from_disk(entry);</tspan>
        <tspan x="80" y="270">        entry.present = true;</tspan>
        <tspan x="60" y="290">    }}</tspan>
    </text>
    
    <!-- Arrows -->
    <path d="M450 300L350 230" stroke="black" fill="none" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M350 160L450 260" stroke="black" fill="none" stroke-width="1" marker-end="url(#arrow)"/>
    
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
        </marker>
    </defs>
</svg>
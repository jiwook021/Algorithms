<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Process Access -->
    <rect x="50" y="50" width="160" height="60" fill="#cfe2f3" rx="5"/>
    <text x="130" y="85" text-anchor="middle" font-size="14">Process Accesses</text>
    <text x="130" y="105" text-anchor="middle" font-size="14">Memory Page</text>
    
    <!-- Page Table Check -->
    <rect x="250" y="50" width="160" height="60" fill="#f9cb9c" rx="5"/>
    <text x="330" y="85" text-anchor="middle" font-size="14">Page Table</text>
    <text x="330" y="105" text-anchor="middle" font-size="14">Lookup (Invalid)</text>
    
    <!-- Page Fault Trigger -->
    <rect x="450" y="50" width="120" height="60" fill="#ea9999" rx="5"/>
    <text x="510" y="85" text-anchor="middle" font-size="14">Page</text>
    <text x="510" y="105" text-anchor="middle" font-size="14">Fault</text>
    
    <!-- Handler Workflow -->
    <path d="M300 150 V180 H100 V210" stroke="#666" fill="none"/>
    <rect x="50" y="210" width="200" height="60" fill="#b6d7a8" rx="5"/>
    <text x="150" y="245" text-anchor="middle" font-size="14">Find Free Frame</text>
    
    <path d="M300 150 V180 H350 V210" stroke="#666" fill="none"/>
    <rect x="350" y="210" width="200" height="60" fill="#d5a6bd" rx="5"/>
    <text x="450" y="240" text-anchor="middle" font-size="14">Load Page</text>
    <text x="450" y="260" text-anchor="middle" font-size="14">from Disk</text>
    
    <!-- Code Example -->
    <rect x="200" y="300" width="200" height="80" fill="#fff" rx="5"/>
    <text x="300" y="320" font-size="12" text-anchor="middle">void handle_page_fault(vaddr_t address) {</text>
    <text x="300" y="340" font-size="12" text-anchor="middle">    page_t* page = find_page(address);</text>
    <text x="300" y="360" font-size="12" text-anchor="middle">    load_from_backing_store(page);</text>
    <text x="300" y="380" font-size="12" text-anchor="middle">}</text>
</svg>
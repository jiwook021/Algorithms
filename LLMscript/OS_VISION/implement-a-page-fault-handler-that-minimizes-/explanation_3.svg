<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Clock Algorithm Visualization -->
    <circle cx="300" cy="200" r="150" stroke="#666" fill="none"/>
    
    <!-- Page Entries -->
    <circle cx="450" cy="200" r="25" fill="#cfe2f3"/>
    <text x="450" y="205" text-anchor="middle">P1</text>
    <circle cx="300" cy="350" r="25" fill="#f9cb9c"/>
    <text x="300" y="355" text-anchor="middle">P2</text>
    <circle cx="150" cy="200" r="25" fill="#b6d7a8"/>
    <text x="150" y="205" text-anchor="middle">P3</text>
    <circle cx="300" cy="50" r="25" fill="#d5a6bd"/>
    <text x="300" y="55" text-anchor="middle">P4</text>
    
    <!-- Reference Bits -->
    <text x="460" y="190" font-size="12">R=1</text>
    <text x="310" y="340" font-size="12">R=0</text>
    <text x="140" y="190" font-size="12">R=1</text>
    <text x="310" y="70" font-size="12">R=0</text>
    
    <!-- Clock Hand -->
    <path d="M300 200 L400 200" stroke="#ea9999" stroke-width="3"/>
    <circle cx="300" cy="200" r="5" fill="#ea9999"/>
    
    <!-- Code Example -->
    <rect x="50" y="20" width="240" height="100" fill="#fff" rx="5"/>
    <text x="170" y="40" font-size="12" text-anchor="middle">Page* clock_algorithm() {</text>
    <text x="170" y="60" font-size="12" text-anchor="middle">    while (page->ref_bit) {</text>
    <text x="170" y="80" font-size="12" text-anchor="middle">        page->ref_bit = 0;</text>
    <text x="170" y="100" font-size="12" text-anchor="middle">    }</text>
    <text x="170" y="120" font-size="12" text-anchor="middle">    return page;</text>
</svg>
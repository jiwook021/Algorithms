<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- CPU Access -->
    <rect x="50" y="150" width="100" height="60" fill="#a3d8ff" rx="10"/>
    <text x="100" y="185" text-anchor="middle" font-size="14">CPU</text>
    <text x="100" y="220" text-anchor="middle" font-size="12" fill="#333">Access page 0x7F</text>
    
    <!-- Page Table -->
    <rect x="200" y="100" width="200" height="200" fill="#fff" stroke="#4CAF50" stroke-width="2"/>
    <path d="M200 140h200 M200 180h200 M200 220h200 M200 260h200" stroke="#4CAF50" stroke-width="1"/>
    <text x="300" y="120" text-anchor="middle" font-size="14" fill="#2E7D32">Page Table</text>
    <text x="220" y="160" font-size="12">0x7F: Not Present</text>
    <text x="220" y="200" font-size="12" fill="red">Page Fault Flagged</text>
    
    <!-- OS Handler -->
    <rect x="450" y="150" width="100" height="60" fill="#FFCCBC" rx="10"/>
    <text x="500" y="185" text-anchor="middle" font-size="14">OS</text>
    <text x="500" y="220" text-anchor="middle" font-size="12" fill="#333">Handler Invoked</text>
    
    <!-- Disk Access -->
    <rect x="250" y="300" width="100" height="60" fill="#FFCDD2" rx="10"/>
    <text x="300" y="335" text-anchor="middle" font-size="14">Disk</text>
    <text x="300" y="370" text-anchor="middle" font-size="12" fill="#333">Load Page 0x7F</text>
    
    <!-- Arrows -->
    <path d="M150 180 H200" stroke="#333" fill="none" stroke-width="2"/>
    <path d="M400 180 H450" stroke="#333" fill="none" stroke-width="2"/>
    <path d="M500 210 V290 H300" stroke="#333" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M300 300 V240 H450" stroke="#333" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Code Example -->
    <rect x="50" y="280" width="160" height="90" fill="#fff" stroke="#666" rx="5"/>
    <text x="60" y="300" font-size="12" font-family="monospace" fill="#333">void handle_page_fault() {</text>
    <text x="70" y="320" font-size="12" font-family="monospace" fill="#333">swap_in_page(0x7F);</text>
    <text x="70" y="340" font-size="12" font-family="monospace" fill="#333">update_page_table();</text>
    <text x="70" y="360" font-size="12" font-family="monospace" fill="#333">resume_process();</text>
    <text x="60" y="380" font-size="12" font-family="monospace" fill="#333">}</text>
    
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
        </marker>
    </defs>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Demand Paging with Page Table</text>
    
    <!-- Process Virtual Memory -->
    <rect x="50" y="60" width="200" height="280" fill="#cce5ff" stroke="#004085" rx="5"/>
    <text x="150" y="80" text-anchor="middle" fill="#002366">Virtual Address Space</text>
    
    <!-- Page Table -->
    <rect x="280" y="60" width="240" height="280" fill="#fff" stroke="#666" rx="5"/>
    <text x="400" y="80" text-anchor="middle" fill="#333">Page Table</text>
    
    <!-- Page Table Entries -->
    <rect x="300" y="100" width="200" height="40" fill="#d4edda" stroke="#155724" rx="3"/>
    <text x="310" y="125" fill="#155724">Page 0: Frame 3 (Valid)</text>
    
    <rect x="300" y="145" width="200" height="40" fill="#f8d7da" stroke="#721c24" rx="3"/>
    <text x="310" y="170" fill="#721c24">Page 1: Disk 0xFD3 (Invalid)</text>
    
    <rect x="300" y="190" width="200" height="40" fill="#d4edda" stroke="#155724" rx="3"/>
    <text x="310" y="215" fill="#155724">Page 2: Frame 7 (Valid)</text>
    
    <!-- Disk Storage -->
    <rect x="50" y="260" width="200" height="80" fill="#e2e3e5" stroke="#383d41" rx="5"/>
    <text x="150" y="300" text-anchor="middle" fill="#383d41">Disk Storage</text>
    
    <!-- Access Flow -->
    <path d="M 250 150 L 300 150" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="275" y="140" text-anchor="middle" fill="#666">Virtual Address</text>
    
    <path d="M 500 170 L 550 210 L 550 260 L 250 260" stroke="#dc3545" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="500" y="200" text-anchor="end" fill="#dc3545">Page Fault</text>
    
    <!-- Code Example -->
    <rect x="300" y="300" width="270" height="80" fill="#1e1e1e" rx="5"/>
    <text x="310" y="320" font-size="14" fill="#9cdcfe">// Page table entry structure</text>
    <text x="310" y="340" font-size="14" fill="#fff">
        <tspan x="310" dy="18">struct PageTableEntry {</tspan>
        <tspan x="330" dy="18">bool valid;</tspan>
        <tspan x="330" dy="18">union { uint32_t frame; uint32_t disk_addr; };</tspan>
        <tspan x="310" dy="18">};</tspan>
    </text>
    
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
        </marker>
    </defs>
</svg>
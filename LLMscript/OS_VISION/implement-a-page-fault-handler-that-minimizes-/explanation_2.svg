<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Demand Paging Diagram -->
    <rect x="50" y="50" width="240" height="300" fill="#fff" rx="5"/>
    <text x="170" y="80" font-size="16" text-anchor="middle">Demand Paging</text>
    
    <!-- Process Flow -->
    <circle cx="170" cy="120" r="20" fill="#b6d7a8"/>
    <text x="170" y="125" text-anchor="middle" fill="black" font-size="12">Page A</text>
    <path d="M170 140 V170 H140 V200" stroke="#666" fill="none"/>
    
    <circle cx="140" cy="200" r="20" fill="#ea9999"/>
    <text x="140" y="205" text-anchor="middle" fill="black" font-size="12">Page B</text>
    <path d="M140 220 V250 H170 V280" stroke="#666" fill="none"/>
    
    <circle cx="170" cy="280" r="20" fill="#b6d7a8"/>
    <text x="170" y="285" text-anchor="middle" fill="black" font-size="12">Page C</text>
    
    <!-- Memory Diagram -->
    <rect x="350" y="50" width="200" height="300" fill="#fff" rx="5"/>
    <text x="450" y="80" font-size="16" text-anchor="middle">Physical Memory</text>
    
    <!-- Memory Pages -->
    <rect x="370" y="120" width="160" height="40" fill="#d5a6bd"/>
    <text x="450" y="140" text-anchor="middle" font-size="12">Loaded Pages</text>
    <rect x="370" y="180" width="160" height="40" fill="#cfe2f3"/>
    <text x="450" y="200" text-anchor="middle" font-size="12">Free Frames</text>
    
    <!-- Legend -->
    <rect x="50" y="330" width="20" height="20" fill="#b6d7a8"/>
    <text x="80" y="345" font-size="12">Accessed Pages</text>
    <rect x="200" y="330" width="20" height="20" fill="#ea9999"/>
    <text x="230" y="345" font-size="12">Page Faults</text>
</svg>
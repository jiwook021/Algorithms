<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="20">5. Fast Path Optimization</text>
    
    <!-- Flowchart -->
    <rect x="100" y="80" width="400" height="240" fill="none" stroke="#666"/>
    
    <!-- Decision Diamond -->
    <path d="M300 120l-60 60 60 60 60-60z" fill="#3498db"/>
    <text x="300" y="160" text-anchor="middle" fill="white">Simple Case?</text>
    
    <!-- Fast Path -->
    <path d="M300 180v60 M300 240h-100" stroke="#2ecc71" stroke-width="2"/>
    <rect x="180" y="240" width="80" height="40" fill="#a0d468" rx="5"/>
    <text x="220" y="265" text-anchor="middle">User Space</text>
    <text x="220" y="280" text-anchor="middle">Handling</text>
    
    <!-- Slow Path -->
    <path d="M300 180v60 M300 240h100" stroke="#e74c3c" stroke-width="2"/>
    <rect x="340" y="240" width="80" height="40" fill="#ffd1dc" rx="5"/>
    <text x="380" y="265" text-anchor="middle">Kernel</text>
    <text x="380" y="280" text-anchor="middle">Transition</text>
    
    <!-- Code Example -->
    <g transform="translate(100 320)">
        <text x="0" y="0" font-family="monospace" font-size="12">
            <tspan x="0" dy="1.2em">if (is_simple_case(args)) {</tspan>
            <tspan x="10" dy="1.2em">  handle_locally(); // Fast path</tspan>
            <tspan x="0" dy="1.2em">} else {</tspan>
            <tspan x="10" dy="1.2em">  syscall(SYS_HANDLE, args);</tspan>
            <tspan x="0" dy="1.2em">}</tspan>
        </text>
    </g>
</svg>
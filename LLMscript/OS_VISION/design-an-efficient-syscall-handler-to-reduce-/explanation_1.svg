<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="20">1. Syscall Batching</text>
    
    <!-- User Space -->
    <rect x="50" y="80" width="200" height="240" fill="#c3d9ff" rx="5"/>
    <text x="150" y="110" text-anchor="middle">User Space</text>
    
    <!-- Kernel Space -->
    <rect x="350" y="80" width="200" height="240" fill="#ffd1dc" rx="5"/>
    <text x="450" y="110" text-anchor="middle">Kernel Space</text>
    
    <!-- Before Batching -->
    <path d="M150 150v-20 M150 130h200 M350 130v20" stroke="#666" fill="none"/>
    <path d="M150 190v-20 M150 170h200 M350 170v20" stroke="#666" fill="none"/>
    <path d="M150 230v-20 M150 210h200 M350 210v20" stroke="#666" fill="none"/>
    <text x="300" y="260" text-anchor="middle" fill="#666">3 transitions</text>
    
    <!-- After Batching -->
    <path d="M150 300v-20 M150 280h200 M350 280v20" stroke="#2ecc71" stroke-width="2"/>
    <path d="M240 290l10-5-10-5z" fill="#2ecc71"/>
    <text x="300" y="340" text-anchor="middle" fill="#2ecc71">1 batched transition</text>
    
    <!-- Code Example -->
    <g transform="translate(100 360)">
        <text x="0" y="0" font-family="monospace" font-size="12">
            <tspan x="0" dy="1.2em">struct SyscallBatch {</tspan>
            <tspan x="10" dy="1.2em">  int type;</tspan>
            <tspan x="10" dy="1.2em">  void* args[8];</tspan>
            <tspan x="0" dy="1.2em">};</tspan>
        </text>
    </g>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" font-family="monospace">Shared Memory Region</text>
    
    <!-- User Space -->
    <rect x="50" y="100" width="200" height="180" fill="#c7e9c0"/>
    <text x="150" y="120" text-anchor="middle" font-family="monospace">User Space</text>
    <rect x="70" y="150" width="160" height="40" fill="#9ecae1"/>
    <text x="150" y="170" text-anchor="middle" font-family="monospace">Syscall Buffer</text>
    
    <!-- Kernel Space -->
    <rect x="350" y="100" width="200" height="180" fill="#fc9272"/>
    <text x="450" y="120" text-anchor="middle" font-family="monospace">Kernel Space</text>
    <rect x="370" y="150" width="160" height="40" fill="#9ecae1"/>
    <text x="450" y="170" text-anchor="middle" font-family="monospace">Syscall Buffer</text>
    
    <!-- Shared Memory -->
    <rect x="250" y="220" width="100" height="40" fill="#d4b9da"/>
    <text x="300" y="240" text-anchor="middle" font-family="monospace">mmap()</text>
    <path d="M300 220 v-40 M295 180 l10 10 l10 -10" stroke="#756bb1" stroke-width="2"/>
    
    <!-- Code Example -->
    <rect x="50" y="300" width="500" height="80" fill="#2d2d2d"/>
    <text x="60" y="320" fill="white" font-family="monospace" font-size="12">// C++ shared memory setup</text>
    <text x="60" y="340" fill="white" font-family="monospace" font-size="12">auto buffer = mmap(nullptr, BUFFER_SIZE,</text>
    <text x="60" y="360" fill="white" font-family="monospace" font-size="12">    PROT_READ|PROT_WRITE, MAP_SHARED,</text>
    <text x="60" y="380" fill="white" font-family="monospace" font-size="12">    fd, 0);</text>
</svg>
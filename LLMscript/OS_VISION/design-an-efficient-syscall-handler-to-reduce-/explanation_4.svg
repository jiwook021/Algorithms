<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="20">4. Syscall Aggregation</text>
    
    <!-- Traditional Calls -->
    <g transform="translate(50 80)">
        <rect width="200" height="100" fill="#ffd1dc" rx="5"/>
        <text x="100" y="30" text-anchor="middle">Multiple write()</text>
        <path d="M100 50v50 M100 50h200 M300 50v50" stroke="#666" stroke-width="2"/>
        <text x="300" y="70" text-anchor="middle">Data</text>
        <text x="100" y="160" text-anchor="middle" fill="#666">3 context switches</text>
    </g>
    
    <!-- Vectorized Call -->
    <g transform="translate(350 80)">
        <rect width="200" height="100" fill="#a0d468" rx="5"/>
        <text x="100" y="30" text-anchor="middle">writev()</text>
        <path d="M100 50h200" stroke="#2ecc71" stroke-width="2"/>
        <path d="M100 50l-10-5h20z" fill="#2ecc71"/>
        <text x="200" y="70" text-anchor="middle">iovec[3]</text>
        <text x="100" y="160" text-anchor="middle" fill="#2ecc71">1 context switch</text>
    </g>
    
    <!-- Code Example -->
    <g transform="translate(100 240)">
        <text x="0" y="0" font-family="monospace" font-size="12">
            <tspan x="0" dy="1.2em">struct iovec {</tspan>
            <tspan x="10" dy="1.2em">  void* base;</tspan>
            <tspan x="10" dy="1.2em">  size_t len;</tspan>
            <tspan x="0" dy="1.2em">};</tspan>
            <tspan x="0" dy="1.2em">writev(fd, iovec_array, 3);</tspan>
        </text>
    </g>
</svg>
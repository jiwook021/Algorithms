<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" font-size="20" text-anchor="middle">Seek Time Calculation</text>
  
  <!-- Track line -->
  <path d="M50 200 L550 200" stroke="black" stroke-width="2"/>
  
  <!-- Seek segments -->
  <path d="M100 200 L150 200" stroke="#ff6600" stroke-width="4"/>
  <path d="M150 200 L250 200" stroke="#009933" stroke-width="4"/>
  <path d="M250 200 L400 200" stroke="#3366ff" stroke-width="4"/>
  <path d="M400 200 L550 200" stroke="#cc0000" stroke-width="4"/>
  <path d="M50 200 L100 200" stroke="#9900cc" stroke-width="4"/>
  
  <!-- Values -->
  <text x="125" y="180" font-size="14">50</text>
  <text x="200" y="180" font-size="14">50</text>
  <text x="325" y="180" font-size="14">30</text>
  <text x="475" y="180" font-size="14">19</text>
  <text x="75" y="180" font-size="14">20</text>
  
  <!-- Formula -->
  <text x="300" y="280" font-size="16" text-anchor="middle">Total seek = 50 + 50 + 30 + 19 + 199 + 20 = 368</text>
  
  <!-- Legend -->
  <rect x="50" y="310" width="200" height="60" fill="white" stroke="black"/>
  <text x="60" y="330" font-size="12"><tspan fill="#ff6600">50-100</tspan>, <tspan fill="#009933">100-150</tspan>,</text>
  <text x="60" y="350" font-size="12"><tspan fill="#3366ff">150-180</tspan>, <tspan fill="#cc0000">180-199</tspan>,</text>
  <text x="60" y="370" font-size="12"><tspan fill="#9900cc">0-20</tspan> (wrap)</text>
</svg>
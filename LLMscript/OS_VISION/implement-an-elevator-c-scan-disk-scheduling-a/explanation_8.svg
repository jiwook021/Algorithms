<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333">C++ C-SCAN Implementation</text>
  
  <!-- Code block -->
  <rect x="50" y="60" width="500" height="300" fill="#fff" rx="5" stroke="#ddd"/>
  
  <!-- Code content -->
  <text x="70" y="90" font-family="monospace" font-size="14" fill="#3498db">void cscan(vector&lt;int&gt;&amp; requests, int head) {</text>
  <text x="85" y="115" font-family="monospace" font-size="14" fill="#2ecc71">    // Sort requests</text>
  <text x="85" y="140" font-family="monospace" font-size="14" fill="#333">    sort(requests.begin(), requests.end());</text>
  <text x="85" y="165" font-family="monospace" font-size="14" fill="#2ecc71">    // Split into left/right of head</text>
  <text x="85" y="190" font-family="monospace" font-size="14" fill="#333">    auto right = partition(requests.begin(), requests.end(),</text>
  <text x="85" y="215" font-family="monospace" font-size="14" fill="#333">        [head](int x){ return x > head; });</text>
  <text x="85" y="240" font-family="monospace" font-size="14" fill="#2ecc71">    // Service right then wrap to left</text>
  <text x="85" y="265" font-family="monospace" font-size="14" fill="#333">    for(auto it = requests.begin(); it != right; ++it)</text>
  <text x="85" y="290" font-family="monospace" font-size="14" fill="#333">        service(*it);</text>
  <text x="85" y="315" font-family="monospace" font-size="14" fill="#333">    for(auto it = right; it != requests.end(); ++it)</text>
  <text x="85" y="340" font-family="monospace" font-size="14" fill="#333">        service(*it);</text>
  <text x="70" y="365" font-family="monospace" font-size="14" fill="#3498db">}</text>
</svg>
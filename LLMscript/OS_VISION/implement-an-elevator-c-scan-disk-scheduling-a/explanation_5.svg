<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" font-size="20" text-anchor="middle">C++ Implementation Structure</text>
  
  <!-- Code block -->
  <rect x="50" y="60" width="500" height="300" fill="#1e1e1e" rx="5"/>
  
  <!-- Code content -->
  <text x="70" y="90" font-size="14" font-family="monospace" fill="#569cd6">int</text>
  <text x="110" y="90" font-size="14" font-family="monospace" fill="white">cscan(</text>
  <text x="170" y="90" font-size="14" font-family="monospace" fill="#9cdcfe">vector</text>
  <text x="220" y="90" font-size="14" font-family="monospace" fill="white">&lt;int&gt;&amp; requests) {</text>
  
  <text x="70" y="120" font-size="14" font-family="monospace" fill="#d4d4d4">  sort(requests.begin(), requests.end());</text>
  
  <text x="70" y="150" font-size="14" font-family="monospace" fill="#d4d4d4">  auto it = upper_bound(requests.begin(),</text>
  <text x="70" y="170" font-size="14" font-family="monospace" fill="#d4d4d4">              requests.end(), head);</text>
  
  <text x="70" y="200" font-size="14" font-family="monospace" fill="#d4d4d4">  // Service upper tracks</text>
  <text x="70" y="230" font-size="14" font-family="monospace" fill="#d4d4d4">  for (auto i = it; i != requests.end(); ++i)</text>
  <text x="70" y="250" font-size="14" font-family="monospace" fill="#d4d4d4">    total_seek += abs(*i - head_position);</text>
  
  <text x="70" y="280" font-size="14" font-family="monospace" fill="#d4d4d4">  // Wrap around and service lower tracks</text>
  <text x="70" y="310" font-size="14" font-family="monospace" fill="#d4d4d4">  total_seek += (MAX_TRACK - head_position);</text>
  <text x="70" y="340" font-size="14" font-family="monospace" fill="#d4d4d4">  total_seek += MAX_TRACK;  // Return seek</text>
  
  <text x="70" y="370" font-size="14" font-family="monospace" fill="#d4d4d4">  return total_seek;</text>
  <text x="70" y="390" font-size="14" font-family="monospace" fill="white">}</text>
</svg>
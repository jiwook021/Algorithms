<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <path d="M50 200 L550 200" stroke="black" stroke-width="2"/>
  <text x="300" y="30" font-size="20" text-anchor="middle">C-SCAN Concept Overview</text>
  
  <!-- Disk tracks -->
  <circle cx="50" cy="200" r="3" fill="red"/>
  <circle cx="550" cy="200" r="3" fill="red"/>
  <text x="45" y="220" font-size="12">0</text>
  <text x="545" y="220" font-size="12">199</text>
  
  <!-- Requests -->
  <circle cx="150" cy="200" r="5" fill="blue"/>
  <circle cx="250" cy="200" r="5" fill="blue"/>
  <circle cx="400" cy="200" r="5" fill="blue"/>
  <circle cx="500" cy="200" r="5" fill="blue"/>
  
  <!-- Head movement -->
  <path d="M100 200 L550 200" stroke="green" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M550 200 L50 200" stroke="red" stroke-width="3" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  
  <!-- Legend -->
  <rect x="400" y="280" width="180" height="90" fill="white" stroke="black"/>
  <path d="M410 300 L440 300" stroke="green" stroke-width="3"/>
  <text x="450" y="305" font-size="14">Forward service</text>
  <path d="M410 330 L440 330" stroke="red" stroke-width="3" stroke-dasharray="4 4"/>
  <text x="450" y="335" font-size="14">Return (no service)</text>
  <circle cx="415" cy="355" r="5" fill="blue"/>
  <text x="450" y="360" font-size="14">Disk requests</text>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
</svg>
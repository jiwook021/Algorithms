<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
    <style>
        .code { font-family: monospace; font-size: 14px; }
        .comment { fill: #388E3C; }
        .highlight { fill: #D32F2F; }
        .box { fill: #FFFBE6; stroke: #FFECB3; }
    </style>
    
    <!-- Code background -->
    <rect x="20" y="20" width="560" height="360" rx="5" class="box" stroke-width="2"/>
    
    <!-- Code sample -->
    <text x="40" y="60" class="code">void cscan(vector&lt;int&gt;&amp; requests, int head) {</text>
    <text x="60" y="90" class="code">vector&lt;int&gt; left, right;</text>
    <text x="60" y="120" class="code">right.push_back(199); // Always go to end</text>
    <text x="60" y="150" class="code">sort(right.begin(), right.end());</text>
    <text x="60" y="180" class="code">sort(left.begin(), left.end());</text>
    <text x="60" y="210" class="code" fill="#D32F2F">// Move right servicing requests</text>
    <text x="60" y="240" class="code">for (int r : right) seek(r);</text>
    <text x="60" y="270" class="code" fill="#D32F2F">// Jump to start and service left</text>
    <text x="60" y="300" class="code">for (int l : left) seek(l);</text>
    <text x="40" y="330" class="code">}</text>
    
    <!-- Visual explanation -->
    <rect x="350" y="100" width="200" height="80" fill="#E3F2FD" stroke="#2196F3"/>
    <text x="360" y="120" class="code">Right group (sorted):</text>
    <text x="360" y="140">150, 180, 199</text>
    <rect x="350" y="160" width="200" height="80" fill="#FBE9E7" stroke="#FF5722"/>
    <text x="360" y="180" class="code">Left group (sorted):</text>
    <text x="360" y="200">30, 50, 80</text>
    <path d="M 270 130 L 340 130" stroke="#2196F3" stroke-width="2"/>
    <path d="M 270 190 L 340 190" stroke="#FF5722" stroke-width="2"/>
</svg>
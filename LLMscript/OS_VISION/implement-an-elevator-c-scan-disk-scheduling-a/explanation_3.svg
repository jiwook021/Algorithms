<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" font-size="20" text-anchor="middle">Request Servicing Order</text>
  
  <!-- Initial requests -->
  <text x="50" y="80" font-size="16">Input sequence: 100, 50, 150, 20, 180</text>
  
  <!-- Processing steps -->
  <circle cx="100" cy="150" r="30" fill="none" stroke="black"/>
  <text x="100" y="155" font-size="14" text-anchor="middle">50</text>
  <text x="100" y="190" font-size="12">Current head</text>
  
  <!-- Service order -->
  <g transform="translate(0 220)">
    <path d="M50 50 L550 50" stroke="black" stroke-width="2"/>
    <circle cx="150" cy="50" r="5" fill="blue"/>
    <circle cx="250" cy="50" r="5" fill="blue"/>
    <circle cx="400" cy="50" r="5" fill="blue"/>
    <circle cx="100" cy="50" r="5" fill="red"/>
    <circle cx="50" cy="50" r="5" fill="blue"/>
    
    <text x="150" y="30" font-size="12">100</text>
    <text x="250" y="30" font-size="12">150</text>
    <text x="400" y="30" font-size="12">180</text>
    <text x="100" y="30" font-size="12">50</text>
    <text x="50" y="30" font-size="12">20</text>
    
    <text x="300" y="80" font-size="14">Service order: 100 → 150 → 180 → 20 → 50</text>
  </g>
  
  <!-- Arrows -->
  <path d="M130 150 L200 150" stroke="green" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M200 150 L270 150" stroke="green" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M400 150 L470 150" stroke="red" stroke-width="2" marker-end="url(#arrow)"/>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
</svg>
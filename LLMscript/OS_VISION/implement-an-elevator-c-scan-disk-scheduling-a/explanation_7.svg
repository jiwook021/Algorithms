<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333">C-SCAN vs SCAN Comparison</text>
  
  <!-- SCAN -->
  <path d="M100 100 L300 100 L400 100" stroke="#e74c3c" stroke-width="2"/>
  <path d="M300 100 L300 150 L100 150" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="100" y="80" fill="#333">SCAN (Elevator)</text>
  
  <!-- C-SCAN -->
  <path d="M100 250 L400 250" stroke="#2ecc71" stroke-width="2"/>
  <path d="M400 250 L400 300 L100 300 L100 250" stroke="#2ecc71" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="100" y="230" fill="#333">C-SCAN (Circular)</text>
  
  <!-- Labels -->
  <text x="200" y="120" fill="#e74c3c">Services in both directions</text>
  <text x="200" y="270" fill="#2ecc71">Services in one direction only</text>
  <path d="M500 100 L500 300" stroke="#666" stroke-width="1"/>
  <text x="520" y="120" fill="#666">Track boundaries</text>
</svg>
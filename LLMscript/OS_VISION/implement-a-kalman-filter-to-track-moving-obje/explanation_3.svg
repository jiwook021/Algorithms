<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
  
  <!-- Covariance Matrices -->
  <ellipse cx="150" cy="200" rx="60" ry="30" fill="none" stroke="#e67e22" stroke-width="2" transform="rotate(45 150 200)"/>
  <text x="150" y="250" font-family="Arial" font-size="12" text-anchor="middle">Initial Uncertainty</text>
  
  <ellipse cx="300" cy="200" rx="90" ry="50" fill="none" stroke="#c0392b" stroke-width="2" transform="rotate(30 300 200)"/>
  <text x="300" y="250" font-family="Arial" font-size="12" text-anchor="middle">After Prediction</text>
  
  <ellipse cx="450" cy="200" rx="40" ry="20" fill="none" stroke="#27ae60" stroke-width="2" transform="rotate(-15 450 200)"/>
  <text x="450" y="250" font-family="Arial" font-size="12" text-anchor="middle">After Update</text>
  
  <!-- Arrows -->
  <path d="M210 200 L270 200" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M390 200 L420 200" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#34495e"/>
    </marker>
  </defs>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
  
  <!-- Sensor Fusion -->
  <circle cx="150" cy="200" r="40" fill="#e74c3c" opacity="0.2"/>
  <path d="M150 160 L170 200 150 240 130 200 Z" fill="#e74c3c"/>
  <text x="150" y="280" font-family="Arial" font-size="14" text-anchor="middle">Camera</text>
  
  <circle cx="450" cy="200" r="40" fill="#2980b9" opacity="0.2"/>
  <path d="M450 160 L470 200 450 240 430 200 Z" fill="#2980b9"/>
  <text x="450" y="280" font-family="Arial" font-size="14" text-anchor="middle">Lidar</text>
  
  <!-- Kalman Filter -->
  <rect x="250" y="150" width="100" height="60" fill="#2ecc71" rx="5"/>
  <text x="300" y="185" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Kalman</text>
  <text x="300" y="205" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Filter</text>
  
  <!-- Data Flow -->
  <path d="M190 200 L250 200" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M410 200 L350 200" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M350 210 L450 210" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#34495e"/>
    </marker>
  </defs>
</svg>
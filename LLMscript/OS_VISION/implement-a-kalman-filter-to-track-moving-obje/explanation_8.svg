<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Equations -->
    <text x="300" y="60" text-anchor="middle" font-size="20">Kalman Filter Equations</text>
    
    <!-- Prediction Equations -->
    <rect x="50" y="100" width="500" height="90" fill="#fff" rx="5"/>
    <text x="60" y="130" font-size="16" fill="#e74c3c">Prediction:</text>
    <text x="80" y="160" font-family="monospace" font-size="14">
        x̂ₖ⁻ = F x̂ₖ₋₁
        <tspan x="80" y="180">Pₖ⁻ = F Pₖ₋₁ Fᵀ + Q</tspan>
    </text>
    
    <!-- Update Equations -->
    <rect x="50" y="220" width="500" height="140" fill="#fff" rx="5"/>
    <text x="60" y="250" font-size="16" fill="#3498db">Update:</text>
    <text x="80" y="280" font-family="monospace" font-size="14">
        y = z - H x̂ₖ⁻
        <tspan x="80" y="300">S = H Pₖ⁻ Hᵀ + R</tspan>
        <tspan x="80" y="320">K = Pₖ⁻ Hᵀ S⁻¹</tspan>
        <tspan x="80" y="340">x̂ₖ = x̂ₖ⁻ + K y</tspan>
        <tspan x="80" y="360">Pₖ = (I - K H) Pₖ⁻</tspan>
    </text>
    
    <!-- Code Connection -->
    <rect x="100" y="380" width="400" height="50" fill="#2c3e50" rx="5"/>
    <text x="110" y="405" fill="#fff" font-family="monospace" font-size="12">
        struct State { MatrixXd x, P; };
        State kf_step(State prev, MatrixXd z) { ... }
    </text>
</svg>
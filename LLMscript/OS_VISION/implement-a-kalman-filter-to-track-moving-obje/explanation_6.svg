<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Prediction-Correction Cycle -->
    <circle cx="300" cy="200" r="150" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M300 50 V200 A150 150 0 0 0 450 200" stroke="#e74c3c" stroke-width="4" fill="none"/>
    <path d="M300 350 V200 A150 150 0 0 1 150 200" stroke="#3498db" stroke-width="4" fill="none"/>
    
    <text x="300" y="80" text-anchor="middle" font-size="18" fill="#e74c3c">Prediction Step</text>
    <text x="300" y="320" text-anchor="middle" font-size="18" fill="#3498db">Update Step</text>
    
    <!-- Code Example -->
    <rect x="50" y="50" width="240" height="140" rx="5" fill="#fff" stroke="#333"/>
    <text x="60" y="75" font-family="monospace" font-size="12">
        <tspan fill="#e74c3c">// Prediction</tspan>
        <tspan x="60" y="95">x = F * x;</tspan>
        <tspan x="60" y="115">P = F * P * F' + Q;</tspan>
    </text>
    
    <rect x="310" y="250" width="240" height="140" rx="5" fill="#fff" stroke="#333"/>
    <text x="320" y="275" font-family="monospace" font-size="12">
        <tspan fill="#3498db">// Update</tspan>
        <tspan x="320" y="295">Matrix K = P * H' * </tspan>
        <tspan x="320" y="315">(H * P * H' + R).inverse();</tspan>
        <tspan x="320" y="335">x += K * (z - H * x);</tspan>
    </text>
</svg>
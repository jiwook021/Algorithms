<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
  
  <!-- C++ Code Example -->
  <text x="30" y="50" font-family="monospace" font-size="14" fill="#2c3e50">
    <tspan fill="#3498db">void</tspan> predict(<tspan fill="#2980b9">Eigen::VectorXd</tspan> &amp;x, 
    <tspan x="30" dy="24"><tspan fill="#2980b9">Eigen::MatrixXd</tspan> &amp;P) {</tspan>
    <tspan x="30" dy="24" fill="#8e44ad">    F</tspan> = state_transition_matrix();
    <tspan x="30" dy="24" fill="#8e44ad">    Q</tspan> = process_noise_covariance();
    <tspan x="30" dy="24">    x = <tspan fill="#8e44ad">F</tspan> * x;</tspan>
    <tspan x="30" dy="24">    P = <tspan fill="#8e44ad">F</tspan> * P * <tspan fill="#8e44ad">F</tspan>.transpose() + <tspan fill="#8e44ad">Q</tspan>;</tspan>
    <tspan x="30" dy="24">}</tspan>
  </text>
  
  <!-- Matrix Labels -->
  <rect x="400" y="100" width="80" height="40" fill="#2980b9" opacity="0.2"/>
  <text x="440" y="125" font-family="Arial" font-size="12" fill="#2980b9" text-anchor="middle">F</text>
  
  <rect x="400" y="160" width="80" height="40" fill="#27ae60" opacity="0.2"/>
  <text x="440" y="185" font-family="Arial" font-size="12" fill="#27ae60" text-anchor="middle">Q</text>
</svg>
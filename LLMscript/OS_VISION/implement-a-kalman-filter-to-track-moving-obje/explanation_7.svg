<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Axes -->
    <path d="M50 350 L550 350 M50 350 L50 50" stroke="#333" stroke-width="2"/>
    <text x="550" y="340" text-anchor="end">Time</text>
    <text x="30" y="40">Position</text>
    
    <!-- True Path -->
    <path d="M50 300 L150 250 L250 200 L350 150 L450 100 L550 50" stroke="#2ecc71" stroke-width="2" fill="none"/>
    
    <!-- Measurements -->
    <g transform="translate(50,350)">
        <circle cx="0" cy="-50" r="3" fill="#e74c3c"/>
        <circle cx="100" cy="-100" r="3" fill="#e74c3c"/>
        <circle cx="200" cy="-150" r="3" fill="#e74c3c"/>
        <circle cx="300" cy="-200" r="3" fill="#e74c3c"/>
        <circle cx="400" cy="-250" r="3" fill="#e74c3c"/>
        <circle cx="500" cy="-300" r="3" fill="#e74c3c"/>
    </g>
    
    <!-- Kalman Estimate -->
    <path d="M50 290 L150 240 L250 190 L350 140 L450 90 L550 40" stroke="#2980b9" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
    
    <!-- Legend -->
    <rect x="400" y="70" width="170" height="90" fill="#fff" rx="5"/>
    <text x="410" y="95" fill="#2ecc71">True Position</text>
    <text x="410" y="120" fill="#e74c3c">Noisy Measurements</text>
    <text x="410" y="145" fill="#2980b9">Kalman Estimate</text>
    <line x1="405" y1="90" x2="445" y2="90" stroke="#2ecc71"/>
    <line x1="405" y1="115" x2="445" y2="115" stroke="#e74c3c"/>
    <line x1="405" y1="140" x2="445" y2="140" stroke="#2980b9" stroke-dasharray="4 4"/>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Measurement vs Estimation -->
    <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Coordinate System -->
    <path d="M 50 350 L 550 350 M 50 350 L 50 50" stroke="#333" stroke-width="2"/>
    <text x="570" y="345" font-size="14">Time</text>
    <text x="30" y="40" font-size="14">Position</text>

    <!-- Noisy Measurements -->
    <path d="M 50 350 Q 150 280, 250 320 Q 350 360, 450 300 Q 550 240, 550 200" 
          stroke="#dc3545" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
    <circle cx="150" cy="280" r="4" fill="#dc3545"/>
    <circle cx="250" cy="320" r="4" fill="#dc3545"/>
    <circle cx="350" cy="360" r="4" fill="#dc3545"/>
    <circle cx="450" cy="300" r="4" fill="#dc3545"/>
    <text x="100" y="100" fill="#dc3545">Noisy Measurements</text>

    <!-- Kalman Estimation -->
    <path d="M 50 330 C 150 300, 250 310, 350 320 C 450 330, 550 310, 550 300" 
          stroke="#007bff" stroke-width="3" fill="none"/>
    <text x="100" y="150" fill="#007bff">Kalman Estimate</text>

    <!-- Uncertainty Bands -->
    <path d="M 50 330 C 150 300, 250 310, 350 320 C 450 330, 550 310, 550 300" 
          stroke="#007bff" stroke-width="1" opacity="0.3" fill="none"
          transform="translate(0 10)"/>
    <path d="M 50 330 C 150 300, 250 310, 350 320 C 450 330, 550 310, 550 300" 
          stroke="#007bff" stroke-width="1" opacity="0.3" fill="none"
          transform="translate(0 -10)"/>

    <!-- C++ Code Example -->
    <g transform="translate(300 50)">
        <rect x="0" y="0" width="250" height="90" fill="#e3f2fd" rx="5"/>
        <text x="125" y="20" text-anchor="middle" font-family="monospace">Update Step</text>
        <text x="10" y="40" font-family="monospace" font-size="12">
            <tspan x="10" dy="1.2em">MatrixXd H = ...; // Measurement matrix</tspan>
            <tspan x="10" dy="1.2em">MatrixXd R = ...; // Sensor noise</tspan>
            <tspan x="10" dy="1.2em">MatrixXd K = P * H.transpose() * </tspan>
            <tspan x="10" dy="1.2em">(H * P * H.transpose() + R).inverse();</tspan>
        </text>
    </g>
</svg>
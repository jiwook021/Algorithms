<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <style>
    .code { font-family: monospace; font-size: 14px; }
    .page { stroke: #000; stroke-width: 1 }
    .shared { fill: #fff3d0; }
    .copied { fill: #ffcccc; }
  </style>

  <!-- Before Write -->
  <rect x="20" y="50" width="560" height="150" fill="#f0f0f0"/>
  <text x="30" y="40" font-weight="bold">Before Write Operation</text>
  <rect x="50" y="70" width="100" height="100" class="page shared"/>
  <text x="60" y="110">Shared Page</text>
  <rect x="200" y="70" width="100" height="100" class="page shared"/>
  <text x="210" y="110">Shared Page</text>
  <text x="350" y="90">Parent Process</text>
  <text x="350" y="140">Child Process</text>
  <path d="M340 100h-180 M340 150h-180" stroke="#666" stroke-dasharray="4"/>

  <!-- After Write -->
  <rect x="20" y="220" width="560" height="150" fill="#f0f0f0"/>
  <text x="30" y="210" font-weight="bold">After Write Operation</text>
  <rect x="50" y="240" width="100" height="100" class="page copied"/>
  <text x="60" y="280">Original Page</text>
  <rect x="200" y="240" width="100" height="100" class="page copied"/>
  <text x="210" y="280">Copied Page</text>
  <path d="M160 290h30" stroke="#c00"/>
  <text x="240" y="290" fill="#c00">Page Fault</text>
  <text x="240" y="310" fill="#c00">Triggers Copy</text>

  <!-- Code Example -->
  <rect x="50" y="350" width="500" height="40" fill="#e8e8e8"/>
  <text x="60" y="375" class="code">// Child process writes to shared page:</text>
  <text x="60" y="395" class="code">*data_ptr = 42; // COW handler invokes</text>
</svg>
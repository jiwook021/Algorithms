<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <style>
    .code { font-family: monospace; font-size: 14px; }
    .parent { fill: #4a86e8; }
    .child { fill: #6aa84f; }
    .shared { fill: #fff3d0; }
    .copied { fill: #ffcccc; }
  </style>
  
  <!-- Traditional Fork -->
  <rect x="20" y="80" width="260" height="240" fill="#f0f0f0"/>
  <text x="40" y="60" font-weight="bold">Traditional Fork</text>
  <rect x="40" y="100" width="220" height="60" class="parent"/>
  <text x="50" y="135" class="code">Parent Process</text>
  <rect x="40" y="180" width="220" height="60" class="child"/>
  <text x="50" y="215" class="code">Child Process</text>
  <path d="M150 170v-30 M150 170l-10-10 M150 170l10-10" stroke="black"/>
  <text x="120" y="260" class="code">Full memory copy</text>

  <!-- COW Fork -->
  <rect x="320" y="80" width="260" height="240" fill="#f0f0f0"/>
  <text x="340" y="60" font-weight="bold">COW Fork</text>
  <rect x="340" y="100" width="220" height="60" class="parent"/>
  <text x="350" y="135" class="code">Parent Process</text>
  <rect x="340" y="180" width="220" height="60" class="shared"/>
  <text x="350" y="215" class="code">Child Process</text>
  <path d="M450 170v-30 M450 170l-10-10 M450 170l10-10" stroke="black"/>
  <text x="380" y="260">Shared pages</text>
  <text x="380" y="280">(marked read-only)</text>
  
  <!-- Code Example -->
  <rect x="40" y="320" width="520" height="60" fill="#e8e8e8"/>
  <text x="50" y="340" class="code">pid_t pid = fork(); // Both processes share</text>
  <text x="50" y="360" class="code">physical pages until write occurs</text>
</svg>
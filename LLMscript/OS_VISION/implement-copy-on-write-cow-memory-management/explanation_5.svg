<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="18">5. Memory Savings Comparison</text>
    
    <!-- Traditional Fork -->
    <rect x="50" y="100" width="200" height="200" fill="#e0e0ff"/>
    <text x="150" y="120" text-anchor="middle">Traditional Fork</text>
    <rect x="70" y="150" width="160" height="30" fill="#aaa"/>
    <rect x="70" y="190" width="160" height="30" fill="#aaa"/>
    <text x="150" y="170" fill="white">Copied Page</text>
    <text x="150" y="210" fill="white">Copied Page</text>
    
    <!-- COW Fork -->
    <rect x="350" y="100" width="200" height="200" fill="#e0ffe0"/>
    <text x="450" y="120" text-anchor="middle">COW Fork</text>
    <rect x="370" y="150" width="160" height="30" fill="#aaccff"/>
    <rect x="370" y="190" width="160" height="30" fill="#aaccff"/>
    <text x="450" y="170">Shared Page</text>
    <text x="450" y="210">Shared Page</text>
    
    <!-- Comparison Text -->
    <text x="150" y="330" text-anchor="middle">2× Memory Usage</text>
    <text x="450" y="330" text-anchor="middle">1× Memory Usage</text>
    <path d="M300 280 L300 350" stroke="#666"/>
</svg>
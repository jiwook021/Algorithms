<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Write Operation Trigger -->
    <rect x="50" y="50" width="500" height="300" fill="#fff3e0" stroke="#EF6C00"/>
    
    <!-- Child Process Writing -->
    <rect x="100" y="80" width="400" height="60" fill="#ffccbc"/>
    <text x="300" y="115" text-anchor="middle" font-family="monospace">Child Process Writes to Page 1</text>
    
    <!-- Page Fault Sequence -->
    <path d="M120 150 L120 250 L480 250 L480 150" fill="#fff" stroke="#5D4037"/>
    <text x="300" y="170" text-anchor="middle" font-family="monospace">1. Page Fault Occurs</text>
    <text x="300" y="210" text-anchor="middle" font-family="monospace">2. OS Copies Physical Page</text>
    <text x="300" y="250" text-anchor="middle" font-family="monospace">3. Update Page Table Entry</text>
    
    <!-- Memory Before/After -->
    <rect x="80" y="280" width="180" height="80" fill="#c8e6c9"/>
    <text x="170" y="300" text-anchor="middle" font-family="monospace">Original Page</text>
    <rect x="340" y="280" width="180" height="80" fill="#ffab91"/>
    <text x="430" y="300" text-anchor="middle" font-family="monospace">New Copy</text>
    
    <!-- Code Example -->
    <rect x="50" y="320" width="500" height="60" fill="#212121"/>
    <text x="60" y="340" font-family="monospace" fill="#fff">// Child process code</text>
    <text x="60" y="360" font-family="monospace" fill="#64ffda">int* ptr = (int*)0x2000;</text>
    <text x="60" y="380" font-family="monospace" fill="#64ffda">*ptr = 42;  // Triggers COW</text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="18">2. Fork Creates COW Mapping</text>
    
    <!-- Parent -->
    <rect x="50" y="100" width="200" height="200" fill="#e0e0ff" stroke="#000"/>
    <text x="150" y="150" text-anchor="middle">Parent</text>
    
    <!-- Child -->
    <rect x="350" y="100" width="200" height="200" fill="#e0ffe0" stroke="#000"/>
    <text x="450" y="150" text-anchor="middle">Child</text>
    
    <!-- Shared Pages -->
    <rect x="70" y="200" width="160" height="30" fill="#aaccff"/>
    <rect x="370" y="200" width="160" height="30" fill="#aaccff"/>
    <path d="M230 215 L370 215" stroke="#ff6666" stroke-width="2"/>
    <text x="300" y="210" text-anchor="middle" fill="#ff4444">Shared COW Pages</text>
    
    <!-- Page Tables -->
    <rect x="100" y="250" width="100" height="30" fill="#ffe0e0"/>
    <rect x="400" y="250" width="100" height="30" fill="#ffe0e0"/>
    <text x="150" y="270" text-anchor="middle">PTE: COW</text>
    <text x="450" y="270" text-anchor="middle">PTE: COW</text>
</svg>
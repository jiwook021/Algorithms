<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="18">3. Write to COW Page Triggers Copy</text>
    
    <!-- Before -->
    <rect x="50" y="80" width="200" height="120" fill="#e0ffe0"/>
    <text x="150" y="100" text-anchor="middle">Child Process</text>
    <rect x="70" y="120" width="160" height="30" fill="#aaccff"/>
    <text x="150" y="140" text-anchor="middle">COW Page</text>
    
    <!-- After -->
    <rect x="350" y="80" width="200" height="120" fill="#e0ffe0"/>
    <text x="450" y="100" text-anchor="middle">Child Process</text>
    <rect x="370" y="120" width="160" height="30" fill="#ffaaaa"/>
    <text x="450" y="140" text-anchor="middle">Copied Page</text>
    
    <!-- Trigger -->
    <path d="M250 150 L350 150" stroke="#ff6666" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="300" y="140" text-anchor="middle" fill="#ff4444">Write Operation</text>
    
    <!-- Code Example -->
    <g transform="translate(50 220)">
        <rect width="500" height="130" fill="#fff" stroke="#ccc"/>
        <text x="20" y="30" font-family="monospace">// Child process code:</text>
        <text x="20" y="60" font-family="monospace" fill="#ff4444">*data_ptr = 42;  // Triggers COW</text>
        <text x="20" y="90" font-family="monospace">cout &lt;&lt; *data_ptr;</text>
    </g>
    
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6666"/>
        </marker>
    </defs>
</svg>
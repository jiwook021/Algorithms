<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Title -->
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">2. Feature Extraction &amp; Segmentation</text>
    
    <!-- Sample Image -->
    <rect x="50" y="60" width="200" height="200" fill="#fff" stroke="#666"/>
    <path d="M70,80 l40,-20 30,50 -10,30z" fill="#ff9999" stroke="#cc0000"/>
    <path d="M150,120 l50,-30 20,40 -30,20z" fill="#99ff99" stroke="#009900"/>
    
    <!-- Feature Labels -->
    <text x="280" y="100" font-size="14">Extracted Features:</text>
    <rect x="280" y="110" width="12" height="12" fill="#ff9999"/>
    <text x="300" y="122" font-size="12">Edges</text>
    <rect x="280" y="130" width="12" height="12" fill="#99ff99"/>
    <text x="300" y="142" font-size="12">Contours</text>
    <rect x="280" y="150" width="12" height="12" fill="#9999ff"/>
    <text x="300" y="162" font-size="12">Sliding Windows</text>
    
    <!-- Code Sample -->
    <g transform="translate(50, 280)" font-family="monospace" font-size="14">
        <text x="0" y="0" fill="#006600">// C++ Feature Extraction</text>
        <text x="0" y="30" fill="#0000ff">cv::Canny(image, edges, 50, 150);</text>
        <text x="0" y="60" fill="#0000ff">std::vector&lt;std::vector&lt;cv::Point&gt;&gt; contours;</text>
        <text x="0" y="90" fill="#0000ff">cv::findContours(binary, contours, </text>
        <text x="20" y="110" fill="#0000ff">cv::RETR_EXTERNAL, cv::CHAIN_APPROX_SIMPLE);</text>
    </g>
</svg>
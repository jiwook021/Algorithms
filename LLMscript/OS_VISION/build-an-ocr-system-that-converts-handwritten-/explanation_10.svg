<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#F0F0F0"/>
  <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold">Neural Network Architecture</text>
  
  <!-- Network Layers -->
  <rect x="100" y="80" width="120" height="40" fill="#FFA07A"/>
  <text x="160" y="105" text-anchor="middle">Input Image</text>
  <path d="M160 120 L160 140" stroke="#333" stroke-width="2"/>
  
  <rect x="80" y="140" width="160" height="40" fill="#20B2AA"/>
  <text x="160" y="165" text-anchor="middle">Conv2D (32 filters)</text>
  <path d="M160 180 L160 200" stroke="#333" stroke-width="2"/>
  
  <rect x="100" y="200" width="120" height="40" fill="#778899"/>
  <text x="160" y="225" text-anchor="middle">MaxPool (2x2)</text>
  <path d="M160 240 L160 260" stroke="#333" stroke-width="2"/>
  
  <rect x="80" y="260" width="160" height="40" fill="#9370DB"/>
  <text x="160" y="285" text-anchor="middle">Dense (128 units)</text>
  <path d="M160 300 L160 320" stroke="#333" stroke-width="2"/>
  
  <rect x="100" y="320" width="120" height="40" fill="#FF69B4"/>
  <text x="160" y="345" text-anchor="middle">Output (62 chars)</text>

  <!-- Code Example -->
  <rect x="300" y="80" width="260" height="280" fill="#2D2D2D" rx="5"/>
  <text x="430" y="100" text-anchor="middle" fill="white">C++ Model Definition</text>
  <text x="310" y="120" font-family="monospace" font-size="10" fill="#7FDBFF">
    <tspan x="310" dy="18">struct OCRNet : torch::nn::Module {</tspan>
    <tspan x="310" dy="18">  torch::nn::Conv2d conv1{nullptr};</tspan>
    <tspan x="310" dy="18">  torch::nn::MaxPool2d pool1{nullptr};</tspan>
    <tspan x="310" dy="18" fill="#FFDC00">  OCRNet() {</tspan>
    <tspan x="310" dy="18" fill="#FFDC00">    conv1 = register_module("conv1",</tspan>
    <tspan x="310" dy="18" fill="#FFDC00">      torch::nn::Conv2d(1, 32, 3));</tspan>
    <tspan x="310" dy="18" fill="#2ECC40">    pool1 = register_module("pool1",</tspan>
    <tspan x="310" dy="18" fill="#2ECC40">      torch::nn::MaxPool2d(2));</tspan>
    <tspan x="310" dy="18">    // ... fully connected layers</tspan>
    <tspan x="310" dy="18">  }</tspan>
    <tspan x="310" dy="18">};</tspan>
  </text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">2. Preprocessing Pipeline</text>
  
  <!-- Steps -->
  <g transform="translate(50 80)">
    <rect width="100" height="60" fill="#2196F3" rx="5"/>
    <text x="50" y="35" fill="white" text-anchor="middle">Grayscale</text>
  </g>
  
  <g transform="translate(200 80)">
    <rect width="100" height="60" fill="#FF9800" rx="5"/>
    <text x="50" y="35" fill="white" text-anchor="middle">Noise Removal</text>
  </g>
  
  <g transform="translate(350 80)">
    <rect width="100" height="60" fill="#4CAF50" rx="5"/>
    <text x="50" y="35" fill="white" text-anchor="middle">Binarization</text>
  </g>
  
  <!-- Arrows -->
  <path d="M150 110 H200" stroke="#333" stroke-width="2"/>
  <path d="M300 110 H350" stroke="#333" stroke-width="2"/>
  
  <!-- Code Example -->
  <g transform="translate(50 200)">
    <text x="0" y="0" font-family="monospace" font-size="14" fill="#333">cv::cvtColor(src, gray,</text>
    <text x="0" y="20" font-family="monospace" font-size="14" fill="#333">COLOR_BGR2GRAY);</text>
    <text x="0" y="50" font-family="monospace" font-size="14" fill="#FF9800">cv::GaussianBlur(gray,</text>
    <text x="0" y="70" font-family="monospace" font-size="14" fill="#FF9800">blurred, Size(5,5), 0);</text>
    <text x="0" y="100" font-family="monospace" font-size="14" fill="#4CAF50">cv::adaptiveThreshold(...);</text>
  </g>
</svg>
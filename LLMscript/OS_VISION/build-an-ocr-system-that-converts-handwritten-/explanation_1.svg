<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">1. Image Acquisition</text>
  
  <!-- Handwritten Note -->
  <path d="M50 80 Q55 70 60 80 Q65 90 70 80" stroke="#333" fill="none"/>
  <text x="60" y="110" font-size="12">Handwritten Note</text>
  
  <!-- Scanner -->
  <rect x="150" y="60" width="100" height="80" fill="#666"/>
  <line x1="250" y1="60" x2="300" y2="40" stroke="#666" stroke-width="2"/>
  <line x1="250" y1="140" x2="300" y2="160" stroke="#666" stroke-width="2"/>
  <text x="200" y="170" font-size="12">Scanner</text>
  
  <!-- Digital Image -->
  <rect x="320" y="50" width="120" height="100" fill="#fff" stroke="#4CAF50"/>
  <path d="M330 60 l20 -10 l15 15" stroke="#4CAF50" fill="none"/>
  <text x="380" y="170" font-size="12" fill="#4CAF50">Digital Image</text>
  
  <!-- Arrows -->
  <path d="M120 100 H150" stroke="#333" fill="none" stroke-width="2"/>
  <path d="M270 100 H320" stroke="#333" fill="none" stroke-width="2"/>
</svg>
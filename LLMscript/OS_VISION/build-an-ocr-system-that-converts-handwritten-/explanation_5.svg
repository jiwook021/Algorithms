<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">5. Post-Processing</text>
  
  <!-- Raw OCR Output -->
  <g transform="translate(50 80)">
    <rect width="200" height="60" fill="#fff" stroke="#F44336"/>
    <text x="100" y="40" text-anchor="middle" fill="#F44336">H3llo W0r1d!</text>
  </g>
  
  <!-- Correction Arrow -->
  <path d="M250 110 H350" stroke="#333" stroke-width="2"/>
  <polygon points="350 110 340 105 340 115" fill="#333"/>
  
  <!-- Corrected Text -->
  <g transform="translate(370 80)">
    <rect width="200" height="60" fill="#fff" stroke="#4CAF50"/>
    <text x="100" y="40" text-anchor="middle" fill="#4CAF50">Hello World!</text>
  </g>
  
  <!-- Dictionary -->
  <g transform="translate(200 180)">
    <rect width="200" height="80" fill="#FFEB3B" rx="5"/>
    <text x="100" y="30" text-anchor="middle">Language Model</text>
    <text x="100" y="50" text-anchor="middle">Dictionary:</text>
    <text x="100" y="70" text-anchor="middle">Hello, World, ...</text>
  </g>
  
  <!-- Code -->
  <text x="50" y="300" font-family="monospace" font-size="14" fill="#333">std::string corrected =</text>
  <text x="50" y="320" font-family="monospace" font-size="14" fill="#4CAF50">spellCheck(raw_output);</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">4. Neural Network Architecture</text>
  
  <!-- Network Layers -->
  <g transform="translate(50 80)">
    <rect width="80" height="120" fill="#795548"/>
    <text x="40" y="70" fill="white" text-anchor="middle">Input</text>
  </g>
  
  <g transform="translate(170 80)">
    <rect width="80" height="120" fill="#673AB7"/>
    <text x="40" y="70" fill="white" text-anchor="middle">Conv</text>
  </g>
  
  <g transform="translate(290 80)">
    <rect width="80" height="120" fill="#009688"/>
    <text x="40" y="70" fill="white" text-anchor="middle">LSTM</text>
  </g>
  
  <g transform="translate(410 80)">
    <rect width="80" height="120" fill="#E91E63"/>
    <text x="40" y="70" fill="white" text-anchor="middle">Dense</text>
  </g>
  
  <g transform="translate(530 80)">
    <rect width="80" height="120" fill="#3F51B5"/>
    <text x="40" y="70" fill="white" text-anchor="middle">Output</text>
  </g>
  
  <!-- Connections -->
  <path d="M130 140 H170" stroke="#333" stroke-width="2"/>
  <path d="M250 140 H290" stroke="#333" stroke-width="2"/>
  <path d="M370 140 H410" stroke="#333" stroke-width="2"/>
  <path d="M490 140 H530" stroke="#333" stroke-width="2"/>
  
  <!-- Code -->
  <text x="50" y="250" font-family="monospace" font-size="14" fill="#333">model.add(Conv2D(64, (3,3),</text>
  <text x="50" y="270" font-family="monospace" font-size="14" fill="#673AB7">activation='relu'));</text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Title -->
    <text x="300" y="30" font-size="18" text-anchor="middle" fill="#333">Pre-training &amp; Fine-tuning Pipeline</text>
    
    <!-- Pre-training Phase -->
    <rect x="50" y="60" width="220" height="280" fill="#fff" stroke="#2a9d8f" stroke-width="2"/>
    <text x="160" y="80" text-anchor="middle" font-size="14" fill="#2a9d8f">Pre-training Phase</text>
    
    <!-- Unlabeled Data -->
    <rect x="70" y="100" width="180" height="60" fill="#4a90e2" rx="5"/>
    <text x="160" y="130" text-anchor="middle" fill="white">10,000 Unlabeled Images</text>
    
    <!-- Pretext Task -->
    <rect x="70" y="180" width="180" height="60" fill="#e63946" rx="5"/>
    <text x="160" y="210" text-anchor="middle" fill="white">Pretext Task:</text>
    <text x="160" y="230" text-anchor="middle" fill="white">Predict Image Rotation</text>
    
    <!-- Model Architecture -->
    <rect x="70" y="260" width="180" height="60" fill="#2a9d8f" rx="5"/>
    <text x="160" y="280" text-anchor="middle" fill="white">Feature Encoder</text>
    <text x="160" y="300" text-anchor="middle" fill="white">(ResNet-18)</text>
    
    <!-- Fine-tuning Phase -->
    <rect x="330" y="60" width="220" height="280" fill="#fff" stroke="#ff9f1c" stroke-width="2"/>
    <text x="440" y="80" text-anchor="middle" font-size="14" fill="#ff9f1c">Fine-tuning Phase</text>
    
    <!-- Labeled Data -->
    <rect x="350" y="100" width="180" height="60" fill="#4a90e2" rx="5"/>
    <text x="440" y="130" text-anchor="middle" fill="white">1,000 Labeled Images</text>
    
    <!-- Classifier -->
    <rect x="350" y="180" width="180" height="60" fill="#ff9f1c" rx="5"/>
    <text x="440" y="210" text-anchor="middle" fill="white">Add Classifier Head</text>
    
    <!-- Transfer Arrow -->
    <path d="M270 160 L330 160" stroke="#666" fill="none" stroke-width="2"/>
    <polygon points="330 160, 320 155, 320 165" fill="#666"/>
    
    <!-- Code Example -->
    <rect x="50" y="300" width="500" height="80" fill="#1e1e1e" rx="5"/>
    <text x="60" y="320" font-size="12" fill="#569cd6" font-family="monospace">// C++ Fine-tuning Example</text>
    <text x="60" y="340" font-size="12" fill="#dcdcaa" font-family="monospace">auto model = PretrainedResNet()</text>
    <text x="60" y="360" font-size="12" fill="#dcdcaa" font-family="monospace">    .addClassifier(10); // 10 classes</text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold">Contrastive Learning Framework</text>
    
    <!-- Positive Pair -->
    <rect x="50" y="80" width="120" height="120" fill="#add8e6"/>
    <text x="110" y="210" text-anchor="middle" font-size="12">Augmented View 1</text>
    <rect x="250" y="80" width="120" height="120" fill="#98fb98"/>
    <text x="310" y="210" text-anchor="middle" font-size="12">Augmented View 2</text>
    <path d="M170,150 L250,150" stroke="#4CAF50" stroke-width="2"/>
    <text x="210" y="140" text-anchor="middle" fill="#4CAF50">Positive Pair</text>
    
    <!-- Negative Samples -->
    <rect x="430" y="80" width="120" height="120" fill="#ff6b6b"/>
    <text x="490" y="210" text-anchor="middle" font-size="12">Negative Sample</text>
    <path d="M370,150 L430,150" stroke="#ff0000" stroke-width="2" stroke-dasharray="4"/>
    <text x="400" y="140" text-anchor="middle" fill="#ff0000">Negative Pairs</text>
    
    <!-- Network Architecture -->
    <rect x="100" y="250" width="120" height="40" fill="#ffd700"/>
    <text x="160" y="275" text-anchor="middle">Encoder</text>
    <rect x="350" y="250" width="120" height="40" fill="#ffd700"/>
    <text x="410" y="275" text-anchor="middle">Projection</text>
    
    <!-- Loss Function -->
    <path d="M220,270 L350,270" stroke="#333" fill="none"/>
    <circle cx="285" cy="270" r="5" fill="#333"/>
    <text x="285" y="260" text-anchor="middle" font-size="12">NT-Xent Loss</text>
    
    <!-- C++ Code -->
    <rect x="50" y="320" width="500" height="60" fill="#e0e0e0" rx="5"/>
    <text x="60" y="350" font-family="monospace" font-size="12" fill="#333">// Contrastive loss implementation</text>
    <text x="60" y="370" font-family="monospace" font-size="12" fill="#333">float loss = -log(exp(sim_pos) / (exp(sim_pos) + sum_exp_neg));</text>
</svg>
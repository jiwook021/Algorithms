<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold">Masked Image Modeling</text>
    
    <!-- Original Image -->
    <rect x="50" y="80" width="200" height="200" fill="#add8e6"/>
    <rect x="70" y="100" width="40" height="40" fill="#ffffff"/>
    <rect x="150" y="180" width="40" height="40" fill="#ffffff"/>
    <text x="150" y="290" text-anchor="middle" font-size="12">Masked Input</text>
    
    <!-- Model Architecture -->
    <rect x="300" y="100" width="120" height="40" fill="#98fb98"/>
    <text x="360" y="125" text-anchor="middle">Transformer</text>
    <text x="360" y="145" text-anchor="middle">Encoder</text>
    
    <!-- Reconstruction -->
    <rect x="450" y="80" width="200" height="200" fill="#add8e6"/>
    <rect x="470" y="100" width="40" height="40" fill="#ff6b6b"/>
    <rect x="550" y="180" width="40" height="40" fill="#ff6b6b"/>
    <text x="550" y="290" text-anchor="middle" font-size="12">Reconstructed</text>
    
    <!-- Arrows -->
    <path d="M250,180 L300,180" stroke="#333" fill="none"/>
    <path d="M420,180 L450,180" stroke="#333" fill="none"/>
    
    <!-- C++ Code -->
    <rect x="50" y="320" width="500" height="60" fill="#e0e0e0" rx="5"/>
    <text x="60" y="350" font-family="monospace" font-size="12" fill="#333">// Apply random masking</text>
    <text x="60" y="370" font-family="monospace" font-size="12" fill="#333">apply_masked_patches(image, mask_ratio=0.3);</text>
</svg>
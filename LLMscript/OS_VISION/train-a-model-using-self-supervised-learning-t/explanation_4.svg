<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold">Cluster-Based Pretext Task</text>
    
    <!-- Image Collection -->
    <rect x="50" y="80" width="80" height="80" fill="#add8e6"/>
    <rect x="140" y="80" width="80" height="80" fill="#98fb98"/>
    <rect x="230" y="80" width="80" height="80" fill="#ff6b6b"/>
    <text x="180" y="170" text-anchor="middle" font-size="12">Unlabeled Images</text>
    
    <!-- Clustering -->
    <circle cx="450" cy="120" r="50" fill="#ffd700"/>
    <text x="450" y="120" text-anchor="middle" font-size="14">Cluster</text>
    <text x="450" y="140" text-anchor="middle" font-size="14">Assignments</text>
    
    <!-- Arrows to Clusters -->
    <path d="M310,120 L400,120" stroke="#333" fill="none"/>
    <path d="M310,120 L400,120" stroke="#333" fill="none" stroke-dasharray="4"/>
    
    <!-- Training -->
    <rect x="200" y="220" width="200" height="40" fill="#e0e0e0"/>
    <text x="300" y="245" text-anchor="middle">Train with Cluster IDs</text>
    <text x="300" y="265" text-anchor="middle">as Pseudo-Labels</text>
    
    <!-- C++ Code -->
    <rect x="50" y="300" width="500" height="60" fill="#e0e0e0" rx="5"/>
    <text x="60" y="330" font-family="monospace" font-size="12" fill="#333">// Perform k-means clustering</text>
    <text x="60" y="350" font-family="monospace" font-size="12" fill="#333">vector&lt;int&gt; clusters = kmeans(features, k=1000);</text>
</svg>
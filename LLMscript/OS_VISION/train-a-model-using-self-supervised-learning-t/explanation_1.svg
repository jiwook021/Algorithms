<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold">Pretext Task: Rotation Prediction</text>
    
    <!-- Original Image -->
    <rect x="50" y="80" width="120" height="120" fill="#d3d3d3"/>
    <text x="110" y="210" text-anchor="middle" font-size="12">Original Image</text>
    
    <!-- Rotated Versions -->
    <g transform="translate(200,80)">
        <rect width="120" height="120" fill="#add8e6"/>
        <text x="60" y="-10" text-anchor="middle" font-size="12">Rotated 0°</text>
        <path d="M60,60 L80,40 L100,60 L80,80 Z" fill="#ff6b6b"/>
    </g>
    <g transform="translate(350,80)">
        <rect width="120" height="120" fill="#98fb98" transform="rotate(90 60 60)"/>
        <text x="60" y="-10" text-anchor="middle" font-size="12">Rotated 90°</text>
    </g>
    
    <!-- Neural Network -->
    <path d="M500,100 Q550,140 500,180" stroke="#333" fill="none"/>
    <rect x="500" y="180" width="80" height="40" fill="#ffd700"/>
    <text x="540" y="205" text-anchor="middle" font-size="12">Classifier</text>
    <text x="540" y="250" text-anchor="middle" font-size="14">Rotation</text>
    <text x="540" y="270" text-anchor="middle" font-size="14">Angle</text>
    
    <!-- C++ Code -->
    <rect x="50" y="250" width="500" height="120" fill="#e0e0e0" rx="5"/>
    <text x="60" y="280" font-family="monospace" font-size="12" fill="#333">// Generate rotated variants</text>
    <text x="60" y="300" font-family="monospace" font-size="12" fill="#333">Mat rotated = rotate(image, angle);</text>
    <text x="60" y="320" font-family="monospace" font-size="12" fill="#333">// Labels: 0°, 90°, 180°, 270°</text>
</svg>
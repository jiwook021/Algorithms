<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold">Autoencoder Architecture</text>
    
    <!-- Input Image -->
    <rect x="50" y="100" width="120" height="120" fill="#add8e6"/>
    <text x="110" y="230" text-anchor="middle" font-size="12">Input Image</text>
    
    <!-- Encoder -->
    <path d="M200,160 L250,160 L250,140 L300,160 L250,180 Z" fill="#98fb98"/>
    <text x="250" y="200" text-anchor="middle" font-size="12">Encoder</text>
    
    <!-- Bottleneck -->
    <rect x="325" y="140" width="50" height="40" fill="#ff6b6b"/>
    <text x="350" y="165" text-anchor="middle" font-size="12">Latent</text>
    <text x="350" y="180" text-anchor="middle" font-size="12">Code</text>
    
    <!-- Decoder -->
    <path d="M400,160 L450,140 L500,160 L450,180 Z" fill="#98fb98"/>
    <text x="450" y="200" text-anchor="middle" font-size="12">Decoder</text>
    
    <!-- Reconstructed Image -->
    <rect x="530" y="100" width="120" height="120" fill="#add8e6"/>
    <text x="590" y="230" text-anchor="middle" font-size="12">Reconstruction</text>
    
    <!-- Arrows -->
    <path d="M170,160 L200,160" stroke="#333" fill="none"/>
    <path d="M300,160 L325,160" stroke="#333" fill="none"/>
    <path d="M375,160 L400,160" stroke="#333" fill="none"/>
    <path d="M500,160 L530,160" stroke="#333" fill="none"/>
    
    <!-- C++ Code -->
    <rect x="50" y="280" width="500" height="80" fill="#e0e0e0" rx="5"/>
    <text x="60" y="310" font-family="monospace" font-size="12" fill="#333">struct Autoencoder {</text>
    <text x="80" y="330" font-family="monospace" font-size="12" fill="#333">ConvLayer encoder[3];</text>
    <text x="80" y="350" font-family="monospace" font-size="12" fill="#333">ConvLayer decoder[3];</text>
    <text x="60" y="370" font-family="monospace" font-size="12" fill="#333">};</text>
</svg>
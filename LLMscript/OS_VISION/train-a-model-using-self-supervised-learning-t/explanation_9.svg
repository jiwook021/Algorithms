<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Title -->
    <text x="300" y="30" font-size="18" text-anchor="middle" fill="#333">Self-Supervised Learning: Data Augmentation Pipeline</text>
    
    <!-- Original Image -->
    <rect x="50" y="60" width="100" height="100" fill="#fff" stroke="#4a90e2"/>
    <text x="100" y="175" text-anchor="middle" font-size="12" fill="#4a90e2">Original Image</text>
    
    <!-- Augmentation Steps -->
    <g transform="translate(200 60)">
        <rect width="100" height="100" fill="#fff" stroke="#e63946"/>
        <text x="50" y="120" text-anchor="middle" font-size="12" fill="#e63946">Random Crop</text>
    </g>
    
    <g transform="translate(350 60)">
        <rect width="100" height="100" fill="#fff" stroke="#e63946"/>
        <text x="50" y="120" text-anchor="middle" font-size="12" fill="#e63946">Color Jitter</text>
    </g>
    
    <g transform="translate(500 60)">
        <rect width="100" height="100" fill="#fff" stroke="#e63946"/>
        <text x="50" y="120" text-anchor="middle" font-size="12" fill="#e63946">Rotation</text>
    </g>
    
    <!-- Arrows -->
    <path d="M150 110 L200 110" stroke="#666" fill="none" stroke-width="2"/>
    <path d="M300 110 L350 110" stroke="#666" fill="none" stroke-width="2"/>
    <path d="M450 110 L500 110" stroke="#666" fill="none" stroke-width="2"/>
    
    <!-- Neural Network -->
    <path d="M50 250 L550 250" stroke="#666" fill="none" stroke-width="2"/>
    <rect x="250" y="200" width="100" height="40" fill="#2a9d8f" rx="5"/>
    <text x="300" y="222" text-anchor="middle" fill="white" font-size="12">Encoder</text>
    <text x="300" y="270" text-anchor="middle" font-size="12" fill="#333">Contrastive Loss: Maximize Similarity</text>
    
    <!-- Code Example -->
    <rect x="50" y="300" width="500" height="80" fill="#1e1e1e" rx="5"/>
    <text x="60" y="320" font-size="12" fill="#569cd6" font-family="monospace">// C++ Augmentation Example</text>
    <text x="60" y="340" font-size="12" fill="#dcdcaa" font-family="monospace">Mat augmented = original</text>
    <text x="60" y="360" font-size="12" fill="#dcdcaa" font-family="monospace">    .crop(random_rect)</text>
    <text x="60" y="380" font-size="12" fill="#dcdcaa" font-family="monospace">    .adjustColors(rng);</text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Title -->
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">1. Data Augmentation Pipeline</text>
    
    <!-- Original Image -->
    <rect x="50" y="60" width="150" height="150" fill="#fff" stroke="#666"/>
    <text x="125" y="230" text-anchor="middle" fill="#333">Original Image</text>
    
    <!-- Augmentation Arrows -->
    <path d="M225 135 L275 135 L275 85 L325 85" stroke="#666" fill="none" marker-end="url(#arrow)"/>
    <path d="M225 135 L275 135 L275 185 L325 185" stroke="#666" fill="none" marker-end="url(#arrow)"/>
    
    <!-- Augmented Images -->
    <rect x="350" y="40" width="150" height="150" fill="#fff" stroke="#4CAF50" stroke-width="2"/>
    <text x="425" y="210" text-anchor="middle" fill="#4CAF50">Rotated</text>
    
    <rect x="350" y="190" width="150" height="150" fill="#fff" stroke="#2196F3" stroke-width="2"/>
    <text x="425" y="360" text-anchor="middle" fill="#2196F3">Cropped</text>
    
    <!-- Code Example -->
    <rect x="50" y="260" width="250" height="110" fill="#263238" rx="5"/>
    <text x="60" y="280" font-size="12" fill="#fff" font-family="monospace">// C++ Augmentation Example</text>
    <text x="60" y="300" font-size="12" fill="#fff" font-family="monospace">Mat augmented = original</text>
    <text x="60" y="320" font-size="12" fill="#fff" font-family="monospace">    .rotate(90)</text>
    <text x="60" y="340" font-size="12" fill="#fff" font-family="monospace">    .crop(128,128);</text>

    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
        </marker>
    </defs>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Title -->
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">2. Contrastive Learning Framework</text>
    
    <!-- Architecture -->
    <rect x="100" y="80" width="120" height="60" fill="#FF5722" rx="5"/>
    <text x="160" y="115" text-anchor="middle" fill="#fff">Encoder</text>
    
    <rect x="100" y="240" width="120" height="60" fill="#FF5722" rx="5"/>
    <text x="160" y="275" text-anchor="middle" fill="#fff">Encoder</text>
    
    <!-- Projection Heads -->
    <rect x="260" y="80" width="120" height="60" fill="#673AB7" rx="5"/>
    <text x="320" y="115" text-anchor="middle" fill="#fff">Projection</text>
    
    <rect x="260" y="240" width="120" height="60" fill="#673AB7" rx="5"/>
    <text x="320" y="275" text-anchor="middle" fill="#fff">Projection</text>
    
    <!-- Loss Calculation -->
    <path d="M380 110 L480 110 L480 270 L380 270" stroke="#E91E63" fill="none" stroke-width="2"/>
    <text x="430" y="200" text-anchor="middle" fill="#E91E63">NT-Xent Loss</text>
    
    <!-- Sample Relationships -->
    <path d="M320 110 Q400 150 320 270" stroke="#4CAF50" fill="none" stroke-dasharray="4"/>
    <text x="380" y="190" text-anchor="middle" fill="#4CAF50">Positive Pair</text>
    
    <path d="M320 140 Q400 190 320 240" stroke="#F44336" fill="none" stroke-dasharray="4"/>
    <text x="380" y="215" text-anchor="middle" fill="#F44336">Negative Pair</text>
    
    <!-- Code Example -->
    <rect x="50" y="320" width="300" height="60" fill="#263238" rx="5"/>
    <text x="60" y="340" font-size="12" fill="#fff" font-family="monospace">// C++ Contrastive Loss</text>
    <text x="60" y="360" font-size="12" fill="#fff" font-family="monospace">float loss = -log(exp(sim_pos) / (exp(sim_pos) + sum_exp_neg));</text>
</svg>
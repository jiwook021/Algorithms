<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Inheritance Protocol Steps</text>
  
  <!-- Flowchart -->
  <rect x="100" y="80" width="200" height="60" fill="#cce5ff" rx="5"/>
  <text x="200" y="115" text-anchor="middle">High-priority task</text>
  <text x="200" y="130" text-anchor="middle">requests resource</text>
  
  <path d="M200 140 L200 180" stroke="#666" stroke-width="2"/>
  
  <rect x="100" y="180" width="200" height="60" fill="#cce5ff" rx="5"/>
  <text x="200" y="215" text-anchor="middle">Resource owned by</text>
  <text x="200" y="230" text-anchor="middle">low-priority task</text>
  
  <path d="M200 240 L200 280" stroke="#666" stroke-width="2"/>
  
  <rect x="100" y="280" width="200" height="60" fill="#cce5ff" rx="5"/>
  <text x="200" y="315" text-anchor="middle">System boosts owner's</text>
  <text x="200" y="330" text-anchor="middle">priority temporarily</text>
  
  <!-- Right side flow -->
  <rect x="400" y="80" width="200" height="60" fill="#cce5ff" rx="5"/>
  <text x="500" y="115" text-anchor="middle">Low-priority task</text>
  <text x="500" y="130" text-anchor="middle">completes work</text>
  
  <path d="M500 140 L500 180" stroke="#666" stroke-width="2"/>
  
  <rect x="400" y="180" width="200" height="60" fill="#cce5ff" rx="5"/>
  <text x="500" y="215" text-anchor="middle">Priority restored</text>
  <text x="500" y="230" text-anchor="middle">to original level</text>
  
  <!-- Connection arrows -->
  <path d="M300 310 L450 310 L450 100" stroke="#666" stroke-width="2" fill="none" marker-end="url(#flowArrow)"/>
  
  <defs>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Priority Inversion Problem</text>
  
  <!-- Tasks -->
  <rect x="50" y="100" width="120" height="40" fill="#ff9999" rx="5"/>
  <text x="110" y="125" fill="#000">High Priority</text>
  
  <rect x="50" y="180" width="120" height="40" fill="#99ff99" rx="5"/>
  <text x="110" y="205" fill="#000">Medium Priority</text>
  
  <rect x="50" y="260" width="120" height="40" fill="#9999ff" rx="5"/>
  <text x="110" y="285" fill="#000">Low Priority</text>

  <!-- Timeline -->
  <path d="M 250 150 L 550 150 L 550 300 L 250 300" fill="none" stroke="#666" stroke-width="2"/>
  
  <!-- Blocking sequence -->
  <rect x="280" y="260" width="80" height="40" fill="#9999ff"/>
  <rect x="400" y="180" width="80" height="40" fill="#99ff99"/>
  <rect x="520" y="100" width="80" height="40" fill="#ff9999"/>
  
  <!-- Arrows -->
  <path d="M 170 120 L 270 120" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 170 200 L 270 200" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 170 280 L 270 280" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Labels -->
  <text x="320" y="295" font-size="12">1. Low locks resource</text>
  <text x="440" y="295" font-size="12">2. Medium preempts</text>
  <text x="540" y="295" font-size="12" text-anchor="end">3. High waits</text>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>
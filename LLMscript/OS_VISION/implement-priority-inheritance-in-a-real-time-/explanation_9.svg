<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Title -->
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Priority Inversion Problem</text>
    
    <!-- Task diagram -->
    <rect x="50" y="100" width="500" height="180" fill="white" rx="5"/>
    
    <!-- Task priorities -->
    <text x="70" y="130" font-size="16" fill="#666">Priorities:</text>
    <circle cx="150" cy="125" r="10" fill="#4CAF50"/>
    <text x="160" y="130" font-size="14">High (Task H)</text>
    <circle cx="300" cy="125" r="10" fill="#FFC107"/>
    <text x="310" y="130" font-size="14">Medium (Task M)</text>
    <circle cx="450" cy="125" r="10" fill="#F44336"/>
    <text x="460" y="130" font-size="14">Low (Task L)</text>

    <!-- Timeline -->
    <path d="M 50 200 H 550" stroke="#999" stroke-width="2"/>
    
    <!-- Execution flow -->
    <rect x="60" y="180" width="80" height="40" fill="#F44336" rx="3"/>
    <text x="100" y="200" fill="white" text-anchor="middle">Task L</text>
    <text x="100" y="220" fill="white" text-anchor="middle" font-size="12">(acquires mutex)</text>

    <rect x="180" y="160" width="80" height="40" fill="#FFC107" rx="3"/>
    <text x="220" y="180" fill="black" text-anchor="middle">Task M</text>
    <text x="220" y="200" fill="black" text-anchor="middle" font-size="12">(preempts L)</text>

    <rect x="320" y="140" width="80" height="40" fill="#4CAF50" rx="3"/>
    <text x="360" y="160" fill="white" text-anchor="middle">Task H</text>
    <text x="360" y="180" fill="white" text-anchor="middle" font-size="12">(blocked)</text>

    <!-- Code example -->
    <g transform="translate(50 250)">
        <rect width="500" height="120" fill="#263238" rx="5"/>
        <text x="20" y="30" fill="#fff" font-family="monospace" font-size="14">// Without priority inheritance</text>
        <text x="20" y="50" fill="#fff" font-family="monospace" font-size="14">std::mutex m;</text>
        <text x="20" y="70" fill="#fff" font-family="monospace" font-size="14">void Task_L() {</text>
        <text x="40" y="90" fill="#fff" font-family="monospace" font-size="14">m.lock();  // Acquire resource</text>
        <text x="40" y="110" fill="#fff" font-family="monospace" font-size="14">// ... gets preempted by M</text>
        <text x="20" y="130" fill="#fff" font-family="monospace" font-size="14">}</text>
    </g>
</svg>
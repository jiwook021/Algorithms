<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Title -->
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Priority Inheritance Solution</text>
    
    <!-- Inheritance visualization -->
    <rect x="50" y="100" width="500" height="180" fill="white" rx="5"/>
    
    <!-- Priority boost -->
    <path d="M 150 250 L 150 140 L 450 140 L 450 250" fill="none" stroke="#2196F3" stroke-width="2" stroke-dasharray="4"/>
    <text x="300" y="130" text-anchor="middle" fill="#2196F3">Priority Boost</text>

    <!-- Task execution -->
    <rect x="60" y="180" width="80" height="40" fill="#2196F3" rx="3">
        <animate attributeName="fill" from="#F44336" to="#2196F3" begin="1s" dur="0.5s" fill="freeze"/>
    </rect>
    <text x="100" y="200" fill="white" text-anchor="middle">Task L</text>
    <text x="100" y="220" fill="white" text-anchor="middle" font-size="12">(inherits H's priority)</text>

    <rect x="180" y="160" width="80" height="40" fill="#FFC107" rx="3" opacity="0.5"/>
    <text x="220" y="180" fill="black" text-anchor="middle">Task M</text>
    <text x="220" y="200" fill="black" text-anchor="middle" font-size="12">(cannot preempt)</text>

    <rect x="320" y="220" width="80" height="40" fill="#4CAF50" rx="3"/>
    <text x="360" y="240" fill="white" text-anchor="middle">Task H</text>
    <text x="360" y="260" fill="white" text-anchor="middle" font-size="12">(executes after L)</text>

    <!-- Code example -->
    <g transform="translate(50 250)">
        <rect width="500" height="120" fill="#263238" rx="5"/>
        <text x="20" y="30" fill="#fff" font-family="monospace" font-size="14">// With priority inheritance</text>
        <text x="20" y="50" fill="#fff" font-family="monospace" font-size="14">pthread_mutexattr_t attr;</text>
        <text x="20" y="70" fill="#fff" font-family="monospace" font-size="14">pthread_mutexattr_setprotocol(&amp;attr,</text>
        <text x="20" y="90" fill="#fff" font-family="monospace" font-size="14">                   PTHREAD_PRIO_INHERIT);</text>
        <text x="20" y="110" fill="#fff" font-family="monospace" font-size="14">pthread_mutex_init(&amp;m, &amp;attr);</text>
    </g>
</svg>
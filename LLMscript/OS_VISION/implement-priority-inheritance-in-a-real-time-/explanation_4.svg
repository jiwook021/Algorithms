<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">C++ Implementation Example</text>
  
  <!-- Code block -->
  <rect x="50" y="60" width="500" height="300" fill="#fff" rx="5" stroke="#666"/>
  
  <!-- Code content -->
  <text x="70" y="90" font-family="monospace" font-size="14" fill="#333">pthread_mutexattr_t attr;</text>
  <text x="70" y="110" font-family="monospace" font-size="14" fill="#333">pthread_mutexattr_init(&amp;attr);</text>
  <text x="70" y="130" font-family="monospace" font-size="14" fill="#0066cc">pthread_mutexattr_setprotocol(&amp;attr, PTHREAD_PRIO_INHERIT);</text>
  
  <text x="70" y="160" font-family="monospace" font-size="14" fill="#333">pthread_mutex_t my_mutex;</text>
  <text x="70" y="180" font-family="monospace" font-size="14" fill="#333">pthread_mutex_init(&amp;my_mutex, &amp;attr);</text>
  
  <text x="70" y="210" font-family="monospace" font-size="14" fill="#333">// High-priority thread:</text>
  <text x="70" y="230" font-family="monospace" font-size="14" fill="#333">pthread_mutex_lock(&amp;my_mutex);</text>
  <text x="70" y="250" font-family="monospace" font-size="14" fill="#333">// Critical section</text>
  <text x="70" y="270" font-family="monospace" font-size="14" fill="#333">pthread_mutex_unlock(&amp;my_mutex);</text>
  
  <!-- Highlight box -->
  <rect x="60" y="120" width="480" height="20" fill="#ccffcc" opacity="0.5"/>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Priority Inheritance Activation</text>
  
  <!-- Original state -->
  <rect x="50" y="100" width="120" height="40" fill="#9999ff" rx="5"/>
  <text x="110" y="125" fill="#000">Low Priority</text>
  <rect x="50" y="260" width="120" height="40" fill="#ff9999" rx="5"/>
  <text x="110" y="285" fill="#000">High Priority</text>
  
  <!-- Inheritance arrow -->
  <path d="M 200 280 Q 300 200 400 120" stroke="#ff6600" stroke-width="2" fill="none" marker-end="url(#inheritanceArrow)"/>
  <text x="300" y="200" text-anchor="middle" fill="#ff6600">Priority Boost</text>
  
  <!-- New state -->
  <rect x="450" y="100" width="120" height="40" fill="#ff9999" rx="5"/>
  <text x="510" y="125" fill="#000">Low (Elevated)</text>
  
  <!-- Resource -->
  <rect x="300" y="160" width="60" height="60" fill="#666" rx="5"/>
  <text x="330" y="190" fill="#fff" text-anchor="middle">Resource</text>
  
  <defs>
    <marker id="inheritanceArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff6600"/>
    </marker>
  </defs>
</svg>
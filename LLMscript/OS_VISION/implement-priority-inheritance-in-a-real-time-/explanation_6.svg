<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="20" fill="#333">Priority Inversion Problem</text>
    
    <!-- Timeline -->
    <line x1="50" y1="100" x2="550" y2="100" stroke="#666" stroke-width="2"/>
    
    <!-- Tasks -->
    <rect x="60" y="140" width="120" height="40" fill="#ff9999" rx="5"/>
    <text x="120" y="165" text-anchor="middle" fill="#000">Low (L)</text>
    
    <rect x="240" y="80" width="120" height="40" fill="#99ccff" rx="5"/>
    <text x="300" y="105" text-anchor="middle" fill="#000">Medium (M)</text>
    
    <rect x="420" y="180" width="120" height="40" fill="#99ff99" rx="5"/>
    <text x="480" y="205" text-anchor="middle" fill="#000">High (H)</text>
    
    <!-- Blocked state -->
    <rect x="420" y="230" width="120" height="40" fill="#ff6666" rx="5"/>
    <text x="480" y="255" text-anchor="middle" fill="#fff">Blocked</text>
    
    <!-- Arrows -->
    <path d="M480,180 L480,230" stroke="#666" stroke-width="2" fill="none"/>
    <path d="M480,230 L475,225" stroke="#666" fill="#666"/>
    <path d="M480,230 L485,225" stroke="#666" fill="#666"/>
    
    <!-- Code example -->
    <g transform="translate(50 300)">
        <rect width="500" height="80" fill="#e0e0e0" rx="5"/>
        <text x="20" y="25" font-family="monospace" font-size="14" fill="#333">
            <tspan x="20" dy="1.2em">// Thread H (high priority)</tspan>
            <tspan x="20" dy="1.2em">mu.lock();  // Blocked by L</tspan>
        </text>
    </g>
</svg>
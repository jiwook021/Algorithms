<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Timeline Comparison</text>
  
  <!-- Before inheritance -->
  <text x="100" y="60" font-size="16">Without Priority Inheritance</text>
  <rect x="50" y="80" width="500" height="40" fill="#fff" stroke="#666"/>
  <rect x="60" y="85" width="80" height="30" fill="#9999ff"/>
  <rect x="160" y="85" width="120" height="30" fill="#99ff99"/>
  <rect x="300" y="85" width="80" height="30" fill="#9999ff"/>
  <rect x="400" y="85" width="100" height="30" fill="#ff9999"/>
  
  <!-- After inheritance -->
  <text x="100" y="180" font-size="16">With Priority Inheritance</text>
  <rect x="50" y="200" width="500" height="40" fill="#fff" stroke="#666"/>
  <rect x="60" y="205" width="100" height="30" fill="#9999ff"/>
  <rect x="180" y="205" width="80" height="30" fill="#ff9999"/>
  <rect x="280" y="205" width="80" height="30" fill="#9999ff"/>
  <rect x="380" y="205" width="100" height="30" fill="#99ff99"/>
  
  <!-- Legend -->
  <rect x="50" y="280" width="20" height="20" fill="#ff9999"/>
  <text x="80" y="295">High Priority</text>
  <rect x="200" y="280" width="20" height="20" fill="#99ff99"/>
  <text x="230" y="295">Medium Priority</text>
  <rect x="350" y="280" width="20" height="20" fill="#9999ff"/>
  <text x="380" y="295">Low Priority</text>
  
  <!-- Time labels -->
  <text x="50" y="130" font-size="12">Long delay</text>
  <text x="50" y="250" font-size="12">Reduced delay</text>
  <path d="M 300 85 L 300 125" stroke="#666" stroke-dasharray="4"/>
  <path d="M 280 205 L 280 245" stroke="#666" stroke-dasharray="4"/>
</svg>
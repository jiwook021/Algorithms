<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="20" fill="#333">Execution Flow with Inheritance</text>
    
    <!-- Before/After labels -->
    <text x="150" y="60" text-anchor="middle" fill="#666">Without Inheritance</text>
    <text x="450" y="60" text-anchor="middle" fill="#666">With Inheritance</text>
    
    <!-- Left timeline (Bad) -->
    <line x1="50" y1="100" x2="250" y2="100" stroke="#666" stroke-width="2"/>
    <rect x="60" y="120" width="40" height="20" fill="#ff9999"/>
    <rect x="110" y="80" width="40" height="20" fill="#99ccff"/>
    <rect x="160" y="120" width="40" height="20" fill="#ff9999"/>
    <text x="300" y="150" text-anchor="middle" font-size="14" fill="#333">H waits for M completes</text>
    
    <!-- Right timeline (Good) -->
    <line x1="350" y1="100" x2="550" y2="100" stroke="#666" stroke-width="2"/>
    <rect x="360" y="120" width="40" height="20" fill="#ff9999"/>
    <rect x="410" y="80" width="40" height="20" fill="#99ff99"/>
    <rect x="460" y="120" width="40" height="20" fill="#ff9999"/>
    <text x="450" y="150" text-anchor="middle" font-size="14" fill="#333">H preempts M</text>
    
    <!-- Code example -->
    <g transform="translate(50 250)">
        <rect width="500" height="120" fill="#e0e0e0" rx="5"/>
        <text x="20" y="25" font-family="monospace" font-size="14" fill="#333">
            <tspan x="20" dy="1.2em">void highPriorityTask() {</tspan>
            <tspan x="40" dy="1.2em">inheritance_mutex.lock();</tspan>
            <tspan x="40" dy="1.2em">// Critical section</tspan>
            <tspan x="40" dy="1.2em">inheritance_mutex.unlock();</tspan>
            <tspan x="20" dy="1.2em">}</tspan>
        </text>
    </g>
</svg>
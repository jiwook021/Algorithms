<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#F0F0F0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="navy">Vehicle Tracking with Bounding Boxes</text>
    
    <!-- Frame Sequence -->
    <g transform="translate(50 60)">
        <rect width="200" height="150" fill="#FFF" stroke="#666"/>
        <rect x="30" y="40" width="140" height="80" fill="none" stroke="#2196F3" stroke-width="2"/>
        <circle cx="100" cy="80" r="3" fill="#FFC107"/>
        <text x="100" y="140" text-anchor="middle" fill="#333">Frame t</text>
    </g>
    
    <g transform="translate(350 60)">
        <rect width="200" height="150" fill="#FFF" stroke="#666"/>
        <rect x="60" y="40" width="140" height="80" fill="none" stroke="#2196F3" stroke-width="2"/>
        <circle cx="130" cy="80" r="3" fill="#FFC107"/>
        <text x="100" y="140" text-anchor="middle" fill="#333">Frame t+1</text>
    </g>
    
    <!-- Movement Arrow -->
    <path d="M250 140 L350 140" stroke="#4CAF50" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="300" y="160" text-anchor="middle" fill="#4CAF50">Δx = 30 pixels</text>
    
    <!-- Code Example -->
    <g transform="translate(50 250)">
        <rect width="500" height="130" fill="#263238" rx="5"/>
        <text x="20" y="30" fill="#FFF" font-family="monospace" font-size="14">
            <tspan x="20" dy="1.2em">// C++ bounding box tracking</tspan>
            <tspan x="20" dy="1.2em">Rect prev_bbox(30,40,140,80);</tspan>
            <tspan x="20" dy="1.2em">Rect curr_bbox(60,40,140,80);</tspan>
            <tspan x="20" dy="1.2em">Point2f centroid = (curr_bbox.tl() + curr_bbox.br())/2;</tspan>
        </text>
    </g>
    
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/>
        </marker>
    </defs>
</svg>
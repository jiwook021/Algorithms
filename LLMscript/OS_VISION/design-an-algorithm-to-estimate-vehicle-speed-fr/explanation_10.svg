<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Speed Calculation Visualization -->
    <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Road Surface -->
    <rect x="0" y="200" width="600" height="80" fill="#808080"/>
    <path d="M0 230 L600 230 M0 250 L600 250" stroke="#fff" stroke-width="4" stroke-dasharray="10 10"/>
    
    <!-- Vehicle Movement -->
    <rect x="100" y="180" width="60" height="40" fill="#4682b4"/>
    <rect x="400" y="180" width="60" height="40" fill="#4682b4"/>
    
    <!-- Measurement Line -->
    <path d="M130 190 L430 190" stroke="#ff4500" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="270" y="180" font-size="12" fill="#ff4500">Δp = 300 pixels</text>
    
    <!-- Calibration Marker -->
    <rect x="50" y="220" width="10" height="20" fill="#ffff00"/>
    <text x="70" y="235" font-size="10" fill="#333">Known distance: 3m</text>
    
    <!-- Formula -->
    <rect x="150" y="280" width="300" height="80" fill="#fff" rx="5"/>
    <text x="300" y="310" text-anchor="middle" font-size="16" fill="#333">
        Speed = (Δp × calibration × fps) / Δt
    </text>
    
    <!-- Code Example -->
    <rect x="50" y="50" width="500" height="100" fill="#e0e0e0" rx="5"/>
    <text x="70" y="80" font-family="monospace" font-size="12" fill="#333">
        <tspan x="70" y="80">// C++ speed calculation</tspan>
        <tspan x="70" y="100">double calculate_speed(Point p1, Point p2) {</tspan>
        <tspan x="90" y="120">double pixels_per_meter = 100; // From calibration</tspan>
        <tspan x="90" y="140">double distance = norm(p2-p1) / pixels_per_meter;</tspan>
        <tspan x="90" y="160">return distance * fps * 3.6; // m/s → km/h</tspan>
        <tspan x="70" y="180">}</tspan>
    </text>
</svg>
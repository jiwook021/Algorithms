<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="80" font-size="18" text-anchor="middle" fill="#2c3e50">Speed Calculation</text>
    <rect x="200" y="120" width="200" height="60" fill="#2ecc71" rx="5"/>
    <text x="300" y="160" font-size="24" text-anchor="middle" fill="#ecf0f1">v = d / t</text>
    <path d="M 150 250 L 450 250" stroke="#e74c3c" stroke-width="4"/>
    <text x="300" y="240" font-size="16" text-anchor="middle" fill="#2c3e50">Distance (meters)</text>
    <path d="M 300 250 L 300 350" stroke="#3498db" stroke-width="4"/>
    <text x="320" y="300" font-size="16" text-anchor="start" fill="#2c3e50">Time (seconds)</text>
    <text x="300" y="380" font-size="14" text-anchor="middle" fill="#2c3e50">Final Speed Estimation</text>
    <text x="300" y="200" font-size="14" text-anchor="middle" fill="#e67e22">
        double speed = (distance_m * 3.6) / time_s;
    </text>
</svg>
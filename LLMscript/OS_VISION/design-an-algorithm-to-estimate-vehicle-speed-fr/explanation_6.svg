<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#F0F0F0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="navy">Frame Differencing for Motion Detection</text>
    
    <!-- Background Frame -->
    <rect x="50" y="60" width="200" height="150" fill="#FFF" stroke="#666"/>
    <text x="150" y="80" text-anchor="middle" fill="#333">Frame t</text>
    <rect x="70" y="100" width="60" height="60" fill="#4CAF50"/>
    
    <!-- Current Frame -->
    <rect x="350" y="60" width="200" height="150" fill="#FFF" stroke="#666"/>
    <text x="450" y="80" text-anchor="middle" fill="#333">Frame t+1</text>
    <rect x="370" y="100" width="60" height="60" fill="#4CAF50"/>
    <rect x="450" y="100" width="60" height="60" fill="#FF5722"/>
    
    <!-- Difference Highlight -->
    <path d="M450,100 L450,160 510,160 510,100" fill="#FF5722" fill-opacity="0.3"/>
    <text x="480" y="180" text-anchor="middle" fill="#FF5722">Difference</text>
    
    <!-- Code Example -->
    <g transform="translate(50 250)">
        <rect width="500" height="130" fill="#263238" rx="5"/>
        <text x="20" y="30" fill="#FFF" font-family="monospace" font-size="14">
            <tspan x="20" dy="1.2em">// C++ frame differencing example</tspan>
            <tspan x="20" dy="1.2em">Mat diff;</tspan>
            <tspan x="20" dy="1.2em">absdiff(prevFrame, currentFrame, diff);</tspan>
            <tspan x="20" dy="1.2em">threshold(diff, motionMask, 25, 255, THRESH_BINARY);</tspan>
        </text>
    </g>
</svg>
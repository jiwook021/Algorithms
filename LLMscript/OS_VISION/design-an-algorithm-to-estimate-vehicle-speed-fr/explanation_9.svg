<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Object Detection & Tracking Visualization -->
    <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Video Frames -->
    <rect x="50" y="80" width="200" height="150" fill="#fff" stroke="#333"/>
    <rect x="350" y="80" width="200" height="150" fill="#fff" stroke="#333"/>
    
    <!-- Bounding Boxes -->
    <rect x="100" y="110" width="80" height="50" fill="none" stroke="#00ff00" stroke-width="2"/>
    <rect x="400" y="100" width="80" height="50" fill="none" stroke="#00ff00" stroke-width="2"/>
    
    <!-- Tracking Arrow -->
    <path d="M280 135 L320 135 L320 130 L335 135 L320 140 L320 135 Z" fill="#ff0000"/>
    <path d="M280 135 L320 135" stroke="#ff0000" stroke-width="2"/>
    
    <!-- Centroid Points -->
    <circle cx="140" cy="135" r="3" fill="#ff0000"/>
    <circle cx="440" cy="125" r="3" fill="#ff0000"/>
    
    <!-- Code Example -->
    <rect x="50" y="260" width="500" height="120" fill="#e0e0e0" rx="5"/>
    <text x="70" y="290" font-family="monospace" font-size="12" fill="#333">
        <tspan x="70" y="290">// C++ tracking pseudocode</tspan>
        <tspan x="70" y="310">vector&lt;TrackingBox> detect_vehicles(Mat frame) {</tspan>
        <tspan x="90" y="330">// Use YOLO/MobileNet for detection</tspan>
        <tspan x="90" y="350">// Assign unique IDs to vehicles</tspan>
        <tspan x="70" y="370">}</tspan>
    </text>
    
    <!-- Labels -->
    <text x="150" y="60" font-size="14" fill="#333">Video Frame N</text>
    <text x="450" y="60" font-size="14" fill="#333">Video Frame N+1</text>
    <text x="300" y="170" font-size="12" fill="#ff0000">Optical Flow</text>
    <text x="140" y="160" font-size="10" fill="#00ff00">Bounding Box (ID: 42)</text>
</svg>
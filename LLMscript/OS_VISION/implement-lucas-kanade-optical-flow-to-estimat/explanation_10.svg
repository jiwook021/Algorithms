<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <style>
        .grid { stroke: #cccccc; stroke-width: 0.5; }
        .window { fill: none; stroke: #FFD700; stroke-width: 2; }
        .arrow { stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: monospace; font-size: 12px; }
        .code-bg { fill: #f5f5f5; stroke: #ddd; }
    </style>
    
    <!-- Grid background -->
    <rect width="600" height="400" fill="#ffffff"/>
    <path class="grid" d="M0 200h600M300 0v400"/>

    <!-- Gradient axes -->
    <g transform="translate(100 100)">
        <path d="M0 0l30 0" stroke="#ff0000" stroke-width="2"/>
        <path d="M0 0l0 30" stroke="#00ff00" stroke-width="2"/>
        <text x="35" y="5" fill="#ff0000" class="text">Ix</text>
        <text x="5" y="35" fill="#00ff00" class="text">Iy</text>
    </g>

    <!-- Feature windows -->
    <rect class="window" x="80" y="80" width="40" height="40"/>
    <rect class="window" x="140" y="120" width="40" height="40"/>
    <path class="arrow" stroke="#0000ff" d="M120 100 Q160 100, 180 140"/>

    <!-- Equations -->
    <text x="400" y="50" class="text">
        <tspan x="400" y="50">[ΣIx²  ΣIxIy] [vx] = [ΣIxIt]</tspan>
        <tspan x="400" y="70">[ΣIxIy ΣIy² ] [vy]   [ΣIyIt]</tspan>
    </text>

    <!-- Code example -->
    <rect class="code-bg" x="350" y="100" width="230" height="90" rx="5"/>
    <text x="360" y="120" class="text" fill="#000000">
        <tspan x="360" y="120">// Compute gradients</tspan>
        <tspan x="360" y="140">for (int y=0; y&lt;window_size; y++) {</tspan>
        <tspan x="380" y="160">Ix = (right - left)/2;</tspan>
        <tspan x="380" y="180">Iy = (bottom - top)/2;</tspan>
        <tspan x="360" y="200">}</tspan>
    </text>

    <!-- Legend -->
    <text x="20" y="380" class="text" fill="#000000">Frame t</text>
    <text x="320" y="380" class="text" fill="#000000">Frame t+Δt</text>
    <defs>
        <marker id="arrowhead" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto">
            <polygon points="0 0, 5 2.5, 0 5" fill="#0000ff"/>
        </marker>
    </defs>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" text-anchor="middle" font-size="18">Least Squares Motion Estimation</text>
  
  <!-- Local Window -->
  <g transform="translate(100 100)">
    <rect x="0" y="0" width="200" height="200" fill="#fff" stroke="#ccc"/>
    <rect x="80" y="80" width="40" height="40" fill="none" stroke="#ff00ff" stroke-width="2"/>
    <text x="100" y="70" text-anchor="middle" fill="#ff00ff">5x5 window</text>
    
    <!-- Equations -->
    <text x="220" y="30" font-family="monospace" font-size="10">
      For each pixel in window:
      [Ix(p1) Iy(p1)] [u]   = -It(p1)
      [Ix(p2) Iy(p2)] [v]    = -It(p2)
      [...     ...   ]       = ...
    </text>
    
    <!-- Matrix Form -->
    <text x="220" y="120" font-family="monospace" font-size="10">
      A = [Ix(p1) Iy(p1)
           Ix(p2) Iy(p2)
           ...    ...   ]
      b = [-It(p1)
           -It(p2)
           ...    ]
    </text>
    
    <!-- Solution -->
    <text x="220" y="180" font-family="monospace" font-size="12">
      Solve: (AᵀA)d = Aᵀb
      d = (AᵀA)⁻¹Aᵀb
    </text>
  </g>
  
  <!-- Code -->
  <text x="20" y="370" font-family="monospace" font-size="10" fill="#333">
    // C++: Solve Lucas-Kanade
    cv::Mat A(window_area, 2, CV_32F);
    cv::Mat b(window_area, 1, CV_32F);
    // ... fill A and b ...
    cv::Mat vel = (A.t() * A).inv() * A.t() * b;
  </text>
</svg>
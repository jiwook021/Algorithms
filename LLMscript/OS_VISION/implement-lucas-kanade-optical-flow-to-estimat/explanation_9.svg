<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle">Least Squares Solution</text>
    
    <!-- Equation System -->
    <text x="100" y="100" font-size="14">
        <tspan x="100" y="100">Iₓ₁·u + Iᵧ₁·v = -Iₜ₁</tspan>
        <tspan x="100" y="120">Iₓ₂·u + Iᵧ₂·v = -Iₜ₂</tspan>
        <tspan x="100" y="140">...</tspan>
        <tspan x="100" y="160">Iₓₙ·u + Iᵧₙ·v = -Iₜₙ</tspan>
    </text>
    
    <!-- Matrix Form -->
    <text x="300" y="150" font-size="16">
        A = [Iₓ Iᵧ]   b = [-Iₜ]
    </text>
    <text x="300" y="200" font-size="18">
        (AᵀA)d = Aᵀb
    </text>
    
    <!-- Solution -->
    <path d="M400,250 L500,250 L500,300 L400,300 Z" fill="#fff" stroke="#666"/>
    <text x="450" y="270" text-anchor="middle" font-size="16">d = (u,v)</text>
    
    <!-- Code -->
    <text x="50" y="250" font-family="monospace" font-size="12">
        <tspan x="50" y="270">// Solve least squares</tspan>
        <tspan x="50" y="290">Matrix2d ATA = Ix.transpose() * Ix;</tspan>
        <tspan x="50" y="310">Vector2d ATb = Ix.transpose() * It;</tspan>
        <tspan x="50" y="330">Vector2d d = ATA.ldlt().solve(ATb);</tspan>
    </text>
    
    <!-- Neighborhood -->
    <rect x="450" y="80" width="100" height="100" fill="none" stroke="#666"/>
    <circle cx="500" cy="130" r="3" fill="red"/>
    <text x="500" y="70" text-anchor="middle">5x5 Window</text>
</svg>
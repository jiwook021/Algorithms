<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="300" y="30" text-anchor="middle" font-size="18">Spatio-Temporal Gradient Calculation</text>
  
  <!-- Pixel Grid -->
  <g transform="translate(100 100)">
    <rect x="0" y="0" width="200" height="200" fill="#fff" stroke="#ccc"/>
    <path d="M0 100h200M100 0v200" stroke="#ccc"/>
    <circle cx="100" cy="100" r="40" fill="#ffcc00"/>
    
    <!-- Gradients -->
    <path d="M100 100l50 0" stroke="#0000ff" stroke-width="2" marker-end="url(#arrowX)"/>
    <path d="M100 100l0 50" stroke="#ff0000" stroke-width="2" marker-end="url(#arrowY)"/>
    <path d="M100 100l-30-30" stroke="#00aa00" stroke-width="2" marker-end="url(#arrowT)"/>
    
    <text x="160" y="110" fill="#0000ff">Ix (X gradient)</text>
    <text x="110" y="160" fill="#ff0000">Iy (Y gradient)</text>
    <text x="70" y="70" fill="#00aa00">It (Time gradient)</text>
  </g>
  
  <!-- Equations -->
  <text x="400" y="120" font-family="monospace" font-size="12">
    ∂I/∂x = Ix (Sobel X)
    ∂I/∂y = Iy (Sobel Y)
    ∂I/∂t = It (Frame diff)
  </text>
  
  <!-- Code -->
  <text x="20" y="370" font-family="monospace" font-size="10" fill="#333">
    // C++: Compute gradients
    cv::Mat Ix, Iy, It;
    cv::Sobel(prev_frame, Ix, CV_32F, 1, 0);
    cv::Sobel(prev_frame, Iy, CV_32F, 0, 1);
    cv::subtract(prev_frame, next_frame, It);
  </text>
  
  <defs>
    <marker id="arrowX" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0000ff"/>
    </marker>
    <marker id="arrowY" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff0000"/>
    </marker>
    <marker id="arrowT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#00aa00"/>
    </marker>
  </defs>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle">Brightness Constancy Assumption</text>
    
    <!-- Previous Frame -->
    <rect x="50" y="80" width="200" height="200" fill="none" stroke="black"/>
    <circle cx="150" cy="180" r="15" fill="#ff4444"/>
    <text x="150" y="260" text-anchor="middle">Frame t</text>
    
    <!-- Next Frame -->
    <rect x="350" y="80" width="200" height="200" fill="none" stroke="black"/>
    <circle cx="380" cy="190" r="15" fill="#44ff44"/>
    <text x="450" y="260" text-anchor="middle">Frame t+1</text>
    
    <!-- Motion Vector -->
    <path d="M165,180 L365,190" stroke="#4444ff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="265" y="170" text-anchor="middle" fill="#4444ff">Motion Vector (u,v)</text>
    
    <!-- Equation -->
    <text x="300" y="350" text-anchor="middle" font-size="18">
        I(x,y,t) = I(x+u,y+v,t+Δt)
    </text>
    
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#4444ff"/>
        </marker>
    </defs>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle">Spatial Gradient Constraints</text>
    
    <!-- Image Window -->
    <rect x="200" y="100" width="200" height="200" fill="#fff" stroke="#666"/>
    
    <!-- Pixel Grid -->
    <path d="M300,100 V300 M200,200 H400" stroke="#ccc" stroke-dasharray="4"/>
    
    <!-- Gradients -->
    <path d="M250,150 h40" stroke="#ff4444" stroke-width="3"/>
    <path d="M250,150 v40" stroke="#44ff44" stroke-width="3"/>
    <path d="M250,150 l20,20" stroke="#4444ff" stroke-width="3"/>
    
    <!-- Labels -->
    <text x="290" y="140" fill="#ff4444">Iₓ (x-gradient)</text>
    <text x="340" y="170" fill="#44ff44">Iᵧ (y-gradient)</text>
    <text x="280" y="200" fill="#4444ff">Iₜ (t-gradient)</text>
    
    <!-- Equation -->
    <text x="300" y="350" text-anchor="middle" font-size="16">
        Iₓ·u + Iᵧ·v = -Iₜ
    </text>
    
    <!-- Code -->
    <text x="50" y="100" font-family="monospace" font-size="12">
        <tspan x="50" y="120">// Compute gradients</tspan>
        <tspan x="50" y="140">Sobel(frame, Ix, 1, 0);</tspan>
        <tspan x="50" y="160">Sobel(frame, Iy, 0, 1);</tspan>
        <tspan x="50" y="180">It = nextFrame - prevFrame;</tspan>
    </text>
</svg>
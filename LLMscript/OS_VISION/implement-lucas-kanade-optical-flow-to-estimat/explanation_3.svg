<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Least Squares Solution -->
    <text x="50" y="50" font-size="16" font-family="monospace" fill="navy">
        Least Squares Solution:
    </text>
    
    <!-- Matrix Visualization -->
    <rect x="100" y="100" width="80" height="80" fill="#e6f3ff" stroke="blue"/>
    <text x="140" y="140" font-size="20" fill="blue">A</text>
    
    <rect x="200" y="100" width="40" height="80" fill="#ffe6e6" stroke="red"/>
    <text x="220" y="140" font-size="20" fill="red">v</text>
    
    <rect x="260" y="100" width="40" height="80" fill="#e6ffe6" stroke="green"/>
    <text x="280" y="140" font-size="20" fill="green">b</text>
    
    <!-- Equation Elements -->
    <text x="180" y="130" font-size="30">×</text>
    <text x="240" y="130" font-size="30">=</text>
    
    <!-- Code Example -->
    <text x="100" y="250" font-size="12" font-family="monospace" fill="black">
        // C++: Solve using Eigen
        <tspan x="100" dy="20">Matrix2f ATA = A.transpose() * A;</tspan>
        <tspan x="100" dy="20">Vector2f ATb = A.transpose() * b;</tspan>
        <tspan x="100" dy="20">Vector2f v = ATA.ldlt().solve(ATb);</tspan>
    </text>
    
    <!-- Neighborhood Windows -->
    <g transform="translate(400 100)">
        <rect x="0" y="0" width="120" height="120" fill="none" stroke="purple"/>
        <rect x="40" y="40" width="40" height="40" fill="#ffccff" stroke="darkred"/>
        <text x="50" y="30" font-size="12">5×5 window</text>
        <text x="10" y="70" font-size="12">Gx, Gy</text>
    </g>
</svg>
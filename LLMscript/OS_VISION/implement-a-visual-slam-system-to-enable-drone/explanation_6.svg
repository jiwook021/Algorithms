<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Bundle Adjustment -->
  <rect width="600" height="400" fill="#f0f0f0"/>
  
  <!-- 3D Points -->
  <circle cx="300" cy="200" r="5" fill="#4444ff"/>
  <circle cx="350" cy="180" r="5" fill="#4444ff"/>
  <circle cx="250" cy="220" r="5" fill="#4444ff"/>
  
  <!-- Camera Positions -->
  <g transform="translate(200 250)">
    <path d="M-30 0 L30 0 M0 -20 L0 20" stroke="#ff4444"/>
    <text x="-35" y="-25" font-size="12">Cam 1</text>
  </g>
  
  <g transform="translate(400 150)">
    <path d="M-30 0 L30 0 M0 -20 L0 20" stroke="#44aa44"/>
    <text x="-35" y="-25" font-size="12">Cam 2</text>
  </g>
  
  <!-- Projection Lines -->
  <path d="M200 250 L300 200" stroke="#666" stroke-opacity="0.6"/>
  <path d="M200 250 L350 180" stroke="#666" stroke-opacity="0.6"/>
  <path d="M400 150 L300 200" stroke="#666" stroke-opacity="0.6"/>
  <path d="M400 150 L250 220" stroke="#666" stroke-opacity="0.6"/>
  
  <!-- Error Dots -->
  <circle cx="280" cy="210" r="3" fill="#ff0000"/>
  <circle cx="340" cy="185" r="3" fill="#ff0000"/>
  
  <!-- Code Example -->
  <rect x="50" y="300" width="500" height="80" fill="#e0e0e0" rx="5"/>
  <text x="70" y="330" font-size="12" font-family="monospace">
    <tspan fill="#0000ff">void</tspan> bundleAdjustment(</text>
  <text x="90" y="350" font-size="12" font-family="monospace">
    vector&lt;Point3d&gt;&amp; points, vector&lt;SE3&gt;&amp; poses,</text>
  <text x="90" y="370" font-size="12" font-family="monospace">
    ceres::Problem&amp; problem <tspan fill="#008800">// Optimization setup</tspan>)</text>
</svg>
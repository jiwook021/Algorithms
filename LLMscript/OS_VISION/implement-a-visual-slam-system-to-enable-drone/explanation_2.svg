<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#FDF2E9"/>
    
    <!-- 3D Map Points -->
    <circle cx="200" cy="300" r="4" fill="#7D3C98"/>
    <circle cx="250" cy="280" r="4" fill="#7D3C98"/>
    <circle cx="300" cy="250" r="4" fill="#7D3C98"/>
    <text x="200" y="320" font-size="14" fill="#7D3C98">3D Landmarks</text>
    
    <!-- Camera Pose -->
    <g transform="translate(400 200)">
        <path d="M-30 0 L30 0 M0 -30 L0 30" stroke="#2E86C1"/>
        <path d="M0 0 L0 -50" stroke="#E74C3C" stroke-width="2"/>
        <text x="0" y="-60" font-size="12" text-anchor="middle" fill="#E74C3C">Z</text>
        <text x="40" y="0" font-size="12" fill="#2E86C1">X</text>
        <text x="-40" y="0" font-size="12" fill="#2E86C1">Y</text>
    </g>
    <text x="400" y="250" font-size="14" fill="#2E86C1">Camera Pose</text>
    
    <!-- Bundle Adjustment -->
    <path d="M300 200 L400 200" stroke="#28B463" stroke-width="2" stroke-dasharray="4"/>
    <text x="350" y="190" font-size="14" text-anchor="middle" fill="#28B463">Bundle Adjustment</text>
    
    <!-- C++ Code Example -->
    <rect x="50" y="50" width="300" height="100" fill="#1C2833" rx="5"/>
    <text x="60" y="70" font-size="12" font-family="monospace" fill="#85C1E9">
        <tspan x="60" dy="1.2em">// Pose estimation</tspan>
        <tspan x="60" dy="1.2em">solvePnP(worldPoints, imagePoints,</tspan>
        <tspan x="60" dy="1.2em">        cameraMatrix, distCoeffs,</tspan>
        <tspan x="60" dy="1.2em">        rvec, tvec);</tspan>
    </text>
</svg>
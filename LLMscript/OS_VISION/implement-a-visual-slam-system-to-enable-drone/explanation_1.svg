<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#F0F8FF"/>
    
    <!-- Camera Input -->
    <rect x="50" y="150" width="150" height="100" fill="#2E86C1" rx="10"/>
    <text x="125" y="140" font-size="14" text-anchor="middle" fill="#2E86C1">Drone Camera</text>
    
    <!-- Feature Points -->
    <circle cx="300" cy="200" r="5" fill="#E74C3C"/>
    <circle cx="320" cy="180" r="5" fill="#E74C3C"/>
    <circle cx="280" cy="220" r="5" fill="#E74C3C"/>
    <text x="300" y="250" font-size="14" text-anchor="middle" fill="#E74C3C">ORB Features</text>
    
    <!-- Feature Matching Lines -->
    <path d="M210 200 L290 200" stroke="#28B463" stroke-width="2"/>
    <path d="M210 180 L310 180" stroke="#28B463" stroke-width="2"/>
    <text x="400" y="180" font-size="14" fill="#28B463">Feature Matching</text>
    
    <!-- C++ Code Example -->
    <rect x="400" y="50" width="180" height="120" fill="#1C2833" rx="5"/>
    <text x="410" y="70" font-size="12" font-family="monospace" fill="#85C1E9">
        <tspan x="410" dy="1.2em">// Feature extraction</tspan>
        <tspan x="410" dy="1.2em">ORB detector;</tspan>
        <tspan x="410" dy="1.2em">vector&lt;KeyPoint&gt; kp;</tspan>
        <tspan x="410" dy="1.2em">Mat descriptors;</tspan>
        <tspan x="410" dy="1.2em">detector.detectAndCompute(</tspan>
        <tspan x="410" dy="1.2em">  frame, noArray(), kp, descriptors);</tspan>
    </text>
</svg>
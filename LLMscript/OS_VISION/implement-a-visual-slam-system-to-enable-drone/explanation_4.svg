<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Feature Detection and Matching -->
  <rect width="600" height="400" fill="#f0f0f0"/>
  
  <!-- Camera Frames -->
  <rect x="50" y="50" width="200" height="150" fill="#fff" stroke="#333"/>
  <rect x="350" y="50" width="200" height="150" fill="#fff" stroke="#333"/>
  <text x="150" y="30" font-size="14">Frame t</text>
  <text x="450" y="30" font-size="14">Frame t+1</text>
  
  <!-- Feature Points -->
  <circle cx="100" cy="100" r="5" fill="#ff4444"/>
  <circle cx="150" cy="120" r="5" fill="#ff4444"/>
  <circle cx="180" cy="90" r="5" fill="#ff4444"/>
  
  <circle cx="400" cy="110" r="5" fill="#44ff44"/>
  <circle cx="450" cy="130" r="5" fill="#44ff44"/>
  <circle cx="480" cy="100" r="5" fill="#44ff44"/>
  
  <!-- Matching Lines -->
  <path d="M100,100 L400,110" stroke="#666" stroke-dasharray="4"/>
  <path d="M150,120 L450,130" stroke="#666" stroke-dasharray="4"/>
  <path d="M180,90 L480,100" stroke="#666" stroke-dasharray="4"/>
  
  <!-- Code Example -->
  <rect x="50" y="250" width="500" height="100" fill="#e0e0e0" rx="5"/>
  <text x="70" y="280" font-size="12" font-family="monospace">
    <tspan fill="#0000ff">void</tspan> detectFeatures(Frame&amp; frame) {</text>
  <text x="90" y="300" font-size="12" font-family="monospace">
    <tspan fill="#008800">// ORB feature detection</tspan></text>
  <text x="90" y="320" font-size="12" font-family="monospace">
    cv::ORB::detectAndCompute(frame.img, frame.keypoints, frame.descriptors);</text>
  <text x="70" y="340" font-size="12" font-family="monospace">}</text>
</svg>
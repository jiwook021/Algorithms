<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Allocation Process -->
    <rect x="50" y="50" width="500" height="300" fill="#fff" stroke="#333" stroke-width="2"/>
    
    <!-- Steps -->
    <g font-family="sans-serif" font-size="14">
        <!-- Step 1 -->
        <circle cx="150" cy="150" r="40" fill="#FFD700"/>
        <text x="150" y="155" text-anchor="middle">1</text>
        <text x="150" y="230" text-anchor="middle">Check Free List</text>
        
        <!-- Step 2 -->
        <circle cx="300" cy="150" r="40" fill="#00BFFF"/>
        <text x="300" y="155" text-anchor="middle">2</text>
        <text x="300" y="230" text-anchor="middle">Find Free Chunk</text>
        
        <!-- Step 3 -->
        <circle cx="450" cy="150" r="40" fill="#32CD32"/>
        <text x="450" y="155" text-anchor="middle">3</text>
        <text x="450" y="230" text-anchor="middle">Update Bitmap</text>
        
        <!-- Arrows -->
        <path d="M190 150 L260 150" stroke="#333" fill="none" stroke-width="2"/>
        <path d="M340 150 L410 150" stroke="#333" fill="none" stroke-width="2"/>
    </g>
    
    <!-- Code Sample -->
    <g transform="translate(100 260)">
        <text x="20" y="0" font-family="monospace" font-size="12" fill="#333">
            <tspan x="20" y="0">void* Slab::allocate() {</tspan>
            <tspan x="40" y="20">for (size_t i = 0; i &lt; bitmap.size(); ++i) {</tspan>
            <tspan x="60" y="40">if (bitmap[i] == false) {</tspan>
            <tspan x="80" y="60">bitmap[i] = true;</tspan>
            <tspan x="80" y="80">return memory + (i * chunk_size);</tspan>
            <tspan x="20" y="100">}</tspan>
        </text>
    </g>
</svg>
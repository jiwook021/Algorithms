<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Slab Structure -->
    <rect x="50" y="50" width="500" height="300" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="60" y="60" width="480" height="40" fill="#a0d8ef" rx="3"/>
    <text x="300" y="85" font-family="monospace" font-size="14" text-anchor="middle">Slab Header (metadata)</text>
    
    <!-- Memory Chunks -->
    <g transform="translate(60 110)">
        <rect width="480" height="230" fill="#e0e0e0"/>
        <g font-family="monospace" font-size="12">
            <!-- Free chunks -->
            <rect x="10" y="10" width="100" height="100" fill="#90EE90"/>
            <text x="60" y="60" text-anchor="middle">Free</text>
            <rect x="120" y="10" width="100" height="100" fill="#90EE90"/>
            <text x="170" y="60" text-anchor="middle">Free</text>
            
            <!-- Allocated chunks -->
            <rect x="230" y="10" width="100" height="100" fill="#FFB6C1"/>
            <text x="280" y="60" text-anchor="middle">Allocated</text>
            <rect x="340" y="10" width="100" height="100" fill="#FFB6C1"/>
            <text x="390" y="60" text-anchor="middle">Allocated</text>
        </g>
    </g>
    
    <!-- Code Sample -->
    <g transform="translate(50 260)">
        <text x="20" y="140" font-family="monospace" font-size="12" fill="#333">
            <tspan x="20" y="140">class Slab {</tspan>
            <tspan x="30" y="160">void* memory;</tspan>
            <tspan x="30" y="180">size_t chunk_size;</tspan>
            <tspan x="30" y="200">std::vector&lt;bool&gt; bitmap;</tspan>
            <tspan x="20" y="220">};</tspan>
        </text>
    </g>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="20">Slab Structure &amp; Chunk Organization</text>
    
    <!-- Slab container -->
    <rect x="50" y="100" width="500" height="120" fill="#d0e8ff" stroke="#2c6aa6" stroke-width="2"/>
    
    <!-- Chunks -->
    <g transform="translate(60 110)">
        <rect width="80" height="100" fill="#ffffff" stroke="#2c6aa6"/>
        <text x="40" y="60" text-anchor="middle" fill="#2c6aa6">Object 1</text>
    </g>
    <use href="#chunk" x="150"/>
    <use href="#chunk" x="240"/>
    <use href="#chunk" x="330"/>
    <use href="#chunk" x="420"/>
    
    <!-- Free list pointers -->
    <path d="M145,160 L195,160 L195,140 L185,140" stroke="#ff4444" fill="none" stroke-width="2"/>
    <path d="M235,160 L285,160 L285,140 L275,140" stroke="#ff4444" fill="none" stroke-width="2"/>
    <text x="300" y="250" text-anchor="middle" font-size="14">Free List: Chunk3 → Chunk5 → ...</text>
    
    <!-- C++ code snippet -->
    <g transform="translate(50 260)">
        <rect width="500" height="120" fill="#e0e0e0" rx="5"/>
        <text x="10" y="25" font-family="monospace" font-size="12" fill="#000">
            <tspan x="10" dy="1.2em">struct Slab {</tspan>
            <tspan x="20" dy="1.2em">    char* memory;</tspan>
            <tspan x="20" dy="1.2em">    size_t object_size;</tspan>
            <tspan x="20" dy="1.2em">    void** free_list;</tspan>
            <tspan x="10" dy="1.2em">};</tspan>
        </text>
    </g>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Slab Structure -->
    <rect x="50" y="100" width="500" height="60" fill="#c0d9ff" rx="5"/>
    <rect x="50" y="160" width="500" height="140" fill="#e0e0e0" rx="5"/>
    
    <!-- Slab Header -->
    <rect x="50" y="100" width="100" height="60" fill="#4a90d6"/>
    <text x="100" y="130" font-family="monospace" font-size="14" fill="white" text-anchor="middle">Slab Header</text>
    
    <!-- Object Blocks -->
    <g transform="translate(160, 160)">
        <rect x="0" y="0" width="60" height="140" fill="#78c679"/>
        <rect x="70" y="0" width="60" height="140" fill="#78c679"/>
        <rect x="140" y="0" width="60" height="140" fill="#78c679"/>
        <rect x="210" y="0" width="60" height="140" fill="#78c679"/>
        <rect x="280" y="0" width="60" height="140" fill="#78c679"/>
        <rect x="350" y="0" width="60" height="140" fill="#78c679"/>
    </g>
    
    <!-- Labels -->
    <text x="300" y="70" font-family="sans-serif" font-size="18" fill="#333" text-anchor="middle">Slab Structure</text>
    <text x="300" y="340" font-family="monospace" font-size="12" fill="#666" text-anchor="middle">Each slab contains header + fixed-size object blocks</text>
    <text x="160" y="180" font-family="monospace" font-size="12" fill="black">Free</text>
    <text x="230" y="180" font-family="monospace" font-size="12" fill="black">Allocated</text>
</svg>
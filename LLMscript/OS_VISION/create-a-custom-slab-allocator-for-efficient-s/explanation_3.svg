<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="20">Deallocation &amp; Memory Reuse</text>
    
    <!-- Memory layout -->
    <rect x="50" y="80" width="500" height="120" fill="#d0e8ff" stroke="#2c6aa6" stroke-width="2"/>
    
    <!-- Used chunk -->
    <rect x="150" y="90" width="80" height="100" fill="#ffd9d9" stroke="#ff4444"/>
    <text x="190" y="140" text-anchor="middle" fill="#000">To free</text>
    
    <!-- Free list update -->
    <path d="M190,190 L190,250 L60,250 L60,190" stroke="#00aa00" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="125" y="240" text-anchor="middle">Add to free list head</text>
    
    <!-- Code snippet -->
    <g transform="translate(50 280)">
        <rect width="500" height="100" fill="#e0e0e0" rx="5"/>
        <text x="10" y="25" font-family="monospace" font-size="12" fill="#000">
            <tspan x="10" dy="1.2em">void SlabAllocator::deallocate(void* ptr) {</tspan>
            <tspan x="20" dy="1.2em">    *(void**)ptr = free_list;</tspan>
            <tspan x="20" dy="1.2em">    free_list = ptr;</tspan>
            <tspan x="10" dy="1.2em">}</tspan>
        </text>
    </g>
    
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#00aa00"/>
        </marker>
    </defs>
</svg>
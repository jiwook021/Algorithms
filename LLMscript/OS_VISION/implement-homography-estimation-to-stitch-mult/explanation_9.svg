<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#eef"/>
  <!-- Warped Images -->
  <g transform="skewX(-10) translate(100,100)">
    <rect width="200" height="200" fill="#fdd" opacity="0.8"/>
    <text x="100" y="220" font-size="14">Warped Image 1</text>
  </g>
  <g transform="skewX(5) translate(300,80)">
    <rect width="200" height="200" fill="#dfd" opacity="0.8"/>
    <text x="100" y="220" font-size="14">Warped Image 2</text>
  </g>
  <!-- Blending Area -->
  <rect x="350" y="100" width="100" height="150" fill="url(#grad)" opacity="0.6"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdd"/>
      <stop offset="100%" stop-color="#dfd"/>
    </linearGradient>
  </defs>
  <!-- Code Example -->
  <g transform="translate(50,300)">
    <text x="0" y="0" font-family="monospace" font-size="12">
      <tspan x="0" y="0">// Warp and blend images</tspan>
      <tspan x="0" y="20">warpPerspective(img1, warped1, H, size);</tspan>
      <tspan x="0" y="40">addWeighted(warped1, 0.5, warped2, 0.5, 0);</tspan>
    </text>
  </g>
  <text x="300" y="50" font-size="18" text-anchor="middle">Image Warping &amp; Blending</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#ffe"/>
  <!-- Feature Points -->
  <g transform="translate(50,100)">
    <rect x="0" y="0" width="200" height="200" fill="#ddf" stroke="#333"/>
    <circle cx="180" cy="50" r="5" fill="#f00"/>
    <circle cx="150" cy="180" r="5" fill="#f00"/>
    <circle cx="80" cy="120" r="5" fill="#f00"/>
    <text x="100" y="220" font-size="14">Image 1</text>
  </g>
  <g transform="translate(350,100)">
    <rect x="0" y="0" width="200" height="200" fill="#dfd" stroke="#333"/>
    <circle cx="20" cy="60" r="5" fill="#00f"/>
    <circle cx="50" cy="170" r="5" fill="#00f"/>
    <circle cx="120" cy="110" r="5" fill="#00f"/>
    <text x="100" y="220" font-size="14">Image 2</text>
  </g>
  <!-- Matching Lines -->
  <path d="M250,150 L350,160" stroke="#880" stroke-width="2"/>
  <path d="M200,280 L400,270" stroke="#880" stroke-width="2"/>
  <path d="M130,220 L430,210" stroke="#880" stroke-width="2"/>
  <text x="300" y="50" font-size="18" text-anchor="middle">Feature Matching</text>
  <text x="300" y="350" font-size="14" fill="#666" text-anchor="middle">Find corresponding points between images using SIFT/ORB</text>
</svg>
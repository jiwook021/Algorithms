<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  
  <!-- Left image frame -->
  <rect x="50" y="100" width="200" height="200" fill="none" stroke="#666" stroke-width="2"/>
  <text x="150" y="320" font-size="14" text-anchor="middle">Image 1</text>
  
  <!-- Right image frame -->
  <rect x="350" y="100" width="200" height="200" fill="none" stroke="#666" stroke-width="2"/>
  <text x="450" y="320" font-size="14" text-anchor="middle">Image 2</text>
  
  <!-- Feature points -->
  <g id="features1">
    <circle cx="100" cy="200" r="5" fill="#ff4444"/>
    <circle cx="200" cy="150" r="5" fill="#ff4444"/>
    <circle cx="150" cy="250" r="5" fill="#ff4444"/>
  </g>
  
  <g id="features2">
    <circle cx="400" cy="180" r="5" fill="#4444ff"/>
    <circle cx="500" cy="130" r="5" fill="#4444ff"/>
    <circle cx="450" cy="230" r="5" fill="#4444ff"/>
  </g>
  
  <!-- Matching lines -->
  <path d="M100,200 L400,180" stroke="#00cc66" stroke-width="2" stroke-dasharray="4"/>
  <path d="M200,150 L500,130" stroke="#00cc66" stroke-width="2" stroke-dasharray="4"/>
  <path d="M150,250 L450,230" stroke="#00cc66" stroke-width="2" stroke-dasharray="4"/>
  
  <!-- Title -->
  <text x="300" y="50" font-size="20" text-anchor="middle" fill="#333">Feature Matching Between Images</text>
  
  <!-- Code example -->
  <g transform="translate(50 350)">
    <text x="0" y="0" font-family="monospace" font-size="12" fill="#333">
      <tspan x="0" dy="1.2em">// C++ feature matching example:</tspan>
      <tspan x="0" dy="1.2em">BFMatcher matcher(NORM_HAMMING);</tspan>
      <tspan x="0" dy="1.2em">vector&lt;DMatch> matches;</tspan>
      <tspan x="0" dy="1.2em">matcher.match(desc1, desc2, matches);</tspan>
    </text>
  </g>
</svg>
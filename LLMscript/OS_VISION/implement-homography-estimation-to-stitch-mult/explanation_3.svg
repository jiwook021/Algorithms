<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <!-- Image Warping Visualization -->
    <rect x="50" y="100" width="200" height="200" fill="#a0d8ef" stroke="#333"/>
    <path d="M250,100 L350,80 550,120 450,300 250,300" fill="#f4a0a0" stroke="#333"/>
    
    <!-- Warping Grid -->
    <path d="M50 100h200M50 150h200M50 200h200M50 250h200M50 300h200" stroke="#666" opacity="0.5"/>
    <path d="M250 100v200M300 80v220M350 120v180M400 160v140M450 180v120M500 200v100M550 120v180" 
          stroke="#cc0000" opacity="0.5"/>
    
    <!-- Blending Area -->
    <path d="M250 100 L350 80 550 120 450 300 250 300" fill="url(#gradient)" stroke="none"/>
    <defs>
        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f4a0a0" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#a0d8ef" stop-opacity="0.5"/>
        </linearGradient>
    </defs>
    
    <!-- Labels -->
    <text x="120" y="80" font-size="14">Source Image</text>
    <text x="400" y="60" font-size="14">Warped Image</text>
    <text x="300" y="340" font-size="14" text-anchor="middle">Image Warping and Blending</text>
    
    <!-- Code Example -->
    <rect x="100" y="350" width="400" height="30" fill="#e0e0e0" rx="3"/>
    <text x="120" y="370" font-size="12" font-family="monospace">cv::warpPerspective(src, dst, H, size, INTER_LINEAR);</text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <!-- Homography Matrix Visualization -->
    <rect x="150" y="100" width="300" height="150" fill="#fff" stroke="#333" rx="5"/>
    
    <!-- Matrix Entries -->
    <text x="170" y="140" font-size="14" font-family="monospace">[ h11  h12  h13 ]</text>
    <text x="170" y="170" font-size="14" font-family="monospace">[ h21  h22  h23 ]</text>
    <text x="170" y="200" font-size="14" font-family="monospace">[ h31  h32   1  ]</text>
    
    <!-- Projection Equation -->
    <path d="M100,250 L500,250" stroke="#333" stroke-width="1"/>
    <text x="300" y="280" font-size="14" text-anchor="middle">x' = (h11x + h12y + h13)/(h31x + h32y + 1)</text>
    <text x="300" y="300" font-size="14" text-anchor="middle">y' = (h21x + h22y + h23)/(h31x + h32y + 1)</text>
    
    <!-- Code Example -->
    <rect x="100" y="320" width="400" height="60" fill="#e0e0e0" rx="3"/>
    <text x="120" y="340" font-size="12" font-family="monospace">cv::Mat H = findHomography(points1, points2,</text>
    <text x="120" y="360" font-size="12" font-family="monospace">    RANSAC, 3);</text>
    
    <!-- Title -->
    <text x="300" y="50" font-size="16" text-anchor="middle" fill="#333">Homography Matrix (3x3)</text>
</svg>
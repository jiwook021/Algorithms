<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Source and target image planes -->
    <rect x="50" y="100" width="200" height="150" fill="#a6c1ee" stroke="#2d5aa7" stroke-width="2"/>
    <rect x="350" y="100" width="200" height="150" fill="#97d9b7" stroke="#2d7d59" stroke-width="2"/>
    
    <!-- Corresponding points -->
    <g stroke-width="2">
        <circle cx="150" cy="150" r="5" fill="#ff0000"/>
        <circle cx="450" cy="150" r="5" fill="#ff0000"/>
        <circle cx="100" cy="200" r="5" fill="#0000ff"/>
        <circle cx="400" cy="200" r="5" fill="#0000ff"/>
        <circle cx="200" cy="180" r="5" fill="#00ff00"/>
        <circle cx="500" cy="180" r="5" fill="#00ff00"/>
    </g>
    
    <!-- Connection lines -->
    <path d="M150 150 L450 150" stroke="#555" stroke-dasharray="4"/>
    <path d="M100 200 L400 200" stroke="#555" stroke-dasharray="4"/>
    <path d="M200 180 L500 180" stroke="#555" stroke-dasharray="4"/>
    
    <!-- Homography matrix -->
    <rect x="250" y="150" width="100" height="80" fill="#fff" stroke="#000"/>
    <text x="255" y="170" font-size="12" font-family="monospace">[h11 h12 h13]</text>
    <text x="255" y="190" font-size="12" font-family="monospace">[h21 h22 h23]</text>
    <text x="255" y="210" font-size="12" font-family="monospace">[h31 h32 1 ]</text>
    <text x="270" y="130" font-size="14" fill="#333">Homography</text>
    
    <!-- Code example -->
    <rect x="50" y="280" width="500" height="90" fill="#f0f0f0" rx="5"/>
    <text x="60" y="300" font-size="12" font-family="monospace" fill="#2d5aa7">// C++ homography estimation</text>
    <text x="60" y="320" font-size="12" font-family="monospace" fill="#000">std::vector&lt;cv::Point2f&gt; src_points, dst_points;</text>
    <text x="60" y="340" font-size="12" font-family="monospace" fill="#000">cv::Mat H = cv::findHomography(</text>
    <text x="80" y="360" font-size="12" font-family="monospace" fill="#000">src_points, dst_points, cv::RANSAC);</text>
    
    <!-- Labels -->
    <text x="125" y="90" font-size="14" fill="#2d5aa7">Source Image</text>
    <text x="425" y="90" font-size="14" fill="#2d7d59">Target Image</text>
    <text x="150" cy="150" y="140" font-size="10" fill="#ff0000">(x₁,y₁)</text>
    <text x="450" cy="150" y="140" font-size="10" fill="#ff0000">(x₁',y₁')</text>
</svg>
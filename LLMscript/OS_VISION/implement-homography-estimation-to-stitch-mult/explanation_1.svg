<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <!-- Feature Matching Visualization -->
    <rect x="50" y="100" width="200" height="200" fill="#a0d8ef" stroke="#333" stroke-width="2"/>
    <rect x="350" y="100" width="200" height="200" fill="#f4a0a0" stroke="#333" stroke-width="2"/>
    
    <!-- Feature Points -->
    <circle cx="150" cy="200" r="5" fill="#0066cc"/>
    <circle cx="250" cy="180" r="5" fill="#0066cc"/>
    <circle cx="450" cy="200" r="5" fill="#cc0000"/>
    <circle cx="550" cy="180" r="5" fill="#cc0000"/>
    
    <!-- Matching Lines -->
    <path d="M150,200 L450,200" stroke="#00cc00" stroke-width="2"/>
    <path d="M250,180 L550,180" stroke="#00cc00" stroke-width="2"/>
    
    <!-- Labels -->
    <text x="120" y="80" font-size="14">Image 1</text>
    <text x="420" y="80" font-size="14">Image 2</text>
    <text x="300" y="340" font-size="14" text-anchor="middle">Feature Matching Between Image Pair</text>
    <text x="300" y="360" font-size="12" text-anchor="middle" fill="#666">SIFT/SURF features with RANSAC outlier rejection</text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  
  <!-- Source image -->
  <rect x="50" y="50" width="200" height="300" fill="#aaccff" stroke="#333"/>
  <text x="150" y="40" text-anchor="middle" font-size="14">Source Image</text>
  
  <!-- Warped image -->
  <path d="M350 50 L550 80 L550 320 L350 350 Z" fill="#ffaacc" stroke="#333"/>
  <text x="450" y="40" text-anchor="middle" font-size="14">Warped Image</text>
  
  <!-- Blending area -->
  <path d="M250 50 L350 50 Q 400 100, 350 350 L250 350 Z" fill="url(#grad)" opacity="0.6"/>
  
  <!-- Warping grid -->
  <g transform="translate(50 50)" opacity="0.6">
    <path d="M0 0 L200 0 M0 60 L200 60 M0 120 L200 120 M0 180 L200 180 M0 240 L200 240 M0 300 L200 300
             M0 0 L0 300 M40 0 L40 300 M80 0 L80 300 M120 0 L120 300 M160 0 L160 300 M200 0 L200 300" 
          stroke="#666" stroke-width="0.5"/>
  </g>
  
  <g transform="translate(350 50)" opacity="0.6">
    <path d="M0 30 L200 0 M0 90 L200 60 M0 150 L200 120 M0 210 L200 180 M0 270 L200 240
             M0 30 L200 0 M40 45 L240 15 M80 60 L280 30 M120 75 L320 45 M160 90 L360 60" 
          stroke="#666" stroke-width="0.5"/>
  </g>
  
  <!-- Title -->
  <text x="300" y="30" font-size="18" text-anchor="middle">Image Warping and Blending</text>
  
  <!-- Code example -->
  <text x="50" y="380" font-family="monospace" font-size="12">
    <tspan x="0" dy="0">warpPerspective(src, dst, H, size, INTER_LINEAR);</tspan>
    <tspan x="0" dy="1.2em">addWeighted(dst, 0.5, warped, 0.5, 0, result);</tspan>
  </text>
  
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle">Bounded Buffer Structure</text>
    
    <!-- Buffer visualization -->
    <rect x="100" y="100" width="400" height="60" fill="none" stroke="#333" stroke-width="2"/>
    <rect x="100" y="100" width="80" height="60" fill="#a1d99b" stroke="#333"/>
    <rect x="180" y="100" width="80" height="60" fill="#a1d99b" stroke="#333"/>
    <rect x="260" y="100" width="80" height="60" fill="#a1d99b" stroke="#333"/>
    <rect x="340" y="100" width="80" height="60" fill="#a1d99b" stroke="#333"/>
    <rect x="420" y="100" width="80" height="60" fill="#a1d99b" stroke="#333"/>
    
    <!-- Pointers -->
    <path d="M 110,170 L 140,170 L 140,180 L 130,180 L 140,180 L 140,190 L 110,190 Z" fill="#2b8cbe"/>
    <text x="125" y="210" text-anchor="middle">in</text>
    <path d="M 490,170 L 460,170 L 460,180 L 470,180 L 460,180 L 460,190 L 490,190 Z" fill="#e6550d"/>
    <text x="475" y="210" text-anchor="middle">out</text>
    
    <!-- Semaphores -->
    <rect x="100" y="250" width="120" height="60" fill="#fee6ce" stroke="#333"/>
    <text x="160" y="270" text-anchor="middle">mutex</text>
    <text x="160" y="290" text-anchor="middle">(1)</text>
    
    <rect x="240" y="250" width="120" height="60" fill="#fdae6b" stroke="#333"/>
    <text x="300" y="270" text-anchor="middle">empty</text>
    <text x="300" y="290" text-anchor="middle">(N)</text>
    
    <rect x="380" y="250" width="120" height="60" fill="#fd8d3c" stroke="#333"/>
    <text x="440" y="270" text-anchor="middle">full</text>
    <text x="440" y="290" text-anchor="middle">(0)</text>
    
    <!-- Code snippet -->
    <foreignObject x="50" y="320" width="500" height="70">
        <pre xmlns="http://www.w3.org/1999/xhtml" style="font-family:monospace; margin:0">
const int N = 5;
semaphore mutex(1), empty(N), full(0);
struct log_entry buffer[N];</pre>
    </foreignObject>
</svg>
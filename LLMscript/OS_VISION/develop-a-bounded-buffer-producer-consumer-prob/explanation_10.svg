<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Producer Section -->
    <rect x="50" y="50" width="200" height="120" fill="#d0e8d0" rx="5"/>
    <text x="70" y="80" font-family="sans-serif" font-size="16">Producer Thread</text>
    <path d="M70 100 L230 100" stroke="#606060"/>
    <text x="70" y="120" font-family="monospace" font-size="12">1. sem_wait(&amp;empty)</text>
    <text x="70" y="140" font-family="monospace" font-size="12">2. sem_wait(&amp;mutex)</text>
    <text x="70" y="160" font-family="monospace" font-size="12">3. buffer[in] = new_entry</text>
    
    <!-- Consumer Section -->
    <rect x="350" y="50" width="200" height="120" fill="#e8d0d0" rx="5"/>
    <text x="370" y="80" font-family="sans-serif" font-size="16">Consumer Thread</text>
    <path d="M370 100 L530 100" stroke="#606060"/>
    <text x="370" y="120" font-family="monospace" font-size="12">1. sem_wait(&amp;full)</text>
    <text x="370" y="140" font-family="monospace" font-size="12">2. sem_wait(&amp;mutex)</text>
    <text x="370" y="160" font-family="monospace" font-size="12">3. process(buffer[out])</text>
    
    <!-- Synchronization Arrows -->
    <path d="M250 110 L350 110" stroke="#606060" stroke-dasharray="4"/>
    <path d="M250 140 L350 140" stroke="#404040" marker-mid="url(#arrowMid)"/>
    <path d="M250 170 L350 170" stroke="#606060" stroke-dasharray="4"/>
    
    <!-- Buffer Access Visualization -->
    <rect x="250" y="250" width="100" height="40" fill="#c0c0ff" rx="5"/>
    <text x="260" y="275" font-family="monospace" font-size="12">Critical Section</text>
    <path d="M150 180 L300 250" stroke="#a0a0a0" fill="none"/>
    <path d="M450 180 L300 250" stroke="#a0a0a0" fill="none"/>
    
    <defs>
        <marker id="arrowMid" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#404040"/>
        </marker>
    </defs>
</svg>
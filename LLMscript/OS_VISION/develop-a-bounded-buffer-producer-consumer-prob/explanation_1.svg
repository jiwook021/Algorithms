<svg viewBox="0 0 600 400" width="600" height="400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#F0F8FF"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#2E4053">Bounded Buffer Structure</text>
    
    <!-- Buffer visualization -->
    <rect x="100" y="100" width="400" height="60" fill="none" stroke="#4A90E2" stroke-width="2"/>
    <rect x="100" y="100" width="80" height="60" fill="#E3F2FD" stroke="#4A90E2"/>
    <rect x="180" y="100" width="80" height="60" fill="#E3F2FD" stroke="#4A90E2"/>
    <rect x="260" y="100" width="80" height="60" fill="#E3F2FD" stroke="#4A90E2"/>
    <rect x="340" y="100" width="80" height="60" fill="#E3F2FD" stroke="#4A90E2"/>
    <rect x="420" y="100" width="80" height="60" fill="#E3F2FD" stroke="#4A90E2"/>
    
    <!-- Producer/Consumer arrows -->
    <path d="M50 130 L100 130" stroke="#27AE60" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="75" y="120" fill="#27AE60">Producer</text>
    <path d="M500 130 L550 130" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="525" y="120" fill="#E74C3C">Consumer</text>
    
    <!-- Code sample -->
    <g transform="translate(100 200)">
        <rect x="0" y="0" width="400" height="150" fill="#2C3E50" rx="5"/>
        <text x="20" y="30" font-family="monospace" font-size="14" fill="#ECF0F1">
            <tspan x="10" dy="1.2em">struct Buffer {</tspan>
            <tspan x="20" dy="1.2em">    LogEntry entries[N];</tspan>
            <tspan x="20" dy="1.2em">    sem_t empty, full, mutex;</tspan>
            <tspan x="10" dy="1.2em">};</tspan>
        </text>
    </g>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E4053"/>
        </marker>
    </defs>
</svg>
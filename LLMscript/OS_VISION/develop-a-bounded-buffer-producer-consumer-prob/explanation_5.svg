<svg viewBox="0 0 600 400" width="600" height="400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#F4ECF7"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#2E4053">Concurrency Handling</text>
    
    <!-- Thread visualization -->
    <g transform="translate(50 100)">
        <rect x="0" y="0" width="200" height="180" fill="#D6EAF8" rx="10"/>
        <text x="100" y="30" text-anchor="middle" fill="#2C3E50">Producers</text>
        <circle cx="30" cy="60" r="10" fill="#27AE60"/>
        <circle cx="30" cy="100" r="10" fill="#27AE60"/>
        <path d="M50 60 L170 140" stroke="#2E4053" stroke-dasharray="4"/>
        <path d="M50 100 L170 140" stroke="#2E4053" stroke-dasharray="4"/>
    </g>
    
    <g transform="translate(350 100)">
        <rect x="0" y="0" width="200" height="180" fill="#FADBD8" rx="10"/>
        <text x="100" y="30" text-anchor="middle" fill="#2C3E50">Consumers</text>
        <circle cx="170" cy="60" r="10" fill="#E74C3C"/>
        <circle cx="170" cy="100" r="10" fill="#E74C3C"/>
        <path d="M150 60 L30 140" stroke="#2E4053" stroke-dasharray="4"/>
        <path d="M150 100 L30 140" stroke="#2E4053" stroke-dasharray="4"/>
    </g>
    
    <!-- Buffer access visualization -->
    <g transform="translate(250 140)">
        <rect x="0" y="0" width="100" height="60" fill="#ABEBC6" rx="5"/>
        <text x="50" y="30" text-anchor="middle" fill="#2C3E50">Buffer</text>
        <text x="50" y="50" text-anchor="middle" font-size="12">(mutex protected)</text>
    </g>

    <!-- Code sample -->
    <g transform="translate(150 300)">
        <rect x="0" y="0" width="300" height="70" fill="#34495E" rx="5"/>
        <text x="20" y="30" font-family="monospace" font-size="12" fill="#ECF0F1">
            <tspan x="10" dy="1.2em">std::thread producers[N];</tspan>
            <tspan x="10" dy="1.2em">std::thread consumers[M];</tspan>
        </text>
    </g>
</svg>
<svg viewBox="0 0 600 400" width="600" height="400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#FDEDEC"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#2E4053">Consumer Workflow</text>
    
    <!-- Flowchart -->
    <rect x="100" y="80" width="400" height="240" fill="none" stroke="#E74C3C" stroke-width="2"/>
    
    <g transform="translate(150 100)">
        <circle cx="0" cy="0" r="15" fill="#E74C3C"/>
        <text x="30" y="5" fill="#2E4053">Wait(full)</text>
    </g>
    
    <g transform="translate(150 160)">
        <circle cx="0" cy="0" r="15" fill="#E74C3C"/>
        <text x="30" y="5" fill="#2E4053">Wait(mutex)</text>
    </g>
    
    <g transform="translate(150 220)">
        <circle cx="0" cy="0" r="15" fill="#E74C3C"/>
        <text x="30" y="5" fill="#2E4053">Remove entry</text>
    </g>
    
    <g transform="translate(450 160)">
        <circle cx="0" cy="0" r="15" fill="#E74C3C"/>
        <text x="-100" y="5" fill="#2E4053">Signal(mutex)</text>
    </g>
    
    <g transform="translate(450 100)">
        <circle cx="0" cy="0" r="15" fill="#E74C3C"/>
        <text x="-80" y="5" fill="#2E4053">Signal(empty)</text>
    </g>

    <!-- Code sample -->
    <g transform="translate(100 280)">
        <rect x="0" y="0" width="400" height="90" fill="#2C3E50" rx="5"/>
        <text x="20" y="30" font-family="monospace" font-size="12" fill="#ECF0F1">
            <tspan x="10" dy="1.2em">void consumer() {</tspan>
            <tspan x="20" dy="1.2em">sem_wait(&amp;full);</tspan>
            <tspan x="20" dy="1.2em">sem_wait(&amp;mutex);</tspan>
            <tspan x="20" dy="1.2em">// Remove from buffer</tspan>
            <tspan x="20" dy="1.2em">sem_post(&amp;mutex);</tspan>
            <tspan x="20" dy="1.2em">sem_post(&amp;empty);</tspan>
            <tspan x="10" dy="1.2em">}</tspan>
        </text>
    </g>
</svg>
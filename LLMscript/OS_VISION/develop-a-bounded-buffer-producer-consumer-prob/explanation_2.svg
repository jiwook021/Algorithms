<svg viewBox="0 0 600 400" width="600" height="400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#FDF2E9"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#2E4053">Semaphore Initialization</text>
    
    <!-- Semaphore visualization -->
    <g transform="translate(150 100)">
        <rect x="0" y="0" width="120" height="120" fill="#AED6F1" rx="10"/>
        <text x="60" y="40" text-anchor="middle" fill="#2C3E50">empty</text>
        <text x="60" y="70" text-anchor="middle" font-size="24" fill="#2C3E50">N</text>
    </g>
    
    <g transform="translate(300 100)">
        <rect x="0" y="0" width="120" height="120" fill="#F5B7B1" rx="10"/>
        <text x="60" y="40" text-anchor="middle" fill="#2C3E50">full</text>
        <text x="60" y="70" text-anchor="middle" font-size="24" fill="#2C3E50">0</text>
    </g>
    
    <g transform="translate(450 100)">
        <rect x="0" y="0" width="120" height="120" fill="#ABEBC6" rx="10"/>
        <text x="60" y="40" text-anchor="middle" fill="#2C3E50">mutex</text>
        <text x="60" y="70" text-anchor="middle" font-size="24" fill="#2C3E50">1</text>
    </g>

    <!-- Initialization code -->
    <g transform="translate(100 250)">
        <rect x="0" y="0" width="400" height="100" fill="#34495E" rx="5"/>
        <text x="20" y="30" font-family="monospace" font-size="12" fill="#ECF0F1">
            <tspan x="10" dy="1.2em">sem_init(&amp;buffer->empty, 0, N);</tspan>
            <tspan x="10" dy="1.2em">sem_init(&amp;buffer->full, 0, 0);</tspan>
            <tspan x="10" dy="1.2em">sem_init(&amp;buffer->mutex, 0, 1);</tspan>
        </text>
    </g>
</svg>
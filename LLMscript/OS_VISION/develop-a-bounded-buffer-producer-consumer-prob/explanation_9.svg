<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Circular Buffer Structure -->
    <rect x="200" y="100" width="200" height="60" rx="5" fill="#c0d8e0"/>
    <rect x="200" y="160" width="200" height="60" rx="5" fill="#e0e0c0"/>
    <rect x="200" y="220" width="200" height="60" rx="5" fill="#c0d8e0"/>
    
    <!-- Buffer Labels -->
    <text x="210" y="140" font-family="monospace" font-size="14">Log Entry 0</text>
    <text x="210" y="200" font-family="monospace" font-size="14">Log Entry 1 (Filled)</text>
    <text x="210" y="260" font-family="monospace" font-size="14">Log Entry 2</text>
    <text x="100" y="180" font-family="sans-serif" font-size="16">Buffer (N=3)</text>
    
    <!-- Semaphores -->
    <circle cx="450" cy="100" r="20" fill="#a0d0a0"/>
    <text x="445" y="105" font-family="sans-serif" font-size="14">empty</text>
    <circle cx="450" cy="160" r="20" fill="#d0a0a0"/>
    <text x="435" y="165" font-family="sans-serif" font-size="14">mutex</text>
    <circle cx="450" cy="220" r="20" fill="#a0a0d0"/>
    <text x="445" y="225" font-family="sans-serif" font-size="14">full</text>
    
    <!-- Code Snippet -->
    <rect x="50" y="300" width="500" height="80" fill="#ffffff" rx="5"/>
    <text x="60" y="320" font-family="monospace" font-size="12" fill="#000000">
        <tspan x="60" y="320">sem_t empty, full, mutex;</tspan>
        <tspan x="60" y="340">struct log_entry buffer[N];</tspan>
        <tspan x="60" y="360">int in = 0, out = 0;</tspan>
    </text>
    
    <!-- Arrows -->
    <path d="M250 100 L150 100 L150 70 L130 70" stroke="#606060" fill="none" marker-end="url(#arrow)"/>
    <path d="M250 220 L150 220 L150 250 L130 250" stroke="#606060" fill="none" marker-end="url(#arrow)"/>
    
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#606060"/>
        </marker>
    </defs>
</svg>
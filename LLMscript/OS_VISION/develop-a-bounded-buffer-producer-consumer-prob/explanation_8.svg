<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle">Consumer Operation</text>
    
    <!-- Consumer thread -->
    <circle cx="500" cy="200" r="40" fill="#e6550d"/>
    <text x="500" y="200" text-anchor="middle" fill="white">C</text>
    
    <!-- Buffer with data -->
    <rect x="250" y="150" width="100" height="100" fill="#fdae6b" stroke="#333"/>
    <text x="300" y="200" text-anchor="middle">Data</text>
    
    <!-- Semaphore operations -->
    <path d="M 460,200 L 350,200" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="405" y="190" text-anchor="middle" fill="#fd8d3c">wait(full)</text>
    
    <path d="M 460,200 L 350,200" stroke="#333" stroke-dasharray="4" stroke-width="2"/>
    <text x="405" y="220" text-anchor="middle" fill="#2b8cbe">wait(mutex)</text>
    
    <path d="M 250,200 L 140,200" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="195" y="190" text-anchor="middle" fill="#2b8cbe">signal(mutex)</text>
    <text x="195" y="220" text-anchor="middle" fill="#a1d99b">signal(empty)</text>
    
    <!-- Code snippet -->
    <foreignObject x="50" y="280" width="500" height="120">
        <pre xmlns="http://www.w3.org/1999/xhtml" style="font-family:monospace; margin:0">
void consumer() {
    wait(full);
    wait(mutex);
    log_entry item = buffer[out];
    out = (out + 1) % N;
    signal(mutex);
    signal(empty);
    process_item(item);
}</pre>
    </foreignObject>
    
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
        </marker>
    </defs>
</svg>
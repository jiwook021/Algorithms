<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- B-Tree Structure -->
    <rect x="250" y="20" width="100" height="40" fill="#98FB98" rx="5"/>
    <text x="270" y="45" font-family="monospace" font-size="12">Root</text>
    
    <!-- Intermediate Nodes -->
    <rect x="150" y="100" width="80" height="40" fill="#87CEEB" rx="5"/>
    <rect x="350" y="100" width="80" height="40" fill="#87CEEB" rx="5"/>
    <path d="M300,60 L200,100 M300,60 L400,100" stroke="black" fill="none"/>
    
    <!-- Leaf Nodes -->
    <rect x="50" y="180" width="60" height="120" fill="#FFB6C1" rx="5"/>
    <rect x="150" y="180" width="60" height="120" fill="#FFB6C1" rx="5"/>
    <rect x="350" y="180" width="60" height="120" fill="#FFB6C1" rx="5"/>
    <rect x="450" y="180" width="60" height="120" fill="#FFB6C1" rx="5"/>
    <path d="M190,140 L110,180 M190,140 L170,180" stroke="black" fill="none"/>
    <path d="M390,140 L310,180 M390,140 L430,180" stroke="black" fill="none"/>
    
    <!-- Directory Entries -->
    <text x="55" y="200" font-family="monospace" font-size="10">file001</text>
    <text x="55" y="220" font-family="monospace" font-size="10">file002</text>
    <text x="155" y="200" font-family="monospace" font-size="10">file003</text>
    
    <!-- Code Example -->
    <rect x="20" y="280" width="560" height="100" fill="#e0e0e0" rx="5"/>
    <text x="30" y="300" font-family="monospace" font-size="12">struct BTreeNode {</text>
    <text x="40" y="320" font-family="monospace" font-size="12">    bool is_leaf;</text>
    <text x="40" y="340" font-family="monospace" font-size="12">    string keys[MAX];</text>
    <text x="40" y="360" font-family="monospace" font-size="12">    BTreeNode* children[MAX+1];</text>
    <text x="30" y="380" font-family="monospace" font-size="12">};</text>
</svg>
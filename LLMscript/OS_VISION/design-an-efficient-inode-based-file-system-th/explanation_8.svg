<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="10" width="580" height="380" fill="#fff5ee" stroke="#333" stroke-width="2"/>
    
    <!-- B-Tree Structure -->
    <rect x="200" y="50" width="200" height="40" fill="#98fb98" stroke="#2e8b57"/>
    <text x="250" y="75" font-family="monospace" font-size="14">Root Node</text>
    
    <!-- Level 1 Nodes -->
    <rect x="100" y="150" width="120" height="40" fill="#87cefa" stroke="#1e90ff"/>
    <rect x="300" y="150" width="120" height="40" fill="#87cefa" stroke="#1e90ff"/>
    <text x="110" y="175" font-family="monospace" font-size="12">[A-L]</text>
    <text x="310" y="175" font-family="monospace" font-size="12">[M-Z]</text>
    
    <!-- Leaf Nodes -->
    <rect x="20" y="250" width="80" height="40" fill="#dda0dd" stroke="#9400d3"/>
    <rect x="120" y="250" width="80" height="40" fill="#dda0dd" stroke="#9400d3"/>
    <rect x="300" y="250" width="80" height="40" fill="#dda0dd" stroke="#9400d3"/>
    <rect x="400" y="250" width="80" height="40" fill="#dda0dd" stroke="#9400d3"/>
    
    <!-- Connections -->
    <path d="M 300,90 L 300,150" stroke="#666" fill="none"/>
    <path d="M 220,150 L 150,250" stroke="#666" fill="none"/>
    <path d="M 380,150 L 340,250" stroke="#666" fill="none"/>
    
    <!-- Code Sample -->
    <text x="30" y="320" font-family="monospace" font-size="12">struct BTreeNode {</text>
    <text x="50" y="340" font-family="monospace" font-size="12" fill="#2e8b57">vector&lt;string> keys;</text>
    <text x="50" y="360" font-family="monospace" font-size="12" fill="#1e90ff">vector&lt;inode_ptr> values;</text>
    <text x="50" y="380" font-family="monospace" font-size="12">};</text>
</svg>
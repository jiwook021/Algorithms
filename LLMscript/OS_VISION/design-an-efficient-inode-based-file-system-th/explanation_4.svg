<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Inode Structure -->
    <rect x="50" y="50" width="120" height="280" fill="#cfe2f3" rx="5"/>
    <text x="110" y="40" font-size="14" text-anchor="middle">Inode Structure</text>
    
    <!-- Direct Blocks -->
    <rect x="70" y="70" width="80" height="40" fill="#b6d7a8"/>
    <text x="110" y="95" font-size="12" text-anchor="middle">12 Direct</text>
    <text x="110" y="110" font-size="12" text-anchor="middle">Blocks</text>
    
    <!-- Single Indirect -->
    <rect x="70" y="130" width="80" height="40" fill="#ffe599"/>
    <text x="110" y="155" font-size="12" text-anchor="middle">Single</text>
    <text x="110" y="170" font-size="12" text-anchor="middle">Indirect</text>
    
    <!-- Double Indirect -->
    <rect x="70" y="190" width="80" height="40" fill="#d5a6bd"/>
    <text x="110" y="215" font-size="12" text-anchor="middle">Double</text>
    <text x="110" y="230" font-size="12" text-anchor="middle">Indirect</text>
    
    <!-- Triple Indirect -->
    <rect x="70" y="250" width="80" height="40" fill="#a4c2f4"/>
    <text x="110" y="275" font-size="12" text-anchor="middle">Triple</text>
    <text x="110" y="290" font-size="12" text-anchor="middle">Indirect</text>
    
    <!-- Code Example -->
    <g transform="translate(250 50)">
        <rect width="300" height="300" fill="#fff" rx="5"/>
        <text x="20" y="30" font-family="monospace" font-size="12" fill="#000">
            <tspan x="20" dy="1.2em">struct Inode {</tspan>
            <tspan x="30" dy="1.2em">uint32_t direct[12];</tspan>
            <tspan x="30" dy="1.2em">uint32_t single_indirect;</tspan>
            <tspan x="30" dy="1.2em">uint32_t double_indirect;</tspan>
            <tspan x="30" dy="1.2em">uint32_t triple_indirect;</tspan>
            <tspan x="20" dy="1.2em">};</tspan>
        </text>
    </g>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Extent Visualization -->
    <rect x="50" y="100" width="400" height="30" fill="#FFF" stroke="#666"/>
    <rect x="50" y="100" width="80" height="30" fill="#FFA07A"/>
    <rect x="130" y="100" width="160" height="30" fill="#98FB98"/>
    <rect x="290" y="100" width="160" height="30" fill="#87CEEB"/>
    
    <!-- Extent Labels -->
    <text x="70" y="120" font-family="monospace" font-size="12">Extent 1</text>
    <text x="200" y="120" font-family="monospace" font-size="12">Extent 2</text>
    <text x="350" y="120" font-family="monospace" font-size="12">Extent 3</text>
    
    <!-- Block Pointers Comparison -->
    <rect x="50" y="180" width="400" height="30" fill="#FFF" stroke="#666"/>
    <g transform="translate(50,180)">
        <rect width="20" height="30" fill="#FFA07A"/>
        <rect x="20" width="20" height="30" fill="#98FB98"/>
        <rect x="40" width="20" height="30" fill="#87CEEB"/>
        <rect x="60" width="20" height="30" fill="#DDA0DD"/>
    </g>
    
    <!-- Code Example -->
    <rect x="50" y="250" width="500" height="120" fill="#e0e0e0" rx="5"/>
    <text x="60" y="270" font-family="monospace" font-size="12">struct Extent {</text>
    <text x="70" y="290" font-family="monospace" font-size="12">    uint64_t start_block;</text>
    <text x="70" y="310" font-family="monospace" font-size="12">    uint32_t block_count;</text>
    <text x="60" y="330" font-family="monospace" font-size="12">};</text>
    <text x="60" y="360" font-family="monospace" font-size="12">struct Inode {</text>
    <text x="70" y="380" font-family="monospace" font-size="12">    Extent extents[N];</text>
    <text x="60" y="400" font-family="monospace" font-size="12">};</text>
</svg>
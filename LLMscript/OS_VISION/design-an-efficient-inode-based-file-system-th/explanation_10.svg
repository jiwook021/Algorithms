<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  
  <!-- Title -->
  <text x="300" y="30" font-size="18" text-anchor="middle" font-family="Arial">Directory Structure with B+Tree Indexing</text>
  
  <!-- Inode Structure -->
  <rect x="20" y="60" width="120" height="40" fill="#c0d8e0" rx="5"/>
  <text x="80" y="85" text-anchor="middle" font-family="Arial">Directory</text>
  <text x="80" y="100" text-anchor="middle" font-family="Arial">Inode</text>
  
  <!-- Data Block Tree -->
  <path d="M 160 80 L 220 80" stroke="#666" stroke-width="2"/>
  <rect x="220" y="50" width="360" height="140" fill="#e8f4f8" rx="8"/>
  
  <!-- B+Tree Nodes -->
  <rect x="240" y="70" width="100" height="100" fill="#fff" stroke="#4a90d6" rx="5"/>
  <path d="M 240 90 L 340 90" stroke="#4a90d6"/>
  <text x="245" y="85" font-family="Courier" font-size="12">Keys:</text>
  <text x="245" y="105" font-family="Courier" font-size="12">0x3A: →</text>
  <text x="245" y="125" font-family="Courier" font-size="12">0x7F: →</text>
  <text x="245" y="145" font-family="Courier" font-size="12">0xC4: →</text>
  
  <!-- Leaf Nodes -->
  <rect x="360" y="70" width="100" height="100" fill="#fff" stroke="#50c878" rx="5"/>
  <text x="365" y="85" font-family="Courier" font-size="12">Entries:</text>
  <text x="365" y="105" font-family="Courier" font-size="12">file1 (inode 45)</text>
  <text x="365" y="125" font-family="Courier" font-size="12">file2 (inode 72)</text>
  
  <!-- Code Example -->
  <rect x="30" y="220" width="540" height="150" fill="#1e1e1e" rx="5"/>
  <text x="40" y="240" fill="#dcdcdc" font-family="Courier" font-size="12">// B+Tree Node Structure</text>
  <text x="40" y="260" fill="#dcdcdc" font-family="Courier" font-size="12">struct BPlusNode {</text>
  <text x="60" y="280" fill="#9cdcfe" font-family="Courier" font-size="12">uint8_t is_leaf;</text>
  <text x="60" y="300" fill="#9cdcfe" font-family="Courier" font-size="12">uint32_t keys[3];</text>
  <text x="60" y="320" fill="#9cdcfe" font-family="Courier" font-size="12">union {</text>
  <text x="80" y="340" fill="#ce9178" font-family="Courier" font-size="12">BPlusNode* children[4];</text>
  <text x="80" y="360" fill="#ce9178" font-family="Courier" font-size="12">DirEntry entries[3];</text>
  <text x="60" y="380" fill="#9cdcfe" font-family="Courier" font-size="12">};</text>
  <text x="40" y="400" fill="#dcdcdc" font-family="Courier" font-size="12">};</text>
  
  <!-- Legend -->
  <rect x="420" y="220" width="150" height="70" fill="white" rx="5"/>
  <rect x="430" y="230" width="12" height="12" fill="#4a90d6"/>
  <text x="450" y="242" font-family="Arial" font-size="12">Index Node</text>
  <rect x="430" y="250" width="12" height="12" fill="#50c878"/>
  <text x="450" y="262" font-family="Arial" font-size="12">Leaf Node</text>
  <rect x="430" y="270" width="12" height="12" fill="#c0d8e0"/>
  <text x="450" y="282" font-family="Arial" font-size="12">Inode</text>
</svg>
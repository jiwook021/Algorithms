<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Directory Structure -->
    <text x="300" y="30" font-size="16" text-anchor="middle">H-Tree Directory Indexing</text>
    
    <!-- Root Node -->
    <circle cx="300" cy="100" r="25" fill="#b6d7a8"/>
    <text x="300" y="105" font-size="12" text-anchor="middle" fill="#000">Root</text>
    
    <!-- Intermediate Nodes -->
    <circle cx="200" cy="180" r="20" fill="#ffe599"/>
    <circle cx="300" cy="180" r="20" fill="#ffe599"/>
    <circle cx="400" cy="180" r="20" fill="#ffe599"/>
    
    <!-- Leaf Nodes -->
    <circle cx="150" cy="260" r="15" fill="#d5a6bd"/>
    <circle cx="250" cy="260" r="15" fill="#d5a6bd"/>
    <circle cx="350" cy="260" r="15" fill="#d5a6bd"/>
    <circle cx="450" cy="260" r="15" fill="#d5a6bd"/>
    
    <!-- Connections -->
    <path d="M300 125 V150 M300 175 V150" stroke="#666" fill="none"/>
    <path d="M200 155 L250 205 M300 155 L300 205 M400 155 L350 205" stroke="#666" fill="none"/>
    <path d="M200 200 L175 245 M250 200 L225 245 M350 200 L375 245 M400 200 L425 245" stroke="#666" fill="none"/>
    
    <!-- Code Example -->
    <g transform="translate(50 300)">
        <rect width="500" height="80" fill="#fff" rx="5"/>
        <text x="20" y="25" font-family="monospace" font-size="12" fill="#000">
            <tspan x="20" dy="1.2em">struct DirEntry {</tspan>
            <tspan x="40" dy="1.2em">uint64_t inode;</tspan>
            <tspan x="40" dy="1.2em">char name[256];</tspan>
            <tspan x="20" dy="1.2em">};</tspan>
        </text>
    </g>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="300" y="30" font-size="20" text-anchor="middle">2. Neighborhood Comparison</text>
  
  <g transform="translate(100 80)">
    <!-- 4-connectivity -->
    <g transform="translate(0 0)">
      <rect x="120" y="120" width="40" height="40" fill="#2196F3"/>
      <rect x="120" y="60" width="40" height="40" fill="#FFC107"/>
      <rect x="80" y="120" width="40" height="40" fill="#FFC107"/>
      <rect x="160" y="120" width="40" height="40" fill="#FFC107"/>
      <rect x="120" y="180" width="40" height="40" fill="#FFC107"/>
      
      <text x="60" y="240" fill="black">4-connectivity (N, S, E, W)</text>
      <path d="M140 140l0 -60" stroke="black" marker-end="url(#arrow)"/>
      <path d="M140 140l-60 0" stroke="black" marker-end="url(#arrow)"/>
      <path d="M140 140l60 0" stroke="black" marker-end="url(#arrow)"/>
      <path d="M140 140l0 60" stroke="black" marker-end="url(#arrow)"/>
    </g>
    
    <!-- 8-connectivity -->
    <g transform="translate(300 0)">
      <rect x="120" y="120" width="40" height="40" fill="#2196F3"/>
      <rect x="80" y="60" width="40" height="40" fill="#FFC107"/>
      <rect x="120" y="60" width="40" height="40" fill="#FFC107"/>
      <rect x="160" y="60" width="40" height="40" fill="#FFC107"/>
      <rect x="80" y="120" width="40" height="40" fill="#FFC107"/>
      <rect x="160" y="120" width="40" height="40" fill="#FFC107"/>
      <rect x="80" y="180" width="40" height="40" fill="#FFC107"/>
      <rect x="120" y="180" width="40" height="40" fill="#FFC107"/>
      <rect x="160" y="180" width="40" height="40" fill="#FFC107"/>
      
      <text x="60" y="240" fill="black">8-connectivity (includes diagonals)</text>
      <path d="M140 140l-60 -60" stroke="black" marker-end="url(#arrow)"/>
      <path d="M140 140l60 -60" stroke="black" marker-end="url(#arrow)"/>
      <path d="M140 140l-60 60" stroke="black" marker-end="url(#arrow)"/>
      <path d="M140 140l60 60" stroke="black" marker-end="url(#arrow)"/>
    </g>
  </g>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>
</svg>
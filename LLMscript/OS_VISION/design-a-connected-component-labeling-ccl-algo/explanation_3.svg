<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="300" y="30" font-size="20" text-anchor="middle">3. Union-Find Data Structure</text>
  
  <g transform="translate(100 80)">
    <!-- Parent pointers -->
    <g font-size="16">
      <circle cx="100" cy="100" r="20" fill="#9C27B0"/><text x="100" y="105" text-anchor="middle" fill="white">1</text>
      <circle cx="200" cy="100" r="20" fill="#9C27B0"/><text x="200" y="105" text-anchor="middle" fill="white">2</text>
      <circle cx="300" cy="100" r="20" fill="#9C27B0"/><text x="300" y="105" text-anchor="middle" fill="white">3</text>
      
      <circle cx="150" cy="200" r="20" fill="#E91E63"/><text x="150" y="205" text-anchor="middle" fill="white">4</text>
      <circle cx="250" cy="200" r="20" fill="#E91E63"/><text x="250" y="205" text-anchor="middle" fill="white">5</text>
      
      <!-- Arrows -->
      <path d="M150 220L100 120" stroke="black" marker-end="url(#arrow)"/>
      <path d="M250 220L200 120" stroke="black" marker-end="url(#arrow)"/>
      <path d="M200 120L100 120" stroke="black" stroke-dasharray="4" marker-end="url(#arrow)"/>
    </g>
    
    <text x="300" y="300" text-anchor="middle">Parent pointers and path compression</text>
    <text x="100" y="320" text-anchor="middle">Root: 1</text>
    <text x="250" y="320" text-anchor="middle">Root: 2</text>
  </g>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>
</svg>
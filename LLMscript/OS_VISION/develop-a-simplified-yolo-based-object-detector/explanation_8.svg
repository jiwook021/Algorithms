<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Loss Function Components -->
    <rect width="600" height="400" fill="#fff"/>
    
    <!-- Localization Loss -->
    <rect x="50" y="50" width="500" height="100" fill="#ffe4e1" rx="10"/>
    <text x="70" y="80" font-size="14" fill="#8b0000">Localization Loss (MSE)</text>
    <text x="100" y="110" font-size="12">&lt;λ_coord Σ[(x̂ - x)² + (ŷ - y)² + (√ŵ - √w)² + (√ĥ - √h)²]&gt;</text>
    
    <!-- Confidence Loss -->
    <rect x="50" y="170" width="500" height="100" fill="#e1f7d5" rx="10"/>
    <text x="70" y="200" font-size="14" fill="#006400">Confidence Loss (BCE)</text>
    <text x="100" y="230" font-size="12">&lt;Σ[ -C log(Ĉ) - (1-C) log(1-Ĉ) ]&gt;</text>
    
    <!-- Class Loss -->
    <rect x="50" y="290" width="500" height="100" fill="#e1e1ff" rx="10"/>
    <text x="70" y="320" font-size="14" fill="#00008b">Classification Loss (CE)</text>
    <text x="100" y="350" font-size="12">&lt;λ_class Σ[ p(c) log(p̂(c)) ]&gt;</text>
    
    <!-- Code Example -->
    <text x="50" y="390" font-size="10" fill="#333">
        <tspan x="50" dy="0">// C++ Loss Calculation Excerpt</tspan>
        <tspan x="50" dy="15">float total_loss = λ_coord * loc_loss + conf_loss + λ_class * cls_loss;</tspan>
    </text>
</svg>
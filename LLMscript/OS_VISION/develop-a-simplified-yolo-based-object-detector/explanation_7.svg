<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Grid System Visualization -->
    <rect width="600" height="400" fill="#f0f0f0"/>
    <image href="https://via.placeholder.com/400x300" x="100" y="50" width="400" height="300"/>
    
    <!-- Grid Overlay -->
    <g stroke="#00ff00" stroke-width="2" stroke-opacity="0.6">
        <path d="M100 50v300 M233.33 50v300 M366.66 50v300 M500 50v300"/>
        <path d="M100 50h400 M100 133.33h400 M100 216.66h400 M100 300h400"/>
    </g>
    
    <!-- Cell Predictions -->
    <rect x="300" y="150" width="100" height="80" fill="none" stroke="#ff0000" stroke-width="3"/>
    <text x="310" y="140" font-size="12" fill="#ff0000">BBox (x,y,w,h)</text>
    
    <rect x="350" y="200" width="60" height="40" fill="none" stroke="#0000ff" stroke-width="3"/>
    <text x="310" y="250" font-size="12" fill="#0000ff">Class Scores: 0.85, 0.1, 0.05</text>
    
    <!-- Labels -->
    <text x="250" y="30" font-size="16" fill="#000">Input Image (416x416)</text>
    <text x="250" y="370" font-size="16" fill="#000">SxS Grid (3x3 shown)</text>
</svg>
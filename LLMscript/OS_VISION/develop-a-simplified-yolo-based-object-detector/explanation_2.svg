<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Network Architecture</text>
    
    <!-- Network layers -->
    <rect x="50" y="80" width="100" height="60" fill="#ff9999" rx="5"/>
    <rect x="200" y="70" width="100" height="80" fill="#99ccff" rx="5"/>
    <rect x="350" y="60" width="100" height="100" fill="#99ff99" rx="5"/>
    <rect x="500" y="80" width="100" height="60" fill="#ffcc99" rx="5"/>
    
    <!-- Layer labels -->
    <text x="100" y="120" text-anchor="middle" fill="#333">Input</text>
    <text x="250" y="120" text-anchor="middle" fill="#333">Backbone</text>
    <text x="400" y="120" text-anchor="middle" fill="#333">Neck</text>
    <text x="550" y="120" text-anchor="middle" fill="#333">Detection</text>
    
    <!-- Feature maps -->
    <rect x="50" y="180" width="500" height="80" fill="#fff" stroke="#666" stroke-width="2"/>
    <rect x="70" y="200" width="80" height="40" fill="#99ccff"/>
    <rect x="180" y="190" width="100" height="50" fill="#99ff99"/>
    <rect x="310" y="200" width="100" height="40" fill="#ffcc99"/>
    
    <!-- Arrows -->
    <path d="M150 80v50M300 80v50M450 80v50" stroke="#666" fill="none" stroke-width="2"/>
    <polygon points="150,130 140,120 160,120" fill="#666"/>
    
    <!-- C++ code example -->
    <g transform="translate(50 300)">
        <rect x="0" y="0" width="500" height="80" fill="#e0e0e0" rx="5"/>
        <text x="10" y="20" font-family="monospace" font-size="12" fill="#333">
            <tspan x="10" y="20">// Simplified YOLO model definition</tspan>
            <tspan x="10" y="40">Darknet backbone {</tspan>
            <tspan x="20" y="60">    Conv(3, 64, 3, 1, 1),</tspan>
            <tspan x="20" y="80">    MaxPool(2, 2),</tspan>
        </text>
    </g>
</svg>
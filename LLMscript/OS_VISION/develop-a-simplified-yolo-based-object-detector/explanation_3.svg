<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Non-Maximum Suppression</text>
    
    <!-- Original detections -->
    <rect x="100" y="100" width="120" height="80" fill="none" stroke="#888" stroke-width="2"/>
    <rect x="130" y="120" width="100" height="60" fill="none" stroke="#888" stroke-width="2"/>
    <rect x="160" y="140" width="80" height="40" fill="none" stroke="#888" stroke-width="2"/>
    
    <!-- Final detection -->
    <rect x="160" y="140" width="80" height="40" fill="none" stroke="#44aa44" stroke-width="3"/>
    
    <!-- IoU visualization -->
    <path d="M400 100l50 80-30 40" stroke="#ff4444" fill="none" stroke-width="2"/>
    <path d="M420 120l60 60-40 20" stroke="#ff4444" fill="none" stroke-width="2"/>
    <text x="450" y="160" font-size="14" fill="#ff4444">IoU Calculation</text>
    
    <!-- Threshold filter -->
    <rect x="400" y="200" width="160" height="60" fill="#fff" stroke="#666" rx="5"/>
    <text x="480" y="220" text-anchor="middle" fill="#333">Confidence</text>
    <text x="480" y="245" text-anchor="middle" fill="#333">Threshold: 0.5</text>
    
    <!-- C++ code example -->
    <g transform="translate(50 300)">
        <rect x="0" y="0" width="500" height="80" fill="#e0e0e0" rx="5"/>
        <text x="10" y="20" font-family="monospace" font-size="12" fill="#333">
            <tspan x="10" y="20">void non_max_suppression(std::vector&lt;Detection&gt;&amp; detections) {</tspan>
            <tspan x="20" y="40">std::sort(detections.begin(), detections.end(), compare_confidence);</tspan>
            <tspan x="20" y="60">for (auto&amp; det : detections) {</tspan>
            <tspan x="30" y="80">    if (det.suppressed) continue;</tspan>
        </text>
    </g>
</svg>
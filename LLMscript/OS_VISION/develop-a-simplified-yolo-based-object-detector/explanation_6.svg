<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <!-- Non-Max Suppression -->
    <rect x="100" y="80" width="400" height="240" fill="none" stroke="#666"/>
    <!-- Before NMS -->
    <rect x="150" y="100" width="120" height="90" fill="none" stroke="#f00" stroke-width="2"/>
    <rect x="170" y="120" width="130" height="80" fill="none" stroke="#f00" stroke-width="2"/>
    <rect x="300" y="150" width="100" height="70" fill="none" stroke="#0f0" stroke-width="2"/>
    <text x="300" y="70" font-size="18" text-anchor="middle">Non-Max Suppression</text>
    <text x="150" y="350" font-size="14" fill="#333">Before NMS (3 boxes)</text>
    <!-- After NMS -->
    <g transform="translate(0 120)">
        <rect x="150" y="160" width="120" height="90" fill="#ff000040"/>
        <rect x="300" y="150" width="100" height="70" fill="#00ff0040"/>
        <text x="400" y="350" font-size="14" fill="#333">After NMS (1 box)</text>
    </g>
    <!-- Suppression Effect -->
    <path d="M270 220 L320 260" stroke="#666" stroke-dasharray="4"/>
    <text x="320" y="260" font-size="12">Remove overlapping</text>
    <text x="320" y="280" font-size="12">boxes with lower confidence</text>
    <!-- C++ Code -->
    <g transform="translate(50 320)">
        <rect x="0" y="0" width="500" height="50" fill="#e0e0e0" rx="5"/>
        <text x="10" y="20" font-family="monospace" font-size="12">
            <tspan fill="#008800">// Sort by confidence and remove overlaps</tspan>
            <tspan x="10" dy="18"><tspan fill="#0000ff">void</tspan> non_max_suppression(vector&lt;Prediction&gt;&amp; boxes, <tspan fill="#008800">float</tspan> iou_threshold);</tspan>
        </text>
    </g>
</svg>
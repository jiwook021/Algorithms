<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Grid visualization -->
    <rect x="50" y="50" width="300" height="300" fill="none" stroke="#cccccc" stroke-width="2"/>
    
    <!-- Grid lines -->
    <path d="M150 50 V350 M250 50 V350 M50 150 H350 M50 250 H350" stroke="#cccccc" stroke-width="1"/>
    
    <!-- Single cell highlight -->
    <rect x="150" y="150" width="100" height="100" fill="none" stroke="#FF6B6B" stroke-width="3"/>
    
    <!-- Bounding box predictions -->
    <rect x="170" y="170" width="60" height="80" fill="none" stroke="#4D9DE0" stroke-width="2"/>
    <rect x="190" y="190" width="40" height="50" fill="none" stroke="#3BC14A" stroke-width="2"/>
    
    <!-- Confidence labels -->
    <text x="180" y="165" font-size="12" fill="#4D9DE0">0.92</text>
    <text x="200" y="185" font-size="12" fill="#3BC14A">0.85</text>
    
    <!-- Class labels -->
    <text x="160" y="140" font-size="14" fill="#333">Class: Dog</text>
    
    <!-- Grid labels -->
    <text x="200" y="30" font-size="16" fill="#333">SxS Grid (e.g., 3x3)</text>
    <text x="400" y="100" font-size="14" fill="#666">Each cell predicts:</text>
    <text x="400" y="130" font-size="12" fill="#4D9DE0">- Bounding boxes (x,y,w,h)</text>
    <text x="400" y="160" font-size="12" fill="#3BC14A">- Confidence scores</text>
    <text x="400" y="190" font-size="12" fill="#FF6B6B">- Class probabilities</text>
    
    <!-- C++ code example -->
    <rect x="380" y="220" width="200" height="120" fill="#f0f0f0" rx="5"/>
    <text x="390" y="240" font-family="monospace" font-size="12" fill="#333">
        <tspan x="390" y="240">// Process grid cell predictions</tspan>
        <tspan x="390" y="260">for (int cell_y = 0; cell_y </tspan>
        <tspan x="390" y="280">for (int cell_x = 0; cell_x </tspan>
        <tspan x="390" y="300">   vector&lt;float&gt; predictions</tspan>
        <tspan x="390" y="320">   = model_output[cell_y][cell_x];</tspan>
    </text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#F0F0F0"/>
  <text x="300" y="30" font-size="18" text-anchor="middle" font-family="monospace">Thread-Specific Memory Heaps</text>
  
  <!-- Threads -->
  <circle cx="150" cy="100" r="30" fill="#4CAF50"/>
  <text x="150" y="140" text-anchor="middle">Thread 1</text>
  <circle cx="450" cy="100" r="30" fill="#2196F3"/>
  <text x="450" y="140" text-anchor="middle">Thread 2</text>
  
  <!-- Memory Heaps -->
  <rect x="50" y="200" width="200" height="150" fill="#FFEB3B" stroke="#000"/>
  <rect x="350" y="200" width="200" height="150" fill="#FF9800" stroke="#000"/>
  
  <!-- Allocation Markers -->
  <rect x="70" y="220" width="40" height="40" fill="#8BC34A"/>
  <rect x="370" y="220" width="40" height="40" fill="#03A9F4"/>
  
  <!-- Code Example -->
  <text x="300" y="380" text-anchor="middle" font-size="12" font-family="monospace">
    <tspan x="300" dy="0">struct ThreadHeap {</tspan>
    <tspan x="300" dy="1.2em">  void* allocate(size_t size);</tspan>
    <tspan x="300" dy="1.2em">  thread_local static Heap local_heap;</tspan>
  </text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#F0F0F0"/>
  <text x="300" y="30" font-size="18" text-anchor="middle" font-family="monospace">Slab Allocation</text>
  
  <!-- Slab Containers -->
  <rect x="50" y="100" width="120" height="200" fill="#FFF" stroke="#000"/>
  <rect x="240" y="100" width="120" height="200" fill="#FFF" stroke="#000"/>
  <rect x="430" y="100" width="120" height="200" fill="#FFF" stroke="#000"/>
  
  <!-- Fixed-size Blocks -->
  <g transform="translate(50,100)">
    <rect y="0" width="120" height="40" fill="#4CAF50"/>
    <rect y="40" width="120" height="40" fill="#8BC34A"/>
    <rect y="80" width="120" height="40" fill="#CDDC39"/>
  </g>
  
  <!-- Size Labels -->
  <text x="110" y="320" text-anchor="middle">64B</text>
  <text x="300" y="320" text-anchor="middle">128B</text>
  <text x="490" y="320" text-anchor="middle">256B</text>
  
  <!-- Code Example -->
  <text x="300" y="380" text-anchor="middle" font-family="monospace" font-size="12">
    <tspan x="300" dy="0">class Slab {</tspan>
    <tspan x="300" dy="1.2em">  char buffer[SLAB_SIZE];</tspan>
    <tspan x="300" dy="1.2em">  std::atomic&lt;size_t&gt; free_idx;</tspan>
  </text>
</svg>
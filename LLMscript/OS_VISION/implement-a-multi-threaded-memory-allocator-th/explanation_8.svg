<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Coalescing Free Blocks -->
  <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
  
  <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold">Block Coalescing Process</text>
  
  <!-- Before Coalescing -->
  <text x="300" y="70" text-anchor="middle" fill="#666">Before Coalescing</text>
  <rect x="50" y="100" width="500" height="60" fill="none" stroke="#666"/>
  <rect x="60" y="110" width="100" height="40" fill="#ef9a9a"/>
  <rect x="170" y="110" width="100" height="40" fill="#81d4fa"/>
  <rect x="280" y="110" width="100" height="40" fill="#81d4fa"/>
  <rect x="390" y="110" width="100" height="40" fill="#a5d6a7"/>
  <text x="110" y="135" fill="#000">Used</text>
  <text x="220" y="135" fill="#000">Free</text>
  <text x="330" y="135" fill="#000">Free</text>
  <text x="440" y="135" fill="#000">Used</text>
  
  <!-- Arrow -->
  <path d="M300 190 L300 230" stroke="#666" fill="none" marker-end="url(#arrow)"/>
  <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#666"/>
  </marker>
  
  <!-- After Coalescing -->
  <text x="300" y="280" text-anchor="middle" fill="#666">After Coalescing</text>
  <rect x="50" y="310" width="500" height="60" fill="none" stroke="#666"/>
  <rect x="60" y="320" width="100" height="40" fill="#ef9a9a"/>
  <rect x="170" y="320" width="210" height="40" fill="#81d4fa"/>
  <rect x="390" y="320" width="100" height="40" fill="#a5d6a7"/>
  <text x="275" y="345" fill="#000">Merged Free Block</text>
  
  <!-- Code Example -->
  <g transform="translate(100 360)">
    <rect x="0" y="0" width="400" height="30" fill="#263238" rx="3"/>
    <text x="10" y="20" fill="#ffffff" font-family="monospace" font-size="14">
      <tspan x="10">void coalesce(Block* block) {</tspan>
      <tspan x="10" dy="1.2em">// Check adjacent blocks and merge if free</tspan>
    </text>
  </g>
</svg>
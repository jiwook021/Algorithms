<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#F0F0F0"/>
  <text x="300" y="30" font-size="18" text-anchor="middle" font-family="monospace">Lock Synchronization</text>
  
  <!-- Shared Resource -->
  <rect x="200" y="100" width="200" height="80" fill="#FFF" stroke="#000"/>
  <text x="300" y="140" text-anchor="middle">Global Free List</text>
  
  <!-- Locks -->
  <rect x="250" y="190" width="100" height="40" fill="#E91E63" rx="5"/>
  <text x="300" y="215" text-anchor="middle" fill="white">Mutex</text>
  
  <!-- Threads Contending -->
  <g transform="translate(100,250)">
    <circle cx="0" cy="0" r="25" fill="#2196F3"/>
    <path d="M0 0 L100 0" stroke="#000" stroke-width="2"/>
    <text x="-15" y="-30">Thread A</text>
  </g>
  
  <g transform="translate(500,250)">
    <circle cx="0" cy="0" r="25" fill="#4CAF50"/>
    <path d="M0 0 L-100 0" stroke="#000" stroke-width="2"/>
    <text x="-15" y="-30">Thread B</text>
  </g>
  
  <!-- Code Example -->
  <text x="300" y="380" text-anchor="middle" font-family="monospace" font-size="12">
    <tspan x="300" dy="0">std::mutex global_lock;</tspan>
    <tspan x="300" dy="1.2em">void* allocate() {</tspan>
    <tspan x="300" dy="1.2em">  std::lock_guard guard(global_lock);</tspan>
  </text>
</svg>
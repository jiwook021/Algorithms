<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#F0F0F0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Memory Coalescing for Fragmentation</text>
    
    <!-- Before Coalescing -->
    <text x="100" y="60" fill="#333">Before Coalescing</text>
    <rect x="50" y="70" width="500" height="60" fill="none" stroke="#666"/>
    <rect x="50" y="70" width="100" height="60" fill="#FF6666"/>
    <rect x="150" y="70" width="150" height="60" fill="#666"/>
    <rect x="300" y="70" width="100" height="60" fill="#FF6666"/>
    <rect x="400" y="70" width="150" height="60" fill="#666"/>
    <text x="100" y="100" fill="white">Free</text>
    <text x="225" y="100" fill="white">Allocated</text>
    <text x="350" y="100" fill="white">Free</text>
    <text x="475" y="100" fill="white">Allocated</text>
    
    <!-- After Coalescing -->
    <text x="100" y="190" fill="#333">After Coalescing</text>
    <rect x="50" y="200" width="500" height="60" fill="none" stroke="#666"/>
    <rect x="50" y="200" width="250" height="60" fill="#66FF66"/>
    <rect x="300" y="200" width="250" height="60" fill="#666"/>
    <text x="175" y="230" fill="white">Merged Free Block</text>
    <text x="425" y="230" fill="white">Allocated</text>
    
    <!-- Coalesce Arrows -->
    <path d="M200 140 Q200 160 200 180" stroke="#333" fill="none" marker-end="url(#arrow)"/>
    <path d="M350 140 Q350 160 350 180" stroke="#333" fill="none" marker-end="url(#arrow)"/>
    
    <!-- Code Example -->
    <rect x="50" y="280" width="500" height="100" fill="#FFF" rx="5"/>
    <text x="60" y="300" font-family="monospace" font-size="12" fill="#333">void coalesce(Block* block) {</text>
    <text x="70" y="320" font-family="monospace" font-size="12" fill="#333">if (block->next &amp;&amp; block->next->free) {</text>
    <text x="80" y="340" font-family="monospace" font-size="12" fill="#333">block->size += sizeof(Block) + block->next->size;</text>
    <text x="80" y="360" font-family="monospace" font-size="12" fill="#333">block->next = block->next->next;</text>
    
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
        </marker>
    </defs>
</svg>
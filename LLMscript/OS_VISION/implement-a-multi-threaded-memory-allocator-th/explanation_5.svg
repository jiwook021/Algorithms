<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#F0F0F0"/>
  <text x="300" y="30" font-size="18" text-anchor="middle" font-family="monospace">Memory Coalescing</text>
  
  <!-- Before Coalescing -->
  <text x="300" y="70" text-anchor="middle">Before</text>
  <rect x="50" y="100" width="500" height="60" fill="#BDBDBD"/>
  <rect x="50" y="100" width="100" height="60" fill="#8BC34A"/>
  <rect x="200" y="100" width="100" height="60" fill="#BDBDBD"/>
  <rect x="350" y="100" width="100" height="60" fill="#8BC34A"/>
  <rect x="500" y="100" width="50" height="60" fill="#8BC34A"/>
  
  <!-- After Coalescing -->
  <text x="300" y="200" text-anchor="middle">After</text>
  <rect x="50" y="230" width="500" height="60" fill="#BDBDBD"/>
  <rect x="50" y="230" width="250" height="60" fill="#4CAF50"/>
  <rect x="350" y="230" width="150" height="60" fill="#4CAF50"/>
  
  <!-- Merge Arrows -->
  <path d="M150 160 L150 220" stroke="#E91E63" stroke-width="2"/>
  <path d="M450 160 L450 220" stroke="#E91E63" stroke-width="2"/>
  
  <!-- Code Example -->
  <text x="300" y="380" text-anchor="middle" font-family="monospace" font-size="12">
    <tspan x="300" dy="0">void coalesce(Block* block) {</tspan>
    <tspan x="300" dy="1.2em">  if (block->next &amp;&amp; block->next->free) {</tspan>
    <tspan x="300" dy="1.2em">    block->size += sizeof(Header) + block->next->size;</tspan>
  </text>
</svg>
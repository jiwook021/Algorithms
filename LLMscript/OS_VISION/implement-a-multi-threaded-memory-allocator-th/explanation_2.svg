<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#F0F0F0"/>
  <text x="300" y="30" font-size="18" text-anchor="middle" font-family="monospace">Free List Management</text>
  
  <!-- Memory Blocks -->
  <rect x="50" y="100" width="500" height="60" fill="#BDBDBD"/>
  <rect x="50" y="100" width="100" height="60" fill="#8BC34A"/>
  <rect x="250" y="100" width="100" height="60" fill="#8BC34A"/>
  <rect x="450" y="100" width="100" height="60" fill="#8BC34A"/>
  
  <!-- Free List Pointers -->
  <path d="M150 130 L230 130" stroke="#E91E63" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M350 130 L430 130" stroke="#E91E63" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Header Structure -->
  <rect x="100" y="200" width="400" height="80" fill="#FFF" stroke="#000"/>
  <text x="120" y="230" font-family="monospace">size: 100</text>
  <text x="120" y="260" font-family="monospace">next: 0x250</text>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#E91E63"/>
    </marker>
  </defs>
</svg>
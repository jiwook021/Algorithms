<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Round Robin Diagram -->
    <circle cx="300" cy="200" r="120" fill="none" stroke="#333" stroke-width="2"/>
    
    <!-- Tasks in RR -->
    <g transform="rotate(-90 300 200)">
        <g transform="rotate(0 300 200)">
            <rect x="280" y="80" width="40" height="40" fill="#a5d6a7" rx="5"/>
            <text x="300" y="105" text-anchor="middle" font-family="monospace">T1</text>
        </g>
        <g transform="rotate(120 300 200)">
            <rect x="280" y="80" width="40" height="40" fill="#80deea" rx="5"/>
            <text x="300" y="105" text-anchor="middle" font-family="monospace">T2</text>
        </g>
        <g transform="rotate(240 300 200)">
            <rect x="280" y="80" width="40" height="40" fill="#ce93d8" rx="5"/>
            <text x="300" y="105" text-anchor="middle" font-family="monospace">T3</text>
        </g>
    </g>
    
    <!-- Time Quantum -->
    <path d="M300 200 L300 80" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="300" y="150" text-anchor="middle" font-family="monospace">Time Quantum = 2ms</text>
    
    <!-- Code Snippet -->
    <text x="300" y="350" text-anchor="middle" font-family="monospace" font-size="12">
        current = queue.front(); // Round Robin rotation
    </text>
    
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
        </marker>
    </defs>
</svg>
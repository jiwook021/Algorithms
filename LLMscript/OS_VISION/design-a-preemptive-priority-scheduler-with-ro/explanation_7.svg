<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Priority Queue Structure -->
    <rect x="50" y="50" width="500" height="300" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
    
    <!-- Queue Labels -->
    <text x="300" y="90" text-anchor="middle" font-family="monospace" font-size="18">Priority Queues</text>
    
    <!-- Priority Levels -->
    <g transform="translate(100, 120)">
        <rect x="0" y="0" width="400" height="50" fill="#e1f5fe" rx="5"/>
        <text x="10" y="30" font-family="monospace">Priority 1: [T1][T2][T3]</text>
    </g>
    
    <g transform="translate(100, 190)">
        <rect x="0" y="0" width="400" height="50" fill="#f0f4c3" rx="5"/>
        <text x="10" y="30" font-family="monospace">Priority 2: [T4][T5]</text>
    </g>
    
    <g transform="translate(100, 260)">
        <rect x="0" y="0" width="400" height="50" fill="#ffcdd2" rx="5"/>
        <text x="10" y="30" font-family="monospace">Priority 3: [T6]</text>
    </g>
    
    <!-- CPU -->
    <rect x="250" y="340" width="100" height="30" fill="#c8e6c9" rx="5"/>
    <text x="300" y="360" text-anchor="middle" font-family="monospace">CPU</text>
    <path d="M300 330 L300 280" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Code Snippet -->
    <text x="300" y="40" text-anchor="middle" font-family="monospace" font-size="14" fill="#333">
        std::vector&lt;std::queue&lt;Task*>> priority_queues;
    </text>
    
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
        </marker>
    </defs>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Priority Queue Structure</text>
    
    <!-- Priority Levels -->
    <rect x="50" y="60" width="500" height="60" rx="5" fill="#ffd700"/>
    <text x="300" y="95" text-anchor="middle" fill="#000">High Priority Queue (Priority 0)</text>
    
    <rect x="50" y="140" width="500" height="60" rx="5" fill="#90EE90"/>
    <text x="300" y="175" text-anchor="middle" fill="#000">Medium Priority Queue (Priority 1)</text>
    
    <rect x="50" y="220" width="500" height="60" rx="5" fill="#87CEEB"/>
    <text x="300" y="255" text-anchor="middle" fill="#000">Low Priority Queue (Priority 2)</text>
    
    <!-- Round Robin illustration -->
    <g transform="translate(100 300)">
        <circle cx="50" cy="30" r="20" fill="#87CEEB"/>
        <circle cx="100" cy="30" r="20" fill="#87CEEB"/>
        <circle cx="150" cy="30" r="20" fill="#87CEEB"/>
        <path d="M170 30L160 25L160 35Z" fill="#333"/>
        <text x="50" y="70" text-anchor="middle">Task A</text>
        <text x="100" y="70" text-anchor="middle">Task B</text>
        <text x="150" y="70" text-anchor="middle">Task C</text>
        <text x="250" y="30" fill="#333">Round Robin for equal priority</text>
    </g>
</svg>
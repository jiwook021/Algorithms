<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Timeline -->
    <path d="M50 200 L550 200" stroke="#333" stroke-width="2"/>
    
    <!-- Time Units -->
    <g font-family="monospace" font-size="12">
        <text x="50" y="220">0</text>
        <text x="150" y="220">2</text>
        <text x="250" y="220">4</text>
        <text x="350" y="220">6</text>
        <text x="450" y="220">8</text>
        <text x="550" y="220">10</text>
    </g>
    
    <!-- Task Execution -->
    <rect x="50" y="150" width="100" height="40" fill="#b3e5fc" rx="5"/>
    <text x="100" y="175" text-anchor="middle" font-family="monospace">Task A (P2)</text>
    
    <!-- Preemption -->
    <rect x="150" y="150" width="100" height="40" fill="#fff59d" rx="5"/>
    <text x="200" y="175" text-anchor="middle" font-family="monospace">Task B (P1)</text>
    <path d="M150 150 L130 130 L170 110 L130 90" stroke="#d32f2f" stroke-width="2" fill="none"/>
    
    <!-- Legend -->
    <rect x="400" y="50" width="180" height="100" fill="#fff" rx="5"/>
    <text x="410" y="70" font-family="monospace">Red Arrow = Preemption</text>
    <text x="410" y="90" font-family="monospace">Color = Priority Level</text>
    <text x="410" y="110" font-family="monospace">P1 > P2 > P3</text>
    
    <!-- Code Snippet -->
    <text x="300" y="300" text-anchor="middle" font-family="monospace" font-size="12">
        if (new_task->priority &lt; current_task->priority) preempt();
    </text>
</svg>
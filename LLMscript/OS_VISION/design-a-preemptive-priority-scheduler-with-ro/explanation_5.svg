<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Preemption Visualization -->
    <rect x="50" y="50" width="500" height="300" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <text x="300" y="80" text-anchor="middle" font-size="18" font-weight="bold">Preemptive Priority Handling</text>
    
    <!-- Timeline -->
    <path d="M100,150 L500,150" stroke="#666" stroke-width="2"/>
    
    <!-- Task Blocks -->
    <rect x="100" y="130" width="120" height="40" fill="#ff9999"/>
    <text x="160" y="155" text-anchor="middle">Task D (P1)</text>
    
    <rect x="220" y="130" width="120" height="40" fill="#99ff99"/>
    <text x="280" y="155" text-anchor="middle">Task B (P0)</text>
    
    <!-- Preemption Arrow -->
    <path d="M220,100 L220,130" stroke="#ff0000" stroke-width="2" marker-end="url(#preempt)"/>
    <text x="220" y="90" text-anchor="middle">Preemption!</text>
    
    <!-- Code Example -->
    <text x="100" y="220" font-family="monospace" font-size="14">
        <tspan x="100" y="240">// C++ Priority Comparison</tspan>
        <tspan x="100" y="260">if (new_task-&gt;priority &lt; current_task-&gt;priority) {</tspan>
        <tspan x="100" y="280">    preempt_current_task();</tspan>
        <tspan x="100" y="300">}</tspan>
    </text>

    <defs>
        <marker id="preempt" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#ff0000"/>
        </marker>
    </defs>
</svg>
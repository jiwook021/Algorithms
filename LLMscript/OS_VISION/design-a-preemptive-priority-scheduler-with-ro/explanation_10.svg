<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Title -->
    <text x="300" y="30" font-size="20" text-anchor="middle" font-family="monospace">Priority Queues with Round-Robin Subqueues</text>
    
    <!-- Queue Structure -->
    <rect x="50" y="80" width="500" height="240" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
    
    <!-- High Priority Queue -->
    <rect x="70" y="100" width="160" height="60" fill="#ffcccc"/>
    <text x="150" y="135" text-anchor="middle" font-family="monospace">Priority 0</text>
    <rect x="80" y="150" width="40" height="40" fill="#ff6666"/>
    <text x="100" y="175" text-anchor="middle" fill="white" font-family="monospace">T1</text>
    
    <!-- Medium Priority Queue (RR) -->
    <rect x="70" y="190" width="160" height="60" fill="#ffffcc"/>
    <text x="150" y="225" text-anchor="middle" font-family="monospace">Priority 1</text>
    <rect x="80" y="240" width="40" height="40" fill="#ffff66"/>
    <text x="100" y="265" text-anchor="middle" font-family="monospace">T2</text>
    <rect x="130" y="240" width="40" height="40" fill="#ffff66"/>
    <text x="150" y="265" text-anchor="middle" font-family="monospace">T3</text>
    <rect x="180" y="240" width="40" height="40" fill="#ffff66"/>
    <text x="200" y="265" text-anchor="middle" font-family="monospace">T4</text>
    <path d="M240,260 L260,260 L250,270 L240,260" fill="#666"/>
    
    <!-- Low Priority Queue -->
    <rect x="70" y="280" width="160" height="60" fill="#ccffcc"/>
    <text x="150" y="315" text-anchor="middle" font-family="monospace">Priority 2</text>
    <rect x="80" y="330" width="40" height="40" fill="#66ff66"/>
    <text x="100" y="355" text-anchor="middle" fill="white" font-family="monospace">T5</text>
    
    <!-- Code Example -->
    <rect x="280" y="100" width="250" height="240" fill="#e0e0e0" rx="5"/>
    <text x="405" y="130" text-anchor="middle" font-family="monospace" font-size="14">Task Structure</text>
    <text x="300" y="160" font-family="monospace" font-size="12"><tspan x="300" dy="1.2em">struct Task {</tspan>
<tspan x="320" dy="1.2em">int id;</tspan>
<tspan x="320" dy="1.2em">int priority;</tspan>
<tspan x="320" dy="1.2em">int remaining_time;</tspan>
<tspan x="300" dy="1.2em">};</tspan></text>
    
    <!-- Legend -->
    <rect x="400" y="200" width="110" height="90" fill="white" stroke="#666"/>
    <text x="405" y="215" font-family="monospace" font-size="12">High Priority: #ffcccc</text>
    <rect x="405" y="225" width="20" height="15" fill="#ffcccc"/>
    <text x="405" y="255" font-family="monospace" font-size="12">Medium: #ffffcc</text>
    <rect x="405" y="265" width="20" height="15" fill="#ffffcc"/>
    <text x="405" y="295" font-family="monospace" font-size="12">Low: #ccffcc</text>
    <rect x="405" y="305" width="20" height="15" fill="#ccffcc"/>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Round Robin Time Slicing -->
    <rect x="50" y="50" width="500" height="300" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <text x="300" y="80" text-anchor="middle" font-size="18" font-weight="bold">Round-Robin for Equal Priority</text>
    
    <!-- Circular Diagram -->
    <circle cx="300" cy="200" r="100" fill="none" stroke="#666" stroke-width="2"/>
    
    <!-- Task Positions -->
    <g transform="rotate(0,300,200)">
        <rect x="350" y="180" width="60" height="40" fill="#99ccff"/>
        <text x="380" y="205" text-anchor="middle">A</text>
    </g>
    
    <g transform="rotate(120,300,200)">
        <rect x="250" y="180" width="60" height="40" fill="#99ccff"/>
        <text x="280" y="205" text-anchor="middle">B</text>
    </g>
    
    <g transform="rotate(240,300,200)">
        <rect x="300" y="280" width="60" height="40" fill="#99ccff"/>
        <text x="330" y="305" text-anchor="middle">C</text>
    </g>

    <!-- Time Quantum -->
    <text x="300" y="320" text-anchor="middle">Time Quantum: 20ms</text>
    
    <!-- Code Example -->
    <text x="100" y="330" font-family="monospace" font-size="12">
        <tspan x="100" y="350">// C++ RR Implementation</tspan>
        <tspan x="100" y="370">void schedule_rr() {</tspan>
        <tspan x="120" y="390">    Task* t = queue.front();</tspan>
        <tspan x="120" y="410">    queue.pop_front();</tspan>
        <tspan x="120" y="430">    queue.push_back(t);</tspan>
        <tspan x="100" y="450">}</tspan>
    </text>

    <!-- Rotation Arrow -->
    <path d="M300,100 L300,150" stroke="#333" stroke-width="2" marker-end="url(#rrarrow)"/>
    <defs>
        <marker id="rrarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
        </marker>
    </defs>
</svg>
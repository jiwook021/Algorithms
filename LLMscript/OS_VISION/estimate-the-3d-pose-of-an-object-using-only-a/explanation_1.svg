<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <!-- 3D Coordinate System -->
    <path d="M100 350 L100 50 L150 100" stroke="black" fill="none"/>
    <path d="M100 350 L500 350 L450 300" stroke="black" fill="none"/>
    <text x="120" y="40" font-size="12">World Coordinates</text>
    
    <!-- 3D Object -->
    <path d="M200 250 L250 200 L300 250 L250 300 Z" fill="#4a90e2" opacity="0.8"/>
    <path d="M250 200 L300 150 L350 200 L300 250 Z" fill="#4a90e2" opacity="0.6"/>
    
    <!-- Camera -->
    <path d="M500 100 L550 150 L500 200 L450 150 Z" fill="#d0021b"/>
    <circle cx="500" cy="150" r="10" fill="#000"/>
    
    <!-- Projection Lines -->
    <path d="M200 250 Q350 150 500 150" stroke="#7ed321" fill="none" stroke-dasharray="4"/>
    <path d="M300 150 Q400 150 500 150" stroke="#7ed321" fill="none" stroke-dasharray="4"/>
    
    <!-- Image Plane -->
    <rect x="480" y="50" width="40" height="200" fill="#fff" stroke="#000"/>
    <text x="490" y="280" font-size="12">Image Plane</text>
    
    <!-- Equations -->
    <text x="50" y="300" font-size="14" font-family="monospace">
        <tspan x="50" y="300">s[u v 1]^T = K[R|t][X Y Z 1]^T</tspan>
    </text>
</svg>
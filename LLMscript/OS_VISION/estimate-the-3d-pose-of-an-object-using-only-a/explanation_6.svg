<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <g transform="translate(50,50)">
        <!-- PnP Diagram -->
        <rect x="0" y="0" width="500" height="300" fill="none"/>
        
        <!-- Input -->
        <rect x="10" y="50" width="150" height="80" fill="#cce5ff" rx="5"/>
        <text x="35" y="80" font-size="12">2D-3D</text>
        <text x="35" y="100" font-size="12">Correspondences</text>
        
        <!-- Process -->
        <path d="M170 90 L270 90" stroke="black"/>
        <polygon points="270 85 280 90 270 95" fill="black"/>
        
        <rect x="280" y="50" width="150" height="80" fill="#ffd6cc" rx="5"/>
        <text x="300" y="80" font-size="12">Perspective-n-Point</text>
        <text x="300" y="100" font-size="12">(PnP) Algorithm</text>
        
        <!-- Output -->
        <path d="M430 90 L530 90" stroke="black"/>
        <polygon points="530 85 540 90 530 95" fill="black"/>
        
        <rect x="540" y="50" width="150" height="80" fill="#ccffcc" rx="5"/>
        <text x="560" y="80" font-size="12">Rotation &amp;</text>
        <text x="560" y="100" font-size="12">Translation Vectors</text>
        
        <!-- Math -->
        <text x="50" y="200" font-size="14">min‖proj(X) - x‖</text>
        <text x="50" y="220" font-size="12" fill="darkgreen">Optimization Problem</text>
        
        <!-- Code Example -->
        <g transform="translate(20,250)">
            <rect x="0" y="0" width="560" height="60" fill="#e0e0e0" rx="5"/>
            <text x="20" y="20" font-family="monospace" font-size="12" fill="black">
                <tspan x="10" y="20">// C++: Solve PnP with OpenCV</tspan>
                <tspan x="10" y="40">Mat rvec, tvec;</tspan>
                <tspan x="10" y="60">solvePnP(objectPoints, imagePoints, cameraMatrix, distCoeffs, rvec, tvec);</tspan>
            </text>
        </g>
    </g>
</svg>
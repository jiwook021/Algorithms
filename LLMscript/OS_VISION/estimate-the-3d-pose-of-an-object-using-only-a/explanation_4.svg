<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <g transform="translate(50,50)">
        <!-- 3D Coordinate System -->
        <line x1="0" y1="200" x2="400" y2="200" stroke="black" stroke-width="2"/>
        <line x1="200" y1="0" x2="200" y2="300" stroke="black" stroke-width="2"/>
        <path d="M200 0 l-10 20 l20 0 Z" fill="black"/>
        <path d="M400 200 l-20 10 l0 -20 Z" fill="black"/>
        
        <!-- Camera -->
        <rect x="300" y="150" width="80" height="60" fill="#666"/>
        <circle cx="340" cy="180" r="20" fill="#444"/>
        <path d="M340 160 l0 40 l30 -20 Z" fill="red"/>
        
        <!-- Projection Lines -->
        <line x1="100" y1="50" x2="340" y2="180" stroke="green" stroke-dasharray="4"/>
        <line x1="300" y1="250" x2="340" y2="180" stroke="green" stroke-dasharray="4"/>
        
        <!-- Points -->
        <circle cx="100" cy="50" r="5" fill="blue"/>
        <circle cx="300" cy="250" r="5" fill="blue"/>
        <circle cx="340" cy="180" r="3" fill="red"/>
        
        <!-- Labels -->
        <text x="80" y="40" font-size="12">3D Object Point (X,Y,Z)</text>
        <text x="310" y="270" font-size="12">Projected Point (u,v)</text>
        <text x="350" y="170" font-size="12">Image Plane</text>
        <text x="240" y="20" font-size="14" fill="blue">Camera Projection Matrix</text>
        
        <!-- Code Example -->
        <g transform="translate(20,300)">
            <rect x="0" y="0" width="560" height="80" fill="#e0e0e0" rx="5"/>
            <text x="20" y="20" font-family="monospace" font-size="12" fill="black">
                <tspan x="10" y="20">// Camera projection in C++</tspan>
                <tspan x="10" y="40">Mat projection = cameraMatrix * (rotation|translation);</tspan>
                <tspan x="10" y="60">Point2d projected = projectPoint(Point3d(X,Y,Z), projection);</tspan>
            </text>
        </g>
    </g>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- 2D-3D Correspondence Visualization -->
    <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
    
    <!-- 3D Coordinate System -->
    <path d="M100 350 l50 -150 l100 0" stroke="#666" fill="none"/>
    <path d="M100 350 l150 0 l-50 100" stroke="#666" fill="none"/>
    <text x="280" y="380" font-size="14">3D Object</text>
    
    <!-- 2D Image Plane -->
    <rect x="300" y="50" width="250" height="200" fill="#fff" stroke="#4a90e2"/>
    <text x="380" y="30" font-size="16" fill="#4a90e2">2D Image</text>
    
    <!-- Correspondence Lines -->
    <path d="M150 250 L350 150" stroke="#ff6b6b" stroke-dasharray="4"/>
    <path d="M200 300 L400 200" stroke="#ff6b6b" stroke-dasharray="4"/>
    
    <!-- 3D Points -->
    <circle cx="150" cy="250" r="5" fill="#2ecc71"/>
    <circle cx="200" cy="300" r="5" fill="#2ecc71"/>
    
    <!-- 2D Projections -->
    <circle cx="350" cy="150" r="5" fill="#e74c3c"/>
    <circle cx="400" cy="200" r="5" fill="#e74c3c"/>
    
    <!-- Labels -->
    <text x="140" y="240" font-size="12" fill="#2ecc71">X₁(x,y,z)</text>
    <text x="340" y="140" font-size="12" fill="#e74c3c">x₁(u,v)</text>
    
    <!-- Code Example -->
    <rect x="20" y="20" width="260" height="100" fill="#fff" stroke="#999"/>
    <text x="30" y="40" font-family="monospace" font-size="12" fill="#333">// 2D-3D point matching</text>
    <text x="30" y="60" font-family="monospace" font-size="12" fill="#333">std::vector&lt;cv::Point3f&gt; objectPoints;</text>
    <text x="30" y="80" font-family="monospace" font-size="12" fill="#333">std::vector&lt;cv::Point2f&gt; imagePoints;</text>
    <text x="30" y="100" font-family="monospace" font-size="12" fill="#333">cv::solvePnP(objectPoints, imagePoints, ...);</text>
</svg>
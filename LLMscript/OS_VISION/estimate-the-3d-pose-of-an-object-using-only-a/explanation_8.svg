<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Perspective Projection -->
    <rect x="0" y="0" width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Camera Frustum -->
    <path d="M300 200 l-100 100 l200 0 l-100 -100" fill="#a0d8ef" opacity="0.3"/>
    <path d="M300 200 l0 100" stroke="#3498db" stroke-width="2"/>
    
    <!-- 3D Point -->
    <circle cx="200" cy="100" r="6" fill="#e67e22"/>
    <text x="190" y="90" font-size="12">Object Point</text>
    <text x="210" y="110" font-size="12" fill="#e67e22">(X,Y,Z)</text>
    
    <!-- Projection Line -->
    <path d="M200 100 L300 300" stroke="#e74c3c" stroke-dasharray="4"/>
    
    <!-- Image Plane -->
    <rect x="250" y="250" width="100" height="100" fill="#fff" stroke="#2ecc71"/>
    <circle cx="300" cy="300" r="5" fill="#2ecc71"/>
    <text x="280" y="320" font-size="12">(u,v)</text>
    
    <!-- Camera Center -->
    <circle cx="300" cy="200" r="5" fill="#3498db"/>
    <text x="310" y="210" font-size="12">Camera Center</text>
    
    <!-- Projection Equation -->
    <text x="100" y="180" font-size="14" fill="#2c3e50">x = K[R|t]X</text>
    <text x="100" y="200" font-size="12" fill="#666">(Camera Projection Matrix)</text>
    
    <!-- Code Example -->
    <rect x="400" y="50" width="180" height="90" fill="#fff" stroke="#999"/>
    <text x="410" y="70" font-family="monospace" font-size="12">// Camera matrix setup</text>
    <text x="410" y="90" font-family="monospace" font-size="12">cv::Mat cameraMatrix = {</text>
    <text x="410" y="110" font-family="monospace" font-size="12">    {fx, 0, cx},</text>
    <text x="410" y="130" font-family="monospace" font-size="12">    {0, fy, cy}};</text>
</svg>
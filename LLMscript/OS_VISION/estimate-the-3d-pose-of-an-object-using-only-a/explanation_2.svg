<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- 2D Image -->
    <rect x="50" y="50" width="200" height="200" fill="#fff" stroke="#000"/>
    <circle cx="150" cy="150" r="5" fill="#f8e71c"/>
    <circle cx="180" cy="120" r="5" fill="#f8e71c"/>
    <text x="60" y="270" font-size="12">Input Image (2D)</text>
    
    <!-- 3D Model -->
    <path d="M350 100 L400 50 L450 100 L400 150 Z" fill="#4a90e2" opacity="0.8"/>
    <path d="M400 50 L450 0 L500 50 L450 100 Z" fill="#4a90e2" opacity="0.6"/>
    <circle cx="400" cy="50" r="5" fill="#f8e71c"/>
    <circle cx="450" cy="0" r="5" fill="#f8e71c"/>
    <text x="360" y="270" font-size="12">3D Model</text>
    
    <!-- Correspondence Lines -->
    <path d="M150 150 L400 50" stroke="#7ed321" stroke-dasharray="4"/>
    <path d="M180 120 L450 0" stroke="#7ed321" stroke-dasharray="4"/>
    
    <!-- Code Sample -->
    <text x="50" y="300" font-size="12" font-family="monospace">
        <tspan x="50" y="300">// Feature matching</tspan>
        <tspan x="50" y="320">vector&lt;Point2d&gt; imagePoints;</tspan>
        <tspan x="50" y="340">vector&lt;Point3d&gt; modelPoints;</tspan>
        <tspan x="50" y="360">findKeypoints(img, imagePoints);</tspan>
    </text>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font: 12px sans-serif; }
    .camera { fill: #ff4444; }
    .projection { fill: none; stroke: #666; stroke-dasharray: 4; }
    .code-bg { fill: #f0f0f0; stroke: #ccc; }
  </style>

  <!-- Camera -->
  <circle cx="100" cy="200" r="15" class="camera"/>
  <text x="70" y="230">Camera</text>

  <!-- 3D Object -->
  <path d="M300,150 L400,150 400,250 300,250 Z" fill="none" stroke="#4444ff" stroke-width="2"/>
  <text x="320" y="140">3D Object</text>

  <!-- Image Plane -->
  <rect x="500" y="100" width="4" height="200" fill="#44ff44" opacity="0.8"/>
  <text x="460" y="180" transform="rotate(90 460 180)">Image Plane</text>

  <!-- Projection Lines -->
  <path d="M100 200 Q250 180 300 150" class="projection"/>
  <path d="M100 200 Q250 200 400 150" class="projection"/>
  <path d="M100 200 Q250 220 300 250" class="projection"/>
  <path d="M100 200 Q250 240 400 250" class="projection"/>

  <!-- 2D Projection -->
  <rect x="500" y="160" width="4" height="80" fill="#ffaa00"/>
  <text x="520" y="200">2D Projection</text>

  <!-- Code Example -->
  <rect x="20" y="300" width="560" height="80" rx="5" class="code-bg"/>
  <text x="40" y="320" font-family="monospace">
    <tspan x="30" y="330">// Perspective projection using camera intrinsics</tspan>
    <tspan x="30" y="350">cv::Mat project3DTo2D(const cv::Mat&amp; objectPoints,</tspan>
    <tspan x="30" y="370">                   const cv::Mat&amp; cameraMatrix) {</tspan>
    <tspan x="30" y="390">    cv::Mat imagePoints;</tspan>
    <tspan x="30" y="410">    cv::projectPoints(objectPoints, rvec, tvec,</tspan>
    <tspan x="30" y="430">                     cameraMatrix, distCoeffs, imagePoints);</tspan>
    <tspan x="30" y="450">    return imagePoints;</tspan>
    <tspan x="30" y="470">}</tspan>
  </text>

  <path d="M100,200 L300,150 L400,250 L300,250" fill="none" stroke="#444" opacity="0.2"/>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- PnP Diagram -->
    <path d="M100 350 L100 50 L150 100" stroke="black" fill="none"/>
    <path d="M100 350 L500 350 L450 300" stroke="black" fill="none"/>
    
    <!-- 3D Points -->
    <circle cx="200" cy="250" r="5" fill="#4a90e2"/>
    <circle cx="300" cy="150" r="5" fill="#4a90e2"/>
    <text x="180" y="240" font-size="10">3D Point</text>
    
    <!-- Camera -->
    <path d="M500 100 L550 150 L500 200 L450 150 Z" fill="#d0021b"/>
    <circle cx="500" cy="150" r="10" fill="#000"/>
    
    <!-- Pose Vectors -->
    <path d="M500 150 L450 100" stroke="#f5a623" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M500 150 L500 50" stroke="#f5a623" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="460" y="100" font-size="12">Rotation (R)</text>
    <text x="510" y="80" font-size="12">Translation (t)</text>
    
    <!-- Code Sample -->
    <text x="50" y="300" font-size="12" font-family="monospace">
        <tspan x="50" y="300">// Solve PnP with OpenCV</tspan>
        <tspan x="50" y="320">Mat rvec, tvec;</tspan>
        <tspan x="50" y="340">solvePnP(objectPoints, </tspan>
        <tspan x="50" y="360">imagePoints, cameraMatrix, </tspan>
        <tspan x="50" y="380">distCoeffs, rvec, tvec);</tspan>
    </text>
    
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#f5a623"/>
        </marker>
    </defs>
</svg>
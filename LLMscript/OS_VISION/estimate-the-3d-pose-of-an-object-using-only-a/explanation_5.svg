<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <g transform="translate(50,50)">
        <!-- 3D Model -->
        <polygon points="300,50 400,100 300,150 200,100" fill="none" stroke="blue"/>
        <line x1="300" y1="50" x2="300" y2="150" stroke="blue"/>
        <line x1="400" y1="100" x2="200" y2="100" stroke="blue"/>
        
        <!-- 2D Image -->
        <rect x="100" y="200" width="200" height="150" fill="#ddd"/>
        <polygon points="150,250 250,250 200,350" fill="none" stroke="red"/>
        
        <!-- Feature Matching -->
        <line x1="300" y1="50" x2="150" y2="250" stroke="green" stroke-dasharray="4"/>
        <line x1="400" y1="100" x2="250" y2="250" stroke="green" stroke-dasharray="4"/>
        <line x1="200" y1="100" x2="150" y2="350" stroke="green" stroke-dasharray="4"/>
        
        <!-- Labels -->
        <text x="320" y="40" font-size="12">3D Model Features</text>
        <text x="150" y="220" font-size="12">2D Image Features</text>
        <text x="400" y="300" font-size="14" fill="blue">Feature Correspondence Matching</text>
        
        <!-- Code Example -->
        <g transform="translate(20,320)">
            <rect x="0" y="0" width="560" height="60" fill="#e0e0e0" rx="5"/>
            <text x="20" y="20" font-family="monospace" font-size="12" fill="black">
                <tspan x="10" y="20">// C++: Establish 2D-3D correspondences</tspan>
                <tspan x="10" y="40">vector&lt;Point3d&gt; modelPoints = {...}; // 3D points</tspan>
                <tspan x="10" y="60">vector&lt;Point2d&gt; imagePoints = {...}; // 2D detections</tspan>
            </text>
        </g>
    </g>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="20">Thread Pool Structure</text>
    
    <!-- Task Queue -->
    <rect x="50" y="100" width="500" height="60" rx="5" fill="#c0e6ba"/>
    <text x="300" y="140" text-anchor="middle" fill="#1a5a1a">Task Queue</text>
    
    <!-- Worker Threads -->
    <rect x="100" y="200" width="80" height="40" rx="5" fill="#a0c4ff"/>
    <rect x="220" y="200" width="80" height="40" rx="5" fill="#a0c4ff"/>
    <rect x="340" y="200" width="80" height="40" rx="5" fill="#a0c4ff"/>
    <rect x="460" y="200" width="80" height="40" rx="5" fill="#a0c4ff"/>
    <text x="300" y="250" text-anchor="middle" fill="#1a315a">Worker Threads</text>

    <!-- Code Example -->
    <g transform="translate(50 280)">
        <rect width="500" height="100" rx="5" fill="#2b2b2b"/>
        <text x="20" y="25" fill="white" font-family="monospace" font-size="12">
            <tspan x="10" dy="1.2em">while (running) {</tspan>
            <tspan x="20" dy="1.2em">auto task = queue.pop();</tspan>
            <tspan x="20" dy="1.2em">task.execute();</tspan>
            <tspan x="10" dy="1.2em">}</tspan>
        </text>
    </g>
</svg>
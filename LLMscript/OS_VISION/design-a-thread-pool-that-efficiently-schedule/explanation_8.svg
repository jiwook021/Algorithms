<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f3e5f6"/>
  
  <!-- Task Scheduling Flow -->
  <rect x="50" y="50" width="120" height="60" rx="5" fill="#fff" stroke="#7b1fa2"/>
  <text x="110" y="80" text-anchor="middle" font-family="monospace" font-size="12">Main Thread</text>
  
  <rect x="250" y="50" width="120" height="60" rx="5" fill="#fff" stroke="#7b1fa2"/>
  <text x="310" y="80" text-anchor="middle" font-family="monospace" font-size="12">Task Queue</text>
  
  <rect x="450" y="50" width="120" height="60" rx="5" fill="#fff" stroke="#7b1fa2"/>
  <text x="510" y="80" text-anchor="middle" font-family="monospace" font-size="12">Worker Thread</text>
  
  <!-- Arrows -->
  <path d="M170 80L250 80" stroke="#9c27b0" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M370 80L450 80" stroke="#9c27b0" stroke-width="2" marker-end="url(#arrow2)"/>
  
  <!-- Future/Promise -->
  <rect x="50" y="200" width="200" height="60" rx="5" fill="#fff" stroke="#2196f3"/>
  <text x="150" y="230" text-anchor="middle" font-family="monospace" font-size="12">std::promise</text>
  
  <rect x="350" y="200" width="200" height="60" rx="5" fill="#fff" stroke="#2196f3"/>
  <text x="450" y="230" text-anchor="middle" font-family="monospace" font-size="12">std::future</text>
  
  <!-- Code Example -->
  <text x="100" y="300" font-family="monospace" font-size="10" fill="#333">
    <tspan x="50" dy="0">auto task = [] (std::promise&lt;int&gt; p) {</tspan>
    <tspan x="70" dy="16">p.set_value(42);</tspan>
    <tspan x="50" dy="16">};</tspan>
    <tspan x="50" dy="16">std::future&lt;int&gt; fut = p.get_future();</tspan>
  </text>
  
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#9c27b0"/>
    </marker>
  </defs>
</svg>
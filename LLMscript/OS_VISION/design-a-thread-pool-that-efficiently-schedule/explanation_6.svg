<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  
  <!-- Thread Pool Structure -->
  <rect x="50" y="100" width="200" height="200" rx="10" fill="#e1f5fe" stroke="#039be5" stroke-width="2"/>
  <text x="150" y="130" text-anchor="middle" font-family="monospace" font-size="14">Thread Pool</text>
  
  <!-- Task Queue -->
  <rect x="300" y="50" width="250" height="100" rx="5" fill="#fff3e0" stroke="#fb8c00"/>
  <text x="425" y="80" text-anchor="middle" font-family="monospace" font-size="12">Task Queue</text>
  <rect x="320" y="100" width="30" height="30" fill="#4caf50"/>
  <rect x="360" y="100" width="30" height="30" fill="#4caf50"/>
  <rect x="400" y="100" width="30" height="30" fill="#4caf50"/>
  <rect x="440" y="100" width="30" height="30" fill="#4caf50"/>
  <rect x="480" y="100" width="30" height="30" fill="#4caf50"/>
  
  <!-- Worker Threads -->
  <circle cx="100" cy="200" r="20" fill="#3949ab"/>
  <circle cx="100" cy="250" r="20" fill="#3949ab"/>
  <circle cx="100" cy="300" r="20" fill="#3949ab"/>
  
  <!-- Arrows -->
  <path d="M250 200L300 100" stroke="#d32f2f" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M250 250L300 100" stroke="#d32f2f" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M250 300L300 100" stroke="#d32f2f" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Code Example -->
  <text x="100" y="360" font-family="monospace" font-size="10" fill="#333">
    <tspan x="50" dy="0">class ThreadPool {</tspan>
    <tspan x="60" dy="16">std::vector&lt;std::thread&gt; workers;</tspan>
    <tspan x="60" dy="16">std::queue&lt;std::function&lt;void()&gt;&gt; tasks;</tspan>
    <tspan x="50" dy="16">};</tspan>
  </text>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d32f2f"/>
    </marker>
  </defs>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Deadlock Prevention Diagram -->
    <rect x="100" y="100" width="400" height="200" fill="#fff" rx="10" stroke="#666"/>
    
    <!-- Resource Ordering -->
    <rect x="150" y="120" width="80" height="40" fill="#ffd700" rx="5"/>
    <text x="190" y="145" text-anchor="middle" font-family="monospace">Lock A</text>
    <rect x="150" y="180" width="80" height="40" fill="#00bfff" rx="5"/>
    <text x="190" y="205" text-anchor="middle" font-family="monospace">Lock B</text>
    
    <!-- Thread Flow -->
    <path d="M250,140 L350,140 L350,240 L250,240" stroke="#666" fill="none" stroke-dasharray="4"/>
    <text x="300" y="130" text-anchor="middle" font-family="monospace">Execution Flow</text>
    
    <!-- Code Example -->
    <text x="400" y="80" font-family="monospace" font-size="12" fill="#000">
        <tspan x="400" y="80">void safe_operation() {</tspan>
        <tspan x="410" y="100">    std::scoped_lock lk{A, B};</tspan>
        <tspan x="410" y="120">    // Critical section</tspan>
        <tspan x="400" y="140">}</tspan>
    </text>
    
    <!-- Lock Order Text -->
    <text x="100" y="280" font-family="monospace" font-size="14">
        Lock Order: Always acquire A before B
    </text>
    
    <!-- Thread Markers -->
    <rect x="50" y="140" width="80" height="40" fill="#c0ffc0" rx="5"/>
    <text x="90" y="165" text-anchor="middle" font-family="monospace">Thread 1</text>
    <rect x="50" y="240" width="80" height="40" fill="#ffc0cb" rx="5"/>
    <text x="90" y="265" text-anchor="middle" font-family="monospace">Thread 2</text>
    
    <!-- Arrows -->
    <path d="M130,160 L150,160" stroke="#666" fill="none" marker-end="url(#arrow)"/>
    <path d="M130,260 L150,260" stroke="#666" fill="none" marker-end="url(#arrow)"/>
    
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
        </marker>
    </defs>
</svg>
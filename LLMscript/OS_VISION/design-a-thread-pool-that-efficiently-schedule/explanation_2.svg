<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="20">Task Submission &amp; Queue Management</text>
    
    <!-- Main Thread -->
    <rect x="50" y="80" width="150" height="60" rx="5" fill="#ffd700"/>
    <text x="125" y="115" text-anchor="middle">Main Thread</text>
    
    <!-- Submit Arrow -->
    <path d="M225 110 L275 110 L275 210 L175 210" stroke="#666" fill="none" marker-end="url(#arrow)"/>
    <text x="240" y="100" text-anchor="middle" font-size="12">submitTask()</text>
    
    <!-- Task Queue with Lock -->
    <rect x="50" y="210" width="500" height="60" rx="5" fill="#c0e6ba"/>
    <rect x="240" y="200" width="120" height="80" rx="5" fill="none" stroke="#ff4444" stroke-width="2"/>
    <text x="300" y="245" text-anchor="middle" fill="#1a5a1a">Task Queue</text>
    <text x="300" y="265" text-anchor="middle" fill="#ff4444" font-size="12">Guarded by mutex</text>

    <!-- Code Example -->
    <g transform="translate(50 300)">
        <rect width="500" height="80" rx="5" fill="#2b2b2b"/>
        <text x="20" y="25" fill="white" font-family="monospace" font-size="12">
            <tspan x="10" dy="1.2em">void addTask(Task task) {</tspan>
            <tspan x="20" dy="1.2em">std::lock_guard lock(queue_mutex);</tspan>
            <tspan x="20" dy="1.2em">task_queue.push(task);</tspan>
            <tspan x="10" dy="1.2em">}</tspan>
        </text>
    </g>
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
        </marker>
    </defs>
</svg>
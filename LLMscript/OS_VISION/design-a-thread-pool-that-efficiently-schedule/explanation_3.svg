<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="20">Deadlock Prevention Strategy</text>
    
    <!-- Problem Scenario -->
    <text x="300" y="60" text-anchor="middle" fill="#cc0000">Problem: Circular Wait</text>
    <g transform="translate(50 80)">
        <rect x="0" y="0" width="250" height="180" rx="5" fill="#ffe6e6"/>
        <circle cx="60" cy="40" r="30" fill="#ff9999"/>
        <circle cx="190" cy="40" r="30" fill="#ff9999"/>
        <path d="M60 70 L60 120 L190 120 L190 70" stroke="#666" fill="none"/>
        <text x="125" y="160" text-anchor="middle">Deadlock</text>
    </g>

    <!-- Solution -->
    <g transform="translate(300 80)">
        <rect x="0" y="0" width="250" height="180" rx="5" fill="#e6ffe6"/>
        <rect x="50" y="30" width="150" height="40" rx="5" fill="#a0c4ff"/>
        <text x="125" y="55" text-anchor="middle">Single Lock</text>
        <path d="M125 70 L125 120" stroke="#666"/>
        <rect x="50" y="120" width="150" height="40" rx="5" fill="#c0e6ba"/>
        <text x="125" y="145" text-anchor="middle">Task Queue</text>
        <text x="125" y="170" text-anchor="middle" fill="#009900">Safe Access</text>
    </g>

    <!-- Code Example -->
    <g transform="translate(150 280)">
        <rect width="300" height="80" rx="5" fill="#2b2b2b"/>
        <text x="20" y="25" fill="white" font-family="monospace" font-size="12">
            <tspan x="10" dy="1.2em">std::mutex queue_mutex;</tspan>
            <tspan x="10" dy="1.2em">std::condition_variable cv;</tspan>
            <tspan x="10" dy="1.2em">// Single synchronization point</tspan>
        </text>
    </g>
</svg>
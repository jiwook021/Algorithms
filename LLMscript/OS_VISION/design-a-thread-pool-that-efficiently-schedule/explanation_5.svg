<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="20">Future-Based Task Handling</text>
    
    <!-- Task Chain -->
    <rect x="100" y="100" width="120" height="60" rx="5" fill="#ffd700"/>
    <text x="160" y="135" text-anchor="middle">Task A</text>
    <text x="160" y="155" text-anchor="middle" font-size="12">(returns Future)</text>
    
    <path d="M220 130 L280 130" stroke="#666" marker-end="url(#arrow)"/>
    <text x="250" y="120" text-anchor="middle">depends on</text>
    
    <rect x="280" y="100" width="120" height="60" rx="5" fill="#a0c4ff"/>
    <text x="340" y="135" text-anchor="middle">Task B</text>
    <text x="340" y="155" text-anchor="middle" font-size="12">(awaits Future)</text>

    <!-- Thread Pool Interaction -->
    <rect x="200" y="200" width="200" height="80" rx="5" fill="#c0e6ba"/>
    <text x="300" y="240" text-anchor="middle">Thread Pool</text>
    <text x="300" y="260" text-anchor="middle">Automatically schedules</text>
    <text x="300" y="280" text-anchor="middle">dependent tasks</text>

    <!-- Code Example -->
    <g transform="translate(100 300)">
        <rect width="400" height="80" rx="5" fill="#2b2b2b"/>
        <text x="20" y="25" fill="white" font-family="monospace" font-size="12">
            <tspan x="10" dy="1.2em">auto future = pool.enqueue([](){...});</tspan>
            <tspan x="10" dy="1.2em">pool.enqueue([=](){ future.get(); ... });</tspan>
        </text>
    </g>
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
        </marker>
    </defs>
</svg>
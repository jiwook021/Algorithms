<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    <text x="300" y="30" text-anchor="middle" font-size="20">Work Stealing Mechanism</text>
    
    <!-- Thread Queues -->
    <rect x="50" y="100" width="120" height="60" rx="5" fill="#ffb3ba"/>
    <rect x="200" y="100" width="120" height="60" rx="5" fill="#baffc9"/>
    <rect x="350" y="100" width="120" height="60" rx="5" fill="#bae1ff"/>
    <text x="110" y="140" text-anchor="middle">Thread 1 Queue</text>
    <text x="260" y="140" text-anchor="middle">Thread 2 Queue</text>
    <text x="410" y="140" text-anchor="middle">Thread 3 Queue</text>

    <!-- Stealing Arrows -->
    <path d="M410 70 Q350 40 260 70" stroke="#666" fill="none" marker-end="url(#arrow)"/>
    <text x="335" y="50" text-anchor="middle">Steal tasks</text>
    <path d="M110 70 Q180 40 260 70" stroke="#666" fill="none" marker-end="url(#arrow)"/>

    <!-- Code Example -->
    <g transform="translate(100 200)">
        <rect width="400" height="150" rx="5" fill="#2b2b2b"/>
        <text x="20" y="25" fill="white" font-family="monospace" font-size="12">
            <tspan x="10" dy="1.2em">Task stealFromOtherThread() {</tspan>
            <tspan x="20" dy="1.2em">for (auto&amp; queue : other_queues) {</tspan>
            <tspan x="30" dy="1.2em">if (queue.trySteal(task)) {</tspan>
            <tspan x="40" dy="1.2em">return task;</tspan>
            <tspan x="20" dy="1.2em">}}}</tspan>
        </text>
    </g>
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
        </marker>
    </defs>
</svg>
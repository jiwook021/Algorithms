<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#fffde7"/>
  
  <!-- Deadlock Scenario -->
  <rect x="100" y="100" width="150" height="150" rx="10" fill="#ffebee" stroke="#f44336"/>
  <text x="175" y="120" text-anchor="middle" font-family="monospace" font-size="12">Deadlock</text>
  
  <!-- Circular Wait -->
  <path d="M175 150 Q275 100 375 150 T575 150" stroke="#6a1b9a" fill="none" stroke-width="2"/>
  <text x="400" y="120" font-family="monospace" font-size="10" fill="#6a1b9a">Circular Wait</text>
  
  <!-- Thread Pool Prevention -->
  <rect x="100" y="250" width="400" height="100" rx="10" fill="#e8f5e9" stroke="#43a047"/>
  <text x="300" y="270" text-anchor="middle" font-family="monospace" font-size="12">Prevention Strategy</text>
  
  <!-- Work Stealing -->
  <rect x="120" y="300" width="100" height="30" fill="#c8e6c9"/>
  <text x="170" y="320" text-anchor="middle" font-family="monospace" font-size="10">Work Stealing</text>
  
  <!-- Resource Hierarchy -->
  <rect x="280" y="300" width="100" height="30" fill="#c8e6c9"/>
  <text x="330" y="320" text-anchor="middle" font-family="monospace" font-size="10">Resource Ordering</text>
  
  <!-- Code Example -->
  <text x="100" y="360" font-family="monospace" font-size="10" fill="#333">
    <tspan x="100" dy="0">void worker() {</tspan>
    <tspan x="120" dy="16">while (auto task = </tspan>
    <tspan x="120" dy="16">queue.pop_or_steal()) {</tspan>
    <tspan x="120" dy="16">    task();</tspan>
    <tspan x="100" dy="16">}}</tspan>
  </text>
</svg>
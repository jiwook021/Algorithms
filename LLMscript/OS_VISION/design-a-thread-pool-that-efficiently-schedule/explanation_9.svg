<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f0f0f0"/>
    
    <!-- Thread Pool Structure -->
    <rect x="50" y="50" width="200" height="300" fill="#e0e0ff" rx="10"/>
    <text x="150" y="80" text-anchor="middle" font-family="monospace" font-size="16">Task Queue</text>
    
    <!-- Worker Threads -->
    <rect x="350" y="50" width="200" height="80" fill="#c0ffc0" rx="10"/>
    <rect x="350" y="150" width="200" height="80" fill="#c0ffc0" rx="10"/>
    <rect x="350" y="250" width="200" height="80" fill="#c0ffc0" rx="10"/>
    <text x="450" y="100" text-anchor="middle" font-family="monospace" font-size="16">Worker 1</text>
    <text x="450" y="200" text-anchor="middle" font-family="monospace" font-size="16">Worker 2</text>
    <text x="450" y="300" text-anchor="middle" font-family="monospace" font-size="16">Worker 3</text>
    
    <!-- Tasks -->
    <rect x="100" y="100" width="100" height="30" fill="#ffcccc" rx="5"/>
    <rect x="100" y="140" width="100" height="30" fill="#ffcccc" rx="5"/>
    <rect x="100" y="180" width="100" height="30" fill="#ffcccc" rx="5"/>
    <text x="150" y="120" text-anchor="middle" font-family="monospace" font-size="12">Task 1</text>
    <text x="150" y="160" text-anchor="middle" font-family="monospace" font-size="12">Task 2</text>
    <text x="150" y="200" text-anchor="middle" font-family="monospace" font-size="12">Task 3</text>
    
    <!-- Arrows -->
    <path d="M250,120 L320,100" stroke="#666" fill="none" marker-end="url(#arrow)"/>
    <path d="M250,160 L320,140" stroke="#666" fill="none" marker-end="url(#arrow)"/>
    <path d="M250,200 L320,180" stroke="#666" fill="none" marker-end="url(#arrow)"/>
    
    <!-- Code Example -->
    <text x="400" y="350" font-family="monospace" font-size="12" fill="#000">
        <tspan x="400" y="350">void worker_thread() {</tspan>
        <tspan x="410" y="370">    while (auto task = queue.pop()) {</tspan>
        <tspan x="410" y="390">        task->execute();</tspan>
        <tspan x="410" y="410">    }}</tspan>
    </text>
    
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
        </marker>
    </defs>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <g transform="translate(50,50)">
        <!-- Process State Diagram -->
        <circle cx="100" cy="100" r="50" fill="#2196f3" stroke="#1565c0"/>
        <text x="100" y="100" text-anchor="middle" fill="#fff" font-family="monospace">Running</text>

        <!-- Checkpoint State -->
        <circle cx="300" cy="100" r="50" fill="#4caf50" stroke="#2e7d32"/>
        <text x="300" y="100" text-anchor="middle" fill="#fff" font-family="monospace">Checkpoint</text>

        <!-- Recovery State -->
        <circle cx="500" cy="100" r="50" fill="#ff9800" stroke="#ef6c00"/>
        <text x="500" y="100" text-anchor="middle" fill="#fff" font-family="monospace">Recovered</text>

        <!-- State Transitions -->
        <path d="M150 100 L250 100" stroke="#000" stroke-width="2"/>
        <path d="M350 100 L450 100" stroke="#000" stroke-width="2"/>
        <path d="M500 150 L500 250 L100 250 L100 150" stroke="#000" stroke-width="2" fill="none"/>

        <!-- Code Example -->
        <g transform="translate(100,260)">
            <rect width="400" height="100" fill="#263238" rx="5"/>
            <text x="20" y="30" font-family="monospace" font-size="12" fill="#fff">
                <tspan x="20" dy="1.2em">int main() {</tspan>
                <tspan x="40" dy="1.2em" fill="#80deea">register_signal_handler(SIGSEGV, recover);</tspan>
                <tspan x="40" dy="1.2em">create_checkpoint();</tspan>
                <tspan x="20" dy="1.2em">}</tspan>
            </text>
        </g>
    </g>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <g transform="translate(50,50)">
        <!-- Crash Visualization -->
        <path d="M250 0 L230 40 L270 40 Z" fill="#ff1744"/>
        <path d="M250 40 Q250 60 230 80" stroke="#ff1744" fill="none"/>
        <text x="250" y="100" text-anchor="middle" font-family="monospace" font-size="14">CRASH</text>

        <!-- Recovery Process -->
        <rect x="0" y="120" width="500" height="150" fill="#fff" stroke="#4caf50" stroke-width="2"/>
        <path d="M250 120 v-20 M240 100 h20" stroke="#4caf50"/>
        <text x="250" y="160" text-anchor="middle" font-family="monospace" font-size="14">Recovery Process</text>

        <!-- Code Example -->
        <text x="30" y="190" font-family="monospace" font-size="12">
            <tspan fill="#4caf50">if (crash_detected) {</tspan>
            <tspan x="30" dy="1.5em" fill="#2196f3">load_checkpoint();</tspan>
            <tspan x="30" Dy="1.5em" fill="#2196f3">restore_stack();</tspan>
            <tspan x="30" Dy="1.5em" fill="#2196f3">jump_to_saved_pc();</tspan>
            <tspan x="0" Dy="1.5em" fill="#4caf50">}</tspan>
        </text>

        <!-- Arrow Flow -->
        <path d="M50 270 L450 270" stroke="#000" stroke-dasharray="4"/>
        <path d="M450 270 L440 265 L450 270 L440 275" fill="#000"/>
    </g>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Crashed Process -->
    <rect x="100" y="100" width="150" height="150" fill="#ffe0e0" stroke="#dc3545"/>
    <text x="175" y="90" text-anchor="middle" font-size="16" fill="#dc3545">Crashed Process</text>
    <path d="M150 150 l30 -30 m0 30 l-30 -30" stroke="#dc3545" stroke-width="2"/>
    
    <!-- Checkpoint File -->
    <rect x="350" y="130" width="100" height="70" fill="#d4edda"/>
    <text x="400" y="120" text-anchor="middle" font-size="14">Checkpoint</text>
    <text x="400" y="160" text-anchor="middle" font-size="12">data.bin</text>
    
    <!-- Restored Process -->
    <rect x="100" y="250" width="150" height="150" fill="#e0ffe0" stroke="#28a745"/>
    <text x="175" y="240" text-anchor="middle" font-size="16" fill="#28a745">Restored Process</text>
    <path d="M150 300 l30 0 l-15 25 z" fill="#28a745"/>
    
    <!-- Arrows -->
    <path d="M250 175 Q300 160 350 165" stroke="#6c757d" fill="none" marker-end="url(#arrow)"/>
    <path d="M350 200 Q300 250 250 250" stroke="#6c757d" fill="none" marker-end="url(#arrow)"/>
    
    <!-- Code Example -->
    <rect x="200" y="50" width="300" height="60" fill="#e9ecef"/>
    <text x="210" y="70" font-family="monospace" font-size="12" fill="#212529">
        ProcessState restore() {
    </text>
    <text x="220" y="90" font-family="monospace" font-size="12" fill="#212529">
        return deserialize("data.bin");
    </text>
    
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
        </marker>
    </defs>
</svg>
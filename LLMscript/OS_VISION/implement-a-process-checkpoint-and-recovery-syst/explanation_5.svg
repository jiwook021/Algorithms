<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Timeline -->
    <line x1="50" y1="200" x2="550" y2="200" stroke="#6c757d" stroke-width="2"/>
    
    <!-- Checkpoints -->
    <circle cx="100" cy="200" r="8" fill="#28a745"/>
    <circle cx="250" cy="200" r="8" fill="#28a745"/>
    <circle cx="400" cy="200" r="8" fill="#dc3545"/>
    <circle cx="500" cy="200" r="8" fill="#28a745"/>
    
    <!-- Time Labels -->
    <text x="90" y="180" font-size="12">T-2</text>
    <text x="240" y="180" font-size="12">T-1</text>
    <text x="390" y="180" font-size="12">Crash</text>
    <text x="490" y="180" font-size="12">Recovery</text>
    
    <!-- Checkpoint Files -->
    <rect x="80" y="230" width="40" height="30" fill="#ffd8a8"/>
    <text x="100" y="270" text-anchor="middle" font-size="12">CP1</text>
    <rect x="230" y="230" width="40" height="30" fill="#ffd8a8"/>
    <text x="250" y="270" text-anchor="middle" font-size="12">CP2</text>
    <rect x="480" y="230" width="40" height="30" fill="#ffd8a8"/>
    <text x="500" y="270" text-anchor="middle" font-size="12">CP3</text>
    
    <!-- Recovery Arrow -->
    <path d="M500 230 Q520 180 400 150" stroke="#dc3545" fill="none" marker-end="url(#redarrow)"/>
    
    <!-- Code Example -->
    <rect x="150" y="50" width="300" height="60" fill="#e9ecef"/>
    <text x="160" y="70" font-family="monospace" font-size="12" fill="#212529">
        // Periodic checkpoint scheduling
    </text>
    <text x="160" y="90" font-family="monospace" font-size="12" fill="#212529">
        std::async(std::launch::async, checkpoint_worker);
    </text>
    
    <defs>
        <marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc3545"/>
        </marker>
    </defs>
</svg>
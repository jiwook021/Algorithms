<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="20" text-anchor="middle" fill="#333">Periodic Checkpointing</text>
    
    <!-- Timeline -->
    <path d="M50 200 L550 200" stroke="#666" stroke-width="2"/>
    
    <!-- Checkpoints -->
    <g transform="translate(100 200)">
        <circle cy="-20" r="8" fill="#FF5722"/>
        <text x="-20" y="-30" font-size="12">T=0</text>
        <text x="-30" y="20" font-size="12">Checkpoint 1</text>
    </g>
    
    <g transform="translate(300 200)">
        <circle cy="-20" r="8" fill="#FF5722"/>
        <text x="-20" y="-30" font-size="12">T=60</text>
        <text x="-30" y="20" font-size="12">Checkpoint 2</text>
    </g>
    
    <g transform="translate(500 200)">
        <circle cy="-20" r="8" fill="#FF5722"/>
        <text x="-20" y="-30" font-size="12">T=120</text>
        <text x="-30" y="20" font-size="12">Checkpoint 3</text>
    </g>
    
    <!-- Crashed Process -->
    <g transform="translate(400 100)">
        <circle cx="0" cy="0" r="30" fill="#FF5252"/>
        <text x="-25" y="5" fill="white">CRASH</text>
        <path d="M-20 -15 l10 10 M-10 -15 l10 10" stroke="white" stroke-width="2"/>
    </g>
    
    <!-- Recovery Arrow -->
    <path d="M400,100 L400,170 L300,170" stroke="#4CAF50" stroke-width="2" marker-end="url(#recoveryArrow)"/>
    <text x="350" y="160" text-anchor="middle" fill="#4CAF50">Recover to</text>
    <text x="350" y="175" text-anchor="middle" fill="#4CAF50">last checkpoint</text>
    
    <!-- Code Example -->
    <g transform="translate(50 250)">
        <rect width="240" height="100" fill="#263238" rx="5"/>
        <text x="10" y="20" font-family="monospace" font-size="12" fill="#C3E88D">// Timer callback</text>
        <text x="10" y="40" font-family="monospace" font-size="12" fill="#fff">void checkpoint_handler() {</text>
        <text x="20" y="60" font-family="monospace" font-size="12" fill="#89DDFF">  save_state();</text>
        <text x="20" y="80" font-family="monospace" font-size="12" fill="#89DDFF">  schedule_next(60s);</text>
        <text x="10" y="100" font-family="monospace" font-size="12" fill="#fff">}</text>
    </g>
    
    <defs>
        <marker id="recoveryArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/>
        </marker>
    </defs>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    
    <!-- Process Memory -->
    <rect x="50" y="100" width="200" height="200" fill="#cce5ff" stroke="#004499"/>
    <text x="150" y="80" text-anchor="middle" font-size="16">Process Memory</text>
    <path d="M70 120 l10 -10 10 10 -10 10z" fill="#004499"/>
    <text x="90" y="130" font-size="12">Stack</text>
    <path d="M70 180 l10 -10 10 10 -10 10z" fill="#004499"/>
    <text x="90" y="190" font-size="12">Heap</text>
    
    <!-- CPU Registers -->
    <rect x="350" y="150" width="200" height="80" fill="#d4edda" stroke="#155724"/>
    <text x="450" y="140" text-anchor="middle" font-size="16">CPU Registers</text>
    <text x="360" y="180" font-size="12">RAX: 0x7fae32</text>
    <text x="360" y="200" font-size="12">RIP: 0x4012d4</text>
    
    <!-- Checkpoint File -->
    <path d="M250 280 l20 -30 20 30 -40 0z" fill="#f8d7da" stroke="#721c24"/>
    <text x="270" y="330" text-anchor="middle" font-size="14">Checkpoint File</text>
    
    <!-- Arrows -->
    <path d="M250 200 Q300 180 350 190" stroke="#6c757d" fill="none" marker-end="url(#arrow)"/>
    <path d="M250 240 Q300 260 350 230" stroke="#6c757d" fill="none" marker-end="url(#arrow)"/>
    
    <!-- Code Example -->
    <rect x="50" y="320" width="500" height="60" fill="#e9ecef"/>
    <text x="60" y="340" font-family="monospace" font-size="12" fill="#212529">
        void save_checkpoint() {
    </text>
    <text x="70" y="360" font-family="monospace" font-size="12" fill="#212529">
        serialize(memory, registers);
    </text>
    
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d"/>
        </marker>
    </defs>
</svg>
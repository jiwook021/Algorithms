<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="18" text-anchor="middle" fill="#333">3. Edge Detection</text>
    
    <!-- Thermal image with edges -->
    <rect x="100" y="100" width="400" height="200" fill="#404040"/>
    
    <!-- Edge lines -->
    <path d="M120,120 L480,180" stroke="#00ff00" stroke-width="2"/>
    <path d="M200,200 L400,240" stroke="#00ff00" stroke-width="2"/>
    <path d="M300,140 L320,280" stroke="#00ff00" stroke-width="2"/>
    
    <!-- Code example -->
    <g transform="translate(100 320)">
        <rect x="0" y="0" width="400" height="60" fill="#e0e0e0" rx="5"/>
        <text x="10" y="20" font-family="monospace" font-size="12" fill="#333">
            <tspan x="10" y="20">cv::Canny(blurredImage, edges,</tspan>
            <tspan x="10" y="35">threshold1, threshold2, 3);</tspan>
        </text>
    </g>
</svg>
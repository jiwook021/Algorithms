<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="18" text-anchor="middle" fill="#333">4. Threshold Segmentation</text>
    
    <!-- Histogram visualization -->
    <path d="M100 300 L100 150 L500 150 L500 300" fill="none" stroke="#666"/>
    <rect x="110" y="250" width="30" height="50" fill="#666"/>
    <rect x="160" y="200" width="30" height="100" fill="#666"/>
    <rect x="210" y="180" width="30" height="120" fill="#ff0000"/>
    <line x1="100" y1="200" x2="500" y2="200" stroke="#00f" stroke-dasharray="4"/>
    
    <!-- Thresholded image -->
    <rect x="200" y="50" width="200" height="100" fill="#000"/>
    <rect x="250" y="60" width="100" height="80" fill="#fff"/>
    
    <!-- Code example -->
    <g transform="translate(150 340)">
        <rect x="0" y="0" width="300" height="40" fill="#e0e0e0" rx="5"/>
        <text x="10" y="25" font-family="monospace" font-size="12" fill="#333">
            cv::threshold(edges, binary, 127, 255, THRESH_BINARY);
        </text>
    </g>
</svg>
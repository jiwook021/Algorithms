<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Preprocessing Steps -->
    <rect width="600" height="400" fill="#1a1a1a"/>
    
    <!-- Raw Thermal Input -->
    <rect x="50" y="80" width="200" height="240" fill="#333" rx="10"/>
    <circle cx="150" cy="200" r="40" fill="#ff4444"/>
    <text x="100" y="60" fill="white" font-size="14">Raw Input</text>
    
    <!-- Processing Steps -->
    <path d="M300 200 l50 -30 v60 z" fill="#44ff44"/>
    <text x="320" y="220" fill="white" font-size="14">Gaussian Blur</text>
    
    <!-- Processed Output -->
    <rect x="350" y="80" width="200" height="240" fill="#333" rx="10"/>
    <circle cx="450" cy="200" r="40" fill="#ff8888" filter="url(#blurFilter)"/>
    <text x="420" y="60" fill="white" font-size="14">Processed</text>
    
    <defs>
        <filter id="blurFilter">
            <feGaussianBlur stdDeviation="5"/>
        </filter>
    </defs>
    
    <!-- Code Example -->
    <g transform="translate(50 300)">
        <rect width="300" height="70" fill="#002b36" rx="5"/>
        <text x="15" y="30" fill="#839496" font-family="monospace" font-size="12">
            <tspan x="10" y="20">// Apply Gaussian blur</tspan>
            <tspan x="10" y="35">cv::GaussianBlur(input, output,</tspan>
            <tspan x="10" y="50">Size(5,5), 0);</tspan>
        </text>
    </g>
    <text x="100" y="370" fill="white" font-size="14">2. Noise Reduction</text>
</svg>
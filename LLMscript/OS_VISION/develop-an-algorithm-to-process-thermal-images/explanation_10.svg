<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Edge Detection in Thermal Imaging -->
    <rect x="0" y="0" width="600" height="400" fill="#1a1a1a"/>
    
    <text x="300" y="30" fill="white" font-size="20" text-anchor="middle">Thermal Edge Detection</text>
    
    <!-- Processed Image -->
    <g transform="translate(50, 60)">
        <rect x="0" y="0" width="200" height="200" fill="url(#smoothGradient)"/>
        <text x="100" y="220" fill="white" text-anchor="middle">Preprocessed Image</text>
    </g>
    
    <!-- Edge Detection Visualization -->
    <g transform="translate(350, 60)">
        <rect x="0" y="0" width="200" height="200" fill="url(#edgeGradient)"/>
        <path d="M20 40 L180 40 L160 160 L40 180 Z" fill="none" stroke="#ff0000" stroke-width="2"/>
        <text x="100" y="220" fill="white" text-anchor="middle">Detected Edges</text>
    </g>
    
    <!-- Processing Arrow -->
    <path d="M300 150 L350 150 L340 140 M350 150 L340 160" fill="none" stroke="#00ff00" stroke-width="2"/>
    
    <!-- Code Example -->
    <g transform="translate(50, 300)">
        <rect x="0" y="0" width="500" height="80" fill="#002b36" rx="5"/>
        <text x="10" y="20" fill="#839496" font-family="monospace" font-size="14">void detectEdges(Mat&amp; img) {</text>
        <text x="20" y="40" fill="#839496" font-family="monospace" font-size="14">Sobel(img, edges, CV_32F, 1, 1);</text>
        <text x="20" y="60" fill="#839496" font-family="monospace" font-size="14">convertScaleAbs(edges, edges);</text>
        <text x="10" y="80" fill="#839496" font-family="monospace" font-size="14">}</text>
    </g>
    
    <!-- Gradients -->
    <defs>
        <linearGradient id="smoothGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0000aa"/>
            <stop offset="50%" stop-color="#aa0000"/>
            <stop offset="100%" stop-color="#aaaa00"/>
        </linearGradient>
        <linearGradient id="edgeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#000000"/>
            <stop offset="100%" stop-color="#222222"/>
        </linearGradient>
    </defs>
</svg>
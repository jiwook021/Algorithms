<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Thermal Image Acquisition -->
    <rect width="600" height="400" fill="#1a1a1a"/>
    <rect x="50" y="50" width="200" height="300" fill="#333" rx="10"/>
    <path d="M300 200 l50 -30 v60 z" fill="#ff4444"/>
    <text x="320" y="220" fill="white" font-size="14">Thermal Camera</text>
    
    <!-- Thermal Output Visualization -->
    <rect x="350" y="50" width="200" height="300" fill="url(#thermalGradient)" rx="10"/>
    <defs>
        <linearGradient id="thermalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="black"/>
            <stop offset="40%" stop-color="#cc0000"/>
            <stop offset="70%" stop-color="#ff6666"/>
            <stop offset="100%" stop-color="#ffff00"/>
        </linearGradient>
    </defs>
    
    <!-- Code Example -->
    <g transform="translate(50 280)">
        <rect width="250" height="80" fill="#002b36" rx="5"/>
        <text x="15" y="30" fill="#839496" font-family="monospace" font-size="12">
            <tspan x="10" y="20">// C++ capture example</tspan>
            <tspan x="10" y="35">cv::Mat frame;</tspan>
            <tspan x="10" y="50">thermalCamera.read(frame);</tspan>
        </text>
    </g>
    <text x="100" y="370" fill="white" font-size="14">1. Image Acquisition</text>
</svg>
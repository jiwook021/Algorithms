<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="18" text-anchor="middle" fill="#333">5. Bounding Box Detection</text>
    
    <!-- Thermal image with bounding boxes -->
    <rect x="100" y="100" width="400" height="200" fill="#606060"/>
    
    <!-- Bounding boxes -->
    <rect x="150" y="120" width="120" height="160" fill="none" stroke="#0000ff" stroke-width="3"/>
    <rect x="300" y="150" width="180" height="140" fill="none" stroke="#0000ff" stroke-width="3"/>
    
    <!-- Code example -->
    <g transform="translate(100 320)">
        <rect x="0" y="0" width="400" height="60" fill="#e0e0e0" rx="5"/>

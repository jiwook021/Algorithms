<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="18" text-anchor="middle" fill="#333">1. Thermal Image Input</text>
    
    <!-- Thermal gradient visualization -->
    <rect x="100" y="100" width="400" height="200" fill="url(#thermalGradient)"/>
    <text x="300" y="90" text-anchor="middle" fill="#666">Raw Thermal Image</text>
    
    <!-- Gradient definition -->
    <defs>
        <linearGradient id="thermalGradient">
            <stop offset="0%" stop-color="#000000"/>
            <stop offset="50%" stop-color="#800000"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>
    </defs>
    
    <!-- Code example -->
    <g transform="translate(50 320)">
        <rect x="0" y="0" width="500" height="60" fill="#e0e0e0" rx="5"/>
        <text x="10" y="20" font-family="monospace" font-size="12" fill="#333">
            <tspan x="10" y="20">cv::Mat thermalImage = imread("input.png",</tspan>
            <tspan x="10" y="35">CV_16UC1); // 16-bit grayscale</tspan>
        </text>
    </g>
</svg>
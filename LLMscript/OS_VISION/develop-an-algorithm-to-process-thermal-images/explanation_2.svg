<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <text x="300" y="30" font-size="18" text-anchor="middle" fill="#333">2. Noise Reduction</text>
    
    <!-- Before/after noise reduction -->
    <g transform="translate(50 100)">
        <rect x="0" y="0" width="200" height="200" fill="#808080"/>
        <text x="100" y="220" text-anchor="middle" fill="#666">Noisy Input</text>
        <circle cx="180" cy="180" r="5" fill="red"/>
        <circle cx="50" cy="120" r="7" fill="red"/>
    </g>
    
    <g transform="translate(350 100)">
        <rect x="0" y="0" width="200" height="200" fill="#a0a0a0"/>
        <text x="100" y="220" text-anchor="middle" fill="#666">Smoothed Output</text>
    </g>
    
    <!-- Code example -->
    <g transform="translate(150 320)">
        <rect x="0" y="0" width="300" height="40" fill="#e0e0e0" rx="5"/>
        <text x="10" y="25" font-family="monospace" font-size="12" fill="#333">
            cv::GaussianBlur(input, output, Size(5,5), 1.5);
        </text>
    </g>
</svg>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Threshold Detection -->
    <rect width="600" height="400" fill="#1a1a1a"/>
    
    <!-- Thermal Image with Threshold -->
    <rect x="50" y="50" width="300" height="300" fill="#333" rx="10"/>
    <rect x="50" y="50" width="300" height="150" fill="url(#thresholdGradient)"/>
    
    <!-- Threshold Line -->
    <line x1="50" y1="200" x2="350" y2="200" stroke="#00ffff" stroke-width="2"/>
    <text x="360" y="200" fill="#00ffff" font-size="12">Threshold: 45°C</text>
    
    <!-- Detected Object -->
    <rect x="150" y="100" width="100" height="80" fill="none" stroke="#00ff00" stroke-width="2"/>
    <text x="160" y="90" fill="#00ff00" font-size="12">Detected Object</text>
    
    <defs>
        <linearGradient id="thresholdGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="50%" stop-color="#4d0000"/>
            <stop offset="50%" stop-color="#990000"/>
        </linearGradient>
    </defs>
    
    <!-- Code Example -->
    <g transform="translate(370 100)">
        <rect width="200" height="120" fill="#002b36" rx="5"/>
        <text x="15" y="30" fill="#839496" font-family="monospace" font-size="12">
            <tspan x="10" y="20">// Thresholding</tspan>
            <tspan x="10" y="35">cv::threshold(thermalMat,</tspan>
            <tspan x="10" y="50">binaryMat, 45, 255,</tspan>
            <tspan x="10" y="65">THRESH_BINARY);</tspan>
        </text>
    </g>
    <text x="100" y="370" fill="white" font-size="14">3. Threshold Segmentation</text>
</svg>
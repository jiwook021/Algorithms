<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">6. Console I/O Operations</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="18" fill="black">Console Input/Output Operations</text>
  <rect x="70" y="140" width="1060" height="520" fill="#e0e0e0" stroke="black"/>
  <text x="90" y="180" font-size="16" fill="black">- readKey: Reads SSN from console</text>
  <text x="90" y="220" font-size="16" fill="black">- writeLegibly: Outputs data to console</text>
  <text x="90" y="260" font-size="16" fill="black">- readFromConsole: Reads data from console</text>

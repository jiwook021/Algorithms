<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">4. File Operations</text>
  <rect x="50" y="100" width="1100" height="600" fill="white" stroke="black" stroke-width="2"/>
  <text x="70" y="140" font-size="20" fill="black">File Operations:</text>
  <text x="70" y="180" font-size="16" fill="black">1. Open file in read/write/append mode.</text>
  <text x="70" y="220" font-size="16" fill="black">2. Seek to the end for appending records.</text>
  <text x="70" y="260" font-size="16" fill="black">3. Read/Write records using overloaded operators.</text>
  <text x="70" y="300" font-size="16" fill="black">4. Close file after operations.</text>
</svg>
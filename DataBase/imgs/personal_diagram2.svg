<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f0f0f0"/>
  <text x="50" y="50" font-size="24" fill="black">2. Key Algorithms / Processes</text>
  <rect x="50" y="80" width="1100" height="600" fill="white" stroke="black"/>
  <text x="70" y="120" font-size="18" fill="black">Data Handling Processes</text>
  <rect x="70" y="140" width="1060" height="520" fill="#e0e0e0" stroke="black"/>
  <text x="90" y="180" font-size="16" fill="black">- Memory Allocation: Allocates memory for name and city</text>
  <text x="90" y="220" font-size="16" fill="black">- Data Copying: Copies SSN, name, city, year, salary</text>
  <text x="90" y="260" font-size="16" fill="black">- File I/O: Reads/Writes data to/from file</text>
  <text x="90" y="300" font-size="16" fill="black">- Console I/O: Reads/Writes data to/from console</text>
</svg>